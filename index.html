、加速・減速中の移動を入れていない。","回転速度を毎分のまま使い60で割り忘れた値（1500×5×0.4）。"],"","","q:figmech_45",["x:figmech_45","速度パターンの面積から移動距離を求める"]],["図のマイクロスイッチを使った入力回路で、スイッチを押して接点が閉じたとき、5.1［kΩ］の抵抗に流れる電流はおよそいくらか？（スイッチの抵抗は無視する）","0.98［mA］","0［mA］","9.8［mA］","25.5［mA］","スイッチを押すと出力側がグランド（0［V］）につながり、抵抗の両端に5［V］がかかる。オームの法則よりI＝5／5100≒0.00098［A］＝0.98［mA］。このとき出力は0［V］（論理0）になる。","","",["スイッチを押しても電流は流れないと考えた誤り。電流が流れないのはスイッチを離しているとき。","5.1［kΩ］を510［Ω］と桁を1つ誤って計算した値（5／510）。kΩは1000Ωである。","電圧と抵抗を掛けた値（5×5.1）。オームの法則は電流＝電圧÷抵抗である。"],"","","q:figmech_46"],["図は三相誘導モータの始動方法を示している。始動時はモータコイルをスター結線にし、回り始めたらデルタ結線に切り替える。始動時にスター結線にする主な目的は何か？","始動時に過大な電流が流れるのを防ぐため","始動トルクを大きくするため","モータの回転方向を逆にするため","モータの最高回転速度を上げるため","誘導モータは始動時に大きな電流が流れる。スターデルタ始動では、始動時にスター結線にして各コイルにかかる電圧を下げ電流を少なくし、回り始めてからデルタ結線に切り替えて本来の運転を行う。","","",["スター結線では各コイルの電圧が下がるため、始動トルクはむしろ小さくなる。","回転方向を逆にするには、3本の電源線のうち2本を入れ替える。","同期速度は電源周波数と極数で決まり、結線の切替えでは上がらない。"],"","","q:figmech_47",["x:figmech_47","Y結線とΔ結線のコイル電圧の比較"]],["図のダイオードと抵抗を使った回路で、入力Aに論理1（5［V］）、入力Bに論理0（0［V］）を加えた。出力Xの論理と、この回路の名称の組み合わせとして正しいものはどれか？","X＝0、AND回路","X＝1、OR回路","X＝1、AND回路","X＝0、NOR回路","入力Bが0［V］だと、抵抗からBへダイオードに電流が流れ、出力Xは0［V］付近に引き下げられる。AとBがともに1のときだけどのダイオードにも電流が流れずXが5［V］（論理1）になるので、この回路はAND回路である。","","",["OR回路は入力のどちらかが1なら出力1となる回路。図の回路は1つでも0があると出力が0になる。","AND回路では入力が1つでも0なら出力は0になる。出力を1とした点が誤り。","NOR回路はORの出力を反転した回路で、図のようにダイオードと抵抗だけのAND構成とは異なる。"],"","","q:figmech_48",["x:figmech_48","ダイオードAND回路の真理値表"]],["ばねと質量からなる機械系の固有振動数は、ω＝2πf＝√(k／m)で表される。質量mは変えずにばね定数kを4倍にすると、固有振動数fは何倍になるか？","2倍","4倍","1／2倍","16倍","固有振動数はf＝(1／2π)√(k／m)で、√(k／m)に比例する。質量mを変えずにkを4倍にすると、fは√4＝2倍となる。逆に質量を2倍にすると1／√2倍になる。ばねの剛性を高めると固有振動数は高くなり、共振を避ける設計に使われる。","","",["ルートを考えず、固有振動数fがばね定数kに1乗で比例すると考えた誤り。","kとmの位置を取り違え、fが√(m／k)に比例するとして計算した値。ばねが硬いほど振動は速くなる。","ルートをとる代わりに2乗してしまった値（4²＝16）。fは√kに比例する。"],"","",""],["慣性モーメントJ＝0.02［kg・m²］の負荷を、停止状態から0.5［s］で1500［min⁻¹］まで加速したい。必要な加速トルクTはおよそいくらか？（T＝J×2πN／(60t)）","6.28［N・m］","377［N・m］","1.0［N・m］","1.57［N・m］","回転速度［min⁻¹］を角速度［rad/s］に直すと2πN／60＝2π×1500／60≒157［rad/s］。これを加速時間tで割ると角加速度になり、T＝J×2πN／(60t)＝0.02×157／0.5≒6.28［N・m］。","","",["60で割り忘れた値。Nは毎分の回転数なので、毎秒に直すために60で割る必要がある。","2πを掛け忘れた値。回転数を角速度［rad/s］に直すには2πを掛ける。","加速時間tで割らずに掛けてしまった値。加速時間が短いほど大きなトルクが必要になる。"],"","",""]]},{"id":"figelec","title":"図・計算問題（電気電子）","cat":"図・計算","q":[["図の直列回路で，R1=10［Ω］，R2=20［Ω］，R3=30［Ω］，V=12［V］のとき，R2の両端の電圧V2は？","4［V］","2［V］","6［V］","0.2［V］","直列回路の合成抵抗はR=R1+R2+R3=10+20+30=60［Ω］。電流はI=V/R=12/60=0.2［A］で，どの抵抗にも同じ電流が流れる。よってV2=R2×I=20×0.2=4［V］。電圧は抵抗値の比で分かれる（分圧）。","","",["R1の両端の電圧V1=10×0.2=2［V］を求めてしまった値。","R3の両端の電圧V3=30×0.2=6［V］を求めてしまった値。","回路に流れる電流I=12/60=0.2［A］を，電圧と取り違えて答えた値。"],"","","q:figelec_1",["x:figelec_1","直列回路の電流と各抵抗の分圧"]],["図の並列回路で，R1=4［Ω］，R2=6［Ω］，R3=12［Ω］のとき，合成抵抗Rは？","2［Ω］","22［Ω］","0.5［Ω］","約7.3［Ω］","並列接続の合成抵抗は1/R=1/R1+1/R2+1/R3で求める。1/R=1/4+1/6+1/12=3/12+2/12+1/12=6/12=0.5。よってR=1/0.5=2［Ω］。並列の合成抵抗は最も小さい抵抗（4Ω）より小さくなる。","","",["4+6+12=22［Ω］で，直列接続の式を使った誤り。","1/R=0.5で計算を止め，最後に逆数をとるのを忘れた値。","3つの抵抗の平均値22/3を求めた誤り。合成抵抗は平均ではない。"],"","","q:figelec_2",["x:figelec_2","並列回路の各枝電流から合成抵抗を求める"]],["図の回路で，R1=5［Ω］，R2=10［Ω］，R3=10［Ω］，V=20［V］のとき，R1に流れる電流I1は？","2［A］","0.8［A］","4［A］","1［A］","R2とR3の並列部分は10×10/(10+10)=5［Ω］。これにR1=5［Ω］が直列なので合成抵抗は5+5=10［Ω］。回路全体の電流はI1=V/R=20/10=2［A］となる。","","",["3つの抵抗をすべて直列（5+10+10=25Ω）とみなし20/25とした誤り。","R1を無視して並列部分5［Ω］だけで20/5とした誤り。","R2（またはR3）1本に流れる電流で，I2=I1/2=1［A］となる値。"],"","","q:figelec_3",["x:figelec_3","並列部分を合成してから全電流を求める手順"]],["図のブリッジ回路で，R1=100［Ω］，R2=200［Ω］，R3=150［Ω］のとき，検流計に電流が流れない（平衡する）R4の値は？","300［Ω］","75［Ω］","約133［Ω］","250［Ω］","ブリッジの平衡条件は向かい合う抵抗の積が等しいこと，すなわちR1R4=R2R3。よってR4=R2R3/R1=200×150/100=300［Ω］。このときA点とB点の電位が等しくなり，検流計の電流は0となる。","","",["R1R3/R2=100×150/200で，掛け合わせる抵抗の組合せを誤った値。","R1R2/R3=100×200/150で，平衡条件の組合せを誤った値。","積ではなく和でR1+R4=R2+R3として計算した誤り。平衡条件は積。"],"","","q:figelec_4",["x:figelec_4","ブリッジの平衡条件（向かい合う抵抗の積が等しい）"]],["図のようにC1=3［μF］，C2=6［μF］，C3=6［μF］のコンデンサを直列接続したときの合成静電容量Cは？","1.5［μF］","15［μF］","約0.67［μF］","5［μF］","コンデンサの直列接続は1/C=1/C1+1/C2+1/C3で求める（抵抗の並列と同じ形）。1/C=1/3+1/6+1/6=2/3。よってC=3/2=1.5［μF］。直列にすると合成容量は最小のものより小さくなる。","","",["3+6+6=15［μF］で，コンデンサの並列接続の式を使った誤り。","1/C=2/3で計算を止め，最後に逆数をとるのを忘れた値。","3つの容量の平均値15/3を求めた誤り。合成容量は平均ではない。"],"","","q:figelec_5",["x:figelec_5","コンデンサ直列接続の合成容量の計算"]],["図のRLC直列回路で，L=10［mH］，C=1［μF］のとき，共振周波数f0はおよそいくらか？","約1.59［kHz］","約10［kHz］","約3.18［kHz］","約62.8［kHz］","直列共振はωL=1/(ωC)のときに起こり，f0=1/(2π√(LC))。LC=10×10^-3×1×10^-6=10^-8なので√(LC)=10^-4。f0=1/(2π×10^-4)≒1592［Hz］≒1.59［kHz］。共振時のインピーダンスはRだけになる。","","",["1/√(LC)=10^4で，角周波数ω0［rad/s］を周波数として答えた誤り。","1/(π√(LC))として，公式の分母の2を落としてしまった誤り。","2π/√(LC)として，2πを分母でなく分子に掛けてしまった誤り。"],"","","q:figelec_6",["x:figelec_6","XLとXCが等しくなる直列共振周波数"]],["図のY結線の三相交流で，線間電圧Vabが200［V］のとき，相電圧Eaの大きさはおよそいくらか？","約115［V］","約346［V］","約66.7［V］","200［V］","Y結線では線間電圧=相電圧×√3で，線間電圧の位相は相電圧より30°進む。よって相電圧=線間電圧/√3=200/1.732≒115［V］。なおY結線では線電流と相電流は等しい。","","",["200×√3で，√3で割るべきところを掛けてしまった誤り。","200/3で，√3ではなく3で割ってしまった誤り。","線間電圧と相電圧を同じとした誤り。これはΔ結線での関係。"],"","","q:figelec_7",["x:figelec_7","Y結線の相電圧と線間電圧のフェーザ図"]],["図のCR直列回路で，R=10［kΩ］，C=100［μF］のとき，時定数τは？","1［s］","1000［s］","1［ms］","約0.63［s］","CR回路の時定数はτ=CRで求める。τ=100×10^-6×10×10^3=1［s］。時定数はコンデンサ電圧が最終値の約63.2%に達するまでの時間で，τが大きいほど定常状態になるまで時間がかかる。","","",["μ（10^-6）をm（10^-3）と取り違えて100×10^-3×10^4とした誤り。","k（10^3）を付け忘れ，10×100×10^-6とした誤り。","時定数で到達する割合63.2%と時定数そのものを混同した値。"],"","","q:figelec_8",["x:figelec_8","CR回路の充電曲線と時定数τ（63.2%）"]],["図のLED駆動回路で，V=12［V］，VF=2［V］，IF=10［mA］のとき，電流制限抵抗Rの値は？","1［kΩ］","1.2［kΩ］","1.4［kΩ］","200［Ω］","抵抗Rにかかる電圧は電源電圧からLEDの順方向電圧を引いたV−VF=12−2=10［V］。よってR=(V−VF)/IF=10/(10×10^-3)=1000［Ω］=1［kΩ］。","","",["LEDのVFを引かずに，電源電圧だけで12/0.01とした誤り。","VFを引かずに足してしまい，(12+2)/0.01とした誤り。","LEDの電圧VFをIFで割った値で，LEDの等価抵抗を求めてしまった誤り。"],"","","q:figelec_9",["x:figelec_9","LED回路の電圧配分と電流制限抵抗の計算"]],["図の反転増幅回路で，R1=2［kΩ］，R2=10［kΩ］，入力電圧Vi=0.5［V］のとき，出力電圧Voは？","−2.5［V］","2.5［V］","3.0［V］","−0.1［V］","反転増幅回路の出力はVo=−(R2/R1)Viで，入力と逆極性になる。Vo=−(10/2)×0.5=−5×0.5=−2.5［V］。増幅率は2本の抵抗の比だけで決まる。","","",["大きさは正しいが，反転増幅の符号（マイナス）を付け忘れた値。","非反転増幅回路の式Vo=(1+R2/R1)Viを使った誤り。","抵抗比をR1/R2と逆にして−(2/10)×0.5とした誤り。"],"","","q:figelec_10",["x:figelec_10","仮想短絡で考える反転増幅回路の出力計算"]],["100［V］で500［W］を消費する電熱器の抵抗値は？","20［Ω］","5［Ω］","0.2［Ω］","0.05［Ω］","電力はP=VI=V²/Rで表される。これを変形するとR=V²/P=100²/500=10000/500=20［Ω］。なお電流はI=P/V=5［A］で，R=V/I=100/5=20［Ω］としても同じ。","","",["P/V=500/100で，これは抵抗ではなく電流5［A］の値。","V/P=100/500で，式の分子と分母を取り違えてしまった誤り。","P/V²=500/10000で，R=V²/Pの逆数を求めた誤り。"],"","",""],["最大値141［V］の正弦波交流電圧の実効値はおよそいくらか？","約100［V］","約200［V］","約90［V］","約70.5［V］","正弦波の実効値は最大値（ピーク値）の1/√2倍。141/√2=141/1.414≒100［V］。家庭用コンセントの100［V］は実効値で，最大値は約141［V］である。","","",["141×√2で，√2で割るべきところを掛けてしまった誤り。","141×2/π≒90で，これは実効値ではなく正弦波の平均値。","141/2で，ピーク値（最大値）を単純に半分にした誤り。"],"","",""],["静電容量10［μF］のコンデンサに周波数50［Hz］の交流を加えたとき，容量性リアクタンスXCはおよそいくらか？","約318［Ω］","約0.0031［Ω］","2000［Ω］","約0.32［Ω］","容量性リアクタンスはXC=1/(ωC)=1/(2πfC)。XC=1/(2×3.14×50×10×10^-6)=1/0.00314≒318［Ω］。周波数が高いほどXCは小さくなる。","","",["ωC=2πfCを計算したまま，逆数をとるのを忘れた値。","1/(fC)として，分母の2πを掛け忘れてしまった誤り。","μ（10^-6）をm（10^-3）として10［mF］で計算した誤り。"],"","",""],["非反転増幅回路で，R1=1［kΩ］，R2=4［kΩ］，入力電圧Vi=0.3［V］のとき，出力電圧Voは？","1.5［V］","1.2［V］","−1.2［V］","0.375［V］","非反転増幅回路の出力はVo=(1+R2/R1)Viで，入力と同じ極性になる。Vo=(1+4/1)×0.3=5×0.3=1.5［V］。増幅率は必ず1倍以上になる。","","",["(R2/R1)Vi=4×0.3で，式の「1+」を付け忘れた誤り。","反転増幅回路の式Vo=−(R2/R1)Viを使ってしまった誤り。","抵抗比をR1/R2と逆にし(1+1/4)×0.3とした誤り。"],"","","",["x:figelec_14","非反転増幅回路の回路図と出力電圧の計算"]],["図の4本帯の抵抗器で，色帯が左から黄・紫・橙・金のとき，抵抗値は？（黒0，茶1，赤2，橙3，黄4，緑5，青6，紫7）","47［kΩ］","4.7［kΩ］","473［Ω］","470［kΩ］","4本帯では第1・第2色帯が有効数字，第3色帯が乗数，第4色帯が許容差を表す。黄=4，紫=7で有効数字は47，橙=3で乗数は10^3。よって47×10^3=47000［Ω］=47［kΩ］。金の第4色帯は許容差±5［%］を表す。","","",["乗数を10^2として47×100=4700［Ω］とした誤り。第3色帯の数字そのものが10の指数になる。","第3色帯も有効数字とみなし，4・7・3を並べてしまった誤り。","乗数を10^4として47×10^4とした誤り。橙は3なので10^3が正しい。"],"","","q:figelec_15",["x:figelec_15","色帯の読み方（黄・紫・橙・金で47kΩ）"]],["図は，コンデンサだけの回路に正弦波電圧v(t)を加えたときの電圧と電流iC(t)の波形である。電流iC(t)の位相は電圧v(t)に対してどうなっているか？","90°（π/2［rad］）進んでいる","90°（π/2［rad］）遅れている","同相である","180°（π［rad］）ずれている","コンデンサに流れる電流はiC=C・dv/dtで，電圧の変化が最も大きいとき（v=0の瞬間）に電流が最大になる。v=Vm sinωtならiC=ωCVm sin(ωt+π/2)となり，図でもiCがvより1/4周期早く最大になっている。よって電流は電圧より90°進む。","","",["コイルだけの回路の場合で，コイルの電流は電圧より90°遅れる。","抵抗だけの回路の場合で，電圧と電流は同じタイミングで最大になる。","電圧と電流が逆相の関係で，図の波形の1/4周期のずれとは合わない。"],"","","q:figelec_16",["x:figelec_16","コンデンサの電流が電圧より90°進む波形"]],["図のように，4つのダイオードを組み合わせて交流を直流に変換する整流回路の名称は？","ブリッジ整流回路","半波整流回路","センタータップ型全波整流回路","平滑回路","4つのダイオードをブリッジ状に配置した整流回路をブリッジ整流回路という。入力の正負どちらの半周期でも2つのダイオードが導通し，負荷には常に同じ向きの電流が流れるので全波整流となる。正負に関係なく正の絶対値が得られるため絶対値回路とも呼ばれる。","","",["ダイオード1つで正の半周期だけを取り出す回路で，負の半周期は出力されない。","変圧器の中間タップとダイオード2つで全波整流する回路で，両波整流回路とも呼ばれる。","図の破線で囲んだコンデンサの部分の働きで，脈流を滑らかにする回路を指す。"],"","","q:figelec_17",["x:figelec_17","教科書のブリッジ整流回路の正負半周期の電流経路"]],["図は，アノード（A），カソード（K），ゲート（G）の3端子をもち，PNPNの4層構造をもつ半導体素子の回路図記号と構造である。この素子の名称は？","サイリスタ","ツェナーダイオード","バイポーラトランジスタ","発光ダイオード","PNPNの4層構造でアノード・カソード・ゲートの3端子をもつ素子はサイリスタ（SCR）である。ゲートにパルス状のトリガー信号を加えるとアノード－カソード間が導通し，逆バイアスになるまで導通が維持される。交流の位相制御などに使われる。","","",["PN接合1つの2端子素子で，逆方向の降伏電圧を利用して一定電圧を得るのに使う。","NPNまたはPNPの3層構造で，端子はベース・コレクタ・エミッタである。","PN接合1つの2端子素子で，順方向電流を流すと発光する。ゲート端子はない。"],"","","q:figelec_18",["x:figelec_18","教科書のサイリスタによる位相制御の動作"]],["図のトランジスタを用いたLED駆動回路で，VCC=12［V］，LEDの順方向電圧VF=2［V］，トランジスタがONのときのVCE=0.2［V］，IC=10［mA］とするとき，抵抗R2の値は？","980［Ω］","1000［Ω］","1200［Ω］","1020［Ω］","R2にかかる電圧は，電源電圧からLEDの順方向電圧とトランジスタのVCEを差し引いた分である。R2=(VCC−VF−VCE)/IC=(12−2−0.2)/(10×10^-3)=9.8/0.01=980［Ω］となる。","","",["トランジスタのVCE=0.2［V］を引き忘れ，(12−2)/0.01とした値。","VFとVCEの両方を引き忘れ，電源電圧だけで12/0.01とした値。","VCEを引かずに足してしまい，(12−2+0.2)/0.01とした値。"],"","","q:figelec_19",["x:figelec_19","電源電圧の配分（VF・R2の電圧・VCE）"]],["図のツェナーダイオードを用いた定電圧回路で，V=15［V］，VZ=6［V］，R=150［Ω］，RL=300［Ω］のとき，ツェナーダイオードに流れる電流IZは？","40［mA］","60［mA］","20［mA］","100［mA］","負荷の電圧はVZ=6［V］に保たれる。Rに流れる電流はI=(V−VZ)/R=(15−6)/150=0.06［A］=60［mA］。負荷電流はIL=VZ/RL=6/300=0.02［A］=20［mA］。I=IZ+ILより，IZ=60−20=40［mA］となる。","","",["Rに流れる全電流Iで，そこから負荷電流ILを差し引くのを忘れた値。","負荷RLに流れる電流IL=6/300で，ツェナー電流と取り違えた値。","Rにかかる電圧からVZを引かずに，V/R=15/150としてしまった誤り。"],"","","q:figelec_20",["x:figelec_20","ツェナー定電圧回路の電流の分かれ方"]],["図のポテンショメータで，出力電圧eoは回転角度θに比例する（eo=Kθ）。全回転角300°で出力が電源電圧E=10［V］になるとき，θ=120°での出力電圧eoは？","4［V］","6［V］","約3.3［V］","25［V］","比例定数はK=E/全回転角=10/300［V/°］。よってeo=Kθ=(10/300)×120=4［V］となる。ポテンショメータは回転角度に比例した電圧を出す角度検出器であり，伝達関数は比例要素Kとなる。","","",["残りの回転角180°分の電圧（10−4）を求めてしまった値。","全回転角を300°ではなく360°として10×120/360とした誤り。","比を逆にして10×300/120としてしまった誤り。電源電圧を超えることはない。"],"","","q:figelec_21",["x:figelec_21","ポテンショメータの回転角と出力電圧の比例関係"]],["図の差動増幅回路で，R1=R2=10［kΩ］，R3=R4=50［kΩ］，V1=1.0［V］，V2=1.4［V］のとき，出力電圧Voは？","2.0［V］","−2.0［V］","0.4［V］","12［V］","R1=R2，R3=R4のとき，差動増幅回路の出力はVo=(R3/R1)(V2−V1)となる。R3/R1=50/10=5，V2−V1=1.4−1.0=0.4［V］なので，Vo=5×0.4=2.0［V］。2つの入力の差だけを増幅し，共通の成分（同相電圧）は除かれる。","","",["V1−V2として差の向きを逆にした誤り。出力はV2−V1に比例する。","入力電圧の差0.4［V］だけを求め，増幅率R3/R1=5を掛け忘れた値。","差ではなく和(1.0+1.4)に5を掛けた誤り。差動増幅回路は差を増幅する。"],"","","q:figelec_22",["w:174_3","オペアンプ1個による差動増幅回路",{"a":"Retired electrician","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Current_feedback_op_amp_differential_line_receiver_single.png"}]],["図のウィーンブリッジ発振回路で，R1=R2，C1=C2とする。発振を続けるには非反転増幅回路の増幅度A=1+Rb/Raが3である必要がある。Ra=10［kΩ］のとき，Rbは？","20［kΩ］","30［kΩ］","5［kΩ］","10［kΩ］","R1=R2，C1=C2のとき発振条件はA=1+Rb/Ra=3となる。よってRb/Ra=2，Rb=2×10=20［kΩ］。このとき発振周波数はf0=1/(2πCR)で，CR素子の値で決まる。","","",["Rb/Ra=3としてしまい，増幅度の式A=1+Rb/Raの1+を忘れた値。","Ra/Rb=2と比を逆にとり，Rb=Ra/2とした誤り。増幅度は1.5となり発振しない。","Ra=Rbとした値で，このとき増幅度は2となり発振条件の3を満たさない。"],"","","q:figelec_23"],["図はあるトランジスタの許容コレクタ損失PCと周囲温度Taの関係である。周囲温度Ta=75［℃］のとき，許容コレクタ損失はいくらか？","200［mW］","400［mW］","300［mW］","100［mW］","グラフの横軸Ta=75［℃］から上に進み，直線と交わる点の縦軸を読むと200［mW］である。許容コレクタ損失は25［℃］の400［mW］から温度上昇とともに直線的に減少し，125［℃］で0になる。高温では放熱器などで温度を下げる必要がある。","","",["Ta=25［℃］での値で，周囲温度による減少を考えていない。","Ta=50［℃］のときの読み取り値で，目盛りを読み違えている。","Ta=100［℃］のときの読み取り値で，目盛りを読み違えている。"],"","","q:figelec_24",["x:figelec_24","PC－Ta特性からTa=75℃の許容損失を読む"]],["ある回路の出力と入力の振幅比（出力/入力）が0.01のとき，ゲインは何［dB］か？","−40［dB］","−20［dB］","−2［dB］","40［dB］","ゲイン［dB］は20log10(出力/入力)で求める。20log10(0.01)=20×(−2)=−40［dB］。出力が入力より小さい（減衰する）ときゲインは負になる。振幅比0.1なら−20［dB］，0.001なら−60［dB］となる。","","",["振幅比0.1のときのゲインで，log10(0.01)=−2を−1と読み違えた値。","log10(0.01)=−2に20を掛け忘れた値。電圧比のdBは20倍する。","符号を誤った値で，40［dB］は振幅比100（増幅）を表す。"],"","","",["x:figelec_25","振幅比とゲイン［dB］の対応"]],["図のオペアンプを用いた反転増幅回路で，R1=10［kΩ］，R2=100［kΩ］，入力電圧Vi=0.2［V］のとき，出力電圧Voは？","−2.0［V］","+2.0［V］","+2.2［V］","−0.02［V］","反転増幅回路の出力はVo=−(R2/R1)×Viで求めます。R2/R1=100/10=10なので，Vo=−10×0.2=−2.0［V］です。入力と出力の極性が反転するため，符号はマイナスになります。","","",["増幅率10倍は合っているが，反転増幅回路で出力の符号が反転することを見落としている。","非反転増幅回路の式Vo=(1+R2/R1)Vi=11×0.2を当てはめた値。","抵抗比を逆にR1/R2=0.1として−0.1×0.2と計算した値。増幅されずに小さくなってしまう。"],"","","q:figelec_26",["x:figelec_26","仮想短絡で考える反転増幅回路の出力計算"]],["図のオペアンプを用いた非反転増幅回路で，R1=10［kΩ］，R2=40［kΩ］，入力電圧Vi=0.5［V］のとき，出力電圧Voは？","2.5［V］","2.0［V］","−2.0［V］","0.625［V］","非反転増幅回路の出力はVo=(R1+R2)/R1×Vi=(1+R2/R1)×Viです。(10+40)/10=5倍なので，Vo=5×0.5=2.5［V］となります。入力と同じ極性で出力され，増幅率は必ず1以上になります。","","",["増幅率をR2/R1=4倍とし，非反転増幅の式の「1+」を足し忘れて4×0.5とした値。","反転増幅回路の式Vo=−(R2/R1)Viを使った値。非反転増幅では出力の符号は反転しない。","増幅率を(R1+R2)/R2=1.25倍と分母を取り違えた値。"],"","","q:figelec_27",["x:figelec_27","仮想短絡で考える非反転増幅回路の出力計算"]],["固定子巻線の相数が5，回転子の歯数が50のステッピングモータのステップ角は？","1.44°","7.2°","72°","約6.5°","ステップ角はθs=360°÷(固定子の相数np×回転子の歯数nb)で求めます。θs=360°÷(5×50)=360°÷250=1.44°です。1回転に必要なパルス数は250パルスになります。","","",["回転子の歯数50だけで360°÷50とし，固定子の相数5を掛け忘れた値。","固定子の相数5だけで360°÷5とし，回転子の歯数50を掛け忘れた値。","相数と歯数を掛けずに足して360°÷(5+50)≒6.5°とした値。"],"","",""],["図のような2極の三相巻線に周波数60［Hz］の三相交流を加えたとき，回転磁界の速度（同期速度）は？","3600［min⁻¹］","1800［min⁻¹］","7200［min⁻¹］","60［min⁻¹］","同期速度はns=120f/p［min⁻¹］で求めます（fは電源周波数，pは極数）。2極・60Hzなのでns=120×60÷2=3600［min⁻¹］です。これは毎秒60回転に相当します。","","",["4極として120×60÷4を計算した値。極数を読み違えている。","極数pに極対数の1を入れて120×60÷1とした値。式のpは極数（2極なら2）である。","毎秒の回転数60［s⁻¹］を毎分の単位［min⁻¹］と取り違えた値。"],"","","q:figelec_29",["w:191_2","2極三相巻線が作る磁界の様子",{"a":"Christiankral","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Rotating_magnetic_field_color.gif"}]],["電源周波数50［Hz］，4極の三相誘導電動機が，すべり0.04で運転している。回転速度は？","1440［min⁻¹］","1500［min⁻¹］","1560［min⁻¹］","2880［min⁻¹］","誘導電動機の回転速度はn=120f/p×(1−s)で求めます。同期速度は120×50÷4=1500［min⁻¹］で，すべり0.04の分だけ遅れるのでn=1500×(1−0.04)=1440［min⁻¹］です。","","",["同期速度120×50÷4そのもので，すべりによる速度低下を考えていない値。","(1−s)ではなく(1+s)を掛けた値。誘導電動機は同期速度より遅く回る。","極数4ではなく極対数2を式に入れて120×50÷2×0.96とした値。"],"","",""],["図の理想変圧器で，1次巻数N1=2000，2次巻数N2=100，1次電圧V1=200［V］のとき，2次電圧V2は？","10［V］","4000［V］","20［V］","100［V］","理想変圧器ではV1/V2=N1/N2が成り立ちます。V2=V1×N2/N1=200×100/2000=10［V］です。巻数比が20：1なので，電圧も1/20に下がります。","","",["巻数比を逆に掛けて200×2000/100とした値。降圧のはずが昇圧になっている。","巻数比N1/N2=20をそのまま2次電圧と取り違えた値。電圧は巻数比で割る必要がある。","2次巻数N2=100をそのまま2次電圧と取り違えた値。巻数と電圧は別の量である。"],"","","q:figelec_31",["w:214_0","変圧器の鉄心と巻線の配置（内鉄形・外鉄形）",{"a":"SpinningSpark","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Transformer_winding_formats.jpg"}]],["図の変流器の原理を用いたクランプメータで，測定する電線1本を一次コイル（n1=1）とし，二次コイルの巻数n2=3000とする。二次電流I2=10［mA］のとき，一次電流I1は？","30［A］","3［A］","300［A］","3.3［μA］","変流比はk=I1/I2=n2/n1です。I1=I2×n2/n1=10［mA］×3000/1=30000［mA］=30［A］となります。大きな一次電流を巻数比に応じて小さな二次電流に変換して測定しています。","","",["10［mA］を0.001［A］と換算を誤り，0.001×3000とした値。","10［mA］を0.1［A］と換算を誤り，0.1×3000とした値。","変流比を逆に用いてI2÷3000とした値。一次電流は二次電流より大きくなる。"],"","","q:figelec_32"],["8ビットのADコンバータで0〜5［V］を変換するとき，1ビットあたりの電圧（分解能）は約0.02［V］である。同じ0〜5［V］を10ビットのADコンバータで変換したときの1ビットあたりの電圧は？","約4.9［mV］","約19.6［mV］","500［mV］","約1.2［mV］","nビットのADコンバータは0〜(2ⁿ−1)の値で表すので，1ビットあたりの電圧は5［V］÷(2ⁿ−1)です。10ビットでは5÷1023≒0.0049［V］=約4.9［mV］となり，8ビットより細かく変換できます。","","",["8ビットの場合の5÷255の値。ビット数を10に変えずに計算している。","ビット数10でそのまま割って5÷10とした値。2の10乗を使っていない。","12ビットの場合の5÷4095の値。ビット数を取り違えている。"],"","",""],["図のオシロスコープの画面で，横軸は0.2［ms/div］に設定されている。表示された三角波の周波数は？","1［kHz］","500［Hz］","2［kHz］","5［kHz］","山から次の山までの1周期は横に5目盛［div］なので，周期T=0.2［ms/div］×5［div］=1.0［ms］です。周波数は周期の逆数なのでf=1/0.001［s］=1000［Hz］=1［kHz］となります。","","",["画面の横幅10目盛を1周期と読み，周期2［ms］とした値。実際は2周期分表示されている。","山から谷までの半周期2.5目盛（0.5［ms］）を1周期と読んだ値。","1周期の目盛数を掛けずに，1目盛の時間0.2［ms］の逆数をとった値。"],"","","q:figelec_34",["x:figelec_34","オシロ画面で1周期の目盛数から周波数を求める"]],["図のCdSセルを用いた回路で，電源電圧6［V］，負荷抵抗10［kΩ］とする。光が当たってCdSの抵抗が20［kΩ］になったとき，出力（負荷の両端）の電圧は？","2［V］","4［V］","3［V］","6［V］","CdSと負荷は直列なので，電流I=6÷(20+10)［kΩ］=0.2［mA］です。出力は負荷の両端電圧なので10［kΩ］×0.2［mA］=2［V］となります。光が強くなりCdSの抵抗が下がるほど出力は大きくなります。","","",["出力ではなくCdSの両端の電圧20［kΩ］×0.2［mA］を求めた値。","抵抗値の比を考えず，電源電圧を2つの素子で半分ずつ分けると考えた値。","CdSの抵抗を無視し，電源電圧6［V］がそのまま出力に出ると考えた値。"],"","","q:figelec_35",["x:figelec_35","CdSと負荷の分圧による出力電圧"]],["図のようなロータリエンコーダで，円板のスリット数が500，さらに4倍の逓倍回路を使用した。1パルスあたりの分解能は？","0.18°","0.72°","0.36°","0.09°","スリット数nの円板の分解能は360°/n，k倍の逓倍回路を使うと360°/(k×n)です。360°÷(4×500)=360°÷2000=0.18°となります。逓倍により1回転あたりのパルス数が増え，精度が上がります。","","",["逓倍回路を考えず360°÷500とした値。スリット1つあたりの分解能である。","2倍の逓倍として360°÷(2×500)とした値。a相のみの立上り・立下りを数えた場合。","8倍の逓倍として360°÷(8×500)とした値。逓倍の倍率を取り違えている。"],"","","q:figelec_36"],["図の降圧チョッパ回路で，入力電圧E1=48［V］，スイッチSのオン時間Ton=15［μs］，オフ時間Toff=45［μs］のとき，負荷にかかる平均電圧E2は？","12［V］","16［V］","36［V］","64［V］","降圧チョッパの出力はE2=Ton/(Ton+Toff)×E1です。Ton/(Ton+Toff)=15/60=0.25なので，E2=0.25×48=12［V］となります。オン時間の割合（通流率）を変えることで出力電圧を調整できます。","","",["分母を周期ではなくToffとしてTon/Toff×E1とした値。","オン時間ではなくオフ時間の割合Toff/(Ton+Toff)を掛けた値。","昇圧チョッパの式(Ton+Toff)/Toff×E1を使った値。"],"","","q:figelec_37",["x:figelec_37","降圧チョッパの出力波形と平均電圧"]],["図の電力系統で，送電端電圧ES=100［kV］，受電端電圧ER=100［kV］，送電線のリアクタンスX=50［Ω］，位相差δ=30°のとき，送電電力PRは？","100［MW］","200［MW］","約173［MW］","100［kW］","送電電力はPR=(ES×ER/X)×sinδで求めます。ES×ER/X=100×10³×100×10³÷50=200×10⁶［W］，sin30°=0.5なので，PR=200×0.5=100［MW］です。","","",["sinδを掛け忘れ，ES×ER/Xだけを求めた値。位相差による電力の大きさが考慮されていない。","sinδの代わりにcos30°≒0.866を掛けた値。三角関数を取り違えている。","［kV］どうしの積を［kW］のままと考え，単位の換算を誤った値。"],"","","q:figelec_38"],["トランジスタの接合部温度を100［℃］とするよう設計したい。周囲温度25［℃］，損失15［W］，接合部から放熱器までの熱抵抗の合計が1.0［℃/W］のとき，放熱器の熱抵抗は？","4.0［℃/W］","5.0［℃/W］","6.0［℃/W］","0.2［℃/W］","接合部から周囲までの熱抵抗は温度差÷損失で，(100−25)÷15=5.0［℃/W］です。ここから接合部〜放熱器までの1.0［℃/W］を引くと，放熱器の熱抵抗は5.0−1.0=4.0［℃/W］となります。","","",["接合部から周囲までの全体の熱抵抗で，内部側の熱抵抗を引いていない値。","内部側の熱抵抗1.0［℃/W］を引かずに5.0に足してしまった値。","熱抵抗を損失÷温度差（15÷75）と逆に割った値。熱抵抗は温度差÷損失である。"],"","","",["x:figelec_39","熱抵抗の直列モデルによる放熱器の熱抵抗"]],["図のオシロスコープの画面で，縦軸は0.5［V/div］，GNDは画面中央の横線である。10:1プローブを「×10」で使って測定したとき，この正弦波の振幅（最大値）は？","10［V］","1.0［V］","20［V］","0.1［V］","GNDから波形の一番上までは2目盛［div］なので，画面上の振幅は0.5［V/div］×2［div］=1.0［V］です。「×10」のプローブでは信号が1/10になって表示されるため，読み取った値を10倍して，1.0×10=10［V］となります。","","",["画面上の読み取り値0.5×2=1.0［V］のままで，プローブの「×10」倍を掛け忘れた値。","山から谷までの4目盛を読んだ値（ピーク・ツー・ピーク）0.5×4×10。振幅（最大値）はGNDから山までで読む。","「×10」を読み取り値を1/10にする意味と取り違え，1.0÷10とした値。"],"","","q:figelec_40",["x:figelec_40","オシロ画面の振幅読み取りと×10プローブの換算"]],["図はDCモータ（電磁石形）の電機子と界磁巻線（図中のコイル）の接続を示している。このように電機子と界磁巻線を並列に接続し，同じ電源から電流を流す方式は？","分巻式","直巻式","他励式","複巻式","図では電機子と界磁巻線が同じ2つの端子の間に並列につながれています。これを分巻式といいます。界磁巻線を電機子と直列につなぐのが直巻式，界磁巻線を別の電源で励磁するのが他励式，直巻と分巻の両方の界磁巻線をもつのが複巻式です。","","",["界磁巻線を電機子と直列に接続する方式。電機子電流がそのまま界磁巻線に流れる。","界磁巻線を電機子とは別の電源につないで励磁する方式。端子が電機子用と界磁用で別々になる。","直巻界磁と分巻界磁の両方の巻線をもち，直列と並列を組み合わせた方式。"],"","","q:figelec_41",["x:figelec_41","教科書の電磁石形DCモータの種類（他励・分巻ほか）"]],["図はフレミングの左手の法則を表している。A・B・Cの3本の指は互いに直角に開いており，それぞれ電磁力，磁界（磁束），電流のいずれかの向きを示す。Cの指が示すものは？","電流","電磁力","磁界（磁束）","誘導起電力","フレミングの左手の法則では，親指（A）が電磁力（力），人差し指（B）が磁界（磁束），中指（C）が電流の向きを示します。「電・磁・力」の順に中指・人差し指・親指と覚えます。DCモータが回る原理を表す法則です。","","",["上に立てた親指（A）が示す向き。磁界中の電線に働く力の向きである。","まっすぐ伸ばした人差し指（B）が示す向き。N極からS極へ向かう磁束の向きである。","発電機の原理を表すフレミングの右手の法則で中指が示すもの。左手の法則には出てこない。"],"","","q:figelec_42",["x:figelec_42","教科書のフレミングの左手の法則（指と向き）"]],["図の昇圧チョッパ回路で，入力電圧E1=24［V］，スイッチSのオン時間Ton=30［μs］，オフ時間Toff=10［μs］のとき，負荷にかかる平均電圧E2は？","96［V］","18［V］","72［V］","32［V］","昇圧チョッパ回路の出力電圧はE2=(Ton+Toff)/Toff×E1で求めます。(30+10)/10=4倍なので，E2=4×24=96［V］です。オン時間の割合が大きいほど，入力電圧より高い電圧が得られます。","","",["降圧チョッパの式E2=Ton/(Ton+Toff)×E1=30/40×24を使った値。昇圧回路では入力より高くなる。","分子をTonだけにしてTon/Toff×E1=3×24とした値。分子は周期T=Ton+Toffである。","分母をTonにして(Ton+Toff)/Ton×E1=40/30×24とした値。分母はオフ時間Toffである。"],"","","q:figelec_43",["x:figelec_43","昇圧チョッパのスイッチ動作と出力電圧の計算"]],["図はダイオード4個によるブリッジ構成の整流回路と，電源電圧e（破線部を含む正弦波）と負荷電圧vの波形である。グラフから読み取れる負荷電圧vの脈動（山の繰り返し）の周波数は？","100［Hz］","50［Hz］","25［Hz］","200［Hz］","電源電圧eは0.02［s］で1周期なので50［Hz］です。全波整流回路では負の半周期も反転して出力されるため，vの山は0.01［s］ごとに現れます。周波数は1÷0.01=100［Hz］で，電源周波数の2倍になります。","","",["電源電圧eの周波数（周期0.02［s］）。半波整流回路なら負荷電圧の山もこの周期になる。","周期を0.04［s］と読み違えた値。山2つ分の間隔を1周期とした誤り。","周期を0.005［s］と半分に読み違えた値。山の頂点から谷までを1周期とした誤り。"],"","","q:figelec_44",["x:figelec_44","全波整流で脈動周波数が電源の2倍になる波形"]],["図はインクリメンタル型ロータリエンコーダの出力波形である。a相とb相のパルスを90°ずらして出力する主な目的は？","回転方向を検出するため","原点（1回転の基準位置）を検出するため","電源を切っても絶対位置を保持するため","発光素子の消費電力を減らすため","a相とb相は90°位相がずれているため，どちらの相が先に立ち上がるかで回転方向を判別できます。また，2相を使うことで単相に比べて分解能が2倍になります。原点の検出には1回転に1パルスだけ出るz相が使われます。","","",["図のz相の役割。1回転に1カ所だけスリットがあり，原点検出に使う。","アブソリュート型ロータリエンコーダの特徴。インクリメンタル型は相対位置を検出する。","位相をずらすことと消費電力には関係がない。a相・b相の目的は方向判別と分解能向上である。"],"","","q:figelec_45",["x:figelec_45","a相・b相の先後で回転方向を判別する波形"]],["図のひずみゲージを用いた加速度センサで，おもりの質量は20［g］である。ひずみゲージの出力から，板ばねがおもりに加える力が0.3［N］とわかった。このときの加速度は？","15［m/s²］","0.015［m/s²］","6［m/s²］","0.067［m/s²］","F=maより，a=F/mです。質量は20［g］=0.02［kg］に換算して，a=0.3÷0.02=15［m/s²］となります。加速度センサは，質量のわかったおもりに働く力をひずみゲージで測ることで加速度を求めています。","","",["質量20［g］を［kg］に換算せず，そのまま0.3÷20と計算した値。","力と質量を掛けて0.3×20とした値。F=maの変形を誤っている。","質量を力で割ってm/F=0.02÷0.3とした値。式の分子と分母が逆である。"],"","","q:figelec_46",["w:205_0","はく形ひずみゲージの外観",{"a":"Cristian V.","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Strain_gauge_-.jpg"}]],["図の超音波距離センサの回路で，超音波を照射してから反射波を受信するまでの時間をカウンタで測ると4［ms］であった。音速を340［m/s］とすると，対象物までの距離は？","0.68［m］","1.36［m］","680［m］","85［m］","超音波は対象物まで行って戻ってくるので，進んだ距離は往復分です。往復距離は340×0.004=1.36［m］なので，対象物までの距離はその半分の0.68［m］となります。［ms］は［s］に換算して計算します。","","",["往復の距離340×0.004=1.36［m］のままで，2で割り忘れた値。","時間を［ms］から［s］に換算せず，そのまま340×4÷2と計算した値。","距離は速さ×時間なのに，音速を時間で割って340÷4と計算した値。"],"","","q:figelec_47",["x:figelec_47","超音波の往復距離から片道の距離を求める"]],["確度が±(0.5% rdg.+2 dgt.)のディジタルテスタで，5.000［V］と表示された。最終桁の1カウントが0.001［V］のとき，誤差の範囲は？","±0.027［V］","±0.025［V］","±0.002［V］","±0.27［V］","rdg.は読み取り値に対する割合，dgt.は最終桁のカウント数です。5.000×0.5/100=0.025［V］，2カウント分は2×0.001=0.002［V］なので，誤差は±(0.025+0.002)=±0.027［V］です。真の値は4.973〜5.027［V］の範囲にあります。","","",["読み取り値の0.5%分だけで，最終桁2カウント分（dgt.）を足し忘れた値。","最終桁2カウント分だけで，読み取り値に対する0.5%分（rdg.）を足し忘れた値。","0.5%を0.05として5.000×0.05+0.02と計算した値。百分率の換算と桁を誤っている。"],"","",""],["時間軸を20［μs/div］（横方向10目盛）に設定し，メモリ長10,000点でサンプリングするディジタルオシロスコープのサンプリング周波数は？","50［MHz］","500［MHz］","20［MHz］","5［MHz］","画面全体の時間は20［μs/div］×10［div］=200［μs］です。この間を10,000点でサンプリングするので，サンプリング周期は200［μs］÷10,000=20［ns］です。サンプリング周波数は1÷20［ns］=50［MHz］となります。","","",["1目盛分の20［μs］を10,000点で割った値。横方向の10目盛を掛け忘れている。","50［μs/div］のときの値（500［μs］で10,000点）。時間軸の設定が異なる。","メモリ長を1,000点として計算した値。点数の桁を読み違えている。"],"","","",["w:141_0","アナログ（上）とディジタル（下）のオシロスコープ",{"a":"File:Tektronix TPS 2014B cropped.jpg: * File:Tektronix TPS 2","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Analog_CRT_oscilloscope_Tektronix_475A_(1977)_and_digital_storage_oscilloscope_Tektronix_TPS_2014B_(c._2012).jpg"}]],["騒音計で測定した音圧の実効値が0.2［Pa］であった。基準音圧（最小可聴音圧）を20［μPa］とすると，音圧レベルは？","80［dB］","40［dB］","4［dB］","160［dB］","音圧レベルは20log10(P/P0)［dB］で求めます。P/P0=0.2÷(20×10⁻⁶)=10000=10⁴なので，20×log10(10⁴)=20×4=80［dB］です。音圧が10倍になるごとに20［dB］増えます。","","",["10log10(P/P0)=10×4とした値。音圧（振幅量）の比には20logを使う。","常用対数log10(P/P0)=4を求めただけで，係数の20を掛け忘れた値。","音圧の2乗の比に20logを使い，20×log10(10⁸)とした値。2乗の比なら10logを使う。"],"","","",["w:200_2","携帯形騒音計の外観",{"a":"Jin Zan","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Sound_level_meter,_DVM85.jpg"}]]]},{"id":"figinfo","title":"図・計算問題（情報）","cat":"図・計算","q":[["図は、アナログ信号を一定間隔で標本化し、各標本値を縦軸の2進数の段階に量子化した例である。この量子化の量子化ビット数と、表現できる段階数の組合せとして正しいものは？","3［ビット］・8段階","8［ビット］・3段階","3［ビット］・3段階","8［ビット］・256段階","縦軸の量子化レベルは000〜111の3桁の2進数で表されているので、量子化ビット数は3［ビット］である。nビットで表せる段階数は2のn乗なので、2^3＝8段階（000〜111）となる。","","",["ビット数と段階数を取り違えている。8段階を表すのに必要なビット数が3である。","3ビットで表せる段階数を3と誤っている。段階数は2^3＝8である。","8ビット量子化の場合の段階数（2^8＝256）であり、図の3桁の符号とは合わない。"],"","","q:figinfo_1"],["図の論理回路（MIL記号）の出力Zを表す論理式として正しいものは？","Z＝X","Z＝Y","Z＝X・Y","Z＝X＋Y","上のANDにはXとYの否定が入るので出力はX・¬Y、下のANDの出力はX・Y。ORで合成するとZ＝X・¬Y＋X・Y＝X・(¬Y＋Y)＝X・1＝X となる。Yの値に関係なく出力はXに等しい。","","",["XとYの役割を逆に読んだ場合の式。Zは入力Yの値に影響されない。","下側のANDゲートだけを見た式。上側のX・¬YとのORを考慮していない。","ORゲートだけに注目した式。X＝0、Y＝1のときZ＝0なのでX＋Yとは一致しない。"],"","","q:figinfo_2",["x:figinfo_2","真理値表：Zの列はXの列と一致しZ＝Xとなる"]],["図のMIL記号で表される論理ゲートの名称は？","NOR","NAND","XOR","OR","入力側が弧状にくぼみ、先端がとがった形はOR（論理和）の記号で、出力側の小さな丸（○）は否定を表す。ORの出力を反転したゲートなのでNOR（否定論理和）であり、入力がすべて0のときだけ出力が1になる。","","",["NANDはAND記号（入力側が直線で先端が半円）の出力に○を付けた記号である。","XORはOR記号の入力側にもう1本の弧を加えた記号で、出力に○は付かない。","ORは同じ形だが出力側に否定の○が付かない記号で、入力に1があれば出力が1になる。"],"","","q:figinfo_3",["w:079_1","NORゲートのMIL記号（ORの出力に否定の丸）",{"a":"Created by sv:Användare:Sten André","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:NOR-gate-US.png"}]],["図は3入力（W, X, Y）の排他的論理和（XOR）の記号である。出力Zが1になる入力の組合せ（W, X, Y）はどれか？","(1, 1, 1)","(1, 1, 0)","(0, 1, 1)","(1, 0, 1)","多入力のXORは、入力中の1の個数が奇数のとき出力が1になる。(1, 1, 1)は1が3個（奇数）なのでZ＝1。順に計算しても1 XOR 1＝0、0 XOR 1＝1となる。","","",["1の個数が2個（偶数）なのでZ＝0。1 XOR 1＝0、0 XOR 0＝0となる。","1の個数が2個（偶数）なのでZ＝0となる。0 XOR 1＝1、1 XOR 1＝0と計算できる。","1の個数が2個（偶数）なのでZ＝0となる。1 XOR 0＝1、1 XOR 1＝0と計算できる。"],"","","q:figinfo_4",["x:figinfo_4","3入力XORの真理値表：1の個数が奇数でZ＝1"]],["図のIEEE754単精度形式で、符号部s＝0、指数部e＝130（10進）、仮数部f＝1000…0（先頭ビットだけ1）のとき、表される値は？","12","8","6","24","正規化数なので value＝(−1)^s × 2^(e−127) × (1.f)。1.f＝1.1(2)＝1.5、2^(130−127)＝2^3＝8 より、value＝1×8×1.5＝12 となる。","","",["仮数部の小数（0.5）を無視して1×2^3とした値。正規化では1.fとして先頭の1に仮数部を加える。","バイアスを128と誤り、1.5×2^2とした値。単精度のバイアスは127である。","非正規化の126をバイアスに使い、1.5×2^4とした値。正規化数のバイアスは127である。"],"","","q:figinfo_5",["x:figinfo_5","s・e・fの値と2^(e−127)×1.fによる値12の計算"]],["図のようにCPUがキャッシュメモリと主記憶を使う。キャッシュのアクセス時間10［ns］、主記憶のアクセス時間80［ns］、ヒット率0.95のとき、実効アクセス時間は？","13.5［ns］","76.5［ns］","45［ns］","10［ns］","実効アクセス時間＝ヒット率×キャッシュのアクセス時間＋(1−ヒット率)×主記憶のアクセス時間。0.95×10＋0.05×80＝9.5＋4＝13.5［ns］となる。","","",["ヒット率と失敗率を逆に掛けた値（0.05×10＋0.95×80）。","ヒット率を考えず、2つのアクセス時間を単純平均（(10＋80)÷2）した値。","すべてキャッシュにヒットした場合の値。ミス時の主記憶アクセスを無視している。"],"","","q:figinfo_6",["w:129_2","プロセッサ・各段キャッシュ・主記憶の階層構成",{"a":"Ferry24.Milan","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Multi-level_Cache_Hierarchy_diagram.svg"}]],["図は各命令をF・D・E・M・Wの5段階で実行するパイプラインの例である。各段階が1サイクルで、乱れなく動作するとき、10個の命令をすべて完了するのに必要なサイクル数は？","14［サイクル］","50［サイクル］","10［サイクル］","15［サイクル］","最初の命令が完了するまでに段数分の5サイクルかかり、その後は1サイクルごとに1命令ずつ完了する。所要サイクル数＝段数＋(命令数−1)＝5＋(10−1)＝14［サイクル］となる。","","",["パイプラインを使わず1命令ずつ順に実行した場合（5×10）の値。","1命令1サイクルで完了すると考え、最初の命令が流れきるまでの遅れを無視した値。","段数と命令数を単純に足した値。最初の命令の完了時点で2番目以降が並行して進んでいる分（1）を引いていない。"],"","","q:figinfo_7",["x:figinfo_7","5段パイプラインで10命令が14サイクルで完了する様子"]],["10進数の43を2進数に変換したものは？","101011","110101","101001","100011","2で割って余りを求めると、43÷2＝21余り1、21÷2＝10余り1、10÷2＝5余り0、5÷2＝2余り1、2÷2＝1余り0、1÷2＝0余り1。余りを下から並べて101011。検算：32＋8＋2＋1＝43。","","",["余りを上から（求めた順に）並べてしまった誤り。正しくは最後の余りが最上位ビットになる。","10進数の41（32＋8＋1）を表す。途中の余りを1つ誤っている。","10進数の35（32＋2＋1）を表す。重みの計算を誤っている。"],"","","",["x:figinfo_8","43を2で割り続け余りを下から読んで101011を得る"]],["10進数の−6を8ビットの2の補数で表したものは？","11111010","11111001","10000110","00000110","＋6は00000110。2の補数は全ビットを反転（11111001）してから1を加えて求める。11111001＋1＝11111010。検算：11111010＋00000110＝1 00000000（下位8ビットは0）。","","",["＋6のビットを反転しただけの1の補数で、最後に1を加える手順が抜けている。","最上位ビットを符号（1＝負）、残り7ビットを絶対値6とした符号付き絶対値表現である。","＋6をそのまま2進数にした値で、2の補数による負数への変換をしていない。"],"","","",["x:figinfo_9","＋6をビット反転し1を加えて−6（11111010）を得る手順"]],["偶数パリティ（1の個数が偶数になるようにパリティビットを付加）で送られた8ビットデータを受信した。誤りが検出されるものは？","10110101","11010010","01101100","10000001","偶数パリティでは受信データ中の1の個数が偶数なら正常、奇数なら誤りと判定する。10110101は1が5個（奇数）なので誤りが検出される。ほかは4個・4個・2個で偶数のため誤りは検出されない。","","",["1の個数が4個（偶数）なので、偶数パリティのチェックでは正常と判定される。","1の個数が4個（偶数）なので、偶数パリティのチェックでは正常と判定される。","1の個数が2個（偶数）なので正常と判定される。2ビット誤りなら見逃す点に注意。"],"","",""],["電話音声を標本化周波数8［kHz］、量子化ビット数8［ビット］、モノラルでデジタル化した。1分間のデータ量は？（1［kB］＝1000［バイト］とする）","480［kB］","60［kB］","3840［kB］","64［kB］","1秒間のデータ量は8000［回］×8［ビット］＝64000［ビット］＝8000［バイト］。1分間（60秒）では8000×60＝480000［バイト］＝480［kB］となる。","","",["量子化ビット数8を掛け忘れ、標本数480000をさらに8で割った値。","ビットのまま（3840000［ビット］）をkBとして表示した値。バイトへの換算（÷8）を忘れている。","1秒間のビットレート64［kbit］と混同した値で、時間60秒を掛けていない。"],"","",""],["10進数の59をBCDコード（2進化10進数）で表したものは？","0101 1001","0011 1011","1001 0101","0100 1001","BCDは10進数の各桁を4ビットの2進数で表す。5は0101、9は1001なので、59は0101 1001となる。59をそのまま2進数に変換した値（00111011）とは異なる。","","",["59を純粋な2進数（32＋16＋8＋2＋1）に変換した値で、BCDではない。","十の位と一の位の4ビットの並びを逆にしている。これは95のBCDである。","十の位の5を0100（4）と誤って変換している。これは49のBCDである。"],"","","",["x:figinfo_12","59の各桁を4ビットにしたBCDと純2進数の違い"]],["図のRS232Cフォーマット（スタートビット1、データビット8、ストップビット1、パリティなし）で、通信速度9600［bps］のとき、1秒間に送れる最大の文字数は？（1文字＝8ビットのデータ）","960［文字］","1200［文字］","約1067［文字］","9600［文字］","調歩同期では1文字ごとにスタートビット1とストップビット1が付くので、1文字の送信に1＋8＋1＝10［ビット］が必要である。9600［bps］÷10［ビット］＝960［文字］となる。","","",["データ8ビットだけで割った値（9600÷8）。スタートビットとストップビットの分を忘れている。","9ビットで割った値（9600÷9）。スタートビットかストップビットのどちらか一方を数え忘れている。","ビット数をそのまま文字数とした値。1文字は複数のビットで送られる。"],"","","q:figinfo_13",["x:figinfo_13","1文字10ビットの調歩同期フレームと960文字の計算"]],["図のタイマモジュールの設定レジスタで、分周比のビットを10に設定した。内部クロックが16［MHz］のとき、カウンタに入力されるクロックの周波数は？","4［MHz］","8［MHz］","1.6［MHz］","64［MHz］","図より分周比のビット00/01/10/11が分周比1/2/4/8に対応するので、10は4分周である。プリスケーラはクロックを分周比で割って周波数を下げるので、16［MHz］÷4＝4［MHz］となる。","","",["2進数の10を10進数の2と読み、2分周（16÷2）とした値。図の対応表では10は4分周である。","ビット10を10進数の10と考え、10分周（16÷10）とした値。","分周比を掛けてしまった値（16×4）。分周は周波数を下げる処理である。"],"","","q:figinfo_14"],["図のアウトプットコンペア機能で、周期1000カウントのうちHレベル（5［V］）の期間を300カウント、残りをLレベル（0［V］）とするPWM波形を出力した。フィルタで平滑化したときの平均電圧は？","1.5［V］","3.5［V］","約2.14［V］","0.3［V］","平均電圧はHレベルの電圧×デューティ比で求める。デューティ比＝Hの期間÷周期＝300÷1000＝0.3。平均電圧＝5［V］×0.3＝1.5［V］となる。パルス幅を変えると平均電圧を変えられる。","","",["Lレベルの期間（700カウント）の割合0.7を掛けた値。デューティ比はHの期間の割合である。","Hの期間をLの期間で割った（300÷700）値を掛けている。分母は周期全体の1000である。","デューティ比0.3をそのまま電圧とした値。Hレベルの電圧5［V］を掛けていない。"],"","","q:figinfo_15",["x:figinfo_15","デューティ比0.3のPWM波形と平均電圧1.5V"]],["図のDMA転送で、DMACがCPUにバスの使用権を要求する信号（ア）と、CPUがバスを解放して使用権を与える信号（イ）の組合せとして正しいものは？","ア：HOLD　イ：HOLDA","ア：HOLDA　イ：HOLD","ア：RTS　イ：CTS","ア：DMA要求　イ：割込み要求","DMACは転送要求を受けると、HOLD信号でCPUにバス使用権を要求する。CPUはバスを解放し、HOLDA（HOLD Acknowledge）信号で使用権を与える。その後DMACがバスを使って直接メモリにアクセスする。","","",["要求と応答が逆である。HOLDAは要求に対する承認（Acknowledge）の信号である。","RTS・CTSはRS232Cの送信要求・送信可を示すハードウェアフロー制御の信号である。","DMA要求はI/OがDMACへ出す転送要求、割込み要求は転送終了などをCPUに知らせる信号である。"],"","","q:figinfo_16",["x:figinfo_16","DMA転送：HOLDで使用権を要求しHOLDAで許可（原図）"]],["図の二分木は、各ノードで「左の子＜親＜右の子」となっている。この木で56を探すとき、根から順に比較するノードの値として正しいものは？","45→78→63→56","45→78→85→56","45→23→34→56","9→22→31→56","根の45と比べ、56＞45なので右の78へ進む。56＜78なので左の63へ進み、56＜63なので左の子56で一致する。大小比較で一方の枝だけをたどるので、比較は4回で済む。","","",["78との比較で右に進んでいる。56＜78なので左の子63へ進むのが正しい。","根との比較で左に進んでいる。56＞45なので右の部分木を探す。","葉を左から順に調べる線形探索のような手順で、二分木の大小関係を使っていない。"],"","","q:figinfo_17",["x:figinfo_17","二分探索木で56を探す比較の経路45→78→63→56"]],["図のスタックは54をPUSHした後、上から54、16、91、21が積まれている。この状態からPOPを3回行ったとき、3回目に取り出されるデータは？","91","16","21","54","スタックは後入れ先出し（LIFO）で、最後に積んだデータから取り出される。POPの順は54→16→91となるので、3回目に取り出されるのは91である。残るのは最下段の21だけとなる。","","",["先入れ先出し（FIFO）のキューと考え、21→91→16の順に取り出した場合の3回目である。","最も下（最初に積まれた）データで、POPで取り出されるのは最後になる。","1回目のPOPで取り出されるデータ（最後にPUSHした値）である。"],"","","q:figinfo_18",["x:figinfo_18","POPごとに最上段から54→16→91と取り出すLIFO"]],["図のバブルソート（隣同士を比較し、逆順なら交換）を続けて、データ44、22、55、11、33を昇順に並べ終えるまでに、交換は全部で何回行われるか？","6［回］","10［回］","5［回］","4［回］","1回目は44と22、55と11、55と33の3回交換。2回目は44と11、44と33の2回。3回目（22、11、33）は22と11の1回で、4回目は交換なし。合計3＋2＋1＝6［回］となる。","","",["比較の回数（4＋3＋2＋1）である。逆順でない組は比較しても交換しない。","図の1回目と2回目の交換（3＋2）だけを数えた値。3回目にも22と11の交換がある。","必要な繰返し（パス）の回数（データ数−1）であり、交換の回数ではない。"],"","","q:figinfo_19",["x:figinfo_19","バブルソートの各回の並びと交換回数（計6回）"]],["図と同じ二分探索（要素数が偶数のときは中央の右側の要素と比較し、目的データを含む群に絞る）で、77を探すとき、一致するまでに比較する回数は？","2［回］","3［回］","7［回］","8［回］","まず[4]の55と比べ、77≧55なので後半の群（55、66、77、88）に絞る。この群の中央右側は[6]の77で、2回目の比較で一致する。よって比較回数は2［回］である。","","",["要素数8の最大比較回数（log₂8）と混同した値。77は2回目で見つかる。","線形探索で先頭から順に比べた場合の回数（[6]の位置まで7回）である。","要素数8をそのまま比較回数とした値。線形探索で最後まで調べた場合の最大比較回数に当たる。"],"","","q:figinfo_20",["x:figinfo_20","77の二分探索：55と比べ後半に絞り2回目で一致"]],["図の再帰関数factで、fact(5)を実行したとき、fact関数が呼び出される回数（最初の呼出しを含む）は？","5［回］","4［回］","6［回］","120［回］","fact(5)→fact(4)→fact(3)→fact(2)→fact(1)と呼び出され、n＝1で1を返して再帰が止まる。呼出しは5回で、戻り値は5×4×3×2×1＝120となる。","","",["最初のfact(5)の呼出しを数えず、再帰で呼ばれた回数だけを数えた値である。","fact(0)まで呼ばれると考えた値。n＝1でreturn 1となり、それ以上は呼ばれない。","fact(5)の戻り値（5の階乗）であり、呼出し回数ではない。"],"","","q:figinfo_21",["x:figinfo_21","fact(5)からfact(1)までの5回の呼出しと戻り値"]],["図の機械語とアセンブリ言語の対応で、機械語01000111を表すアセンブリ言語の命令は？","LD B,A（AレジスタからBレジスタにコピー）","LD A,B（BレジスタからAレジスタにコピー）","LD A,A（AレジスタからAレジスタにコピー）","LD B,B（BレジスタからBレジスタにコピー）","図より、先頭の01がLD、続く3ビットがコピー先、最後の3ビットがコピー元で、Aは111、Bは000である。01 000 111はコピー先B、コピー元AなのでLD B,Aとなる。","","",["機械語01111000に当たる命令。コピー先とコピー元の位置を逆に読んでいる。","機械語01111111に当たる命令。000がBを表すことを見落としている。","機械語01000000に当たる命令。111がAを表すことを見落としている。"],"","","q:figinfo_22",["x:figinfo_22","01000111を01・000・111に分けLD B,Aと解読"]],["ハッシュ関数 h(k)＝k mod 13（kを13で割った余り）でルート配列の位置を決める。キー100の格納位置は？","9","7","87","4","100÷13＝7余り9なので、h(100)＝100 mod 13＝9となる。検算：13×7＋9＝91＋9＝100。同じ余りになるキーは同じ位置に入り、衝突が起きる。","","",["100÷13の商7を答えた値。mod は割り算の余りを求める演算である。","100から13を1回だけ引いた値。13より小さくなるまで引いた残りが余りである。","13から余り9を引いた値。次の13の倍数104までの差であり、余りではない。"],"","","",["w:157_2","ハッシュ関数でキーを配列の位置に対応づけるハッシュ表",{"a":"不明","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:HASHTB12.svg"}]],["USBのHigh Speedモード（480［Mbps］）で1.2［GB］のファイルを転送する。オーバーヘッドを無視したとき、転送時間は？（1［GB］＝10^9［バイト］とする）","20［s］","2.5［s］","800［s］","1.92［s］","ファイルをビットに直すと1.2×10^9×8＝9.6×10^9［ビット］。転送時間＝データ量÷伝送速度＝9.6×10^9÷(480×10^6)＝20［s］となる。Mbpsは1秒間に送れるビット数（×10^6）である。","","",["バイトをビットに換算（×8）せずに計算した値。bpsは1秒あたりのビット数である。","Full Speedモード（12［Mbps］）で計算した値。","Super Speedモード（5［Gbps］）で計算した値。"],"","",""],["タイマモジュールの16ビットカウンタに1［MHz］のクロックを入力する。カウンタが0から数え始めて一巡（オーバーフロー）するまでの時間は？","65.536［ms］","0.256［ms］","65.536［s］","0.016［ms］","16ビットのカウンタは2^16＝65536通りの値を数える。1［MHz］のクロック1周期は1［μs］なので、65536×1［μs］＝65536［μs］＝65.536［ms］となる。","","",["8ビットカウンタ（2^8＝256カウント）の場合の値である。","クロックを1［kHz］（1周期1［ms］）と取り違えた値である。","ビット数16をそのままカウント数とした値。数えられる値は2の16乗である。"],"","",""],["図のPERT図（数字は各作業の所要日数［日］、点線Fはダミー）で、全作業が完了するまでに必要な最短日数は？","14［日］","13［日］","8［日］","25［日］","開始から終了までの各経路の日数を求めると、B→E→H＝5＋4＋5＝14、B→E→F→G＝5＋4＋0＋4＝13、A→C→E→H＝1＋3＋4＋5＝13、A→D→G＝1＋3＋4＝8。最も長い経路B→E→Hがクリティカルパスで、全体の最短日数は14［日］となる。","","",["B→E→F→GやA→C→E→Hの日数で、最長経路ではないため全体日数にはならない。","最も短い経路A→D→Gの日数。全体日数は最も長い経路で決まる。","全作業の日数を単純に合計した値。並行して進む作業を考慮していない。"],"","","q:figinfo_26",["x:figinfo_26","各経路の日数合計とクリティカルパスB→E→H（14日）"]],["図はタスクの状態遷移を示す。実行可能（READY）状態のタスクにCPUを割り当てて実行中（RUN）状態にする遷移（ア）を何というか？","ディスパッチ","スワップ","プリエンプション","デッドロック","スケジューラが優先度などから次に実行するタスクを判定し、ディスパッチャがレディキューからそのタスクを取り出してCPUを割り当てる。このREADYからRUNへの切替えをディスパッチという。","","",["仮想記憶で物理メモリと2次記憶の間でデータを入れ替えること。タスク状態の遷移ではない。","実行中のタスクを強制的に中断して実行可能状態に戻すこと。RUNからREADYへの向き。","複数のタスクが互いに資源を待ち合い、どれも先へ進めなくなる状態。"],"","","q:figinfo_27",["x:figinfo_27","タスクの状態遷移：READY→RUNがディスパッチ（原図）"]],["図のディレクトリ構成で、現在地がdirDのとき、file3を相対パスで表したものはどれか？（.は自分の場所、..は1つ上を表す）",".¥..¥file3",".¥file3",".¥..¥..¥file3","C:¥dirB¥file3","相対パスは現在地から見た経路で表す。dirDから1つ上のdirBへ上がるので「..」、そこにfile3があるので、.¥..¥file3 となる。ルートからたどるC:¥dirB¥file3は絶対パスである。","","",["dirDの中にfile3があるときの表し方。実際にはfile3は1つ上のdirBにある。","2つ上（C:¥）まで上がった場所を指し、そこにはfile3はない。","ルートディレクトリからの経路を表す絶対パスで、相対パスではない。"],"","","q:figinfo_28"],["図はネットワーク機器とOSIモデルの対応を示す。ネットワーク層（第3層）でIPアドレスを解析し、パケットの経路を制御する機器（ア）はどれか？","ルータ","スイッチ","リピータ","ハブ","ルータは論理的な宛先であるIPアドレスを解析し、パケットの伝送経路（ルート）を制御する機器で、OSI第3層（ネットワーク層）に位置する。上の全階層に対応するのはゲートウェイである。","","",["MACアドレスを解析して中継するOSI第2層（データリンク層）の機器。","電気信号を増幅して物理的に中継するOSI第1層（物理層）の機器。","複数のケーブルを集める機器で、リピータハブは第1層の機能をもつ。"],"","","q:figinfo_29",["x:figinfo_29","ネットワーク層で中継するルータとゲートウェイ（原図）"]],["図のIPv4アドレスの構成で、クラスCの1つのネットワークに割り当てられるホストの最大数は？（全ビット0と全ビット1のアドレスは除く）","254［台］","256［台］","8［台］","65534［台］","クラスCはネットワーク部24ビット、ホスト部8ビット。ホスト部の組合せは2^8＝256通りあるが、全ビット0（ネットワークアドレス）と全ビット1（ブロードキャストアドレス）を除くので、256－2＝254［台］となる。","","",["2^8をそのまま答えた値。ネットワークアドレスとブロードキャストアドレスを除いていない。","ホスト部のビット数8をそのまま台数とした誤り。","クラスB（ホスト部16ビット）の2^16－2の値で、クラスを取り違えている。"],"","","q:figinfo_30",["x:figinfo_30","クラスCと/26のホスト部ビット数と台数の計算"]],["図はアナログ信号を標本化・量子化したものである（量子化レベル0〜7）。9個の標本値をすべて2進数で記録するのに必要なビット数は？","27［ビット］","63［ビット］","9［ビット］","72［ビット］","量子化レベルは0〜7の8段階なので、1標本あたり2^3＝8より3［ビット］あれば表せる。標本化した点は1〜9の9個なので、必要なビット数は9×3＝27［ビット］となる。","","",["1標本あたりのビット数を最大レベル値7と取り違え、9×7とした値。","1標本を1ビットとして数えた値。8段階は1ビットでは表せない。","1標本を1バイト（8ビット）として計算した値で、必要以上のビット数になる。"],"","","q:figinfo_31"],["図はSNMPで使うMIBのオブジェクトツリーである（かっこ内は各ノードの番号）。dod＝1.3.6と表すとき、mib-2のオブジェクトIDはどれか？","1.3.6.1.2.1","1.3.6.1.2","1.3.6.2.1","1.2.1","オブジェクトIDはルートから順にノード番号をドットでつないで表す。iso(1)→org(3)→dod(6)→internet(1)→mgmt(2)→mib-2(1)とたどるので、1.3.6.1.2.1 となる。","","",["mgmtまでのオブジェクトIDで、最後のmib-2(1)が抜けている。","internet(1)を飛ばし、mgmt(2)とmib-2(1)をつないだ誤り。","dodより上のiso・org・dodの番号を省いた誤り。"],"","","q:figinfo_32"],["図の秘密鍵（共通鍵）暗号方式で、10人の利用者が互いに2人ずつ秘密に通信するとき、必要な鍵の総数は？","45［個］","90［個］","20［個］","10［個］","共通鍵暗号では送信側と受信側が同じ鍵を使うため、通信する2人の組ごとに別の鍵が1つ必要になる。10人から2人を選ぶ組合せは10×9÷2＝45通りなので、鍵の総数は45［個］となる。","","",["10×9で、同じ組（AとB、BとA）を重複して数えた値。","公開鍵暗号で1人に公開鍵と秘密鍵の2個ずつ必要な場合の総数。","1人1個の鍵とした誤り。共通鍵は通信する組ごとに必要である。"],"","","q:figinfo_33",["x:figinfo_33","10人の2人組は45通り＝共通鍵45個（完全グラフ）"]],["サブネットマスクが255.255.255.192（プリフィックス表記で/26）のネットワークで、割り当てられるホストの最大数は？（全ビット0と全ビット1は除く）","62［台］","64［台］","254［台］","26［台］","/26はネットワーク部が26ビットなので、ホスト部は32－26＝6［ビット］。ホスト部の組合せは2^6＝64通りで、全ビット0と全ビット1を除くと64－2＝62［台］となる。","","",["2^6をそのまま答えた値。ネットワークアドレスとブロードキャストアドレスを除いていない。","/24（クラスC相当）のホスト数。ホスト部のビット数を誤っている。","プリフィックス長の数値26をそのまま台数とした誤り。"],"","","",["x:figinfo_30","/26はホスト部6ビットで2^6−2＝62台"]],["100［MB］のファイルを伝送速度100［Mbps］の回線で送る。伝送効率が80［％］のとき、伝送時間は？","10［s］","8［s］","1.25［s］","1［s］","ファイル容量をビットに直すと100［MB］×8＝800［Mbit］。実効速度は100［Mbps］×0.8＝80［Mbps］。伝送時間＝800÷80＝10［s］となる。","","",["伝送効率80［％］を考慮せず、800÷100とした値。","MBをMbitに換算（×8）せず、100÷80とした値。","バイトとビットの換算も伝送効率も考慮せず、100÷100とした値。"],"","",""],["サンプリング周波数44.1［kHz］、量子化ビット数16［ビット］、ステレオ（2チャンネル）で60［s］録音したPCM音声のデータ量は約何［MB］か？","約10.6［MB］","約5.3［MB］","約84.7［MB］","約0.18［MB］","データ量＝サンプリング周波数×量子化ビット数×チャンネル数×時間＝44100×16×2×60＝84672000［ビット］。8で割ってバイトに直すと10584000［B］で、約10.6［MB］となる。","","",["チャンネル数2を掛け忘れた、モノラル録音のデータ量。","8で割ってバイトに換算していない、ビット単位（約84.7［Mbit］）の値。","1秒分のデータ量（44100×16×2÷8＝176400［B］）で、録音時間60［s］を掛け忘れた値。"],"","",""],["1920×1080画素、1画素あたり24［ビット］（RGB各8ビット）の静止画を圧縮せずに保存したときのデータ量は約何［MB］か？","約6.2［MB］","約49.8［MB］","約2.1［MB］","約0.26［MB］","画素数は1920×1080＝2073600。1画素は24［ビット］＝3［B］なので、2073600×3＝6220800［B］、約6.2［MB］となる。このように膨大になるため、JPEGなどの圧縮が必要になる。","","",["24［ビット］をバイトに換算せず、ビット数のまま計算した値。","1画素を1［B］とした値で、RGB3色分を考慮していない。","1画素を1［ビット］とした値で、白黒2値画像のデータ量にあたる。"],"","",""],["図はFAT（次クラスタ番号の一覧。未使用＝0、EOF＝ファイルの終わり）の例である。エントリの開始クラスタが2のファイルは、どの順番でクラスタに格納されているか？","2→4→5","2→3→4→5","2→3→4","2→4→5→6","FATは各クラスタの「次のクラスタ番号」を並べた表で、開始クラスタから順にたどる。クラスタ2の次クラスタは4、クラスタ4の次は5、クラスタ5はEOF（終わり）なので、ファイルは2→4→5の3つのクラスタに格納されている。クラスタは連続している必要はない。","","",["クラスタが番号順に連続して並ぶと考えた誤り。クラスタ3は未使用であり、FATの次クラスタ番号をたどる必要がある。","左列のクラスタ番号を順に読んだ誤り。2の次は表の「次クラスタ」欄の値4であり、3ではない。","EOFの意味を見落とした誤り。クラスタ5の次クラスタ欄はEOF（終）なので、ファイルはそこで終わる。"],"","","q:figinfo_38",["x:figinfo_38","FATの次クラスタをたどり2→4→5と格納される"]],["図のV字モデルで、詳細設計の成果物（設計書）を入力として行うテスト工程（ア）はどれか？","単体テスト","結合テスト","統合テスト（システムテスト）","コードレビュー","V字モデルでは、開発工程の各段階が、同じ高さのテスト工程と対応する。詳細設計（モジュール内部の設計）に対応するのは、モジュール単位でロジックの正しさを確認する単体テストである。単体テストではモジュールを呼び出すドライバと、モジュールが呼び出すスタブを用意する。","","",["方式設計に対応するテスト。単体テストが完了したモジュールを組み合わせて、設計書の仕様を満たすか確認する。","要件定義に対応するテスト。システム全体がユーザーの要件を満たしているかを確認する。","開発者どうしでソースコードを読み合う作業。V字モデルで設計工程と対になるテスト工程ではない。"],"","","q:figinfo_39",["x:figinfo_39","V字モデル：詳細設計に対応するのは単体テスト（原図）"]],["図はOSIモデルとTCP/IPプロトコルスタックの対応を示す。OSIモデルのアプリケーション層・プレゼンテーション層・セッション層に対応するTCP/IPの階層（ア）はどれか？","アプリケーション層","トランスポート層","ネットワーク・インターネット層","セッション層","TCP/IPでは、送られたデータをどう使うかは用途ごとにプロトコルが定義されるため、OSIの上位3層（アプリケーション層・プレゼンテーション層・セッション層）が一体となってアプリケーション層にまとめられている。一方、物理層とデータリンク層はネットワーク・インターネット層として一体になっている。","","",["OSIのトランスポート層に対応するTCP/IPの階層で、TCPやUDPが働く。上位3層には対応しない。","OSIの物理層とデータリンク層をまとめたTCP/IPの最下位の階層である。","OSIモデル第5層の名称。TCP/IPにはセッション層という独立した階層はない。"],"","","q:figinfo_40",["x:figinfo_40","OSI上位3層はTCP/IPのアプリケーション層（原図）"]],["図は2台の機器の間で、どの層で中継を行うかを示している。（イ）のように、物理層（OSI第1層）だけで電気信号の増幅など単純な中継を行う機器はどれか？","リピータ","スイッチ","ルータ","ゲートウェイ","ケーブルの電流増幅など、単純な物理的中継を行う機器はリピータで、OSI第1層（物理層）の機器である。複数のリピータポートをもつものをリピータハブという。図の（ア）はデータリンク層で中継するスイッチで、MACアドレスを解析して中継先を切り替える。","","",["MACアドレスを解析して内部スイッチを切り替える、OSI第2層（データリンク層）の機器で、図の（ア）にあたる。","IPアドレスを解析してパケットの経路を制御する、OSI第3層（ネットワーク層）の機器である。","プロトコルの異なるネットワークどうしを、上位層で変換して接続する機器である。"],"","","q:figinfo_41",["x:figinfo_41","物理層で中継するリピータとデータリンク層のスイッチ"]],["図はメールボックスからメールを受信するPOP3の基本シーケンスである。番号を指定してメールの受信を要求するコマンド（ア）はどれか？","RETR","LIST","DELE","QUIT","POP3（ポート番号110）では、USERとPASSで認証した後、LISTでメール件数やサイズを確認し、RETR nで指定した番号のメールの受信を要求する。サーバはメール本体を送り、その後DELE nで削除、QUITで終了する。","","",["メール件数やサイズなどのメール情報（着信リスト）を要求するコマンドで、本体は受信しない。","指定した番号のメールの削除を要求するコマンドで、受信の後に使う。","サーバとのセッションの終了を通知するコマンドで、メールの受信には使わない。"],"","","q:figinfo_42",["x:figinfo_42","POP3のシーケンス：RETR nでメール受信を要求（原図）"]],["図はアクティブFTPのシーケンスである。FTPサーバの制御用ポート（ア）とデータ転送用ポート（イ）の番号の組合せとして正しいものは？","（ア）21・（イ）20","（ア）20・（イ）21","（ア）25・（イ）110","（ア）21・（イ）80","FTPは制御用ポート（21）とデータ転送用ポート（20）の2つを使う。アクティブFTPでは、クライアントがサーバのポート21に接続してPORTコマンドで転送用ポートを指定し、サーバ側はポート20からコネクションを開設してファイルを転送する。","","",["制御用とデータ転送用を逆にした誤り。PORTやRETRなどのコマンドはポート21でやりとりする。","25はメール送信のSMTP、110はメール受信のPOP3のポート番号である。","80はWebページを転送するHTTPのポート番号で、FTPのデータ転送用ではない。"],"","","q:figinfo_43",["x:figinfo_43","アクティブFTP：制御ポート21と転送ポート20（原図）"]],["JPEGでは、図のように8×8画素のブロック単位でDCT（離散コサイン変換）を行う。横640×縦480画素の画像は、何個のブロックに分割されるか？","4800［個］","38400［個］","19200［個］","140［個］","横方向のブロック数は640÷8＝80、縦方向は480÷8＝60である。したがってブロック数は80×60＝4800［個］となる。総画素数で求めると、640×480＝307200画素を1ブロックの画素数8×8＝64で割って、307200÷64＝4800［個］でも同じである。","","",["総画素数307200を8で割った誤り。1ブロックは8×8＝64画素なので、64で割る必要がある。","総画素数を16で割った値で、4×4画素のブロックとみなした誤りである。","横のブロック数80と縦のブロック数60を足した誤り。ブロック数は掛け算で求める。"],"","","q:figinfo_44"],["図はJPEG符号化の流れである。色変換・ブロック化の後に行い、時間（空間）領域の信号を周波数成分に変換する処理（ア）はどれか？","DCT符号化（離散コサイン変換）","FFT（高速フーリエ変換）","標本化（サンプリング）","ADPCM（適応差分PCM）","JPEGでは、画像を輝度と色差に変換して8×8画素のブロックに分割し、ブロック単位でDCT（離散コサイン変換）を行って周波数成分に変換する。その後、人間が鈍感な高周波成分を粗く量子化して情報量を減らし、ハフマン符号化する。DCTは係数が実数で扱いやすい。","","",["DFTを高速に計算するアルゴリズム。係数が複素数となり扱いにくいため、画像圧縮では実数のDCTが使われる。","連続したアナログ信号を一定間隔で取り出す処理で、周波数成分への変換ではない。","主に音声の圧縮に使われる符号化方式で、隣接する値の差分を符号化する。"],"","","q:figinfo_45",["x:figinfo_45","JPEG符号化の流れ：ブロック化の後にDCT符号化（原図）"]],["図の公開鍵暗号方式で、受信者が暗号文を復号するときに使う鍵（イ）はどれか？","受信者の秘密鍵","受信者の公開鍵","送信者の秘密鍵","送信者と受信者の共通鍵","公開鍵暗号では、受信者が公開鍵と秘密鍵の1組を作り、公開鍵を送信者に配布する。送信者は受信者の公開鍵（ア）で暗号化し、受信者は自分だけが持つ秘密鍵（イ）で復号する。秘密鍵は正規の受信者しか持たないので、通信の秘密を守ることができる。","","",["送信者が暗号化に使う鍵（ア）で、公開されている。この鍵では復号できない。","送信者の秘密鍵は電子署名で使う鍵で、本人確認のために署名文を作るときに使う。","秘密鍵（共通鍵）暗号方式で、送信側と受信側が同じ鍵を使う場合の鍵である。"],"","","q:figinfo_46",["x:figinfo_46","公開鍵で暗号化し受信者の秘密鍵で復号する（原図）"]],["図はディジタル署名の仕組みである。送信データのハッシュ値を暗号化するときに使う鍵（ア）はどれか？","送信者の秘密鍵","送信者の公開鍵","受信者の公開鍵","受信者の秘密鍵","ディジタル署名は公開鍵暗号とハッシュ関数の組合せである。送信者はハッシュ値を自分の秘密鍵（ア）で暗号化して送る。受信者は送信者の公開鍵（イ）で復号し、受信データから求めたハッシュ値と一致すれば、本人が送ったもので改ざんもないと確認できる。","","",["受信者が復号（検証）に使う鍵（イ）である。公開されているので、これで暗号化しても本人の証明にならない。","受信者の公開鍵で暗号化するのは、通信内容を秘密にする公開鍵暗号の使い方である。","受信者の秘密鍵は受信者しか持たないため、送信者が署名に使うことはできない。"],"","","q:figinfo_47",["x:figinfo_47","ディジタル署名：送信者の秘密鍵で暗号化（原図）"]],["1セクタが512［バイト］、1クラスタが8セクタで管理されるファイルシステムに、10,000［バイト］のファイルを保存する。ディスク上で使われる領域は？","12288［バイト］","10240［バイト］","8192［バイト］","4096［バイト］","データはクラスタ単位で管理されるので、1クラスタは512×8＝4096［バイト］である。10000÷4096≒2.44なので、切り上げて3クラスタが必要になる。使われる領域は4096×3＝12288［バイト］となる。","","",["セクタ単位（512バイト）で切り上げた値。実際の管理単位はクラスタなので、4096バイト単位で切り上げる。","クラスタ数を切り捨てて2クラスタとした誤り。2クラスタではファイルが入りきらない。","1クラスタ分の容量だけを求めた誤り。ファイルサイズが1クラスタより大きいことを見落としている。"],"","","",["x:figinfo_48","10000バイトは4096バイトのクラスタ3つ分を使う"]],["最大周波数成分が20［kHz］のアナログ音声信号を、元の信号を完全に再現できるように標本化したい。サンプリング定理から求められる、必要な最低の標本化周波数は？","40［kHz］","20［kHz］","10［kHz］","44.1［kHz］","サンプリング定理（標本化定理）によると、信号が含む最大周波数成分の2倍以上の周波数で標本化すれば、ローパスフィルタを通して元の連続信号を再現できる。したがって最低の標本化周波数は20×2＝40［kHz］である。","","",["最大周波数と同じ値。2倍以上でないと元の信号を正しく再現できない。","最大周波数を2で割った誤り。標本化周波数は最大周波数の2倍以上が必要である。","音楽CDで実際に使われる標本化周波数で、40kHzより余裕をもたせた値。最低値ではない。"],"","","",["w:126_1","標本化周波数が低すぎて別の波に見えるエイリアシング",{"a":"Pluke","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:CPT-sound-nyquist-thereom-1.5percycle.svg"}]],["公開鍵暗号方式で、50人の利用者が互いに秘密に通信できるようにする。各利用者が公開鍵と秘密鍵を1組ずつ持つとき、必要な鍵の総数は？","100［個］","50［個］","1225［個］","2450［個］","公開鍵暗号では、各利用者が公開鍵と秘密鍵の1組（2個）を持てばよく、相手の公開鍵で暗号化して送ることで誰とでも通信できる。したがって鍵の総数は2×50＝100［個］である。秘密鍵暗号のように相手ごとに鍵を用意する必要はない。","","",["1人1個として数えた誤り。各利用者は公開鍵と秘密鍵の2個を持つ。","秘密鍵（共通鍵）暗号で2人ごとに1個の鍵を使う場合の数で、50×49÷2で求められる。","50×49で、2人の組合せを重複して数えた誤り。公開鍵暗号の鍵数とは異なる。"],"","","",["w:185_4","公開鍵で暗号化し秘密鍵で復号する公開鍵暗号",{"a":"Bananen🍌︎falter🦋︎","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Orange_blue_public_key_cryptography_en.svg"}]]]},{"id":"figqc","title":"図・計算問題（品質管理基礎）","cat":"図・計算","q":[["図は6個の測定データを数直線上に打点したものである。このデータの範囲Rはいくらか？","27","24","37","47","範囲Rは最大値と最小値の差で、R＝xmax－xmin で求める。図より最大値は37、最小値は10なので、R＝37－10＝27 となる。Rが大きいほどばらつきが大きく、R＝0ならすべて同じ値である。","","",["データの総和144を6で割った平均値24.0で、代表値であり範囲ではない。","最大値37そのもので、範囲を求めるときに最小値10を引き忘れている。","最大値と最小値を足した値37＋10で、差をとるべきところを和にしている。"],"","","q:figqc_1"],["図の記録用チェックシートで、不良個数の合計に対する「ラベル剥がれ」の割合はおよそいくらか？","39.1［％］","31.9［％］","64.2［％］","19.4［％］","合計欄を足すと不良個数の総数は 2＋17＋194＋158＋29＋8＋3＋60＋2＋23＝496［個］。ラベル剥がれは194個なので、194÷496×100≒39.1［％］となる。これがパレート図で読み取る「比（占有）率」である。","","",["ラベル汚れ158個の割合158÷496で、行を読み違えている。","194÷(496－194)で、剥がれ以外の個数で割ってしまった値。","194を1000で割ったような桁の誤りで、総数496で割っていない。"],"","","q:figqc_2",["x:figqc_2","パレート図：各項目の比率と累積比率（n＝496）"]],["図のパレート図で、総数n＝496［個］、剥がれ194［個］、汚れ158［個］である。汚れまでの累積比率はおよそいくらか？","71.0［％］","31.9［％］","39.1［％］","83.1［％］","累積比率は大きい順に個数を足し合わせ、総数で割って求める。剥がれと汚れの合計は 194＋158＝352［個］なので、352÷496×100≒71.0［％］。剥がれと汚れをなくせば問題の約7割が解決すると読み取れる。","","",["汚れ単独の比率158÷496で、剥がれの194個を累積していない。","剥がれ単独の比率194÷496で、1項目目までの累積比率。","充填量60個まで加えた412÷496で、3項目目までの累積比率。"],"","","q:figqc_3",["x:figqc_2","剥がれ39.1％、汚れまでの累積比率71.0％"]],["図のヒストグラムのように、真ん中が高く左右対称に近い分布の形を何というか？","一般型（正規分布型）","二山型","絶壁型","離れ小島型","ヒストグラムは測定値の範囲を区間に分け、各区間の度数を柱で表した図である。図は中央の区間が最も高く、左右へなだらかに低くなる対称な形で、一般型（正規分布型）とよばれる。問題のない工程や身長・体重などはこの形になる。","","",["山が2つある形で、異なる2つの分布が混ざっているときに現れる。","片側が切り立った形で、規格外品を取り除いた後のデータなどに現れる。","本体から離れた位置に小さな山がある形で、異常なデータの混入を示す。"],"","","q:figqc_4",["x:figqc_4","ヒストグラムの代表的な形：一般型と他の型の比較"]],["図の管理図（UCL：上部管理限界、CL：中心線、LCL：下部管理限界）から判断できる工程の状態として正しいものはどれか？","管理限界外の点があり、工程は安定状態ではない","すべての点がCL付近にあり、工程は安定状態である","規格外の製品が出ており、製品は不良品である","点の数が少ないため、工程の状態は判断できない","管理図では、すべての点が管理限界線（UCLとLCL）の内側にあり、点の並び方にくせがなければ工程は安定状態と判断する。図ではUCLの上とLCLの下に点が1つずつあるので安定状態ではなく、見逃せない原因があったと考えて処置をとる。","","",["UCLとLCLの外側に点が出ているので、安定状態とはいえない。","規格は製品について書かれるもので、管理図の管理限界とは別物である。","管理図は点が管理限界外に出たかどうかで判断でき、図から異常が読み取れる。"],"","","q:figqc_5"],["図のように、特定の結果（特性）と原因（要因）の関係を大骨・中骨・子骨で系統的に表したQC七つ道具はどれか？","特性要因図","散布図","系統図法","連関図法","特性要因図は、特定の結果と原因系との関係を系統的に表した図で、魚の骨に似ていることから「魚の骨図」ともよばれる。特性に対して大骨、大骨に対して中骨、中骨に対して子骨が原因になるよう矢印で表すのがポイントである。","","",["2つの特性を横軸と縦軸にとって打点し、相関を見るグラフである。","目的を達成する手段を多段に展開していく、新QC七つ道具の手法である。","原因と結果が複雑に絡む問題の因果関係を矢印でつなぐ新QC七つ道具の手法である。"],"","","q:figqc_6",["w:063_0","特性と要因を大骨・中骨・小骨で表した特性要因図",{"a":"FabianLange at de.wikipedia","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Ishikawa_Fishbone_Diagram.svg"}]],["図は充填時間と充填量の関係を表した散布図である。2つの特性の関係として正しいものはどれか？","正の相関がある","負の相関がある","相関はない","曲線的な関係で相関はない","散布図は2つの特性を横軸と縦軸にとり、測定値を打点したグラフである。図では充填時間が長くなるほど充填量も増え、点が右上がりに直線的に並んでいるので、正の相関があると読み取れる。右下がりなら負の相関である。","","",["点が右下がりに並ぶ場合で、一方が増えると他方が減る関係である。","点がばらばらに散らばり、右上がりや右下がりの傾向がない場合である。","点が直線ではなく曲線状に並ぶ場合で、図の直線的な並び方とは異なる。"],"","","q:figqc_7",["x:figqc_7","散布図の点の並び方：正の相関・負の相関・相関なし"]],["大きさ50の部品ロット（番号1〜50）から図の乱数表で8個抜き取る。出発点を18行1列の37とし右へ読み、51以上は50を引き、すでに出た番号は飛ばす。7番目に抜き取る部品番号は？","32","15","65","3","18行目を右へ読むと37、65、62、77、68、73、65、15、32、53。51以上から50を引くと 37、15、12、27、18、23 となり、次の65→15と15はすでに出ているので飛ばす。よって7番目は32、8番目は53－50＝3となる。","","",["重複を飛ばさずに7個目の65－50＝15をそのまま採用した値。","50を引かずに乱数をそのまま読んだ値で、部品番号に存在しない。","8番目に抜き取る部品番号（53－50）で、1つ数え間違えている。"],"","","q:figqc_8",["x:figqc_8","乱数を番号に直し重複を飛ばして7番目が32となる"]],["図は品質の二元的表現である。イの曲線（充足しても満足は得られないが、不充足だと不満を引き起こす）が表す品質要素はどれか？","当たり前品質要素","魅力的品質要素","一元的品質要素","無関心品質要素","狩野先生が提案した品質の二元的表現では、横軸に機能充足の程度、縦軸に満足の程度をとる。イは充足しても満足は増えず、不充足だと強い不満になる曲線で、当たり前品質要素である。ブレーキを踏むと車が止まる機能などが該当する。","","",["アの曲線で、充足されれば満足を与え、不充足でも不満を覚えない要素である。","充足すれば満足、不充足なら不満となる直線的な関係の要素である。","充足しても不充足でも満足や不満に影響しない要素で、イの曲線とは異なる。"],"","","q:figqc_9",["x:figqc_9","品質の二元的表現：魅力的品質と当たり前品質（原図）"]],["図はPDCAサイクルを表している。（ア）に入るものはどれか？","Check：確認","Do：実施","Act：処置","Plan：計画","管理とはPDCAのサイクルを回すことである。Plan：計画で仕事のできばえとやり方を決め、Do：実施で決めたやり方どおりに仕事をし、Check：確認でできばえを確認し、Act：処置でできばえ・やり方に処置をとる。DoとActの間に入る（ア）はCheckである。","","",["決めたやり方通りに仕事をする段階で、図の右下にすでに示されている。","できばえ・やり方に処置をとる段階で、図の左上にすでに示されている。","仕事のできばえとやり方を決める段階で、図の右上にすでに示されている。"],"","","q:figqc_10",["x:figqc_10","PDCAサイクル：Plan・Do・Check・Act（原図）"]],["図は新QC七つ道具と課題達成の手順の関係を表している。（ア）に当てはまる手法はどれか？","アロー・ダイヤグラム法、PDPC法","親和図法、連関図法","系統図法、マトリックス図法","特性要因図、散布図","新QC七つ道具は主に課題達成について言語情報を整理する手法である。課題の構築には親和図法・連関図法、手段の展開と選択には系統図法・マトリックス図法・マトリックス・データ解析法、実行計画の作成にはアロー・ダイヤグラム法・PDPC法が役立つ。","","",["課題の構築の段階で使う手法で、図の一番上にすでに示されている。","手段の展開と選択の段階で使う手法で、図の中段に示されている。","新QC七つ道具ではなくQC七つ道具で、因果関係を使うときに役立つ道具である。"],"","","q:figqc_11",["x:figqc_11","課題達成の手順と新QC七つ道具の対応（原図）"]],["ある部品の長さを5個測定したところ、10.2、9.8、10.5、9.6、10.1［mm］であった。平均値はいくらか？","10.04［mm］","10.1［mm］","0.9［mm］","12.55［mm］","平均値はデータの総和をデータ数で割った値で、x̄＝Σxi／n で求める。総和は 10.2＋9.8＋10.5＋9.6＋10.1＝50.2［mm］、データ数は5なので、50.2÷5＝10.04［mm］。データ数が少ないときは測定値より一桁下まで表示する。","","",["データを大きさの順に並べた中央の値（メディアン）で、平均値ではない。","最大値10.5と最小値9.6の差で、範囲Rでありばらつきを表す。","総和50.2をデータ数5ではなく4で割ってしまった値で、平均値ではない。"],"","",""],["ある工程で製品800［個］を検査したところ、不良個数が12［個］であった。不良率はいくらか？","1.5［％］","0.015［％］","15［％］","1.52［％］","不良率は 不良個数÷検査個数 で求める。12÷800＝0.015 で、百分率にすると 0.015×100＝1.5［％］となる。なお不良率は小数点が意味を持つが、分子の不良個数が数えて得られる値なので計数値として扱う。","","",["比の値0.015に［％］を付けたもので、100倍し忘れている。","小数点の位置を1桁誤った値で、12÷80を計算したことに相当する。","12÷788で、検査個数ではなく良品の個数で割ってしまった値。"],"","",""],["次のデータのうち、計数値（数えて得られるデータ）はどれか？","クレーム件数","身長［cm］","体重［kg］","充填量［g］","数値データは、測って得られる計量値（連続量）と、数えて得られる計数値（離散量）に分かれる。小数点を打って意味があるものが計量値、意味がないものが計数値である。クレーム件数は1.5件のような値に意味がないので計数値である。","","",["測って得られ、164.5のように小数点が意味を持つので計量値である。","測って得られ、62.8のように小数点が意味を持つので計量値である。","はかりで測って得られる連続量で、小数点が意味を持つので計量値である。"],"","",""],["特性要因図で要因を挙げるときに用いる4Mに含まれないものはどれか？","Measurement（測定）","Man（人）","Machine（機械・設備）","Method（方法）","要因として、人（Man）、機械・設備（Machine）、原材料（Material）、方法（Method）の4つの頭文字をとって4Mという。さらに測定（Measurement）、環境（Environment）、時間（Time）を加えたものを5METとよぶ。測定は5METの要素で4Mには含まれない。","","",["人によって結果が異なるかを見る要因で、4Mの1つに含まれる。","機械・設備によって結果が異なるかを見る要因で、4Mの1つである。","方法によって結果が異なるかを見る要因で、4Mの1つである。"],"","","",["x:figqc_15","要因の例：4M（人・機械・原材料・方法）と5MET"]],["層別を行うときの層の分け方として適切なものはどれか？","層内はできるだけ均一に、層間の差は大きくなるように分ける","層内の差が大きく、層間はできるだけ均一になるように分ける","データ数が等しくなるように機械的に分ける","測定した順番に一定の個数ずつ分ける","層別とは母集団をいくつかの層に分けることで、層内はできるだけ均一に、層間の差は大きくなるように行うと有効である。機械別、作業方法別、原材料別、作業者別などのように共通点や特徴に着目して分け、層を比較して問題解決の手がかりを見つける。","","",["均一にする対象と差を大きくする対象が逆で、層を比べても違いが見えにくい。","個数だけで分けても共通点や特徴に着目していないので、層別の意味がない。","順番で区切るだけでは機械や作業者などの違いが層に反映されない。"],"","",""],["「重点指向する」というQC的考え方に役立つQC七つ道具はどれか？","パレート図","ヒストグラム","散布図","チェックシート","重点指向とは、重要な問題、影響の大きな原因、効果の大きな対策を選び、そこへ資源を集中させることである。パレート図は項目を出現度数の大きい順に並べ累積比率を示すので、どの項目から手を打てばよいかが分かり、重点指向に役立つ。","","",["ばらつきを尺度とする考え方に役立つ道具で、分布の形や規格との関係を見る。","因果関係を使う考え方に役立つ道具で、2つの特性の関係を見る。","事実で判断する考え方に役立つ道具で、データを簡単に集めるためのシートである。"],"","","",["x:figqc_42","QC的考え方と役立つQC七つ道具の対応表"]],["新QC七つ道具のうち、言語データではなく数値データを扱う手法はどれか？","マトリックス・データ解析法","親和図法","連関図法","PDPC法","新QC七つ道具は主に課題達成について言語情報を整理し、知恵を出す手法である。親和図法、連関図法、系統図法、マトリックス図法、アロー・ダイヤグラム法、PDPC法は言語情報を扱うが、マトリックス・データ解析法だけは数値データを扱う。","","",["言語データを似たもの同士でまとめる手法で、課題の構築に使う。","原因と結果の関係を矢印で整理する言語データの手法で、課題の構築に使う。","実行計画の作成に使う手法で、予想される事態への対応を言語で整理する。"],"","","",["w:182_1","数値データの散布図と主成分の方向（主成分分析）",{"a":"Nicoguaro","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:GaussianScatterPCA.svg"}]],["サンプリングと測定を行うと、得られたデータは母集団の真の値からずれる。このとき必ず発生する2つの誤差の組合せはどれか？","サンプリング誤差と測定誤差","サンプリング誤差と計算誤差","測定誤差と丸め誤差","系統誤差と偶然誤差","サンプルは母集団の一部なので、誰が（何が）抜き取られたかによって値が変わるサンプリング誤差が生じる。さらに測定する際にも測定誤差が生じる。この2つは必ず発生するので、ランダムサンプリングや測定方法の検討が重要になる。","","",["計算の誤差ではなく、測定の段階で生じる誤差がもう1つの誤差である。","丸め誤差は数値の桁処理の誤差で、サンプリングで生じる誤差が抜けている。","測定誤差の性質による分類で、サンプリング誤差が含まれていない。"],"","",""],["品位推定の対象となり、一定のサイズで定まっているため有限母集団として扱うものはどれか？","ロット","工程","サンプル","データ","モノづくりの母集団には無限母集団と有限母集団がある。工程管理や工程解析では工程が母集団で、継続して物を作り続けるので無限母集団と考える。一方、品位推定の対象であるロットは一定のサイズで定まっているので有限母集団である。","","",["製品・サービスを作り出す源泉で、作り続けるので無限母集団として扱う。","母集団から抜き取られた構成要素（標本・試料）で、母集団そのものではない。","サンプルを測定して得られるもので、そこから母集団を推測する材料であり母集団ではない。"],"","","",["x:figqc_41","無限母集団（工程）と有限母集団（ロット）"]],["図は管理技法の階層構造を表している。（ア）に入る管理はどれか？","原価管理","方針管理","日常管理","設備管理","図では「儲かる」ための売価と原価、「売れる」ための質と量、その底辺の5Sに、それぞれ管理が対応する。売価には利益管理、原価には原価管理、質には品質管理、量には生産管理、5Sには現場管理が対応する。妥当な原価設定を行う原価管理が（ア）に入る。","","",["経営計画に基づく目標と方策を全部門に展開する管理活動で、階層構造の項目ではない。","各部門が分掌業務を日常的に確実に行うための管理で、原価には対応しない。","設備の保全や稼働を扱う管理で、図の管理技法の階層構造には含まれない。"],"","","q:figqc_21",["x:figqc_21","管理技法の階層：原価には原価管理が対応（原図）"]],["図は品質管理の歴史を表している。ア〜エは補償、検査、製造、設計のいずれかである。品質管理の重点が移ってきた順に並べたものはどれか？","ア→ウ→エ→イ","ア→イ→ウ→エ","イ→エ→ウ→ア","ウ→ア→エ→イ","最初は消費者保護に応える補償（ア）、補償ロスを避けて抜取検査による検査（ウ）、検査ロスを避けて統計的工程管理による製造（エ）、製造ロスを避けて品質機能展開による設計（イ）へと一つずつフェーズが戻った。よって補償→検査→製造→設計の順になる。","","",["区画を左上から順に読んだだけの並びで、図の矢印の流れと合わない。","設計→製造→検査→補償という、これから仕事を進めたい流れで、歴史の順ではない。","検査を最初に置いた並びで、補償が最初に生まれたことと合わない。"],"","","q:figqc_22",["x:figqc_22","品質管理の重点の移り変わり：補償→検査→製造→設計"]],["図は品質の種類と、その関係を表している。（イ）に入る品質はどれか？","設計品質（ねらいの品質）","使用品質（要求の品質）","製造品質（できばえの品質）","魅力的品質","（イ）は「製造の目標としてねらった品質」なので設計品質（ねらいの品質）である。上の（ア）は使用者の要求する品質で使用品質、下の（ウ）は実際の製品の品質で製造品質。3つの品質が互いに合致することが重要である。","","",["使用者の要求する品質（要求の品質）で、図では一番上の（ア）に当たる。","設計品質をねらって作った製品の実際の品質で、図の（ウ）に当たる。","充足されれば満足を与え、不充足でも不満を覚えない品質要素で、品質の二元的表現の用語。"],"","","q:figqc_23",["x:figqc_23","使用品質・設計品質・製造品質の関係（原図）"]],["図は卵を例にした2つの品質を表している。（ア）に入る品質はどれか？","工程（Process）の品質","設計品質（ねらいの品質）","使用品質（要求の品質）","魅力的品質","良い卵（製品）は健康な鶏から生まれる。鶏に当たるのが、製品を生み出す工程（Process）の品質で、仕事のやり方の品質、業務品質ともいう。製品の品質（仕事のできばえの品質）だけでなく、工程の品質を確かなものにすることが重要である。","","",["製造の目標としてねらった品質で、製品と工程の区別とは別の分類。","使用者が要求する品質で、製品を生み出す仕事のやり方の品質ではない。","充足されれば満足を与え、不充足でも不満を覚えない品質要素を指す。"],"","","q:figqc_24",["x:figqc_24","製品（卵）の品質と工程（鶏）の品質（原図）"]],["図は方針管理の活動をPDCAサイクルに当てはめたものである。（ア）に入る活動はどれか？","期末での評価","応急処置","作業標準の作成","抜取検査","（ア）はCheck（確認）の区画で、定期的な実施状況のチェックとともに期末での評価を行う。期末での評価は会社のトップ自らが行うので、社長診断またはトップ診断と呼ばれる。未達であれば目標や方策を見直す処置を行い、次期方針へ展開する。","","",["日常管理で管理水準を満たさないときに取る、できばえへの処置。","標準化の活動の一つで、方針管理のPDCAのどの区画にも当たらない。","ロットから一部を取り出して検査する方法で、方針管理の活動ではない。"],"","","q:figqc_25",["x:figqc_25","方針管理のPDCA：Checkに期末での評価（原図）"]],["図は日常管理の活動をPDCAサイクルに当てはめたものである。（ア）に入る活動はどれか？","管理項目の管理水準との対比","会社方針・重点課題の明確化","次期方針への展開","抜取検査の実施","日常管理では、分掌業務の確認、管理項目と管理水準の設定、手順の設定（P）の後、手順に従って実施（D）し、仕事のできばえである管理項目を管理水準と対比（C）する。水準を満たさなければ応急処置と、原因追及・恒久処置（A）を取る。","","",["方針管理のPlanで行う活動で、日常管理のCheckではない。","方針管理のActで行う活動で、期末評価の結果を翌期の方針につなげるもの。","検査の方法の一つで、日常管理のPDCAの区画には当たらない。"],"","","q:figqc_26",["x:figqc_26","日常管理のPDCA：管理項目と管理水準の対比（原図）"]],["図は方針管理と日常管理の関係を表したもので、A〜Dは係方針実施項目、○は日常業務との関連を示す。業務3と関連している係方針実施項目はどれか？","B","A","C","D","業務3の横線をたどると、左から2本目の縦線との交点に○がある。よって業務3は係方針実施項目Bと関連している。方針管理の実施項目が日常業務に落とし込まれる（マッチングされる）ことで、方針管理がうまくいく。","","",["業務1の横線上の○と交わる項目で、業務3とは関連していない。","業務2の横線上の○と交わる項目で、業務3とは関連していない。","図ではどの業務の横線とも○で結ばれておらず、日常業務と関連していない項目。"],"","","q:figqc_27",["x:figqc_27","方針管理と日常業務の関連：業務3はBと関連"]],["図は因果関係を表している。過去の仕事のやり方に取る処置（ア）と、現在の仕事のできばえに取る処置（イ）の組合せとして正しいものはどれか？","ア：恒久処置、イ：応急処置","ア：応急処置、イ：恒久処置","ア：事実で判断、イ：重点指向","ア：恒久処置、イ：標準化","結果（仕事のできばえ）は現在、原因（仕事のやり方）は過去にある。できばえに取る処置が応急処置（Band-aid Action）、やり方に手を打つ処置が恒久処置（Permanent Action）である。応急処置だけで終わらせず、恒久処置も取ることが重要である。","","",["2つの処置を入れ替えた誤り。けがの止血のように結果に取る処置が応急処置である。","いずれもQC的考え方の5つの項目の名前で、できばえややり方への処置の名称ではない。","標準化は標準を設定し活用する組織的行為で、できばえへの処置ではない。"],"","","q:figqc_28",["x:figqc_28","因果関係：やり方に恒久処置、できばえに応急処置"]],["図は管理と、悪いところを改めて善くする活動との関係を表している。（ア）に入るものはどれか？","改善","標準化","処置","検査","PDCAサイクルを回す「管理」だけでは、環境や方向性が変わるとうまくいかなくなる。そこで悪いところを改めて善くする「改善」（ア）を行ってレベルを上げ、上がった所でまた管理を行う。これを続けていくことを継続的改善という。","","",["標準を設定し、これを活用する組織的行為で、レベルを引き上げる段階の名称ではない。","PDCAのAct（処置）でサイクルの中の一段階に当たり、図の段差の部分ではない。","できばえを調べる活動で、悪いところを改めて善くする活動ではない。"],"","","q:figqc_29",["x:figqc_29","管理と改善を繰り返す継続的改善（原図）"]],["図は「あるべき姿」と「現状」のずれを問題として表したものである。現状を調べるときの（ア）に入る考え方はどれか？","3現主義","5ゲン主義","重点指向","5S","現状は「現場で、現物を、現実的に」見る3現主義で調べる。あるべき姿は買い手や後工程など「誰にとって」望ましいかを定義する。両者のずれが問題であり、どちらが欠けても問題は形成されない。","","",["3現主義に「原理・原則で考える」を加えたもので、図の3項目だけでは足りない。","最も重要な項目を選び資源を集中する考え方で、現状の調べ方ではない。","整理・整頓・清掃・清潔・躾のことで、現状を調べる考え方ではない。"],"","","q:figqc_30",["x:figqc_30","あるべき姿と現状のずれ：現状は3現主義で調べる"]],["方針管理で不良率を4.0［％］から2.0［％］に下げる目標を立てた。期末の実績は2.5［％］であった。改善目標に対する達成率はいくらか？","75［％］","80［％］","62.5［％］","37.5［％］","目標の改善幅は4.0－2.0＝2.0［％］、実際の改善幅は4.0－2.5＝1.5［％］。達成率＝1.5÷2.0×100＝75［％］。期末での評価で未達とわかれば、目標や方策を見直す処置を取る。","","",["目標値÷実績値（2.0÷2.5）を計算した値で、改善幅で比べていない。","実績値÷改善前の値（2.5÷4.0）で、改善後に残っている割合を求めている。","実際の改善幅を改善前の値で割った値（1.5÷4.0）で、改善率であり達成率ではない。"],"","",""],["1日に2,000［個］生産する工程で、不良率を10［％］から4［％］に改善した。不良品1個あたりの損失が400［円］のとき、1日あたりの損失金額の削減額はいくらか？","48,000［円］","80,000［円］","32,000［円］","4,800［円］","不良個数は改善前2,000×0.10＝200［個］、改善後2,000×0.04＝80［個］で、120［個］減る。削減額＝120×400＝48,000［円］。不良率の差6［％］を使い、2,000×0.06×400と求めてもよい。","","",["改善前の1日の損失金額（200個×400円）で、削減額ではない。","改善後もなお残る1日の損失金額（80個×400円）で、削減額ではない。","6［％］を0.006として計算した、百分率の換算ミスによる値。"],"","",""],["ある職場で発生した不良は20種類、合計500［件］であった。二八の原理（20％－80％の原理）に従うとすると、上位何種類の不良で約何件を占めると考えられるか？","4種類で約400［件］","16種類で約400［件］","4種類で約100［件］","16種類で約100［件］","二八の原理では、問題の80％は20％の種類で占められる。種類は20×0.2＝4種類、件数は500×0.8＝400［件］。この少数の重要な項目（Vital few）に資源を集中するのが重点指向である。","","",["種類を80％（20×0.8）としてしまった誤り。多数の些細な項目（Trivial many）の側である。","件数を80％ではなく20％（500×0.2）で計算してしまった誤り。","種類と件数の割合をどちらも逆にした値で、Trivial manyの側に当たる。"],"","","",["w:089_3","上位少数の不良項目が大半を占めるパレート図",{"a":"DanielPenfield","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Pareto_chart_of_titanium_investment_casting_defects.svg"}]],["日常管理で、管理項目「不良率」の管理水準を1.0［％］以下と定めた。ある日、製品1,200［個］中に不良が15［個］あった。この日の不良率と判定として正しいものはどれか？","1.25［％］で管理水準を満たしていない","1.25［％］で管理水準を満たしている","0.125［％］で管理水準を満たしている","12.5［％］で管理水準を満たしていない","不良率＝15÷1,200×100＝1.25［％］。管理水準1.0［％］を超えているので水準を満たしていない。この場合はその日のうちに応急処置を取り、さらに原因を追及して恒久処置を取る。","","",["計算は正しいが、1.25［％］は1.0［％］を超えるので判定が逆である。","百分率にするとき100を掛け忘れ、さらに10で割った桁の誤り。","百分率にするとき100を掛ける代わりに1,000を掛けてしまった桁の誤り。"],"","",""],["5人で8［時間］かけて1,200［個］作っていた工程を改善し、4人で8［時間］で1,120［個］作れるようになった。1人1時間あたりの生産性はおよそ何％変化したか？","約16.7［％］向上","約6.7［％］低下","約14.3［％］向上","5［％］向上","生産性は「何人が何時間でどのぐらいのモノを作れるか」で表す。改善前1,200÷（5×8）＝30［個/人・時］、改善後1,120÷（4×8）＝35［個/人・時］。変化率＝（35－30）÷30×100≒16.7［％］の向上。","","",["人数と時間を考えず、生産量（1,200→1,120）だけを比べた値。","増えた量5を改善後の35で割った値で、基準を取り違えている。","生産性の差5［個/人・時］を、そのまま変化率［％］と読み違えた値。"],"","",""],["図は女子7人と男子9人の身長をドットプロットしたものである（各点は1［cm］単位の値）。女子の身長の平均値はいくらか？","157.0［cm］","158.0［cm］","14.0［cm］","171.0［cm］","女子の点を読むと151、152、155、156、158、162、165［cm］である。平均値＝データの総和÷データ数＝(151＋152＋155＋156＋158＋162＋165)÷7＝1099÷7＝157.0［cm］。データ数が少ないので平均値は測定値より一桁下まで表示する。","","",["最小値と最大値の中間(151＋165)÷2の値で、データの総和を使っていないため平均値ではない。","最大値165－最小値151で求めた女子の範囲Rで、代表値ではなくばらつきを表す。","男子9人の平均値1539÷9の値で、女子の平均値ではない。図の下段を読んだ誤り。"],"","","q:figqc_36",["x:figqc_36","女子・男子の身長のドットプロットと平均値（原図）"]],["図は問題解決の手順（QCストーリー）を表している。手順3の（ア）に入るものはどれか？","目標の設定","方策の立案","原因の究明","成功シナリオの追求","問題解決の手順は、テーマの選定→現状の把握→目標の設定→活動計画の作成→要因の解析→対策の検討と実施→効果の確認→標準化と管理の定着の8手順である。手順3では現状の把握をもとに「何を、いつまでに、どれくらいに」を決める目標を設定する。","","",["課題達成型QCストーリーで方策を考える手順で、問題解決の手順3ではない。","問題解決の流れで原因を探ることを指すが、手順としては要因の解析にあたる。","課題達成型QCストーリーの手順5で、方策を実行に移す段階である。"],"","","q:figqc_37",["x:figqc_37","問題解決の8手順：手順3は目標の設定（原図）"]],["図は問題解決の流れを表している。あるべき姿・望ましい状態と現状とのずれを定義する範囲（ア）を何というか？","問題の形成","現状の把握","課題達成","標準化と管理の定着","あるべき姿・望ましい状態と現状のずれ（問題）を定義することを「問題の形成」という。原因の究明から解決策の選択までが狭義の「問題の解決」で、全体が広義の問題解決となる。問題がないところに解決はないため、問題の形成が最も重要とされる。","","",["QCストーリーの手順2で、現状を調べる作業を指す。ずれの定義全体の名称ではない。","あるべき姿が決まっていないときに、ありたい姿を創り出して取り組む活動である。","効果のあった対策が後戻りしないよう標準を作り定着させる最終手順である。"],"","","q:figqc_38",["x:figqc_38","問題の形成から解決策の選択までの流れ（原図）"]],["図は問題解決型と課題達成型のQCストーリーを比較したものである。課題達成型の手順4（ア）に入るものはどれか？","方策の立案","要因の解析","原因の究明","現状の把握","課題達成型はあるべき姿が決まっていない状態で、ありたい姿を創り出す設計的アプローチである。原因を探るのではなく、手順4で方策を立案し、手順5で成功シナリオの追求と実施を行う。手順1、3、6、7は問題解決型と共通である。","","",["問題解決型の手順4で、原因を明らかにする解析的アプローチの手順である。","問題解決型で原因を追究する考え方で、課題達成型の手順ではない。","問題解決型の手順2の内容で、課題達成型では攻め所と目標の設定となる。"],"","","q:figqc_39",["x:figqc_39","問題解決型と課題達成型QCストーリーの比較（原図）"]],["図は母集団とサンプルの関係を表している。得られたデータから母集団の状態を推し量る（ア）の働きを何というか？","推測","サンプリング","測定","層別","母集団から構成要素の一部を抜き取ることがサンプリング、抜き取ったサンプルを測ってデータを得ることが測定である。そのデータから母集団の状態を推し量ることを推測といい、処置（アクション）は母集団に対して行う。","","",["母集団の構成要素の一部を抜き取る操作で、図では母集団からサンプルへの矢印である。","サンプルを測ってデータを得る操作で、図ではサンプルからデータへの矢印である。","データを共通点や特徴でグループに分ける手法で、図の流れには含まれない。"],"","","q:figqc_40",["x:figqc_40","母集団・サンプル・データと推測の関係（原図）"]],["図は無限母集団と有限母集団を表している。工程管理・工程解析の対象となる無限母集団（ア）はどれか？","工程","ロット","サンプル","データ","工程は製品・サービスを作り出す源泉で、明日も明後日も継続してモノを作り続けるため無限母集団と考える。工程からサンプリングしたものがロット、ロットから抜き取ったものがサンプルで、測定してデータを得て工程を推測する。","","",["一定のサイズで定まる有限母集団で、工程ではなく品位推定の対象である。","母集団から抜き取られた構成要素（標本、試料）で、母集団そのものではない。","サンプルを測定して得られる値で、母集団を推測するための材料である。"],"","","q:figqc_41",["x:figqc_41","工程（無限母集団）からロット・サンプルへ（原図）"]],["図はQC的考え方とQC七つ道具の関係を表している。「ばらつきを尺度とする」ときに役立つ道具（ア）はどれか？","ヒストグラム・管理図","チェックシート・パレート図","散布図・層別","親和図法・連関図法","違い・差をばらつきという尺度でとらえるのが「ばらつきを尺度とする」考え方である。製品の特性値の分布を見るヒストグラムと、工程のばらつきが安定しているかを見る管理図が役立つ。事実で判断する→チェックシート、重点指向→パレート図である。","","",["チェックシートは事実で判断する、パレート図は重点指向するための道具である。","散布図と層別は、特性要因図とともに因果関係を使うときに役立つ道具である。","新QC七つ道具の手法で、主に言語データを整理する課題の構築に使う。"],"","","q:figqc_42",["x:figqc_42","QC的考え方とQC七つ道具の対応表（原図）"]],["図はヒストグラム（規格に対する製品の良否）と管理図（工程の安定・異常）の組合せを表している。「××」が示す状態として正しいものはどれか？","不良品が作られ、工程も安定していない状態","良品は作られているが、工程が安定していない状態","工程は安定しているが、不良品が作られている状態","良品を安定して生産している状態","規格はヒストグラムに書かれ製品の良否が分かり、管理限界は管理図に書かれ工程の安定が分かる。ヒストグラムが不良で管理図が異常の欄が「××」で、不良品が作られ工程も安定していない最も悪い状態である。目指すのは◎の状態である。","","",["ヒストグラム良・管理図異常の「×」の欄で、偶然良品ができている状態である。","ヒストグラム不良・管理図安定の「×」の欄で、安定して不良を作っている状態である。","ヒストグラム良・管理図安定の「◎」の欄で、良品を安定して作る目指すべき状態である。"],"","","q:figqc_43",["x:figqc_43","ヒストグラムと管理図の組合せによる判定（原図）"]],["不良項目別の不良個数が、A：126、B：78、C：48、D：24、E：15、その他：9［個］であった。パレート図を作ったとき、累積比率が初めて80［％］を超えるのは上位何項目までを合計したときか？","上位3項目（A〜C）","上位2項目（A〜B）","上位4項目（A〜D）","上位5項目（A〜E）","総数n＝126＋78＋48＋24＋15＋9＝300［個］。累積比率はA：126÷300＝42.0［％］、A〜B：204÷300＝68.0［％］、A〜C：252÷300＝84.0［％］となり、上位3項目で初めて80［％］を超える。この3項目に重点指向して対策すると効果が大きい。","","",["A〜Bの累積比率は68.0［％］で、まだ80［％］に届いていない。","累積比率は92.0［％］で、80［％］は1項目前ですでに超えている。","累積比率は97.0［％］で、その他を除く全項目を合計した値である。"],"","","",["x:figqc_44","パレート図：上位3項目で累積比率84.0％"]],["部品の寸法50個を測定し、区間ごとの度数を数えた。9.5〜10.5：4、10.5〜11.5：12、11.5〜12.5：20、12.5〜13.5：10、13.5〜14.5：4［個］。規格上限が12.5［mm］のとき、規格を超えるものの割合は？","28.0［％］","8.0［％］","20.0［％］","72.0［％］","規格上限12.5［mm］を超えるのは区間12.5〜13.5と13.5〜14.5で、度数は10＋4＝14［個］。割合＝14÷50×100＝28.0［％］。ヒストグラムに規格値を書き入れると、上側に不良が出ているといった規格に対する状態が読み取れる。","","",["最も右の区間13.5〜14.5の4個だけを数え、12.5〜13.5の区間を落とした値である。","区間12.5〜13.5の10個だけを数え、13.5〜14.5の4個を落とした値である。","規格上限以下に入っている36個の割合で、規格外ではなく規格内の割合である。"],"","","",["x:figqc_45","規格上限12.5を超える区間の度数14個（28.0％）"]],["管理図の中心線CL＝50.0、上部管理限界UCL＝54.0、下部管理限界LCL＝46.0である。打点した値が49、52、55、51、47、45、50、53のとき、管理限界外の点は何点か？","2点","1点","0点","5点","UCL＝54.0を超える点は55、LCL＝46.0を下回る点は45で、管理限界外の点は2点である。管理限界外の点があるので工程は安定状態ではなく、見逃せない原因があったと判断し、原因に処置をして工程を安定状態に保つ。","","",["上側の55だけを数え、LCLを下回る45を見落とした値である。","55と45を管理限界内と見誤った値で、UCL・LCLとの大小比較の誤りである。","中心線から2以上離れた点（52、55、47、45、53）を数えた値である。"],"","","",["x:figqc_46","管理図：UCL・LCLの外側の点は55と45の2点"]],["記録用チェックシートで、ある不良項目の記録は5本ずつのまとまり（4本の斜線を5本目で消したもの）が7つと、端数が3本であった。全不良個数が95［個］のとき、この不良項目の占める割合はおよそいくらか？","40.0［％］","32.6［％］","36.8［％］","38.0［％］","5本ずつのまとまりが7つで5×7＝35［個］、端数3本を加えて38［個］。割合＝38÷95×100＝40.0［％］。チェックシートでは5本目の斜線でまとまりを作ることで、集計の際に数えやすくなる。","","",["まとまりを4本ずつと数え、4×7＋3＝31［個］として計算した値である。","端数の3本を加え忘れ、35［個］として35÷95で計算した値である。","個数38［個］をそのまま割合［％］と取り違え、全不良個数で割っていない値である。"],"","","",["w:210_1","4本の縦線を5本目の斜線で束ねる画線記録",{"a":"derivative work: dbabbitt (talk) =: Bdesham","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Tally_marks-Five-bar_Gate.svg"}]],["3日間の検査結果は、1日目：検査400［個］不良8［個］、2日目：検査250［個］不良6［個］、3日目：検査500［個］不良9［個］であった。不良率が最も高い日とその値はどれか？","2日目、2.4［％］","3日目、1.8［％］","1日目、2.0［％］","3日間とも同じ、2.0［％］","不良率＝不良個数÷検査個数で求める。1日目8÷400＝2.0［％］、2日目6÷250＝2.4［％］、3日目9÷500＝1.8［％］で、2日目が最も高い。不良個数の多さだけでなく、検査個数で割った比率で比べることが大切である。","","",["不良個数が最も多い日を選んだ誤りで、9÷500＝1.8［％］と不良率は最も低い。","1日目の不良率は8÷400＝2.0［％］で、2日目の2.4［％］より低い。","3日間の合計23÷1150＝2.0［％］で、日ごとの違いが見えなくなる。"],"","",""],["加熱温度［℃］と硬さの組を測定したところ、(180, 62)、(190, 58)、(200, 55)、(210, 51)、(220, 47)であった。これを散布図に打点したときの読み取りとして正しいものはどれか？","右肩下がりで、負の相関がある","右肩上がりで、正の相関がある","点の並びに傾向がなく、相関はない","2つのグループに分かれ、層別が必要である","温度が10［℃］上がるごとに硬さは62→58→55→51→47と減っており、打点すると右肩下がりの直線的な並びになる。一方が増えると他方が減るので負の相関がある。散布図では傾向の有無、直線的か、グループ分けの必要性、外れ値などを読み取る。","","",["温度が上がると硬さも増える場合で、このデータとは逆の傾向である。","点がばらばらに散らばる場合の読み取りで、このデータは一定の傾向を持つ。","点の集まりが2か所に分かれる場合で、このデータは1本の並びである。"],"","","",["x:figqc_49","加熱温度と硬さの散布図：右肩下がりで負の相関"]],["部品寸法の基準値からの差［mm］を6個測定したところ、＋0.12、－0.05、＋0.08、－0.15、＋0.03、－0.02であった。範囲Rはいくらか？","0.27［mm］","0.03［mm］","0.15［mm］","0.12［mm］","範囲R＝最大値－最小値である。最大値は＋0.12、最小値は－0.15なので、R＝0.12－(－0.15)＝0.27［mm］。マイナスの値を引くときは足し算になる点に注意する。Rが大きいほどばらつきは大きい。","","",["マイナスの符号を無視して0.15－0.12と計算した誤りである。","絶対値が最も大きい－0.15の大きさだけを答えたもので、範囲ではない。","最大値＋0.12をそのまま答えたもので、最小値を引いていない。"],"","",""]]}];
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let missed = new Set(store.get('tobe1-missed', []));
let best = store.get('tobe1-best', {});
let selected = new Set(store.get('tobe1-sel', []));
let cat = 'すべて';
const CATS = ['すべて', ...new Set(DATA.map(s => s.cat))];
const key = (sid, i) => sid + ':' + i;

function renderCats(){
  $('cats').innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c; b.setAttribute('aria-pressed', c === cat);

}
function renderSets(){
  $('sets').innerHTML = '';

    const b = document.createElement('button');
    b.className = 'set'; b.setAttribute('aria-pressed', selected.has(s.id));
    const m = s.q.filter((_, i) => missed.has(key(s.id, i))).length;
    const bs = best[s.id] != null ? `　前回 ${best[s.id]}%` : '';
    b.innerHTML = `<span class="box">✓</span><span class="t">${s.title}<small>${s.cat}${m?`　間違えた問題 ${m}`:''}${bs}</small></span><span class="n">${s.q.length}問</span>`;
    b.onclick = () => { selected.has(s.id) ? selected.delete(s.id) : selected.add(s.id); store.set('tobe1-sel', [...selected]); renderSets(); };

  });
  updateStart();
}
function pool(){
  const scope = $('opt-scope').value; const out = [];
  DATA.forEach(s => { if (!selected.has(s.id)) return;
    s.q.forEach((q, i) => { if (scope === 'miss' && !missed.has(key(s.id, i))) return; out.push({s, i, q}); }); });
  return out;
}
function updateStart(){
  const n = pool().length;
  $('start').disabled = n === 0;
  $('start').textContent = n ? `出題スタート（対象 ${n}問）` : (selected.size ? '対象の問題がありません' : '問題集を選んでください');
}
['opt-scope','opt-n','opt-order'].forEach(id => $(id).onchange = updateStart);

function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let run = null;
function startRun(items){

}
$('start').onclick = () => {

  if ($('opt-order').value === 'rand') shuffle(items);
  const n = +$('opt-n').value; if (n) items = items.slice(0, n);
  startRun(items);
};
function renderQ(){
  const it = run.items[run.pos], [q, a, d1, d2, d3, e] = it.q;
  $('q-count').textContent = `${run.pos + 1} / ${run.items.length}`;
  $('q-track').style.width = (run.pos / run.items.length * 100) + '%';
  $('q-src').textContent = `${it.s.title}　#${it.i + 1}`;
  $('q-text').textContent = q; { const old=document.getElementById('q-fig'); if(old) old.remove(); const im=figImg(it.q); if(im){ im.id='q-fig'; $('q-text').after(im); } }
  if (!it.opts){ it.opts = [...shuffle([a, d1, d2, d3]), DONTKNOW]; it.done = false; }

  $('q-choices').innerHTML = '';
  opts.forEach((o, k) => {
    const b = document.createElement('button');
    b.className = 'choice' + (o === DONTKNOW ? ' dk' : ''); b.id = 'c' + k;

$('q-prev').onclick = () => { if (run && run.pos > 0){ run.pos--; renderQ(); window.scrollTo({top:0}); } };
$('q-next').onclick = () => { run.pos++; if (run.pos < run.items.length) renderQ(); else finish(); };
$('quit').onclick = () => { if (run && run.items.some(x => x.done)) finish(true); else goHome(); };
function finish(early){
  const total = early ? run.items.filter(x => x.done).length : run.items.length;
  const pct = total ? Math.round(run.right / total * 100) : 0;
  if (!early && total){ const sids = new Set(run.items.map(x => x.s.id)); if (sids.size === 1){ best[[...sids][0]] = pct; store.set('tobe1-best', best); } }
  $('r-score').textContent = pct + '%';
  $('r-detail').textContent = `${total}問中 ${run.right}問正解`;
  $('r-missed').innerHTML = '';
  run.wrong.forEach(it => {
    const d = document.createElement('div'); d.className = 'miss';
    d.append(Object.assign(document.createElement('div'), {textContent: it.q[0]})); { const im=figImg(it.q); if(im) d.append(im); }
    const a = document.createElement('div'); a.className = 'a'; a.textContent = '→ ' + it.q[1]; d.append(a);
    const e = document.createElement('div'); e.style.color = 'var(--muted)'; e.style.fontSize = '13px'; e.textContent = it.q[5]; { const r=refLink(it.q); if(r){ e.append(document.createElement('br'), r); } } d.append(e);
    $('r-missed').append(d);
  });

}
$('r-retry').onclick = () => startRun(shuffle(run.wrong.map(x => ({s: x.s, i: x.i, q: x.q}))));
$('r-home').onclick = goHome;

      rows.forEach(({q, i}) => {
        const r = document.createElement('div'); r.className = 'row';
        r.innerHTML = `<div class="no">#${i + 1}</div><div class="qq"></div><div class="a"></div><div class="e"></div>`;
        r.querySelector('.qq').textContent = q[0]; { const im=figImg(q); if(im) r.querySelector('.qq').after(im); } r.querySelector('.a').textContent = '→ ' + q[1]; r.querySelector('.e').textContent = q[5]; { const rl=refLink(q); if(rl){ r.querySelector('.e').append(document.createElement('br'), rl); } }
        box.append(r);
      }); };
    if (d.open) fill(); d.addEventListener('toggle', fill);
    host.append(d);
  });
  if (!host.childElementCount) host.innerHTML = '<p class="note">該当する問題がありません。</p>';
}
$('search').oninput = renderList;

document.addEventListener('keydown', e => {
  if ($('v-quiz').hidden || e.target.tagName === 'INPUT') return;
  const it = run && run.items[run.pos];
  if (it && !it.done && '12345'.includes(e.key)) { answer(+e.key - 1); e.preventDefault(); }
  else if (it && it.done && e.key === 'Enter' && document.activeElement !== $('q-next')) { $('q-next').click(); e.preventDefault(); }
});

renderCats(); renderSets();
</script>
