"計算機システム概論 第6回 計算機アーキテクチャと基本ソフトウエア（OS）","",["w:053_2","IBMの大型汎用機System/360（メインフレーム）",{"a":"Erik Pitti","l":"CC BY 2.0","u":"https://commons.wikimedia.org/wiki/File:IBM_System360_Mainframe.jpg"}]],["レコードを先頭から順に書き出し、読み出しも記録順に行うファイルを何と呼ぶか？","シーケンシャルファイル","ランダムファイル","索引ファイル","ハッシュファイル","シーケンシャルファイル（順編成ファイル）は、レコードを先頭から順番に記録し、読み出しも先頭から順に行うファイル。全件を順に処理するのには効率がよいが、特定のレコードだけを取り出すのは苦手。","https://www.fe-siken.com/kakomon/16_aki/q34.html","ファイル編成の過去問解説（基本情報技術者試験.com）",["ランダムファイルはレコードの位置を指定して任意の順に直接読み書きできるファイルである。","索引ファイルは索引（インデックス）を使って目的のレコードを素早く探せるようにしたファイルである。","ハッシュファイルはキーからハッシュ関数で格納位置を計算して直接アクセスするファイルである。"],"https://www.youtube.com/watch?v=en5mWPK5kic","【第17回】ITパスポート試験対策講座（補助記憶装置）",""],["作業工程をアローダイアグラムで表し、時間に余裕のない経路を明確にして管理する手法は？","PERT","PAD","UML","WBS","PERT（Program Evaluation and Review Technique）は、作業の順序関係をアローダイアグラム（矢線図）で表し、各作業の所要時間から全体の日程を計算する工程管理手法。時間に余裕のない経路を明らかにし、重点的に管理する。","https://backlog.com/ja/blog/what-is-critical-path/","クリティカルパスとは？工程管理で重要な理由と求め方（Backlog）",["PADは順次・選択・繰り返しを階層で表すプログラムの構造化チャートで、工程管理手法ではない。","UMLはオブジェクト指向のシステムを図で表す統一モデリング言語である。","WBSはプロジェクトの作業を階層的に細分化して洗い出す手法で、日程や余裕の計算は行わない。"],"https://www.youtube.com/watch?v=Nbv8SZrLZXY","アローダイアグラムの読み解き方、クリティカルパスのもとめ方がわかる！","",["x:info2_60","PERT図（アローダイアグラム）の例"]],["PERTで、最も余裕のない（全体の日程を決める）経路を何というか？","クリティカルパス","フロート","マイルストーン","ダミー作業","クリティカルパスは、プロジェクトの開始から終了までの経路のうち、所要時間が最も長く、余裕時間がゼロの経路。この経路上の作業が1日遅れると、全体も1日遅れる。全体を短縮するには、クリティカルパス上の作業を短くする必要がある。","https://backlog.com/ja/blog/what-is-critical-path/","クリティカルパスとは？工程管理で重要な理由と求め方（Backlog）",["フロートは作業や結合点の余裕時間のことで、クリティカルパス上ではゼロになる。","マイルストーンはプロジェクトの重要な節目となる時点で、経路の名称ではない。","ダミー作業は作業の順序関係だけを示す所要時間ゼロの作業で、点線の矢印で表す。"],"https://www.youtube.com/watch?v=Nbv8SZrLZXY","アローダイアグラムの読み解き方、クリティカルパスのもとめ方がわかる！","",["x:info2_61","PERT図のクリティカルパス（B→E→H）"]],["上流から下流へ1工程ずつ順番に作業を進める開発モデルは？","ウォーターフォール","アジャイル","スパイラル","反復型","ウォーターフォールモデルは、要件定義→設計→製造（プログラミング）→テスト→運用と、上流の工程から下流の工程へ順番に進める開発モデル。滝の水が上から下へ流れるように、原則として後戻りしない。","https://backlog.com/ja/blog/advantages-and-disadvantages-for-waterfall-model/","ウォーターフォール型開発とは？メリット・デメリット（Backlog）",["アジャイルは短い期間で設計・実装・テストを繰り返し、仕様変更に柔軟に対応する開発手法である。","スパイラルは設計・試作・評価のサイクルをらせん状に繰り返し、リスクを評価しながら進める開発モデルである。","反復型は基本機能を作り、サイクルを繰り返して改良しながら段階的にリリースする開発モデルである。"],"https://www.youtube.com/watch?v=B00ThHn37wk","【システム開発】ウォーターフォール型開発のメリット・デメリット","",["x:info2_62","ウォーターフォール型開発の流れ"]],["ウォーターフォール型の開発で、各工程を結ぶドキュメントを何と呼ぶか？","成果物","仕様変更書","議事録","テストケース","ウォーターフォール型開発では、各工程の終わりに成果物（要件定義書、設計書、ソースコード、テスト報告書など）を作り、それを次の工程の入力にする。成果物をレビューして承認してから次へ進む。","https://backlog.com/ja/blog/advantages-and-disadvantages-for-waterfall-model/","ウォーターフォール型開発とは？メリット・デメリット（Backlog）",["仕様変更書は要求の変更内容を記録する文書で、工程どうしをつなぐ標準の成果物ではない。","議事録は会議の内容を記録した文書で、工程の成果を次工程へ引き渡すものではない。","テストケースはテスト項目と期待結果を定めた文書で、成果物の一種だが各工程を結ぶ文書の総称ではない。"],"https://www.youtube.com/watch?v=B00ThHn37wk","【システム開発】ウォーターフォール型開発のメリット・デメリット","",["w:217_0","要求定義から運用・保守まで順に進むウォーターフォール",{"a":"すじにくシチュー","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Waterfall_model_jp.svg"}]],["ウォーターフォール型開発の問題点は？","前工程に間違いがないことを前提としていること","工程の区切りがないこと","ドキュメントを作らないこと","顧客の要求を一切聞かないこと","ウォーターフォール型は、前の工程に間違いがないことを前提に進めるため、上流の誤り（要件の勘違いなど）が下流のテストで見つかると、大きな手戻りが発生する。また、途中での仕様変更に対応しにくい。","https://backlog.com/ja/blog/advantages-and-disadvantages-for-waterfall-model/","ウォーターフォール型開発とは？メリット・デメリット（Backlog）",["ウォーターフォール型は要件定義・設計・製造・テストと工程を明確に区切って進めるのが特徴である。","ウォーターフォール型は各工程で要件定義書や設計書などのドキュメントを作成し、次工程に引き渡す。","ウォーターフォール型も要件定義で顧客の要求を聞き取るが、途中での仕様変更に対応しにくい点が問題である。"],"https://www.youtube.com/watch?v=B00ThHn37wk","【システム開発】ウォーターフォール型開発のメリット・デメリット","",["x:info2_64","ウォーターフォール型は前工程に戻れない"]],["基本仕様を満たすものをまず開発し、反復して改良を加えながら段階的にリリースする開発は？","反復型開発","ウォーターフォール開発","ビッグバン開発","一括請負開発","反復型開発は、まず基本的な機能をもつソフトウェアを作り、設計・実装・テストのサイクルを繰り返して機能を追加・改良しながら、段階的にリリースしていく開発方法。利用者の反応を見ながら改善できる。","https://www.kagoya.jp/howto/it-glossary/develop/what-is-agile/","【図解】アジャイル開発とは？具体的な進め方（カゴヤのサーバー研究室）",["ウォーターフォール開発は全工程を順番に一度だけ進め、最後にまとめて完成品を提供する開発モデルである。","ビッグバン開発は全機能を一度に作り込み、最後にまとめて統合・リリースする方法で、段階的ではない。","一括請負開発は契約形態の呼び名で、開発をまとめて請け負うことを指し、開発モデルではない。"],"https://www.youtube.com/watch?v=fSjyJFlHfGY","【第28回】ITパスポート試験対策講座（アジャイル開発）","",["x:info2_65","反復型開発（フィードバックと段階的リリース）"]],["アジャイル開発の代表的な手法で、開発現場の問題意識に基づく実践方法が提案されているものは？","XP（エクストリームプログラミング）","ウォーターフォール","PERT","ISO9001","XP（エクストリームプログラミング）は、アジャイル開発の代表的な手法の1つ。2人で1台のコンピュータを使うペアプログラミング、先にテストを書くテスト駆動開発、こまめな統合、リファクタリングなどの実践方法を提案している。","https://www.kagoya.jp/howto/it-glossary/develop/what-is-agile/","【図解】アジャイル開発とは？具体的な進め方（カゴヤのサーバー研究室）",["ウォーターフォールは工程を順番に進める従来型の開発モデルで、アジャイル開発の手法ではない。","PERTはアローダイアグラムで日程を管理する工程管理手法で、開発手法ではない。","ISO9001は品質マネジメントシステムに関する国際規格で、アジャイル開発の手法ではない。"],"https://www.youtube.com/watch?v=fSjyJFlHfGY","【第28回】ITパスポート試験対策講座（アジャイル開発）",""],["仕様書やソースコードなどの問題箇所を発見するための品質保証作業を何というか？","レビュー","デバッグ","リファクタリング","コンパイル","レビューは、仕様書・設計書・ソースコードなどを人が読んで、誤りや問題箇所を見つける品質保証作業。プログラムを動かす前に問題を発見できるので、手戻りのコストを小さくできる。","https://www.veriserve.co.jp/helloqualityworld/media/20250627001/","ウォークスルーとは？他のレビュー手法との違い（ベリサーブ）",["デバッグはプログラムを動かして見つかった誤りの原因を調べて取り除く作業で、文書を読んで調べる作業ではない。","リファクタリングは外部の動作を変えずにコードの内部構造を改善する作業である。","コンパイルはソースプログラムを機械語に翻訳する処理で、問題箇所を発見する品質保証作業ではない。"],"https://www.youtube.com/watch?v=k_1wtTl1Aek","【ITパスポート】開発プロセス、機能要件、ソフトウェア品質特性",""],["設計工程の節目で、公式の場で設計内容を確認する品質保証作業を何というか？","デザインレビュー","ウォークスルー","インスペクション","コードレビュー","デザインレビュー（DR）は、設計の節目（構想、基本設計、詳細設計など）で、関係部門の専門家が集まって公式に設計内容を審査・確認する活動。設計段階で品質の問題を早めにつぶすことが目的。","https://www.veriserve.co.jp/helloqualityworld/media/20250627001/","ウォークスルーとは？他のレビュー手法との違い（ベリサーブ）",["ウォークスルーは作成者が説明しながら参加者と順に内容を追う比較的気軽なレビューで、公式な審査ではない。","インスペクションは役割を決めた参加者がチェックリストなどで欠陥を検出する公式なレビューで、設計の節目の審査に限らない。","コードレビューはソースコードを読んで誤りや改善点を見つけるレビューで、設計内容の確認ではない。"],"https://www.youtube.com/watch?v=k_1wtTl1Aek","【ITパスポート】開発プロセス、機能要件、ソフトウェア品質特性",""],["プログラムの仕様や製造に誤りがないか、全体にわたって追いかけてチェックする品質保証作業は？","ウォークスルー","デザインレビュー","単体テスト","ブレインストーミング","ウォークスルーは、作成者が仕様書やプログラムの内容を説明しながら、参加者と一緒に最初から順に追いかけて、誤りがないかを確認するレビューの方法。比較的気軽に行える。","https://www.veriserve.co.jp/helloqualityworld/media/20250627001/","ウォークスルーとは？他のレビュー手法との違い（ベリサーブ）",["デザインレビューは設計の節目に関係部門の専門家が公式に設計内容を審査する活動である。","単体テストは個々のモジュールを実際に動かして正しく動作するかを確かめるテストである。","ブレインストーミングは批判をせずに自由にアイデアを出し合う発想法で、品質保証作業ではない。"],"https://www.youtube.com/watch?v=k_1wtTl1Aek","【ITパスポート】開発プロセス、機能要件、ソフトウェア品質特性",""],["ソースファイルの入力や編集を行うツールを何というか？","エディタ","コンパイラ","リンカ","デバッガ","エディタは、ソースコードなどのテキストファイルを入力・編集するためのツール。プログラム用のエディタには、キーワードの色分けや自動補完などの機能がある。","https://www.sejuku.net/blog/10128","テキストエディタとは？（侍エンジニアブログ）",["コンパイラはソースプログラムを機械語に翻訳するプログラムで、入力や編集は行わない。","リンカは複数のオブジェクトファイルを結合して実行ファイルを作るプログラムである。","デバッガはプログラムを実行・停止させて誤りの原因を調べるためのツールである。"],"https://www.youtube.com/watch?v=F43kPbJmSaM","WindowsでC言語/C++の学習環境をVSCode/Visual Studioで構築する手順と使い方",""],["アセンブリ言語を機械語に変換するプログラムを何というか？","アセンブラ","コンパイラ","インタプリタ","リンカ","アセンブラは、アセンブリ言語で書かれたプログラムを機械語に変換（アセンブル）するプログラム。アセンブリ言語と機械語は1対1に対応しているので、変換は比較的単純。","https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%91%E3%82%A4%E3%83%A9.html","コンパイラとは（IT用語辞典 e-Words）",["コンパイラはC言語などの高級言語のソースを機械語に翻訳するプログラムである。","インタプリタはソースコードを1行ずつ解釈しながら実行する言語処理系である。","リンカは複数のオブジェクトファイルを結合し、番地を解決して実行ファイルを作るプログラムである。"],"https://www.youtube.com/watch?v=GE3uyX93GT8","言語プロセッサ（コンパイラ、アセンブラ、インタプリタ）とは",""],["アセンブリ言語よりも、変数や記号などで抽象的な概念を表現でき、コンパイルして使う言語を何というか？","コンパイル言語","機械語","マークアップ言語","スクリプト言語","コンパイル言語は、C言語やC++など、変数や関数などの抽象的な表現を使って書き、コンパイラで機械語に一括変換してから実行する言語。実行が速い。アセンブリ言語より人に分かりやすく、CPUの違いにも依存しにくい。","https://www.sejuku.net/blog/143201","プログラミング言語を3つの方法で分類（侍エンジニアブログ）",["機械語はCPUが直接実行する0と1の命令列で、アセンブリ言語より抽象度が低い。","マークアップ言語はタグで文書の構造や書式を記述する言語で、処理を記述してコンパイルするものではない。","スクリプト言語はコンパイルせずに書いてすぐ実行できる言語で、コンパイルを前提としない。"],"https://www.youtube.com/watch?v=gllnXHY2ZAw","スクリプトとは（コンパイラ方式とインタプリタ方式）",""],["コンパイル言語を機械語に変換するプログラムを何というか？","コンパイラ","アセンブラ","インタプリタ","リンカ","コンパイラは、C言語などの高級言語で書かれたソースプログラム全体を、まとめて機械語（オブジェクトファイル）に翻訳するプログラム。翻訳後は高速に実行できる。1行ずつ解釈して実行するのはインタプリタ。","https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%91%E3%82%A4%E3%83%A9.html","コンパイラとは（IT用語辞典 e-Words）",["アセンブラはアセンブリ言語を機械語に変換するプログラムである。","インタプリタはソースを1行ずつ解釈しながら実行する処理系で、機械語のファイルを一括で作らない。","リンカはコンパイル後の複数のオブジェクトファイルを結合するプログラムで、翻訳は行わない。"],"https://www.youtube.com/watch?v=GE3uyX93GT8","言語プロセッサ（コンパイラ、アセンブラ、インタプリタ）とは",""],["未解決の名前や番地を、複数のオブジェクトファイル間でつなぎ合わせて解決するプログラムは？","リンカ","コンパイラ","ローダ","アセンブラ","リンカ（連係編集プログラム）は、コンパイルで作られた複数のオブジェクトファイルやライブラリを結合し、互いに参照している関数名や変数の番地を解決して、実行可能なファイル（ロードモジュール）を作るプログラム。","https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%91%E3%82%A4%E3%83%A9.html","コンパイラとは（IT用語辞典 e-Words）",["コンパイラはソースプログラムを機械語のオブジェクトファイルに翻訳するプログラムで、ファイル間の番地解決は行わない。","ローダは実行可能なプログラムを主記憶に読み込み、実行できる状態にするプログラムである。","アセンブラはアセンブリ言語を機械語に変換するプログラムである。"],"https://www.youtube.com/watch?v=GE3uyX93GT8","言語プロセッサ（コンパイラ、アセンブラ、インタプリタ）とは","",["x:info2_74","リンカがオブジェクトを結合しロードモジュール化"]],["複数のファイルを最終的に1つのロードモジュールに結びつけるものを何というか？","バインダ","エディタ","デバッガ","プリプロセッサ","バインダは、複数のファイル（オブジェクトモジュール）を結びつけて、最終的に1つのロードモジュール（実行形式）にまとめるもの。リンカと同様の働きをする。","https://e-words.jp/w/%E3%82%B3%E3%83%B3%E3%83%91%E3%82%A4%E3%83%A9.html","コンパイラとは（IT用語辞典 e-Words）",["エディタはソースファイルの入力や編集を行うツールで、ファイルを結びつける機能はない。","デバッガはプログラムの誤りを探すために実行を制御・観察するツールである。","プリプロセッサはコンパイル前にマクロ展開やファイル取込みなどの下処理を行うプログラムである。"],"https://www.youtube.com/watch?v=GE3uyX93GT8","言語プロセッサ（コンパイラ、アセンブラ、インタプリタ）とは",""],["エディタ、コンパイラ、リンカ、デバッガなどの開発ツールをまとめて提供する環境を何というか？","IDE（統合開発環境）","SDK","API","OS","IDE（Integrated Development Environment：統合開発環境）は、エディタ、コンパイラ、リンカ、デバッガなどの開発ツールを1つの画面にまとめ、連携して使えるようにした環境。Visual Studio、Eclipseなどが代表。","https://www.sejuku.net/blog/98980","統合開発環境(IDE)とは？わかりやすく解説（侍エンジニアブログ）",["SDKは特定のプラットフォーム向けソフトウェアを開発するためのライブラリやツール一式で、統合された作業環境とは異なる。","APIはOSやライブラリの機能をアプリケーションから呼び出すための取り決めである。","OSはハードウェアを管理し、アプリケーションに実行環境を提供する基本ソフトである。"],"https://www.youtube.com/watch?v=bnQo-UV_l5w","【新しいC言語講座】統合開発環境（IDE）",""],["IBMが開発し、現在はEclipse Foundationが提供しているIDEは？","Eclipse","Visual Studio","Xcode","NetBeans","Eclipseは、IBMが開発し、現在は非営利団体のEclipse Foundationが提供しているオープンソースのIDE。もともとJava向けだが、プラグインを追加してC/C++や組込み開発などにも使える。","https://www.sejuku.net/blog/98980","統合開発環境(IDE)とは？わかりやすく解説（侍エンジニアブログ）",["Visual Studioはマイクロソフト社が開発・提供しているIDEである。","XcodeはApple社が提供するmacOSやiOS向けアプリ開発用のIDEである。","NetBeansはサン・マイクロシステムズ社が中心となり開発したIDEで、現在はApacheソフトウェア財団が提供している。"],"https://www.youtube.com/watch?v=bnQo-UV_l5w","【新しいC言語講座】統合開発環境（IDE）","",["w:035_1","Eclipse IDEの編集画面の例",{"a":"Linux Screenshots from USA","l":"CC BY 2.0","u":"https://commons.wikimedia.org/wiki/File:IDE_-_eclipse.png"}]],["IDEで、多くのツールはどんな方法で提供されるか？","プラグイン","パッチ","マクロ","バッチファイル","プラグインは、ソフトウェアに後から機能を追加するための拡張部品。IDEでは、言語のサポートやデバッグ機能などの多くのツールがプラグインとして提供され、必要なものだけを追加して使える。","https://www.sejuku.net/blog/98980","統合開発環境(IDE)とは？わかりやすく解説（侍エンジニアブログ）",["パッチは不具合修正や脆弱性対策のためにソフトウェアの一部を更新する修正プログラムである。","マクロは一連の操作や処理を1つの命令にまとめて自動実行する仕組みである。","バッチファイルはOSのコマンドを並べて書き、まとめて順に実行させるテキストファイルである。"],"https://www.youtube.com/watch?v=bnQo-UV_l5w","【新しいC言語講座】統合開発環境（IDE）",""],["実際の回路にCPUを実装した状態でプログラムの確認を行うための装置は？","ICE","シミュレータ","エミュレータソフト","ロジックチェッカ","ICE（In-Circuit Emulator：インサーキットエミュレータ）は、実際の回路基板にCPUの代わりに接続し、CPUの動作を代行しながら、プログラムをリアルタイムに実行・停止・観察できるデバッグ装置。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["シミュレータは対象の動作をソフトウェアで計算して模倣するもので、実際の回路にCPUを実装した状態では確認しない。","エミュレータソフトはパソコン上で別の機器の動作を再現するソフトウェアで、実回路での確認装置ではない。","ロジックチェッカは論理回路の信号レベルを確認する簡易な測定器で、プログラムの確認装置ではない。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介","",["x:info2_79","ICEで基板に組み込んだ状態を確認"]],["CPUなどの動作を模倣するが、動作にCPUそのものや内部ロジックを利用するものを何というか？","エミュレータ","シミュレータ","コンパイラ","インタプリタ","エミュレータは、ある機器（CPUなど）の動作を、別の機器で模倣して再現するもの。CPUそのものや内部の論理回路を使って動作を再現する点で、ソフトウェアだけで計算して動作をまねるシミュレータと区別される。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["シミュレータはCPUなどの動作をソフトウェアだけで計算して模倣するもので、CPUそのものは利用しない。","コンパイラは高級言語のソースプログラムを機械語に翻訳するプログラムである。","インタプリタはソースコードを1行ずつ解釈しながら実行する言語処理系である。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介",""],["ICのすべての入出力ピンを順次走査し、テストデータを送受信してデバイスをテストする規格は？","JTAG","I2C","SPI","USB","JTAG（IEEE1149.1）は、ICのすべての入出力ピンにつながった検査用の回路を順に走査し、テストデータを送受信してデバイスや基板の接続をテストする規格。現在はマイコンのデバッグやプログラム書き込みにも広く使われる。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["I2Cは2本の信号線（SDA、SCL）でICどうしを接続するシリアル通信規格で、デバイスのテスト規格ではない。","SPIはクロック・データ入出力・選択信号の4本程度の線で高速通信するシリアル通信規格である。","USBはパソコンと周辺機器を接続する汎用のシリアルバス規格である。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介",""],["JTAGの機能で、デバイスの動作に影響せず端子の状態を調べたり制御したりする技術は？","バウンダリスキャン","ポーリング","インプットキャプチャ","ウォッチドッグ","バウンダリスキャンは、JTAGの本来の機能で、ICの各ピンの近くにあるセルを使って、ICの動作に影響を与えずにピンの状態を読み取ったり、ピンを内部の回路から切り離して自由に制御したりする技術。プリント基板のはんだ不良検査などに使われる。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["ポーリングはCPUが周期的に装置の状態を問い合わせる方式で、JTAGの機能ではない。","インプットキャプチャはマイコンのタイマで、入力信号の変化した時刻を記録する機能である。","ウォッチドッグはプログラムの暴走を検出してシステムをリセットする監視タイマである。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介","",["x:info2_82","JTAGの信号とバウンダリスキャン"]],["システムやプログラムの誤りを探して取り除くことを何というか？","デバッグ","リファクタリング","コンパイル","リンク","デバッグは、プログラムやシステムの誤り（バグ）を見つけて、原因を調べて取り除く作業。デバッガ、ブレークポイント、ログ出力などを使って進める。","https://e-words.jp/w/%E3%83%87%E3%83%90%E3%83%83%E3%82%AC.html","デバッガ（デバッグツール）とは（IT用語辞典 e-Words）",["リファクタリングは外部の動作を変えずに内部構造を改善することで、誤りを取り除く作業ではない。","コンパイルはソースプログラムを機械語に翻訳する処理である。","リンクは複数のオブジェクトファイルを結合して実行ファイルを作る処理である。"],"https://www.youtube.com/watch?v=xdJzvyjuQyE","printデバッグは卒業！Visual Studioで効率的デバッグ",""],["モデリング言語とはどんな言語か？","特定の視点から対象を表現する言語","機械語に直接変換される言語","文書の書式を定義する言語","ハードウェアを記述する言語","モデリング言語は、システムなどの対象を、特定の視点（構造、振る舞いなど）から図や記号で表現するための言語。UMLが代表で、プログラミング言語のように実行するためではなく、設計や意思疎通のために使う。","https://atmarkit.itmedia.co.jp/fjava/devs/dstylefaq/uml/uml1_1/uml1_1.html","UMLダイアグラムの基本を教えてください（@IT）",["機械語に直接変換される言語はアセンブリ言語やコンパイル言語で、実行を目的とするプログラミング言語である。","文書の書式を定義する言語はHTMLやXMLなどのマークアップ言語である。","ハードウェアを記述する言語はVerilogやVHDLなどのハードウェア記述言語（HDL）である。"],"https://www.youtube.com/watch?v=EvO_BvCJUCA","UMLとは？クラス図・シーケンス図など種類や書き方を解説【UML入門】",""],["ソースプログラムの1行単位で実行を一時停止してくれるデバッガの機能は？","シングルステップ","ブレークポイント","トレース","ウォッチ","シングルステップ（ステップ実行）は、デバッガでプログラムを1行（1命令）ずつ実行しては止める機能。各行を実行した後の変数の変化を確かめながら、どこで誤りが起きるかを特定できる。","https://e-words.jp/w/%E3%83%87%E3%83%90%E3%83%83%E3%82%AC.html","デバッガ（デバッグツール）とは（IT用語辞典 e-Words）",["ブレークポイントは指定した行やアドレスで実行を停止させる目印で、1行ごとに止める機能ではない。","トレースはプログラムの実行経過や変数の変化を記録・表示する機能で、停止させること自体が目的ではない。","ウォッチは指定した変数の値を監視・表示する機能である。"],"https://www.youtube.com/watch?v=xdJzvyjuQyE","printデバッグは卒業！Visual Studioで効率的デバッグ","",["x:info2_85","シングルステップ（ステップイン／オーバ）"]],["モジュール分割の良し悪しを表すモジュール強度と結合度は、それぞれどうあるのが望ましいか？","強度が強く、結合度が弱い","強度が弱く、結合度が強い","強度も結合度も強い","強度も結合度も弱い","モジュール強度（凝集度）は、1つのモジュール内の処理がどれだけ1つの目的にまとまっているかで、強いほどよい。モジュール結合度は、モジュールどうしがどれだけ依存し合っているかで、弱いほどよい。強度が強く結合度が弱いと、独立性が高く、修正の影響が他に広がりにくい。","https://itmanabi.com/program-structured-design/","プログラム構造化設計とモジュールの独立性（ITの学び）",["強度が弱いと1つのモジュールに無関係な処理が混在し、結合度が強いと修正の影響が他に広がるため最も望ましくない。","結合度が強いとモジュール間の依存が大きく、1か所の修正が他のモジュールへ波及しやすくなる。","強度が弱いとモジュール内の処理のまとまりが悪く、理解や修正がしにくくなる。"],"https://www.youtube.com/watch?v=sYW09_8IwvA","【過去問解説】基本情報技術者試験 令和元年 秋期 問46【モジュール結合度】","",["x:info2_86","モジュール間結合度の分類（下ほど弱く望ましい）"]],["ソフトウェアテストを進める順番として正しいものは？","単体テスト → 結合テスト → 統合（システム）テスト","結合テスト → 単体テスト → 統合テスト","統合テスト → 結合テスト → 単体テスト","単体テスト → 統合テスト → 結合テスト","ソフトウェアテストは、個々のモジュールを確認する単体テスト、モジュールを組み合わせてやり取りを確認する結合テスト、システム全体で要求どおり動くかを確認する統合（システム）テストの順に進める。小さな単位から確認していくことで、不具合の場所を絞り込みやすい。","https://wa3.i-3-i.info/diff1079test.html","「単体試験」と「結合試験」の違い（わわわIT用語辞典）",["結合テストは単体テストで個々のモジュールを確認した後に行うもので、先に行うと不具合の場所を絞り込みにくい。","順序が完全に逆で、全体の確認から始めると不具合がどのモジュールにあるか特定しにくい。","統合（システム）テストはモジュールの結合を確認した後にシステム全体を確認するもので、結合テストより後に行う。"],"https://www.youtube.com/watch?v=kSpEPYikVkA","V字モデルとは？ ウォーターフォール開発のプロセスとテストの関係","",["x:info2_87","V字モデル（設計工程とテストの対応）"]],["オブジェクト指向の重要な3つの概念の組合せは？","カプセル化、継承、ポリモーフィズム","モジュール化、構造化、再帰","抽象化、正規化、標準化","カプセル化、ポインタ、割込み","オブジェクト指向の3つの重要な概念は、データと処理をまとめて中身を隠すカプセル化、既存のクラスの性質を受け継ぐ継承、同じ呼び出しでもオブジェクトごとに適切に振る舞うポリモーフィズム（多態性）。","https://www.sejuku.net/blog/5973","オブジェクト指向とは？基礎知識をわかりやすく解説（侍エンジニアブログ）",["モジュール化、構造化は構造化設計の考え方、再帰は自分自身を呼び出す手法で、オブジェクト指向の3概念ではない。","正規化はデータベース設計の手法、標準化は規格を統一することで、オブジェクト指向の3概念ではない。","カプセル化は含まれるが、ポインタはメモリ番地を扱う変数、割込みはCPUの仕組みで、オブジェクト指向の概念ではない。"],"https://www.youtube.com/watch?v=mwgbN5vZuY4","オブジェクト指向プログラミングを学ぶ（基本情報技術者試験）","",["w:117_0","親クラスBankAccountを継承する2つの子クラス",{"a":"Donald Bell","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:UML_Inheritance_Diagram_tree_notation.jpg"}]],["オブジェクトの中身を外部に見せないことを何というか？","カプセル化","継承","ポリモーフィズム","インスタンス化","カプセル化は、オブジェクトの内部のデータや処理の詳細を外部から隠し（情報隠蔽）、決められた窓口（メソッド）からだけ操作できるようにすること。内部を変更しても外部に影響しにくくなる。","https://www.sejuku.net/blog/5973","オブジェクト指向とは？基礎知識をわかりやすく解説（侍エンジニアブログ）",["継承は既存クラスの属性やメソッドを受け継いで新しいクラスを定義することである。","ポリモーフィズムは同じ呼び出しに対し、オブジェクトごとに適した処理が行われることである。","インスタンス化はクラスを元に実体（インスタンス）となるオブジェクトを生成することである。"],"https://www.youtube.com/watch?v=mwgbN5vZuY4","オブジェクト指向プログラミングを学ぶ（基本情報技術者試験）",""],["既存のクラスをどうすることで新しいクラスを定義できるか？","継承","カプセル化","多重定義","再帰","継承（インヘリタンス）は、既存のクラスの属性やメソッドを受け継いで、新しいクラスを定義すること。共通部分を親クラスにまとめ、差分だけを子クラスに書けばよいので、プログラムの再利用性が高まる。","https://www.sejuku.net/blog/5973","オブジェクト指向とは？基礎知識をわかりやすく解説（侍エンジニアブログ）",["カプセル化はオブジェクトの内部を外部から隠し、決められたメソッドからだけ操作させることである。","多重定義（オーバーロード）は同じ名前で引数の型や数が異なるメソッドを複数定義することである。","再帰は関数が自分自身を呼び出すことで、クラスの定義方法ではない。"],"https://www.youtube.com/watch?v=mwgbN5vZuY4","オブジェクト指向プログラミングを学ぶ（基本情報技術者試験）","",["x:info2_90","継承によるクラスの体系化"]],["同じメッセージを異なるオブジェクトに送ったとき、それぞれが適切に反応することを何というか？","ポリモーフィズム","カプセル化","継承","抽象化","ポリモーフィズム（多態性）は、同じメッセージ（メソッドの呼び出し）を送っても、受け取ったオブジェクトの種類に応じて、それぞれに適した処理が行われること。例えば「描画せよ」と送ると、円は円を、四角は四角を描く。","https://www.sejuku.net/blog/5973","オブジェクト指向とは？基礎知識をわかりやすく解説（侍エンジニアブログ）",["カプセル化はオブジェクトの内部のデータや処理を外部から隠すことである。","継承は既存クラスの性質を受け継いで新しいクラスを定義することである。","抽象化は対象から本質的な特徴だけを取り出し、細部を省いて表現することである。"],"https://www.youtube.com/watch?v=mwgbN5vZuY4","オブジェクト指向プログラミングを学ぶ（基本情報技術者試験）","",["x:info2_91","ポリモーフィズム（同じメッセージで異なる動作）"]],["問題をどのような視点でとらえ、どう解決しようとしているかをモデルとして可視化することを何というか？","モデリング","プロトタイピング","デバッグ","リファクタリング","モデリングは、問題をどのような視点でとらえ、どう解決しようとしているかを、図などのモデルとして目に見える形にすること。関係者の間で認識をそろえ、設計の誤りを早く見つけるのに役立つ。","https://atmarkit.itmedia.co.jp/fjava/devs/dstylefaq/uml/uml1_1/uml1_1.html","UMLダイアグラムの基本を教えてください（@IT）",["プロトタイピングは試作品を作って利用者に確認してもらい、要求を明確にする手法である。","デバッグはプログラムの誤りを見つけて取り除く作業である。","リファクタリングは外部の動作を変えずにコードの内部構造を改善することである。"],"https://www.youtube.com/watch?v=EvO_BvCJUCA","UMLとは？クラス図・シーケンス図など種類や書き方を解説【UML入門】",""],["システム要求仕様をモデリングし、モデルを元にソフトウェアを開発する方法は？","モデル駆動型アーキテクチャ（MDA）","テスト駆動開発（TDD）","ウォーターフォール開発","構造化設計","MDA（Model Driven Architecture：モデル駆動型アーキテクチャ）は、システムの要求仕様をUMLなどでモデル化し、そのモデルから設計やプログラムを作り出していく開発方法。プラットフォームに依存しないモデルを中心に開発を進める。","https://atmarkit.itmedia.co.jp/fjava/devs/dstylefaq/uml/uml1_1/uml1_1.html","UMLダイアグラムの基本を教えてください（@IT）",["テスト駆動開発（TDD）は先にテストを書き、それに合格するようにコードを書いていく開発手法である。","ウォーターフォール開発は上流から下流へ工程を順番に進める開発モデルで、モデルを中心に据えるものではない。","構造化設計は機能を階層的にモジュールへ分割して設計する手法である。"],"https://www.youtube.com/watch?v=EvO_BvCJUCA","UMLとは？クラス図・シーケンス図など種類や書き方を解説【UML入門】",""],["モデリング表記法として国際的に標準化されているものは？","UML","PAD","HTML","SQL","UML（Unified Modeling Language：統一モデリング言語）は、オブジェクト指向のシステムを図で表すための国際標準の表記法。クラス図、シーケンス図、ユースケース図、状態遷移図などがある。","https://atmarkit.itmedia.co.jp/fjava/devs/dstylefaq/uml/uml1_1/uml1_1.html","UMLダイアグラムの基本を教えてください（@IT）",["PADは日本で開発された構造化チャートで、国際標準のモデリング表記法ではない。","HTMLはWebページの構造を記述するマークアップ言語である。","SQLはリレーショナルデータベースのデータを操作・定義するための言語である。"],"https://www.youtube.com/watch?v=EvO_BvCJUCA","UMLとは？クラス図・シーケンス図など種類や書き方を解説【UML入門】","",["w:118_1","UMLの図の種類を構造図と振る舞い図に分けた階層図",{"a":"Paulo Merson","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Uml_diagram2.png"}]],["UMLの図は大きく2つに分かれる。それぞれ何というか？","構造図、振る舞い図","入力図、出力図","クラス図、フローチャート","配置図、PERT図","UMLの図は、システムの静的な構成を表す構造図（クラス図、オブジェクト図、コンポーネント図など）と、動的な動きを表す振る舞い図（ユースケース図、シーケンス図、アクティビティ図、状態マシン図など）に大きく分かれる。","https://atmarkit.itmedia.co.jp/fjava/devs/dstylefaq/uml/uml1_1/uml1_1.html","UMLダイアグラムの基本を教えてください（@IT）",["入力図、出力図という分類はUMLにはなく、UMLの図は静的な構成と動的な動きで分けられる。","クラス図はUMLの構造図の1つだが、フローチャートはUMLの図ではなく処理の流れを表す一般的な図である。","配置図はUMLの構造図の1つだが、PERT図は工程管理用のアローダイアグラムでUMLの図ではない。"],"https://www.youtube.com/watch?v=EvO_BvCJUCA","UMLとは？クラス図・シーケンス図など種類や書き方を解説【UML入門】","",["w:118_1","UMLの構造図・振る舞い図とそれぞれに属する図の分類",{"a":"Paulo Merson","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Uml_diagram2.png"}]],["外部的な振る舞いを保ったまま、内部構造を体系的に改善することを何というか？","リファクタリング","デバッグ","リビルド","ポーティング","リファクタリングは、プログラムの外から見た動作（機能）を変えずに、内部の構造を整理して、読みやすく修正しやすいコードに改善すること。重複の除去や名前の変更などを行う。テストで動作が変わっていないことを確かめながら進める。","https://wa3.i-3-i.info/1minute/word1494.html","リファクタリングとは（わわわIT用語辞典）",["デバッグはプログラムの誤りを取り除く作業で、外部の動作が修正されることになる。","リビルドはソースコード全体をコンパイルし直して実行ファイルを作り直すことである。","ポーティング（移植）はソフトウェアを別のハードウェアやOSで動くように修正することである。"],"https://www.youtube.com/watch?v=7cj3yFa7k4s","モジュール分割を理解する（基本情報技術者試験）","",["x:info2_96","リファクタリング（外見は変えず構造を改善）"]],["PERTで、クリティカルパス上のノード（結合点）はどんなものか？","最早開始時刻と最遅完了時刻が等しい","最早開始時刻が最も遅い","余裕時間が最も大きい","ダミー作業がつながっている","クリティカルパス上の結合点では、最早開始時刻（最も早く始められる時刻）と最遅完了時刻（全体を遅らせないための最も遅い完了時刻）が等しく、余裕時間（フロート）がゼロになる。","https://backlog.com/ja/blog/what-is-critical-path/","クリティカルパスとは？工程管理で重要な理由と求め方（Backlog）",["最早開始時刻の大小はクリティカルパスの判定基準ではなく、最早と最遅の時刻が一致するかで判断する。","余裕時間が最も大きい結合点は日程に余裕がある経路上にあり、クリティカルパス上では余裕時間はゼロである。","ダミー作業は順序関係を示す所要時間ゼロの作業で、つながっているかどうかはクリティカルパスの条件ではない。"],"https://www.youtube.com/watch?v=Nbv8SZrLZXY","アローダイアグラムの読み解き方、クリティカルパスのもとめ方がわかる！","",["x:info2_97","最早開始時刻と最遅完了時刻の計算"]],["ソースコードを機械語に変換しながら逐次実行する言語処理系は何か？","インタプリタ","コンパイラ","アセンブラ","リンカ","インタプリタは、ソースコードを1行（1文）ずつ解釈しながら、その場で実行する言語処理系。書いてすぐに試せるが、毎回解釈するためコンパイル方式より実行は遅い。PythonやJavaScriptなどで使われる。","https://www.sejuku.net/blog/143201","プログラミング言語を3つの方法で分類（侍エンジニアブログ）",["コンパイラはソースプログラム全体を一括して機械語に翻訳してから実行するもので、逐次実行ではない。","アセンブラはアセンブリ言語を機械語に変換するプログラムで、実行は行わない。","リンカは複数のオブジェクトファイルを結合して実行ファイルを作るプログラムである。"],"https://www.youtube.com/watch?v=gllnXHY2ZAw","スクリプトとは（コンパイラ方式とインタプリタ方式）","",["x:info2_98","インタプリタ（逐次変換）とコンパイラ（一括変換）"]],["FATは何の略か？","File Allocation Table","Fast Access Technology","File Attribute Type","Format And Transfer","FATはFile Allocation Table（ファイル割当てテーブル）の略。ディスク上のどのクラスタにファイルのデータが保存されているかを、つながりとして記録した表。","https://atmarkit.itmedia.co.jp/ait/articles/1507/16/news034.html","Windowsのファイルシステムの概要とFATファイルシステム（@IT）",["Fast Access Technologyは実在する用語の略ではなく、FATのAはAllocation（割当て）である。","File Attribute Typeは誤りで、ファイル属性の種類を表す語ではなく、FATはクラスタの割当てを記録する表である。","Format And Transferは誤りで、FATはフォーマットや転送ではなく、ファイルの割当て表を意味する。"],"https://www.youtube.com/watch?v=urMnUTmeW3U","【ITパスポート】ファイルシステム（絶対パス指定、相対パス指定、ルート）",""],["XMLは何の略か？","eXtensible Markup Language","eXtra Markup Language","eXecutable Machine Language","eXternal Module Linker","XMLはeXtensible Markup Language（拡張可能なマークアップ言語）の略。利用者が独自のタグを定義でき、データの構造を記述してシステム間でやり取りするのに使われる。HTMLは表示用、XMLはデータ記述用という違いがある。","https://e-words.jp/w/XML.html","XMLとは（IT用語辞典 e-Words）",["eXtraは「追加の」の意味で誤りである。XMLのXはeXtensible（拡張可能な）で、独自タグを定義できることを表す。","XMLは機械語でも実行可能な言語でもなく、データ構造を記述するマークアップ言語である。","XMLはモジュールを結合するリンカではなく、タグでデータを記述するマークアップ言語である。"],"https://www.youtube.com/watch?v=NDHVInBmUbU","XMLとは一体なに？IT初心者にもわかりやすく説明します",""]]},{"id":"info3","title":"情報 2-3 ネットワーク・マルチメディア","cat":"情報","q":[["デジタルネットワークで、通信手順や情報の表現方法（ビットの意味）を定めた取り決めを何というか？","プロトコル","アーキテクチャ","トポロジ","インターフェース","プロトコルは、通信する機器どうしが守る約束事（通信規約）。データの形式、各ビットの意味、送受信の手順、エラー時の処理などを定める。人間どうしの会話でいえば、同じ言語と話し方のルールにあたる。","https://atmarkit.itmedia.co.jp/ait/articles/1411/13/news019.html","TCP/IPプロトコルスタックとOSI参照モデルの基礎知識（@IT）",["アーキテクチャはシステム全体の設計思想や基本構造のこと。通信の手順やビットの意味を定めた取り決めそのものではない。","トポロジは機器の接続形態（スター型、バス型、リング型など）を表す言葉で、通信規約ではない。","インターフェースは機器どうしやハードとソフトの接点・境界のこと。通信全体の手順や表現方法の取り決めを指す言葉ではない。"],"https://www.youtube.com/watch?v=aiaZ-tH4X0Q","OSI参照モデルとは？ もう迷わない！7層の役割",""],["複数のプロトコル層をセットにしたものを何というか？","プロトコルスタック（プロトコルスイート）","プロトコルアナライザ","ルーティングテーブル","ネットワークトポロジ","プロトコルスタック（プロトコルスイート）は、役割の異なる複数の層のプロトコルを積み重ねて組み合わせた一式。代表はインターネットで使われるTCP/IPで、各層は下の層のサービスを使って上の層にサービスを提供する。","https://atmarkit.itmedia.co.jp/ait/articles/1411/13/news019.html","TCP/IPプロトコルスタックとOSI参照モデルの基礎知識（@IT）",["プロトコルアナライザは、ネットワーク上を流れるパケットを取り込んで中身を解析する測定器・ソフトで、層の組合せではない。","ルーティングテーブルは、ルータが宛先ごとの転送先を記録した経路表。プロトコル層をまとめたものではない。","ネットワークトポロジはスター型やリング型など機器の接続形態のこと。プロトコルの層構成とは関係がない。"],"https://www.youtube.com/watch?v=aiaZ-tH4X0Q","OSI参照モデルとは？ もう迷わない！7層の役割",""],["異機種間の通信を可能にするために作られた、7層からなる通信モデルを何というか？","OSI参照モデル","TCP/IPモデル","クライアントサーバモデル","ウォーターフォールモデル","OSI参照モデルは、ISO（国際標準化機構）が定めた、異なるメーカーの機器どうしでも通信できるようにするための7層の通信モデル。下から物理層、データリンク層、ネットワーク層、トランスポート層、セッション層、プレゼンテーション層、アプリケーション層。","https://atmarkit.itmedia.co.jp/ait/articles/1411/13/news019.html","TCP/IPプロトコルスタックとOSI参照モデルの基礎知識（@IT）",["TCP/IPモデルはインターネットで実際に使われる4層（または5層）のモデルで、7層ではない。ISOが定めた参照モデルでもない。","クライアントサーバモデルは、サービスを要求する側と提供する側に役割を分ける処理形態で、通信の層モデルではない。","ウォーターフォールモデルは、要件定義から設計・製造・テストへ順に進めるソフトウェア開発手法で、通信モデルではない。"],"https://www.youtube.com/watch?v=aiaZ-tH4X0Q","OSI参照モデルとは？ もう迷わない！7層の役割","",["x:info3_3","OSI参照モデルの7層構成"]],["OSI参照モデルの下位層を、下から順に並べたものは？","物理層 → データリンク層 → ネットワーク層 → トランスポート層","データリンク層 → 物理層 → トランスポート層 → ネットワーク層","物理層 → ネットワーク層 → データリンク層 → トランスポート層","トランスポート層 → ネットワーク層 → データリンク層 → 物理層","OSI参照モデルの下位4層は、下から物理層（第1層：電気信号やケーブル）、データリンク層（第2層：隣の機器との通信、MACアドレス）、ネットワーク層（第3層：経路選択、IPアドレス）、トランスポート層（第4層：通信の信頼性、TCP/UDP）。","https://atmarkit.itmedia.co.jp/ait/articles/1411/13/news019.html","TCP/IPプロトコルスタックとOSI参照モデルの基礎知識（@IT）",["物理層とデータリンク層、ネットワーク層とトランスポート層の順序がそれぞれ逆。最下層は電気信号を扱う物理層である。","データリンク層とネットワーク層が入れ替わっている。隣接機器間の通信（第2層）の上に経路選択（第3層）が載る。","上から下へ並べた順序で、問題の「下から順」とは逆になっている。"],"https://www.youtube.com/watch?v=aiaZ-tH4X0Q","OSI参照モデルとは？ もう迷わない！7層の役割","",["x:info3_4","OSIモデルの上位層・下位層とTCP/IP"]],["OSI参照モデルの上位層を、下から順に並べたものは？","セッション層 → プレゼンテーション層 → アプリケーション層","プレゼンテーション層 → セッション層 → アプリケーション層","アプリケーション層 → プレゼンテーション層 → セッション層","セッション層 → アプリケーション層 → プレゼンテーション層","OSI参照モデルの上位3層は、下からセッション層（第5層：通信の開始・終了の管理）、プレゼンテーション層（第6層：データの表現形式、文字コードや暗号化）、アプリケーション層（第7層：メールやWebなど具体的なサービス）。","https://atmarkit.itmedia.co.jp/ait/articles/1411/13/news019.html","TCP/IPプロトコルスタックとOSI参照モデルの基礎知識（@IT）",["セッション層とプレゼンテーション層が入れ替わっている。第5層は通信の開始・終了を管理するセッション層である。","上から下へ並べた順序で、問題の「下から順」とは逆になっている。","プレゼンテーション層とアプリケーション層が入れ替わっている。最上位の第7層はアプリケーション層である。"],"https://www.youtube.com/watch?v=aiaZ-tH4X0Q","OSI参照モデルとは？ もう迷わない！7層の役割","",["w:082_1","OSI参照モデルの7階層（物理層からアプリケーション層）",{"a":"Ardika6879","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:OSI_Model.jpg"}]],["ネットワークで、複数のケーブルが結線される集線装置を何というか？","ハブ","ルータ","ゲートウェイ","モデム","ハブ（リピータハブ）は、複数のLANケーブルを1か所に集めてつなぐ集線装置。受け取った信号を、宛先に関係なくすべてのポートにそのまま送り出す。OSIの物理層の機器。","https://www.ntt.com/business/services/rink/knowledge/archive_05.html","【階層別一覧】ネットワーク機器の種類・特長を解説（NTTドコモビジネス）",["ルータはIPアドレスを見て異なるネットワーク間でパケットを中継するネットワーク層の機器で、単なる集線装置ではない。","ゲートウェイはプロトコルの異なるネットワークどうしを、変換しながら接続する機器やソフトのこと。集線が目的ではない。","モデムはデジタル信号と電話回線などのアナログ信号を相互に変換（変調・復調）する装置で、ケーブルを集める機器ではない。"],"https://www.youtube.com/watch?v=x1-xP6IIVDA","ルーターとハブの役割を説明！／ITパスポート・基本情報技術者・高校情報","",["w:036_0","複数のLANケーブルをつなぐイーサネットハブ",{"a":"不明","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:4_port_netgear_ethernet_hub.jpg"}]],["パケットの宛先MACアドレスを解析して内部スイッチを切り替える、データリンク層の機器は？","スイッチ（スイッチングハブ）","ルータ","リピータ","ゲートウェイ","スイッチ（スイッチングハブ、レイヤ2スイッチ）は、受け取ったパケット（フレーム）の宛先MACアドレスを見て、その宛先がつながっているポートにだけ転送する機器。不要な通信を減らせる。OSIのデータリンク層の機器。","https://www.ntt.com/business/services/rink/knowledge/archive_05.html","【階層別一覧】ネットワーク機器の種類・特長を解説（NTTドコモビジネス）",["ルータはIPアドレスを見て経路を選ぶネットワーク層の機器で、MACアドレスで切り替えるデータリンク層の機器ではない。","リピータは減衰した信号を増幅・整形して中継する物理層の機器で、アドレスは解析しない。","ゲートウェイはプロトコルの異なるネットワーク間を変換して接続する機器で、主に上位層で動作する。"],"https://www.youtube.com/watch?v=x1-xP6IIVDA","ルーターとハブの役割を説明！／ITパスポート・基本情報技術者・高校情報","",["x:info3_7","スイッチはデータリンク層、リピータは物理層"]],["ネットワーク上の論理的な宛先を表すアドレスを何というか？","IPアドレス","MACアドレス","ポート番号","URL","IPアドレスは、ネットワーク上の機器を識別するための論理的な住所。ネットワーク部とホスト部からなり、ネットワークの構成に応じて割り当てる。異なるネットワークをまたいで宛先を指定するのに使う。","https://e-words.jp/w/IP%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9.html","IPアドレスとは（IT用語辞典 e-Words）",["MACアドレスはネットワークインターフェースに製造時に割り当てられる物理的なアドレスで、論理的な宛先ではない。","ポート番号は1台のコンピュータ内でどのアプリケーション宛てかを区別する番号で、機器の宛先を表すものではない。","URLはWebページなどのリソースの所在を示す表記。ネットワーク層で機器の宛先を表すアドレスではない。"],"https://www.youtube.com/watch?v=mGIgWl73HHI","IPアドレスの仕組みとは プライベートIP/パブリックIPやIPv6など基本を解説","",["w:055_1","IPv4アドレスの10進表記と32ビットの2進表現",{"a":"Indeterminate","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Ipv4_address.svg"}]],["機器ごとに割り当てられた、パケットの物理的なアドレスを何というか？","MACアドレス","IPアドレス","ポート番号","ドメイン名","MACアドレスは、ネットワークインターフェース（LANカードなど）に製造時に割り当てられる、48ビットの物理的なアドレス。同じネットワーク内（データリンク層）で、隣の機器へデータを届けるのに使う。","https://e-words.jp/w/IP%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9.html","IPアドレスとは（IT用語辞典 e-Words）",["IPアドレスはネットワーク構成に応じて割り当てる論理的なアドレスで、機器固有の物理アドレスではない。","ポート番号は機器内のアプリケーションを識別する番号で、機器ごとの物理アドレスではない。","ドメイン名はIPアドレスを人が覚えやすい名前で表したもので、DNSで変換される。物理アドレスではない。"],"https://www.youtube.com/watch?v=mGIgWl73HHI","IPアドレスの仕組みとは プライベートIP/パブリックIPやIPv6など基本を解説","",["w:075_1","MACアドレス6オクテットの構成（OUIと機器固有部）",{"a":"Inductiveload, modified/corrected by Kju","l":"CC BY-SA 2.5","u":"https://commons.wikimedia.org/wiki/File:MAC-48_Address.svg"}]],["IPアドレスを解析してパケットの伝送経路を制御する、ネットワーク層の機器は？","ルータ","スイッチ","ハブ","リピータ","ルータは、パケットの宛先IPアドレスを見て、どの経路に送れば目的地に届くかを判断し（ルーティング）、異なるネットワークどうしを中継する機器。OSIのネットワーク層の機器。","https://www.ntt.com/business/services/rink/knowledge/archive_05.html","【階層別一覧】ネットワーク機器の種類・特長を解説（NTTドコモビジネス）",["スイッチは宛先MACアドレスを見て転送先ポートを切り替えるデータリンク層の機器で、IPアドレスによる経路制御はしない。","ハブは受け取った信号をすべてのポートに送り出す物理層の集線装置で、アドレスの解析はしない。","リピータは信号を増幅・整形して延長する物理層の機器で、経路の判断は行わない。"],"https://www.youtube.com/watch?v=x1-xP6IIVDA","ルーターとハブの役割を説明！／ITパスポート・基本情報技術者・高校情報","",["x:info3_10","ルータはネットワーク層で中継"]],["IPは現在、IPv4から何に切り替わりつつあるか？","IPv6","IPv5","IPsec","IPX","IPv6は、IPv4のアドレス不足を解決するため作られた次世代のインターネットプロトコル。アドレスが128ビットで、事実上無限ともいえる数のアドレスを割り当てられる。現在はIPv4と併用されながら移行が進んでいる。","https://e-words.jp/w/IP%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9.html","IPアドレスとは（IT用語辞典 e-Words）",["IPv5は実験用ストリームプロトコル（ST2）に番号が割り当てられたもので、IPv4の後継として普及したものではない。","IPsecはIP通信を暗号化・認証するためのセキュリティプロトコル群で、IPv4に代わる新しいバージョンではない。","IPXはNovell社のNetWareで使われていた独自のネットワーク層プロトコルで、IPの後継ではない。"],"https://www.youtube.com/watch?v=mGIgWl73HHI","IPアドレスの仕組みとは プライベートIP/パブリックIPやIPv6など基本を解説","",["w:056_3","IPv6アドレスの16進表記と0の省略表記",{"a":"Indeterminate","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Ipv6_address.svg"}]],["IPv4のIPアドレスは何ビットで構成されるか？","32ビット","64ビット","128ビット","48ビット","IPv4のIPアドレスは32ビットで、8ビットずつ4つに区切って10進数で表す（例：192.168.1.10）。表せるアドレスは約43億個で、インターネットの普及で不足した。","https://e-words.jp/w/IP%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9.html","IPアドレスとは（IT用語辞典 e-Words）",["64ビットはIPv6アドレスのインターフェースID部分などの長さで、IPv4アドレス全体の長さではない。","128ビットはIPv6アドレスの長さ。アドレス不足を解消するためIPv4の32ビットから拡張された。","48ビットはMACアドレスの長さで、IPアドレスのビット数ではない。"],"https://www.youtube.com/watch?v=mGIgWl73HHI","IPアドレスの仕組みとは プライベートIP/パブリックIPやIPv6など基本を解説","",["x:info3_12","IPv4アドレスの構成（クラスA～C）"]],["IPアドレスからネットワーク部分だけを取り出すための情報を何というか？","ネットマスク（サブネットマスク）","デフォルトゲートウェイ","MACアドレス","ポート番号","ネットマスク（サブネットマスク）は、IPアドレスのうち、どこまでがネットワーク部かを示す情報。IPアドレスとビットごとのANDをとるとネットワークアドレスが得られる。255.255.255.0（/24）なら上位24ビットがネットワーク部。","https://e-words.jp/w/IP%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9.html","IPアドレスとは（IT用語辞典 e-Words）",["デフォルトゲートウェイは、宛先が別ネットワークのときにパケットを送る先のルータのアドレスで、ネットワーク部を取り出す情報ではない。","MACアドレスは機器固有の物理アドレスで、IPアドレスのネットワーク部とホスト部の境界は示さない。","ポート番号はアプリケーションを識別する番号で、IPアドレスとは別の情報である。"],"https://www.youtube.com/watch?v=mGIgWl73HHI","IPアドレスの仕組みとは プライベートIP/パブリックIPやIPv6など基本を解説","",["x:info3_13","ネットマスクとのANDでネットワーク部を取り出す"]],["組織内で自由に使えるが、インターネット上に出すことは禁止されているアドレスは？","プライベートアドレス","グローバルアドレス","ブロードキャストアドレス","ループバックアドレス","プライベートアドレスは、会社や家庭のLANの中で自由に使えるIPアドレス（10.x.x.x、172.16〜31.x.x、192.168.x.x）。インターネット上では使えないので、外部と通信するときはルータのNAT機能でグローバルアドレスに変換する。","https://e-words.jp/w/IP%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9.html","IPアドレスとは（IT用語辞典 e-Words）",["グローバルアドレスはインターネット上で一意に割り当てられるアドレスで、インターネットで使うためのものである。","ブロードキャストアドレスは同じネットワーク内のすべての機器に一斉送信するための宛先アドレス（ホスト部が全1）である。","ループバックアドレス（127.0.0.1など）は自分自身を指すアドレスで、組織内で自由に割り当てるためのものではない。"],"https://www.youtube.com/watch?v=mGIgWl73HHI","IPアドレスの仕組みとは プライベートIP/パブリックIPやIPv6など基本を解説",""],["トランスポート層で、パケットの伝送制御（信頼性の確保）を行うプロトコルは？","TCP","UDP","IP","ICMP","TCP（Transmission Control Protocol）は、トランスポート層のコネクション型プロトコル。通信の前に接続を確立し、データの到着確認、再送、順序の並べ替えなどを行って、データを確実に届ける。Web、メール、ファイル転送などで使われる。","https://e-words.jp/w/%E3%82%A6%E3%82%A7%E3%83%AB%E3%83%8E%E3%82%A6%E3%83%B3%E3%83%9D%E3%83%BC%E3%83%88.html","ウェルノウンポートとは（IT用語辞典 e-Words）",["UDPはコネクションレス型で、到着確認や再送を行わない。信頼性より速さを重視するプロトコルである。","IPはネットワーク層のプロトコルで、宛先までの経路選択を担う。到着確認などの信頼性の確保は行わない。","ICMPはネットワーク層でエラー通知や疎通確認（ping）に使うプロトコルで、トランスポート層の伝送制御ではない。"],"https://www.youtube.com/watch?v=CS7pU2Km6DU","【応用情報】OSI基本参照モデルとTCP/IPをわかりやすく解説｜TCP・UDP・IP","",["w:113_3","TCPの3ウェイハンドシェイク（SYN・SYN-ACK・ACK）",{"a":"300px-Tcp-handshake.png: ??? derivative work: Snubcube (talk","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Tcp-handshake.svg"}]],["ヘッダにポート番号などの最小限の情報だけを載せた、コネクションレス型のプロトコルは？","UDP","TCP","HTTP","ARP","UDP（User Datagram Protocol）は、トランスポート層のコネクションレス型プロトコル。ヘッダはポート番号など最小限で、到着確認や再送をしないため信頼性はないが、高速でリアルタイム性が高い。音声通話、動画配信、DNSなどで使われる。","https://e-words.jp/w/%E3%82%A6%E3%82%A7%E3%83%AB%E3%83%8E%E3%82%A6%E3%83%B3%E3%83%9D%E3%83%BC%E3%83%88.html","ウェルノウンポートとは（IT用語辞典 e-Words）",["TCPはコネクション型で、到着確認・再送・順序制御のための情報をヘッダに持つため、最小限の構成ではない。","HTTPはWebのデータをやり取りするアプリケーション層のプロトコルで、トランスポート層のプロトコルではない。","ARPはIPアドレスから対応するMACアドレスを調べるためのプロトコルで、データ転送用ではない。"],"https://www.youtube.com/watch?v=CS7pU2Km6DU","【応用情報】OSI基本参照モデルとTCP/IPをわかりやすく解説｜TCP・UDP・IP","",["x:info3_16","UDPパケットの構成（ヘッダはポート番号）"]],["IPアドレスだけでは、どのアプリケーションのパケットか識別できない。そのための情報は？","ポート番号","MACアドレス","ネットマスク","TTL","ポート番号は、1台のコンピュータの中で、どのアプリケーション（サービス）宛てのデータかを区別するための番号（0〜65535）。IPアドレスが建物の住所なら、ポート番号は部屋番号にあたる。","https://e-words.jp/w/%E3%82%A6%E3%82%A7%E3%83%AB%E3%83%8E%E3%82%A6%E3%83%B3%E3%83%9D%E3%83%BC%E3%83%88.html","ウェルノウンポートとは（IT用語辞典 e-Words）",["MACアドレスは同じネットワーク内で機器を識別する物理アドレスで、アプリケーションの区別には使えない。","ネットマスクはIPアドレスのネットワーク部とホスト部の境界を示す情報で、アプリケーションは識別しない。","TTLはパケットが通過できるルータ数の上限を示す値で、ループ防止に使う。宛先アプリケーションの識別とは無関係。"],"https://www.youtube.com/watch?v=CS7pU2Km6DU","【応用情報】OSI基本参照モデルとTCP/IPをわかりやすく解説｜TCP・UDP・IP","",["x:info3_17","ポート番号でアプリケーションを識別"]],["TCP/IPの主要なプロトコルに、あらかじめ決められているポート番号を何というか？","ウェルノウンポート","ダイナミックポート","プライベートポート","エフェメラルポート","ウェルノウンポート（0〜1023番）は、主要なサービスにあらかじめ割り当てられているポート番号。例：HTTP 80、HTTPS 443、SMTP 25、POP3 110、FTP 20/21、SSH 22、DNS 53。","https://e-words.jp/w/%E3%82%A6%E3%82%A7%E3%83%AB%E3%83%8E%E3%82%A6%E3%83%B3%E3%83%9D%E3%83%BC%E3%83%88.html","ウェルノウンポートとは（IT用語辞典 e-Words）",["ダイナミックポート（49152〜65535番）は、通信のたびに一時的に割り当てられるポートで、決まったサービス用ではない。","プライベートポートはダイナミックポートの別名で、自由に使える範囲を指す。主要プロトコル用にあらかじめ決められたものではない。","エフェメラルポートはクライアント側が通信時に一時的に使うポート番号で、固定の割当てではない。"],"https://www.youtube.com/watch?v=CS7pU2Km6DU","【応用情報】OSI基本参照モデルとTCP/IPをわかりやすく解説｜TCP・UDP・IP",""],["ポート番号25で定義され、メールをバケツリレー式に転送するプロトコルは？","SMTP","POP3","IMAP","FTP","SMTP（Simple Mail Transfer Protocol）は、メールを送信したり、メールサーバ間でバケツリレーのように転送したりするためのプロトコル。ウェルノウンポートは25番（送信用に587番も使われる）。","https://www.kagoya.jp/howto/it-glossary/mail/smtpserver/","SMTPサーバーとは？IMAPやPOPとの違い（カゴヤのサーバー研究室）",["POP3はメールボックスからメールを受信するプロトコルで、ポート番号は110番。転送には使わない。","IMAPはメールをサーバ上に置いたまま閲覧・管理する受信用プロトコルで、ポート番号は143番。","FTPはファイル転送用のプロトコルで、ポート番号は20番・21番。メール転送には使わない。"],"https://www.youtube.com/watch?v=g_d7ddqasK8","【メールの仕組み】SMTP・IMAP・POP3の違いとは？図解で解説","",["x:info3_19","電子メールのしくみ（SMTPで転送）"]],["ポート番号110で定義され、メールボックスからメールを受信するプロトコルは？","POP3","SMTP","HTTP","SNMP","POP3（Post Office Protocol version 3）は、メールサーバのメールボックスから、自分のパソコンにメールを受信（ダウンロード）するためのプロトコル。ポート番号は110番。サーバ上でメールを管理したまま読むのはIMAP。","https://www.kagoya.jp/howto/it-glossary/mail/smtpserver/","SMTPサーバーとは？IMAPやPOPとの違い（カゴヤのサーバー研究室）",["SMTPはメールの送信やサーバ間転送に使うプロトコルで、ポート番号は25番。受信用ではない。","HTTPはWebブラウザとWebサーバ間の通信に使うプロトコルで、ポート番号は80番。","SNMPはネットワーク機器の監視・管理用プロトコルで、ポート番号は161番など。メール受信には使わない。"],"https://www.youtube.com/watch?v=g_d7ddqasK8","【メールの仕組み】SMTP・IMAP・POP3の違いとは？図解で解説","",["x:info3_20","POP3のシーケンス（ポート番号110）"]],["文章だけでなく、文書の構造や書式の指定も記述できる言語を何というか？","マークアップ言語","スクリプト言語","アセンブリ言語","機械語","マークアップ言語は、文章にタグを付けて、見出し・段落・リンク・画像などの構造や書式を指定する言語。Webページを記述するHTMLが代表。タグで構造を表すことで、コンピュータが文書を処理しやすくなる。","https://atmarkit.itmedia.co.jp/ait/articles/1703/29/news045.html","超入門HTTPプロトコル 第1回 HTTPプロトコルとは（@IT）",["スクリプト言語はJavaScriptやPythonなど、手軽に記述して実行できるプログラミング言語で、文書構造の記述が目的ではない。","アセンブリ言語は機械語の命令を記号で表した低水準のプログラミング言語で、文書の書式指定には使わない。","機械語はCPUが直接実行できる0と1の命令の並びで、文書の構造や書式を記述する言語ではない。"],"https://www.youtube.com/watch?v=sKNF-sffx4k","HTTPとは？HTTPの仕組みを図解で3分でわかりやすく解説",""],["WebサーバとWebブラウザ間でデータを送受信するためのプロトコルは？","HTTP","FTP","SMTP","SNMP","HTTP（HyperText Transfer Protocol）は、WebブラウザとWebサーバの間で、HTMLや画像などのデータをやり取りするためのプロトコル。ポート番号は80番。暗号化して安全にしたものがHTTPS（443番）。","https://atmarkit.itmedia.co.jp/ait/articles/1703/29/news045.html","超入門HTTPプロトコル 第1回 HTTPプロトコルとは（@IT）",["FTPはファイル転送用のプロトコルで、WebサーバとWebブラウザの通信には一般に使わない。","SMTPはメールの送信・転送用プロトコルで、Webページのやり取りには使わない。","SNMPはネットワーク機器の監視・管理用プロトコルで、Webのデータ送受信には使わない。"],"https://www.youtube.com/watch?v=sKNF-sffx4k","HTTPとは？HTTPの仕組みを図解で3分でわかりやすく解説","",["x:info3_22","HTTPのリクエストとレスポンス"]],["インターネット上のリソースの所在を表す情報を何というか？","URL","IPアドレス","MACアドレス","DNS","URL（Uniform Resource Locator）は、インターネット上のWebページやファイルなどのリソースの所在（どこにあるか）を示す表記。例：https://www.example.com/index.html は、プロトコル、サーバ名、パスからなる。","https://atmarkit.itmedia.co.jp/ait/articles/1703/29/news045.html","超入門HTTPプロトコル 第1回 HTTPプロトコルとは（@IT）",["IPアドレスはネットワーク上の機器を識別する番号で、機器内のどのファイルかといったリソースの所在までは表さない。","MACアドレスは機器固有の物理アドレスで、同じネットワーク内の通信に使う。リソースの所在を示すものではない。","DNSはドメイン名とIPアドレスを対応付ける仕組みで、リソースの所在を示す表記そのものではない。"],"https://www.youtube.com/watch?v=sKNF-sffx4k","HTTPとは？HTTPの仕組みを図解で3分でわかりやすく解説","",["x:info3_23","URLの構成（プロトコル・ホスト名・パス）"]],["TCP/IP上で定義されるファイル転送プロトコルは？","FTP","HTTP","SMTP","UDP","FTP（File Transfer Protocol）は、TCP/IPネットワーク上でファイルを転送するためのプロトコル。制御用（21番）とデータ転送用（20番など）の2つの接続を使う。暗号化されないため、現在はSFTPなどの安全な方式が推奨される。","https://e-words.jp/w/PASV%E3%83%A2%E3%83%BC%E3%83%89.html","PASVモード（パッシブモード）とは（IT用語辞典 e-Words）",["HTTPはWebページなどをやり取りするプロトコルで、ファイル転送専用に定義されたプロトコルではない。","SMTPはメールの送信・転送用プロトコルで、ファイル転送用ではない。","UDPはトランスポート層のコネクションレス型プロトコルで、ファイル転送を定義したアプリケーション層プロトコルではない。"],"https://www.youtube.com/watch?v=-lP-s-w7o28","【CCNAポイント解説#33】「FTP」の要点をわかりやすく解説",""],["FTPの、接続方法による2種類の組合せは？","アクティブFTP、パッシブFTP","セキュアFTP、オープンFTP","TCP-FTP、UDP-FTP","プライベートFTP、パブリックFTP","FTPには、サーバ側からクライアントへデータ用の接続を張るアクティブモードと、クライアント側からサーバへ接続を張るパッシブモードがある。ファイアウォールの内側からはパッシブモードが使われることが多い。","https://e-words.jp/w/PASV%E3%83%A2%E3%83%BC%E3%83%89.html","PASVモード（パッシブモード）とは（IT用語辞典 e-Words）",["FTPに「セキュア」「オープン」というモード区分はない。暗号化したものはFTPSやSFTPとして別に扱われる。","FTPはTCPの上で動作するプロトコルで、UDPを使う方式はない。接続方法の区分でもない。","プライベート・パブリックはFTPの接続方法ではない。匿名で利用できるサーバをanonymous FTPと呼ぶことはある。"],"https://www.youtube.com/watch?v=-lP-s-w7o28","【CCNAポイント解説#33】「FTP」の要点をわかりやすく解説","",["x:info3_25","アクティブFTPのシーケンス"]],["ネットワーク上で稼働している機器を、ネットワーク経由で監視・管理するためのプロトコルは？","SNMP","SMTP","FTP","DHCP","SNMP（Simple Network Management Protocol）は、ルータやスイッチ、サーバなどのネットワーク機器の状態を、ネットワーク経由で監視・管理するためのプロトコル。障害の発生を管理装置に通知することもできる。","https://blogs.manageengine.jp/snmp/","SNMP入門（ManageEngineブログ）",["SMTPはメールの送信・転送用プロトコルで、機器の監視・管理には使わない。","FTPはファイル転送用プロトコルで、ネットワーク機器の状態監視には使わない。","DHCPは接続した機器にIPアドレスなどを自動で割り当てるプロトコルで、監視・管理用ではない。"],"https://www.youtube.com/watch?v=RD0-7amubAE","【CCNAポイント解説#31】「SNMP」の要点をわかりやすく解説",""],["SNMPで管理されるネットワーク機器の状態を定義した管理情報を何というか？","MIB","TCB","FAT","DNS","MIB（Management Information Base：管理情報ベース）は、SNMPで管理されるネットワーク機器の情報（インターフェースの状態、通信量、エラー数など）を、決まった構造で定義したデータベース。","https://blogs.manageengine.jp/snmp/","SNMP入門（ManageEngineブログ）",["TCBはタスクの状態などをOSが管理するための制御ブロック（またはTCPの接続管理情報）で、SNMPの管理情報ではない。","FATはディスク上のファイルの記録位置を管理するファイルシステムの方式で、ネットワーク管理とは関係ない。","DNSはドメイン名とIPアドレスを対応付ける仕組みで、機器の状態を定義した管理情報ではない。"],"https://www.youtube.com/watch?v=RD0-7amubAE","【CCNAポイント解説#31】「SNMP」の要点をわかりやすく解説","",["x:info3_27","MIBのオブジェクトツリー"]],["音声や映像をはじめ、さまざまな形態の情報をまとめて何というか？","マルチメディア","マルチタスク","マルチキャスト","マルチプロセッサ","マルチメディアは、文字、画像、音声、動画など、さまざまな形態の情報を組み合わせて扱うこと。デジタル化によって、これらを同じコンピュータやネットワークで一緒に扱えるようになった。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%83%A1%E3%83%87%E3%82%A3%E3%82%A2.html","マルチメディアとは（IT用語辞典 e-Words）",["マルチタスクは、1台のコンピュータで複数の処理を並行して実行するOSの機能で、情報の形態の話ではない。","マルチキャストは、特定の複数の宛先へ同時にデータを送る通信方式で、情報の種類をまとめた呼び名ではない。","マルチプロセッサは、複数のCPUで処理を分担するコンピュータの構成で、情報の形態とは関係がない。"],"https://www.youtube.com/watch?v=KvsKjTXol38","【高校情報1】動画のディジタル化と圧縮の仕組み",""],["CPUを使って、時間領域の信号を周波数領域に変換する方法として何が用いられるか？","DFT（離散フーリエ変換）","PCM","DMA","CRC","DFT（Discrete Fourier Transform：離散フーリエ変換）は、標本化した時間領域の信号を、どの周波数成分がどれだけ含まれているかという周波数領域のデータに変換する計算。音声分析、振動解析、画像処理などに使われる。","https://manabitimes.jp/math/2280","フーリエ変換の意味と応用例（高校数学の美しい物語）",["PCMはアナログ信号を標本化・量子化・符号化してデジタル化する方式で、周波数領域への変換ではない。","DMAはCPUを介さずに周辺装置とメモリの間で直接データを転送する方式で、信号の変換計算ではない。","CRCは誤り検出に使う巡回冗長検査で、データの誤りを見つけるための計算である。"],"https://www.youtube.com/watch?v=ZibUbfrJ6LM","フーリエ変換とは？【高校生でもわかるフーリエ展開・フーリエ変換#2】","",["w:043_3","時間領域の音声波形とFFTで得た周波数スペクトル",{"a":"Accountalive","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Simple_time_domain_vs_frequency_domain_IRL.svg"}]],["DFTよりもさらに高速に演算するアルゴリズムは？","FFT","DCT","PWM","LZ77","FFT（Fast Fourier Transform：高速フーリエ変換）は、DFTを効率よく計算するアルゴリズム。データ数Nに対して、DFTではN²回程度の計算が必要なところを、N log N回程度に減らせる。データ数を2のべき乗にして使うことが多い。","https://manabitimes.jp/math/2280","フーリエ変換の意味と応用例（高校数学の美しい物語）",["DCT（離散コサイン変換）はJPEGなどの画像圧縮で使う周波数変換で、DFTを高速化したアルゴリズムではない。","PWMはパルスの幅を変えて平均電力を制御する変調方式で、フーリエ変換の計算法ではない。","LZ77は過去に出現したデータ列を位置と長さで置き換える辞書式の可逆圧縮法で、周波数解析とは無関係。"],"https://www.youtube.com/watch?v=ZibUbfrJ6LM","フーリエ変換とは？【高校生でもわかるフーリエ展開・フーリエ変換#2】","",["w:038_1","4点FFTのバタフライ演算の流れ図",{"a":"Kkuhts","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Radix-2_FFT_butterfly_diagram.png"}]],["人間の視覚特性を利用した非可逆符号化による、静止画圧縮の標準規格は？","JPEG","MPEG","PNG","GIF","JPEG（Joint Photographic Experts Group）は、写真などの静止画を圧縮する国際標準規格。人の目が細かい色や明るさの変化に鈍感な性質を利用して、DCTで周波数成分に変換し、目立たない情報を捨てる非可逆圧縮を行う。","https://e-words.jp/w/JPEG.html","JPEGとは（IT用語辞典 e-Words）",["MPEGは動画と音声の圧縮規格で、静止画用ではない。","PNGは可逆圧縮の静止画形式で、情報を捨てる非可逆符号化は行わない。","GIFは最大256色を扱う可逆圧縮の画像形式で、写真向けの非可逆圧縮規格ではない。"],"https://www.youtube.com/watch?v=oPpFKUJ3z5o","JPEGファイルとは何か、画像の圧縮される仕組み【JPEG圧縮】","",["x:info3_31","JPEG符号化の流れ"]],["動画符号化の標準化を行うISO/IECのワーキンググループの名称は？","MPEG","JPEG","IEEE","ITU","MPEG（Moving Picture Experts Group）は、動画と音声の符号化（圧縮）方式を標準化するISO/IECの作業グループ、およびその規格の名前。MPEG-2（DVD、デジタル放送）、MPEG-4（ネット動画）などがある。前後のフレームとの差分を利用して効率よく圧縮する。","https://e-words.jp/w/JPEG.html","JPEGとは（IT用語辞典 e-Words）",["JPEGは静止画の圧縮規格、およびそれを定めた専門家グループの名称で、動画の符号化が対象ではない。","IEEEは米国の電気電子学会で、LAN（IEEE802）などの規格を定める団体。ISO/IECの作業グループではない。","ITUは国際電気通信連合で、国連の専門機関である。ISO/IECのワーキンググループではない。"],"https://www.youtube.com/watch?v=oPpFKUJ3z5o","JPEGファイルとは何か、画像の圧縮される仕組み【JPEG圧縮】",""],["データ保存の際、複数のファイルを1つのファイルにまとめることを何というか？","アーカイブ","バックアップ","ミラーリング","フラグメンテーション","アーカイブは、複数のファイルやフォルダを1つのファイルにまとめること（書庫化）。まとめておくと、保管や送受信がしやすくなる。多くの場合、圧縮と同時に行う。","https://wa3.i-3-i.info/word11512.html","アーカイブファイルとは（わわわIT用語辞典）",["バックアップは、障害に備えてデータの複製を別の場所に保存しておくことで、ファイルを1つにまとめることではない。","ミラーリングは、同じデータを複数のディスクに同時に書き込んで二重化すること（RAID1など）である。","フラグメンテーションは、ファイルがディスク上で細切れに分散して記録される断片化の現象である。"],"https://www.youtube.com/watch?v=rXwiOOoDf8c","【ゆっくり解説】Zipファイルはなぜ小さくなるのか？圧縮の仕組み",""],["複数のファイルを1つにまとめる代表的なアーカイブフォーマットは？","ZIP","JPEG","MP3","HTML","ZIPは、複数のファイルを1つにまとめ（アーカイブ）、同時に圧縮もできる代表的なファイル形式。多くのOSで標準的に扱える。ほかにLZH、RAR、7z、tar.gzなどの形式がある。","https://wa3.i-3-i.info/word11512.html","アーカイブファイルとは（わわわIT用語辞典）",["JPEGは静止画の非可逆圧縮形式で、複数のファイルを1つにまとめる機能はない。","MP3は音声の非可逆圧縮形式で、アーカイブ用の形式ではない。","HTMLはWebページを記述するマークアップ言語で、ファイルをまとめる形式ではない。"],"https://www.youtube.com/watch?v=rXwiOOoDf8c","【ゆっくり解説】Zipファイルはなぜ小さくなるのか？圧縮の仕組み",""],["データ列が過去のある範囲内に出現していたら、その位置と長さの情報に置き換える辞書式圧縮法は？","LZ77（スライド辞書法）","ハフマン符号","ランレングス符号","DCT","LZ77（スライド辞書法）は、データ列が少し前の範囲に既に出てきていたら、その部分を「何文字前から何文字分」という位置と長さの情報に置き換える可逆圧縮法。ZIP（Deflate）やLZHなど、多くの圧縮形式の基礎になっている。","https://wa3.i-3-i.info/word11512.html","アーカイブファイルとは（わわわIT用語辞典）",["ハフマン符号は、出現頻度の高い記号ほど短い符号を割り当てる可逆圧縮で、位置と長さへの置き換えは行わない。","ランレングス符号は、同じ値が連続する部分を「値と連続数」で表す圧縮法で、辞書式ではない。","DCTは信号を周波数成分に変換する計算で、JPEGの非可逆圧縮に使われる。辞書式圧縮ではない。"],"https://www.youtube.com/watch?v=rXwiOOoDf8c","【ゆっくり解説】Zipファイルはなぜ小さくなるのか？圧縮の仕組み",""],["正規の受信者以外に読み取れないよう、送信データに特別な変換を施すことを何というか？","暗号化","圧縮","符号化","認証","暗号化は、正規の受信者以外が読めないように、決まった規則（アルゴリズム）と鍵を使ってデータを変換すること。暗号化されたデータを元に戻すことを復号という。通信の盗聴やデータの漏えいを防ぐ。","https://cybersecurity-jp.com/column/53774","公開鍵・秘密鍵とは？仕組みを初心者に分かりやすく解説（サイバーセキュリティ.com）",["圧縮は、データの冗長な部分を減らしてサイズを小さくすることで、第三者に読めなくすることが目的ではない。","符号化は、情報を決まった規則で符号に置き換えること全般を指し、秘密を守る目的に限らない。","認証は、相手が本人であるかやデータが正当であるかを確かめることで、データを読めなくする変換ではない。"],"https://www.youtube.com/watch?v=BbuGVf_oNSc","共通鍵暗号方式と公開鍵暗号方式の仕組みをわかりやすく解説","",["w:209_1","共通の秘密鍵で暗号化・復号する流れ",{"a":"Phayzfaustyn","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Symmetric_key_encryption.svg"}]],["暗号化と復号に同一の鍵を使う暗号方式は？","秘密鍵暗号（共通鍵暗号）","公開鍵暗号","ハッシュ暗号","電子署名","秘密鍵暗号（共通鍵暗号）は、暗号化と復号に同じ鍵を使う方式。処理が速いが、鍵を相手に安全に渡す方法（鍵配送）が課題になる。AESなどが代表。","https://cybersecurity-jp.com/column/53774","公開鍵・秘密鍵とは？仕組みを初心者に分かりやすく解説（サイバーセキュリティ.com）",["公開鍵暗号は、公開鍵と秘密鍵の異なる2つの鍵を使う方式で、同一の鍵は使わない。","ハッシュ関数は任意のデータから固定長の値を求める一方向の計算で、復号できないため暗号方式とはいえない。","電子署名は、送信者の本人確認と改ざん検出のための技術で、暗号化と復号に同じ鍵を使う方式ではない。"],"https://www.youtube.com/watch?v=BbuGVf_oNSc","共通鍵暗号方式と公開鍵暗号方式の仕組みをわかりやすく解説","",["x:info3_37","秘密鍵（共通鍵）暗号のしくみ"]],["2個1組の鍵を使ってデータの暗号化と復号を行う方式は？","公開鍵暗号","秘密鍵暗号","共通鍵暗号","シーザー暗号","公開鍵暗号は、公開鍵と秘密鍵の2つ1組の鍵を使う方式。公開鍵で暗号化したデータは、対になる秘密鍵でしか復号できない。公開鍵は誰に知られてもよいので、鍵配送の問題を解決できる。RSAなどが代表。","https://cybersecurity-jp.com/column/53774","公開鍵・秘密鍵とは？仕組みを初心者に分かりやすく解説（サイバーセキュリティ.com）",["秘密鍵暗号は、暗号化と復号に同じ1つの鍵を使う方式で、2個1組の鍵は使わない。","共通鍵暗号は秘密鍵暗号の別名で、送信側と受信側が同じ鍵を共有する方式である。","シーザー暗号は、文字を決まった数だけずらす古典的な換字式暗号で、2つの鍵の組は使わない。"],"https://www.youtube.com/watch?v=BbuGVf_oNSc","共通鍵暗号方式と公開鍵暗号方式の仕組みをわかりやすく解説","",["x:info3_38","公開鍵暗号のしくみ"]],["ディジタル署名は、何と何を組み合わせた認証技術か？","公開鍵暗号方式、ハッシュ関数","共通鍵暗号方式、パリティチェック","ファイアウォール、VPN","CRC、チェックサム","ディジタル署名は、送信者が文書のハッシュ値を自分の秘密鍵で暗号化して添付し、受信者は送信者の公開鍵で復号して、文書から計算したハッシュ値と比べる仕組み。一致すれば、送信者本人からのものであり、途中で改ざんされていないことが確認できる。","https://atmarkit.itmedia.co.jp/aig/06network/digitalsign.html","デジタル署名（@IT ネットワーク用語事典）",["共通鍵では誰が署名したか特定できず、パリティチェックは誤り検出の技術で改ざんの検出には不十分である。","ファイアウォールは不正なパケットを遮断する仕組み、VPNは暗号化した仮想専用線で、署名の構成要素ではない。","CRCとチェックサムはどちらも伝送誤りを検出する技術で、送信者の本人確認はできない。"],"https://www.youtube.com/watch?v=b4JCSTU403Q","デジタル署名・デジタル証明書・ハッシュ値の仕組み","",["x:info3_39","ディジタル署名のしくみ（ハッシュと公開鍵）"]],["不正アクセスや情報漏えいを防ぎ、ネットワークシステムの安全性を保つことを何というか？","ネットワークセキュリティ","ネットワークトポロジ","ネットワークマネジメント","フォールトトレランス","ネットワークセキュリティは、不正アクセス、情報漏えい、データの改ざん、ウイルス感染などからネットワークシステムを守り、安全性を保つための技術や対策。ファイアウォール、暗号化、認証、ウイルス対策などを組み合わせる。","https://www.soumu.go.jp/main_sosiki/cybersecurity/kokumin/basic/basic_risk_11.html","脆弱性（ぜいじゃくせい）とは？（総務省 国民のためのサイバーセキュリティサイト）",["ネットワークトポロジは、スター型やリング型など機器の接続形態のことで、安全性を保つ対策ではない。","ネットワークマネジメントは、機器の構成・性能・障害などを含めたネットワーク運用管理全般のことで、安全性に限った概念ではない。","フォールトトレランスは、故障が起きてもシステムが機能を維持できる耐障害性のことで、不正アクセス対策ではない。"],"https://www.youtube.com/watch?v=GB0-JdTttY8","情報セキュリティ入門（ファイアウォール・マルウェア・認証など）",""],["脅威となる行為に利用されかねない、システム上の欠陥を何というか？","脆弱性","冗長性","可用性","互換性","脆弱性は、ソフトウェアの設計ミスやプログラムの不具合など、攻撃者に悪用されるおそれのあるシステム上の弱点。見つかったら、修正プログラム（パッチ）を適用して早く対策する必要がある。","https://www.soumu.go.jp/main_sosiki/cybersecurity/kokumin/basic/basic_risk_11.html","脆弱性（ぜいじゃくせい）とは？（総務省 国民のためのサイバーセキュリティサイト）",["冗長性は、予備の装置や余分な情報を持たせて信頼性を高める性質で、欠陥ではない。","可用性は、システムが必要なときに使える状態にある度合いで、セキュリティで守るべき性質の一つである。","互換性は、異なる機器やソフトの間で同じように使える性質で、システム上の欠陥ではない。"],"https://www.youtube.com/watch?v=GB0-JdTttY8","情報セキュリティ入門（ファイアウォール・マルウェア・認証など）",""],["本来できないはずの操作ができてしまうような欠陥を何というか？","セキュリティホール","バックドア","ファイアウォール","ボトルネック","セキュリティホールは、脆弱性のうち、本来できないはずの操作（他人のデータの閲覧、管理者権限の取得など）ができてしまう欠陥。セキュリティ上の「穴」という意味。","https://www.soumu.go.jp/main_sosiki/cybersecurity/kokumin/basic/basic_risk_11.html","脆弱性（ぜいじゃくせい）とは？（総務省 国民のためのサイバーセキュリティサイト）",["バックドアは、正規の手続きを経ずに侵入できるよう仕掛けられた裏口で、攻撃者が意図的に設けることが多い。","ファイアウォールは、不正なパケットを遮断して内部ネットワークを守るセキュリティ対策の仕組みである。","ボトルネックは、システムの中で処理能力が最も低く、全体の性能を制限している箇所のことである。"],"https://www.youtube.com/watch?v=GB0-JdTttY8","情報セキュリティ入門（ファイアウォール・マルウェア・認証など）",""],["パケットを監視し、不適切なものを通さないセキュリティ技術は？","ファイアウォール","ルータ","ハブ","リピータ","ファイアウォールは、外部ネットワーク（インターネット）と内部ネットワークの境界に置き、通過するパケットを監視して、決められたルールに合わないものを通さない仕組み。防火壁の意味で、不正アクセスを防ぐ基本的な対策。","https://www.soumu.go.jp/main_sosiki/cybersecurity/kokumin/basic/basic_risk_11.html","脆弱性（ぜいじゃくせい）とは？（総務省 国民のためのサイバーセキュリティサイト）",["ルータは、宛先IPアドレスを見てパケットの経路を選ぶ中継機器で、不適切なパケットを遮断することが本来の目的ではない。","ハブは、受け取った信号をすべてのポートに送る集線装置で、パケットの監視は行わない。","リピータは、信号を増幅・整形して伝送距離を延ばす機器で、パケットの内容は見ない。"],"https://www.youtube.com/watch?v=GB0-JdTttY8","情報セキュリティ入門（ファイアウォール・マルウェア・認証など）","",["w:151_2","LANとWANの間に置かれたファイアウォール",{"a":"Bruno Pedrozo","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Firewall.png"}]],["デジタル情報が著作者に無断で複製されないよう、あらかじめ特別な処理をしておくことを何というか？","コピーガード","暗号化","圧縮","アーカイブ","コピーガード（コピープロテクト）は、映像・音楽・ソフトウェアなどのデジタル著作物が、著作者の許可なく複製されないよう、あらかじめ特別な処理を施しておく技術。","https://e-words.jp/w/CPRM.html","CPRMとは（IT用語辞典 e-Words）",["暗号化は、第三者が読めないようにデータを変換することで、複製そのものを防ぐことが目的ではない。","圧縮は、データ量を小さくする処理で、無断複製の防止とは関係がない。","アーカイブは、複数のファイルを1つにまとめることで、著作権保護の処理ではない。"],"https://www.youtube.com/watch?v=_nX7NMkPfAw","CPRM コピー防止DVDとパスワード付きDVDの違い",""],["著作権保護のため、コピー回数を制限する2つの仕組みの組合せは？","コピーワンス、ダビング10","CPRM、JPEG","DRM、ZIP","SSL、VPN","コピーワンスは、デジタル放送の番組を「1回だけ録画できる（複製不可）」とする制御方式。不便だったため、録画した番組を9回までコピーと1回のムーブ（計10回）ができるダビング10に緩和された。","https://e-words.jp/w/CPRM.html","CPRMとは（IT用語辞典 e-Words）",["CPRMは記録メディアのコピー制御方式だが、JPEGは静止画の圧縮規格で、コピー回数の制限とは無関係。","DRMはデジタル著作権管理の総称だが、ZIPはアーカイブ・圧縮形式で、コピー回数を制限する仕組みではない。","SSLは通信の暗号化、VPNは仮想専用線の技術で、どちらも著作物のコピー回数の制限とは関係がない。"],"https://www.youtube.com/watch?v=_nX7NMkPfAw","CPRM コピー防止DVDとパスワード付きDVDの違い","",["x:info3_45","ダビング10のしくみ"]],["コピーワンスに使われる、記録メディアのコピー制御方式は？","CPRM","CRC","CSMA","CPU","CPRM（Content Protection for Recordable Media）は、録画用のDVDやSDカードなどの記録メディアに使われる著作権保護技術。メディア固有のIDを使って暗号化し、対応機器以外では再生や複製ができないようにする。コピーワンスの番組の録画に使われた。","https://e-words.jp/w/CPRM.html","CPRMとは（IT用語辞典 e-Words）",["CRCは伝送誤りを検出する巡回冗長検査で、コピー制御の方式ではない。","CSMA（CSMA/CDなど）はイーサネットなどで伝送路の空きを確認してから送信するアクセス制御方式である。","CPUはプログラムを実行する中央処理装置で、記録メディアのコピー制御方式ではない。"],"https://www.youtube.com/watch?v=_nX7NMkPfAw","CPRM コピー防止DVDとパスワード付きDVDの違い","",["x:info3_46","CPRMのしくみ"]]]},{"id":"qc","title":"品質管理 1〜7 品質管理基礎（To-Be公式テキスト）","cat":"品質管理","q":[["管理技法の階層構造で、底辺を成す現場管理の手法を何というか？","5S","QC七つ道具","PDCA","方針管理","管理技法は、上から利益管理・原価管理（儲かる）、品質管理・生産管理（売れる）、そして底辺に現場管理の5Sがあるピラミッド構造になっている。5Sがしっかりしていないと、その上の管理もうまく機能せず、利益は出ない。","https://www.kaonavi.jp/dictionary/5s/","5Sとは？意味や目的、進め方をわかりやすく（カオナビ人事用語集）",["QC七つ道具は、パレート図や特性要因図など、データを分析して問題を解決するための手法群で、現場管理の土台ではない。","PDCAは計画・実施・確認・処置を繰り返す管理のサイクルで、階層構造の底辺に置かれる手法ではない。","方針管理は、中長期計画や年度方針を全社で体系的に達成するための活動で、階層の上位側の管理にあたる。"],"https://www.youtube.com/watch?v=7Hrzwfh4X9g","5S活動とは？整理・整頓・清掃・清潔・躾の内容と手順を解説","",["x:qc_1","管理技法の階層構造（利益・原価／品質・生産／現場管理の5S）"]],["5Sの組合せとして正しいものは？","整理、整頓、清掃、清潔、躾","整理、整頓、清掃、清潔、節約","整理、整頓、清掃、安全、躾","整理、整備、清掃、清潔、躾","5Sは、整理・整頓・清掃・清潔・躾の5つ。いずれもローマ字の頭文字がSなので5Sと呼ぶ。現場管理の基本で、管理技法の階層の土台になる。","https://www.kaonavi.jp/dictionary/5s/","5Sとは？意味や目的、進め方をわかりやすく（カオナビ人事用語集）",["最後の「節約」が誤り。5つ目は従業員にルールを守る習慣を身に付けさせる「躾」である。","「安全」は5Sに含まれない。4つ目は清掃した状態を保つ「清潔」である。","「整備」は5Sに含まれない。2つ目は物の置き場所を決めて並べる「整頓」である。"],"https://www.youtube.com/watch?v=7Hrzwfh4X9g","5S活動とは？整理・整頓・清掃・清潔・躾の内容と手順を解説",""],["5Sのうち「不必要な物を取り除き、整った状態にする」ことにあたるのは？","整理・整頓","清掃・清潔","躾","整備・点検","整理・整頓は「不必要な物を取り除き、整った状態にする」こと。清掃・清潔は「掃除をして、きれいな状態にする（保つ）」こと。職場に不要な物が散乱していないかを見直すのが出発点。","https://www.kaonavi.jp/dictionary/5s/","5Sとは？意味や目的、進め方をわかりやすく（カオナビ人事用語集）",["清掃・清潔は、掃除をしてきれいな状態にし、それを保つことで、不要物を取り除くことではない。","躾は、整理〜清潔を決められたとおりに実行する習慣を身に付けさせることで、不要物の除去そのものではない。","整備・点検は設備保全の用語で、5Sには含まれない。"],"https://www.youtube.com/watch?v=7Hrzwfh4X9g","5S活動とは？整理・整頓・清掃・清潔・躾の内容と手順を解説","",["x:qc_1","管理技法の階層構造（利益・原価／品質・生産／現場管理の5S）"]],["5Sのうち、一般社員みんなに整理〜清潔を身に付けさせる「躾」は、誰の業務とされているか？","管理職","一般社員","品質保証部門","経営トップ","整理・整頓・清掃・清潔は一般社員の方々の業務。それを一般社員みんなに身に付けさせる「躾」は、管理職の業務とされている。","https://www.kaonavi.jp/dictionary/5s/","5Sとは？意味や目的、進め方をわかりやすく（カオナビ人事用語集）",["一般社員の業務は整理・整頓・清掃・清潔の実践で、それを身に付けさせる躾は一般社員の役割ではない。","品質保証部門は製品の品質を保証する活動を担う部門で、現場の躾を受け持つ立場とはされていない。","経営トップは方針の決定や社長診断などを担う立場で、日々の現場での躾は管理職の業務とされる。"],"https://www.youtube.com/watch?v=7Hrzwfh4X9g","5S活動とは？整理・整頓・清掃・清潔・躾の内容と手順を解説",""],["管理技法の階層で、「質」と「量」を管理するものはそれぞれ何か？","品質管理、生産管理","原価管理、利益管理","現場管理、品質管理","生産管理、原価管理","製品が売れるためには、質の管理（品質管理）と量の管理（生産管理）が必要。お客さまが欲しい時に、欲しい数だけ、良い品質のものを供給することが求められる。","https://www.keyence.co.jp/ss/general/manufacture-tips/qcd.jsp","業務改善に役立つ「QCD」とは？（キーエンス）",["原価管理と利益管理は「儲かる」ための管理で、階層の最上位にあたる。質と量の管理ではない。","現場管理は5Sによる底辺の管理で、「量」を管理するものではない。","原価管理は「儲かる」ための管理で、「質」を管理するものではない。質の管理は品質管理である。"],"https://www.youtube.com/watch?v=pnNO-4wVQxE","生産管理の3要素「QCD」とは【改善活動の基礎】","",["x:qc_1","管理技法の階層構造（利益・原価／品質・生産／現場管理の5S）"]],["「何故コストが下がらないか？」に対するテキストの答えは？","品質が悪いから（不良や手戻りでコストが上がる）","人件費が高いから","材料費が高いから","設備が古いから","コストが下がらないのは品質が悪いから。不適合品や不良品、手戻りを作るとその分コストが上がる。また必要な量を必要な時に供給できないのも、品質が悪いために数量が作れないから。品質はコストと数量の両方に影響する根源的な考え方。","https://www.keyence.co.jp/ss/general/manufacture-tips/qcd.jsp","業務改善に役立つ「QCD」とは？（キーエンス）",["人件費が高いことはコストの一要因だが、テキストではコストが下がらない根本原因を品質の悪さと捉えている。","材料費もコストの一要因だが、不良や手戻りによるムダが根本原因とされており、答えにはならない。","設備の古さはテキストの答えではない。品質が悪く不良や手戻りが出ることがコストを押し上げるとしている。"],"https://www.youtube.com/watch?v=pnNO-4wVQxE","生産管理の3要素「QCD」とは【改善活動の基礎】","",["x:qc_6","品質管理が品質を通じてコストと数量に影響する関係"]],["品質管理の歴史で、最初に生まれた品質管理の考え方は何か？","補償","検査","製造（工程管理）","設計","品質管理の歴史は、補償→検査→製造→設計の順に進んできた。最初に生まれたのは、不良品を売ってしまったら補償するという考え方。補償という概念自体も比較的新しいもの。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["検査は補償の次に生まれた段階で、補償ロスを減らすため「悪い物を渡さない」ことを重視した考え方である。","製造（工程管理）は3番目の段階で、検査ロスへの反省から「製造で品質を作り込む」考え方である。","設計は最も新しい段階で、製造ロスへの反省から「お客さまの望むものを設計する」考え方である。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク","",["x:qc_7","品質管理の歴史（補償→検査→製造→設計と各段階のロス）"]],["「悪い物を買ったのはお客さまではなく供給者側の責任」として消費者保護を訴えたのは誰か？","J.F.ケネディ","石川馨","狩野紀昭","W.E.デミング","米国のJ.F.ケネディ大統領は、「悪い物を買ったのはお客さまの責任ではなく、供給者側の責任だ」として消費者保護を訴えた。それ以前は、悪い物を買ったのはお客さまの責任という考え方が一般的だった。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["石川馨は特性要因図を考案し、日本の品質管理やQCサークルの普及に貢献した人物で、消費者保護を訴えた大統領ではない。","狩野紀昭は魅力的品質・当たり前品質を示した狩野モデルの提案者で、消費者保護を訴えた人物ではない。","W.E.デミングは統計的品質管理を日本に指導した米国の統計学者で、デミング賞にその名を残す。消費者保護の提唱者ではない。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク",""],["「悪い物はお客さまに渡さない。良い物だけを渡そう」という品質管理の段階のキーワードは？","抜取検査","品質機能展開","統計的工程管理","消費者保護","補償はメーカーにとって痛手が大きい（補償ロス）ため、「悪い物はお客さまに渡さない」という検査重点主義に戻った。全数検査できるケースは少ないので、一部を検査する抜取検査がキーワードになる。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["品質機能展開（QFD）は、お客さまの要求を設計品質に落とし込む手法で、設計の段階のキーワードである。","統計的工程管理（SPC）は、製造工程で品質を作り込む製造の段階のキーワードである。","消費者保護は、供給者側に責任があるとする補償の段階につながる考え方で、検査の段階のキーワードではない。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク",""],["「不良品を作らなければ検査も補償も必要ない。製造で品質を作り込もう」という段階のキーワードは？","統計的工程管理（SPC）","抜取検査","品質機能展開（QFD）","消費者保護","検査をいくら頑張っても不良品は良品にならない（検査ロス）。そこで「製造で品質を作り込もう」という段階に戻った。そのキーワードが統計的工程管理（SPC：Statistical Process Control）。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["抜取検査は「悪い物はお客さまに渡さない」という検査の段階のキーワードで、製造で品質を作り込む考え方ではない。","品質機能展開（QFD）は、お客さまの要求を設計に反映させる設計の段階で使う手法である。","消費者保護は、悪い物を売った責任は供給者にあるとする補償の段階の考え方である。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク",""],["「設計段階でお客さまの望むものを設計しよう」という段階で使われる、日本で生まれた手法は？","品質機能展開（QFD）","統計的工程管理（SPC）","抜取検査","FMEA","図面どおりに作っても売れない（製造ロス）ので、さらに「設計段階でお客さまの望むものを設計しよう」という段階に戻った。そこで使われる日本生まれの手法が品質機能展開（QFD：Quality Function Deployment）。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["統計的工程管理（SPC）は製造の段階のキーワードで、設計段階でお客さまの要求を反映する手法ではない。","抜取検査は検査の段階のキーワードで、設計とは関係がない。","FMEAは故障モードとその影響を洗い出す信頼性解析の手法で、米国で発展したもの。日本で生まれた手法ではない。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク",""],["品質管理の歴史で、各段階の間に発生したロスの順番として正しいものは？","補償ロス → 検査ロス → 製造ロス","検査ロス → 補償ロス → 製造ロス","製造ロス → 検査ロス → 補償ロス","補償ロス → 製造ロス → 検査ロス","補償の段階で補償ロス、検査の段階で検査ロス、製造の段階で製造ロスが発生し、そのたびに品質管理は一つ前のフェーズへ戻ってきた。補償→検査→製造→設計という歴史の流れと対応させて覚える。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["最初に生じたのは補償の段階の補償ロスで、検査ロスはその次の段階で生じた。","製造ロスは最後に生じたロスで、順序が逆になっている。","検査ロスと製造ロスが入れ替わっている。検査の段階の後に製造の段階が来る。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク","",["x:qc_7","品質管理の歴史（補償→検査→製造→設計と各段階のロス）"]],["テキストが勧める、これからの企業の仕事の流れは？","設計 → 製造 → 検査 → 補償","補償 → 検査 → 製造 → 設計","検査 → 製造 → 設計 → 補償","製造 → 設計 → 検査 → 補償","これからの企業は、歴史とは逆の、設計→製造→検査→補償という流れで仕事をするのが望ましい。お客さまに受け入れられる物を設計し、図面どおりに製造し、念のため検査し、万一の場合は補償する。","https://monoist.itmedia.co.jp/mn/articles/1105/13/news001.html","IEにおける「品質管理」の本質と歴史的経緯（MONOist）",["これは品質管理の歴史の流れの順序で、これからの企業の仕事の流れとしては逆である。","検査から始まる流れでは、お客さまに受け入れられる物を最初に設計できず、テキストの勧める順序ではない。","製造を設計より先にすると、何を作るべきかが決まらない。最初にお客さまの望む物を設計する必要がある。"],"https://www.youtube.com/watch?v=Dz44VbGkGZw","継続的改善のための日本の品質管理フレームワーク","",["x:qc_7","品質管理の歴史（補償→検査→製造→設計と各段階のロス）"]],["JIS Z 8101 による品質管理の定義は？","買い手の要求に合った品質の品物またはサービスを経済的に作り出すための手段の体系","不良品をお客さまに渡さないための検査の体系","製品の機能を最大化するための技術の体系","生産量を最大化するための管理の体系","JIS Z 8101の定義では、品質管理とは「買い手の要求に合った品質の品物またはサービスを経済的に作り出すための手段の体系」。まず買い手の要求を明確にし、それに合ったものを経済的に作ることが求められる。品質管理を略してQCという。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["これは検査重点主義の考え方で、買い手の要求に合った品質を経済的に作り出すというJISの定義とは異なる。","機能の最大化は品質管理の定義に含まれない。定義の要点は買い手の要求に合うことと経済性である。","生産量の最大化は生産管理側の考え方で、品質管理の定義ではない。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～",""],["近代的な品質管理は統計的な手段を採用しているので、特に何と呼ばれることがあるか？","統計的品質管理","総合的品質管理","全社的品質管理","統計的工程管理","近代的な品質管理は統計的な手段を採用しているので、特に統計的品質管理（SQC）と呼ばれることがある。データにもとづいて工程を管理・改善するのが特徴。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["総合的品質管理（TQC）は、全部門・全階層が参加する品質管理を指す言葉で、統計的手段に着目した呼び名ではない。","全社的品質管理（CWQC）は、全社で取り組む品質管理を指す言葉で、統計的手段に着目した呼び名ではない。","統計的工程管理（SPC）は、統計的手法で製造工程を管理することで、品質管理全体の呼び名ではない。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～",""],["最近の品質管理の「二つの流れ」の組合せは？","ControlをManagementに置き換える、Qualityを「質」と訳す","検査を廃止する、設計を外注する","品質を数量に置き換える、管理を検査と訳す","ControlをCheckに置き換える、Qualityを「量」と訳す","最近の品質管理には二つの流れがある。一つはControl（管制）をManagement（管理）に置き換えること、もう一つはQualityを「品質」ではなく「質」と訳すこと。品質管理は「質のマネジメント」へと考え方が広がっている。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["検査の廃止や設計の外注は、品質管理の二つの流れとしてテキストに示されたものではない。","品質を数量に置き換えたり、管理を検査と訳したりする流れはない。Qualityは「質」と訳す方向である。","ControlはCheckではなくManagementに置き換えられ、Qualityは「量」ではなく「質」と訳される。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～","",["x:qc_16","JISの品質管理の定義とControl→Management、品質→質"]],["Controlという言葉をManagementに置き換えるようになった理由は？","Controlには計画という行為が含まれないから","Controlは英語として古いから","Managementの方が短いから","Controlは検査だけを指すから","Controlは「管制」という意味で、計画という行為が含まれない。飛行場のControl Tower（管制塔）が「離陸しなさい」と管制するようなもの。設計から始まるのが本来の品質管理なので、計画を含むManagementという言葉が使われるようになった。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["言葉の新旧は理由ではない。Controlには計画という行為が含まれないことが置き換えの理由である。","言葉の長さは理由ではない。計画を含む概念として、Managementが使われるようになった。","Controlは「管制」の意味で、検査だけを指す言葉ではない。計画が含まれない点が問題とされた。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～","",["x:qc_16","JISの品質管理の定義とControl→Management、品質→質"]],["全部門・全階層の参加による品質管理を何と呼ぶか？","全社的品質管理（CWQC）または総合的品質管理（TQC）","統計的品質管理（SQC）","統計的工程管理（SPC）","品質機能展開（QFD）","品質管理は検査部門だけでなく、市場調査から研究開発・設計・製造・販売・アフターサービスまで全部門、経営者から作業者まで全階層が参加して初めて有効に働く。これを全社的品質管理（CWQC）または総合的品質管理（TQC）という。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["統計的品質管理（SQC）は、統計的な手段を使う品質管理を指す呼び名で、全部門・全階層の参加を表すものではない。","統計的工程管理（SPC）は、統計的手法で製造工程を管理する手法で、全社的な活動を指す言葉ではない。","品質機能展開（QFD）は、お客さまの要求を設計品質に展開する手法で、全員参加の品質管理の呼び名ではない。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～","",["x:qc_18","全部門・全階層が参加する全社的品質管理（CWQC/TQC）"]],["CWQCは何の略か？","Company Wide Quality Control","Customer Wide Quality Control","Company Work Quality Check","Control Wide Quality Circle","CWQCはCompany Wide Quality Controlの略で、全社的品質管理のこと。全部門・全階層が参加して品質管理を行う日本的な考え方。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["CustomerではなくCompanyが正しい。全社（会社全体）で取り組むことを表している。","Work、Checkは誤りで、正しくはCompany Wide Quality Control。Controlは管理の意味である。","ControlとCircleの位置づけが誤り。Quality Circleは小集団活動のQCサークルを指す言葉である。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～",""],["TQCは何の略か？","Total Quality Control","Technical Quality Check","Total Quantity Control","Top Quality Circle","TQCはTotal Quality Controlの略で、総合的品質管理のこと。CWQCとほぼ同じ意味で使われる。最近はManagementの考え方を取り入れたTQMという言葉も使われる。","https://www.itmedia.co.jp/im/articles/0404/12/news053.html","TQC：情報システム用語事典（ITmedia）",["TechnicalやCheckは誤り。TQCのTはTotal、CはControlである。","QuantityではなくQualityが正しい。数量ではなく品質の管理である。","TopやCircleは誤り。TQCはTotal Quality Controlの略で、総合的品質管理を指す。"],"https://www.youtube.com/watch?v=-EqSSXDbW2c","TQC（Total Quality Control）の考え方 ～全社的品質管理～",""],["JIS Z 8101 による品質保証の定義は？","消費者の要求する品質が十分に満たされていることを保証するために、生産者が行う体系的活動","生産者の要求を消費者に満たしてもらうための活動","不適合品を検査で取り除く活動","製品を安く作るための活動","JIS Z 8101では、品質保証を「消費者の要求する品質が十分に満たされていることを保証するために、生産者が行う体系的活動」と定義している。お客さまが望むものを安全・安心に使えるようにするために、企業として何をするかということ。","https://www.keyence.co.jp/ss/general/manufacture-tips/qa_qc.jsp","どこがどう違う？「品質保証」と「品質管理」（キーエンス）",["主体と対象が逆。消費者の要求を満たすことを生産者が保証するのが品質保証である。","検査で不適合品を取り除くのは検査活動であり、品質保証の一部にすぎず、定義そのものではない。","安く作ることは原価管理の目的で、消費者の要求品質を保証するという品質保証の定義とは異なる。"],"https://www.youtube.com/watch?v=YcxMyNAk7WA","品質保証（QA）とは？品質管理との違いを解説",""],["品質保証と品質管理の関係として正しいものは？","品質保証が狙いで、品質管理はそれを達成する手段","品質管理が狙いで、品質保証はその手段","両者はまったく同じもの","品質保証は検査部門だけの活動","品質保証は狙い（目的）であり、それを達成する一つの手段が品質管理という活動。品質保証は企画・開発・生産・販売・サービスのすべてのステップで考える必要があり、全部門で品質管理が必要になる。","https://www.keyence.co.jp/ss/general/manufacture-tips/qa_qc.jsp","どこがどう違う？「品質保証」と「品質管理」（キーエンス）",["関係が逆。品質保証が目的であり、品質管理はそれを達成するための手段である。","両者は同じではない。品質保証は狙い、品質管理はそれを実現するための活動と区別される。","品質保証は企画から販売・サービスまで全ステップで考える必要があり、検査部門だけの活動ではない。"],"https://www.youtube.com/watch?v=YcxMyNAk7WA","品質保証（QA）とは？品質管理との違いを解説","",["x:qc_22","品質保証（狙い）と品質管理（手段）の関係"]],["広辞苑による「機能」の定義は？","全体を構成している各因子が有する固有な役割","品物の性質・性能の全体","お客さまが満足する度合い","製品の見た目の美しさ","広辞苑では、機能を「全体を構成している各因子が有する固有な役割、また、その役割を果たすこと・作用」と定義している。つまり機能とは役割、働きのこと。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["これはJIS Z 8101による「品質」の定義に近い内容で、機能の定義ではない。","お客さまが満足する度合いは顧客満足の考え方で、役割や働きを表す機能の定義ではない。","見た目の美しさは外観品質の一つで、機能の定義ではない。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き",""],["JIS Z 8101 による「品質」の定義は？","品物又はサービスが使用目的を満たしているかどうかを決定するための評価の対象となる固有の性質・性能の全体","全体を構成する各因子が有する固有な役割","製品を作るための手段の体系","お客さまの満足の程度","JIS Z 8101では、品質を「品物又はサービスが、使用目的を満たしているかどうかを決定するための評価の対象となる固有の性質・性能の全体」と定義している。機能が「働き」なのに対し、品質は「性質・性能」を指す。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["これは広辞苑による「機能」の定義である。品質は性質・性能の全体を指す。","手段の体系はJISによる「品質管理」の定義の表現で、品質そのものの定義ではない。","お客さまの満足の程度は顧客満足のことで、評価の対象となる性質・性能の全体という品質の定義とは異なる。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き",""],["機能はどのような形で表現できるか？","名詞（目的語）＋動詞「○○を△△する」","形容詞＋名詞","数値＋単位","主語＋述語＋目的語の英文","機能は「○○を△△する」のように、名詞（目的語）＋動詞で表現できる。例えばペンの機能は「字を書く」、レジ係の機能の一つは「釣り銭を渡す」、レーザーポインタの機能は「意図した所を示す」。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["形容詞＋名詞は「鮮やかな字」のような修飾の形で、働きを表す機能の表現にはならない。","数値＋単位は性能（目標値や公差）の表し方で、機能そのものの表現ではない。","英文の主語＋述語＋目的語の形は求められていない。機能は名詞＋動詞で簡潔に表す。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き",""],["テキストの考え方で、「品質」とは機能に対して何にあたるか？","機能にかかる修飾語","機能の目的語","機能の主語","機能の反対語","品質は、機能にかかる修飾語と考えられる。ペンなら「鮮やかな字を楽に長く書く」の「鮮やかな」「楽に」「長く」が品質にあたり、それぞれが性質・性能として表現できる。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["目的語は「字を書く」の「字」のように、機能を構成する名詞の部分で、品質にはあたらない。","機能は動作を表すもので、品質を主語として捉える考え方はとらない。","品質は機能の反対の概念ではなく、機能をどの程度うまく果たすかを修飾するものである。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_26","ペンの例：機能（字を書く）と品質（修飾語）の性質・性能"]],["ペンの「楽に書く」という品質の性質は何か？","筆圧値","鮮度値","筆記距離","インク量","ペンの「楽に書く」という品質の性質は筆圧値（どのくらいの力で字を書けるか）。「鮮やかな」は鮮度値、「長く書く」は筆記距離が性質で、それぞれに公差や目標値（性能）がある。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["鮮度値は「鮮やかな字」の品質の性質で、楽に書けるかどうかの性質ではない。","筆記距離は「長く書く」の品質の性質で、楽に書けるかどうかの性質ではない。","インク量は筆記距離に関係する要素だが、「楽に書く」の性質としてテキストが挙げるのは筆圧値である。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_26","ペンの例：機能（字を書く）と品質（修飾語）の性質・性能"]],["スーパーのレジ係の「正しい釣り銭を早く渡す」で、「早く」の品質の性質と性能は？","性質：時間、性能：a秒以内","性質：金額、性能：差がゼロ","性質：速度、性能：差がゼロ","性質：時間、性能：差がゼロ","レジ係の「正しく」の性質は金額で、性能は「差がゼロ」。「早く」の性質は時間で、性能は「a秒以内」。サービスにも、モノと同じように品質を考えることができる。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["性質：金額、性能：差がゼロ、は「正しく」の品質の組合せで、「早く」ではない。","速度ではなく時間が性質で、「差がゼロ」は「正しく」の性能である。","性質の時間は正しいが、「差がゼロ」は釣り銭の金額に対する性能で、「早く」の性能はa秒以内である。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_28","レジ係の例：サービスの品質の性質と性能"]],["「製造の目標としてねらった品質」を何というか？","設計品質（ねらいの品質）","製造品質（できばえの品質）","使用品質（要求の品質）","当たり前品質","設計品質（ねらいの品質）は、製造の目標としてねらった品質。図面や仕様書で決めた品質がこれにあたる。設計品質は、お客さまの要求の品質（使用品質）に合致していなければならない。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["製造品質（できばえの品質）は、設計品質をねらって実際に作った製品の品質で、目標としてねらった品質ではない。","使用品質（要求の品質）は、使用者が要求する品質で、製造の目標そのものではない。","当たり前品質は狩野モデルの品質要素で、満たされて当然と受け取られる品質を指す。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_29","品質の種類（使用品質・設計品質・製造品質）と合致の関係"]],["「設計品質をねらって製造した製品の実際の品質」を何というか？","製造品質（できばえの品質）","設計品質（ねらいの品質）","使用品質（要求の品質）","魅力的品質","製造品質（できばえの品質）は、設計品質をねらって実際に製造した製品の品質。製造品質は、設計品質（ねらいの品質）に合致していなければならない。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["設計品質（ねらいの品質）は、製造の目標としてねらった品質で、実際にできあがった品質ではない。","使用品質（要求の品質）は、使用者が要求する品質で、製造した製品の実際の品質ではない。","魅力的品質は狩野モデルの品質要素で、充足されれば満足を与えるが不充足でも不満にならない品質を指す。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き",""],["「使用者の要求する品質」を何というか？","使用品質（要求の品質）","設計品質（ねらいの品質）","製造品質（できばえの品質）","工程品質","使用品質（要求の品質）は、使用者（お客さま）が要求する品質。品質の3種類の出発点で、ねらいの品質はこれに合わせて決める必要がある。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["設計品質（ねらいの品質）は、製造の目標としてねらった品質で、使用者の要求そのものではない。","製造品質（できばえの品質）は、実際に製造した製品の品質で、使用者の要求ではない。","工程品質は、仕事のやり方の品質（業務品質）のことで、使用者の要求する品質ではない。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き",""],["品質の3種類について、正しい関係はどれか？","要求の品質にねらいの品質が合致し、ねらいの品質にできばえの品質が合致する","できばえの品質に要求の品質が合致すればよい","ねらいの品質だけが重要","3つの品質は互いに独立している","品質には使用品質（要求の品質）、設計品質（ねらいの品質）、製造品質（できばえの品質）の3種類がある。要求の品質にねらいの品質が合致し、ねらいの品質にできばえの品質が合致する、という3つが互いに合致することが重要。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["できばえと要求を直接合わせるだけでは不十分で、間にねらいの品質を正しく設定する必要がある。","ねらいの品質だけでなく、要求の品質との合致や、できばえの品質との合致も重要である。","3つの品質は独立ではなく、要求→ねらい→できばえの順に互いに合致させる必要がある。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_29","品質の種類（使用品質・設計品質・製造品質）と合致の関係"]],["図面どおりに良い製品を作っても売れない場合、原因はどの品質にあるか？","ねらいの品質（設計品質）","できばえの品質（製造品質）","検査の品質","工程の品質","図面どおりに良い製品を作っても売れないのは、ねらいの品質（設計品質）がお客さまの要求の品質に合致していないから。お客さまが欲しいモノを、欲しいように作らなければいけない。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["図面どおりに良い製品を作れているので、できばえの品質（製造品質）には問題がない。","検査の品質は、品質の3種類（要求・ねらい・できばえ）に含まれる概念ではない。","工程の品質は仕事のやり方の品質で、図面どおり作れている以上、売れない原因とはいえない。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_29","品質の種類（使用品質・設計品質・製造品質）と合致の関係"]],["「充足されれば満足を与え、不充足であれば不満を引き起こす」品質要素を何というか？","一元的品質要素","魅力的品質要素","当たり前品質要素","無関心品質要素","一元的品質要素は、機能が充足されれば満足し、不充足であれば不満を覚える品質要素。例えばレーザーポインタの明るさは、明るいと満足、暗いと不満になる。長い間、品質はこのように一元的に捉えられていた。","https://monoist.itmedia.co.jp/mn/articles/2011/20/news159.html","狩野モデルに学ぶ“当たり前を魅力的に”（MONOist）",["魅力的品質要素は、充足されれば満足するが、不充足でも不満は引き起こさない品質要素である。","当たり前品質要素は、充足されても当たり前と受け取られ、不充足なら不満を引き起こす品質要素である。","無関心品質要素は、充足されてもされなくても満足にも不満にも影響しない品質要素である。"],"https://www.youtube.com/watch?v=AWK-qN02pC8","顧客満足度と狩野モデル【社会人技術者向けマンガ動画】","",["x:qc_34","品質の二元的表現（魅力的品質要素と当たり前品質要素）"]],["品質の二元的表現を提案したのは誰か？","狩野先生（東京理科大学）","石川馨先生","J.F.ケネディ","パレート","東京理科大学の狩野先生は、横軸に機能充足の程度、縦軸にお客さまの満足の程度をとる、品質の二元的表現（狩野モデル）を提案した。これにより、魅力的品質要素と当たり前品質要素という考え方が生まれた。","https://monoist.itmedia.co.jp/mn/articles/2011/20/news159.html","狩野モデルに学ぶ“当たり前を魅力的に”（MONOist）",["石川馨先生は特性要因図の考案者で、QCサークルの普及にも貢献したが、品質の二元的表現の提案者ではない。","J.F.ケネディは消費者保護を訴えた米国大統領で、品質の二元的表現とは関係がない。","パレートはイタリアの経済学者で、パレート図の名の由来となった人物。品質の二元的表現の提案者ではない。"],"https://www.youtube.com/watch?v=AWK-qN02pC8","顧客満足度と狩野モデル【社会人技術者向けマンガ動画】","",["w:067_3","狩野モデルの二元的品質（充足度と満足度の関係）",{"a":"Craigwbrown","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Kano_model_showing_transition_over_time.png"}]],["「充足されれば満足を与えるが、不充足であっても不満を覚えない」品質要素は？","魅力的品質要素","当たり前品質要素","一元的品質要素","逆品質要素","魅力的品質要素は、充足されれば満足を与えるが、不充足であっても不満を覚えない品質要素。例えばファクシミリの「一度に100カ所に同じものを送信できる」機能は、あると便利だが、なくても不満は覚えない。","https://monoist.itmedia.co.jp/mn/articles/2011/20/news159.html","狩野モデルに学ぶ“当たり前を魅力的に”（MONOist）",["当たり前品質要素は、充足されても当たり前で、不充足なら不満を引き起こす品質要素である。","一元的品質要素は、充足されれば満足し、不充足なら不満になる品質要素である。","逆品質要素は、充足されると逆に不満を引き起こし、不充足だと満足を与える品質要素である。"],"https://www.youtube.com/watch?v=AWK-qN02pC8","顧客満足度と狩野モデル【社会人技術者向けマンガ動画】","",["w:067_3","狩野モデルの魅力的品質（Delighters）の曲線",{"a":"Craigwbrown","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Kano_model_showing_transition_over_time.png"}]],["「充足されれば当たり前と受け取られるが、不充足であれば不満を引き起こす」品質要素は？","当たり前品質要素","魅力的品質要素","一元的品質要素","無関心品質要素","当たり前品質要素は、充足されていても当たり前と受け取られるが、不充足であれば不満を引き起こす品質要素。例えば「ブレーキを踏んだら車が止まる」に感動する人はいないが、止まらなければ大きな不満になる。","https://monoist.itmedia.co.jp/mn/articles/2011/20/news159.html","狩野モデルに学ぶ“当たり前を魅力的に”（MONOist）",["魅力的品質要素は、充足されれば満足を与え、不充足でも不満を覚えない品質要素である。","一元的品質要素は、充足されれば満足し、不充足なら不満になる品質要素で、充足時に当たり前とは受け取られない。","無関心品質要素は、充足されても不充足でも満足・不満のどちらにも影響しない品質要素である。"],"https://www.youtube.com/watch?v=AWK-qN02pC8","顧客満足度と狩野モデル【社会人技術者向けマンガ動画】","",["w:067_3","狩野モデルの当たり前品質（Basic needs）の曲線",{"a":"Craigwbrown","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Kano_model_showing_transition_over_time.png"}]],["当たり前品質要素と魅力的品質要素は、それぞれ何のための品質といわれるか？","当たり前品質＝負けないための品質、魅力的品質＝勝つための品質","当たり前品質＝勝つための品質、魅力的品質＝負けないための品質","どちらも勝つための品質","どちらも負けないための品質","当たり前品質要素は「負けないための品質」、魅力的品質要素は他の製品やサービスと差別化するための「勝つための品質」。特に重要なのは、当たり前品質要素で失敗しないこと。","https://monoist.itmedia.co.jp/mn/articles/2011/20/news159.html","狩野モデルに学ぶ“当たり前を魅力的に”（MONOist）",["位置づけが逆。当たり前品質は負けないための品質、魅力的品質は差別化のための勝つための品質である。","当たり前品質は差別化の要素にならず、勝つための品質ではない。満たさないと負ける品質である。","魅力的品質は満たさなくても不満にならず、他社との差別化に使う勝つための品質である。"],"https://www.youtube.com/watch?v=AWK-qN02pC8","顧客満足度と狩野モデル【社会人技術者向けマンガ動画】","",["x:qc_34","品質の二元的表現（魅力的品質要素と当たり前品質要素）"]],["「ファクシミリで電話をかけようとしたら通じない」「蓋を開けたら断線していた」は何品質要素の不足か？","当たり前品質要素","魅力的品質要素","一元的品質要素","設計品質","電話がつながらない、開けたら断線していたといったことは、満たされていて当たり前の機能が満たされていない状態で、当たり前品質要素の不足にあたる。満たされないとダメージが大きく、お客さまは「この製品は2度と買わない」という気持ちになる。","https://monoist.itmedia.co.jp/mn/articles/2011/20/news159.html","狩野モデルに学ぶ“当たり前を魅力的に”（MONOist）",["魅力的品質要素は、なくても不満を覚えない品質で、電話が通じないといった基本機能の不足とは異なる。","一元的品質要素は、充足度に応じて満足・不満が変わる品質で、満たされて当然の機能の不足とは異なる。","設計品質はねらいの品質のことで、狩野モデルの品質要素の分類ではない。"],"https://www.youtube.com/watch?v=AWK-qN02pC8","顧客満足度と狩野モデル【社会人技術者向けマンガ動画】",""],["テキストの卵と鶏の例えで、「鶏」にあたる品質は何か？","工程（Process）の品質（仕事のやり方の品質＝業務品質）","製品（Product）の品質","使用品質","魅力的品質","良い卵（製品）は健康な鶏から生まれる。鶏にあたるのは工程（Process）の品質で、仕事のやり方の品質、業務品質ともいう。良い製品は正しい工程から生み出される。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["製品（Product）の品質は、例えでは鶏ではなく、鶏から生まれる「卵」にあたる。","使用品質は使用者が要求する品質で、卵と鶏の例えには対応しない。","魅力的品質は狩野モデルの品質要素で、卵と鶏の例えには対応しない。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き","",["x:qc_40","製品（卵）の品質と工程（鶏）の品質"]],["製品（Product）の品質は、別の言い方で何の品質か？","仕事のできばえの品質","仕事のやり方の品質","業務品質","要求の品質","製品（Product）の品質は、仕事のできばえの品質のこと。卵の例えでは、美味しい・安全な卵がこれにあたる。製品が良ければ良いというのはお客さまにとってのモノづくりであり、モノづくりに携わる人は工程の品質も確かなものにする必要がある。","https://kaizen-base.com/column/31808","品質の種類とは？ねらいの品質、出来栄えの品質の違い（カイゼンベース）",["仕事のやり方の品質は、工程（Process）の品質のことで、製品の品質ではない。","業務品質は工程（Process）の品質の別名で、製品の品質ではない。","要求の品質は使用品質のことで、使用者が求める品質を指す。製品の品質の言い換えではない。"],"https://www.youtube.com/watch?v=D8ZeYV6SS9c","【QC検定2級】ねらいの品質/できばえの品質など 例題付き",""],["TQC用語辞典による「管理」の定義は？","ある目的を継続的に効率よく達成するために必要な全ての活動","不良品を取り除くための検査活動","部下に指示命令すること","計画どおりに作業させること","TQC用語辞典では、管理を「ある目的を継続的に効率よく達成するために必要な全ての活動」と定義している。具体的には、PDCAのサイクルを回すことが管理である。","https://www.kaonavi.jp/dictionary/pdca_cycle/","PDCAサイクルとは？サイクルを回す意味（カオナビ人事用語集）",["検査活動は管理の一部にすぎず、目的を継続的に効率よく達成する全活動という管理の定義とは異なる。","指示命令は管理の一手段にすぎず、TQC用語辞典の管理の定義ではない。","計画どおりに作業させることはDoの段階にあたり、管理全体の定義ではない。"],"https://www.youtube.com/watch?v=ScFyuDXpZBI","PDCAとは？PDCAのメリットやデメリットを紹介",""],["PDCAサイクルの「Plan：計画」で決めることは？","仕事のできばえと仕事のやり方の両方","仕事のやり方だけ","仕事のできばえだけ","処置の内容","Plan（計画）では、「仕事のできばえ」と「仕事のやり方」の両方を決める。作業標準に「こうやればいい」というやり方だけでなく、「正しくやるとこうなる」というできばえも書いておかないと、作業者は不安になってしまう。","https://www.kaonavi.jp/dictionary/pdca_cycle/","PDCAサイクルとは？サイクルを回す意味（カオナビ人事用語集）",["やり方だけでは不十分で、正しくやるとどうなるかというできばえも決めておく必要がある。","できばえだけでは不十分で、それを得るための仕事のやり方も決めておく必要がある。","処置の内容はAct（処置）の段階で決めるもので、Planで決めるものではない。"],"https://www.youtube.com/watch?v=ScFyuDXpZBI","PDCAとは？PDCAのメリットやデメリットを紹介","",["x:qc_43","管理のPDCAサイクルと各段階で行うこと"]],["PDCAサイクルの「Do：実施」で重要なことは？","決めたやり方どおりに仕事をする（それ以上でも以下でもダメ）","決めたやり方以上の仕事をする","自分の判断でやり方を変える","できばえを確認する","Do（実施）は、決めたやり方どおりに仕事をすること。日本の作業者は優秀なので決めた以上の仕事をしてしまうが、それはまずいこと。決めたやり方どおりに、それ以上でも以下でもなく実施することが重要。","https://www.kaonavi.jp/dictionary/pdca_cycle/","PDCAサイクルとは？サイクルを回す意味（カオナビ人事用語集）",["決めたやり方以上の仕事をすることは、Doでは望ましくない。それ以上でも以下でもなく実施する。","自分の判断でやり方を変えてはいけない。変える場合はPDCAを回して計画を見直す。","できばえの確認はCheck（確認）の段階で行うことで、Doで重要なことではない。"],"https://www.youtube.com/watch?v=ScFyuDXpZBI","PDCAとは？PDCAのメリットやデメリットを紹介","",["w:084_4","Plan・Do・Check・Actを回すPDCAサイクル",{"a":"Karn-b - Karn Bulsuk (http://www.bulsuk.com). Originally pub","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:PDCA_Cycle.svg"}]],["PDCAサイクルの「Check：確認」で確認すべきものは？","仕事のできばえ","仕事のやり方","作業者の出勤状況","設備の稼働時間","Check（確認）では、仕事のできばえを確認する。体重を5kg減らす目的で毎日1km走ることにした場合、確認すべきは「毎日1km走ったか」ではなく「体重が5kg減ったか」。やり方を細かく確認しすぎると忙しくなってしまう。","https://www.kaonavi.jp/dictionary/pdca_cycle/","PDCAサイクルとは？サイクルを回す意味（カオナビ人事用語集）",["仕事のやり方を細かく確認しすぎると忙しくなる。Checkで確認すべきは目的に対するできばえである。","出勤状況はできばえではなく、PDCAのCheckで確認すべき対象ではない。","設備の稼働時間はやり方側の情報で、目的が達成されたかを示すできばえではない。"],"https://www.youtube.com/watch?v=ScFyuDXpZBI","PDCAとは？PDCAのメリットやデメリットを紹介",""],["「Act：処置」の2つの種類の組合せは？","モノ対策（現象対策）、仕組み対策","応急対策、緊急対策","設計対策、製造対策","検査対策、補償対策","Act（処置）には、できばえに処置をとる「モノ対策（現象対策）」と、やり方に処置をとる「仕組み対策」の2つがある。できばえに処置をとるだけでは、しばらくするとまた問題が起こるので、ぜひやり方にも処置をとる。","https://www.kaonavi.jp/dictionary/pdca_cycle/","PDCAサイクルとは？サイクルを回す意味（カオナビ人事用語集）",["応急対策と緊急対策は、どちらも当面の現象に対する処置で、やり方を変える仕組み対策が含まれていない。","設計対策・製造対策は部門別の分け方で、Actの2種類の区分ではない。","検査対策・補償対策はActの区分ではない。Actはできばえへのモノ対策と、やり方への仕組み対策に分かれる。"],"https://www.youtube.com/watch?v=ScFyuDXpZBI","PDCAとは？PDCAのメリットやデメリットを紹介","",["x:qc_43","管理のPDCAサイクルと各段階で行うこと"]],["経営学の Plan・Do・See と比べた、品質管理のPDCA独特の点は？","SeeをCheck（確認）とAct（処置）に分けている","PlanをPlanとDoに分けている","Doを省略している","Seeを削除している","管理の考え方は経営学のPlan・Do・Seeがもとになっており、そのSeeをCheck（確認）とAct（処置）に分けたのが品質管理独特の点。確認と処置を分けることで、問題に対して確実に手を打てる。","https://www.kaonavi.jp/dictionary/pdca_cycle/","PDCAサイクルとは？サイクルを回す意味（カオナビ人事用語集）",["PDCAはPlanを分けておらず、PlanとDoはPlan・Do・Seeと同じである。分けたのはSeeである。","PDCAではDoを省略していない。決めたやり方どおりに実施するDoは重要な段階である。","Seeは削除したのではなく、Check（確認）とAct（処置）の2つに分けている。"],"https://www.youtube.com/watch?v=ScFyuDXpZBI","PDCAとは？PDCAのメリットやデメリットを紹介","",["w:084_4","CheckとActを分けたPDCAサイクルの4段階",{"a":"Karn-b - Karn Bulsuk (http://www.bulsuk.com). Originally pub","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:PDCA_Cycle.svg"}]],["組織体で、中長期計画や年度経営方針を体系的に達成するための全ての活動を何というか？","方針管理","日常管理","初期流動管理","工程管理","方針管理は、TQC用語辞典で「組織体において、経営目的を達成するための手段として制定された中・長期計画、あるいは年度経営方針を体系的に達成するための全ての活動」とされる。PDCAサイクルを半年あるいは1年かけて1回まわす。","https://www.jmac.co.jp/glossary/ha/houshinkanri.html","方針管理・目標管理（JMAC用語集）",["日常管理は、各部門が日常的に行う分掌業務を効率的に達成するための活動で、中長期計画や年度方針の達成ではない。","初期流動管理は、新製品の立ち上げ初期に品質を安定させるための特別な管理である。","工程管理は、製造工程の品質や進度を管理する活動で、経営方針を体系的に達成する全社活動ではない。"],"https://www.youtube.com/watch?v=BiF1ZeUehaw","方針管理では、経営者のビジョンを具体化するために方針展開を行う","",["x:qc_48","方針管理の活動をPDCAサイクルに当てはめた図"]],["方針管理でいう「方針」とは、具体的に何を決めることか？","目標と方策","予算と人員","納期と数量","規格と公差","方針管理の「方針」とは、具体的には目標と、その達成のための方策を決めることを指す。経営計画に基づいて会社方針・重点課題・目標・方策を明らかにし、部門に展開して実施計画書を作る。","https://www.jmac.co.jp/glossary/ha/houshinkanri.html","方針管理・目標管理（JMAC用語集）",["予算と人員は経営資源の配分であり、方針管理でいう方針（目標と方策）とは異なる。","納期と数量は生産計画の要素で、方針管理でいう方針ではない。","規格と公差は製品の設計・品質の仕様で、方針管理の方針ではない。"],"https://www.youtube.com/watch?v=BiF1ZeUehaw","方針管理では、経営者のビジョンを具体化するために方針展開を行う",""],["方針管理で、期末に会社のトップ自らが行う評価を何というか？","社長診断（トップ診断）","内部監査","デザインレビュー","現場診断","方針管理では、1カ月・3カ月・半年ごとなどに実施状況をチェックし、期末で評価する。この期末での評価は会社のトップ自らが行うので、社長診断あるいはトップ診断と呼ばれる。","https://www.jmac.co.jp/glossary/ha/houshinkanri.html","方針管理・目標管理（JMAC用語集）",["内部監査は、組織の仕組みが規定どおり運用されているかを監査員が調べる活動で、トップ自らの期末評価ではない。","デザインレビューは、設計の各段階で関係者が設計内容を審査する活動で、方針管理の評価ではない。","現場診断は現場の状況を調べることを指し、期末にトップ自らが行う方針管理の評価の名称ではない。"],"https://www.youtube.com/watch?v=BiF1ZeUehaw","方針管理では、経営者のビジョンを具体化するために方針展開を行う","",["x:qc_48","方針管理の活動をPDCAサイクルに当てはめた図"]],["それぞれの部門で日常的に実施しなければならない分掌業務について、業務目的を効率的に達成するための活動は？","日常管理","方針管理","初期流動管理","機能別管理","日常管理は、TQC用語辞典で「それぞれの部門において当然日常的に実施しなければならない分掌業務について、その業務目的を効率的に達成するために必要なすべての活動」とされる。方針管理が1年で1回転なのに対し、日常管理は毎日1回転する。両者は車の両輪。","https://qcplanets.com/qc/qc3/control-item-level-limit/","管理項目、管理水準、管理限界がわかる（QCプラネッツ）",["方針管理は、中長期計画や年度方針を体系的に達成するための活動で、日常の分掌業務を対象とするものではない。","初期流動管理は、新製品の立ち上げ初期に品質を安定させるための特別な管理である。","機能別管理は、品質・コスト・量など経営の機能ごとに部門を横断して管理する活動で、各部門の日常業務の管理ではない。"],"https://www.youtube.com/watch?v=RXB8XG9tDV8","QC検定2級対策 方針管理と日常管理の違い",""],["日常管理で、業務目的が達成されているかを確認するための項目と、その値がどの水準にあればよいかを、それぞれ何というか？","管理項目、管理水準","特性値、規格値","目標、方策","点検項目、判定基準","管理項目は、業務目的が達成されているかを確認する際に、どんな項目で確認すればよいかというもの。管理水準は、その値がどの水準にあればよいかというもの。日常業務で自分の管理項目と管理水準を明確にすることが大切。","https://qcplanets.com/qc/qc3/control-item-level-limit/","管理項目、管理水準、管理限界がわかる（QCプラネッツ）",["特性値は品質を数値で表したもの、規格値は合否判定の基準となる値で、日常管理での確認項目と水準の呼び名ではない。","目標と方策は方針管理でいう「方針」の中身で、日常管理での確認項目と水準ではない。","点検項目と判定基準は設備点検などで使う用語で、日常管理で業務目的の達成を確認する項目の呼び名ではない。"],"https://www.youtube.com/watch?v=RXB8XG9tDV8","QC検定2級対策 方針管理と日常管理の違い","",["x:qc_52","日常管理の活動をPDCAサイクルに当てはめた図"]],["管理項目が管理水準を満たさなかったとき、その日のうちにとる処置を何というか？","応急処置","恒久処置","是正処置","予防処置","管理項目を管理水準と対比して、水準を満たしていなかった場合にとる処置が応急処置。できればその日のうちに処置をとる。ただし応急処置だけでは、その問題がまた発生する可能性がある。","https://qcplanets.com/qc/qc3/control-item-level-limit/","管理項目、管理水準、管理限界がわかる（QCプラネッツ）",["恒久処置は原因を追究して再発しないようにする処置で、その日のうちにとる処置ではない。","是正処置は、発生した不適合の原因を除去して再発を防ぐ処置で、すぐにとる応急的な処置ではない。","予防処置は、まだ起きていない不適合の発生を未然に防ぐための処置である。"],"https://www.youtube.com/watch?v=RXB8XG9tDV8","QC検定2級対策 方針管理と日常管理の違い",""],["原因を追究し、問題がもう発生しないよう恒久的に効果の出る処置を何というか？","恒久処置","応急処置","暫定処置","現象対策","恒久処置は、どこに問題があって管理水準に達しなかったのかを追究し、問題がもう発生しないように恒久的に効果の出る処置をとること。応急処置（モノ対策）と恒久処置（仕組み対策）の両方をとらなければならない。","https://qcplanets.com/qc/qc3/control-item-level-limit/","管理項目、管理水準、管理限界がわかる（QCプラネッツ）",["応急処置は、管理水準を満たさなかったときにすぐにとる処置で、原因を除かないため再発の可能性がある。","暫定処置は、恒久的な対策ができるまでの間に一時的にとる処置で、恒久的な効果は期待できない。","現象対策は、できばえに対してとるモノ対策のことで、原因を追究して再発を防ぐ仕組み対策ではない。"],"https://www.youtube.com/watch?v=RXB8XG9tDV8","QC検定2級対策 方針管理と日常管理の違い",""],["方針の展開で、上位方針の何が下位方針の「目標」になるか？","方策","目標","予算","実施項目","方針は分割ではなく展開される。トップ方針の目標「体重を5kg減らす」に対する方策「毎日1km走る」が部方針の目標になり、部の方策「朝6時に起きる」が課の目標になる…というように、上位の方策が下位の目標に転換されていく。","https://www.jmac.co.jp/glossary/ha/houshinkanri.html","方針管理・目標管理（JMAC用語集）",["上位の目標がそのまま下位の目標になると、方針が具体化されないトンネル方針管理になる。下位の目標になるのは上位の方策である。","予算は方針を実行するための資源配分であり、方針の展開で下位の目標に転換されるものではない。","実施項目は方策を実行するための具体的な行動で、下位に引き継がれる目標そのものではない。"],"https://www.youtube.com/watch?v=BiF1ZeUehaw","方針管理では、経営者のビジョンを具体化するために方針展開を行う","",["x:qc_55","方針の展開（上位の方策が下位の目標に）と日常業務の対応"]],["方針管理で、トップが「火の用心」と言ったら係の人も「火の用心」と言うだけ、という状態を何というか？","トンネル方針管理","方針の展開","方針の分割","日常管理","トンネル方針管理は、トップが「火の用心」と言うと、係の人もそのまま「火の用心」と言うだけで、方針が具体的に展開されていない状態。係なら「消火バケツを買ってくる」「消火器を点検する」のように具体化しなければならない。","https://www.jmac.co.jp/glossary/ha/houshinkanri.html","方針管理・目標管理（JMAC用語集）",["方針の展開は、上位の方策を下位の目標として具体化していく正しい進め方であり、言葉をそのまま繰り返す状態とは逆である。","方針は分割ではなく展開されるものであり、方針の分割は具体化されないまま伝わる状態を指す名称ではない。","日常管理は各部門が通常業務の維持・改善を行う管理で、方針がそのまま伝言される状態の名称ではない。"],"https://www.youtube.com/watch?v=BiF1ZeUehaw","方針管理では、経営者のビジョンを具体化するために方針展開を行う",""],["方針管理がうまくいかない2つの理由の組合せは？","トンネル方針管理、日常業務と係方針実施項目のマッチング不足","目標が高すぎる、予算が少ない","社長診断がある、PDCAを回している","管理水準がある、手順がある","方針管理がうまくいかない理由は2つ。1つはトンネル方針管理で、方策が具体化されず何をしていいか分からないこと。もう1つは、日常業務と係方針実施項目のマッチングがされておらず、別々のものになってしまっていること。","https://www.jmac.co.jp/glossary/ha/houshinkanri.html","方針管理・目標管理（JMAC用語集）",["目標の高さや予算の多寡は個別の事情であり、方針管理がうまくいかない2つの典型的な理由には挙げられていない。","社長診断やPDCAの実施は方針管理をうまく進めるための仕組みであり、失敗の理由ではない。","管理水準や手順は管理を行うための要素であり、方針管理がうまくいかない理由ではない。"],"https://www.youtube.com/watch?v=BiF1ZeUehaw","方針管理では、経営者のビジョンを具体化するために方針展開を行う","",["x:qc_55","方針の展開（上位の方策が下位の目標に）と日常業務の対応"]],["職場の管理項目「QCDPSME」のDは何を表すか？","納期・数量（Delivery）","設計（Design）","開発（Development）","データ（Data）","職場の管理項目QCDPSMEは、Q品質（Quality）、Cコスト（Cost）、D納期・数量（Delivery）、P生産性（Productivity）、S安全（Safety）、M志気・やる気（Morale）、E環境（Environment）。Dは「決められた日・時刻までに、決められた数量を提供できる」こと。","https://www.keyence.co.jp/ss/general/manufacture-tips/qcd.jsp","業務改善に役立つ「QCD」とは？（キーエンス）",["設計（Design）は品質を作り込む業務の一つだが、QCDPSMEの管理項目のDではない。","開発（Development）は製品化の過程を指す語で、職場の管理項目QCDPSMEには含まれない。","データ（Data）は事実を記述したものであり、管理項目QCDPSMEのDが表
