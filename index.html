す内容ではない。"],"https://www.youtube.com/watch?v=pnNO-4wVQxE","生産管理の3要素「QCD」とは【改善活動の基礎】",""],["職場の管理項目「QCDPSME」のMは何を表すか？","志気・やる気（Morale）","材料（Material）","方法（Method）","機械（Machine）","QCDPSMEのMはMorale（志気・やる気）で、作業者のやる気も管理項目になる。特性要因図の4M（Man・Machine・Material・Method）のMとは別物なので注意。","https://www.keyence.co.jp/ss/general/manufacture-tips/qcd.jsp","業務改善に役立つ「QCD」とは？（キーエンス）",["材料（Material）は特性要因図の4MのMの一つであり、職場の管理項目のMとは別物である。","方法（Method）は4Mの要因の一つで、QCDPSMEのMが表すものではない。","機械（Machine）も4Mの要因の一つであり、作業者の志気を表すQCDPSMEのMとは異なる。"],"https://www.youtube.com/watch?v=pnNO-4wVQxE","生産管理の3要素「QCD」とは【改善活動の基礎】",""],["職場で最も重要な管理項目とされる3つの組合せは？","QCD（品質・コスト・納期）","PSM（生産性・安全・志気）","SME（安全・志気・環境）","QPE（品質・生産性・環境）","品質・コスト・納期（数量）のQCDが職場の重要な管理項目。管理技法の階層の、品質管理・原価管理・生産管理にあたる部分。管理項目のトップは品質だが、品質のためにいくらでもお金をかけてよいわけではない。","https://www.keyence.co.jp/ss/general/manufacture-tips/qcd.jsp","業務改善に役立つ「QCD」とは？（キーエンス）",["生産性・安全・志気はいずれも職場の管理項目だが、最も重要とされる3つの組合せではない。","安全・志気・環境はQCDPSMEの後半の管理項目であり、最重要とされるQCDではない。","品質は最重要項目に含まれるが、生産性と環境はQCDに含まれず、組合せとして誤っている。"],"https://www.youtube.com/watch?v=pnNO-4wVQxE","生産管理の3要素「QCD」とは【改善活動の基礎】","",["x:qc_60","職場の管理項目QCDPSME"]],["品質の国際規格と環境の国際規格の組合せは？","ISO9001、ISO14001","ISO14001、ISO9001","JIS Z 8101、JIS Q 9000","ISO27001、ISO45001","品質の国際規格はISO9001（品質マネジメントシステム）、環境の国際規格はISO14001（環境マネジメントシステム）。これからは環境抜きでは経営活動はやっていけないので、環境も管理項目になる。","https://www.jqa.jp/service_list/management/management_system/","ISOの基礎知識（日本品質保証機構 JQA）",["品質と環境の規格番号が逆になっている。ISO14001は環境、ISO9001は品質の規格である。","JIS Z 8101は品質管理用語、JIS Q 9000は品質マネジメントの用語を定めた日本の規格で、環境の国際規格ではない。","ISO27001は情報セキュリティ、ISO45001は労働安全衛生のマネジメントシステム規格である。"],"https://www.youtube.com/watch?v=f2zY1af0zMo","ISO9001とは何か？",""],["新しい製品や新しいラインの立ち上がり時に、特別な管理体制をとる管理を何というか？","初期流動管理","日常管理","方針管理","工程管理","初期流動管理は、新しい製品や新しいライン、新しい商品の立ち上がり時に特別な管理をしようというもの。TQC用語辞典では「製造開始直後の管理と同様に、販売開始直後から一定期間、特別の管理体制をとり、収集する品質情報の密度をあげ、そこで検出された不具合に対する是正処置とその確認を迅速に行うこと」とされる。","https://qcplanets.com/qc/qc3/initial-production-control/","初期流動管理がわかる（QCプラネッツ）",["日常管理は通常業務を維持・改善するための管理であり、立ち上がり時の特別な管理体制ではない。","方針管理は経営方針を展開して達成する管理であり、新製品の立ち上がり時に限った管理ではない。","工程管理は工程を安定状態に保つための管理全般を指し、立ち上がり時の特別体制を指す名称ではない。"],"https://www.youtube.com/watch?v=ZCIYgOk5G50","【品質管理の考え方】品質は工程内で作り込む",""],["量産に入る立ち上げ段階で、量産安定期とは異なる特別な体制で情報収集し、スムーズに立ち上げることを何というか？","垂直立上げ","水平展開","初期故障","方針の展開","垂直立上げは、製品の量産に入る立ち上げ段階で、量産安定期とは異なる特別な体制をとって情報収集し、スムーズに立ち上げること（QM用語辞典）。垂直立上げをうまく行うには、工程のFMEAなどが役立つ。","https://qcplanets.com/qc/qc3/initial-production-control/","初期流動管理がわかる（QCプラネッツ）",["水平展開は、ある不具合の対策を類似の製品や工程にも広げて適用することで、量産の立ち上げを指す語ではない。","初期故障は使用開始直後に発生する故障のことで、立ち上げを円滑に進める取り組みの名称ではない。","方針の展開は上位の方策を下位の目標に転換していくことで、量産立ち上げとは関係しない。"],"https://www.youtube.com/watch?v=ZCIYgOk5G50","【品質管理の考え方】品質は工程内で作り込む",""],["部品納入業者から納品された部品に対し、受入検査規定や抜取り検査作業標準に従って行う検査は？","受入検査","最終検査","工程内検査","出荷検査","受入検査は、部品納入業者より納品された部品に対して、部品受入検査規定や抜取り検査作業標準に従って検査を実施し、合否を判断すること。品質保証契約で、買い手の受入検査についても定められる。工程内検査にすべて合格した製品に対して行うのは最終検査。","https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/process/receiving.jsp","受け入れ検査（キーエンス）",["最終検査は工程内検査にすべて合格した製品に対して、出荷前に行う検査である。","工程内検査は製造工程の途中で、次工程に送ってよいかを判定する検査である。","出荷検査は製品を出荷する際に行う検査であり、納入された部品を対象とするものではない。"],"https://www.youtube.com/watch?v=4GAvpxAUGdQ","ISO 9001規格要求事項【8.7 不適合管理、10.2 不適合と是正処置】",""],["不適合品を、権限を与えられた人が承認した場合に限り認めることを何というか？","特採（特別採用）","手直し","廃棄","再検査","不適合品は顧客には渡さないのが基本だが、権限を与えられた人が承認した場合に限り、不適合品を認めることがある。これを特採（特別採用）という。最終検査での不適合品の処置は、権限を与えられた人が決定する。","https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/process/receiving.jsp","受け入れ検査（キーエンス）",["手直しは不適合品に処置を施して要求事項に適合させることで、不適合品のまま認めることではない。","廃棄は不適合品を捨てる処置であり、承認によって不適合品を認める特採とは反対の処置である。","再検査は合否を確かめ直すための検査で、不適合品を承認して使用を認める処置ではない。"],"https://www.youtube.com/watch?v=4GAvpxAUGdQ","ISO 9001規格要求事項【8.7 不適合管理、10.2 不適合と是正処置】",""],["「QC的考え方」の基本となる2つは、品質第一と何か？","管理のサイクル（PDCA）を回すこと","コストを下げること","検査を厳しくすること","納期を守ること","QC的考え方の基本は、品質を第一とすることと、管理のサイクル（PDCA）を回すこと。これに、事実で判断・重点指向・ばらつきを尺度とする・因果関係・標準化の5つを上乗せしたものがQC的考え方。","https://www.juse.or.jp/tqm/about/05.html","品質経営（顧客価値創造・TQM）（日本科学技術連盟）",["コスト低減は重要な管理項目だが、品質第一と並ぶQC的考え方の基本ではない。","検査を厳しくするだけでは品質は作り込めず、QC的考え方の基本には含まれない。","納期の遵守は管理項目QCDのDにあたるが、QC的考え方の基本となる2つには入らない。"],"https://www.youtube.com/watch?v=ECbBiZ9Uukc","【聞くだけで覚える！】QC検定3級#1 QC的ものの見方・考え方",""],["QC的考え方の5つの組合せとして正しいものは？","事実で判断、重点指向、ばらつきを尺度とする、因果関係、標準化","事実で判断、全数検査、平均値で判断、因果関係、標準化","経験で判断、重点指向、ばらつきを尺度とする、因果関係、自由化","事実で判断、重点指向、平均値を尺度とする、相関関係、多様化","QC的考え方の5つは、①事実で判断（Fact Control）、②重点指向、③ばらつきを尺度とする、④因果関係、⑤標準化。決して特別な考え方ではなく、多くの分野で言われていることをまとめたもの。","https://www.juse.or.jp/tqm/about/05.html","品質経営（顧客価値創造・TQM）（日本科学技術連盟）",["全数検査と平均値での判断が含まれている。QC的考え方では重点指向とばらつきを尺度とすることが正しい。","経験での判断や自由化は含まれない。QC的考え方では事実で判断し、標準化を進めることが正しい。","平均値を尺度とする、相関関係、多様化が誤り。正しくはばらつきを尺度、因果関係、標準化である。"],"https://www.youtube.com/watch?v=ECbBiZ9Uukc","【聞くだけで覚える！】QC検定3級#1 QC的ものの見方・考え方","",["x:qc_67","QC的考え方（品質第一・管理のサイクルと5つの考え方）"]],["「事実で判断」は英語で何と呼ばれるか？","Fact Control","Fact Management","Data Control","Real Check","「事実で判断」は英語でFact Controlという。「あんな気がする、こんな気がする」ではなく、実際に起こった事柄（事実）で判断しようという考え方。","https://www.juse.or.jp/tqm/about/05.html","品質経営（顧客価値創造・TQM）（日本科学技術連盟）",["Fact Managementは「事実で判断」を表す用語として用いられていない。","Data Controlはデータの管理という意味になり、知りたいのはデータではなく事実なので当てはまらない。","Real Checkは品質管理で使われる用語ではなく、「事実で判断」の英語表現ではない。"],"https://www.youtube.com/watch?v=ECbBiZ9Uukc","【聞くだけで覚える！】QC検定3級#1 QC的ものの見方・考え方",""],["事実は保管・保存ができないため、何を行う必要があるか？","事実の記述","事実の破棄","事実の推測","事実の暗記","実際に起こった事柄（不良品、壊れた機械、クレームなど）そのものは保管や保存が難しい。そこで判断のために、事実を何らかの形で記述しておく（事実の記述）必要がある。知りたいのはデータではなく事実である。","https://www.juse.or.jp/tqm/about/05.html","品質経営（顧客価値創造・TQM）（日本科学技術連盟）",["事実を破棄してしまえば判断の根拠がなくなり、事実で判断することができなくなる。","推測は「あんな気がする」という判断に近く、事実で判断する考え方とは逆である。","暗記では大量の事実を正確に残せず、判断に使える形で記録する方法にはならない。"],"https://www.youtube.com/watch?v=ECbBiZ9Uukc","【聞くだけで覚える！】QC検定3級#1 QC的ものの見方・考え方","",["x:qc_69","事実で判断：事実の記述方法と数値データの利点"]],["大量観察時でも加工が容易なため、事実の記述として最も望ましいとされる方法は？","数値データで記述","ビデオで記述","写真で記述","絵で記述","事実の記述には、ビデオ・写真・文章・絵、言語データ、数値データがある。ビデオや写真は情報量が多いが、100や200あると加工が大変。数値データなら大量観察時でも加工が容易なので、数値データで記述するのが望ましい。","https://www.juse.or.jp/tqm/about/05.html","品質経営（顧客価値創造・TQM）（日本科学技術連盟）",["ビデオは情報量が多いが、100や200と大量にあると加工が大変になるため最も望ましい方法ではない。","写真も情報量は多いが、大量観察時には整理・加工が難しく、数値データに劣る。","絵は描き手によって表現が変わり、大量観察時の加工も容易ではないため望ましい方法とはいえない。"],"https://www.youtube.com/watch?v=ECbBiZ9Uukc","【聞くだけで覚える！】QC検定3級#1 QC的ものの見方・考え方","",["x:qc_69","事実で判断：事実の記述方法と数値データの利点"]],["言語データから本質を見極める道具として発展途上にあるものは？","テキストマイニング","ヒストグラム","管理図","パレート図","テキストマイニングは、大量の文章（言語データ）を分析して、その中から本質や傾向を見つけ出す技術。言語データの加工も容易になりつつあるが、まだ発展途上とされている。","https://www.juse.or.jp/tqm/about/05.html","品質経営（顧客価値創造・TQM）（日本科学技術連盟）",["ヒストグラムは計量値の数値データの分布を見る道具で、言語データを分析するものではない。","管理図は工程が安定状態かを判断する数値データの道具で、言語データを扱うものではない。","パレート図は不良項目などの度数を大きい順に並べる数値データの道具で、文章の分析技術ではない。"],"https://www.youtube.com/watch?v=ECbBiZ9Uukc","【聞くだけで覚える！】QC検定3級#1 QC的ものの見方・考え方",""],["3現主義の「3現」の組合せは？","現場で、現物を、現実的に","現場で、現物を、原理で","原則で、原理を、現実的に","現場で、現金で、現実的に","3現主義は、現場で、現物を、現実的に見るということ。ある工程で不具合が発生しているなら、その工程の場所に行き、起こっている不具合を実際に見る。事実で判断するために必要な行動。","https://kaizen-base.com/column/30948","三現主義・5ゲン主義とは？（カイゼンベース）",["原理は5ゲン主義で加わる「原理・原則」の要素であり、3現主義の3現には含まれない。","原則と原理は5ゲン主義で加わる要素であり、3現主義は現場・現物・現実の3つである。","現金は3現主義の要素ではない。現場で現物を現実的に見ることが3現主義である。"],"https://www.youtube.com/watch?v=BCeDeWEltEo","【三現主義/５ゲン主義】What is 3 Gen Principle,5 Gen Principle",""],["5ゲン主義は、3現主義に何を加えたものか？","原理・原則で考える","現金・現品で考える","経験・勘で考える","原価・原単位で考える","5ゲン主義は、3現主義（現場で・現物を・現実的に観察する）に、原理・原則で考えることを加えたもの。現場で現物を現実的に見るだけでは問題は明らかにならないので、原理・原則を考える必要がある。","https://kaizen-base.com/column/30948","三現主義・5ゲン主義とは？（カイゼンベース）",["現金・現品は5ゲン主義に含まれない。3現主義に加わるのは原理・原則である。","経験や勘で考えることは事実で判断する考え方に反し、5ゲン主義の要素ではない。","原価・原単位はコスト管理の用語であり、5ゲン主義で加える要素ではない。"],"https://www.youtube.com/watch?v=BCeDeWEltEo","【三現主義/５ゲン主義】What is 3 Gen Principle,5 Gen Principle","",["x:qc_73","3現主義と5ゲン主義（原理・原則）、炊飯の例"]],["炊飯で「米に加水・加熱し、米のデンプンを糊化する」は原理と原則のどちらか？","原理","原則","管理技術","現実","炊飯の原理は「米に加水・加熱し、米のデンプンを糊化する（ノリにする）」こと。原則は「どのくらいの水を入れ、どのくらいの温度・時間で加熱すればよいか」という、適当な水加減と加熱温度・時間のこと。","https://kaizen-base.com/column/30948","三現主義・5ゲン主義とは？（カイゼンベース）",["原則は適当な水加減や加熱温度・時間など、原理を実際に適用するための条件のことを指す。","管理技術は品質管理・原価管理などの技術であり、炊飯で糊化するという仕組みを指すものではない。","現実は3現主義の「現実的に」にあたる要素であり、物事の仕組みを表す原理・原則とは異なる。"],"https://www.youtube.com/watch?v=BCeDeWEltEo","【三現主義/５ゲン主義】What is 3 Gen Principle,5 Gen Principle",""],["3現主義と原理・原則は、それぞれ何の技術にあたるか？","3現主義＝管理技術、原理・原則＝固有技術","3現主義＝固有技術、原理・原則＝管理技術","どちらも管理技術","どちらも固有技術","3現主義は、品質管理・原価管理・生産管理などと同じ管理技術。原理・原則は、物理・科学・機械・化学などの固有技術。技術者は、管理技術と固有技術の両方を学ぶ必要がある。","https://kaizen-base.com/column/30948","三現主義・5ゲン主義とは？（カイゼンベース）",["対応が逆である。3現主義は品質管理と同じ管理技術、原理・原則は物理や機械などの固有技術にあたる。","原理・原則は物理・化学・機械などの固有技術であり、どちらも管理技術とするのは誤り。","3現主義は品質管理や生産管理と同じ管理技術であり、どちらも固有技術とするのは誤り。"],"https://www.youtube.com/watch?v=BCeDeWEltEo","【三現主義/５ゲン主義】What is 3 Gen Principle,5 Gen Principle",""],["「現状を調べることにより最も重要な項目を選択し、資源を集中させて効率的に目的を達成すること」を何というか？","重点指向","事実で判断","標準化","因果関係","重点指向は「現状を調べることにより最も重要な項目を選択し、それに対して資源を集中させて、効率的に目的を達成すること」。重要なのは、気になるものではなく、現状・事実を調べて重要な項目を選ぶこと。","https://kaizen-base.com/column/31918","パレート図とは？パレートの法則（80:20の法則）（カイゼンベース）",["事実で判断は、勘や経験でなく実際に起こった事柄で判断する考え方で、資源の集中を表すものではない。","標準化は標準を設定し、これを活用する組織的行為であり、重要項目への資源の集中ではない。","因果関係は結果と原因の関係に着目して原因に手を打つ考え方で、重要項目の選択を表すものではない。"],"https://www.youtube.com/watch?v=_k_rNUpASSI","【聞き流しで解ける！】QC検定3級① QC的ものの見方・考え方","",["x:qc_76","重点指向：Vital fewとTrivial many"]],["重点指向で、「重要で数が少ないもの」と「些細で数が多いもの」をそれぞれ何というか？","Vital few、Trivial many","Trivial many、Vital few","Big few、Small many","Major few、Minor many","問題も原因も対策も、Vital few（重要で数が少ないもの）とTrivial many（些細で数が多いもの）に分かれる。人はTrivial manyに目が行きがちだが、Vital fewに焦点を当てることが重点指向。","https://kaizen-base.com/column/31918","パレート図とは？パレートの法則（80:20の法則）（カイゼンベース）",["順序が逆である。Trivial manyは些細で数が多いもの、Vital fewは重要で数が少ないものを指す。","Big few、Small manyは重点指向で用いられる用語ではない。","Major few、Minor manyは重点指向の用語として用いられていない。"],"https://www.youtube.com/watch?v=_k_rNUpASSI","【聞き流しで解ける！】QC検定3級① QC的ものの見方・考え方","",["x:qc_76","重点指向：Vital fewとTrivial many"]],["「現場の問題の80%は20%の種類のもので占められている」という経験則を何というか？","二八の原理（20%-80%の原理）","ハインリッヒの法則","ムーアの法則","ローレンツの法則","二八の原理（20%-80%の原理）は、現場の問題の80%は20%の種類のもので占められているという経験則。問題はたくさんあるように見えても、項目で分類すると大抵はわずかな項目で占められている。パレートの原則ともいわれる。","https://kaizen-base.com/column/31918","パレート図とは？パレートの法則（80:20の法則）（カイゼンベース）",["ハインリッヒの法則は、1件の重大事故の背後に29件の軽微な事故と300件の異常があるという労働災害の経験則である。","ムーアの法則は、半導体の集積度がおよそ2年で倍増するという経験則である。","ローレンツの法則という経験則はない。ローレンツの名はパレート図の累積比率を示すローレンツ曲線に使われる。"],"https://www.youtube.com/watch?v=_k_rNUpASSI","【聞き流しで解ける！】QC検定3級① QC的ものの見方・考え方",""],["「ばらつきを尺度とする」の基本は何に注目することか？","差・違い","平均値","合計値","最大値","「ばらつきを尺度とする」の基本は、差・違いに注目すること。「昨日は不良率10%、今日は5%。何が違ったのか？」のように、良い時と悪い時の違いに着目して調べれば、必ず答えが見つかる。違いのパターンが多いときは、差をまとめてばらつきで表現する。","https://www.keyence.co.jp/ss/general/manufacture-tips/variation.jsp","「ばらつき」の原因を特定するには？（キーエンス）",["平均値は全部同じだとしたらいくつかを表す値で、平均だけを見ても差・違いには注目できない。","合計値はデータの総和で、ばらつきや良い時と悪い時の違いを表すものではない。","最大値は一つの値にすぎず、それだけでは差・違いに注目したことにならない。"],"https://www.youtube.com/watch?v=ztruVQ2DU5s","【品質管理 管理図】バラつきを分解して考える！",""],["平均値だけで判断することは、テキストで何にたとえられているか？","どんぶり勘定","鬼に金棒","車の両輪","魚の骨","平均値は「全部同じだとしたらいくつか」というもので、いわばどんぶり勘定。平均値だけでは問題は解決しない。ばらつき・不揃いにこそ、解決の手がかりがある。","https://www.keyence.co.jp/ss/general/manufacture-tips/variation.jsp","「ばらつき」の原因を特定するには？（キーエンス）",["鬼に金棒は、強い者がさらに強くなるたとえで、平均値だけの判断を表すものではない。","車の両輪は、二つのものが互いに欠かせない関係にあるたとえで、平均値の判断とは関係ない。","魚の骨は特性要因図の別名「魚の骨図」に使われる語で、平均値のたとえではない。"],"https://www.youtube.com/watch?v=ztruVQ2DU5s","【品質管理 管理図】バラつきを分解して考える！",""],["因果関係で、「結果」と「原因」はそれぞれいつのことか？","結果は今、原因は過去","結果は過去、原因は今","どちらも今","どちらも未来","結果を良くするには原因に手を打てばよいが、結果は「今」、原因は「過去」にある。1週間前の夕食も覚えていないように、過去にさかのぼって原因を探すのが難しいところ。","https://qcplanets.com/practice/iso/corrective_action/","不適合及び是正処置がわかる（QCプラネッツ）",["時間関係が逆である。原因は過去に起こったことで、その結果が今現れている。","結果は今だが原因は過去にあり、過去にさかのぼって探す必要がある点が難しいところである。","結果も原因も未来のことではない。原因は過去、結果は今にある。"],"https://www.youtube.com/watch?v=H0qrNWU9BUY","製造業の現場で使える5つの再発防止ツールとは？","",["x:qc_81","因果関係：恒久処置と応急処置（Band-aid）"]],["仕事のできばえに対してとる処置（例：手を切ったのでバンドエイドを貼る）を英語で何というか？","Band-aid Action（応急処置）","Permanent Action（恒久処置）","Corrective Action","Preventive Action","仕事のできばえに対してとる処置を応急処置（Band-aid Action）という。素手でグラスを洗って手を切ったときにバンドエイドを貼るのがこれ。応急処置は必要だが、それだけでは不十分。","https://qcplanets.com/practice/iso/corrective_action/","不適合及び是正処置がわかる（QCプラネッツ）",["Permanent Action（恒久処置）は仕事のやり方に手を打つ処置で、できばえへの処置ではない。","Corrective Actionは是正処置で、発生した不適合の原因を除去して再発を防ぐ処置を指す。","Preventive Actionは予防処置で、起こりうる不適合の原因を事前に取り除く処置を指す。"],"https://www.youtube.com/watch?v=H0qrNWU9BUY","製造業の現場で使える5つの再発防止ツールとは？",""],["仕事のやり方に手を打つ処置（例：コップ洗いを買う）を英語で何というか？","Permanent Action（恒久処置）","Band-aid Action（応急処置）","Quick Action","Fact Control","仕事のやり方に手を打つ処置を恒久処置（Permanent Action）という。グラスを洗って手を切ることを繰り返さないよう、コップ洗いを買ってくるのがこれ。因果関係を使って、仕事のやり方・仕組みに改善点を見つけて手を打つことが重要。","https://qcplanets.com/practice/iso/corrective_action/","不適合及び是正処置がわかる（QCプラネッツ）",["Band-aid Action（応急処置）は仕事のできばえに対してとる処置で、やり方に手を打つものではない。","Quick Actionは素早い対応を表す一般語で、仕事のやり方を変える恒久処置の名称ではない。","Fact Controlは「事実で判断」を表す英語で、処置の種類を表す用語ではない。"],"https://www.youtube.com/watch?v=H0qrNWU9BUY","製造業の現場で使える5つの再発防止ツールとは？","",["x:qc_81","因果関係：恒久処置と応急処置（Band-aid）"]],["標準化の定義は？","標準を設定し、これを活用する組織的行為","標準を設定すること","規格書を作成すること","作業を自動化すること","標準化は「標準を設定し、これを活用する組織的行為」と定義される。「作るところ」と「活用するところ」に分かれる。標準化の「化」は化けるという字で、人が変わること。","https://kaizen-base.com/column/31787","標準化とは？バラツキをなくす標準化の考え方（カイゼンベース）",["標準を設定するだけでは不十分で、それを活用して人が変わるところまで含めるのが標準化である。","規格書の作成は標準を作る作業の一部にすぎず、活用までを含む標準化の定義にはならない。","作業の自動化は設備による省人化であり、標準を設定し活用する組織的行為とは異なる。"],"https://www.youtube.com/watch?v=8HAE4MyZn9Y","品質優先の考え方【アニメで学ぶ品質管理と品質改善活動】",""],["「会社や工場で製品や組織または仕事等に関して定めた基準」を何というか？","社内標準","作業標準","規格","国際規格","社内標準は、会社や工場で、製品や組織または仕事などに関して定めた基準。作業標準は「作業に関する条件などを定めた基準」、規格は「標準の中で品物に関する事項」（または標準の別の呼び方）。","https://kaizen-base.com/column/31787","標準化とは？バラツキをなくす標準化の考え方（カイゼンベース）",["作業標準は作業に関する条件などを定めた基準で、社内標準の一部にあたる。","規格は標準の中で品物に関する事項を定めたもので、会社で定めた基準全般を指す語ではない。","国際規格はISOなどの国際機関が作る規格であり、会社や工場で定める基準ではない。"],"https://www.youtube.com/watch?v=8HAE4MyZn9Y","品質優先の考え方【アニメで学ぶ品質管理と品質改善活動】",""],["日本工業規格（JIS）の対象として正しいものは？","食品・農林分野を除く工業製品に関する日本の国家規格","食品を含むすべての製品の国際規格","農林物資の日本の規格","電気製品だけの業界規格","JIS（日本産業規格、旧日本工業規格）は、食品・農林分野を除く工業製品などに関する日本の国家規格。国際規格はISO（国際標準化機構）などが作る規格。これらが標準・規格の設定にあたる。","https://kaizen-base.com/column/31787","標準化とは？バラツキをなくす標準化の考え方（カイゼンベース）",["食品を含むすべての製品が対象ではなく、またJISは国際規格ではなく日本の国家規格である。","農林物資の規格はJAS（日本農林規格）であり、JISの対象からは除かれている。","JISは電気製品だけの業界規格ではなく、工業製品全般を対象とする国家規格である。"],"https://www.youtube.com/watch?v=8HAE4MyZn9Y","品質優先の考え方【アニメで学ぶ品質管理と品質改善活動】","",["x:qc_86","標準化の定義と標準・規格の種類（社内標準・JISなど）"]],["標準化を達成するために、標準の作成後に必要なことは？","標準の周知と教育・訓練","標準の廃止","標準の暗記テスト","罰則の制定","標準を作るだけでは人は化けない。「こんな標準ができました」とみんなに知らせ（周知）、その通りに仕事ができるよう教育訓練までして、標準化は達成される。標準化がうまくいかない会社は、標準の作成で終わってしまい活用されていない。","https://kaizen-base.com/column/31787","標準化とは？バラツキをなくす標準化の考え方（カイゼンベース）",["作成した標準を廃止しては活用できず、標準化は達成されない。","暗記テストでは標準どおりに仕事ができるようにはならず、周知と教育・訓練が必要である。","罰則の制定は標準を活用させるための手段ではなく、人が変わるには周知と教育訓練が必要である。"],"https://www.youtube.com/watch?v=8HAE4MyZn9Y","品質優先の考え方【アニメで学ぶ品質管理と品質改善活動】",""],["広辞苑による「改善」の定義は？","悪いところを改めてよくすること","新しいものを創ること","規則を改めること","コストを下げること","広辞苑では、改善を「悪いところを改めてよくすること」と定義している。つまり、悪いところを明確にして、それを改めること。時刻表の「改訂」や「改正」にはない、「悪いところを明確にする（認める）」行為が必要。","https://www.kaonavi.jp/dictionary/kaizen/","カイゼン（活動）とは？わかりやすく解説（カオナビ人事用語集）",["新しいものを創ることは創造であり、悪いところを明確にして改める改善とは異なる。","規則を改めることは改正や改訂にあたり、悪いところを明確にする行為を含まない。","コスト低減は改善の成果の一つになりうるが、改善そのものの定義ではない。"],"https://www.youtube.com/watch?v=-kfnUR9aERM","多忙な現場でも始められる品質改善4つのヒント",""],["管理→改善→管理…と繰り返し、レベルを上げてはPDCAを回すことを何というか？","継続的改善","方針管理","垂直立上げ","標準化","管理（PDCAを回す）でレベルを保ち、改善でレベルを上げ、上がった所でまたPDCAを回す。これを続けていくことを継続的改善という。システムは最初から問題なく稼働するわけではないので徐々に良くしていく、という比較的日本的な考え方。","https://www.kaonavi.jp/dictionary/kaizen/","カイゼン（活動）とは？わかりやすく解説（カオナビ人事用語集）",["方針管理は経営方針を展開して目標を達成する管理で、管理と改善の繰り返しを指す語ではない。","垂直立上げは量産の立ち上げ段階で特別な体制をとり、スムーズに立ち上げることである。","標準化は標準を設定し活用する組織的行為で、レベルを上げ続ける活動そのものではない。"],"https://www.youtube.com/watch?v=-kfnUR9aERM","多忙な現場でも始められる品質改善4つのヒント","",["x:qc_89","管理と改善を繰り返す継続的改善"]],["問題の定義は？","あるべき姿・望ましい状態と現状とのずれ","現状の悪いところ","お客さまからの苦情","目標が高すぎること","問題は「あるべき姿・望ましい状態と現状とのずれ」と定義される。あるべき姿は「定義する」もの、現状は3現主義で「調べる」もの。両方がそろって初めて問題が形成される。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["現状の悪いところだけでは、あるべき姿が定義されていないので問題は形成されない。","苦情は問題の手がかりになるが、あるべき姿と現状のずれという問題の定義そのものではない。","目標が高すぎることは問題の定義ではない。問題はあるべき姿と現状とのずれである。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_90","問題＝あるべき姿と現状のずれ（誰にとって・3現主義）"]],["問題の定義のもとになった、森羅万象を数学モデルで記述しコンピュータで解く学問は？","オペレーションズリサーチ","経営工学","信頼性工学","人間工学","問題の定義は、オペレーションズリサーチ（OR）という学問分野から生まれた。ORは森羅万象を数学モデルで記述し、コンピュータで解く学問で、「あるべき姿、あるいは望ましい状態と現状がずれていれば問題だ」と定義している。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["経営工学は生産や経営の効率化を扱う工学分野で、問題の定義が生まれた学問として挙げられていない。","信頼性工学は製品やシステムの故障・寿命を扱う学問で、問題の定義のもとになったものではない。","人間工学は人の特性に合った機器や作業環境の設計を扱う学問で、数学モデルで森羅万象を解く学問ではない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！",""],["お客さまにとってのあるべき姿・望ましい状態を定義することを何というか？","CS（Customer Satisfaction）","QC（Quality Control）","CWQC","SPC","あるべき姿を定義する際に重要なのは「誰にとってのあるべき姿か」。その一人が買い手、すなわちお客さまで、お客さまにとってのあるべき姿・望ましい状態を定義することをCS（Customer Satisfaction：顧客満足）という。","https://kaizen-base.com/column/31818","後工程はお客様とは？自工程保証・源流管理の考え方（カイゼンベース）",["QCは品質管理のことで、お客さまにとってのあるべき姿を定義することを指す語ではない。","CWQCは全社的品質管理のことで、顧客にとってのあるべき姿の定義を表す語ではない。","SPCは統計的工程管理のことで、データで工程を管理する手法であり顧客満足とは異なる。"],"https://www.youtube.com/watch?v=iD87P6n2opU","後工程はお客様（自工程保証の考え方）",""],["「自分の仕事のできばえの影響を受ける人はお客さま」という日本独特の考え方は？","後工程はお客さま","お客さまは神様","現場第一主義","品質は工程で作り込む","「後工程はお客さま」は、自分の仕事のできばえの影響を受ける人はお客さまだという日本独特の考え方。後工程にとって望ましい状態を作るため、「作りやすい設計」「検査しやすい設計」「設計に役立つ営業情報」などを心がける。","https://kaizen-base.com/column/31818","後工程はお客様とは？自工程保証・源流管理の考え方（カイゼンベース）",["お客さまは神様は買い手を大切にする心構えを表す言葉で、後工程を顧客とみなす考え方ではない。","現場第一主義は現場を重視する姿勢を表す言葉で、仕事のできばえの影響を受ける人を顧客とする考え方ではない。","品質は工程で作り込むは、検査ではなく工程で品質を確保するという考え方である。"],"https://www.youtube.com/watch?v=iD87P6n2opU","後工程はお客様（自工程保証の考え方）","",["x:qc_90","問題＝あるべき姿と現状のずれ（誰にとって・3現主義）"]],["「クレーム件数は5件以下でなければならない。現状を調べたら10件だった」は問題として成立しているか？","成立している（立派な問題）","成立していない（あるべき姿がない）","成立していない（現状を調べていない）","成立していない（ずれがない）","あるべき姿（5件以下）が定義され、現状（10件）も調べてあり、両者にずれがあるので、立派な問題が形成されている。この問題を解決していけばよい。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["あるべき姿は5件以下と定義されているので、あるべき姿がないとはいえない。","現状は10件と調べてあるので、現状を調べていないとはいえない。","あるべき姿の5件以下に対して現状は10件であり、ずれは存在する。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_94","問題として成立しているかを考える4つの例（a〜d）"]],["「クレーム件数は5件以下でなければならない。現状もその通りになっているはずだ」はどんな状態か？","現状を調べていないので問題が形成できていない（問題な問題）","立派な問題","あるべき姿がない問題な問題","ずれがないので問題ではない","あるべき姿は定義されているが、現状を調べていないので問題が形成できていない「問題な問題」。逆に、現状を調べてもあるべき姿がない場合も問題な問題。現状とあるべき姿が一致していれば問題ではない。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["現状を調べていないので両者を比べられず、立派な問題とはいえない。","あるべき姿は5件以下と定義されており、欠けているのは現状の調査のほうである。","現状を調べていない以上、ずれがないかどうかは判断できない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_94","問題として成立しているかを考える4つの例（a〜d）"]],["「問題を形成する力」とは何か？","あるべき姿を定義できる力と現状を調べる力","問題を解決する力","上司に報告する力","データを暗記する力","問題を形成する力（問題形成力）とは、あるべき姿・望ましい状態を定義できる力と、現状を調べる力。問題解決がうまくいかない会社は、どちらかが欠けていることが多い。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["問題を解決する力は形成された問題を解く力で、問題を形成する力とは別のものである。","上司への報告は業務上の行為であり、あるべき姿の定義や現状調査の力ではない。","データの暗記は問題形成に必要な力ではない。必要なのはあるべき姿の定義と現状の調査である。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！",""],["「お客さまの立場で、あるべき姿を作る」ことを何というか？","マーケットイン","プロダクトアウト","ジャストインタイム","アウトソーシング","マーケットインは、お客さまの立場で、あるべき姿を作ること。その逆のプロダクトアウトは「こんなものができたから買ってください」という姿勢で、これでは売れない。","https://gmo-research.ai/research-column/product-out-market-in","プロダクトアウトとマーケットインの違い（GMOリサーチ&AI）",["プロダクトアウトは「こんなものができたから買ってください」という作り手側の姿勢で、マーケットインの逆である。","ジャストインタイムは必要なときに必要な物を必要な分だけ供給する生産方式である。","アウトソーシングは業務の一部を外部に委託することで、あるべき姿の作り方とは関係ない。"],"https://www.youtube.com/watch?v=eRgbqwsVPQY","プロダクトアウトとマーケットインの違いを図解解説",""],["問題解決の3パターンのうち、「あるべき姿を変えてしまう」解決（例：赤く光るはずが緑。でも買ってくれませんか）は？","好ましくない解決","必要だが儲からない解決","必要で好ましく儲かる解決","恒久的な解決","あるべき姿を変える解決は、「赤く光ると書いてあるが緑に光る。でも買ってくれませんか」「チャーハンの注文にラーメンを出したので、ラーメンを食べてください」のように、お客さまとの約束を反故にするもの。好ましくない解決で、とってはいけない。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["必要だが儲からない解決は、手直しや修理などで現状を変える解決であり、あるべき姿は変えない。","必要で好ましく儲かる解決は、ずれた原因を探って原因に代替案を打つ解決である。","恒久的な解決は原因に手を打って再発を防ぐもので、約束を反故にする解決とは逆である。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_98","問題解決の3パターン（あるべき姿を変更・現状を変更・原因に代替案）"]],["問題解決の3パターンのうち、「現状を変える」解決（手直し・修理・調節・廃棄）は？","必要だが、再発し儲からない解決","好ましくない解決","必要で好ましく儲かる解決","最も望ましい解決","現状を変える解決は、手直し・修理・調節・廃棄で、不良品や要求に合わないものを供給しないために必要な処置。ただし同じ不具合が別のお客さまの所でまた発生するので、「必要だが儲からない解決」。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["好ましくない解決は、あるべき姿のほうを変えてしまう解決で、現状を変えるものではない。","必要で好ましく儲かる解決は、ずれた原因を探って原因に手を打ち、再発を防ぐ解決である。","手直しや修理では同じ不具合が再発するため、最も望ましい解決とはいえない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！",""],["顧客にとって一番安心できる処置は何か？","廃棄","手直し","修理","調節","顧客にとって一番安心できる処置は廃棄で、不良品を全部捨ててもらえるとありがたい。しかし作る側にとってはもったいないので、顧客の許可も得ずに手直し・修理・調節をしていることもある。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["手直しは不適合品を作る側の判断で直すことが多く、顧客にとっては廃棄ほど安心できない。","修理は不具合を直して使う処置で、同じ不具合が残る懸念があり廃棄ほど安心できない。","調節は条件を合わせ直す処置で、作る側の都合で行われることもあり顧客にとって最も安心な処置ではない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！",""],["「必要で、好ましくて、儲かる」問題解決の方法は？","ずれた原因を探り、原因に代替案を打つ","あるべき姿を変更する","不良品をすべて手直しする","検査を増やす","あるべき姿と現状がずれた原因を探り、その原因に代替案を打つのが「必要で、好ましくて、儲かる」解決方法。例えば、赤と緑に光る部品のリード線を色分けする、注文を復唱して紙に書いて厨房に渡す、など。原因に手を打てば再発しない。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["あるべき姿の変更は、お客さまとの約束を反故にする好ましくない解決である。","手直しは現状を変える解決で、必要だが同じ不具合が再発し儲からない。","検査を増やしても不良の発生原因は残るため、再発を防ぐ儲かる解決にはならない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_98","問題解決の3パターン（あるべき姿を変更・現状を変更・原因に代替案）"]],["品質管理で、初めての失敗はどう扱われるか？","許容しなければならない（予測できないため）","厳しく罰する","なかったことにする","必ず予防できる","1回目の失敗は予測できないので、代替案の手法では防げない。品質管理では、初めての失敗は許容しなければならない。重要なのは、その失敗から学び、再発を防ぐこと。原因を探るにはなぜなぜ問答が必要。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["初めての失敗は予測できないので防げず、罰するのではなく失敗から学び再発を防ぐことが重要である。","失敗をなかったことにすると原因が究明できず、再発防止につなげられない。","1回目の失敗は予測できないため、代替案の手法でも必ず予防できるとはいえない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！",""],["問題解決の流れで、「あるべき姿と現状のずれを定義すること」を何と呼ぶか？","問題の形成","問題の解決（狭義）","意思決定","代替案の抽出","あるべき姿と現状のずれを定義することを「問題の形成」とし、原因の究明から解決策の選択までを「問題の解決（狭い意味での問題解決）」と分けることがある。最初から最後までを広い意味での問題解決という。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["狭義の問題の解決は、原因の究明から解決策の選択までを指し、ずれの定義は含まない。","意思決定は代替案の抽出と解決策の選択を指し、ずれの定義を指すものではない。","代替案の抽出は原因に打つ対策の案を出す段階で、問題の形成の後に行うものである。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_103","問題解決の流れと問題の形成・分析・意思決定の範囲"]],["「代替案の抽出と解決策の選択」は何と呼ばれるか？","意思決定","問題の分析","問題の形成","原因の究明","ずれと、その原因を究明するところまでを「問題の分析」、代替案の抽出と解決策の選択を「意思決定」と呼ぶ分け方もある。代替案の中から、コスト的にも実務的にも良い解決策を選ぶ。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["問題の分析は、ずれとその原因を究明するところまでを指し、代替案の選択は含まない。","問題の形成は、あるべき姿と現状のずれを定義することである。","原因の究明はずれが生じた原因を探る段階で、問題の分析に含まれる。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！","",["x:qc_103","問題解決の流れと問題の形成・分析・意思決定の範囲"]],["問題解決において一番重要なことは何か？","問題を形成すること","対策を早く打つこと","原因を一つに絞ること","報告書を書くこと","問題解決において一番重要なのは、問題を形成すること。問題がないところには解決もない。問題が見当たらないのは、形成しようとしていないか、見方が悪くて形成できないかのどちらか。","https://www.kaonavi.jp/dictionary/mondaikaiketsu/","問題解決とは？プロセスやフレームワークを解説（カオナビ人事用語集）",["対策を早く打っても、問題が形成されていなければ的外れな解決になりかねない。","原因を一つに絞ることは要因の解析の段階の話で、問題解決全体で最も重要なことではない。","報告書の作成は活動のまとめであり、問題がなければ解決もない以上、最重要とはいえない。"],"https://www.youtube.com/watch?v=lH0lKLancZM","QC的に『問題』と『課題』の違いを解説！",""],["問題解決の手順は別名で何と呼ばれるか？","QCストーリー","PDCAサイクル","QC七つ道具","方針管理","問題解決の手順は、別名QCストーリーと呼ばれる。ある会社がサークル活動の発表会のために「この流れで発表すると分かりやすい」という手順を作り、その順番で解決していけばうまくいくことに気付いて生まれた。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["PDCAサイクルは計画・実施・確認・処置を回す管理のサイクルで、問題解決の手順の別名ではない。","QC七つ道具は問題解決で使う手法群であり、手順そのものの呼び名ではない。","方針管理は経営方針を展開して達成する管理であり、問題解決の手順の別名ではない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["問題解決の8つの手順で、手順1〜3の正しい順番は？","テーマの選定 → 現状の把握 → 目標の設定","現状の把握 → テーマの選定 → 目標の設定","目標の設定 → 現状の把握 → テーマの選定","テーマの選定 → 目標の設定 → 現状の把握","問題解決の手順は、1テーマの選定→2現状の把握→3目標の設定→4活動計画の作成→5要因の解析→6対策の検討と実施→7効果の確認→8標準化と管理の定着の8つ。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["現状を把握する前にテーマを選定する必要がある。最初の手順はテーマの選定である。","目標は現状を把握してから設定するものであり、最初に目標を設定するのは誤り。","目標は現状把握の結果をもとに設定するので、目標の設定を現状の把握より先にするのは誤り。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴","",["x:qc_107","問題解決の8つの手順（QCストーリー）"]],["問題解決の手順で「テーマの選定」の際に重要な考え方は？","重点指向（上位方針に合致すること）","標準化","ばらつきを尺度","事実の記述","テーマの選定では、何をやりたいのかを明らかにする。重要なのは重点指向で、色々な問題があっても重要なものを選ぶ。当然、上位方針に合致するテーマでなければならない。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["標準化は最後の手順「標準化と管理の定着」で重要になる考え方である。","ばらつきを尺度とする考え方は、現状の把握や要因の解析で差・違いに注目するときに役立つ。","事実の記述は事実で判断するための手段であり、テーマを選ぶ際の中心となる考え方ではない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["「現状の把握」の2つの狙いの組合せは？","目標設定の材料にすること、原因の手掛かりを見つけること","テーマを決めること、対策を決めること","効果を確認すること、標準化すること","活動計画を作ること、人を集めること","現状の把握の狙いは2つ。1つは手順3の目標設定に使うため（現状がこのくらいだから目標はこのくらい）、もう1つは原因を探るときの手掛かりを見つけるため。名医は見立て（現状把握）が上手という話がある。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["テーマは手順1で決め、対策は手順6で決めるもので、現状の把握の狙いではない。","効果の確認と標準化は手順7・8で行うことであり、現状の把握の狙いではない。","活動計画は手順4で作るもので、人を集めることも現状の把握の狙いではない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["目標の三要素の組合せは？","何を、いつまでに、どれくらい","誰が、どこで、なぜ","何を、どこで、誰が","なぜ、どのように、いくらで","目標の三要素は「何を」「いつまでに」「どれくらい」。例えば「寸法不良を3月末までに半分にする」が目標。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["誰が、どこで、なぜは5W1Hの一部であり、目標の三要素ではない。","どこで、誰がは目標の要素ではなく、「いつまでに」「どれくらい」が欠けている。","なぜ、どのように、いくらでは目標の三要素ではなく、達成期限と達成水準が含まれない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["「作業方法の確立」は、目的と目標のどちらか？","目的","目標","方策","手順","「作業方法の確立」は目的であり、作業方法が確立されたかどうかを図るのが目標（何をいつまでにどれくらい）。目的と目標を混同しないようにする。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["目標は「何を、いつまでに、どれくらい」で表すもので、作業方法が確立されたかどうかを測るものにあたる。","方策は目標を達成するための手段であり、作業方法の確立という狙いそのものとは異なる。","手順は仕事を進める順序を示すもので、作業方法の確立という目的・目標の区別とは関係ない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["「活動計画の作成」で決めることの組合せは？","誰が、何を、いつ始めていつ終わるか","何を、いつまでに、どれくらい","原因、対策、効果","規格、公差、検査方法","活動計画の作成では「誰が」「何を」「いつ始めていつ終わるか」を決める。改善には色々な人の知恵や知識が必要なので、設計・営業・品管など適当な人を事前に活動計画に埋め込んでおく。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["何を、いつまでに、どれくらいは目標の三要素であり、活動計画で決める内容ではない。","原因・対策・効果は要因の解析以降の手順で扱う内容である。","規格・公差・検査方法は製品の品質の基準であり、活動計画で決めるものではない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["「要因の解析」では、原因を探るために何を集めるか？","要因（たくさんの原因の候補）","対策案","目標値","標準書","要因の解析では、原因を探るために、たくさんの原因の候補である「要因」を集めてくる必要がある。特性要因図などの道具が役立つ。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["対策案は要因の解析で原因を突き止めた後、対策の検討と実施で考えるものである。","目標値は手順3の目標の設定で決めるもので、原因を探るために集めるものではない。","標準書は最後の標準化と管理の定着で作るもので、要因の解析で集めるものではない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["「効果の確認」で必ず行うべきことは？","手順3の目標と対比する","効果が出た別の項目で評価する","効果がなければ評価をやめる","対策者の感想を聞く","効果の確認は、必ず手順3で設定した目標と対比する。思ったほど効果が出ないからと違う項目で評価してはいけない。風邪で解熱剤を飲んだのに熱が下がらないからと血圧を測るようなもの。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["効果が出なかったからと別の項目で評価するのは、解熱剤を飲んで血圧を測るようなもので誤りである。","効果がなければ評価をやめるのではなく、目標との差を確認して原因の解析に戻る必要がある。","対策者の感想は事実で判断することにならず、目標と対比した評価が必要である。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["問題解決の最後の手順「標準化と管理の定着」で行うことは？","作業標準などを作り、周知と教育訓練をしてPDCAで定着させる","報告書を作って終わる","対策を元に戻す","担当者を表彰する","標準化と管理の定着では、打った対策が後戻りしないように、作業標準や指示書・指図書などを作る。それだけでなく、新しい標準を周知し、皆がその通りできるよう教育訓練をして、PDCAサイクルで定着させる。","https://kaizen-base.com/column/32101","QCサークルで活用するQCストーリーの解説（カイゼンベース）",["報告書で終わると対策が後戻りするおそれがあり、標準を作って定着させる必要がある。","対策を元に戻しては効果が失われる。打った対策が後戻りしないようにするのがこの手順である。","表彰は活動の動機づけにはなるが、管理の定着として行うべきことではない。"],"https://www.youtube.com/watch?v=t9S_JjoubV0","「よくわかるQCストーリー」体験試聴",""],["「問題解決」と「課題達成」の違いとして正しいものは？","問題解決はあるべき姿が決まっている場合、課題達成は創造された「ありたい姿」を作る場合","問題解決はありたい姿を作る場合、課題達成はあるべき姿が決まっている場合","どちらも同じ意味","課題達成は現状を把握しなくてよい","問題解決は「あるべき姿」が決まっている場合に行うもの。課題達成は「あるべき姿」がまだない状況で、創造された「ありたい姿」を作ることが狙い。ただし課題達成でも、現状は明確に把握できている必要がある。","https://www.juse.or.jp/service_solution/qc_story/","QCストーリー・QC手法（日本科学技術連盟）",["説明が逆である。問題解決があるべき姿が決まっている場合、課題達成がありたい姿を作る場合である。","あるべき姿の有無で使い分けるもので、両者は同じ意味ではない。","課題達成でもありたい姿との差を明らかにするため、現状は明確に把握できている必要がある。"],"https://www.youtube.com/watch?v=k_PbOiqQHhM","QCストーリーの3つの型を誤解","",["x:qc_116","問題解決と課題達成のアプローチの比較"]],["問題解決と課題達成のアプローチは、それぞれ何と呼ばれるか？","問題解決＝解析的アプローチ、課題達成＝設計的アプローチ","問題解決＝設計的アプローチ、課題達成＝解析的アプローチ","どちらも解析的アプローチ","どちらも設計的アプローチ","問題解決は、あるべき姿も現状も明確なので、ずれた原因を細かく分けて探し対策を打つ「解析的アプローチ」。課題達成は、ありたい姿を作り、方策を考えて成功シナリオを作るので「設計的アプローチ」と呼ばれる。","https://www.juse.or.jp/service_solution/qc_story/","QCストーリー・QC手法（日本科学技術連盟）",["対応が逆である。問題解決は原因を細かく分けて探す解析的、課題達成は成功シナリオを作る設計的アプローチである。","課題達成はありたい姿を作り方策を考える設計的アプローチであり、どちらも解析的とするのは誤り。","問題解決は原因を探って対策を打つ解析的アプローチであり、どちらも設計的とするのは誤り。"],"https://www.youtube.com/watch?v=k_PbOiqQHhM","QCストーリーの3つの型を誤解",""],["課題達成型QCストーリーで、問題解決型の「要因の解析」にあたる手順は？","方策の立案","攻め所と目標の設定","成功シナリオの追究と実施","テーマの選定","問題解決型と課題達成型では手順2・4・5が異なる。問題解決型は「現状の把握と目標の設定→要因の解析→対策の検討と実施」、課題達成型は「攻め所と目標の設定→方策の立案→成功シナリオの追究と実施」。テーマの選定・活動計画・効果の確認・標準化は共通。","https://www.juse.or.jp/service_solution/qc_story/","QCストーリー・QC手法（日本科学技術連盟）",["攻め所と目標の設定は、問題解決型の「現状の把握と目標の設定」にあたる手順である。","成功シナリオの追究と実施は、問題解決型の「対策の検討と実施」にあたる手順である。","テーマの選定は問題解決型と課題達成型で共通の手順で、要因の解析にあたるものではない。"],"https://www.youtube.com/watch?v=k_PbOiqQHhM","QCストーリーの3つの型を誤解","",["x:qc_118","問題解決型と課題達成型のQCストーリーの手順比較"]],["統計的考え方で一番重要なのは何という考え方か？","母集団とサンプル","平均と分散","規格と公差","原因と結果","統計的考え方で一番重要なのは、母集団とサンプルという考え方。母集団からサンプリングしてサンプルを得て、測定してデータを得て、そのデータから母集団を推測し、母集団に処置（アクション）をとる。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["平均と分散はデータをまとめる統計量であり、最も重要な考え方そのものではない。","規格と公差は製品の品質の基準を定めるもので、統計的考え方の中心ではない。","原因と結果はQC的考え方の因果関係にあたるもので、統計的考え方の中心ではない。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本","",["x:qc_119","母集団・サンプル・データの関係（サンプリングと推測）"]],["母集団とは何の対象か？","処置（アクション）の対象","測定の対象","廃棄の対象","検査の対象","母集団は、処置（アクション）の対象。味噌汁の例では、味が薄いときに味噌を入れるのはお玉（サンプル）ではなく鍋（母集団）。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["測定の対象はサンプルであり、母集団はサンプルのデータから推測して処置をとる対象である。","廃棄の対象は不適合品などであり、サンプルから推測して処置をとる母集団の定義ではない。","検査で調べるのはサンプルであることが多く、母集団は処置をとる対象として定義される。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本",""],["母集団から抜き取られた構成要素を何というか？","サンプル（標本、試料）","ロット","データ","工程","サンプルは、母集団から抜き取られた構成要素で、標本や試料ともいう。母集団の構成要素の一部を抜き取ることをサンプリングという。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["ロットは等しい条件下で生産された品物の集まりで、サンプルを抜き取る元になる有限母集団である。","データはサンプルを測定して得られる値であり、抜き取られた構成要素そのものではない。","工程は製品・サービスを作り出す源泉で、無限母集団として扱われるものである。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本",""],["サンプルだけに処置を打つことについて、テキストの注意点は？","決してやってはいけない","積極的に行うべき","母集団が小さいときだけ行う","検査のときだけ行う","サンプルだけに処置を打つことは決してやってはいけない。処置の対象はあくまで母集団。味噌汁の味が薄いからといって、お玉の中にだけ味噌を入れても鍋の味は変わらない。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["処置の対象はあくまで母集団であり、サンプルだけに処置を打っても母集団は変わらない。","母集団の大小にかかわらず、処置はサンプルではなく母集団に対して打つ必要がある。","検査の場合でも、サンプルだけに処置をしても母集団の品質は改善されない。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本",""],["工程管理や工程解析で、母集団となる「工程」は無限母集団と有限母集団のどちらか？","無限母集団","有限母集団","どちらでもない","サンプル","工程管理（工程を安定させるための管理）や工程解析（工程が良い結果を出していないときにデータを取って解析する）では、工程が母集団になる。工程は明日も明後日も物を作り続けるので、無限母集団と考える。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["有限母集団はロットのように一定のサイズで定まっている母集団で、作り続ける工程には当てはまらない。","工程は明日以降も物を作り続けるため、無限母集団として扱われる。","サンプルは母集団から抜き取られた構成要素であり、工程そのものを指すものではない。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本","",["x:qc_123","無限母集団（工程）と有限母集団（ロット）"]],["ロットの品位推定のように、一定のサイズで定まっている母集団を何というか？","有限母集団","無限母集団","工程","標本空間","ロットは一定のサイズで定まっているので有限母集団。ロットからサンプリングして測定し、そのロットの品位（どのくらいの品質のものがどのくらいのレベルでできているか）を推定する。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["無限母集団は工程のように今後も作り続けられ、大きさが定まらない母集団である。","工程は製品を作り続ける源泉で、無限母集団として扱われる。","標本空間は確率論で起こりうる結果全体の集合を指す用語で、ロットのような母集団の呼び名ではない。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本","",["x:qc_123","無限母集団（工程）と有限母集団（ロット）"]],["「製品・サービスを作り出す源泉」と定義されるものは？","工程","ロット","サンプル","母集団","工程は「製品・サービスを作り出す源泉」と定義される。無限母集団の場合、まず工程からサンプリングしてロットを得て、ロットからサンプルを抜き取る。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["ロットは工程から作り出された品物の集まりであり、製品を作り出す源泉そのものではない。","サンプルはロットなどから抜き取られた構成要素で、製品を作り出す源泉ではない。","母集団は処置の対象を指す概念で、工程もロットも母集団になりうるため定義としては当てはまらない。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本",""],["「等しい条件下で生産され、又は生産されたと思われる品物の集まり（サービスも含む）」を何というか？","ロット","工程","サンプル","バッチ処理","ロットは「等しい条件下で生産され、又は生産されたと思われる品物の集まり」と定義され、サービスも含む。製品や原材料の一塊をロットと呼ぶ。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["工程は製品・サービスを作り出す源泉であり、品物の集まりではない。","サンプルはロットなどから抜き取られた一部の構成要素である。","バッチ処理は一定量をまとめて処理する方式を指す語で、品物の集まりの定義ではない。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本",""],["引退して生涯打率が分かる長嶋茂雄さんと、現役のイチロー選手（テキスト執筆時）は、それぞれどちらの母集団の例か？","長嶋さん＝有限母集団、イチロー選手＝無限母集団","長嶋さん＝無限母集団、イチロー選手＝有限母集団","どちらも有限母集団","どちらも無限母集団","引退していて生涯打率が分かる長嶋茂雄さんは有限母集団、現役でこれからも打ち続けるイチロー選手（テキスト執筆時）は無限母集団。同じ母集団でも、何を知りたいかによって無限か有限かが変わる。","https://r-portal.gmo-research.ai/trendnavi/articles/case-nrc-population-and-sample/","母集団と標本の違いとは？（GMOリサーチ&AI）",["対応が逆である。引退して記録が確定した長嶋さんが有限母集団、打ち続ける現役選手が無限母集団である。","現役でこれからも打ち続ける選手は、結果が確定していないので無限母集団である。","生涯打率が確定している引退選手は有限母集団であり、どちらも無限母集団とするのは誤り。"],"https://www.youtube.com/watch?v=NCls8MPzTr4","【やさしく学ぶ統計学】母集団と標本",""],["母集団を構成する単位体や単位量が、同じ確からしさで抜き取られるサンプリングを何というか？","ランダムサンプリング","目で見て選ぶサンプリング","有意サンプリング","全数検査","ランダムサンプリングは、母集団を構成する単位体や単位量が、同じ確からしさで抜き取られるサンプリング。サンプルが母集団を代表しているかは分からないので「手続き的に正しい」サンプリングを行う。乱数表やサイコロで行う。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["目で見て選ぶと良さそうなものに偏りやすく、同じ確からしさで抜き取ることにならない。","有意サンプリングは調査者の判断で代表的と思われるものを選ぶ方法で、ランダムではない。","全数検査はすべてを調べる方法で、サンプリングを行わない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】","",["w:197_1","母集団から等確率で標本を抜き取るランダムサンプリング",{"a":"Dan Kernler","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Simple_random_sampling.PNG"}]],["ペットボトルの中の液体や長い電線、粉ミルクのような流体・連続体・粉体を何と呼ぶか？","単位量","単位体","ロット","サンプル","ボール1個、ペットボトル1本のように数えられるものを単位体、ペットボトルの中の液体・長い電線・粉ミルクのような流体・連続体・粉体を単位量と呼ぶ。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["単位体はボール1個やペットボトル1本のように、数えられるものを指す。","ロットは等しい条件下で生産された品物の集まりで、流体や粉体の呼び名ではない。","サンプルは母集団から抜き取られた構成要素であり、流体・連続体・粉体を指す語ではない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】",""],["テレビの視聴率調査のように、誰が抜き取られたかによって値が変わる誤差を何というか？","サンプリング誤差","測定誤差","丸め誤差","系統誤差","サンプリング誤差は、誰が（何が）抜き取られたかによって値が変わる誤差。関東約1,700万世帯の視聴率を数百世帯で測ると、残りの世帯は調べていないので誤差が生じる。サンプリング誤差と測定誤差は必ず発生する。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["測定誤差は測定することで真の値からずれる誤差で、誰が抜き取られたかによる誤差ではない。","丸め誤差は数値の端数を丸めることで生じる誤差であり、抜き取りとは関係ない。","系統誤差は測定器のくせなどにより一定方向に偏って生じる誤差で、抜き取られ方による誤差ではない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】",""],["猫がリモコンを踏んでチャンネルが変わるように、測定によって真の値からずれる誤差を何というか？","測定誤差","サンプリング誤差","桁落ち誤差","量子化誤差","測定誤差は、測定することで真の値からずれる誤差。猫がリモコンを踏んでもチャンネルは変わり、視聴していないのに記録されてしまう。味噌汁でも、味わう人の体調によって味が変わる。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["サンプリング誤差は、誰が（何が）抜き取られたかによって値が変わる誤差である。","桁落ち誤差は近い値どうしの引き算で有効桁数が減ることによる計算上の誤差である。","量子化誤差は連続量を離散的な値に変換するときに生じる誤差である。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】","",["w:124_0","真の値（中心）から一方向にずれた測定値の例",{"a":"Q50005","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Low_accuracy%EF%BC%8C_High_precision.JPG"}]],["大きさ50の部品ロットから乱数表で8個のサンプルを抜き取るとき、最初の手順は？","部品に1〜50の番号を付ける","乱数表の出発点を決める","サイコロを振る","良さそうな部品を8個選ぶ","乱数表を使ったサンプリングでは、手順1：部品に1〜50の番号を付ける、手順2：乱数表を用意する（エクセルのRAND関数でも作れる）、手順3：乱数表のどこを使うかを決める（出発点を目をつぶって鉛筆を落とすなど恣意的でない方法で決める）。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["出発点は部品に番号を付け、乱数表を用意した後で決める手順である。","乱数表を用いる方法であり、サイコロを振ることは最初の手順ではない。","良さそうな部品を選ぶと恣意的になり、ランダムサンプリングにならない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】","",["x:qc_132","乱数表を使ったサンプリングの手順例"]],["乱数表で、部品番号（1〜50）を超える乱数65が出た場合、テキストの方法ではどうするか？","50を引いて15番を抜き取る","65番を抜き取る","その乱数を必ず飛ばす","最初からやり直す","部品番号は1〜50なので、65という乱数が出たら50を引いて15番を抜き取る。同じ番号が既に出ていたら飛ばす。テキストの例では、37、15、12、27、18、23、32、3番を抜き取った。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["部品番号は1〜50なので、65番という部品は存在せず抜き取れない。","この方法では範囲を超えた乱数は50を引いて使う。飛ばすのは同じ番号が既に出た場合である。","範囲外の乱数が出ても最初からやり直す必要はなく、50を引いて番号に対応させる。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】","",["x:qc_132","乱数表を使ったサンプリングの手順例"]],["データ採取の計画で、「b. 調査の対象とする項目」は何と呼ばれるか？","特性","母集団","サンプル数","ロット","データ採取の計画は、a何を知りたいか、b調査の対象とする項目（特性）、c処置をとろうとしている対象（母集団）、dデータ収集期間、eサンプリング方法、fサンプル数、g測定方法の検討からなる。特性は、体調なら体温、工程の調子なら不良率など「何を測ればいいか」。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["母集団は「c. 処置をとろうとしている対象」にあたり、調査の対象とする項目ではない。","サンプル数は「f」で検討するもので、何を測るかという項目ではない。","ロットは品物の集まりで、調査の対象とする項目を指す語ではない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】",""],["サンプリング方法の検討で挙げられている、ランダムサンプリングの種類の組合せは？","単純ランダムサンプリング、層別サンプリング、集落サンプリング","有意サンプリング、全数検査、抜取検査","乱数サンプリング、サイコロサンプリング、目視サンプリング","系統サンプリング、目的サンプリング、便宜サンプリング","ランダムサンプリングの中にも、単純ランダムサンプリング、層別サンプリング、集落サンプリングなどがあり、どのサンプリング方法がよいかを検討する。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["有意サンプリングは調査者の判断で選ぶ方法で、全数検査と抜取検査は検査方式である。","サイコロや乱数はランダムサンプリングの道具であり、目視で選ぶ方法はランダムではない。","目的サンプリングや便宜サンプリングは調査者の都合で選ぶ方法で、ランダムサンプリングの種類ではない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】","",["w:206_3","母集団を層に分け各層からランダムに抜き取る層別サンプリング",{"a":"Bboxleiter","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:StratifiedRandomSampling.jpg"}]],["データ採取の計画「g. 測定方法の検討」で特に考慮すべきことは？","測定誤差","サンプリング誤差","データ収集期間","処置の対象","測定方法の検討では、どうやって測るかを、特に測定誤差を考慮して検討する。サンプル数は、ケチると良い結果が出ないので、それなりの数を検討する。","https://www.macromill.com/research-words/random-sampling.html","ランダムサンプリングとは（マクロミル）",["サンプリング誤差は「e. サンプリング方法の検討」で考慮すべき誤差である。","データ収集期間は「d」で検討する項目で、測定方法の検討で特に考慮することではない。","処置の対象は「c」の母集団にあたり、測定方法の検討の論点ではない。"],"https://www.youtube.com/watch?v=Bj8fkq533Dc","推定・検定入門①(母集団と標本)【確率統計】",""],["数値データのうち、「はかって得られるデータ（連続量）」を何というか？","計量値","計数値","言語データ","順位データ","計量値は、はかって得られるデータ（連続量）。身長164.5cm、体重62.8kgのように、小数点を打って意味があるもの。","https://bellcurve.jp/statistics/glossary/760.html","量的データ（統計WEB）",["計数値はかぞえて得られるデータ（離散量）で、不適合品数やクレーム件数などが該当する。","言語データは言葉で表された情報で、数値データではない。","順位データは順番を表すデータで、はかって得られる連続量ではない。"],"https://www.youtube.com/watch?v=jNCgEvulmUI","【イメージ図で覚える！】QC検定3級 完全解説","",["x:qc_137","データの種類（言語データ、計量値・計数値）"]],["数値データのうち、「かぞえて得られるデータ（離散量）」を何というか？","計数値","計量値","連続量","言語データ","計数値は、かぞえて得られるデータ（離散量）。参加者数、お客さまの数、クレーム件数、不適合品の数など、ボール1.5個や参加者10.8人のように小数点を打っても意味がないもの。","https://bellcurve.jp/statistics/glossary/760.html","量的データ（統計WEB）",["計量値ははかって得られるデータ（連続量）で、身長や体重などが該当する。","連続量は計量値の性質であり、かぞえて得られる離散量ではない。","言語データは言葉で表された情報で、数値データではない。"],"https://www.youtube.com/watch?v=jNCgEvulmUI","【イメージ図で覚える！】QC検定3級 完全解説",""],["不良率（不良個数÷検査個数）は計量値と計数値のどちらか？","計数値","計量値","言語データ","どちらでもない","不良率（不良個数÷検査個数）は小数点が意味をもつが、計数値として扱う。比率値は分子で判断し、分子の不良個数が数えて得られる計数値だから。","https://bellcurve.jp/statistics/glossary/760.html","量的データ（統計WEB）",["小数点が意味をもつが、比率値は分子で判断し、分子の不良個数は数えて得られるため計量値ではない。","不良率は数値で表されるデータであり、言語データではない。","不良率も数値データであり、分子の不良個数が数えて得られる値なので計数値に分類される。"],"https://www.youtube.com/watch?v=jNCgEvulmUI","【イメージ図で覚える！】QC検定3級 完全解説",""],["点を打ったグラフをドットプロットと呼ぶ。「点」と「点を打つこと」をそれぞれ何というか？","ドット、プロット","プロット、ドット","ポイント、マーク","ドット、マーク","点のことをドット、点を打つことをプロットというので、数直線上に点を打って表したものをドットプロットという。女子と男子の身長を比べる例で使われている。","https://bellcurve.jp/statistics/course/19361.html","データのばらつきを計算してみよう（統計WEB）",["呼び方が逆である。点がドット、点を打つことがプロットである。","ポイント・マークはドットプロットの名称の由来となる語ではない。","点をドットと呼ぶのは正しいが、点を打つことはマークではなくプロットである。"],"https://www.youtube.com/watch?v=hgQEYlhoNQ0","80点を目指す！QC検定3級対策vol1 ～統計計算基礎～","",["x:qc_140","ドットプロットと代表値（平均値）・ばらつき（範囲）"]],["データの数値的まとめ方で、代表値とばらつきを表すものとしてテキストが採用しているのは？","平均値と範囲","中央値と標準偏差","最頻値と分散","最大値と最小値","データの数値的まとめ方には代表値とばらつきがあり、テキストでは代表値に平均値、ばらつきに範囲を採用している。現場で計算しやすく、物理量も分かりやすいため。","https://bellcurve.jp/statistics/course/19361.html","データのばらつきを計算してみよう（統計WEB）",["中央値と標準偏差も代表値とばらつきを表すが、現場での計算しやすさから採用されていない。","最頻値と分散も代表値とばらつきを表す統計量だが、ここで採用されているものではない。","最大値と最小値は範囲を求めるのに使う値であり、代表値を表すものではない。"],"https://www.youtube.com/watch?v=hgQEYlhoNQ0","80点を目指す！QC検定3級対策vol1 ～統計計算基礎～",""],["データ 10, 16, 19, 28, 34, 37 の平均値はいくらか？","24.0","23.5","27.0","144","平均値はデータの総和をデータ数で割った値。(10＋16＋19＋28＋34＋37)÷6＝144÷6＝24.0。データ数が少ないときは測定値より一桁下まで表示するので24.0とする。平均値はx̄（エックスバー）で表す。","https://bellcurve.jp/statistics/course/19361.html","データのばらつきを計算してみよう（統計WEB）",["23.5は中央の2つの値19と28の平均で求めた中央値であり、平均値ではない。","27.0は最大値37から最小値10を引いた範囲Rの値である。","144はデータの総和であり、データ数6で割る前の値である。"],"https://www.youtube.com/watch?v=hgQEYlhoNQ0","80点を目指す！QC検定3級対策vol1 ～統計計算基礎～","",["x:qc_142","平均値の求め方（データの総和÷データ数）"]],["データ 10, 16, 19, 28, 34, 37 の範囲Rはいくらか？","27","24","37","10","範囲Rは最大値と最小値の差（R＝xmax−xmin）。37−10＝27。電卓も不要で分かりやすい。Rが大きいほどばらつきは大きい。","https://bellcurve.jp/statistics/course/19361.html","データのばらつきを計算してみよう（統計WEB）",["24は平均値（144÷6）であり、最大値と最小値の差である範囲ではない。","37は最大値そのものであり、範囲は最大値から最小値10を引いて求める。","10は最小値そのものであり、範囲は最大値37との差で求める。"],"https://www.youtube.com/watch?v=hgQEYlhoNQ0","80点を目指す！QC検定3級対策vol1 ～統計計算基礎～","",["x:qc_143","範囲R＝最大値−最小値の求め方"]],["平均値の表示桁数について、テキストの決まりは？","データ数が少ないときは測定値より一桁下、20を超えたら二桁下まで","常に整数で表示","常に小数点以下3桁","測定値と同じ桁","平均値は、データ数が少ないときは測定値より一桁下まで表示し、データ数が20を超えたら二桁下まで表示するという決まりがある。","https://bellcurve.jp/statistics/course/19361.html","データのばらつきを計算してみよう（統計WEB）",["整数で丸めると情報が失われる。データ数に応じて測定値より一桁または二桁下まで表示する。","データ数によらず常に小数点以下3桁とする決まりはない。","測定値と同じ桁では精度が不足するため、測定値より下の桁まで表示する。"],"https://www.youtube.com/watch?v=hgQEYlhoNQ0","80点を目指す！QC検定3級対策vol1 ～統計計算基礎～",""],["範囲Rがゼロであることは何を意味するか？","ばらつきがなく、すべて同じ値","データがない","平均値がゼロ","ばらつきが最大","範囲Rが大きければばらつきは大きく、小さければばらつきは小さい。Rがゼロであれば、ばらつきはなく、すべて同じ値になる。","https://bellcurve.jp/statistics/course/19361.html","データのばらつきを計算してみよう（統計WEB）",["範囲は最大値と最小値の差であり、ゼロであることはデータがないことを意味しない。","範囲はばらつきの指標であり、平均値の大きさとは関係しない。","範囲がゼロはばらつきがない状態で、ばらつきが最大であることとは逆である。"],"https://www.youtube.com/watch?v=hgQEYlhoNQ0","80点を目指す！QC検定3級対策vol1 ～統計計算基礎～","",["x:qc_143","範囲R＝最大値−最小値の求め方"]],["棚卸とは何か？","現存する部品・材料・製品の在庫、仕掛品すべての数量を実際に数えて確認すること","期末に資産を評価すること","在庫を重要度で分類すること","必要なときに必要な分だけ運ぶこと","棚卸は、現存する部品・材料・製品の在庫、仕掛品すべての数量を実際に数えて確認すること。期末に行う期末棚卸は、棚卸評価と期末最後の資産評価が目的。","https://www.keyence.co.jp/ss/general/manufacture-tips/inventory-control.jsp","「在庫管理」を徹底・効率化する方法（キーエンス）",["期末に資産を評価することは期末棚卸の目的であり、棚卸そのものの定義ではない。","在庫を重要度で分類して管理するのはABC分析である。","必要なときに必要な分だけ運ぶのはジャスト・イン・タイムの考え方である。"],"https://www.youtube.com/watch?v=ZKUGP1pKCxw","ABC分析とは？在庫管理の鍵を握る重要な手法を解説",""],["「必要なときに、必要な部品を、必要な分だけ」工程の上流からもってくればよいとする考え方は？","ジャスト・イン・タイム","ABC分析","期末棚卸","セル生産","ジャスト・イン・タイム（JIT）は、「必要なときに、必要な部品を、必要な分だけ」工程の上流からもってくればよいとする考え方。ムリ・ムダ・ムラを排除し、保管費の節減やスペースの有効利用につながる。「自働化」とともにトヨタ生産方式を構成する2本柱の1つ。","https://www.keyence.co.jp/ss/general/manufacture-tips/inventory-control.jsp","「在庫管理」を徹底・効率化する方法（キーエンス）",["ABC分析は在庫品目を年間の消費金額順に3グループに分けて管理する方法である。","期末棚卸は期末に在庫の数量を実際に数え、資産を評価するために行うものである。","セル生産は少人数のチームが一つの製品の組立てを多工程にわたって担当する生産方式である。"],"https://www.youtube.com/watch?v=ZKUGP1pKCxw","ABC分析とは？在庫管理の鍵を握る重要な手法を解説",""],["在庫品目を年間の消費（販売）金額の順に並べ、3グループに分けて違った管理を行う方法は？","ABC分析","ジャスト・イン・タイム","棚卸","層別","ABC分析は、在庫を重要性の観点から分類して管理する方法。在庫品目を年間の消費（販売）金額の順に並べ、A・B・Cの3グループに分け、それぞれ違った管理を行う。重要なAグループを重点的に管理する、重点指向の考え方。","https://www.keyence.co.jp/ss/general/manufacture-tips/inventory-control.jsp","「在庫管理」を徹底・効率化する方法（キーエンス）",["ジャスト・イン・タイムは必要なときに必要な部品を必要な分だけもってくる考え方である。","棚卸は在庫や仕掛品の数量を実際に数えて確認することである。","層別は共通点や特徴に着目してデータをグループに分ける考え方で、在庫管理の方法ではない。"],"https://www.youtube.com/watch?v=ZKUGP1pKCxw","ABC分析とは？在庫管理の鍵を握る重要な手法を解説",""],["石川馨先生は「QC七つ道具を使うだけで、問題の何割が解決する」と言ったか？","8割から9割","2割から3割","5割","10割すべて","石川馨先生は「QC七つ道具を使うだけで問題の8割から9割は解決する」とおっしゃった。QC七つ道具は簡単に作れて、情報の読み取りも簡単になるよう工夫されている。","https://www.keyence.co.jp/ss/general/manufacture-tips/7qc-tools.jsp","QC7つ道具ってどう使うの？品質改善の基礎（キーエンス）",["2割から3割では少なすぎる。QC七つ道具だけで問題の大部分が解決するとされている。","5割ではなく、QC七つ道具を使うだけで問題の8割から9割は解決するとされている。","すべての問題が解決するとはされておらず、残りには他の手法が必要である。"],"https://www.youtube.com/watch?v=0lTFNjeW4uo","簡単 分かり易い QC七つ道具とは【音声解説付き】",""],["テキストで紹介しているQC七つ道具の組合せは？","チェックシート、パレート図、ヒストグラム、管理図、特性要因図、散布図、層別","親和図、連関図、系統図、マトリックス図、PDPC、アロー・ダイアグラム、散布図","チェックシート、パレート図、PERT、管理図、特性要因図、散布図、層別","フローチャート、パレート図、ヒストグラム、管理図、親和図、散布図、層別","テキストでは、チェックシート、パレート図、ヒストグラム、管理図（グラフ）、特性要因図、散布図、層別の7つをQC七つ道具としている。管理図とグラフをひとつにまとめ、層別を道具の一つとして紹介している。","https://www.keyence.co.jp/ss/general/manufacture-tips/7qc-tools.jsp","QC7つ道具ってどう使うの？品質改善の基礎（キーエンス）",["親和図・連関図・系統図・マトリックス図・PDPC・アロー・ダイアグラムは新QC七つ道具の手法である。","PERTは日程計画の手法であり、QC七つ道具ではヒストグラムが入る。","フローチャートと親和図はQC七つ道具に含まれず、チェックシートと特性要因図が入る。"],"https://www.youtube.com/watch?v=0lTFNjeW4uo","簡単 分かり易い QC七つ道具とは【音声解説付き】","",["x:qc_150","QC七つ道具の一覧"]],["QC七つ道具のうち、それ自体は道具ではなく「考え方」であり、単独では書けないものは？","層別","散布図","管理図","チェックシート","層別は考え方であって道具ではなく、単独では書けない。ヒストグラムを何かで分ける、管理図を何かで分けるというように、他の道具と組み合わせて力が発揮される。そのため層別を外してグラフを7つ目にする考え方もある。","https://www.keyence.co.jp/ss/general/manufacture-tips/7qc-tools.jsp","QC7つ道具ってどう使うの？品質改善の基礎（キーエンス）",["散布図は二つの特性を縦横にとって打点するグラフで、単独で書ける道具である。","管理図は管理限界線を持つ折れ線グラフで、単独で書ける道具である。","チェックシートは点検やデータの記入に使うシートで、単独で作れる道具である。"],"https://www.youtube.com/watch?v=0lTFNjeW4uo","簡単 分かり易い QC七つ道具とは【音声解説付き】",""],["QC的考え方と道具の対応で、「重点指向」に役立つ道具は？","パレート図","チェックシート","ヒストグラム","散布図","QC的考え方と道具の対応は、事実で判断→チェックシート、重点指向→パレート図、ばらつきを尺度とする→ヒストグラム・管理図、因果関係→特性要因図・散布図・層別。パレート図は重要な問題を選ぶのに役立つ。","https://www.keyence.co.jp/ss/general/manufacture-tips/7qc-tools.jsp","QC7つ道具ってどう使うの？品質改善の基礎（キーエンス）",["チェックシートは事実を記録する道具で、「事実で判断」に役立つ道具である。","ヒストグラムは分布やばらつきを見る道具で、「ばらつきを尺度とする」に対応する。","散布図は二つの特性の関係を見る道具で、「因果関係」に対応する。"],"https://www.youtube.com/watch?v=0lTFNjeW4uo","簡単 分かり易い QC七つ道具とは【音声解説付き】","",["x:qc_152","QC的考え方とQC七つ道具の対応"]],["QC的考え方と道具の対応で、「ばらつきを尺度とする」に役立つ道具は？","ヒストグラム・管理図","パレート図","チェックシート","特性要因図","ばらつきを尺度とする（違い・差に注目する）ときに役立つのは、ヒストグラムと管理図。ヒストグラムで分布の形やばらつきの大きさを、管理図で時間的なばらつきの変化を見る。","https://www.keyence.co.jp/ss/general/manufacture-tips/7qc-tools.jsp","QC7つ道具ってどう使うの？品質改善の基礎（キーエンス）",["パレート図は重要な問題を選ぶ道具で、「重点指向」に対応する。","チェックシートは事実を記録する道具で、「事実で判断」に対応する。","特性要因図は結果と原因の関係を整理する道具で、「因果関係」に対応する。"],"https://www.youtube.com/watch?v=0lTFNjeW4uo","簡単 分かり易い QC七つ道具とは【音声解説付き】","",["x:qc_152","QC的考え方とQC七つ道具の対応"]],["チェックシートの「チェック」の本来の意味は？","防ぐ、妨害する","確かめる","印を付ける","数える","チェックシートのチェックは「防ぐ、妨害する」という意味で、シートは紙。直訳すると「妨害用紙」になる。元々は点検漏れ・確認漏れを防ぐ（妨害する）ためのシートだった。","https://kaizen-base.com/column/41832","チェックシートの種類と使い方（カイゼンベース）",["「確かめる」は現在の一般的な意味であり、チェックシートの本来の意味ではない。","印を付けることはチェックシートの使い方であり、チェックの本来の意味ではない。","数えることは記録用チェックシートの用途の一つで、チェックの本来の意味ではない。"],"https://www.youtube.com/watch?v=0xRFUXh6FCA","『QC七つ道具』より『チェックシート』紹介動画","",["w:132_0","不良項目ごとに画線で記録するチェックシートの例",{"a":"DanielPenfield","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Check_sheet_for_motor_assembly.svg"}]],["チェックシートの2種類の組合せは？","点検用チェックシート、記録用チェックシート","管理用チェックシート、解析用チェックシート","日常用チェックシート、方針用チェックシート","設計用チェックシート、製造用チェックシート","チェックシートには、点検漏れを防ぐためにあらかじめ点検項目を記入した点検用チェックシートと、データの記入を容易にするように項目を記入した記録用チェックシートがある。記録用はデータシートといった方が正しいかもしれない。","https://kaizen-base.com/column/41832","チェックシートの種類と使い方（カイゼンベース）",["管理用・解析用という分類は管理図の種類に用いられるもので、チェックシートの2種類ではない。","日常用・方針用という分類はチェックシートの種類としては用いられない。","設計用・製造用という分類はチェックシートの2種類として挙げられていない。"],"https://www.youtube.com/watch?v=0xRFUXh6FCA","『QC七つ道具』より『チェックシート』紹介動画","",["x:qc_155","点検用チェックシートと記録用チェックシート"]],["JIS Z 8101 で「項目別に層別して、出現度数の大きさの順に並べるとともに、累積和を示した図」は？","パレート図","ヒストグラム","管理図","散布図","パレート図は、JIS Z 8101で「項目別に層別して、出現度数の大きさの順に並べるとともに、累積和を示した図」と定義される。横軸に不良項目、縦軸に不良個数をとり、柱の高い順に並べる（「その他」は最後）。重点指向で作成され、柱の高いものから手を打つ。","https://kaizen-base.com/column/41700","パレート図の正しい使い方（カイゼンベース）",["ヒストグラムは測定値の区間ごとの出現度数を柱で表した図で、累積和は示さない。","管理図は管理限界線を持つ折れ線グラフで、工程の安定状態を判断する図である。","散布図は二つの特性を縦横にとって打点した図で、項目別の度数を並べるものではない。"],"https://www.youtube.com/watch?v=z2bZOgnc2NM","【QC7つ道具】パレート図の作り方と見方を分かりやすく解説","",["x:qc_156","パレート図（不良個数の柱と累積比率の曲線）"]],["パレート図の累積比率を表す曲線を何というか？","ローレンツ曲線","S-N曲線","OC曲線","正規分布曲線","パレート図の累積比率の折れ線をローレンツ曲線という。アメリカの学者ローレンツが、パレートと同じようなことを考えて、このような曲線で表現した。累積比率から「上位2項目で約7割」などを読み取る。","https://kaizen-base.com/column/41700","パレート図の正しい使い方（カイゼンベース）",["S-N曲線は材料に加える応力と破断までの繰返し数の関係を表す疲労試験の曲線である。","OC曲線は抜取検査で、ロットの不良率と合格する確率の関係を表す曲線である。","正規分布曲線は左右対称の釣鐘型の確率分布を表す曲線で、累積比率の折れ線ではない。"],"https://www.youtube.com/watch?v=z2bZOgnc2NM","【QC7つ道具】パレート図の作り方と見方を分かりやすく解説","",["x:qc_156","パレート図（不良個数の柱と累積比率の曲線）"]],["パレート図のもとになったパレートの原則を考えたのは、どこの国の経済学者か？","イタリア","アメリカ","日本","ドイツ","パレートの原則は、イタリアの経済学者パレートが考えたもの。少数の項目が全体の大部分を占めるという考え方で、パレート図のもとになっている。","https://kaizen-base.com/column/41700","パレート図の正しい使い方（カイゼンベース）",["アメリカは累積比率の曲線を考えた学者ローレンツの国で、パレートの国ではない。","日本はQC七つ道具を広めた石川馨先生の国であり、パレートの国ではない。","ドイツはパレートの国ではない。パレートはイタリアの経済学者である。"],"https://www.youtube.com/watch?v=z2bZOgnc2NM","【QC7つ道具】パレート図の作り方と見方を分かりやすく解説","",["w:089_3","不良項目を件数順に並べ累積比率を描いたパレート図",{"a":"DanielPenfield","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Pareto_chart_of_titanium_investment_casting_defects.svg"}]],["ヒストグラムの「ヒスト」の意味は？","柱状","分布","度数","区間","ヒストグラムの「ヒスト」は柱状、「グラム」は図という意味で、ヒストグラムは柱状図のこと。棒グラフとはちょっと違う。","https://kaizen-base.com/column/41852","ヒストグラムを製造現場で活用する方法（カイゼンベース）",["分布はヒストグラムで読み取る内容であり、「ヒスト」の語の意味ではない。","度数は柱の高さ（面積）で表す量であり、「ヒスト」の語の意味ではない。","区間は柱の底辺にあたるものであり、「ヒスト」の語の意味ではない。"],"https://www.youtube.com/watch?v=Z0gfKf815VM","QC7つ道具：ヒストグラム－事実を捉えて品質をつくりこむために","",["w:159_1","測定値の区間ごとの度数を柱で表したヒストグラム",{"a":"Geek3","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Matplotlib3_histogram.svg"}]],["JIS Z 8101 による、ヒストグラムの定義は？","測定値の存在する範囲をいくつかの区間に分け、各区間を底辺とし、その区間に属する測定値の出現度数に比例する面積をもつ柱を並べた図","項目別に出現度数の大きい順に並べ累積和を示した図","二つの特性を縦横にとり打点した図","管理限界線を持つ折れ線グラフ","ヒストグラムのJISの定義は「測定値の存在する範囲をいくつかの区間に分け、各区間を底辺とし、その区間に属する測定値の出現度数に比例する面積を持つ柱を並べた図」。計量値のデータについて書く。","https://kaizen-base.com/column/41852","ヒストグラムを製造現場で活用する方法（カイゼンベース）",["項目別に度数の大きい順に並べ累積和を示した図はパレート図の定義である。","二つの特性を縦横にとり打点した図は散布図である。","管理限界線を持つ折れ線グラフは管理図である。"],"https://www.youtube.com/watch?v=Z0gfKf815VM","QC7つ道具：ヒストグラム－事実を捉えて品質をつくりこむために","",["w:159_1","区間ごとの出現度数を柱の面積で示すヒストグラム",{"a":"Geek3","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Matplotlib3_histogram.svg"}]],["ヒストグラムで、真ん中が高く左右対称の分布の形を何というか？","一般型（正規分布型）","二山型","絶壁型","離れ小島型","真ん中が高く左右対称の分布の形を、一般型あるいは正規分布型という。特に問題のない工程や、身長・体重などはこのような形になる。平均値の位置は規格の中心にあることが望ましく、ずれると不良が出てしまう。","https://kaizen-base.com/column/41852","ヒストグラムを製造現場で活用する方法（カイゼンベース）",["二山型は平均値の異なる二つの分布が混ざったときに現れる形で、層別が必要となる。","絶壁型は規格外品を全数選別して取り除いたときなどに現れる、片側が切れた形である。","離れ小島型は異なる分布のデータが少し混入したときに現れる、離れた所に柱がある形である。"],"https://www.youtube.com/watch?v=Z0gfKf815VM","QC7つ道具：ヒストグラム－事実を捉えて品質をつくりこむために","",["x:qc_161","ヒストグラムの定義と規格値・平均値の読み取り"]],["ヒストグラムから読み取れるものの組合せは？","分布の形、平均値の位置、ばらつきの大きさ、不良の出方","工程が安定状態かどうか","不良項目の累積比率","2つの特性の相関","ヒストグラムからは、分布の形、平均値の位置、ばらつきの大きさ、不良の出方などを読み取る。特性値が規格に対してどのような状態にあるか（「上側下側から不良が出ている」など）が分かる。","https://kaizen-base.com/column/41852","ヒストグラムを製造現場で活用する方法（カイゼンベース）",["工程が安定状態かどうかは管理図から読み取るもので、ヒストグラムでは時間的変化が分からない。","不良項目の累積比率はパレート図から読み取るものである。","2つの特性の相関は散布図から読み取るものである。"],"https://www.youtube.com/watch?v=Z0gfKf815VM","QC7つ道具：ヒストグラム－事実を捉えて品質をつくりこむために","",["x:qc_161","ヒストグラムの定義と規格値・平均値の読み取り"]],["管理図とは何か？","工程が安定状態であるかどうかを判断する一対の管理限界線を持つ折れ線グラフ","規格に対する特性値の状態を表す柱状図","不良項目を大きい順に並べた図","結果と原因の関係を系統的に表した図","管理図は、工程が安定状態であるかどうかを判断する一対の管理限界線を持つ折れ線グラフ。横軸は時間、縦軸は管理特性（寸法・重量・不良品など）。管理図は製品ではなく工程に対して書かれる。","https://kaizen-base.com/column/41877/","管理図を現場で活用する方法・3σの見方（カイゼンベース）",["規格に対する特性値の状態を表す柱状図はヒストグラムである。","不良項目を大きい順に並べた図はパレート図である。","結果と原因の関係を系統的に表した図は特性要因図である。"],"https://www.youtube.com/watch?v=k3YuFpnAxfw","【講義解説】QC7つ道具 管理図・基礎編（QC検定3級レベル）","",["x:qc_163","管理図（UCL・CL・LCLと安定状態の判断）"]],["管理図で、中心線（CL）の上下に引かれる線をそれぞれ何というか？","上部管理限界（UCL）、下部管理限界（LCL）","上限規格値、下限規格値","最大値、最小値","累積比率、度数","管理図には平均を表す中心線（CL）があり、その上下に上部管理限界（UCL：Upper Control Limit）と下部管理限界（LCL：Lower Control Limit）という一対の管理限界線が描かれる。","https://kaizen-base.com/column/41877/","管理図を現場で活用する方法・3σの見方（カイゼンベース）",["上限・下限規格値は製品の良否を判断する値で、ヒストグラムに書かれるものである。","最大値・最小値はデータの範囲を求める値で、管理図の上下の線ではない。","累積比率と度数はパレート図で用いるもので、管理図の線ではない。"],"https://www.youtube.com/watch?v=k3YuFpnAxfw","【講義解説】QC7つ道具 管理図・基礎編（QC検定3級レベル）",""],["管理図で、工程が安定状態と判断できる条件は？","点が管理限界線内にあり、点の並び方にくせがない","点が規格値内にある","点がすべて中心線上にある","点が管理限界外に1点だけある","すべての点が管理限界線の中にあり、点の並びにくせがなければ工程は安定している。管理限界外（管理外れ）の点や並び方のくせがあれば安定状態ではなく、見逃してはいけない原因があったということなので、その原因に処置を打って安定状態に保つ。","https://kaizen-base.com/column/41877/","管理図を現場で活用する方法・3σの見方（カイゼンベース）",["規格値は製品の良否を判断するもので、工程の安定は管理限界線で判断する。","点はばらつくのが普通で、すべてが中心線上にある必要はない。","管理限界外の点が1点でもあれば管理外れで、工程は安定状態とはいえない。"],"https://www.youtube.com/watch?v=k3YuFpnAxfw","【講義解説】QC7つ道具 管理図・基礎編（QC検定3級レベル）","",["x:qc_163","管理図（UCL・CL・LCLと安定状態の判断）"]],["規格と管理限界は、それぞれ何について書かれるか？","規格＝製品について（ヒストグラム）、管理限界＝工程について（管理図）","規格＝工程について、管理限界＝製品について","どちらも製品について","どちらも工程について","規格はヒストグラムに書かれ、製品について（良品か不良品か）を表す。管理限界は管理図に書かれ、工程について（安定か異常か）を表す。卵の例えでは、ヒストグラムは卵の重量（卵が良いか）、管理図は鶏が健康かどうかを見る。","https://kaizen-base.com/column/41877/","管理図を現場で活用する方法・3σの見方（カイゼンベース）",["対応が逆である。規格は製品の良否、管理限界は工程の安定・異常について書かれる。","管理限界は工程の安定・異常を表すもので、どちらも製品についてとするのは誤り。","規格は製品の良品・不良品を表すもので、どちらも工程についてとするのは誤り。"],"https://www.youtube.com/watch?v=k3YuFpnAxfw","【講義解説】QC7つ道具 管理図・基礎編（QC検定3級レベル）","",["x:qc_166","ヒストグラム（良否）と管理図（安定・異常）の組合せ"]],["ヒストグラム（製品の良否）と管理図（工程の安定・異常）の組合せで、最も目指すべき状態は？","良品 × 安定","不良 × 安定","良品 × 異常","不良 × 異常","目指すのは「良品×安定」の◎で、良品を安定して生産できる状態。「不良×安定」は不良品を安定して作っている状態、「良品×異常」は良品ができること自体が異常な状態で、どちらも×。「不良×異常」の××が最も悪い状態。","https://kaizen-base.com/column/41877/","管理図を現場で活用する方法・3σの見方（カイゼンベース）",["不良×安定は不良品を安定して作り続けている状態で、目指すべき状態ではない。","良品×異常は良品ができていること自体が異常な状態で、目指すべき状態ではない。","不良×異常は製品も工程も悪い××の状態で、最も避けるべき状態である。"],"https://www.youtube.com/watch?v=k3YuFpnAxfw","【講義解説】QC7つ道具 管理図・基礎編（QC検定3級レベル）","",["x:qc_166","ヒストグラム（良否）と管理図（安定・異常）の組合せ"]],["特定の結果と原因系との関係を系統的に表した図は？","特性要因図","パレート図","散布図","連関図","特性要因図は、特定の結果（特性）と原因系との関係を系統的に表した図。特性と要因との関連を漏れなく表すので、それぞれの関係の整理や、重要な原因に対策を打つのに役立つ。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["パレート図は不良項目などを度数の大きい順に並べ、累積和を示した図である。","散布図は二つの特性の関係を打点して表すグラフで、原因系を系統的に表すものではない。","連関図は新QC七つ道具の一つで、原因と結果が複雑に絡む関係を矢印でつないで整理する図である。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理","",["x:qc_168","特性要因図（魚の骨図）の構造"]],["特性要因図の別名として正しいものは？","魚の骨図、Ishikawa diagram","木の枝図、Pareto chart","蜘蛛の巣図、Lorenz curve","山型図、Histogram","特性要因図は見た目が魚の骨に似ているため「魚の骨図」とも呼ばれる。また、考え出したのが石川馨先生なので、Ishikawa diagramともいわれている。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["Pareto chartはパレート図のことで、特性要因図の別名ではない。","Lorenz curveはパレート図の累積比率を表すローレンツ曲線のことである。","Histogramは柱状図のことで、特性要因図の別名ではない。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理","",["x:qc_168","特性要因図（魚の骨図）の構造"]],["石川馨先生が特性要因図を作り出したきっかけは？","エンジニアたちの話が脈絡なき事実の羅列だったので怒って作った","パレート図の欠点を補うため","ISO規格に合わせるため","コンピュータで解析するため","石川馨先生がある会社でエンジニアに対して問題解決を行っていた際、エンジニアたちの話が脈絡なき事実の羅列だったため、「脈絡を示しなさい。何がどうしてどうなったというように説明しなさい」と怒りながら作り出したのが特性要因図。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["特性要因図はパレート図の欠点を補うために作られたものではない。","特性要因図はISO規格に合わせるために作られたものではない。","特性要因図は手書きで要因を整理する道具で、コンピュータ解析のために作られたものではない。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理","",["w:063_0","結果（問題）と原因を大骨・小骨で整理した特性要因図",{"a":"FabianLange at de.wikipedia","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Ishikawa_Fishbone_Diagram.svg"}]],["特性要因図の作り方として、テキストが勧めるものは？","なるべく多くの人に参加してもらい、ブレインストーミング法で発想する","一人で静かに作る","上司だけで作る","過去の図をそのまま使う","特性要因図は一人で作るのではあまり意味がない。要因を挙げるときは、なるべく多くの人に参加してもらい、ブレインストーミング法で発想する。発言は質より量、他人の意見を批判しない、他人の尻馬に乗る（アイデアに乗っかる）のがルール。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["一人で作ると要因が偏りやすく、特性要因図としてはあまり意味がない。","上司だけでは現場の知恵が集まらず、多くの人の参加による発想が必要である。","過去の図をそのまま使うと、現在の特性に対する要因を漏れなく挙げられない。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理",""],["要因の4M（人・機械設備・原材料・方法）の英語の組合せは？","Man、Machine、Material、Method","Man、Money、Material、Management","Machine、Measurement、Method、Morale","Man、Machine、Market、Method","要因の4MはMan（人）、Machine（機械・設備）、Material（原材料）、Method（方法）。それぞれ「人によって」「機械・設備によって」「原材料によって」「方法によって」結果が異なるか、という観点で要因を考える。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["Money（お金）とManagement（管理）は4Mの要因に含まれない。","Measurement（測定）は5METで加わる要因、Morale（志気）はQCDPSMEのMである。","Market（市場）は4Mの要因に含まれない。正しくはMaterial（原材料）である。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理","",["x:qc_172","特性要因図の要因（4M・5MET）"]],["5METのうち、原因だと分かってもなかなか手が打てないため、4Mで考えるのが良いとされる要因は？","環境・時間","人・機械","原材料・方法","測定・方法","4MにMeasurement（測定）、Environment（環境）、Time（時間）を加えて、Mが5つとEとTで5METともいう。ただし環境・時間は原因だと分かってもなかなか手が打てないので、4Mで考えるのが良いとされる。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["人・機械は4Mに含まれる要因で、原因と分かれば手を打ちやすい。","原材料・方法は4Mに含まれる要因で、原因と分かれば手を打てる。","測定は5METで加わるMで手を打てる要因であり、方法も4Mの要因なので当てはまらない。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理",""],["特性要因図は何の集まりであり、そのため何が必要か？","仮説の集まりなので、検証が必要","事実の集まりなので、検証は不要","結論の集まりなので、標準化が必要","データの集まりなので、計算が必要","特性要因図は仮説の集まり。「これはきっと原因だろう」と断定できるほどのものではないので、データなどで検証が必要になる。検証道具の一つが散布図。","https://kaizen-base.com/column/32060","特性要因図（魚の骨）とは？作成方法（カイゼンベース）",["特性要因図は事実ではなく仮説の集まりであり、検証が必要である。","特性要因図は結論ではなく仮説の集まりで、標準化の前に検証が必要である。","特性要因図は言葉で要因を表した図で、データの集まりではない。"],"https://www.youtube.com/watch?v=cq2Qn-nQdCc","【品質管理 特性要因図①】事例で作り方を解説！4Mによる情報整理","",["w:063_0","要因の仮説を系統的に並べた特性要因図",{"a":"FabianLange at de.wikipedia","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Ishikawa_Fishbone_Diagram.svg"}]],["二つの特性を横軸と縦軸にとり、測定値を打点して作るグラフは？","散布図","管理図","ヒストグラム","パレート図","散布図は、二つの特性を横軸と縦軸にとり、測定値を打点して作るグラフ。例えばペットボトルに水を詰める作業で、充填時間と充填量を打点すると、充填時間が長くなると充填量が増えるという関係が分かる。","https://kaizen-base.com/column/32240","散布図とは？相関の考え方と作り方（カイゼンベース）",["管理図は時間を横軸にとり、工程の安定状態を判断する折れ線グラフである。","ヒストグラムは一つの特性の分布を柱で表す図で、二つの特性の関係は表さない。","パレート図は項目別の度数を大きい順に並べた図で、二つの特性を打点するものではない。"],"https://www.youtube.com/watch?v=a7aqQ36BD7A","品質管理(QC)検定3級合格講座！QC七つ道具 散布図","",["x:qc_175","散布図（充填時間と充填量）"]],["散布図から読み取ることの組合せは？","点の並び方の傾向、直線的傾向か、グループ分けの必要性、外れ値","累積比率、項目の並び","分布の形、規格との関係","管理限界外の点","散布図では、点の並び方に傾向があるか（右肩上がり・右肩下がり・傾向なし）、直線的に変化しているか、グループ分けの必要性はないか、外れ値はあるか、などを読み取る。","https://kaizen-base.com/column/32240","散布図とは？相関の考え方と作り方（カイゼンベース）",["累積比率と項目の並びはパレート図から読み取る内容である。","分布の形と規格との関係はヒストグラムから読み取る内容である。","管理限界外の点は管理図で工程の異常を判断するときに読み取る内容である。"],"https://www.youtube.com/watch?v=a7aqQ36BD7A","品質管理(QC)検定3級合格講座！QC七つ道具 散布図","",["x:qc_175","散布図（充填時間と充填量）"]],["JIS Z 8101 による層別の説明として正しいものは？","母集団をいくつかの層に分けること。層内はできるだけ均一に、層間の差は大きくなるようにすると有利","母集団を一つにまとめること","層内の差を大きく、層間を均一にすること","データを時系列に並べること","層別は、JIS Z 8101で「母集団をいくつかの層に分けること。層別は、層内ができるだけ均一になるように、層間の差が大きくなるように行うと有利である」とされる。TQC用語辞典では、機械別・作業方法別・原材料別・作業者別などの共通点や特徴に着目してグループ（層）に分けること。","https://kaizen-base.com/column/41530","QC7つ道具の使い方・目的から作り方まで（カイゼンベース）",["層別は母集団をいくつかの層に分けることで、一つにまとめることではない。","説明が逆である。層内はできるだけ均一に、層間の差は大きくなるように分けると有利である。","データを時系列に並べるのは管理図などで時間的変化を見る方法で、層別の説明ではない。"],"https://www.youtube.com/watch?v=fBUYeZfsr48","ヒストグラムの作り方と層別の使い方","",["x:qc_177","層別の定義（JIS・TQC用語辞典）"]],["層別について、日本語の漢字を使ったテキストの表現は？","分けると分かる","比べると学べる","集めると見える","並べると気づく","日本語では「分ける」と「分かる」に同じ漢字を用いる。すなわち「分けると分かる」。層を比較することで問題解決の手がかりが見つかるので、道具を作ったときは必ず「層別するとどうなるだろうか」という見当も加える。","https://kaizen-base.com/column/41530","QC7つ道具の使い方・目的から作り方まで（カイゼンベース）",["比べると学べるは、層別を漢字で表す表現として用いられていない。","集めると見えるは、分けることで違いが分かる層別の考え方とは逆の表現である。","並べると気づくは、層別を表す表現として用いられていない。"],"https://www.youtube.com/watch?v=fBUYeZfsr48","ヒストグラムの作り方と層別の使い方",""],["新QC七つ道具は、主に何をする手法か？","主に課題達成について言語情報を整理し、知恵を出す手法","主に問題解決について数値データを解析する手法","工程の安定を判断する手法","在庫を管理する手法","新QC七つ道具は、主に言語データを図に整理する方法として開発された。数値データとして表現しにくい言語・知恵・知識をまとめるための道具で、主に課題達成について言語情報を整理し知恵を出す手法。問題解決型にはQC七つ道具、課題達成型には新QC七つ道具が良い。","https://www.keyence.co.jp/ss/general/manufacture-tips/new-7qc-tools.jsp","言語データを使う「新QC7つ道具」とは（キーエンス）",["主に問題解決について数値データを解析するのはQC七つ道具である。","工程が安定状態かを判断するのは管理図である。","在庫の管理にはABC分析などの手法が用いられ、新QC七つ道具の主な目的ではない。"],"https://www.youtube.com/watch?v=J6Oh1Kd7a0s","新QC7つ道具とは【アニメで学ぶ新QC7つ道具】","",["x:qc_179","新QC七つ道具と課題達成の手順の対応"]],["新QC七つ道具のうち、唯一数値データを扱う手法は？","マトリックス・データ解析法","親和図法","連関図法","PDPC法","新QC七つ道具は、親和図法、連関図法、系統図法、マトリックス図法、マトリックス・データ解析法、アロー・ダイアグラム法、PDPC法。このうちマトリックス・データ解析法だけが数値データを扱い、他は主に言語情報を整理する。","https://www.keyence.co.jp/ss/general/manufacture-tips/new-7qc-tools.jsp","言語データを使う「新QC7つ道具」とは（キーエンス）",["親和図法は混沌とした言語データを親和性で整理する手法で、数値データは扱わない。","連関図法は原因と結果の複雑な関係を言語データで整理する手法である。","PDPC法は起こりうる事態を予測し対策を準備する手法で、言語情報を扱う。"],"https://www.youtube.com/watch?v=J6Oh1Kd7a0s","新QC7つ道具とは【アニメで学ぶ新QC7つ道具】","",["w:182_1","散布図上で主成分の方向を矢印で示した主成分分析",{"a":"Nicoguaro","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:GaussianScatterPCA.svg"}]],["課題達成の手順「課題の構築」に役立つ新QC七つ道具は？","親和図法、連関図法","系統図法、マトリックス図法","アロー・ダイアグラム法、PDPC法","マトリックス・データ解析法、系統図法","課題達成の手順は、課題の構築→手段の展開と選択→実行計画の作成。課題の構築には親和図法と連関図法が役立つ。手段の展開と選択には系統図法・マトリックス図法・マトリックス・データ解析法を使う。","https://www.keyence.co.jp/ss/general/manufacture-tips/new-7qc-tools.jsp","言語データを使う「新QC7つ道具」とは（キーエンス）",["系統図法とマトリックス図法は、手段の展開と選択に役立つ手法である。","アロー・ダイアグラム法とPDPC法は、実行計画の作成に役立つ手法である。","マトリックス・データ解析法と系統図法は、手段の展開と選択で使う手法である。"],"https://www.youtube.com/watch?v=J6Oh1Kd7a0s","新QC7つ道具とは【アニメで学ぶ新QC7つ道具】","",["x:qc_179","新QC七つ道具と課題達成の手順の対応"]],["課題達成の手順「実行計画の作成」に役立つ新QC七つ道具は？","アロー・ダイアグラム法、PDPC法","親和図法、連関図法","系統図法、マトリックス図法","マトリックス・データ解析法","実行計画の作成には、作業の順序と日程を表すアロー・ダイアグラム法と、起こりうる事態を予測して対策を準備するPDPC法（過程決定計画図）が役立つ。","https://www.keyence.co.jp/ss/general/manufacture-tips/new-7qc-tools.jsp","言語データを使う「新QC7つ道具」とは（キーエンス）",["親和図法と連関図法は、課題達成の最初の手順である課題の構築に役立つ手法である。","系統図法とマトリックス図法は、手段の展開と選択に役立つ手法である。","マトリックス・データ解析法は数値データを扱う手法で、手段の展開と選択で使われる。"],"https://www.youtube.com/watch?v=J6Oh1Kd7a0s","新QC7つ道具とは【アニメで学ぶ新QC7つ道具】","",["x:qc_179","新QC七つ道具と課題達成の手順の対応"]]]},{"id":"figmech","title":"図・計算問題（機械）","cat":"図・計算","q":[["図のように断面積A＝40［mm²］の丸棒を，F＝8［kN］の力で引っ張った。断面a－aに生じる垂直応力σは？","200［MPa］","0.2［MPa］","320［MPa］","5［MPa］","垂直応力は単位面積当たりの力でσ＝F/Aです。F＝8［kN］＝8000［N］なので，σ＝8000÷40＝200［N/mm²］。［N/mm²］＝［MPa］なので200［MPa］となります。","","",["F＝8［kN］を［N］に直さず8÷40と計算した値です。kとNの換算忘れです。","F×A÷1000と，割るべきところを掛けてしまった値です。応力は力を面積で割ります。","A÷F＝40÷8と分母分子を逆にした値です。応力はF/Aです。"],"","","q:figmech_1",["x:figmech_1","垂直応力σ=F/Aの計算（kN→Nの換算）"]],["図の引張り試験で，元の長さL₀＝200［mm］の試験片が引張り後にL＝203［mm］になった。ひずみは何［%］か？","1.5［%］","1.48［%］","3［%］","0.015［%］","ひずみ＝(L－L₀)/L₀×100［%］です。伸びはL－L₀＝203－200＝3［mm］なので，ひずみ＝3÷200×100＝1.5［%］となります。ひずみは無次元量で，元の長さL₀で割る点に注意します。","","",["伸び3［mm］を引張り後の長さL＝203で割った値です。分母は元の長さL₀です。","伸び3［mm］をそのままひずみとした値です。元の長さで割っていません。","3÷200＝0.015を求めたあと，×100を忘れて［%］を付けた値です。"],"","","q:figmech_2",["x:figmech_2","伸びΔLを元の長さL₀で割るひずみの計算"]],["図(a)のばね（ばね定数k＝2［N/mm］）に，F＝30［N］の力を加えた。ばねの伸びxは？","15［mm］","60［mm］","0.067［mm］","30［mm］","フックの法則F＝kxより，x＝F/k＝30÷2＝15［mm］となります。力を2倍にすれば伸びも2倍になるという比例関係で，比例定数kをばね定数といい，強いばねほどkは大きくなります。","","",["F×k＝30×2と掛けてしまった値です。伸びは力をばね定数で割ります。","k÷F＝2÷30と逆に割った値です。x＝F/kが正しい式です。","力の数値30をそのまま伸びとした値で，ばね定数を考慮していません。"],"","","q:figmech_3"],["ポアソン比ν＝0.3の丸棒を引っ張ったところ，縦ひずみε＝0.002が生じた。横ひずみε_dの大きさは？","0.0006","0.0067","0.0014","0.0026","ポアソン比は横ひずみ÷縦ひずみ（ν＝ε_d/ε）です。したがってε_d＝ν×ε＝0.3×0.002＝0.0006となります。鋼のポアソン比は約0.3で，横ひずみは縦ひずみより小さくなります。","","",["ε÷ν＝0.002÷0.3と，ポアソン比の定義を逆にして割った値です。","ε×(1－ν)と，縦ひずみから差し引いた値です。ポアソン比は比で掛けて使います。","ε×(1＋ν)の値です。縦ひずみに横ひずみを足し合わせてしまっています。"],"","","",["x:figmech_4","縦に伸び横に縮む変形とポアソン比の計算"]],["図のように，長さlの単純支持ばりの中央（l/2の位置）に荷重W＝600［N］が加わっている。支点Bの反力R_Bは？","300［N］","600［N］","1200［N］","150［N］","力のつり合いW－R_A－R_B＝0と，点A回りのモーメントのつり合い－(l/2)W＋R_B・l＝0から，R_B＝W/2＝300［N］です。荷重が中央なので左右の支点に半分ずつ分かれ，R_A＝R_B＝300［N］となります。","","",["荷重Wをすべて一方の支点が受けるとした値です。2つの支点で分担します。","Wを2倍した値です。モーメントのつり合いでl/2とlの比を逆にしています。","W/4とした値です。荷重を半分にしたあと，さらに半分にしてしまっています。"],"","","q:figmech_5",["x:figmech_5","中央荷重の単純支持ばりの反力とモーメントのつり合い"]],["図の片持ちばりで，自由端に集中荷重W＝200［N］，はりの長さl＝1.5［m］のとき，最大曲げモーメントの大きさは？","300［N·m］","133［N·m］","150［N·m］","200［N·m］","自由端からxの位置の曲げモーメントはM＝－Wxで，xに比例して大きくなり，固定端（x＝l）で最大になります。大きさはM_max＝Wl＝200×1.5＝300［N·m］です。","","",["W÷l＝200÷1.5と割ってしまった値です。モーメントは力×距離です。","Wl/2の値です。中央の位置x＝l/2での曲げモーメントで，最大値ではありません。","荷重Wの数値をそのまま答えた値です。せん断力の大きさ（S＝－W）と混同しています。"],"","","q:figmech_6",["x:figmech_6","片持ちばりの曲げモーメント図（固定端で最大）"]],["図のマノメータで，P₁－P₂＝ρ₃gh₃とする。液柱が水銀（ρ₃＝13600［kg/m³］），h₃＝50［mm］，g＝9.8［m/s²］のとき，圧力差P₁－P₂は約何［kPa］か？","6.66［kPa］","6664［kPa］","0.49［kPa］","0.68［kPa］","h₃＝50［mm］＝0.05［m］に直して，P₁－P₂＝ρ₃gh₃＝13600×9.8×0.05＝6664［Pa］≒6.66［kPa］です。マノメータは左右の圧力差が液柱の高さの差に対応することを利用した液柱圧力計です。","","",["h₃を［m］に直さず50のまま計算した値です。mmとmの換算忘れで1000倍になります。","水銀ではなく水の密度1000［kg/m³］で計算した値です。","重力加速度gを掛け忘れた値（ρ₃h₃＝680）です。圧力はρghです。"],"","","q:figmech_7"],["体積2.0×10⁻³［m³］の物体を水（密度1000［kg/m³］）に完全に沈めた。物体が受ける浮力は？（g＝9.8［m/s²］）","19.6［N］","2.0［N］","1.96×10⁴［N］","0.196［N］","アルキメデスの原理により，浮力は物体が排除した流体の重力に等しくなります。排除した水の質量は1000×2.0×10⁻³＝2.0［kg］なので，浮力＝2.0×9.8＝19.6［N］です。","","",["排除した水の質量2.0［kg］をそのまま力の値とした値です。gを掛け忘れています。","体積を2.0［m³］として計算した値です。10⁻³の指数を見落としています。","桁を1つ取り違えた値です。密度を100［kg/m³］としたのと同じ計算になります。"],"","",""],["図の流管で，断面1の断面積S₁＝0.02［m²］，流速u₁＝2［m/s］，断面2の断面積S₂＝0.005［m²］である。非圧縮性流体のとき断面2の流速u₂は？","8［m/s］","0.5［m/s］","2［m/s］","32［m/s］","連続の式S₁u₁＝S₂u₂（密度一定）より，u₂＝S₁u₁/S₂＝0.02×2÷0.005＝8［m/s］です。流速と断面積は逆比例するので，断面積が1/4になれば流速は4倍になります。","","",["面積比を逆にしてS₂/S₁を掛けた値です。断面が細くなると流速は速くなります。","流速は流管のどこでも同じと考えた値です。断面積が変われば流速も変わります。","面積比4を2乗して掛けた値です。直径比と面積比を混同しています。"],"","","q:figmech_9",["x:figmech_9","連続の式：流量一定で断面積1/4なら流速4倍"]],["図のように大気に開放された容器の側面の孔から水が流出している。孔から水面までの高さh＝5［m］のとき，流出速度u₁は約いくらか？（g＝9.8［m/s²］）","9.9［m/s］","98［m/s］","7.0［m/s］","3.2［m/s］","ベルヌーイの定理を適用すると，孔からの流出速度はu₁＝√(2gh)となります（トリチェリの定理）。u₁＝√(2×9.8×5)＝√98≒9.9［m/s］です。水面と孔はどちらも大気圧なので，位置エネルギーが速度エネルギーに変わったと考えます。","","",["2gh＝98を計算したあと，平方根をとり忘れた値です。","√(gh)＝√49として，式の係数2を落とした値です。","√(2h)＝√10として重力加速度gを入れ忘れた値です。"],"","","q:figmech_10",["x:figmech_10","トリチェリの定理による流出速度の計算"]],["図の調和振動系で，質量m＝2［kg］，ばね定数k＝800［N/m］のとき，固有角振動数ωは？","20［rad/s］","400［rad/s］","0.05［rad/s］","3.18［rad/s］","運動方程式mẍ＋kx＝0の解から，固有角振動数はω＝√(k/m)です。ω＝√(800÷2)＝√400＝20［rad/s］となります。ばねが硬い（kが大きい）ほど，質量が小さいほど，速く振動します。","","",["k/m＝400を求めたあと，平方根をとり忘れた値です。単位も合いません。","√(m/k)＝√(2÷800)と，分母分子を逆にした値です。","ωを2πで割った固有振動数f［Hz］の値です。角振動数とは別の量です。"],"","","q:figmech_11",["x:figmech_11","固有角振動数ω=√(k/m)と振動波形"]],["図はガソリンエンジンの理論サイクル（オットーサイクル）のP－V線図である。2→3の過程は何か？","等積加熱過程","断熱圧縮過程","断熱膨張過程","等圧加熱過程","オットーサイクルは1→2断熱圧縮，2→3等積加熱（熱Q₁を供給），3→4断熱膨張，4→1等積放熱（熱Q₂を放出）です。2→3は体積Vが一定のまま圧力が上がっているので等積加熱過程です。","","",["1→2の過程です。熱の出入りがなく，体積が減少しながら圧力が上がります。","3→4の過程です。熱の出入りがなく，体積が増加しながら圧力が下がります。","ディーゼルサイクルの2→3の過程です。オットーサイクルでは体積一定で加熱します。"],"","","q:figmech_12",["x:figmech_12","オットーサイクル各過程の名称を記入したP－V線図"]],["図の部品図（寸法の単位は［mm］）から読み取れる，この部品の全長は？","86［mm］","76［mm］","60［mm］","56［mm］","長さ方向の寸法は10，30，46と直列に記入されています。全長は10＋30＋46＝86［mm］です。φ60やφ20は直径，□40は正方形の辺，C4・C2は45°面取り，R2は半径，SR16は球の半径を表します。","","",["30＋46のみを足し，左端の寸法10を落とした値です。","φ60の値です。φは直径を表す記号で，長さ方向の寸法ではありません。","10＋46のみを足し，中央の寸法30を落とした値です。"],"","","q:figmech_13"],["穴の寸法がφ30（上の許容差＋0.033，下の許容差0），軸の寸法がφ30（上の許容差－0.020，下の許容差－0.041）のはめあいがある。最大すきまは？","0.074［mm］","0.020［mm］","0.053［mm］","0.013［mm］","最大すきまは，穴が最大（上の許容サイズ）で軸が最小（下の許容サイズ）のときに生じます。穴30.033－軸29.959＝0.074［mm］です。軸は常に穴より小さいので，このはめあいはすきまばめです。","","",["穴が最小30.000，軸が最大29.980のときの最小すきまです。","穴の上の許容差0.033と軸の上の許容差0.020の絶対値を足した値です。","0.033－0.020と，穴と軸の上の許容差どうしを引いた値です。"],"","","",["x:figmech_14","穴と軸の公差域図と最大・最小すきま"]],["図のカルノーサイクルで，高温源の温度T₁＝427［℃］，低温源の温度T₂＝27［℃］のとき，熱効率ηはおよそいくらか？","57.1［%］","93.7［%］","42.9［%］","6.3［%］","可逆カルノーサイクルの熱効率は η＝1－T₂／T₁ で，温度は絶対温度［K］を使う。T₁＝427＋273.15＝700.15［K］，T₂＝27＋273.15＝300.15［K］より，η＝1－300.15／700.15≒0.571，すなわち約57.1［%］となる。","","",["温度を［K］に直さず，η＝1－27／427 と［℃］のまま計算した値。","T₂／T₁（＝300.15／700.15）を求めただけで，1から引き忘れた値。","［℃］のまま T₂／T₁＝27／427 を計算した値で，換算と式の両方を誤っている。"],"","","q:figmech_15",["x:figmech_15","カルノーサイクル熱機関の熱の流れと効率計算"]],["図の不つり合いロータで，ロータの質量m＝20［kg］，回転中心Cと重心Gの距離ε＝0.05［mm］，回転速度3000［min⁻¹］のとき，不つり合い力Fはおよそいくらか？","98.7［N］","9000［N］","0.314［N］","98700［N］","不つり合い力は F＝mεω²。角速度は ω＝2π×3000／60≒314.2［rad/s］，ε＝0.05［mm］＝5×10⁻⁵［m］。F＝20×5×10⁻⁵×314.2²≒98.7［N］となる。","","",["回転速度3000［min⁻¹］をそのままωとして2乗した値。［rad/s］への換算を忘れている。","ωを2乗せず F＝mεω として計算した値。遠心力はωの2乗に比例する。","εを［m］に直さず，0.05［mm］のまま0.05として計算した値。"],"","","q:figmech_16"],["図のように，振動する主系（m₁，k₁）に補助系（m₂，k₂）を取り付け，減衰のない補助系の振動で主系の振動を打ち消す防振法がある。この補助系を何というか？","ダイナミックダンパ","ダッシュポット","アクティブ制御","フライホイール","主系に質量m₂とばねk₂からなる補助系を付け，その振動で主系の振動をキャンセルする方法をダイナミックダンパによる防振という。補助系の固有振動数を加振振動数に合わせることで主系の振幅を小さくできる。","","",["粘性抵抗で振動エネルギーを吸収するダンパ（粘性減衰器）のこと。図のような質量・ばねの補助系ではない。","発生している振動に能動的に力を加えて振動を抑える方法。受動的な補助系とは異なる。","回転軸の回転速度の変動をならすための慣性の大きな円板で，振動を打ち消す補助系ではない。"],"","","q:figmech_17",["w:115_0","台北101の動吸振器（振り子式の巨大な質量）",{"a":"Armand du Plessis","l":"CC BY 3.0","u":"https://commons.wikimedia.org/wiki/File:Taipei_101_Tuned_Mass_Damper_2010.jpg"}]],["図の質量・ばね・ダンパ系で，質量m＝4［kg］，ばね定数k＝900［N/m］，粘性減衰係数c＝24［N·s/m］のとき，減衰比ζはいくらか？","0.2","0.4","0.8","0.0033","減衰比は ζ＝c／(2√(mk)) で求める。√(mk)＝√(4×900)＝√3600＝60 より，ζ＝24／(2×60)＝0.2。ζ＜1なので，この系は振幅が徐々に小さくなる減衰振動をする。","","",["分母の2を忘れて ζ＝c／√(mk)＝24／60 とした値。","√(mk)ではなく固有角振動数 p＝√(k/m)＝15 を使い，24／(2×15) とした値。","平方根をとらずに c／(2mk)＝24／7200 とした値。式の形を誤っている。"],"","","q:figmech_18",["x:figmech_18","減衰比0.2の減衰振動波形と減衰比の計算"]],["図は金属の結晶構造の一つで，立方体の各頂点と立方体の中心に原子が配置されている。この結晶構造の名称は何か？","体心立方晶（bcc）","面心立方晶（fcc）","最密六方晶（hcp）","ダイヤモンド格子","立方体の8つの頂点と中心に1個の原子をもつ構造を体心立方晶（bcc）という。Mo，Wや常温の鉄（α鉄）がこの構造である。面心立方晶は各面の中心に，最密六方晶は六角柱の形に原子が並ぶ。","","",["立方体の頂点と6つの面の中心に原子がある構造。Cu，Al，Niなどが該当する。","六角柱の頂点・上下面の中心と中間層に原子がある構造。Mg，Zn，Tiなどが該当する。","灰色スズ（α-Sn）などに見られる構造で，図のような単純な体心配置ではない。"],"","","q:figmech_19",["x:figmech_19","教科書の結晶構造図（fcc・bcc・hcp）"]],["図は軟鋼（曲線(1)）の応力－ひずみ曲線である。応力を加えなくても伸びが進行し始める点cを何というか？","降伏点","比例限度","弾性限度","破断点","軟鋼では，点cを超えると荷重をほとんど増やさなくても伸びが進む。この点を降伏点という。原点から点aまでが比例限度，点bまでが弾性限度（弾性変形）で，最大荷重の点mを経て点eで破断する。","","",["応力とひずみが比例する直線部分の限界で，図の点aにあたる。降伏はまだ始まっていない。","荷重を取り除けば元の長さに戻る（弾性変形の）限界で，図の点bにあたる。","材料が最終的に破断する点で，図の点e（×印）にあたる。降伏点より後に現れる。"],"","","q:figmech_20",["x:figmech_20","応力－ひずみ曲線の各点の名称"]],["図は一定温度で材料に一定応力を加えたときのクリープ曲線である。ひずみがほぼ一定の速度で増加する区間C～Dを何というか？","定常クリープ（第2次クリープ）","遷移クリープ（第1次クリープ）","加速クリープ（第3次クリープ）","瞬間ひずみ","区間C～Dでは加工硬化と熱による軟化がつり合い，クリープ速度（ひずみの増加の傾き）が一定になる。これを定常クリープ（第2次クリープ）という。その後，点D以降の加速クリープを経て点Eで破断する。","","",["区間B～Cにあたり，加工硬化が軟化を上回ってクリープ速度がしだいに小さくなる領域。","区間D～Eにあたり，軟化が加工硬化を上回ってクリープ速度が増加し破断に至る領域。","応力を加えた直後に生じるA～Bのひずみで，時間経過によるクリープではない。"],"","","q:figmech_21",["x:figmech_21","教科書のクリープ曲線（遷移・定常・加速の区間名つき）"]],["図のS－N曲線から読み取れる，この材料の疲労限度はおよそいくらか？（右側の目盛［MPa］で読む）","約230［MPa］","約200［MPa］","約300［MPa］","約330［MPa］","S－N曲線で，繰返し数が増えても曲線が水平になり，それ以下の応力では破断しない値が疲労限度である。図では約2×10⁶回以降で水平になり，その高さは23.5［kgf/mm²］付近，右目盛ではおよそ230［MPa］である。","","",["縦軸（右目盛）の最下端の値で，曲線の水平部分の高さより明らかに低い。","繰返し数約10⁵回で破断するときの応力付近の値で，疲労限度ではない。","繰返し数の少ない（10⁴回付近）の高い応力の値で，疲労限度ではない。"],"","","q:figmech_22",["x:figmech_22","S－N曲線の水平部分から疲労限度を読む"]],["図の並列系で，構成要素の信頼度がR₁＝0.8，R₂＝0.7のとき，システム全体の信頼度Rはいくらか？","0.94","0.56","0.75","0.06","並列系は，どれか1つが正常なら機能する。両方とも故障する確率は (1－R₁)(1－R₂)＝0.2×0.3＝0.06 なので，R＝1－(1－R₁)(1－R₂)＝1－0.06＝0.94 となる。","","",["直列系の式 R＝R₁×R₂＝0.8×0.7 で計算した値。","2つの信頼度を単純に平均した値で，並列系の考え方になっていない。","両方とも故障する確率 (1－R₁)(1－R₂) そのもので，1から引き忘れている。"],"","","q:figmech_23",["x:figmech_23","並列系の信頼度＝1－両方故障の確率"]],["シャルピー衝撃試験で，試験片の破断に要したエネルギー（吸収エネルギー）がE＝60［J］，切欠底の断面積がA＝0.8［cm²］であった。シャルピー衝撃値Cは？","75［J/cm²］","48［J/cm²］","0.013［J/cm²］","0.75［J/cm²］","シャルピー衝撃値は，吸収エネルギーを切欠底の断面積で割った値 C＝E／A である。C＝60／0.8＝75［J/cm²］となる。値が大きいほど衝撃に強い（じん性が高い）材料である。","","",["E×A＝60×0.8 と掛け算をした値。衝撃値は断面積で割って求める。","A／E＝0.8／60 と分母と分子を逆にした値で，単位も合わない。","断面積を80［mm²］として60／80を計算し，単位をJ/cm²のままにした換算ミスの値。"],"","","",["w:023_0","シャルピー衝撃試験の原理（振り子の高さの差）",{"a":"Laurensvanlieshout","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Charpy_V-notch_test.svg"}]],["圧力0.2［MPa］，体積6［L］の理想気体を，温度一定（等温変化）のまま体積2［L］まで圧縮した。圧縮後の圧力は？","0.6［MPa］","0.067［MPa］","0.2［MPa］","2.4［MPa］","等温変化では PV＝一定（ボイルの法則）が成り立つ。P₁V₁＝P₂V₂ より，P₂＝P₁V₁／V₂＝0.2×6／2＝0.6［MPa］。体積が1/3になるので圧力は3倍になる。","","",["P₂＝P₁V₂／V₁ と体積比を逆にした値。圧縮すると圧力は上がるはずである。","温度一定を圧力一定（等圧変化）と取り違え，圧力が変わらないとした値。","P₁×V₁×V₂＝0.2×6×2 と掛け算してしまった値。"],"","","",["x:figmech_25","等温変化（ボイルの法則）のP－V線図"]],["図のように旋盤で直径50［mm］の丸棒を主軸回転速度600［min⁻¹］で外丸削りする。切削速度Vはおよそいくらか？","94.2［m/min］","47.1［m/min］","1.57［m/min］","94200［m/min］","切削速度は工作物外周の周速で、V＝πDN／1000［m/min］（Dは直径［mm］、Nは回転速度［min⁻¹］）。V＝3.14×50×600／1000≒94.2［m/min］。1000で割るのはmmをmに直すためである。","","",["直径50［mm］の代わりに半径25［mm］を代入した値。周速の式には直径を使う。","94.2を60で割った値で、単位は［m/s］になる。［m/min］のまま答えるべきところを換算してしまった誤り。","πDNを1000で割り忘れた値。［mm/min］のまま［m/min］としてしまった単位換算ミス。"],"","","q:figmech_26"],["図は旋盤で行う加工の一つを示している。バイトを主軸に対して斜めに送り、円すい形に削るこの加工の名称は何か？","テーパ削り","外丸削り","中ぐり","面削り","工作物の外周を円すい（テーパ）状に削る加工をテーパ削りという。図ではバイトが軸に対して斜めに送られ、先端ほど細い円すい面ができている。旋盤では刃物台を傾けるなどして行う。","","",["外丸削りは工作物の外周を軸と平行に送り、同じ直径の円筒面に削る加工。","中ぐりはすでにあいている穴の内面をバイトで削り、穴径を広げたり精度を上げたりする加工。","面削りはバイトを軸に直角方向へ送り、工作物の端面を平らに削る加工。"],"","","q:figmech_27",["x:figmech_27","教科書のさまざまな旋盤加工（名称つき）"]],["図の右端に示す3条ねじのピッチが1.5［mm］のとき、このねじを2回転させると軸方向に何［mm］進むか？","9.0［mm］","3.0［mm］","4.5［mm］","1.5［mm］","1回転で軸方向に進む距離がリードで、リード＝ピッチ×条数。3条ねじではリード＝1.5×3＝4.5［mm］。2回転では4.5×2＝9.0［mm］進む。条数が多いほど1回転で速く進む。","","",["1条ねじとして、ピッチ×回転数＝1.5×2で計算した値。条数を掛け忘れている。","リード（1回転分）の4.5［mm］で、2回転させることを考慮していない値。","ピッチそのもの。ピッチは隣り合うねじ山の間隔で、1回転で進む距離ではない。"],"","","q:figmech_28",["x:figmech_28","3条ねじのリード＝ピッチ×条数"]],["図の歯車は、ねじ状の歯車と、それにかみ合う歯車を組み合わせたもので、大きな減速比が得られ、直交する2軸間の伝動に使われる。この歯車の名称は何か？","ウォームギヤ","かさ歯車","ラックとピニオン","やまば歯車","ねじ状のウォームと、それにかみ合うウォームホイールの組み合わせをウォームギヤという。食い違う直交2軸の間で、1段で大きな減速比が得られる。自動車のワイパー機構などに使われ、逆転しにくい（セルフロック）性質もある。","","",["かさ歯車は円すい面上に歯を付けた歯車で、交わる2軸間に回転を伝える。","ラックは直線状の歯車で、ピニオン（小歯車）と組み合わせて回転運動を直線運動に変える。","やまば歯車は歯すじが山形（V字形）の歯車で、平行な2軸間の伝動に使い、軸方向の力が打ち消される。"],"","","q:figmech_29",["x:figmech_29","教科書の歯車の種類（ウォームギヤを含む）"]],["モジュール2［mm］、歯数20と40の平歯車がかみ合っている。2つの歯車の中心距離はいくらか？","60［mm］","120［mm］","30［mm］","20［mm］","ピッチ円直径はd＝mzより、d1＝2×20＝40［mm］、d2＝2×40＝80［mm］。中心距離はピッチ円半径の和なので、a＝(d1＋d2)／2＝(z1＋z2)m／2＝(40＋80)／2＝60［mm］。","","",["ピッチ円直径の和（40＋80）で、2で割り忘れた値。中心距離は半径の和である。","歯数の和を2で割っただけの値（(20＋40)／2）で、モジュールを掛け忘れている。","歯数の差を使った (40−20)×2／2 の値。内歯車とのかみ合いの場合の考え方で、外歯車どうしでは誤り。"],"","","",["x:figmech_30","ピッチ円直径と中心距離（半径の和）"]],["歯数20の駆動歯車が900［min⁻¹］で回転し、歯数60の従動歯車とかみ合っている。従動歯車の回転速度はいくらか？","300［min⁻¹］","2700［min⁻¹］","900［min⁻¹］","100［min⁻¹］","かみ合う歯車では送られる歯の数が等しいので、N1×z1＝N2×z2。N2＝N1×z1／z2＝900×20／60＝300［min⁻¹］。歯数が3倍の歯車は回転速度が1／3になる（速度比3）。","","",["歯数比を逆に掛けた値（900×60／20）。大きい歯車のほうが遅く回ることに注意。","かみ合っている歯車は同じ回転速度と考えた誤り。周速は等しいが回転速度は歯数に反比例する。","歯数比を2乗して掛けた値（900×(20／60)²）。回転速度は歯数比に1乗で比例する。"],"","",""],["図のベルト伝動で、下側の直径100［mm］のプーリが1500［min⁻¹］で回転している。上側の直径250［mm］のプーリの回転速度はいくらか？（すべりは無視する）","600［min⁻¹］","3750［min⁻¹］","1500［min⁻¹］","240［min⁻¹］","ベルトの速度はどちらのプーリ外周でも等しいので、πD1N1＝πD2N2。N2＝N1×D1／D2＝1500×100／250＝600［min⁻¹］。大きいプーリほど遅く回る。","","",["直径比を逆に掛けた値（1500×250／100）。大きいプーリが速く回ると考えた誤り。","ベルトでつながっていれば回転速度も同じと考えた誤り。等しいのはベルトの周速である。","直径比を2乗して掛けた値（1500×(100／250)²）。回転速度は直径に1乗で反比例する。"],"","","q:figmech_32",["x:figmech_32","ベルト伝動で周速が等しいことによる回転速度計算"]],["図のてこクランク機構で、Aを固定してDを1回転させると、Bが左右に揺動する。回転運動をするリンクDの名称は何か？","クランク","てこ","連接棒","静止節","てこクランク機構では、回転する主動節Dをクランク、揺動運動する従動節Bをてこ、両者を仲介するCを連接棒（媒介節）という。固定されたAは静止節である。主動節が回転、従動節が揺動するのが特徴。","","",["てこは揺動（首振り）運動をする従動節で、図ではリンクBにあたる。","連接棒（媒介節）はクランクとてこをつなぎ運動を仲介するリンクで、図ではリンクCにあたる。","静止節は固定されて動かないリンクで、図ではリンクAにあたる。"],"","","q:figmech_33",["x:figmech_33","教科書のてこクランク機構（各リンクの名称つき）"]],["図のテーブル送りシステムで、リード10［mm］のボールねじをサーボモータで1200［min⁻¹］で直接回転させる。テーブルの移動速度はいくらか？","200［mm/s］","12000［mm/s］","20［mm/s］","0.2［mm/s］","ボールねじが1回転するとテーブルはリード分進む。毎秒の回転数は1200／60＝20［回/s］なので、速度＝リード×回転数＝10×20＝200［mm/s］（＝12［m/min］）となる。","","",["10×1200で毎分の移動量を求め、60で割り忘れた値。単位は［mm/min］である。","毎秒の回転数（1200／60＝20）だけで、リード10［mm］を掛け忘れた値。","200［mm/s］を［m/s］に直した数値を［mm/s］として答えた単位換算ミス。"],"","","q:figmech_34",["w:010_3","ボールねじの構造（ねじ軸とナットの間を鋼球が循環）",{"a":"W.Rebel","l":"CC BY 3.0","u":"https://commons.wikimedia.org/wiki/File:GearBoxRotLinScrew.gif"}]],["図の空気圧シリンダで、シリンダ内径D＝50［mm］、ピストンロッド径d＝20［mm］、空気圧0.5［MPa］のとき、押出し側の推進力はおよそいくらか？","982［N］","825［N］","3927［N］","245［N］","推進力＝空気圧×ピストンの受圧面積。押出し側はピストン全面に圧力がかかるので、F＝0.5［N/mm²］×π×50²／4≒0.5×1963≒982［N］。1［MPa］＝1［N/mm²］である。","","",["ロッド断面積を差し引いた面積π(50²−20²)／4で計算した値で、引込み側の後退力にあたる。","円の面積をπD²として4で割り忘れた値。直径を使うときはπD²／4である。","直径の半分25［mm］をπD²／4の式に入れた値。半径を使うならπr²とする。"],"","","q:figmech_35",["x:figmech_35","押出し側と引込み側の受圧面積と推進力"]],["図のようなステッピングモータで、ステップ角が1.8°のものに400パルスを与えると、出力シャフトは何回転するか？","2回転","1回転","0.5回転","720回転","ステップ角は1パルス当たりの回転角。回転角＝1.8°×400＝720°。1回転は360°なので、720÷360＝2回転となる。なお1.8°のモータは200パルスで1回転する。","","",["ステップ角を半分の0.9°（ハーフステップ）として計算した値。","1回転に必要なパルス数200を400で割った値。パルス数で割る向きが逆になっている。","回転角720°を360で割り忘れ、角度の値をそのまま回転数とした誤り。"],"","","q:figmech_36"],["図の閉ループ制御のブロック線図で、G＝10、H＝0.4のとき、入力から出力までの伝達関数（出力／入力）の値はいくらか？","2","4","25","−3.33","負帰還の閉ループでは、出力／入力＝G／(1＋GH)。GH＝10×0.4＝4なので、10／(1＋4)＝2となる。比較部の符号が−（負帰還）であることに注意する。Gが大きいほど結果は1／Hに近づく。","","",["一巡伝達関数GH＝10×0.4の値。閉ループ全体の伝達関数ではない。","GをHで割った値（10／0.4）。ブロック線図の結合規則を誤っている。","正帰還の式G／(1−GH)＝10／(1−4)で計算した値。図は負帰還である。"],"","","q:figmech_37",["x:figmech_37","負帰還ブロック線図の各点の信号値と伝達関数"]],["図は積分要素G(s)＝1／Tsのボード線図（ゲイン）である。ωT＝10のとき、出力の振幅は入力の何倍になるか？","0.1倍","10倍","0.01倍","0.05倍","図からωT＝10のゲインは−20［dB］と読める。ゲイン＝20log₁₀(Gの大きさ)より、log₁₀(Gの大きさ)＝−20／20＝−1、Gの大きさ＝10⁻¹＝0.1倍。−20［dB］は1／10を意味する。","","",["＋20［dB］の場合の値。符号を読み違えている（ωT＝0.1のときのゲイン）。","−40［dB］の場合の値で、ωT＝100のときのゲインを読んでいる。","−20［dB］を20で割って1／20とした誤り。dBは対数なので20log₁₀で戻す必要がある。"],"","","q:figmech_38",["x:figmech_38","積分要素のゲイン線図でωT=10は－20dB＝0.1倍"]],["周波数50［Hz］の電源で運転する4極の誘導モータの同期速度はいくらか？","1500［min⁻¹］","750［min⁻¹］","3000［min⁻¹］","1800［min⁻¹］","同期速度［min⁻¹］＝120×周波数／極数＝120×50／4＝1500［min⁻¹］。実際の誘導モータは負荷をかけるとすべりにより同期速度より少し遅く回る。極数が多いほど同期速度は遅くなる。","","",["係数120の代わりに60を使った値（60×50／4）。極数は対の数ではなく極の数で計算する。","2極として計算した値（120×50／2）。極数を取り違えている。","60［Hz］として計算した値（120×60／4）。西日本の周波数の場合の同期速度である。"],"","",""],["図は旋盤などで切削したときの切りくずの形態の一つを示している。切りくずが工具のすくい面上を連続して流れ出し、長くつながるこの形態を何というか？","流れ形","せん断形","き裂形","むしれ形","延性のある材料を切削すると、切りくずがすくい面上を途切れずに流れ出し、図のように長くつながった形になる。これを流れ形という。仕上げ面はよいが、長い切りくずが工作物や工具にからみつくと危険なので注意が必要である。","","",["せん断形は切りくずがせん断されて一定間隔で折れる形態で、そのたびに切削抵抗が変動しびびり振動の原因になる。","き裂形は鋳鉄などもろい材料で、刃先の前方にき裂が入り小片となって割れ落ちる形態。仕上げ面は悪くなる。","むしれ形は粘い材料で切りくずが工作物からむしり取られるように離れる形態で、仕上げ面が粗くなる。"],"","","q:figmech_40",["x:figmech_40","教科書の切りくずの形態（流れ形・せん断形・き裂形）"]],["図は工作物をチャックや心押しで保持せず、研削といし車と調整車の間に入れて支持刃で支えながら外周を研削する方法である。この研削加工の名称は何か？","心なし研削","円筒研削","内面研削","平面研削","工作物をセンタやチャックで保持せず、研削といし車と調整車の間に置いて支持刃で受け、調整車で回転と送りを与えながら外周を研削する方法を心なし研削（センタレス研削）という。円筒研削しにくい小物部品の加工に適している。","","",["円筒研削は工作物の両端をセンタで支えて回転させ、円筒形の外周を研削する方法。","内面研削は工作物の穴の内面を、穴より小さい研削といしを使って研削する方法。","平面研削はテーブルに固定した工作物の平らな面を、回転する研削といしで研削する方法。"],"","","q:figmech_41",["w:022_1","心なし研削の原理：といし車と調整車の間で工作物を支持刃が支える",{"a":"Wizard191","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Centerless_grinding_schematic.svg"}]],["図のように両端支持のはりの中央に集中荷重が作用すると考えると、曲げに要する力はP∝b・h²・σ／l（b：曲げ幅、h：板厚、σ：引張強さ、l：ダイの幅）となる。板厚hとダイの幅lをともに2倍にすると、Pは何倍になるか？","2倍","1倍","4倍","8倍","Pは板厚の2乗に比例し、ダイの幅に反比例する。板厚を2倍にするとh²は2²＝4倍、ダイの幅を2倍にすると1／2倍になるので、P＝4×1／2＝2倍となる。板厚の影響が大きいことに注意する。","","",["Pが板厚hに1乗で比例すると考え、2×1／2＝1倍とした誤り。hは2乗で効く。","板厚の効果（4倍）だけを考え、ダイの幅lを広げると力が小さくなることを無視した値。","ダイの幅lにも比例すると考え、4×2＝8倍とした誤り。lは分母にある。"],"","","q:figmech_42"],["図のように、NC装置からX軸とY軸のモータにパルスを分配して、原点から目的地(300,200)［mm］まで直線で移動させる。1パルスで0.1［mm］移動するとき、各軸に送るパルス数はいくらか？","X：3000パルス、Y：2000パルス","X：2000パルス、Y：3000パルス","X：300パルス、Y：200パルス","X：30パルス、Y：20パルス","パルス数＝移動量÷1パルス当たりの移動量。X軸は300÷0.1＝3000パルス、Y軸は200÷0.1＝2000パルス。2つの軸に常に3：2の割合でパルスを分配すると、目的地まで直線で移動できる。","","",["X軸とY軸の移動量を取り違えた値。目的地の座標は(X,Y)＝(300,200)の順である。","移動量［mm］をそのままパルス数とした値。1パルス0.1［mm］で割っていない。","移動量に0.1を掛けてしまった値。パルス数は移動量を1パルス当たりの移動量で割って求める。"],"","","q:figmech_43",["x:figmech_43","直線補間のためのX・Y軸へのパルス配分"]],["図は等速度運動を行うカムのカム線図である。カムが1回転（360°）する間に従動節が30［mm］移動するとき、カムが120°回転したときの従動節の変位はいくらか？","10［mm］","20［mm］","15［mm］","30［mm］","等速度運動のカム線図は直線で、カムの回転角と従動節の変位が比例する。変位＝30×120／360＝10［mm］。180°で全変位の半分（15［mm］）、360°で30［mm］となる。","","",["180°で全行程30［mm］とみなして30×120／180とした値。図では360°で最大変位になる。","180°のときの変位（全変位の半分）を読んだ値。120°ではそれより小さい。","360°回転したときの最大変位で、120°回転時の値ではない。"],"","","q:figmech_44",["x:figmech_44","等速度カム線図で回転角120°の変位を読む"]],["図の速度パターン（加速0.1［s］、定速0.3［s］、減速0.1［s］）でボールねじを駆動する。最高回転速度N＝1500［min⁻¹］、リード5［mm］のとき、1回の動作でテーブルが移動する距離はいくらか？","50［mm］","62.5［mm］","37.5［mm］","3000［mm］","最高速度は1500／60×5＝125［mm/s］。移動距離は速度パターン（台形）の面積で、加速と減速の三角形を合わせると0.1［s］分の長方形になる。距離＝125×(0.3＋0.1)＝50［mm］。","","",["0.5［s］の間ずっと最高速度で動くとした値（125×0.5）。加減速中は速度が低い。","定速区間0.3［s］だけの移動量（125×0.3）で
