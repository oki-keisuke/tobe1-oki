ds）",["論理積と論理和の対応が逆である。ORは論理和、ANDは論理積を指す。","NANDは論理積の否定、NORは論理和の否定で、論理積・論理和そのものではない。","XORは排他的論理和、NOTは否定であり、論理積・論理和の呼び名ではない。"],"https://www.youtube.com/watch?v=KdJ5CTgxZbM","【A試験_基礎理論】06. 論理演算と論理回路",""],["排他的論理和を何と呼ぶか？","XOR","NOR","NAND","XNOR","排他的論理和（XOR、Exclusive OR）は、2つの入力が異なるとき出力が1、同じとき0になる演算。加算器の和の計算、パリティの生成、比較（一致検出）などに使われる。","https://e-words.jp/w/%E8%AB%96%E7%90%86%E5%9B%9E%E8%B7%AF.html","論理回路とは（IT用語辞典 e-Words）",["NORは論理和の否定で、入力がすべて0のときだけ出力が1になる演算である。","NANDは論理積の否定で、入力がすべて1のときだけ出力が0になる演算である。","XNORは排他的論理和の否定で、2入力が同じときに1となる一致検出の演算である。"],"https://www.youtube.com/watch?v=KdJ5CTgxZbM","【A試験_基礎理論】06. 論理演算と論理回路","",["x:info1_11","XORの真理値表とMIL記号"]],["意味のある情報を記憶するものを、ハードウェア的・ソフトウェア的にそれぞれ何と呼ぶか？","フリップフロップ、フラグ","レジスタ、変数","メモリ、ファイル","ラッチ、ポインタ","ハードウェアで1ビットの情報を記憶する回路がフリップフロップ。ソフトウェアで、ある状態（処理済みか、エラーが起きたかなど）を記憶するための1ビット程度の変数をフラグという。どちらも「意味のある情報」を覚えておくためのもの。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-3-2.html","順序論理回路（フリップフロップ）（東芝デバイス＆ストレージ）",["レジスタはCPU内の一時記憶素子、変数はデータ一般を入れる入れ物で、状態を表す1ビットの記憶という意味ではない。","メモリはデータを単に格納する装置、ファイルは補助記憶上のデータのまとまりで、意味のある状態を覚えるものではない。","ラッチは状態を保持する仕組みの名前、ポインタはアドレスを格納する変数で、ソフト的に状態を記憶するフラグとは異なる。"],"https://www.youtube.com/watch?v=ogLNCgH4xQA","フリップフロップの基礎知識【デジタル回路設計】",""],["単に情報を格納しておくものを何と呼ぶか？","メモリ","レジスタ","フラグ","キャッシュ","メモリ（主記憶装置）は、プログラムやデータを単に格納しておく場所。CPUは番地（アドレス）を指定して読み書きする。レジスタよりは遅いが大容量。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["レジスタは演算などの一時的な目的で使うCPU内部の高速な記憶素子で、単にデータを置いておく場所ではない。","フラグは演算結果などの意味のある状態を記憶するビットで、単なる格納場所ではない。","キャッシュは主記憶のデータを高速化のためにコピーしておく小容量メモリで、単なる格納場所とは役割が違う。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["演算など一時的な目的で記憶するCPU内部の記憶素子を何と呼ぶか？","レジスタ","メモリ","スタック","バス","レジスタは、CPUの内部にある、演算の途中結果やアドレスなどを一時的に記憶する高速な記憶素子。容量は小さいが、メモリより桁違いに速くアクセスできる。アキュムレータ、プログラムカウンタ、スタックポインタなどがある。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["メモリ（主記憶）はCPUの外にあり、プログラムやデータを単に格納する場所である。","スタックは後入れ先出しでデータを積むメモリ上の領域で、CPU内部の演算用記憶素子そのものではない。","バスはCPU・メモリ・周辺装置の間でデータをやり取りする信号線の束で、記憶素子ではない。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["1を保持するフリップフロップの基本的な考え方で、出力を自分の入力へフィードバックするゲートは何か？","ORゲート","ANDゲート","NOTゲート","XORゲート","ORゲートの出力を自分の入力の一方に戻す（フィードバックする）と、一度出力が1になれば、もう一方の入力が0に戻っても1が出続ける。これが1ビットを記憶するフリップフロップの基本的な考え方。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-3-2.html","順序論理回路（フリップフロップ）（東芝デバイス＆ストレージ）",["ANDゲートの出力を帰還しても、もう一方の入力が0になると出力が0に戻るため、1を保持できない。","NOTゲートは入力を反転するだけで、出力を自分に帰還すると発振するため1を保持する用途には使えない。","XORゲートは出力を帰還すると入力の組合せで出力が反転してしまい、1を安定に保持できない。"],"https://www.youtube.com/watch?v=ogLNCgH4xQA","フリップフロップの基礎知識【デジタル回路設計】","",["x:info1_15","ORの出力を入力へ帰還して1を保持する仕組み"]],["フリップフロップで、出力が1になるとその状態が保持される仕組みを何と呼ぶか？","ラッチ","リセット","クリア","トグル","ラッチは、出力が一度1になると、入力が変わってもその状態を保持し続ける仕組み。「掛け金をかける」という意味。フィードバックによって状態を固定する。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-3-2.html","順序論理回路（フリップフロップ）（東芝デバイス＆ストレージ）",["リセットは保持している状態を0に戻す操作で、1を保持する仕組みそのものではない。","クリアはリセットと同様に記憶内容を0に消去する操作で、状態保持の仕組みではない。","トグルは入力のたびに出力を反転させる動作で、JKやTフリップフロップの機能である。"],"https://www.youtube.com/watch?v=ogLNCgH4xQA","フリップフロップの基礎知識【デジタル回路設計】","",["w:105_2","NORゲート2個で構成したSRラッチ",{"a":"Drawn by Heron.","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:SR-NOR-latch.png"}]],["1を保持（ラッチ）した状態を、帰還を断ち切ってリセットするために組み合わせるゲートは何か？","ANDゲート","ORゲート","XORゲート","バッファ","ORの帰還ループの途中にANDゲートを入れ、リセット信号でANDの入力を0にすると、フィードバックが断ち切られて出力が0に戻る。ORでセットし、ANDでリセットする、というのがRSフリップフロップの考え方。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-3-2.html","順序論理回路（フリップフロップ）（東芝デバイス＆ストレージ）",["ORゲートは帰還ループで1をセット・保持する側の役割で、帰還を断ち切るためのゲートではない。","XORゲートは入力が異なるとき1を出す演算で、リセット信号で帰還を確実に断つ用途には使わない。","バッファは入力をそのまま出力し駆動能力を高める素子で、帰還を断ち切る機能はもたない。"],"https://www.youtube.com/watch?v=ogLNCgH4xQA","フリップフロップの基礎知識【デジタル回路設計】","",["x:info1_17","ANDを組み合わせて保持した1をリセットする回路"]],["CPU内で演算結果の状態を保存する基本的なフラグ2つの組合せは？","ゼロフラグ、キャリーフラグ","パリティフラグ、割込みフラグ","サインフラグ、トラップフラグ","ダイレクションフラグ、補助キャリーフラグ","CPUには演算結果の状態を記録するフラグがあり、代表は結果が0になったことを示すゼロフラグと、桁上がり（桁借り）が起きたことを示すキャリーフラグ。このほか符号（サイン）フラグ、オーバーフローフラグなどもある。条件分岐はこれらのフラグを見て判断する。","https://e-words.jp/w/%E3%82%B9%E3%83%86%E3%83%BC%E3%82%BF%E3%82%B9%E3%83%AC%E3%82%B8%E3%82%B9%E3%82%BF.html","ステータスレジスタ（フラグレジスタ）とは（IT用語辞典 e-Words）",["パリティフラグは結果の1の数の偶奇を示し、割込みフラグは割込み許可を示すもので、基本の2つではない。","サインフラグは結果の符号を示すが、トラップフラグはデバッグ用の1命令ずつ実行を制御するもので基本の組ではない。","ダイレクションフラグは文字列命令の処理方向、補助キャリーフラグはBCD演算用の下位4ビットの桁上がりで、基本の組ではない。"],"https://www.youtube.com/watch?v=AJURmYZp_ZQ","基本情報技術者試験対策 CPUの働き","",["x:info1_18","AND演算の結果がZフラグ・Cフラグに反映される例"]],["ビットシフトで、あふれたビットが反対側の端に戻る操作を何というか？","ローテイト","論理シフト","算術シフト","マスク","ローテイト（循環シフト）は、ビット列をずらしたとき、端からあふれたビットを反対側の端に戻す操作。ビットが失われずに回転する。あふれたビットを捨てて空いた所に0を入れるのが通常のシフト。","https://e-words.jp/w/%E3%83%93%E3%83%83%E3%83%88%E3%82%B7%E3%83%95%E3%83%88.html","ビットシフト（シフト演算）とは（IT用語辞典 e-Words）",["論理シフトはあふれたビットを捨て、空いたビットに0を入れる操作で、ビットは反対側に戻らない。","算術シフトは符号ビットを保ちながらずらし、符号付き数を2倍・1/2倍する操作で、あふれたビットは戻らない。","マスクは特定のビットをANDやORで取り出したり消したりする操作で、シフト操作ではない。"],"https://www.youtube.com/watch?v=_DFgssymvHA","シフト演算とは？（論理シフト、算術シフト）【基本情報】","",["x:info1_19","左シフトと左ローテイトの違い"]],["演算結果が0になるとセットされるフラグを何というか？","ゼロフラグ","キャリーフラグ","オーバーフローフラグ","サインフラグ","ゼロフラグは、演算結果がちょうど0になったときにセット（1）されるフラグ。2つの値が等しいかどうかを、引き算してゼロフラグを見ることで判定できる。","https://e-words.jp/w/%E3%82%B9%E3%83%86%E3%83%BC%E3%82%BF%E3%82%B9%E3%83%AC%E3%82%B8%E3%82%B9%E3%82%BF.html","ステータスレジスタ（フラグレジスタ）とは（IT用語辞典 e-Words）",["キャリーフラグは最上位ビットからの桁上がり・桁借りでセットされるフラグで、結果が0かどうかは示さない。","オーバーフローフラグは符号付き演算の結果が表現範囲を超えたときにセットされるフラグである。","サインフラグは演算結果の最上位ビット（符号）が1、つまり負になったときにセットされるフラグである。"],"https://www.youtube.com/watch?v=AJURmYZp_ZQ","基本情報技術者試験対策 CPUの働き",""],["演算結果がレジスタ幅を超える（桁上がりする）とセットされるフラグは？","キャリーフラグ","ゼロフラグ","パリティフラグ","割込みフラグ","キャリーフラグは、演算でレジスタの最上位ビットから桁上がり（引き算なら桁借り）が起きたときにセットされるフラグ。多倍長の計算で上位桁に桁上がりを伝えるのにも使う。","https://e-words.jp/w/%E3%82%B9%E3%83%86%E3%83%BC%E3%82%BF%E3%82%B9%E3%83%AC%E3%82%B8%E3%82%B9%E3%82%BF.html","ステータスレジスタ（フラグレジスタ）とは（IT用語辞典 e-Words）",["ゼロフラグは演算結果が0のときにセットされるフラグで、桁上がりとは関係しない。","パリティフラグは演算結果の1のビット数が偶数か奇数かを示すフラグで、桁上がりは示さない。","割込みフラグは外部割込みを受け付けるかどうかを決めるフラグで、演算結果の状態を示すものではない。"],"https://www.youtube.com/watch?v=AJURmYZp_ZQ","基本情報技術者試験対策 CPUの働き",""],["ビット列が数値としての意味を持たない（符号を考えない）シフト操作を何というか？","論理シフト","算術シフト","ローテイト","循環シフト","論理シフトは、ビット列を数値の符号を考えずに単純にずらす操作で、空いたビットには0を入れる。符号ビットを保ったままずらし、符号付きの数を2倍・1/2倍するのは算術シフト。","https://e-words.jp/w/%E3%83%93%E3%83%83%E3%83%88%E3%82%B7%E3%83%95%E3%83%88.html","ビットシフト（シフト演算）とは（IT用語辞典 e-Words）",["算術シフトは符号ビットを保ったまま数値としてずらす操作で、符号付き数の乗除算に使う。","ローテイトはあふれたビットを反対側の端に戻す循環操作で、空いた所に0を入れるシフトとは異なる。","循環シフトはローテイトの別名で、あふれたビットを捨てずに反対側に戻す操作である。"],"https://www.youtube.com/watch?v=_DFgssymvHA","シフト演算とは？（論理シフト、算術シフト）【基本情報】","",["x:info1_22","左右の論理シフトの例（空いた端は0）"]],["8ビットで表せる状態はいくつか？","256個","128個","255個","512個","1ビットは0と1の2通りなので、8ビットでは2⁸＝256通りの状態を表せる。符号なしなら0〜255、2の補数を使う符号付きなら−128〜127を表せる。","https://e-words.jp/w/2%E9%80%B2%E6%95%B0.html","2進数とは（IT用語辞典 e-Words）",["128個は2⁷で7ビットで表せる状態数であり、8ビットではその2倍になる。","255は8ビット符号なし整数の最大値で、0を含めると状態の数は256個になる。","512個は2⁹で9ビットで表せる状態数であり、8ビットでは表せない。"],"https://www.youtube.com/watch?v=r42M7tfZo8k","【基本情報】2進数による符号化を解説！ビットとバイトの違い",""],["1バイトは何ビットか？","8ビット","4ビット","16ビット","10ビット","1バイト（byte）＝8ビット（bit）。メモリの容量やファイルサイズはバイト単位で表す。1KB＝1024バイト（または1000バイト）。","https://e-words.jp/w/2%E9%80%B2%E6%95%B0.html","2進数とは（IT用語辞典 e-Words）",["4ビットは1バイトの半分でニブルと呼ばれ、16進数1桁に相当する。","16ビットは2バイトで、ワード（16ビットCPUの場合）などと呼ばれる長さである。","10ビットはバイトの定義ではない。10進の感覚で考えた値で、1バイトは2⁸通りを表す8ビットである。"],"https://www.youtube.com/watch?v=r42M7tfZo8k","【基本情報】2進数による符号化を解説！ビットとバイトの違い",""],["2の補数による負数表現で、正負はどう判定するか？","最上位ビットが0なら正、1なら負","最下位ビットが0なら正、1なら負","最上位ビットが1なら正、0なら負","ビットの1の個数で決まる","2の補数表現では、最上位ビット（MSB）が符号を表し、0なら正（またはゼロ）、1なら負になる。この表現なら、正負の数の足し算を、特別な処理なしに普通の加算回路で計算できる。","https://atmarkit.itmedia.co.jp/ait/articles/0505/31/news103.html","2進数を理解しよう：基本情報技術者試験講座（@IT）",["最下位ビットは数の偶奇を表すビットで、2の補数での正負の判定には使わない。","0と1の対応が逆である。最上位ビットが1のときが負、0のときが正またはゼロになる。","1の個数はパリティの判定に使うもので、2の補数の正負は最上位ビットだけで決まる。"],"https://www.youtube.com/watch?v=LUrGJG1lLKU","2の補数の問題 #基本情報技術者試験","",["x:info1_25","8ビットの符号付き・符号なし整数の範囲"]],["6ビットで +3 は 000011。−3 は2の補数でどう表されるか？","111101","111100","100011","000011","2の補数で負の数を作るには、正の数の全ビットを反転して1を足す。+3＝000011 を反転すると111100、1を足すと111101 が−3。確かに000011＋111101＝(1)000000 となり、桁あふれを除くと0になる。","https://atmarkit.itmedia.co.jp/ait/articles/0505/31/news103.html","2進数を理解しよう：基本情報技術者試験講座（@IT）",["111100は000011の全ビットを反転しただけの1の補数で、2の補数にはさらに1を足す必要がある。","100011は最上位ビットを符号に使う符号と絶対値表現での−3で、2の補数表現ではない。","000011は+3そのものであり、負の数を表すには反転して1を加える操作が必要である。"],"https://www.youtube.com/watch?v=LUrGJG1lLKU","2の補数の問題 #基本情報技術者試験","",["x:info1_26","ビット反転して1を加え−3の2の補数を求める"]],["整数のある位置を小数点と決めて小数を表す方式を何というか？","固定小数点方式","浮動小数点方式","BCD方式","指数表記","固定小数点方式は、整数のどの位置に小数点があるかをあらかじめ決めておき、小数を整数として扱う方式。計算が速く回路が簡単なので、組込み機器やDSPで使われるが、表せる数の範囲は狭い。","https://e-words.jp/w/%E6%B5%AE%E5%8B%95%E5%B0%8F%E6%95%B0%E7%82%B9%E6%95%B0.html","浮動小数点数とは（IT用語辞典 e-Words）",["浮動小数点方式は仮数部と指数部で数を表し、小数点の位置が指数で動く方式である。","BCD方式は10進数の各桁を4ビットの2進数で表す方式で、小数点の位置を決める方式ではない。","指数表記は1.23×10⁴のように仮数と累乗で数を書く表し方で、浮動小数点の考え方に近い。"],"https://www.youtube.com/watch?v=SyLD4cOcnNg","基本情報技術者試験 浮動小数点数","",["x:info1_27","8.5を固定小数点形式の2進数で表した例"]],["仮数部・指数部を2進数で表し、精度に応じてビット数や配置を決めた形式を何というか？","浮動小数点形式","固定小数点形式","BCD形式","ASCII形式","浮動小数点形式は、数を「符号・仮数部・指数部」に分けて表す形式（例：1.011×2⁵）。非常に大きな数から小さな数まで表せる。単精度（32ビット）、倍精度（64ビット）などを定めたIEEE754が標準。","https://e-words.jp/w/%E6%B5%AE%E5%8B%95%E5%B0%8F%E6%95%B0%E7%82%B9%E6%95%B0.html","浮動小数点数とは（IT用語辞典 e-Words）",["固定小数点形式は小数点の位置をあらかじめ固定した形式で、指数部をもたない。","BCD形式は10進数の1桁を4ビットで表す形式で、仮数部と指数部をもつ形式ではない。","ASCII形式は文字を7ビットのコードで表すもので、数値を仮数部と指数部で表す形式ではない。"],"https://www.youtube.com/watch?v=SyLD4cOcnNg","基本情報技術者試験 浮動小数点数","",["x:info1_28","浮動小数点数の考え方（符号・仮数・指数）"]],["仮数を「1.011…」のように最初の1を小数点の左に置き、表現を一通りにする方法を何というか？","正規化","量子化","丸め","標本化","正規化は、仮数部を「1.xxx」のように、最上位に必ず1が来る形に整えて、同じ数の表し方を一通りにする操作。こうすると仮数部の桁を無駄なく使え、精度が最も高くなる。IEEE754では先頭の1を省略してさらに1ビット稼いでいる。","https://e-words.jp/w/%E6%B5%AE%E5%8B%95%E5%B0%8F%E6%95%B0%E7%82%B9%E6%95%B0.html","浮動小数点数とは（IT用語辞典 e-Words）",["量子化は連続値をとびとびの段階値に丸める処理で、仮数の表し方をそろえる操作ではない。","丸めは表せる桁数に合わせて切り捨て・切り上げなどをする処理で、表現を一通りにする操作ではない。","標本化はアナログ信号を一定間隔で取り出す操作で、浮動小数点の仮数とは関係しない。"],"https://www.youtube.com/watch?v=SyLD4cOcnNg","基本情報技術者試験 浮動小数点数","",["w:054_1","単精度浮動小数点の符号・指数・仮数部の構成",{"a":"Gj7","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Binary32_format_for_single-precision_floating_point_number.png"}]],["絶対値が非常に近い数値同士の減算で、精度が著しく落ちる誤差を何というか？","桁落ち誤差","丸め誤差","情報落ち誤差","打切り誤差","桁落ち誤差は、ほとんど同じ大きさの数どうしを引き算したとき、上位の桁が打ち消し合って有効数字が大きく減ってしまう誤差。例：1.2345−1.2344＝0.0001 では有効数字が5桁から1桁になる。計算式を変形して避ける。","https://e-words.jp/w/%E6%A1%81%E8%90%BD%E3%81%A1.html","桁落ちとは（IT用語辞典 e-Words）",["丸め誤差は切り捨て・切り上げ・四捨五入で桁数に収めるときに生じる誤差で、近い数の減算が原因ではない。","情報落ち誤差は絶対値が大きく違う数の加減算で小さい方が反映されない誤差で、近い数の減算とは逆の状況である。","打切り誤差は無限級数や反復計算を途中で打ち切ることで生じる誤差である。"],"https://www.youtube.com/watch?v=7QJVCKemo2U","コンピュータの誤差とは？(丸め誤差、打切り誤差、桁落ち、情報落ち)","",["x:info1_30","近い数同士の減算で仮数部の大半が消える桁落ち"]],["演算結果の切り上げ・切り捨て・四捨五入などで発生する誤差を何というか？","丸め誤差","桁落ち誤差","情報落ち誤差","オーバーフロー","丸め誤差は、表せる桁数に収めるために、切り捨て・切り上げ・四捨五入をしたときに生じる誤差。10進数の0.1は2進数では無限に続く小数になるため、コンピュータでは必ず丸め誤差が生じる。","https://e-words.jp/w/%E6%A1%81%E8%90%BD%E3%81%A1.html","桁落ちとは（IT用語辞典 e-Words）",["桁落ち誤差は値がほぼ等しい数の減算で有効数字が減る誤差で、端数処理が原因ではない。","情報落ち誤差は大きさが極端に違う数の加減算で小さい方の数が失われる誤差である。","オーバーフローは演算結果が表現できる最大値を超える現象で、端数処理で生じる誤差ではない。"],"https://www.youtube.com/watch?v=7QJVCKemo2U","コンピュータの誤差とは？(丸め誤差、打切り誤差、桁落ち、情報落ち)",""],["演算結果が内部で表現できる最大値を超えることを何というか？","オーバーフロー","アンダーフロー","桁落ち","キャリー","オーバーフロー（桁あふれ）は、演算結果がそのデータ型で表せる最大値を超えてしまうこと。例えば符号付き8ビットで127＋1を計算すると−128になってしまう。逆に、0に近すぎて表せなくなるのはアンダーフロー。","https://e-words.jp/w/%E6%A1%81%E8%90%BD%E3%81%A1.html","桁落ちとは（IT用語辞典 e-Words）",["アンダーフローは結果の絶対値が0に近すぎて表現できる最小値を下回る現象で、最大値超過とは逆である。","桁落ちはほぼ等しい数の減算で有効数字が減る誤差で、最大値を超える現象ではない。","キャリーは最上位ビットからの桁上がりで、符号なし演算では桁あふれを示すが、表現範囲超過一般の呼び名ではない。"],"https://www.youtube.com/watch?v=7QJVCKemo2U","コンピュータの誤差とは？(丸め誤差、打切り誤差、桁落ち、情報落ち)",""],["絶対値が極端に違う数の加減算で、小さい方の数が結果に反映されない誤差を何というか？","情報落ち誤差","桁落ち誤差","丸め誤差","打切り誤差","情報落ち誤差は、絶対値が極端に違う数を足したり引いたりしたとき、小さい方の数が仮数部の桁からはみ出して結果に反映されない誤差。多くの数を足すときは、小さい数から順に足すと防ぎやすい。","https://e-words.jp/w/%E6%A1%81%E8%90%BD%E3%81%A1.html","桁落ちとは（IT用語辞典 e-Words）",["桁落ち誤差は絶対値が近い数どうしの減算で有効数字が減る誤差で、大きさが極端に違う場合ではない。","丸め誤差は切り捨て・四捨五入などで桁数に収めるときに生じる誤差である。","打切り誤差は無限に続く計算を有限回で打ち切ることで生じる誤差である。"],"https://www.youtube.com/watch?v=7QJVCKemo2U","コンピュータの誤差とは？(丸め誤差、打切り誤差、桁落ち、情報落ち)","",["x:info1_33","指数部をそろえると小さい数の精度が落ちる情報落ち"]],["シリアル伝送で、1のビットの数が偶数か奇数かを決めておき、誤りの発生を調べる方法は？","パリティチェック","チェックサム","CRC","ハミング符号","パリティチェックは、データに1ビットのパリティビットを付けて、全体の1の数を偶数（偶数パリティ）または奇数（奇数パリティ）にそろえて送り、受信側で1の数を数えて誤りを検出する方法。簡単だが、2ビット同時の誤りは検出できない。","https://e-words.jp/w/%E3%83%91%E3%83%AA%E3%83%86%E3%82%A3%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF.html","パリティチェックとは（IT用語辞典 e-Words）",["チェックサムはデータを足し合わせた値を付けて送り、受信側の合計と比べる方式で、1の数の偶奇は使わない。","CRCは生成多項式で割った余りを付加して誤りを調べる方式で、1の数の偶奇による方法ではない。","ハミング符号は複数の検査ビットで誤りビットの位置を特定し訂正もできる符号である。"],"https://www.youtube.com/watch?v=EM7yiIsr0y4","【図解】パリティビットの誤り検出とTCPの仕組み【高校情報Ⅰ】","",["x:info1_34","パリティビットで1ビットエラーを検出する仕組み"]],["パリティチェックで誤りを検出できても、検出できないものは何か？","誤ったビットの位置","誤りの有無","データの長さ","送信元のアドレス","パリティチェックでは、1ビットの誤りがあることは分かっても、どのビットが誤っているかは分からないので、訂正はできない。また2ビット同時に誤ると1の数の偶奇が元に戻るため、誤りそのものも検出できない。","https://e-words.jp/w/%E3%83%91%E3%83%AA%E3%83%86%E3%82%A3%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF.html","パリティチェックとは（IT用語辞典 e-Words）",["誤りの有無はパリティチェックで検出できる。1ビットの誤りなら1の数の偶奇が変わるので分かる。","データの長さは誤り検出とは別に通信の取り決めで決まるもので、パリティチェックの検出対象ではない。","送信元のアドレスは通信プロトコルのヘッダで扱う情報で、パリティチェックとは関係ない。"],"https://www.youtube.com/watch?v=EM7yiIsr0y4","【図解】パリティビットの誤り検出とTCPの仕組み【高校情報Ⅰ】","",["x:info1_35","2ビット誤るとパリティでは検出できない例"]],["複数のデータを伝送する際、全データを加算した値も送り、受信側の加算結果と比べて誤りを調べる方式は？","チェックサム","パリティチェック","CRC","ハッシュ","チェックサムは、送るデータを数値として足し合わせた結果（の一部）を一緒に送り、受信側でも同じ計算をして一致するか確かめる誤り検出方法。計算が簡単だが、データの順番の入れ替わりなどは検出できない。","https://e-words.jp/w/%E3%83%91%E3%83%AA%E3%83%86%E3%82%A3%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF.html","パリティチェックとは（IT用語辞典 e-Words）",["パリティチェックは1の数の偶奇をそろえるビットで誤りを調べる方式で、データの加算値は使わない。","CRCはデータを生成多項式で割った剰余を付ける方式で、単純な加算とは異なり検出精度が高い。","ハッシュは任意長データから固定長の値を求める関数で、主に改ざん検出や検索に使う。"],"https://www.youtube.com/watch?v=EM7yiIsr0y4","【図解】パリティビットの誤り検出とTCPの仕組み【高校情報Ⅰ】","",["x:info1_36","全バイトの和を付けて送るチェックサム"]],["データを生成多項式で割った剰余を付けて送り、受信側で比較する精度の高い誤り検出方法は？","CRC","パリティチェック","チェックサム","ハミング符号","CRC（Cyclic Redundancy Check：巡回冗長検査）は、データを生成多項式で割った余りを検査用データとして付けて送り、受信側でも同じ計算をして比べる誤り検出方法。連続したビットの誤り（バースト誤り）も高い確率で検出でき、通信やストレージで広く使われる。","https://e-words.jp/w/%E3%83%91%E3%83%AA%E3%83%86%E3%82%A3%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF.html","パリティチェックとは（IT用語辞典 e-Words）",["パリティチェックは1の数の偶奇をそろえるだけの簡単な方式で、多項式の割り算は使わない。","チェックサムはデータを加算した値で比べる方式で、生成多項式による剰余は使わない。","ハミング符号は検査ビットで1ビット誤りの位置を特定して訂正する符号で、多項式剰余による検出方式ではない。"],"https://www.youtube.com/watch?v=EM7yiIsr0y4","【図解】パリティビットの誤り検出とTCPの仕組み【高校情報Ⅰ】",""],["あるデータから、そのデータに対応する特定の固定長の数値を得る関数を何というか？","ハッシュ関数","伝達関数","乱数関数","ステップ関数","ハッシュ関数は、任意の長さのデータから、決まった長さの値（ハッシュ値）を計算する関数。少しでもデータが変わるとハッシュ値が大きく変わるので、改ざんの検出、パスワードの保存、データの高速検索（ハッシュテーブル）などに使われる。","https://e-words.jp/w/%E3%83%8F%E3%83%83%E3%82%B7%E3%83%A5%E9%96%A2%E6%95%B0.html","ハッシュ関数とは（IT用語辞典 e-Words）",["伝達関数は制御系の入出力の関係をラプラス変換で表したもので、データから固定長の値を求める関数ではない。","乱数関数は予測できない値を生成する関数で、同じデータからは同じ値を返すハッシュ関数とは異なる。","ステップ関数はある時刻で0から1へ切り替わる関数で、制御系の応答を調べる入力などに使う。"],"https://www.youtube.com/watch?v=q27m0en2CNM","ハッシュ関数（SHA-256）がハッシュ値を生成する仕組み","",["w:156_0","ハッシュ関数で入力から固定長の値を得る例",{"a":"不明","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Hash_function_long.svg"}]],["000 と 111 のハミング距離はいくつか？","3","1","0","2","ハミング距離は、同じ長さの2つの符号で、対応する位置のビットが異なる数。000と111は3ビットすべて異なるので距離は3。符号どうしのハミング距離が大きいほど、誤りを検出・訂正しやすくなる。","https://e-words.jp/w/%E3%83%8F%E3%83%9F%E3%83%B3%E3%82%B0%E7%AC%A6%E5%8F%B7.html","ハミング符号とは（IT用語辞典 e-Words）",["1は1ビットだけ異なる符号どうしの距離で、000と111のように3ビットとも異なる場合ではない。","0は2つの符号がまったく同じ場合のハミング距離である。","2は2ビットが異なる場合の距離で、000と111は全3ビットが異なる。"],"https://www.youtube.com/watch?v=ApEGLKkhoIc","情報理論2 パリティ検査符号・ハミング符号・誤り訂正能力","",["w:047_1","3ビット符号の立方体（辺1本がハミング距離1）",{"a":"en:User:Cburnett","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Hamming_distance_3_bit_binary.svg"}]],["冗長ビットを付加して、1ビット誤りを訂正し、2ビット誤りを検出できる符号化方式は？","ハミング符号","リードソロモン符号","ハフマン符号","ランレングス符号","ハミング符号は、情報ビットにいくつかの検査ビットを加えて、どのビットが誤ったかを特定できるようにした符号。1ビットの誤りを訂正し、拡張すれば2ビットの誤りを検出できる（SECDED）。メモリのECCに使われる。","https://e-words.jp/w/%E3%83%8F%E3%83%9F%E3%83%B3%E3%82%B0%E7%AC%A6%E5%8F%B7.html","ハミング符号とは（IT用語辞典 e-Words）",["リードソロモン符号はシンボル単位で誤りを訂正する符号で、バースト誤りに強い。1ビット訂正・2ビット検出の代表ではない。","ハフマン符号は出現確率に応じて符号長を変える圧縮用の符号で、誤り訂正の機能はない。","ランレングス符号は同じ値の連続を長さで表す圧縮方式で、誤り訂正の機能はない。"],"https://www.youtube.com/watch?v=ApEGLKkhoIc","情報理論2 パリティ検査符号・ハミング符号・誤り訂正能力","",["w:048_1","ハミング(7,4)符号のデータビットとパリティの関係",{"a":"User:Cburnett","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Hamming(7,4).svg"}]],["バースト誤りに強く、CD、DVD、デジタル放送などに広く使われる誤り訂正符号は？","リードソロモン符号","ハミング符号","パリティ符号","ハフマン符号","リードソロモン符号は、数ビットをまとめたシンボル単位で誤りを訂正する符号で、傷などで連続してビットが壊れるバースト誤りに強い。CD・DVD・ブルーレイ、QRコード、デジタル放送などに広く使われている。","https://e-words.jp/w/%E3%83%AA%E3%83%BC%E3%83%89%E3%82%BD%E3%83%AD%E3%83%A2%E3%83%B3%E7%AC%A6%E5%8F%B7.html","リードソロモン符号とは（IT用語辞典 e-Words）",["ハミング符号は1ビット誤りの訂正向けの符号で、連続して壊れるバースト誤りには弱い。","パリティ符号は1ビットの検査ビットで誤りの検出だけを行うもので、訂正はできない。","ハフマン符号はデータ圧縮のための可変長符号で、誤り訂正符号ではない。"],"https://www.youtube.com/watch?v=KKhVPfnYcKs","データを復元する「誤り制御」とは？【巡回符号】【ハミング符号】",""],["過去のデータも利用してチェックビットを付加し、誤り訂正を行う符号化方式は？","畳み込み符号","ブロック符号","ハフマン符号","グレイ符号","畳み込み符号は、現在の入力ビットだけでなく、過去のいくつかの入力ビットも使って符号を作る誤り訂正符号。ビタビ復号と組み合わせて、無線通信や衛星通信などで使われる。","https://e-words.jp/w/%E3%83%AA%E3%83%BC%E3%83%89%E3%82%BD%E3%83%AD%E3%83%A2%E3%83%B3%E7%AC%A6%E5%8F%B7.html","リードソロモン符号とは（IT用語辞典 e-Words）",["ブロック符号は一定長のブロックごとに独立して検査ビットを付ける符号で、過去のデータは使わない。","ハフマン符号は出現確率に応じた可変長の圧縮符号で、誤り訂正のための符号ではない。","グレイ符号は隣り合う値が1ビットだけ異なるように並べた符号で、エンコーダなどに使い誤り訂正はしない。"],"https://www.youtube.com/watch?v=KKhVPfnYcKs","データを復元する「誤り制御」とは？【巡回符号】【ハミング符号】","",["w:136_3","シフトレジスタを用いた畳み込み符号器",{"a":"Kirlf","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Conv_code_177_133.png"}]],["デジタル情報をより少ないビット数で符号化することを何というか？","データ圧縮","データ暗号化","データ量子化","データ多重化","データ圧縮は、データの冗長な部分を取り除いて、より少ないビット数で表すこと。元に完全に戻せる可逆圧縮（ZIP、PNGなど）と、人が気づきにくい情報を捨てて大きく圧縮する非可逆圧縮（JPEG、MP3など）がある。","https://e-words.jp/w/%E3%83%8F%E3%83%95%E3%83%9E%E3%83%B3%E7%AC%A6%E5%8F%B7.html","ハフマン符号とは（IT用語辞典 e-Words）",["データ暗号化は第三者に内容を読まれないよう変換する処理で、ビット数を減らす目的ではない。","量子化は連続値をとびとびの値に丸める処理で、すでにデジタルの情報を少ないビットにする操作の名前ではない。","データ多重化は複数の信号を1本の伝送路にまとめて送る技術で、ビット数を減らす符号化ではない。"],"https://www.youtube.com/watch?v=CjYa0WRCuFY","ランレングス法・ハフマン法のやり方をわかりやすく解説！",""],["同じ情報が連続する場合、その長さを符号化して圧縮する方式は？","ランレングス符号","ハフマン符号","LZ符号","算術符号","ランレングス符号は、同じ値が続く部分を「値と連続する数」で表す圧縮方法。例：AAAAABBB → A5B3。同じ色が続くFAXの画像や単純な図形の圧縮に向く。","https://e-words.jp/w/%E3%83%8F%E3%83%95%E3%83%9E%E3%83%B3%E7%AC%A6%E5%8F%B7.html","ハフマン符号とは（IT用語辞典 e-Words）",["ハフマン符号は出現確率が高い記号に短い符号を割り当てる方式で、連続の長さを符号化するものではない。","LZ符号は過去に出現した文字列を位置と長さで参照する辞書式の圧縮方式である。","算術符号はデータ全体を確率に応じて区間を細分した1つの数値で表す圧縮方式である。"],"https://www.youtube.com/watch?v=CjYa0WRCuFY","ランレングス法・ハフマン法のやり方をわかりやすく解説！","",["x:info1_44","連続する文字を個数で表すランレングス符号の例"]],["発生確率が高い情報ほど短い符号を与える符号化を何というか？","ハフマン符号","ランレングス符号","ハミング符号","グレイ符号","ハフマン符号は、出現する確率が高い記号ほど短い符号を、低い記号ほど長い符号を割り当てる可変長符号。全体の平均符号長が短くなり、データを圧縮できる。ZIPやJPEGの中でも使われている。","https://e-words.jp/w/%E3%83%8F%E3%83%95%E3%83%9E%E3%83%B3%E7%AC%A6%E5%8F%B7.html","ハフマン符号とは（IT用語辞典 e-Words）",["ランレングス符号は同じ値の連続を長さで表す圧縮方式で、出現確率に応じて符号長を変えるものではない。","ハミング符号は誤りの検出・訂正のための符号で、データを短くする方式ではない。","グレイ符号は隣り合う数値が1ビットだけ違うように並べた符号で、圧縮の機能はない。"],"https://www.youtube.com/watch?v=CjYa0WRCuFY","ランレングス法・ハフマン法のやり方をわかりやすく解説！","",["x:info1_45","出現確率の高い文字ほど短い符号を与えるハフマン符号"]],["時間的な周期波形は、基本周波数成分とその整数倍の成分の合成で表せる。これを何というか？","フーリエ級数","テイラー展開","ラプラス変換","z変換","フーリエ級数は、周期的な波形を、基本周波数の正弦波とその整数倍の周波数の正弦波（高調波）の和で表すもの。どんな周期波形も周波数成分に分解できることを示し、信号処理や振動解析の基礎になる。","https://manabitimes.jp/math/2280","フーリエ変換の意味と応用例（高校数学の美しい物語）",["テイラー展開は関数をある点のまわりでべき級数（多項式）の和で近似する方法で、周波数成分の分解ではない。","ラプラス変換は時間関数を複素数sの関数に変換する手法で、制御系の解析に使う。周期波形の級数表現ではない。","z変換は離散時間信号を扱う変換で、ディジタルフィルタなどの解析に使うもので、周期波形の級数展開ではない。"],"https://www.youtube.com/watch?v=ZibUbfrJ6LM","フーリエ変換とは？【高校生でもわかるフーリエ展開・フーリエ変換#2】","",["x:info1_46","波形を基本周波数とその整数倍の成分に分解した例"]],["コサイン関数を使い、標本化された信号を周波数成分の係数列に変換する方法は？","DCT（離散コサイン変換）","FFT","PCM","FFT（高速フーリエ変換）","DCT（Discrete Cosine Transform：離散コサイン変換）は、標本化した信号や画像を、コサイン波の周波数成分の係数に変換する方法。エネルギーが低い周波数に集まりやすいので、高い周波数の成分を省いて圧縮できる。JPEGやMPEGで使われる。","https://manabitimes.jp/math/2280","フーリエ変換の意味と応用例（高校数学の美しい物語）",["FFTはフーリエ変換を高速に計算するアルゴリズムで、コサインではなく複素指数関数（正弦波）を基底に使う。","PCMはアナログ信号を標本化・量子化・符号化してデジタル化する方式で、周波数成分への変換ではない。","FFT（高速フーリエ変換）は離散フーリエ変換の高速算法で、コサインのみを基底とするDCTとは別の手法である。"],"https://www.youtube.com/watch?v=ZibUbfrJ6LM","フーリエ変換とは？【高校生でもわかるフーリエ展開・フーリエ変換#2】",""],["デジタルの世界で1と0で表される情報のことを何というか？","符号（コード）","アナログ","キャラクタ","パケット","デジタルの世界では、情報を1と0の組合せである符号（コード）で表す。文字コード、命令コード、誤り訂正符号など、目的に応じてさまざまな符号の決め方がある。","https://e-words.jp/w/PCM.html","PCM（パルス符号変調）とは（IT用語辞典 e-Words）",["アナログは連続的に変化する量で情報を表すもので、1と0で表すデジタルの情報とは対照的である。","キャラクタは1つの文字を指す語で、1と0で表される情報一般の呼び名ではない。","パケットは通信で送るデータを一定の大きさに区切ったまとまりで、1と0の情報そのものの呼び名ではない。"],"https://www.youtube.com/watch?v=UrRfsRmVBTI","音のデジタル化とは（標本化・量子化・符号化）わかりやすく解説",""],["パルス符号変調の略は？","PCM","PWM","PAM","PPM","PCM（Pulse Code Modulation：パルス符号変調）は、アナログ信号を標本化・量子化・符号化して、デジタルのパルス列で表す方式。CDの音声（44.1kHz、16ビット）や電話のデジタル化に使われている。","https://e-words.jp/w/PCM.html","PCM（パルス符号変調）とは（IT用語辞典 e-Words）",["PWMはパルス幅変調の略で、パルスのオン時間の割合を変える方式である。","PAMはパルス振幅変調の略で、パルスの高さ（振幅）を信号に応じて変える方式である。","PPMはパルス位置変調の略で、パルスの位置（タイミング）を信号に応じてずらす方式である。"],"https://www.youtube.com/watch?v=UrRfsRmVBTI","音のデジタル化とは（標本化・量子化・符号化）わかりやすく解説","",["w:186_3","正弦波を4ビットで標本化・量子化した例",{"a":"不明","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Pcm.svg"}]],["演算処理はすべてレジスタ上で何と連携して行われるか？","ALU","DMA","UART","GPIO","CPUでの演算は、レジスタに置いたデータをALU（算術論理演算装置）に送り、ALUで加算や論理演算をして、結果をまたレジスタに戻すという流れで行われる。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["DMAはCPUを介さず周辺装置とメモリ間でデータを直接転送する仕組みで、演算は行わない。","UARTは非同期シリアル通信の送受信回路で、演算処理を担う装置ではない。","GPIOは入出力を切り替えて使える汎用の端子で、演算処理を担う装置ではない。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者","",["w:002_1","ALUの記号（入力A・B、機能選択F、結果R）",{"a":"en:User:Cburnett","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:ALU_symbol.svg"}]],["機械語をメモリに格納し、1つずつ取り出して解読・実行する方式のコンピュータは？","ノイマン型コンピュータ","ハーバード型コンピュータ","量子コンピュータ","データフロー型コンピュータ","ノイマン型コンピュータ（プログラム内蔵方式）は、プログラムを機械語としてデータと同じメモリに格納し、1命令ずつ順番に取り出して解読・実行する方式。現在のほとんどのコンピュータはこの方式。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["ハーバード型は命令用とデータ用でメモリ（バス）を分けた構成で、プログラム内蔵方式の改良形である。","量子コンピュータは量子ビットの重ね合わせを利用して計算する方式で、機械語を1つずつ実行する方式ではない。","データフロー型はデータがそろった命令から実行する方式で、命令を順番に取り出して実行するノイマン型とは異なる。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者","",["x:info1_51","プログラムカウンタなどノイマン型CPUの構成"]],["次に実行する機械語の番地を保持するレジスタは？","プログラムカウンタ","スタックポインタ","アキュムレータ","インデックスレジスタ","プログラムカウンタは、次に実行する命令が格納されているメモリの番地を保持するレジスタ。命令を取り出すたびに次の番地に進み、分岐命令ではジャンプ先の番地に書き換えられる。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["スタックポインタはスタックの最上位（現在位置）の番地を保持するレジスタで、次の命令の番地ではない。","アキュムレータは演算の対象や結果を一時的に保持するレジスタで、命令の番地は保持しない。","インデックスレジスタは配列の要素などのアドレス計算に使う値を保持するレジスタである。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["ノイマン型コンピュータで、命令を取り出すことと解読することをそれぞれ何というか？","フェッチ、デコード","デコード、フェッチ","ロード、ストア","プッシュ、ポップ","CPUの命令実行は、メモリから命令を取り出すフェッチ、命令の意味を解読するデコード、実行（エグゼキュート）の順に繰り返される。この流れを命令サイクルという。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["順序が逆である。デコードは命令の解読、フェッチは命令の取り出しを指す。","ロードはメモリからレジスタへデータを読み込む命令、ストアはレジスタからメモリへ書き込む命令である。","プッシュはスタックにデータを積む操作、ポップはスタックからデータを取り出す操作である。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者","",["x:info1_53","ノイマン型CPUのフェッチ・デコード・実行の流れ"]],["レジスタ構成、ALUの機能、割込みの仕組み、機械語体系などコンピュータの構成方法を何というか？","アーキテクチャ","プラットフォーム","ファームウェア","インターフェース","アーキテクチャは、コンピュータの基本的な設計・構成方法のこと。レジスタの構成、命令セット（機械語の体系）、アドレス指定方式、割込みの仕組みなどを含む。同じアーキテクチャなら同じ機械語プログラムが動く。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["プラットフォームはソフトウェアが動作する基盤となるハードやOSの環境を指し、CPUの構成方法そのものではない。","ファームウェアは機器のROMなどに書き込まれた機器制御用のソフトウェアで、構成方法を指す語ではない。","インターフェースは装置や人などの間で情報をやり取りする接点や取り決めで、コンピュータ全体の構成方法ではない。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["強力な命令を持ち、少ない命令数で複雑な計算をこなすプロセッサは？","CISC","RISC","DSP","GPU","CISC（Complex Instruction Set Computer）は、1つの命令で複雑な処理ができる強力な命令を多数もつプロセッサ。命令数が少なくて済み、メモリが高価だった時代に有利だった。インテルのx86系が代表。","https://edn.itmedia.co.jp/edn/articles/1404/07/news001.html","CISCとRISC、何が違う？Q&Aで学ぶマイコン講座（EDN Japan）",["RISCは命令を単純化して数を減らしたプロセッサで、複雑な命令で少ない命令数にする方式とは逆である。","DSPは積和演算回路を内蔵し信号処理に特化したプロセッサで、強力な命令を多数もつ方式の名前ではない。","GPUは画像処理や並列計算に特化した多数の演算器をもつプロセッサで、CISCとは分類の観点が異なる。"],"https://www.youtube.com/watch?v=Kh8s7wI6kzs","【A試験_ハードウェア】05. CPUの高速化",""],["命令体系を単純化して、パイプライン処理の効率を高めたプロセッサは？","RISC","CISC","DSP","ASIC","RISC（Reduced Instruction Set Computer）は、命令を単純な形にそろえて数を減らし、1命令を短い時間で実行できるようにしたプロセッサ。パイプライン処理の効率がよく、消費電力も小さい。ARMが代表。","https://edn.itmedia.co.jp/edn/articles/1404/07/news001.html","CISCとRISC、何が違う？Q&Aで学ぶマイコン講座（EDN Japan）",["CISCは複雑で強力な命令を多数もつプロセッサで、命令体系を単純化したものではない。","DSPは積和演算を高速に行う信号処理向けのプロセッサで、命令単純化の方式の名前ではない。","ASICは特定用途向けに設計した専用集積回路で、命令体系の方式を指す語ではない。"],"https://www.youtube.com/watch?v=Kh8s7wI6kzs","【A試験_ハードウェア】05. CPUの高速化","",["w:164_0","5段パイプラインで命令を重ねて実行する様子",{"a":"Inductiveload","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:5_Stage_Pipeline.svg"}]],["行列計算などに有効な積和演算回路を内蔵したプロセッサは？","DSP","CISC","RISC","MPU","DSP（Digital Signal Processor）は、デジタル信号処理に特化したプロセッサ。フィルタ計算やFFTに多い「掛けて足す」計算（積和演算）を1クロックで実行する専用回路をもつ。音声処理、モータ制御、通信機器などに使われる。","https://edn.itmedia.co.jp/edn/articles/1404/07/news001.html","CISCとRISC、何が違う？Q&Aで学ぶマイコン講座（EDN Japan）",["CISCは複雑な命令を多数もつ汎用プロセッサの方式で、積和演算回路の内蔵を特徴とするものではない。","RISCは命令を単純化してパイプライン効率を高めた方式で、積和演算専用回路を特徴とするものではない。","MPUはマイクロプロセッサ（CPUを1チップ化したもの）の総称で、積和演算に特化したものではない。"],"https://www.youtube.com/watch?v=Kh8s7wI6kzs","【A試験_ハードウェア】05. CPUの高速化",""],["演算結果に基づいて判断を行うために、その状態を保持する目的で設けられるものは？","フラグ","ポインタ","スタック","キュー","フラグは、演算結果がゼロか、桁上がりがあったか、負になったかなどの状態を記録しておくビット。後に続く条件分岐命令は、このフラグを見てジャンプするかどうかを判断する。","https://e-words.jp/w/%E3%82%B9%E3%83%86%E3%83%BC%E3%82%BF%E3%82%B9%E3%83%AC%E3%82%B8%E3%82%B9%E3%82%BF.html","ステータスレジスタ（フラグレジスタ）とは（IT用語辞典 e-Words）",["ポインタはデータが置かれたメモリの番地を格納する変数・レジスタで、演算結果の状態は保持しない。","スタックは後入れ先出しでデータを積むメモリ領域で、サブルーチンの戻り番地などの保存に使う。","キューは先入れ先出しでデータを扱う構造で、演算結果の状態を保持するものではない。"],"https://www.youtube.com/watch?v=AJURmYZp_ZQ","基本情報技術者試験対策 CPUの働き",""],["CPUの命令を1と0で表したものを何というか？","機械語","アセンブリ言語","高級言語","中間言語","機械語は、CPUが直接理解して実行できる、1と0の並びで表された命令。人が読み書きしにくいため、機械語に1対1で対応する記号（ニーモニック）で書くアセンブリ言語や、より人に分かりやすい高級言語が使われる。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["アセンブリ言語は機械語に1対1で対応するニーモニック（記号）で書く言語で、1と0そのものではない。","高級言語はCやPythonなど人に分かりやすい言語で、コンパイラなどで機械語に変換して実行する。","中間言語はJavaのバイトコードのように、高級言語と機械語の間に位置する表現である。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["命令自体にデータが含まれているものを何というか？","即値データ","直接アドレス","間接アドレス","ポインタ","即値データ（イミディエイトデータ）は、命令の中にデータそのものを直接書き込んだもの。メモリを読みに行く必要がないので速い。例：「レジスタに5を入れる」の5が即値。","https://e-words.jp/w/%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9%E6%8C%87%E5%AE%9A%E6%96%B9%E5%BC%8F.html","アドレス指定方式とは（IT用語辞典 e-Words）",["直接アドレスは命令にデータの置かれたメモリ番地を含む指定方法で、データそのものは含まない。","間接アドレスは番地を保持するレジスタやメモリを介してデータの場所を示す方法である。","ポインタはアドレスを格納する変数・レジスタで、命令の中にデータを含むものではない。"],"https://www.youtube.com/watch?v=zpshYnt0K2A","【プロセッサ】1.アドレス指定方式（基本情報技術者試験対策）","",["x:info1_60","命令の中にデータを含む即値データの例"]],["データの場所としてメモリの番地そのものを命令に含む指定方法を何というか？","直接アドレッシング","間接アドレッシング","即値アドレッシング","相対アドレッシング","直接アドレッシングは、命令の中にデータが置かれているメモリの番地をそのまま書く指定方法。番地を見ればすぐにデータの場所がわかる。","https://e-words.jp/w/%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9%E6%8C%87%E5%AE%9A%E6%96%B9%E5%BC%8F.html","アドレス指定方式とは（IT用語辞典 e-Words）",["間接アドレッシングは番地を保持するレジスタなどを指定してデータの場所を示す方法で、番地そのものは含まない。","即値アドレッシングは命令の中にデータそのものを含める方法で、番地を指定するものではない。","相対アドレッシングはプログラムカウンタなどの基準値からの差（オフセット）で番地を示す方法である。"],"https://www.youtube.com/watch?v=zpshYnt0K2A","【プロセッサ】1.アドレス指定方式（基本情報技術者試験対策）","",["x:info1_61","命令でメモリの番地を直接指定するアドレッシング"]],["データのアドレスを置いてあるレジスタを指定する、やや複雑なアドレス指定方法は？","間接アドレッシング","直接アドレッシング","即値アドレッシング","絶対アドレッシング","間接アドレッシング（レジスタ間接アドレッシング）は、データの番地を入れてあるレジスタを命令で指定し、そのレジスタの値を番地としてデータを読み書きする方法。レジスタの値を変えるだけで、配列の要素などを順に処理できる。","https://e-words.jp/w/%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9%E6%8C%87%E5%AE%9A%E6%96%B9%E5%BC%8F.html","アドレス指定方式とは（IT用語辞典 e-Words）",["直接アドレッシングは命令の中にメモリの番地をそのまま書く方法で、レジスタを介さない。","即値アドレッシングは命令の中にデータそのものを含める方法で、アドレスを指定する方法ではない。","絶対アドレッシングは命令に実際の番地をそのまま書く方法で、直接アドレッシングとほぼ同じ意味である。"],"https://www.youtube.com/watch?v=zpshYnt0K2A","【プロセッサ】1.アドレス指定方式（基本情報技術者試験対策）","",["x:info1_62","アドレスを置いたレジスタを指定する間接アドレッシング"]],["アドレスを入れておく変数・レジスタを何というか？","ポインタ","フラグ","カウンタ","バッファ","ポインタは、データそのものではなく、データが置かれているメモリの番地（アドレス）を格納する変数やレジスタ。C言語のポインタ変数や、CPUのスタックポインタなどがある。","https://e-words.jp/w/%E3%82%A2%E3%83%89%E3%83%AC%E3%82%B9%E6%8C%87%E5%AE%9A%E6%96%B9%E5%BC%8F.html","アドレス指定方式とは（IT用語辞典 e-Words）",["フラグは演算結果などの状態を記録するビットで、アドレスを入れておくものではない。","カウンタはパルスや回数を数える回路・変数で、アドレスを保持する目的のものではない。","バッファは速度差を吸収するためにデータを一時的にためておく記憶領域である。"],"https://www.youtube.com/watch?v=zpshYnt0K2A","【プロセッサ】1.アドレス指定方式（基本情報技術者試験対策）",""],["実行中の処理を一時中断して、より緊急度の高い処理を行う仕組みを何というか？","割込み","ポーリング","DMA","パイプライン","割込みは、外部装置からの要求や異常の発生などで、実行中のプログラムを一時中断し、緊急度の高い処理（割込み処理）を先に行う仕組み。処理が終わると、中断した所から元のプログラムを再開する。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["ポーリングはソフトウェアが周辺装置の状態を繰り返し読みに行く方式で、処理を中断させる仕組みではない。","DMAはCPUを介さずに周辺装置とメモリの間でデータを転送する仕組みである。","パイプラインは命令処理を段階に分けて重ねて実行する高速化の方式である。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["割込みを禁止することを何というか？","マスク","トラップ","ネスト","プリエンプション","マスク（割込みマスク）は、割込みを受け付けないように禁止すること。重要な処理を途中で中断されたくないときに使う。どうしてもマスクできない、最優先の割込みをNMI（ノンマスカブル割込み）という。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["トラップはソフトウェアが意図的に起こす割込みやOS呼び出しの仕組みで、割込みの禁止ではない。","ネストは割込み処理中にさらに優先度の高い割込みを受け付ける多重割込みのことである。","プリエンプションはOSが実行中のタスクを中断して別のタスクに切り替えることで、割込み禁止ではない。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["プログラムとは無関係に、周辺回路からの信号で発生する外部割込みを何というか？","割込み","例外","トラップ","システムコール","外部割込みは、タイマ、通信装置、キー入力など、CPUの外の周辺回路からの信号によって、実行中のプログラムとは無関係なタイミングで発生する割込み。一般に「割込み」というとこれを指す。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["例外はゼロ除算などプログラム自体が原因で起こる内部割込みで、周辺回路からの信号では発生しない。","トラップはプログラムが意図的に発生させるソフトウェア割込みで、外部の周辺回路とは関係しない。","システムコールはアプリケーションがOSの機能を呼び出す仕組みで、トラップ命令で実現される。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0","",["x:info1_66","外部要因で発生する割込みの流れ"]],["ゼロ除算などプログラムが原因で発生する内部割込みを何というか？","例外","割込み","ポーリング","リセット","例外（内部割込み）は、ゼロでの割り算、存在しない命令の実行、メモリ保護違反など、実行中のプログラムが原因で発生する割込み。発生するタイミングはプログラムの内容で決まる。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["割込み（外部割込み）はタイマなど周辺回路からの信号で発生するもので、プログラムが原因ではない。","ポーリングはソフトウェアが装置の状態を繰り返し確認する方式で、割込みの一種ではない。","リセットはCPUを初期状態に戻して最初から動作させる信号・操作で、プログラムの誤りが原因の割込みではない。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0","",["x:info1_67","実行結果が原因で発生する内部割込み（例外）"]],["アプリケーションからOSモードへ切り替えるために用意された特殊な機械語命令を何というか？","トラップ命令","ジャンプ命令","NOP命令","ストア命令","トラップ命令（ソフトウェア割込み命令）は、アプリケーションが意図的に割込みを起こして、OS（特権モード）の機能を呼び出すための特殊な機械語命令。ファイルの読み書きなど、OSの機能を使うシステムコールの実現に使われる。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["ジャンプ命令はプログラムの実行位置を別の番地に移す命令で、OSモードへの切り替えは行わない。","NOP命令は何もしない命令で、タイミング調整などに使い、モード切替の機能はない。","ストア命令はレジスタの内容をメモリに書き込む命令で、OSの機能を呼び出すものではない。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["割込み要因ごとの処理開始番地を一覧にした表を何というか？","ベクタテーブル","ページテーブル","ルーティングテーブル","ハッシュテーブル","ベクタテーブル（割込みベクタテーブル）は、割込みの要因ごとに、その処理プログラムの開始番地を並べた表。割込みが起こると、CPUはこの表を見て、対応する処理へジャンプする。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["ページテーブルは仮想記憶で論理アドレスと物理アドレスの対応を管理する表である。","ルーティングテーブルはネットワークでパケットの転送先（経路）を決めるための表である。","ハッシュテーブルはハッシュ値を使ってデータを高速に検索するためのデータ構造である。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0","",["x:info1_69","ベクタテーブルを使った割込み処理の手順"]],["割込みを使わず、ソフトウェアがハードの状態を絶えず読み込んで変化を確認する方式を何というか？","ポーリング","割込み","DMA","ハンドシェイク","ポーリングは、割込みを使わず、ソフトウェアが周辺装置の状態を一定間隔で何度も読みに行き、変化があったかを確認する方式。仕組みは単純だが、何も起きていない間もCPUの時間を消費し、応答も遅れやすい。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["割込みは周辺装置からの信号でCPUに処理を要求する方式で、ソフトウェアが状態を読みに行く方式とは逆である。","DMAはCPUを介さずに周辺装置とメモリ間でデータを転送する仕組みで、状態確認の方式ではない。","ハンドシェイクは送信側と受信側が信号を交換して準備完了を確認しながら転送する手順である。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["要因（イベント）が発生することで処理が進むシステムを何というか？","イベントドリブンシステム","バッチ処理システム","タイムシェアリングシステム","ポーリングシステム","イベントドリブン（イベント駆動）システムは、キー入力、タイマ、通信の受信などのイベントが発生したときに、それに応じた処理が動く方式。GUIや組込みシステムで多く使われる。決まった順番で処理を進めるバッチ処理と対照的。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["バッチ処理システムはデータをまとめて決まった順に一括処理する方式で、イベントに応じて動くものではない。","タイムシェアリングシステムはCPU時間を細かく区切って複数の利用者に割り当てる方式である。","ポーリングは装置の状態を定期的に読みに行って変化を確認する方式で、イベント発生で処理が進む方式とは異なる。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0","",["x:info1_71","要因の発生で処理が進むイベントドリブンシステム"]],["コンピュータの主記憶には大容量が必要なため、速度が遅めでも何が用いられるか？","DRAM","SRAM","ROM","フラッシュメモリ","DRAM（Dynamic RAM）は、コンデンサに電荷をためて記憶するメモリで、構造が簡単なので大容量・安価だが、電荷が漏れるので定期的なリフレッシュが必要で、SRAMより遅い。主記憶に使われる。キャッシュには高速なSRAMを使う。","https://edn.itmedia.co.jp/edn/articles/1303/25/news015.html","さまざまなメモリ・デバイス RAMとROMの進化（EDN Japan）",["SRAMはフリップフロップで記憶する高速なメモリだが、構造が複雑で高価なため主にキャッシュに使われる。","ROMは読出し専用の不揮発メモリで、プログラムの格納などに使い、読み書きする主記憶には向かない。","フラッシュメモリは電気的に書き換え可能な不揮発メモリで、SSDなどに使われ主記憶には使わない。"],"https://www.youtube.com/watch?v=1aRrWh6Mxog","RAM・DRAM・SRAM・ROMの違いとは？図解で分かりやすくメモリの種類を解説",""],["よく使うデータを低速メモリから高速メモリに移しておき、アクセスを速くする仕組みを何というか？","キャッシュ","バッファ","スワップ","仮想記憶","キャッシュ（キャッシュメモリ）は、CPUと主記憶の間に置く小容量で高速なメモリ。よく使うデータや命令をコピーしておき、次にアクセスするときに高速に読み出せるようにする。プログラムが同じ場所や近い場所をよく使う性質（局所性）を利用している。","https://e-words.jp/w/%E3%83%A9%E3%82%A4%E3%83%88%E3%83%90%E3%83%83%E3%82%AF%E3%82%AD%E3%83%A3%E3%83%83%E3%82%B7%E3%83%A5.html","ライトバックキャッシュとは（IT用語辞典 e-Words）",["バッファは装置間の速度差を吸収するためにデータを一時的にためておく領域で、再利用で高速化する仕組みではない。","スワップは主記憶の内容を補助記憶へ退避・復帰させる仮想記憶の操作で、むしろ低速になる。","仮想記憶は補助記憶を使って主記憶より大きなアドレス空間を提供する仕組みで、高速化が目的ではない。"],"https://www.youtube.com/watch?v=mGwdUQhKMWQ","初心者でもわかる！キャッシュメモリの仕組みや特徴を徹底解説","",["x:info1_73","2回目以降は高速メモリから読むキャッシュの仕組み"]],["通常はキャッシュのみに書き込み、必要になったときだけ主記憶に書き戻す方式を何というか？","ライトバック方式","ライトスルー方式","ライトアロケート方式","ダイレクトマップ方式","ライトバック方式は、書き込みをまずキャッシュだけに行い、そのデータがキャッシュから追い出されるときなど必要になったときに主記憶へ書き戻す方式。書き込みが速いが制御が複雑。キャッシュと主記憶に同時に書くのはライトスルー方式で、単純だが遅い。","https://e-words.jp/w/%E3%83%A9%E3%82%A4%E3%83%88%E3%83%90%E3%83%83%E3%82%AF%E3%82%AD%E3%83%A3%E3%83%83%E3%82%B7%E3%83%A5.html","ライトバックキャッシュとは（IT用語辞典 e-Words）",["ライトスルー方式はキャッシュと主記憶に同時に書き込む方式で、制御は単純だが書き込みは遅い。","ライトアロケート方式は書き込み時にキャッシュにないデータを主記憶からキャッシュへ読み込む方式である。","ダイレクトマップ方式は主記憶の各ブロックが入るキャッシュの位置を1か所に決める配置方式で、書き込み方式ではない。"],"https://www.youtube.com/watch?v=mGwdUQhKMWQ","初心者でもわかる！キャッシュメモリの仕組みや特徴を徹底解説","",["x:info1_74","ライトスルー方式とライトバック方式の違い"]],["命令をデコードしている間に次の命令をフェッチするように、並列に処理する方式は？","パイプライン","スーパースカラ","マルチコア","DMA","パイプラインは、命令の処理をフェッチ・デコード・実行などの段階に分け、流れ作業のように各段階を重ねて並行処理する方式。1命令の時間は同じでも、全体の処理速度が上がる。分岐命令があると流れが乱れて効率が落ちる。","https://itmanabi.com/cpu-basis/","CPUの実行サイクルと速度の関係（ITの学び）",["スーパースカラは複数のパイプラインで複数命令を同時に実行する方式で、段階の重ね合わせそのものではない。","マルチコアは1つのCPUに複数のコアを搭載する方式で、命令の段階を重ねる処理ではない。","DMAはCPUを介さずにデータを転送する仕組みで、命令処理を並列化する方式ではない。"],"https://www.youtube.com/watch?v=DRmDuAgIFDk","基本情報技術者試験対策 5 CPUの高速化 命令実行の手順 解説","",["x:info1_75","命令を段階ごとにずらして並列処理するパイプライン"]],["プロセッサ内に複数のパイプラインを用意して、複数の命令を並列に処理する方式は？","スーパースカラ","パイプライン","VLIW","マルチプロセッサ","スーパースカラは、プロセッサ内部に複数のパイプライン（実行ユニット）を持ち、同時に複数の命令を発行・実行する方式。1クロックで複数の命令を処理できるため、性能が上がる。","https://itmanabi.com/cpu-basis/","CPUの実行サイクルと速度の関係（ITの学び）",["パイプラインは1本の流れで命令の段階を重ねて処理する方式で、複数のパイプラインをもつことを指すものではない。","VLIWは複数の演算を1つの長い命令語にまとめ、並列化をコンパイラが決める方式である。","マルチプロセッサは複数のCPUを使う構成で、1つのプロセッサ内に複数パイプラインをもつ方式ではない。"],"https://www.youtube.com/watch?v=DRmDuAgIFDk","基本情報技術者試験対策 5 CPUの高速化 命令実行の手順 解説","",["x:info1_76","パイプラインを複数並列化したスーパースカラ"]],["命令用とデータ用でメモリ（バス）を分け、ノイマン型の欠点を解決したアーキテクチャは？","ハーバードアーキテクチャ","ノイマンアーキテクチャ","RISCアーキテクチャ","データフローアーキテクチャ","ハーバードアーキテクチャは、命令用のメモリとデータ用のメモリ（バス）を分けた構成。命令の読み込みとデータの読み書きを同時にできるので、ノイマン型の「バスの取り合い（ボトルネック）」を解消できる。DSPやマイコンに多い。","https://edn.itmedia.co.jp/edn/articles/1703/21/news021.html","ハーバードアーキテクチャって何？Q&Aで学ぶマイコン講座（EDN Japan）",["ノイマンアーキテクチャは命令とデータを同じメモリ・バスで扱う構成で、その欠点を解決したものではない。","RISCアーキテクチャは命令体系を単純化した方式で、命令用とデータ用のメモリを分けることとは別の観点である。","データフローアーキテクチャはデータがそろった命令から実行する方式で、メモリを分ける構成ではない。"],"https://www.youtube.com/watch?v=QGKNpo08DNY","【初心者向け】ノイマン型コンピュータのいろは","",["x:info1_77","命令用とデータ用のバスを分離した構成"]],["1つのボード上に複数のCPUを配置して処理能力を高めたシステムを何と呼ぶか？","マルチプロセッサ","マルチコアプロセッサ","スーパースカラ","クラスタ","マルチプロセッサは、1つのボード（システム）の上に複数のCPUを載せ、処理を分担させて能力を高めたシステム。サーバなど高い処理能力が必要なシステムで使われる。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%B3%E3%82%A2CPU.html","マルチコアCPU（マルチコアプロセッサ）とは（IT用語辞典 e-Words）",["マルチコアプロセッサは1つのCPUチップに複数のコアを載せたもので、ボード上に複数のCPUを置くものではない。","スーパースカラは1つのプロセッサ内に複数のパイプラインをもち複数命令を同時実行する方式である。","クラスタは複数のコンピュータをネットワークでつないで1つのシステムとして使う構成である。"],"https://www.youtube.com/watch?v=DRmDuAgIFDk","基本情報技術者試験対策 5 CPUの高速化 命令実行の手順 解説",""],["複数のコアを1つのCPUに搭載したものを何と呼ぶか？","マルチコアプロセッサ","マルチプロセッサ","スーパースカラ","ハイパースレッディング","マルチコアプロセッサは、1つのCPUチップの中に、演算を行う中核部分（コア）を複数搭載したもの。消費電力を抑えながら並列処理で性能を上げられるため、現在のパソコンやスマートフォンのCPUの主流。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%B3%E3%82%A2CPU.html","マルチコアCPU（マルチコアプロセッサ）とは（IT用語辞典 e-Words）",["マルチプロセッサは1つのボードやシステムに複数のCPUチップを載せた構成で、1チップ内に複数コアをもつものではない。","スーパースカラは1つのコア内で複数のパイプラインにより複数命令を同時に実行する方式である。","ハイパースレッディングは1つのコアを論理的に2つに見せて同時に複数スレッドを実行するインテルの技術である。"],"https://www.youtube.com/watch?v=DRmDuAgIFDk","基本情報技術者試験対策 5 CPUの高速化 命令実行の手順 解説",""],["CPU本体とともに搭載されるようになったタイマやシリアルなどのハードウェアを何と呼ぶか？","周辺回路","コア","キャッシュ","バス","マイコンには、CPU本体のほかに、タイマ、シリアル通信、A/D変換器、入出力ポートなどの周辺回路が1チップに内蔵されている。外付け部品を減らして、小型・低コストで機器を作れる。","https://edn.itmedia.co.jp/edn/articles/1402/21/news010.html","「クロック」数えて「パルス」を操る――タイマーの基本機能（EDN Japan）",["コアはCPU内部で命令を実行する中核部分で、タイマやシリアルなどの周辺ハードウェアではない。","キャッシュはCPUと主記憶の間に置く高速メモリで、タイマやシリアルのような周辺回路ではない。","バスはCPUと各装置を結ぶ信号線で、タイマやシリアル通信の機能そのものではない。"],"https://www.youtube.com/watch?v=ExSAVSZrB-s","組込み開発とは -タイマって何？-",""],["タイマで、カウンタの前段に設けてクロックを分周する回路を何と呼ぶか？","プリスケーラ","ウォッチドッグ","エンコーダ","マルチプレクサ","プリスケーラは、タイマのカウンタの前に置き、入力クロックを1/2、1/8、1/64などに分周する回路。カウンタが同じビット数でも、より長い時間を計れるようになる。","https://edn.itmedia.co.jp/edn/articles/1402/21/news010.html","「クロック」数えて「パルス」を操る――タイマーの基本機能（EDN Japan）",["ウォッチドッグはプログラムの暴走を検出してリセットをかけるタイマで、クロックの分周回路ではない。","エンコーダは入力を符号に変換する回路、または回転角を検出するセンサで、分周回路ではない。","マルチプレクサは複数の入力から1つを選んで出力する選択回路で、クロックを分周する回路ではない。"],"https://www.youtube.com/watch?v=ExSAVSZrB-s","組込み開発とは -タイマって何？-",""],["タイマとカウンタを連動させ、入力の変化時点のカウント値を記録する機能を何と呼ぶか？","インプットキャプチャ機能","アウトプットコンペア機能","PWM機能","ウォッチドッグ機能","インプットキャプチャ機能は、外部の入力信号が変化した瞬間のタイマのカウント値を自動的に記録する機能。2回の変化の値の差から、パルス幅や周期を正確に測れる。回転センサのパルス周期測定などに使う。","https://edn.itmedia.co.jp/edn/articles/1402/21/news010.html","「クロック」数えて「パルス」を操る――タイマーの基本機能（EDN Japan）",["アウトプットコンペア機能はカウント値が設定値と一致したときに出力を変化させる機能で、入力時点の記録ではない。","PWM機能はパルスのデューティ比を変えた波形を出力する機能で、入力の変化時点を記録するものではない。","ウォッチドッグ機能はプログラムの暴走を検出してリセットする機能で、入力の時点を記録しない。"],"https://www.youtube.com/watch?v=ExSAVSZrB-s","組込み開発とは -タイマって何？-","",["x:info1_82","入力端子のエッジでカウント値を記録する仕組み"]],["パルス幅を変化させて変調する波形を何と呼ぶか？","PWM波形","PCM波形","PAM波形","FM波形","PWM（Pulse Width Modulation：パルス幅変調）は、一定周期のパルスのオンの時間の割合（デューティ比）を変えて、平均の電力や電圧を制御する方式。モータの速度制御、LEDの明るさ調整、インバータなどに使われる。","https://edn.itmedia.co.jp/edn/articles/1402/21/news010.html","「クロック」数えて「パルス」を操る――タイマーの基本機能（EDN Japan）",["PCM波形はアナログ信号を標本化・量子化・符号化したパルス列で、パルス幅は変えない。","PAM波形はパルスの振幅（高さ）を信号に応じて変える波形で、幅は一定である。","FM波形は搬送波の周波数を信号に応じて変える周波数変調の波形で、パルス幅変調ではない。"],"https://www.youtube.com/watch?v=ExSAVSZrB-s","組込み開発とは -タイマって何？-","",["x:info1_83","カウンタ値の比較でPWM波形を作るしくみ"]],["CPUが外部と1ビットずつ情報交換するために搭載されているインターフェースは？","シリアルインターフェース","パラレルインターフェース","メモリインターフェース","グラフィックインターフェース","シリアルインターフェースは、CPU（マイコン）が外部の機器と1ビットずつ順番にデータをやり取りするための回路。少ない信号線で通信できるので、センサや他のマイコン、パソコンとの通信に使われる。","https://www.kumikomi.jp/serial-interface/","シリアル通信・シリアルインターフェースとは？種類・仕組みをわかりやすく解説（クミコミ）",["パラレルインターフェースは複数の信号線で複数ビットを同時に送る方式で、1ビットずつではない。","メモリインターフェースはCPUとメモリを接続するための回路で、外部機器と1ビットずつ通信するものではない。","グラフィックインターフェースは画面表示装置との接続や描画のための回路で、1ビットずつの情報交換が目的ではない。"],"https://www.youtube.com/watch?v=THBcBykksaQ","I2CとSPI 対デバイス通信の要！","",["w:193_0","パラレル伝送とシリアル伝送の比較",{"a":"AmenophisIII","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Serial_vs._parallel_transmission.svg"}]],["シリアル通信の代表例3つの組合せは？","UART、I2C、SPI","USB、HDMI、SATA","PCI、ISA、AGP","RS-232C、GPIB、SCSI","マイコンでよく使うシリアル通信は、非同期でパソコンなどとも通信できるUART、2本の線（クロックとデータ）で複数のICとつなげるI2C、4本の線で高速に通信できるSPIの3つ。","https://www.kumikomi.jp/serial-interface/","シリアル通信・シリアルインターフェースとは？種類・仕組みをわかりやすく解説（クミコミ）",["USB・HDMI・SATAはパソコンの周辺機器・映像・ストレージ接続用の規格で、マイコン内蔵の代表的なシリアル通信の組ではない。","PCI・ISA・AGPはパソコンの拡張カード用のパラレルバス規格で、シリアル通信ではない。","RS-232Cはシリアルだが、GPIBは計測器用、SCSIは周辺機器用のパラレルインターフェースである。"],"https://www.youtube.com/watch?v=THBcBykksaQ","I2CとSPI 対デバイス通信の要！","",["w:103_1","SPIのマスタと複数スレーブの接続",{"a":"en:User:Cburnett","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:SPI_three_slaves.svg"}]],["1と0を電圧レベルに変換して通信する、非同期シリアル通信の古典的な標準規格は？","RS-232C","I2C","SPI","USB","RS-232Cは、1と0を正負の電圧（±3〜15V程度）に変換して送る、非同期シリアル通信の古典的な標準規格。パソコンのCOMポートとして使われてきた。マイコンのUARTの信号を、変換ICでRS-232Cの電圧に変えて通信する。","https://www.kumikomi.jp/serial-interface/","シリアル通信・シリアルインターフェースとは？種類・仕組みをわかりやすく解説（クミコミ）",["I2Cはクロックとデータの2本線で複数のICと通信する同期式シリアル通信で、非同期の古典的規格ではない。","SPIはクロックを使う4線式の同期シリアル通信で、正負の電圧レベルで送る非同期規格ではない。","USBはパソコンと周辺機器を接続する比較的新しいシリアル規格で、古典的な非同期規格ではない。"],"https://www.youtube.com/watch?v=THBcBykksaQ","I2CとSPI 対デバイス通信の要！","",["x:info1_86","RS-232Cのスタートビット・データ・ストップビット"]],["データのフォーマット化やシリアル送受信動作を行う回路を何と呼ぶか？","UART","DMA","ALU","PLL","UART（Universal Asynchronous Receiver/Transmitter）は、パラレルのデータをシリアルに変換し、スタートビット・ストップビットなどを付けて送受信する回路。マイコンに内蔵されている非同期シリアル通信の回路。","https://www.kumikomi.jp/serial-interface/","シリアル通信・シリアルインターフェースとは？種類・仕組みをわかりやすく解説（クミコミ）",["DMAはCPUを介さずにデータを転送する仕組みで、シリアル送受信のフォーマット化は行わない。","ALUは算術演算や論理演算を行うCPU内部の装置で、通信回路ではない。","PLLは位相を同期させて入力に合わせた周波数のクロックを生成する回路で、シリアル送受信は行わない。"],"https://www.youtube.com/watch?v=THBcBykksaQ","I2CとSPI 対デバイス通信の要！","",["x:info1_87","UARTがパラレルとシリアルを変換して送受信"]],["入力にも出力にも切り替えて使える組込みCPUの汎用ポートを何と呼ぶか？","GPIO","ADC","UART","PWM","GPIO（General Purpose Input/Output：汎用入出力ポート）は、プログラムで入力用にも出力用にも切り替えて使える端子。スイッチの読み取りやLEDの点灯など、さまざまな用途に使える。","https://monoist.itmedia.co.jp/mn/articles/2408/29/news034_2.html","マイコンのI/Oの基本となる「GPIO」の使い方（MONOist）",["ADCはアナログ電圧をデジタル値に変換するA/D変換器で、入出力を切り替える汎用ポートではない。","UARTは非同期シリアル通信の送受信回路で、汎用の入出力ポートではない。","PWMはパルス幅を変えた波形を出力する機能で、入力にも出力にも使う汎用ポートではない。"],"https://www.youtube.com/watch?v=BJIVD2r_DGw","[LAPIS] マイコン豆知識 #14 GPIO、汎用ポート編1","",["w:045_4","マイコンボード上のGPIOピンヘッダ",{"a":"Nagababuarava","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:GPIO_%E0%B0%89%E0%B0%A8%E0%B1%8D%E0%B0%A8_%E0%B0%AD%E0%B0%BE%E0%B0%97%E0%B0%82_GPIO_Side.JPG"}]],["1でも0でもない（出力を切り離した）状態を何というか？","ハイインピーダンス（トライステート）","プルアップ","オープンコレクタ","ショート","ハイインピーダンス（Hi-Z）は、出力が1でも0でもなく、回路から電気的に切り離されたような状態。この状態をもつ出力をトライステート（3ステート）出力といい、複数の素子で1本のバスを共有するときに、使わない素子の出力をこの状態にする。","https://monoist.itmedia.co.jp/mn/articles/2408/29/news034_2.html","マイコンのI/Oの基本となる「GPIO」の使い方（MONOist）",["プルアップは信号線を抵抗で電源側につなぎ、何も接続されないときに1に固定する方法である。","オープンコレクタはトランジスタのコレクタを開放した出力形式で、外付け抵抗で1を作り複数出力を接続できる。","ショートは回路の2点が低抵抗で直接つながった短絡状態で、出力を切り離した状態とは逆である。"],"https://www.youtube.com/watch?v=BJIVD2r_DGw","[LAPIS] マイコン豆知識 #14 GPIO、汎用ポート編1","",["x:info1_89","入出力ポートのFET切り替えとハイインピーダンス"]],["CPUを介さずに、周辺装置が直接メモリにアクセスする仕組みを何というか？","DMA","割込み","ポーリング","キャッシュ","DMA（Direct Memory Access）は、CPUを介さずに、周辺装置とメモリの間で直接データを転送する仕組み。大量のデータ転送をDMAコントローラに任せることで、CPUはその間ほかの処理ができる。","https://e-words.jp/w/DMA.html","DMA（ダイレクトメモリアクセス）とは（IT用語辞典 e-Words）",["割込みは周辺装置がCPUに処理を要求する仕組みで、CPUを介さずにメモリにアクセスするものではない。","ポーリングはCPUが装置の状態を繰り返し確認する方式で、CPUの処理時間を使う。","キャッシュはよく使うデータを高速メモリにコピーしておく仕組みで、周辺装置の直接アクセスとは関係ない。"],"https://www.youtube.com/watch?v=d8BOvdQ79us","DMA（ダイレクトメモリアクセス）とは？（基本情報・応用情報試験対策）","",["x:info1_90","DMAなしとDMAありのデータ転送経路の比較"]],["CPUとDMAコントローラは、何という信号でバスの制御権を相互に移管するか？","HOLD信号","RESET信号","CLOCK信号","READY信号","DMAコントローラは、HOLD信号でCPUにバスの使用権を要求し、CPUはHOLDA（ホールドアクノリッジ）信号でバスを明け渡したことを知らせる。転送が終わると、バスの使用権はCPUに戻る。","https://e-words.jp/w/DMA.html","DMA（ダイレクトメモリアクセス）とは（IT用語辞典 e-Words）",["RESET信号はCPUを初期状態に戻すための信号で、バス制御権の受け渡しには使わない。","CLOCK信号は回路の動作タイミングをそろえる基準信号で、バス制御権の移管を表すものではない。","READY信号は低速なメモリや周辺装置が準備完了をCPUに知らせ、待ち（ウエイト）を入れるための信号である。"],"https://www.youtube.com/watch?v=d8BOvdQ79us","DMA（ダイレクトメモリアクセス）とは？（基本情報・応用情報試験対策）","",["x:info1_91","HOLD・HOLDA信号でバスの制御権を移す流れ"]],["電源を切ると消える主記憶に対し、長期保存のために使う大容量・不揮発の装置は？","補助記憶装置","キャッシュメモリ","レジスタ","DRAM","補助記憶装置は、電源を切っても内容が消えない、大容量の記憶装置。ハードディスク（HDD）、SSD、光ディスクなどがある。主記憶（RAM）は高速だが電源を切ると消えるため、プログラムやデータは補助記憶装置に保存しておく。","https://www.buffalo.jp/topics/select/detail/ssdhdd.html","【かんたん解説】SSDとは？HDDとの違いは？（バッファロー）",["キャッシュメモリはCPUと主記憶の間の高速・小容量の揮発性メモリで、長期保存用ではない。","レジスタはCPU内部の非常に小容量の高速記憶素子で、電源を切ると内容が消える。","DRAMは主記憶に使う揮発性メモリで、電源を切ると内容が消えるため長期保存には使えない。"],"https://www.youtube.com/watch?v=Dz3GkHczSQM","コンピューターの記憶装置（主記憶装置と補助記憶装置の違い、HDD、SSD）",""],["補助記憶装置の中で最も普及してきたものは何か？","ハードディスク","フロッピーディスク","磁気テープ","光磁気ディスク","ハードディスク（HDD）は、回転する磁気ディスクにヘッドで磁気的にデータを読み書きする補助記憶装置。容量あたりの価格が安く、長く補助記憶装置の主役だった。近年は高速で衝撃に強いSSDが普及している。","https://www.buffalo.jp/topics/select/detail/ssdhdd.html","【かんたん解説】SSDとは？HDDとの違いは？（バッファロー）",["フロッピーディスクは容量が小さく、かつて広く使われたが現在はほぼ使われていない。","磁気テープは大容量で安価だが順番にしか読み書きできず、主にバックアップ用途に限られる。","光磁気ディスク（MO）は光と磁気を使う記録媒体で、一時期使われたが広く普及するには至らなかった。"],"https://www.youtube.com/watch?v=Dz3GkHczSQM","コンピューターの記憶装置（主記憶装置と補助記憶装置の違い、HDD、SSD）","",["w:155_2","ハードディスク内部（プラッタとヘッド）",{"a":"RetroEditor","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:2.5_Inch_Hard_Drive_Mechanism.jpg"}]],["半導体メモリ素子を利用した補助記憶装置を何と呼ぶか？","SSD","HDD","DVD","MO","SSD（Solid State Drive）は、フラッシュメモリなどの半導体メモリを使った補助記憶装置。機械的に動く部分がないので、HDDより高速で、衝撃に強く、静か。書き換え回数に寿命があるのが注意点。","https://www.buffalo.jp/topics/select/detail/ssdhdd.html","【かんたん解説】SSDとは？HDDとの違いは？（バッファロー）",["HDDは回転する磁気ディスクにデータを記録する装置で、半導体メモリは使わない。","DVDはレーザ光で読み書きする光ディスクで、半導体メモリによる記憶装置ではない。","MOは光と磁気を組み合わせて記録する光磁気ディスクで、半導体メモリは使わない。"],"https://www.youtube.com/watch?v=Dz3GkHczSQM","コンピューターの記憶装置（主記憶装置と補助記憶装置の違い、HDD、SSD）","",["w:199_3","2.5インチSSDの外観",{"a":"D-Kuru","l":"CC BY-SA 3.0 at","u":"https://commons.wikimedia.org/wiki/File:Vertex_2_Solid_State_Drive_by_OCZ-top_oblique_PNr%C2%B00307.jpg"}]],["マウスで画面上のアイコンを操作するユーザインターフェースを何と呼ぶか？","GUI","CUI","API","IDE","GUI（Graphical User Interface）は、画面上のアイコンやウィンドウ、ボタンなどをマウスやタッチで操作するユーザインターフェース。直感的で、初心者でも使いやすい。","https://www.kagoya.jp/howto/it-glossary/develop/gui/","GUIとは何かわかりやすく解説！CUIとの違いは？（カゴヤのサーバー研究室）",["CUIはキーボードから文字でコマンドを入力する文字中心のインターフェースで、アイコン操作ではない。","APIはソフトウェアどうしが機能を呼び出すための取り決めで、人が操作するユーザインターフェースではない。","IDEはエディタやコンパイラ、デバッガなどをまとめたプログラム開発環境である。"],"https://www.youtube.com/watch?v=DV-zl0OnWto","ファイルディレクトリのパス指定問題・CUIとGUI",""],["キーボードで文字を入力する、文字中心のユーザインターフェースを何と呼ぶか？","CUI","GUI","NUI","VUI","CUI（Character User Interface）は、キーボードから文字でコマンドを入力し、結果も文字で表示されるユーザインターフェース。コマンドラインとも呼ばれる。操作を覚える必要があるが、作業の自動化や遠隔操作に向く。","https://www.kagoya.jp/howto/it-glossary/develop/gui/","GUIとは何かわかりやすく解説！CUIとの違いは？（カゴヤのサーバー研究室）",["GUIはアイコンやウィンドウをマウスなどで操作する図形中心のインターフェースである。","NUIはタッチやジェスチャ、音声など人の自然な動作で操作するインターフェースで、文字入力中心ではない。","VUIは音声で操作する音声ユーザインターフェースで、キーボードによる文字入力ではない。"],"https://www.youtube.com/watch?v=DV-zl0OnWto","ファイルディレクトリのパス指定問題・CUIとGUI",""],["アップル社のFireWireをベースとし、AV機器などとの接続を目的とした高速シリアルインターフェースは？","IEEE1394","USB","RS-232C","Bluetooth","IEEE1394は、アップル社が開発したFireWireをもとにIEEEが標準化した高速シリアルインターフェース。リアルタイム転送に強く、デジタルビデオカメラなどAV機器の接続に使われた。ソニーはi.LINKと呼んでいた。","https://e-words.jp/w/IEEE_1394.html","IEEE 1394（FireWire / i.LINK）とは（IT用語辞典 e-Words）",["USBはインテルなどが策定したパソコン周辺機器用の汎用シリアル規格で、FireWireがもとではない。","RS-232Cは低速な非同期シリアル通信の古典的規格で、AV機器向けの高速インターフェースではない。","Bluetoothは近距離無線通信の規格で、有線のFireWireをもとにした規格ではない。"],"https://www.youtube.com/watch?v=1VtWAKiNsvM","【ITパスポート解説講座】（5-14）入出力インタフェース（有線）","",["w:041_0","IEEE1394（FireWire）の4ピン・6ピンコネクタ",{"a":"Mikkel Paulson","l":"Public Domain","u":"https://commons.wikimedia.org/wiki/File:FireWire_cables.jpg"}]],["10進数の16を2進数で表すと？","10000","1111","10001","1000","16＝2⁴なので、2進数では1の後に0が4つ並ぶ10000。2進数の位は右から1、2、4、8、16…となる。15は1111、17は10001。","https://e-words.jp/w/2%E9%80%B2%E6%95%B0.html","2進数とは（IT用語辞典 e-Words）",["1111は10進数の15（8＋4＋2＋1）で、16より1小さい。","10001は10進数の17（16＋1）で、16より1大きい。","1000は10進数の8（2³）で、16を表すには0がもう1つ必要である。"],"https://www.youtube.com/watch?v=r42M7tfZo8k","【基本情報】2進数による符号化を解説！ビットとバイトの違い",""],["符号付き8ビット（2の補数）で表現できない整数はどれか？","128","−128","127","0","符号付き8ビット（2の補数）で表せるのは−128〜＋127。128は表せない（10000000は−128になる）。nビットの2の補数では−2ⁿ⁻¹〜2ⁿ⁻¹−1が範囲。","https://atmarkit.itmedia.co.jp/ait/articles/0505/31/news103.html","2進数を理解しよう：基本情報技術者試験講座（@IT）",["−128は符号付き8ビットで表せる最小値で、10000000で表現できる。","127は符号付き8ビットで表せる最大値で、01111111で表現できる。","0は00000000で表現でき、符号付き8ビットの範囲内である。"],"https://www.youtube.com/watch?v=LUrGJG1lLKU","2の補数の問題 #基本情報技術者試験","",["x:info1_25","8ビット符号付き整数は−128〜+127の範囲"]],["縦横にドットを配置した2次元コードは何か？","QRコード","バーコード（JAN）","カラーコード","ハミングコード","QRコードは、デンソーウェーブが開発した、縦と横の両方向に情報をもつ2次元コード。1次元のバーコードより多くの情報を記録でき、3隅の位置検出パターンでどの向きからでも高速に読み取れる。リードソロモン符号で汚れにも強い。","https://www.qrcode.com/about/error_correction.html","誤り訂正機能について（QRコードドットコム／デンソーウェーブ）",["JANコードは太さの違う縦線を横一列に並べた1次元のバーコードで、縦横にドットを配置したものではない。","カラーコードは抵抗器の値などを色の帯で表す表示方法で、2次元コードではない。","ハミングコードは1ビット誤りを訂正する誤り訂正符号で、印刷して読み取るコードではない。"],"https://www.youtube.com/watch?v=NwLSnzQvXoY","QRコードの仕組み","",["w:094_0","QRコードの構造（位置検出パターン等）",{"a":"Zephyris","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:QR_Code_Structure_Example_2.svg"}]]]},{"id":"info2","title":"情報 1-3 プログラミング・2-1 システム構成・2-2 システム開発","cat":"情報","q":[["データとともに、他のデータを指し示す情報を持たせたデータ構造を何というか？","リスト","配列","スタック","キュー","リスト（連結リスト）は、各データに次のデータの場所を指すポインタを持たせ、鎖のようにつないだデータ構造。途中への挿入や削除がポインタの付け替えだけで済むのが利点。ただし、n番目の要素に直接アクセスできず、先頭から順にたどる必要がある。","https://itmanabi.com/data_array/","データ構造における配列とリストの違い（ITの学び）",["配列は同じ型のデータを連続した領域に並べ、添字で直接アクセスする構造であり、次のデータを指すポインタは持たない。","スタックは後入れ先出しでデータを出し入れする構造であり、各データが他のデータを指し示す情報を持つことは特徴ではない。","キューは先入れ先出しの待ち行列であり、データの出し入れの順序を定めた構造で、指し示す情報を持たせる構造そのものではない。"],"https://www.youtube.com/watch?v=WoXBOaEbtv8","【ITパスポート】データ構造（変数、配列、キュー、スタック、木構造）","",["x:info2_1","単方向リストと双方向リスト（ポインタでつなぐ）"]],["木構造で、最上位のノード・子がないノード・親と子を結ぶ線をそれぞれ何と呼ぶか？","ルート、リーフ、ブランチ","リーフ、ルート、ブランチ","ルート、ブランチ、リーフ","ノード、エッジ、パス","木構造で、一番上の根元のノードをルート（根）、子をもたない末端のノードをリーフ（葉）、ノードどうしを結ぶ線をブランチ（枝、エッジ）という。ファイルのディレクトリ構造や組織図が木構造の例。","https://itmanabi.com/data_array/","データ構造における配列とリストの違い（ITの学び）",["リーフとルートの順序が逆である。最上位のノードがルート、子がない末端のノードがリーフである。","2番目と3番目が逆である。ブランチはノードを結ぶ線、リーフは子を持たない末端のノードを指す。","ノードは木やグラフの節点全般、エッジは辺、パスはノードをたどる経路の呼び名で、最上位や末端を区別する用語ではない。"],"https://www.youtube.com/watch?v=WoXBOaEbtv8","【ITパスポート】データ構造（変数、配列、キュー、スタック、木構造）","",["x:info2_2","木構造のルート・ブランチ・リーフ"]],["pushとpopで、データを積み上げて利用するデータ構造を何というか？","スタック","キュー","リスト","ヒープ","スタックは、データを上に積み重ね（push）、取り出すときは一番上から取る（pop）データ構造。関数呼び出しの戻り先の保存、割込み時のレジスタ退避、式の計算などに使われる。","https://itmanabi.com/queue-stack/","キューとスタックって何？データ構造と使い方（ITの学び）",["キューは後ろに追加して先頭から取り出す先入れ先出しの構造で、エンキューとデキューで操作する。","リストは各データにポインタを持たせて鎖状につなぐ構造で、積み上げて上から取り出す構造ではない。","ヒープは親が子より常に大きい（小さい）木構造、またはプログラム実行中に動的に確保するメモリ領域を指す。"],"https://www.youtube.com/watch?v=TC6-M4FxYzE","【優しいIT】キューとスタック！データ構造の話だよ！","",["x:info2_3","スタックのPUSHとPOP（上から出し入れ）"]],["データを続けてpushした後、続けてpopすると入れたときと逆順で出てくることを何というか？","LIFO","FIFO","LRU方式","LRU","LIFO（Last In First Out：後入れ先出し）は、最後に入れたデータが最初に出てくる方式で、スタックの性質。お皿を積み重ねて、上から取っていくイメージ。","https://itmanabi.com/queue-stack/","キューとスタックって何？データ構造と使い方（ITの学び）",["FIFOは先入れ先出しで、入れた順と同じ順に出てくるキューの性質である。","LRU方式はキャッシュやページ置換で、最も長く使われていないものを追い出す方式であり、データの出し入れ順序の名称ではない。","LRU（Least Recently Used）は最後に使われてから最も時間が経ったデータを置き換える考え方で、スタックの性質とは無関係である。"],"https://www.youtube.com/watch?v=TC6-M4FxYzE","【優しいIT】キューとスタック！データ構造の話だよ！","",["x:info2_3","スタックは最後に入れたものが最初に出る（LIFO）"]],["処理を待たせる目的で使われる、列を表すデータ構造を何というか？","キュー","スタック","木","グラフ","キュー（待ち行列）は、データを列の後ろに追加（エンキュー）し、先頭から取り出す（デキュー）データ構造。処理を到着順に待たせるときに使い、プリンタの印刷待ちやOSのタスク管理などで使われる。","https://itmanabi.com/queue-stack/","キューとスタックって何？データ構造と使い方（ITの学び）",["スタックは後入れ先出しで、最後に入れたデータから取り出す構造であり、到着順に待たせる用途には向かない。","木はルートから枝分かれする階層構造で、ディレクトリ構造などを表すのに使い、待ち行列ではない。","グラフはノードとエッジで任意のつながりを表す構造で、路線図や通信網の表現に使い、列を表すものではない。"],"https://www.youtube.com/watch?v=TC6-M4FxYzE","【優しいIT】キューとスタック！データ構造の話だよ！","",["x:info2_5","キューのエンキューとデキュー"]],["エンキューした後にデキューすると、入れたときと同じ順で出てくることを何というか？","FIFO","LIFO","LRU","FILO","FIFO（First In First Out：先入れ先出し）は、最初に入れたデータが最初に出てくる方式で、キューの性質。お店のレジに並ぶ行列と同じ。","https://itmanabi.com/queue-stack/","キューとスタックって何？データ構造と使い方（ITの学び）",["LIFOは後入れ先出しで、入れたときと逆順に出てくるスタックの性質である。","LRUは最も長く使われていないデータを置き換えるキャッシュなどの置換方式で、出し入れの順序の性質ではない。","FILO（First In Last Out）は最初に入れたものが最後に出る方式で、LIFOと同じくスタックの性質を表す。"],"https://www.youtube.com/watch?v=TC6-M4FxYzE","【優しいIT】キューとスタック！データ構造の話だよ！","",["x:info2_5","キューは先に入れたものが先に出る（FIFO）"]],["問題を解く考え方や手順を明確に示したものを何というか？","アルゴリズム","フローチャート","プロトコル","アーキテクチャ","アルゴリズムは、問題を解くための考え方や処理手順を、明確に定めたもの。同じ問題でもアルゴリズムによって処理時間や必要なメモリが大きく変わる。フローチャートやPADは、アルゴリズムを図で表す手段。","https://products.sint.co.jp/blog/algorithm-type","ソートアルゴリズムとは？アルゴリズム学習のはじめの一歩（システムインテグレータ）",["フローチャートは処理の流れを記号と矢印で図示したもので、アルゴリズムを表す手段であってアルゴリズムそのものではない。","プロトコルは通信を行うための手順や形式の取り決めで、問題を解く手順のことではない。","アーキテクチャはコンピュータやシステムの基本的な構成・設計思想を指し、問題を解く手順のことではない。"],"https://www.youtube.com/watch?v=hOmwMz86UME","【ITパスポート解説講座】（4-5）アルゴリズムとフローチャート",""],["多くのデータを値の大きさで並べ替えることを何というか？","ソート","探索","マージ","ハッシュ","ソート（整列）は、データを値の大きい順または小さい順に並べ替える処理。バブルソート、選択ソート、挿入ソート、クイックソート、マージソートなどがあり、データ量が多いほど速いアルゴリズムの選択が重要になる。","https://products.sint.co.jp/blog/algorithm-type","ソートアルゴリズムとは？アルゴリズム学習のはじめの一歩（システムインテグレータ）",["探索は多くのデータの中から目的のデータを探し出す処理で、並べ替えではない。","マージは整列済みの複数のデータ列を1つにまとめる処理で、マージソートの一部として使われるが並べ替え全般の名称ではない。","ハッシュはデータからハッシュ関数で固定長の値を求めることで、高速な探索や改ざん検出に使われる。"],"https://www.youtube.com/watch?v=hOmwMz86UME","【ITパスポート解説講座】（4-5）アルゴリズムとフローチャート","",["x:info2_8","バブルソート（隣どうしを比較・交換）"]],["データの中から条件を満たすものを探し出すアルゴリズムを何というか？","探索","ソート","再帰","圧縮","探索は、多くのデータの中から目的のデータを探すアルゴリズム。先頭から順に調べる線形探索、整列済みデータを半分ずつ絞り込む二分探索、ハッシュ値で直接探すハッシュ探索などがある。","https://products.sint.co.jp/blog/algorithm-type","ソートアルゴリズムとは？アルゴリズム学習のはじめの一歩（システムインテグレータ）",["ソートはデータを値の大小順に並べ替える処理で、条件に合うデータを探し出すものではない。","再帰は処理や定義の中で自分自身を使うことで、探索の実装手段にはなるが探索そのものの名称ではない。","圧縮はデータの冗長性を取り除いて容量を小さくする処理で、データを探し出すアルゴリズムではない。"],"https://www.youtube.com/watch?v=hOmwMz86UME","【ITパスポート解説講座】（4-5）アルゴリズムとフローチャート","",["x:info2_9","二分探索（中央で二分して範囲を絞る）"]],["あるものの定義の中に、そのもの自体を含むことを何というか？","再帰","反復","継承","多態性","再帰は、ある処理や定義の中で、自分自身を使うこと。プログラムでは関数が自分自身を呼び出す（再帰呼び出し）。階乗（n!＝n×(n−1)!）や木構造の処理などを簡潔に書ける。終了条件がないと無限に呼び出してしまう。","https://wa3.i-3-i.info/word14900.html","再帰関数とは（分かりそうで分からないIT用語辞典）",["反復は同じ処理をループで繰り返すことで、定義の中に自分自身を含むわけではない。","継承はオブジェクト指向で既存のクラスの性質を受け継いで新しいクラスを作ることである。","多態性（ポリモーフィズム）は同じ呼び出しに対しオブジェクトごとに異なる振る舞いをすることである。"],"https://www.youtube.com/watch?v=Gzv76-kIoUs","【アルゴリズム】再帰(後編)再帰的アルゴリズム","",["x:info2_10","再帰関数の例（nの階乗）"]],["代表的な構造化チャートはどれか？","PAD","PERT","UML","ER図","PAD（Problem Analysis Diagram）は、日本で開発された構造化チャート。順次・選択・繰り返しの構造を、左から右、上から下への階層で表す。フローチャートより構造が見やすく、プログラムへ変換しやすい。","https://e-words.jp/w/%E3%83%95%E3%83%AD%E3%83%BC%E3%83%81%E3%83%A3%E3%83%BC%E3%83%88.html","フローチャート（流れ図）とは（IT用語辞典 e-Words）",["PERTはアローダイアグラムで作業の順序と日程を管理する工程管理手法で、プログラムの構造化チャートではない。","UMLはオブジェクト指向設計で使う統一モデリング言語で、構造化チャートとは異なる。","ER図はデータベース設計でエンティティ（実体）とリレーションシップ（関連）を表す図である。"],"https://www.youtube.com/watch?v=2xg5pVL_mlg","【はじめてのアルゴリズム】表現方法：フローチャート・アクティビティ図・状態遷移図","",["x:info2_11","構造化チャートPADの順次・繰返し・選択"]],["ソフトウェアの構成要素として、まとまった処理の塊を何と呼ぶか？","モジュール、サブルーチン","ライブラリ、カーネル","スレッド、タスク","オブジェクト、インスタンス","モジュールやサブルーチンは、まとまった処理をひとかたまりにした、プログラムの構成要素（部品）。処理を分割して部品化すると、作りやすく、テストしやすく、再利用しやすくなる。","https://itmanabi.com/program-structured-design/","プログラム構造化設計とモジュールの独立性（ITの学び）",["ライブラリは再利用できる処理を集めた部品集、カーネルはOSの中核部分で、まとまった処理の塊そのものの呼び名ではない。","スレッドやタスクはOSから見たプログラムの実行単位で、ソフトウェアの構成部品の呼び名ではない。","オブジェクトはデータと操作をまとめたもの、インスタンスはクラスから生成された実体で、オブジェクト指向の用語である。"],"https://www.youtube.com/watch?v=sYW09_8IwvA","【過去問解説】基本情報技術者試験 令和元年 秋期 問46【モジュール結合度】",""],["ソースコードの品質で、修正のしやすさを表す要素は？","保守性","可読性","移植性","信頼性","保守性は、プログラムを後から修正・変更・拡張するときのしやすさ。読みやすいコード、適切なモジュール分割、コメントや文書の整備で高められる。ソフトウェアのライフサイクルでは、開発後の保守にかかる費用が大きい。","https://www.qbook.jp/column/1790.html","ソフトウェアの品質特性とは？9つの品質特性と副特性（Qbook）",["可読性はソースコードの読みやすさで、保守性を高める要因の1つだが修正のしやすさそのものではない。","移植性は異なるハードウェアやOSへ移しても動作させやすい度合いである。","信頼性は故障や誤動作なく、決められた機能を継続して発揮できる度合いである。"],"https://www.youtube.com/watch?v=k_1wtTl1Aek","【ITパスポート】開発プロセス、機能要件、ソフトウェア品質特性",""],["ある事柄に関連する情報と操作を1つのかたまりとして扱う考え方は？","オブジェクト指向","構造化プログラミング","手続き型プログラミング","関数型プログラミング","オブジェクト指向は、ある事柄に関するデータ（属性）と、それを扱う操作（メソッド）を1つのかたまり（オブジェクト）として扱う考え方。現実のものに近い形でプログラムを組み立てられ、部品の再利用もしやすい。","https://www.sejuku.net/blog/5973","オブジェクト指向とは？基礎知識をわかりやすく解説（侍エンジニアブログ）",["構造化プログラミングは順次・選択・繰り返しの3つの基本構造でプログラムを組み立てる考え方である。","手続き型プログラミングは処理の手順を命令の並びとして記述する方式で、データと操作を一体化しない。","関数型プログラミングは関数の組合せで計算を表し、状態の変更を避ける考え方である。"],"https://www.youtube.com/watch?v=mwgbN5vZuY4","オブジェクト指向プログラミングを学ぶ（基本情報技術者試験）",""],["要求仕様の変更に機敏に対応し、コーディングとテストを重視してソフトウェアを迅速に提供する開発方法は？","アジャイル開発","ウォーターフォール開発","V字モデル開発","プロトタイプ開発","アジャイル開発は、短い期間（1〜4週間程度）で設計・実装・テストを繰り返し、動くソフトウェアを少しずつ提供していく開発手法。顧客と密に協力し、仕様変更に素早く対応できる。スクラムやXPが代表。","https://www.kagoya.jp/howto/it-glossary/develop/what-is-agile/","【図解】アジャイル開発とは？具体的な進め方（カゴヤのサーバー研究室）",["ウォーターフォール開発は上流から下流へ工程を順に進め、原則として後戻りしないため仕様変更に弱い。","V字モデルは開発の各工程とテスト工程を対応させたモデルで、ウォーターフォールを発展させたものである。","プロトタイプ開発は試作品を作って利用者に確認してもらい、要求を明確にしていく開発方法である。"],"https://www.youtube.com/watch?v=fSjyJFlHfGY","【第28回】ITパスポート試験対策講座（アジャイル開発）","",["w:125_0","小さなリリースを短い周期で繰り返すアジャイル開発",{"a":"Steveprutz","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Agile_software_development_release_early_and_often.jpg"}]],["記述と実行を比較的簡単に行える簡易言語は何と呼ばれるか？","スクリプト言語","アセンブリ言語","機械語","マークアップ言語","スクリプト言語は、コンパイルせずに書いてすぐ実行できる、記述が簡単な言語。Python、JavaScript、Ruby、シェルスクリプトなど。作業の自動化やWeb開発、データ処理に広く使われる。","https://www.sejuku.net/blog/143201","プログラミング言語を3つの方法で分類（侍エンジニアブログ）",["アセンブリ言語は機械語の命令をニーモニックで表した低水準言語で、ハードウェアの知識が必要で簡易ではない。","機械語はCPUが直接実行する0と1の命令列で、人が記述するのは難しい。","マークアップ言語はタグで文書の構造や書式を指定する言語で、処理を記述して実行する言語ではない。"],"https://www.youtube.com/watch?v=gllnXHY2ZAw","スクリプトとは（コンパイラ方式とインタプリタ方式）",""],["機械語の1と0の命令の意味を暗示するような文字列（ニーモニック）で記述する言語は？","アセンブリ言語","スクリプト言語","コンパイル言語","マークアップ言語","アセンブリ言語は、機械語の命令を、意味がわかる短い記号（ニーモニック、例：MOV、ADD）で表した言語。機械語と1対1に対応し、ハードウェアを直接細かく制御できる。アセンブラで機械語に変換する。","https://www.sejuku.net/blog/143201","プログラミング言語を3つの方法で分類（侍エンジニアブログ）",["スクリプト言語はコンパイルせずにすぐ実行できる簡易な高水準言語で、ニーモニックは使わない。","コンパイル言語はC言語など抽象的な表現で書いてコンパイラで変換する言語で、機械語と1対1には対応しない。","マークアップ言語はタグで文書の構造や書式を定義する言語で、機械語命令を表すものではない。"],"https://www.youtube.com/watch?v=gllnXHY2ZAw","スクリプトとは（コンパイラ方式とインタプリタ方式）","",["x:info2_17","機械語とアセンブリ言語（ニーモニック）の対応"]],["文書の書式や構造を定義するための言語は？","マークアップ言語","スクリプト言語","アセンブリ言語","モデリング言語","マークアップ言語は、文章の中に「タグ」を書き込んで、見出し・段落・リンクなど文書の構造や書式を指定する言語。HTML（Webページ）、XML（データの記述）が代表。","https://www.sejuku.net/blog/143201","プログラミング言語を3つの方法で分類（侍エンジニアブログ）",["スクリプト言語はコンパイルせずに書いてすぐ実行できる簡易なプログラミング言語である。","アセンブリ言語は機械語の命令をニーモニックで記述する低水準のプログラミング言語である。","モデリング言語はUMLのように、システムを特定の視点から図や記号で表現するための言語である。"],"https://www.youtube.com/watch?v=gllnXHY2ZAw","スクリプトとは（コンパイラ方式とインタプリタ方式）",""],["基本ソフトとも呼ばれ、コンピュータを利用しやすくする機能を支えるソフトウェアは？","OS","ミドルウェア","ユーティリティ","デバイスドライバ","OS（Operating System：基本ソフト）は、ハードウェアを管理し、アプリケーションが使いやすい環境を提供するソフトウェア。メモリ管理、タスク管理、ファイル管理、入出力管理などを行う。Windows、Linux、macOS、組込み用のITRONなど。","https://itmanabi.com/operating_system/","OSのキホンの役割と位置付け、種類（ITの学び）",["ミドルウェアはOSとアプリケーションの中間で、DBMSなど多くのアプリに共通する機能を提供するソフトウェアである。","ユーティリティはファイル圧縮やエディタなど、OSの機能を補う補助的なプログラムである。","デバイスドライバは個々の周辺機器を制御してOSから使えるようにするプログラムで、OSの一部として働く。"],"https://www.youtube.com/watch?v=heIWqSBN1IQ","【ITパスポート解説講座】（6-1）OS（オペレーティングシステム）","",["x:info2_19","アプリケーション・OS・ハードウェアの関係"]],["ハードウェアの違いを吸収し、アプリケーションに提供される論理的インターフェースを何と呼ぶか？","API","GUI","BIOS","IDE","API（Application Programming Interface）は、OSやライブラリなどが、アプリケーションに機能を提供するための呼び出し方の取り決め。ハードウェアの違いを吸収するので、アプリはAPIを呼ぶだけで、さまざまな機器を同じように扱える。","https://www.sbbit.jp/article/cont1/62752","APIとは何か？図解で仕組みをやさしく解説（ビジネス+IT）",["GUIはアイコンやウィンドウを使い、マウス操作で人がコンピュータを使えるようにする利用者向けの画面インターフェースである。","BIOSは電源投入時にハードウェアを初期化してOSを起動する基本的なプログラムである。","IDEはエディタやコンパイラ、デバッガなどをまとめた統合開発環境である。"],"https://www.youtube.com/watch?v=JG2i9mwITIo","APIってなに？初心者でもわかるAPIの仕組みと使い方を4分で解説",""],["C言語のプリプロセッサとはどういうものか？","プログラマとコンパイラの仲立ちをするもの","機械語を実行するもの","OSとハードの仲立ちをするもの","プログラムを1行ずつ解釈・実行するもの","C言語のプリプロセッサは、コンパイルの前にソースコードを下処理するプログラム。#includeでファイルを取り込み、#defineでマクロを展開し、#ifdefで条件付きコンパイルを行う。プログラマが書いたものをコンパイラが処理しやすい形に整える仲立ち役。","https://atmarkit.itmedia.co.jp/ait/articles/1309/17/news007_3.html","プリプロセッサでプログラムの質を向上させよう 目指せ！Cプログラマ（@IT）",["機械語を実行するのはCPUであり、プリプロセッサはコンパイル前のソースコードを下処理するだけである。","OSとハードウェアの仲立ちをするのはデバイスドライバやBIOSなどである。","プログラムを1行ずつ解釈・実行するのはインタプリタであり、C言語のプリプロセッサの役割ではない。"],"https://www.youtube.com/watch?v=IcSZsWOK3Ps","C言語入門 レッスン9 プリプロセッサ命令","",["x:info2_21","プリプロセッサによる#defineの置換"]],["家電や産業機械に組み込まれ、処理時間制限に対応できる国産のリアルタイムOSは？","ITRON","Windows","Linux","MS-DOS","ITRONは、日本のTRONプロジェクトで生まれた組込み機器向けのリアルタイムOSの仕様。家電、自動車、産業機器、デジカメなど多くの製品に採用されている。μITRONなどの仕様がある。","https://www.kumikomi.jp/rtos_beginner1/","初心者でもわかるRTOS開発入門（クミコミ）",["Windowsは米国マイクロソフト社のパソコン向け汎用OSで、国産でもリアルタイムOSでもない。","Linuxはフィンランドで生まれたオープンソースの汎用OSで、国産のリアルタイムOSではない。","MS-DOSはマイクロソフト社の初期のパソコン用シングルタスクOSで、国産のリアルタイムOSではない。"],"https://www.youtube.com/watch?v=8M4xXefOP8Q","リアルタイムOSによる組込みシステム開発技術（FreeRTOS編）",""],["OSの中心部分で、CPUなどのリソースを管理し、アプリにAPIを提供するものは？","カーネル","シェル","ミドルウェア","ユーティリティ","カーネルは、OSの中心部分で、CPU時間・メモリ・入出力などのリソースを管理し、アプリケーションにシステムコールやAPIを提供する。タスクの切り替えや割込み処理などもカーネルが行う。","https://itmanabi.com/operating_system/","OSのキホンの役割と位置付け、種類（ITの学び）",["シェルは利用者のコマンドを受け取ってカーネルに伝える、OSと人との窓口となるプログラムである。","ミドルウェアはOSとアプリケーションの中間に位置し、共通機能を提供するソフトウェアである。","ユーティリティはエディタや圧縮ツールなど、OSを補う補助的なプログラムである。"],"https://www.youtube.com/watch?v=heIWqSBN1IQ","【ITパスポート解説講座】（6-1）OS（オペレーティングシステム）","",["x:info2_23","OSの中心となるカーネルとAPI"]],["エディタや通信ツールなど、補助的な機能を果たすプログラムを何というか？","ユーティリティ","カーネル","ミドルウェア","ファームウェア","ユーティリティは、エディタ、ファイル圧縮、ウイルス対策、通信ツールなど、OSの機能を補ったり作業を便利にしたりする補助的なプログラム。","https://itmanabi.com/operating_system/","OSのキホンの役割と位置付け、種類（ITの学び）",["カーネルはOSの中心部分で、CPUやメモリなどのリソースを管理する中核であり、補助的なプログラムではない。","ミドルウェアはOSとアプリケーションの中間で、DBMSなどの共通機能を提供するソフトウェアである。","ファームウェアは機器のROMなどに書き込まれ、ハードウェアを直接制御する組込みのソフトウェアである。"],"https://www.youtube.com/watch?v=heIWqSBN1IQ","【ITパスポート解説講座】（6-1）OS（オペレーティングシステム）",""],["アプリケーションとOSの中間に位置するプログラム群を何というか？","ミドルウェア","ユーティリティ","デバイスドライバ","ファームウェア","ミドルウェアは、OSとアプリケーションの中間に位置し、多くのアプリで共通に使う機能を提供するソフトウェア。データベース管理システム（DBMS）、通信ミドルウェア、Webサーバなどがある。","https://itmanabi.com/operating_system/","OSのキホンの役割と位置付け、種類（ITの学び）",["ユーティリティはエディタや圧縮ツールなど、OSの機能を補う補助的なプログラムである。","デバイスドライバは個々の周辺機器を制御し、OSから使えるようにするプログラムで、OSとハードウェアの間で働く。","ファームウェアは機器のROMなどに組み込まれ、ハードウェアを直接制御するソフトウェアである。"],"https://www.youtube.com/watch?v=heIWqSBN1IQ","【ITパスポート解説講座】（6-1）OS（オペレーティングシステム）",""],["全メモリから静的領域・動的に確保済みの領域を引いた残りで、OSが動的に割り当てる記憶領域を何というか？","ヒープ","スタック","キュー","バッファ","ヒープは、プログラムの実行中に、必要に応じて確保・解放される動的なメモリ領域。C言語のmallocで確保し、freeで解放する。解放を忘れるとメモリリークが起こる。関数の呼び出しで使うのはスタック領域。","https://edn.itmedia.co.jp/edn/articles/1609/27/news009.html","スタックの役割 Q&Aで学ぶマイコン講座（EDN Japan）",["スタックは関数呼び出し時の戻り先や局所変数を後入れ先出しで保存する領域で、自動的に確保・解放される。","キューは先入れ先出しの待ち行列を表すデータ構造で、OSが動的に割り当てるメモリ領域の名称ではない。","バッファは速度の異なる装置間でデータを一時的にためておく記憶領域である。"],"https://www.youtube.com/watch?v=nChAnySdzQo","スタックとヒープ メモリの管理の方法、どうやっているの？","",["x:info2_26","データメモリ空間の静的領域・ヒープ・動的領域"]],["最初から固定番地が割り当てられ、最後まで場所が変わらないメモリを何というか？","静的メモリ","動的メモリ","仮想メモリ","キャッシュメモリ","静的メモリは、プログラムの開始時に番地が固定的に割り当てられ、終了まで場所が変わらないメモリ領域。グローバル変数や静的変数が置かれる。","https://edn.itmedia.co.jp/edn/articles/1609/27/news009.html","スタックの役割 Q&Aで学ぶマイコン講座（EDN Japan）",["動的メモリは実行中に必要に応じて確保・解放されるメモリで、場所は固定されない。","仮想メモリは補助記憶装置を利用して、実際の主記憶より大きな記憶空間があるように見せる仕組みである。","キャッシュメモリはCPUと主記憶の速度差を埋めるため、よく使うデータを置く高速な記憶装置である。"],"https://www.youtube.com/watch?v=nChAnySdzQo","スタックとヒープ メモリの管理の方法、どうやっているの？",""],["一時的なデータ保存に使われ、用が済むと破棄・再利用されるメモリを何というか？","動的メモリ","静的メモリ","ROM","不揮発メモリ","動的メモリは、プログラムの実行中に必要なときだけ確保し、用が済んだら解放して再利用するメモリ。メモリを効率よく使えるが、確保と解放の管理が必要。","https://edn.itmedia.co.jp/edn/articles/1609/27/news009.html","スタックの役割 Q&Aで学ぶマイコン講座（EDN Japan）",["静的メモリはプログラム開始時に番地が固定され、終了まで使い続ける領域で、途中で破棄・再利用しない。","ROMは読み出し専用のメモリで、プログラムや固定データの格納に使い、一時的なデータ保存には向かない。","不揮発メモリは電源を切っても内容が消えないメモリで、データを長期保存する用途に使う。"],"https://www.youtube.com/watch?v=nChAnySdzQo","スタックとヒープ メモリの管理の方法、どうやっているの？","",["w:183_0","プログラムのメモリ配置（スタック・ヒープ等）",{"a":"Yanpas","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:C-memlayout.svg"}]],["1つ1つのプログラム実行単位を何と呼ぶか？","タスク、プロセス","スレッド、ファイバ","モジュール、ライブラリ","ジョブ、バッチ","タスク（プロセス）は、OSから見たプログラムの実行単位。OSはタスクごとにCPU時間やメモリを割り当てて管理する。同じプログラムでも、複数起動すれば別々のタスクになる。","https://atmarkit.itmedia.co.jp/ait/articles/1410/30/news150.html","プロセスとスレッド Windows OS入門（@IT）",["スレッドはタスクの中をさらに細かく分けた実行単位、ファイバはさらに軽量な実行単位である。","モジュールはまとまった処理の部品、ライブラリは再利用できる処理の集まりで、実行単位ではない。","ジョブは利用者から見た仕事の単位、バッチはデータや仕事をまとめて一括処理する方式である。"],"https://www.youtube.com/watch?v=MpzG7CMpnos","【OSの仕組み】プロセスとスレッドの違いとは？スタック・ヒープ・排他制御まで完全図解",""],["1つのタスクを細かく分割した実行単位を何と呼ぶか？","スレッド","プロセス","ジョブ","セッション","スレッドは、1つのタスク（プロセス）の中をさらに細かく分けた実行単位。同じプロセス内のスレッドはメモリ空間を共有するため、プロセスを複数作るより軽く、データのやり取りも速い。","https://atmarkit.itmedia.co.jp/ait/articles/1410/30/news150.html","プロセスとスレッド Windows OS入門（@IT）",["プロセスはOSから見たプログラムの実行単位（タスク）そのもので、それを細かく分割したものではない。","ジョブは利用者がコンピュータに依頼する仕事の単位で、複数のタスクから構成されることがある。","セッションは通信やログインなど、開始から終了までの一連のやり取りの単位である。"],"https://www.youtube.com/watch?v=MpzG7CMpnos","【OSの仕組み】プロセスとスレッドの違いとは？スタック・ヒープ・排他制御まで完全図解","",["w:173_0","プロセス内の複数スレッドとスケジューラ",{"a":"Trara123 Hooman Mallahzadeh Cburnett","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Program_Process_Thread_Infographic.svg"}]],["1つのCPUで複数のタスクを同時に実行しているように見せるシステムを何と呼ぶか？","マルチタスクシステム","マルチプロセッサシステム","バッチシステム","シングルタスクシステム","マルチタスクシステムは、1つのCPUで複数のタスクを高速に切り替えながら実行し、同時に動いているように見せる仕組み。音楽を聞きながら文書を書くなど、複数の作業を並行して行える。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["マルチプロセッサシステムは複数のCPUを使って実際に並列処理を行うシステムで、1つのCPUで見せかけるものではない。","バッチシステムは仕事をまとめて順番に一括処理する方式で、同時実行を見せる仕組みではない。","シングルタスクシステムは一度に1つのタスクしか実行できないシステムである。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ","",["x:info2_31","マルチタスクでのスケジューラとディスパッチャ"]],["マルチタスクで、優先度の判定と処理の切り替えは、それぞれ何が担当するか？","スケジューラ、ディスパッチャ","ディスパッチャ、スケジューラ","カーネル、シェル","ローダ、リンカ","マルチタスクOSでは、スケジューラが「次にどのタスクを実行するか」を優先度などから決め、ディスパッチャが実際にCPUをそのタスクに切り替える（実行権を渡す）。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["順序が逆である。ディスパッチャはCPUを切り替える役、スケジューラは次に実行するタスクを決める役である。","カーネルはOSの中心部分、シェルは利用者のコマンドを受け取る窓口で、優先度判定と切替えの役割分担ではない。","ローダは実行ファイルを主記憶に読み込むプログラム、リンカはオブジェクトファイルを結合するプログラムである。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ",""],["OSで実行可能状態のタスクを管理する待ち行列を何と呼ぶか？","レディキュー","ウェイトキュー","メッセージキュー","ジョブキュー","レディキュー（実行可能待ち行列）は、実行できる状態だがCPUの順番を待っているタスクを並べた待ち行列。スケジューラはこの中から次に実行するタスクを選ぶ。入出力の完了などを待つタスクはウェイト状態として別に管理する。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["ウェイトキューは入出力完了やイベントなどを待つ待ち状態のタスクを並べた待ち行列である。","メッセージキューはタスク間でデータ（メッセージ）を受け渡すための通信用の待ち行列である。","ジョブキューは実行を依頼されたジョブを投入順に並べて待たせる待ち行列である。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ","",["x:info2_33","優先度別のレディキュー（ITRON）"]],["組込みシステムで、複数のハードウェアからの迅速な反応を求められる要求を何と呼ぶか？","イベント","タスク","フラグ","ポーリング","イベントは、ボタンが押された、データを受信した、タイマが満了したなど、システムに処理を要求するできごと。組込みシステムでは、複数のハードウェアからのイベントに素早く応答することが求められる。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["タスクはOSから見たプログラムの実行単位であり、ハードウェアから発生する処理要求そのものではない。","フラグは状態の有無を1ビットなどで示す目印で、イベントの発生を記録するのに使われることがある。","ポーリングはCPUが周期的に装置の状態を問い合わせる方式で、要求そのものの名称ではない。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["ソフトウェアが自らOSへ切り替える（OSの機能を呼び出す）ために用意された仕組みは？","システムコール、トラップ","割込みハンドラ、ベクタ","ライブラリ、DLL","フェッチ、デコード","システムコールは、アプリケーションがOSの機能（ファイル操作、メモリ確保など）を呼び出す仕組み。内部ではトラップ（ソフトウェア割込み）命令で、ユーザモードから特権をもつOSモードに切り替えて処理を依頼する。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["割込みハンドラは割込み発生時に実行される処理、ベクタはその処理の開始番地の表で、ハードウェア側からの切替えに使う。","ライブラリは再利用できる処理の集まり、DLLは実行時に読み込む共有ライブラリで、OSへ切り替える仕組みではない。","フェッチとデコードはCPUが命令を取り出し解読する命令実行サイクルの段階である。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0","",["x:info2_35","狭義と広義のシステムコール"]],["実時間制御に特化したOSを何と呼ぶか？","RTOS","GPOS","BIOS","DOS","RTOS（Real-Time Operating System：リアルタイムOS）は、決められた時間内に確実に処理を終える（応答時間を保証する）ことに特化したOS。優先度の高い処理をすぐに実行できる。機械制御や自動車など組込みシステムで使われる。","https://www.kumikomi.jp/rtos_beginner1/","初心者でもわかるRTOS開発入門（クミコミ）",["GPOSは汎用OS（General Purpose OS）で、WindowsやLinuxのようにリアルタイム性より汎用性を重視する。","BIOSは電源投入時にハードウェアを初期化しOSを起動する基本プログラムで、OSではない。","DOSはディスク操作を中心としたOSの総称で、MS-DOSなどがあり、実時間制御に特化したものではない。"],"https://www.youtube.com/watch?v=8M4xXefOP8Q","リアルタイムOSによる組込みシステム開発技術（FreeRTOS編）",""],["OSが、タスクに関する情報（状態、優先度など）をまとめた構造体を何と呼ぶか？","TCB","FAT","PCB基板","MIB","TCB（Task Control Block：タスク制御ブロック）は、OSがタスクごとに持つ管理情報の構造体。タスクの状態、優先度、中断したときのレジスタの値（コンテキスト）などを記録する。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["FATはファイルがどのクラスタに保存されているかを記録するファイル割当てテーブルである。","PCB基板はプリント回路基板のことで、OSのタスク管理情報とは無関係である。","MIBはネットワーク管理プロトコルSNMPで管理対象機器の情報を定義したデータベースである。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ","",["x:info2_37","タスク管理ブロック（TCB）の内容例"]],["タスクの実行中に割込みが起こり、再スケジューリングの結果、別のタスクが実行されることを何というか？","プリエンプション","コンテキスト","ポーリング","デッドロック","プリエンプション（横取り）は、実行中のタスクを、より優先度の高いタスクのためにOSが強制的に中断し、CPUを切り替えること。これができるOSをプリエンプティブOSといい、リアルタイム性を確保できる。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["コンテキストはタスクが中断した時点のレジスタ値などの実行状態で、タスクが切り替わる現象の名称ではない。","ポーリングはCPUが周期的に装置の状態を問い合わせる方式で、割込みによる横取りではない。","デッドロックは複数のタスクが互いに相手の資源の解放を待ち合い、どれも進めなくなる状態である。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ","",["x:info2_38","プリエンプティブとノンプリエンプティブ"]],["割込み発生時に、その要因に応じた処理を行うプログラムを何というか？","割込みハンドラ","デバイスドライバ","スケジューラ","ディスパッチャ","割込みハンドラ（割込み処理ルーチン、ISR）は、割込みが発生したときに、その要因に応じて呼び出される処理プログラム。素早く処理して元のプログラムに戻れるよう、短く書くのが基本。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["デバイスドライバは周辺機器を制御してOSから使えるようにするプログラムで、割込みハンドラを含むこともあるが同義ではない。","スケジューラは次に実行するタスクを優先度などから決めるOSの機能である。","ディスパッチャはスケジューラが選んだタスクに実際にCPUを割り当てて切り替える機能である。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["各タスクが実行していた流れや環境（レジスタの内容など）を何というか？","コンテキスト","スレッド","プロセス","ヒープ","コンテキストは、タスクが実行を中断した時点の状態のこと。CPUのレジスタの値、プログラムカウンタ、スタックポインタなどが含まれ、これを保存しておけば後で中断したところから再開できる。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["スレッドはタスクをさらに分割した実行単位で、実行環境の状態そのものではない。","プロセスはOSから見たプログラムの実行単位で、その実行状態を指す用語ではない。","ヒープはプログラム実行中に動的に確保・解放するメモリ領域である。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ",""],["OSがタスクを切り替えること（コンテキストの保存と復元）を何と呼ぶか？","コンテキストスイッチ","プリエンプション","ディスパッチ","スワップ","コンテキストスイッチは、実行中のタスクのコンテキストを保存し、次に実行するタスクのコンテキストを復元して、CPUの実行を切り替えること。頻繁に行うと、その分の処理時間（オーバーヘッド）が増える。","https://e-words.jp/w/%E3%83%9E%E3%83%AB%E3%83%81%E3%82%BF%E3%82%B9%E3%82%AF.html","マルチタスクとは（IT用語辞典 e-Words）",["プリエンプションは高優先度タスクのために実行中のタスクを強制的に中断することで、切替えのきっかけにあたる。","ディスパッチは選ばれたタスクにCPUの実行権を渡すことで、保存と復元の一連の切替え全体を指す用語ではない。","スワップは主記憶上のプログラムを補助記憶に退避したり戻したりするメモリ管理の操作である。"],"https://www.youtube.com/watch?v=2AhfGkARI8k","基本情報技術者試験 タスクの状態遷移とディスパッチ","",["x:info2_41","OSによるコンテキストスイッチ"]],["プログラム開発時に、特定のアドレスで実行を一時停止させるためのポイントを何というか？","ブレークポイント","ウォッチポイント","エントリポイント","チェックポイント","ブレークポイントは、デバッグのために、プログラムの特定の行やアドレスで実行を一時停止させる目印。停止した時点の変数やレジスタの値を確認して、誤りの原因を探す。","https://e-words.jp/w/%E3%83%87%E3%83%90%E3%83%83%E3%82%AC.html","デバッガ（デバッグツール）とは（IT用語辞典 e-Words）",["ウォッチポイントは特定の変数やメモリの値が読み書き・変更されたときに停止させる目印で、アドレス実行で止めるものではない。","エントリポイントはプログラムの実行が開始される入口の番地である。","チェックポイントは障害回復のため、処理途中の状態を保存しておく時点である。"],"https://www.youtube.com/watch?v=xdJzvyjuQyE","printデバッグは卒業！Visual Studioで効率的デバッグ","",["x:info2_42","ブレークポイントを設定した行で停止"]],["よく使うプログラムをまとめて揃え、用途や機能別に分類したものを何というか？","ライブラリ","ユーティリティ","モジュール","フレームワーク","ライブラリは、よく使う処理（数学関数、文字列処理、通信など）をまとめて、他のプログラムから呼び出せるようにした部品集。用途や機能ごとに分類されている。自分で一から作らずに済むので、開発を効率化できる。","https://wa3.i-3-i.info/diff1167library.html","「静的ライブラリ」と「動的ライブラリ」の違い（わわわIT用語辞典）",["ユーティリティはエディタや圧縮ツールなど、OSの機能を補う補助的なプログラムである。","モジュールはまとまった処理をひとかたまりにしたプログラムの構成要素で、それを集めて分類したものではない。","フレームワークはアプリの骨組みを提供し、利用者のコードを組み込んで動かす土台である。"],"https://www.youtube.com/watch?v=kH8d4bfHvF0","【開発ツール】1.言語プロセッサ コンパイラとインタプリタ（基本情報技術者試験対策）",""],["リアルタイムOSのタスクスケジューリングで最も重要な要素は？","優先度","到着順","実行時間の長さ","メモリ使用量","リアルタイムOSでは、各タスクに優先度を設定し、常に優先度の最も高い実行可能タスクにCPUを割り当てる（優先度ベースのスケジューリング）。緊急度の高い処理を、決められた時間内に確実に実行するためにもっとも重要な要素。","https://www.kumikomi.jp/rtos_beginner1/","初心者でもわかるRTOS開発入門（クミコミ）",["到着順に処理するのはFCFS方式で、緊急度を考慮しないため時間制約を守れないおそれがある。","実行時間の短い順に処理するのはSJF方式で、平均待ち時間は短くなるが緊急度は考慮しない。","メモリ使用量はメモリ管理で考慮する要素で、リアルタイムOSのタスク実行順を決める基準ではない。"],"https://www.youtube.com/watch?v=8M4xXefOP8Q","リアルタイムOSによる組込みシステム開発技術（FreeRTOS編）",""],["共通オブジェクトの実体を1つだけにし、複数のプログラムが動的に利用する形式を何というか？","DLL（動的リンクライブラリ）","静的ライブラリ","オブジェクトファイル","ロードモジュール","DLL（Dynamic Link Library：動的リンクライブラリ）は、実行時に必要になってから読み込まれるライブラリ。実体は1つだけで、複数のプログラムが共有できるので、メモリやディスクを節約でき、ライブラリだけの更新もできる。ライブラリをプログラムに埋め込むのは静的リンク。","https://wa3.i-3-i.info/diff1167library.html","「静的ライブラリ」と「動的ライブラリ」の違い（わわわIT用語辞典）",["静的ライブラリはリンク時にプログラムへ埋め込まれ、プログラムごとに実体のコピーを持つ形式である。","オブジェクトファイルはソースをコンパイルして得られる機械語のファイルで、リンク前の中間生成物である。","ロードモジュールはリンカで結合された実行可能なプログラムで、複数のプログラムで共有する形式ではない。"],"https://www.youtube.com/watch?v=kH8d4bfHvF0","【開発ツール】1.言語プロセッサ コンパイラとインタプリタ（基本情報技術者試験対策）","",["x:info2_45","静的リンクと動的リンク（DLL）の違い"]],["ソフトウェア開発で、特定の機能を実現する部品として利用が広まっているものは？","ソフトウェアコンポーネント","ハードウェアモジュール","ファームウェア","デバイスドライバ","ソフトウェアコンポーネントは、特定の機能を実現し、他のソフトウェアに組み込んで再利用できるソフトウェア部品。部品を組み合わせて開発することで、開発期間の短縮と品質の向上につながる。","https://wa3.i-3-i.info/diff1167library.html","「静的ライブラリ」と「動的ライブラリ」の違い（わわわIT用語辞典）",["ハードウェアモジュールは電子回路などの物理的な部品で、ソフトウェア部品ではない。","ファームウェアは機器のROMなどに組み込まれ、ハードウェアを直接制御するソフトウェアである。","デバイスドライバは特定の周辺機器を制御するためのプログラムで、汎用的な機能部品とは異なる。"],"https://www.youtube.com/watch?v=kH8d4bfHvF0","【開発ツール】1.言語プロセッサ コンパイラとインタプリタ（基本情報技術者試験対策）",""],["CPUやOSなどの、ソフトウェアが動作する基盤となるシステムを何というか？","プラットフォーム","アーキテクチャ","ミドルウェア","フレームワーク","プラットフォームは、ソフトウェアが動作するための土台となる環境。CPUの種類（アーキテクチャ）やOSなどの組合せを指す。プラットフォームが違うと、同じプログラムがそのままでは動かないことがある。","https://wa3.i-3-i.info/word12138.html","プラットフォームとは（わわわIT用語辞典）",["アーキテクチャはCPUの命令セットやシステムの構成方式など、設計の基本的な考え方を指す。","ミドルウェアはOSとアプリケーションの中間で共通機能を提供するソフトウェアで、基盤の一部にとどまる。","フレームワークはアプリケーションの骨組みを提供するソフトウェアで、CPUやOSを指す用語ではない。"],"https://www.youtube.com/watch?v=heIWqSBN1IQ","【ITパスポート解説講座】（6-1）OS（オペレーティングシステム）",""],["CPUシステムのさまざまな資源（メモリ、時間、周辺装置など）を何と呼ぶか？","リソース","コンテキスト","プロセス","デバイス","リソース（資源）は、CPUの処理時間、メモリ、ファイル、入出力装置など、プログラムが動作するために使うもの。OSは、複数のタスクがリソースを適切に共有できるよう管理する。","https://wa3.i-3-i.info/word12138.html","プラットフォームとは（わわわIT用語辞典）",["コンテキストはタスクが中断した時点のレジスタ値などの実行状態である。","プロセスはOSから見たプログラムの実行単位で、資源を使う側にあたる。","デバイスはプリンタや記憶装置など個々の周辺装置を指し、資源の一部にすぎない。"],"https://www.youtube.com/watch?v=heIWqSBN1IQ","【ITパスポート解説講座】（6-1）OS（オペレーティングシステム）",""],["CPUに接続された装置（デバイス）を制御するプログラムを何と呼ぶか？","デバイスドライバ","ユーティリティ","ファームウェア","ミドルウェア","デバイスドライバは、プリンタ、USB機器、ネットワークカードなど個々のハードウェアを制御し、OSから使えるようにするプログラム。機器ごとの違いをドライバが吸収するので、アプリは機器の細かい違いを意識せずに済む。","https://e-words.jp/w/%E3%83%87%E3%83%90%E3%82%A4%E3%82%B9%E3%83%89%E3%83%A9%E3%82%A4%E3%83%90.html","デバイスドライバとは（IT用語辞典 e-Words）",["ユーティリティはエディタや圧縮ツールなど、作業を便利にする補助的なプログラムである。","ファームウェアは機器内部のROMなどに組み込まれたソフトウェアで、OSから装置を使えるようにするものではない。","ミドルウェアはOSとアプリケーションの中間で、DBMSなど共通機能を提供するソフトウェアである。"],"https://www.youtube.com/watch?v=rIbvTC3p-ZI","その100 デバイスドライバ","",["x:info2_49","デバイスドライバとカーネルの関係"]],["記憶装置内でファイルを保管しておくための場所（入れ物）を何というか？","ディレクトリ","セクタ","クラスタ","パーティション","ディレクトリ（フォルダ）は、ファイルを分類して保管しておくための入れ物。ディレクトリの中にさらにディレクトリを作れるので、木構造（階層構造）でファイルを整理できる。","https://e-words.jp/w/%E7%B5%B6%E5%AF%BE%E3%83%91%E3%82%B9.html","絶対パスとは（IT用語辞典 e-Words）",["セクタはハードディスクのトラックを区切った、データを記録する物理的な最小単位である。","クラスタは連続した複数のセクタをまとめた、ファイルシステムが割り当てる単位である。","パーティションは1台の記憶装置を論理的に分割した区画である。"],"https://www.youtube.com/watch?v=XxtBqBefIbI","【優しいIT】絶対パスと相対パスとは？道案内を例に解説！","",["w:142_1","ディレクトリ（フォルダ）の階層構造の例",{"a":"chomwit","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:RoR-FolderStructure.svg"}]],["階層構造の最上位に位置するディレクトリを何というか？","ルートディレクトリ","カレントディレクトリ","ホームディレクトリ","親ディレクトリ","ルートディレクトリは、ディレクトリの階層構造の一番上にあるディレクトリ。UNIX系では「/」、Windowsでは「C:¥」などで表す。すべてのファイルやディレクトリは、ルートからたどることができる。","https://e-words.jp/w/%E7%B5%B6%E5%AF%BE%E3%83%91%E3%82%B9.html","絶対パスとは（IT用語辞典 e-Words）",["カレントディレクトリは現在作業している位置のディレクトリで、相対パスの基準になる。","ホームディレクトリは利用者ごとに割り当てられる個人用のディレクトリである。","親ディレクトリはあるディレクトリの1つ上の階層にあるディレクトリである。"],"https://www.youtube.com/watch?v=XxtBqBefIbI","【優しいIT】絶対パスと相対パスとは？道案内を例に解説！","",["w:142_1","最上位のルートから枝分かれするディレクトリの階層構造",{"a":"chomwit","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:RoR-FolderStructure.svg"}]],["ファイルやディレクトリの場所を表す2つの方法は？","絶対パス、相対パス","直接パス、間接パス","ルートパス、リーフパス","固定パス、動的パス","絶対パスは、ルートディレクトリから目的のファイルまでの道筋をすべて書く表し方（例：/home/user/a.txt）。相対パスは、現在いるディレクトリ（カレントディレクトリ）を基準にした表し方（例：../data/a.txt）。","https://e-words.jp/w/%E7%B5%B6%E5%AF%BE%E3%83%91%E3%82%B9.html","絶対パスとは（IT用語辞典 e-Words）",["直接パス、間接パスという呼び方はファイルの場所の表し方として使われない。","ルートパス、リーフパスという用語は使われない。ルートやリーフは木構造の最上位と末端のノードの名称である。","固定パス、動的パスという用語は使われない。基準をルートにするか現在位置にするかで区別する。"],"https://www.youtube.com/watch?v=XxtBqBefIbI","【優しいIT】絶対パスと相対パスとは？道案内を例に解説！","",["x:info2_52","絶対パスと相対パスの表し方"]],["データを保存領域に割り付けることを何というか？","アロケーション","フラグメンテーション","デフラグ","フォーマット","アロケーション（割り当て）は、データやプログラムに、メモリやディスクの保存領域を割り当てること。メモリの動的確保（mallocなど）もアロケーション。","https://edn.itmedia.co.jp/edn/articles/1609/27/news009.html","スタックの役割 Q&Aで学ぶマイコン講座（EDN Japan）",["フラグメンテーションは確保と解放を繰り返すうちに空き領域が細切れになる断片化の現象である。","デフラグは断片化したファイルを連続した領域に並べ直して解消する操作である。","フォーマットは記憶媒体を初期化し、ファイルシステムの管理領域を作成する操作である。"],"https://www.youtube.com/watch?v=nChAnySdzQo","スタックとヒープ メモリの管理の方法、どうやっているの？",""],["ハードディスクにデータを記録する、物理的な最小単位を何というか？","セクタ","クラスタ","トラック","シリンダ","セクタは、ハードディスクの円周状のトラックを細かく区切った、データを記録する物理的な最小単位。従来は512バイト、最近は4096バイトのものも多い。","https://atmarkit.itmedia.co.jp/ait/articles/1507/16/news034.html","Windowsのファイルシステムの概要とFATファイルシステム（@IT）",["クラスタは連続した複数のセクタをまとめた、ファイルシステムの管理単位で、最小単位ではない。","トラックはディスク上の同心円状の記録領域で、これを区切ったものがセクタである。","シリンダは複数のディスク面で同じ半径位置にあるトラックの集まりである。"],"https://www.youtube.com/watch?v=urMnUTmeW3U","【ITパスポート】ファイルシステム（絶対パス指定、相対パス指定、ルート）","",["w:143_1","ディスク面のトラック（A）とセクタ（C）の構造",{"a":"MistWiz","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Disk-structure.svg"}]],["管理を簡単にするため、連続したセクタをいくつかまとめた単位を何というか？","クラスタ","セクタ","ブロック","ページ","クラスタは、連続するいくつかのセクタをまとめた、ファイルシステムがファイルを割り当てる単位。セクタ単位だと管理情報が膨大になるため、まとめて管理する。小さいファイルでも1クラスタ分の容量を使う。","https://atmarkit.itmedia.co.jp/ait/articles/1507/16/news034.html","Windowsのファイルシステムの概要とFATファイルシステム（@IT）",["セクタはハードディスクにデータを記録する物理的な最小単位で、まとめる側ではなくまとめられる側である。","ブロックは記憶装置とデータをやり取りする単位の一般的な呼び名で、セクタをまとめたファイルシステムの割当て単位の名称としてはクラスタが正しい。","ページは仮想記憶で主記憶と補助記憶の間をやり取りする固定長の単位である。"],"https://www.youtube.com/watch?v=urMnUTmeW3U","【ITパスポート】ファイルシステム（絶対パス指定、相対パス指定、ルート）","",["x:info2_55","セクタとクラスタの関係"]],["元はファイル割当てテーブルを指し、ファイルシステム全体の意味でも使われるものは？","FAT","NTFS","MBR","BIOS","FAT（File Allocation Table）は、もともとファイルがどのクラスタに保存されているかを記録した表のこと。そこから、この表を使うファイルシステム全体（FAT16、FAT32など）も指すようになった。USBメモリやSDカードで今も使われる。","https://atmarkit.itmedia.co.jp/ait/articles/1507/16/news034.html","Windowsのファイルシステムの概要とFATファイルシステム（@IT）",["NTFSはWindowsで使われる高機能なファイルシステムで、アクセス権やジャーナリング機能を持つ。","MBRはディスクの先頭にあり、パーティション情報と起動用プログラムを格納する領域である。","BIOSは電源投入時にハードウェアを初期化してOSを起動する基本プログラムである。"],"https://www.youtube.com/watch?v=urMnUTmeW3U","【ITパスポート】ファイルシステム（絶対パス指定、相対パス指定、ルート）","",["x:info2_56","FATによるクラスタのつながりの管理"]],["多くのデータをファイルに保管する際、情報を効率よく扱えるようにレコードの配置を工夫した方法を何というか？","ファイル編成法","データ圧縮法","ソート法","正規化法","ファイル編成法は、大量のデータ（レコード）をファイルに保存するとき、目的に応じて効率よく読み書きできるようにレコードの並べ方を決める方法。順編成、直接編成、索引順編成などがある。","https://www.fe-siken.com/kakomon/16_aki/q34.html","ファイル編成の過去問解説（基本情報技術者試験.com）",["データ圧縮法はデータの冗長性を取り除いて容量を小さくする方法で、レコードの配置方法ではない。","ソート法はデータを値の順に並べ替える方法で、ファイル内のレコード配置の方式全般を指すものではない。","正規化法はデータベース設計でデータの重複や矛盾をなくすように表を分割する方法である。"],"https://www.youtube.com/watch?v=en5mWPK5kic","【第17回】ITパスポート試験対策講座（補助記憶装置）",""],["主に企業の基幹業務に使われる汎用大型コンピュータを何というか？","メインフレーム","ワークステーション","ミニコンピュータ","マイクロコンピュータ","メインフレームは、企業の基幹業務（銀行の勘定系、航空会社の予約など）に使われる、高い信頼性と処理能力をもつ汎用大型コンピュータ。大量のトランザクションを止まらずに処理する。","https://e-words.jp/w/%E3%83%A1%E3%82%A4%E3%83%B3%E3%83%95%E3%83%AC%E3%83%BC%E3%83%A0.html","メインフレーム（大型汎用機）とは（IT用語辞典 e-Words）",["ワークステーションは設計や科学技術計算などに使う高性能な個人・小規模向けのコンピュータである。","ミニコンピュータはメインフレームより小型で安価な中型コンピュータで、部門や研究室で使われた。","マイクロコンピュータはマイクロプロセッサを中心とした小型のコンピュータで、組込み機器やパソコンに使われる。"],"https://www.youtube.com/watch?v=1KGmHSbhHDg",
