ず、オールパスは振幅を変えず位相だけを変える回路である。","アクティブ・パッシブ・デジタルはフィルタの実現方式による分類で、周波数特性の基本形ではない。","FIRとIIRはデジタルフィルタの構成方式で、LCで作るアナログフィルタの基本形ではない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画","",["x:elec1_48","4種類のフィルタの理想的な周波数特性"]],["交流電源からのノイズを防ぐため、装置の電源入口に設けられるものは？","電源用ラインフィルタ","バリスタ","ヒューズ","突入電流防止抵抗","電源用ラインフィルタは、装置の電源入口に取り付け、電源線を伝わってくるノイズの侵入と、装置から電源線に出ていくノイズの両方を抑える。コモンモードチョークとコンデンサを組み合わせたものが一般的。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["バリスタはサージなどの過電圧を吸収する素子で、連続的なノイズを除去するフィルタではない。","ヒューズは過電流で溶断して回路を切る保護部品で、ノイズは防げない。","突入電流防止抵抗は電源投入時の大きな充電電流を抑える部品で、ノイズ対策ではない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画","",["w:033_0","装置の電源入口に付ける電源用ラインフィルタの外観",{"a":"Hannes Grobe","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Entstoerfilter1_hg.jpg"}]],["信号線をねじり合わせ、隣同士の誘導起電力を打ち消してノイズを減らす配線を何というか？","ツイストペア配線","シールド配線","一点アース配線","同軸配線","ツイストペア配線は、往復の2本の信号線をより合わせる配線。外部磁界によって生じる誘導起電力が、よりの1ピッチごとに逆向きになって打ち消し合う。信号線から出るノイズも減らせる。","https://e-words.jp/w/%E3%83%84%E3%82%A4%E3%82%B9%E3%83%88%E3%83%9A%E3%82%A2%E3%82%B1%E3%83%BC%E3%83%96%E3%83%AB.html","ツイストペアケーブルとは（IT用語辞典 e-Words）",["シールド配線は信号線を導体の網や箔で覆い外部の電界を遮る方法で、線をねじるものではない。","一点アース配線は接地を1か所にまとめてグランドループによるノイズを防ぐ方法である。","同軸配線は中心導体を外部導体で同心円状に囲む構造で、ねじり合わせではない。"],"https://www.youtube.com/watch?v=40bG_Mn2L0E","ツイストペアケーブルのノイズ耐性テスト","",["x:elec1_50","ツイストペアで誘導雑音が打ち消される仕組み"]],["機械的接点を持つスイッチで、電源電圧10〜300V程度のとき接点間に起こる放電は？","アーク放電","グロー放電","コロナ放電","火花放電","アーク放電は、接点を開閉するときに接点間に生じる、大電流が流れる高温・高輝度の放電。接点の消耗や溶着の原因になる。ここでは電源電圧が10〜300V程度のときに起こる放電として分類している。対策として火花消去回路（CRスナバなど）を接点に入れる。","https://www.fa.omron.co.jp/guide/technicalguide/36/288/index.html","一般リレー 参考資料（オムロン技術解説）",["グロー放電は電流が小さく淡く光る放電で、ここでは300V以上のときに接点で起こる放電に分類される。","コロナ放電は高電圧の電極の尖った部分の周囲で局部的に起こる放電で、接点開閉時の放電ではない。","火花放電は電極間の絶縁が瞬間的に破れて起こる短時間の放電で、この電圧範囲の分類名ではない。"],"https://www.youtube.com/watch?v=Qftj8emU6vQ","a接点・b接点・c接点《リレー》とスイッチの構造",""],["機械的接点を持つスイッチで、電源電圧300V以上のとき接点間に起こる放電は？","グロー放電","アーク放電","コロナ放電","部分放電","グロー放電は、電流が比較的小さく、低温で淡く光る放電。ここでは電源電圧が300V以上のときに接点間で起こる放電として分類している。ネオンランプや蛍光灯の点灯もグロー放電の一種。","https://www.fa.omron.co.jp/guide/technicalguide/36/288/index.html","一般リレー 参考資料（オムロン技術解説）",["アーク放電は大電流で高温・高輝度の放電で、ここでは10〜300V程度で接点に起こる放電に分類される。","コロナ放電は送電線や尖った電極の周囲で局部的に生じる放電で、接点間の放電の分類ではない。","部分放電は絶縁物の内部や表面で局部的に起こる放電で、絶縁劣化の診断対象となるものである。"],"https://www.youtube.com/watch?v=Qftj8emU6vQ","a接点・b接点・c接点《リレー》とスイッチの構造",""],["抵抗体内の電子の不規則な熱運動で生じ、温度が高いほど大きくなる雑音は？","熱雑音","ショット雑音","1/f雑音","バースト雑音","熱雑音は、抵抗体の中の自由電子が熱でランダムに動くことで生じる雑音で、絶対温度に比例して大きくなる。雑音電力は4kTRB（k：ボルツマン定数、T：温度、R：抵抗、B：帯域幅）で表される。","https://kotobank.jp/word/%E9%9B%91%E9%9F%B3-69133","雑音とは（コトバンク）",["ショット雑音は電流が電子の粒として流れることで生じる雑音で、熱運動が原因ではない。","1/f雑音は周波数に反比例して低周波で大きくなる雑音で、温度に比例するものではない。","バースト雑音は半導体の欠陥などで出力が2つのレベル間を不規則に跳ぶ雑音（ポップコーン雑音）である。"],"https://www.youtube.com/watch?v=6dbP1uqQaAQ","抵抗器の熱雑音 LTspice内でのボルツマン定数",""],["熱雑音は周波数依存性がなく一様なスペクトルを持つことから何と呼ばれるか？","ホワイトノイズ","ピンクノイズ","ブラウンノイズ","インパルスノイズ","ホワイトノイズ（白色雑音）は、すべての周波数で強さが一様な雑音。白色光がすべての色の光を均等に含むことにたとえた名前。熱雑音やショット雑音はホワイトノイズに近い。低周波ほど強い1/f雑音はピンクノイズという。","https://kotobank.jp/word/%E9%9B%91%E9%9F%B3-69133","雑音とは（コトバンク）",["ピンクノイズは周波数に反比例して低周波ほど強い雑音（1/f雑音）で、一様なスペクトルではない。","ブラウンノイズは周波数の2乗に反比例して低周波ほどさらに強くなる雑音である。","インパルスノイズは瞬間的に生じる鋭いパルス状の雑音で、スペクトルの形による呼び名ではない。"],"https://www.youtube.com/watch?v=6dbP1uqQaAQ","抵抗器の熱雑音 LTspice内でのボルツマン定数","",["x:elec1_54","ホワイトノイズのスペクトル（周波数に一様）"]],["接地は別名で何と呼ばれるか？","アース、グランド","コモン、シールド","ニュートラル、ライン","バス、ネット","接地は、電気機器や回路を大地や基準電位につなぐことで、アース（earth）、グランド（ground、GND）とも呼ぶ。感電防止のための保護接地と、回路の基準電位を作るための機能接地（信号接地）がある。","https://www.jeea.or.jp/course/contents/11102/","接地工事の種類（日本電気技術者協会）",["コモンは回路の共通線（共通電位）、シールドは電磁波を遮る遮へいのことで、接地の別名ではない。","ニュートラルは交流配電の中性線、ラインは電圧のかかる電源線で、接地とは異なる。","バスは複数の機器を結ぶ共通の信号線、ネットは回路図上の配線のつながりを指す。"],"https://www.youtube.com/watch?v=TE220rGIA0c","漏電ブレーカの仕組と使用方法、よくある間違い",""],["漏電や故障で生じた電位を接地電位に保ち、人体を感電から守るための接地は？","保護接地","機能接地","雷保護接地","信号接地","保護接地は、機器の金属製の外箱などを大地に接続し、漏電や故障で外箱に電圧が生じても、人が触れたときに感電しないようにする接地。漏電遮断器を確実に動作させる役割もある。","https://www.jeea.or.jp/course/contents/11102/","接地工事の種類（日本電気技術者協会）",["機能接地は回路の基準電位を作り機器を正しく動かすための接地で、感電防止が目的ではない。","雷保護接地は避雷設備で受けた雷電流を大地へ逃がすための接地である。","信号接地は信号の基準電位を共通にするための接地で、人体保護ではなく回路動作のためのものである。"],"https://www.youtube.com/watch?v=TE220rGIA0c","漏電ブレーカの仕組と使用方法、よくある間違い","",["w:184_1","保護接地を表す図記号",{"a":"Stündle","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Protective_earthing.svg"}]],["A〜D種接地工事のうち、300V以下の低圧用機器に施すものは？","D種接地工事","C種接地工事","B種接地工事","A種接地工事","接地工事はA〜D種に分かれる。A種は高圧・特別高圧の機器、B種は高圧と低圧を結合する変圧器の低圧側、C種は300Vを超える低圧機器、D種は300V以下の低圧機器（家電の外箱など）に施す。","https://www.jeea.or.jp/course/contents/11102/","接地工事の種類（日本電気技術者協会）",["C種接地工事は300Vを超える低圧機器に施すもので、300V以下ではない。","B種接地工事は高圧と低圧を結合する変圧器の低圧側に施す接地である。","A種接地工事は高圧・特別高圧の機器の外箱などに施す接地である。"],"https://www.youtube.com/watch?v=TE220rGIA0c","漏電ブレーカの仕組と使用方法、よくある間違い","",["x:elec1_57","接地工事の種類（A種・B種・D種）"]],["電線の傷や被覆の剥がれなどで、外部に電気が漏れることを何というか？","漏電","短絡","地絡遮断","過電流","漏電は、絶縁の劣化や被覆の損傷などで、本来の回路以外（機器の外箱や大地）に電流が漏れること。感電や火災の原因になる。漏電ブレーカは、行きと帰りの電流の差を検出して回路を遮断する。","https://www.jeea.or.jp/course/contents/08105/","漏電遮断器の構造、動作原理（日本電気技術者協会）",["短絡は電位の異なる導体どうしが低い抵抗で直接つながり大電流が流れる状態（ショート）である。","地絡遮断は漏電や地絡を検出して回路を切る動作のことで、電気が漏れる現象そのものではない。","過電流は定格を超える電流が流れることで、外部への漏れを意味しない。"],"https://www.youtube.com/watch?v=riT1rTvqIV0","漏電遮断器の動作原理","",["w:188_1","漏電を検出して回路を遮断する漏電ブレーカの例",{"a":"Diermaier","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Residual_current_device_(RCD).jpg"}]],["測定値を指針と目盛で読むテスタと、数字で読むテスタをそれぞれ何というか？","アナログテスタ、デジタルテスタ","メガー、クランプメータ","オシロスコープ、ロジアナ","電流計、電圧計","アナログテスタは指針の振れを目盛で読むテスタで、値の変化の傾向がつかみやすい。デジタルテスタは数値で表示し、読み取り誤差が少なく高精度。現在はデジタルが主流。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/114.html","テスタの使い方 第1回目（マルツ）",["メガーは絶縁抵抗計、クランプメータは電線を挟んで電流を測る計器で、表示方式の違いではない。","オシロスコープは波形観測器、ロジアナ（ロジックアナライザ）はデジタル信号のタイミングを観測する計器である。","電流計と電圧計は測る量による区別で、指針式か数字表示かの違いではない。"],"https://www.youtube.com/watch?v=SZMheov_B2A","【テスター】の使い方を超初心者さん向けに徹底解説","",["w:128_0","指針と目盛で値を読むアナログテスタの例",{"a":"Loadmaster (David R. Tribble) This image was made by Loadmas","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Multimeter-4252e.jpg"}]],["1台で電圧・電流・抵抗などを測定できることから、テスタは何と呼ばれるか？","マルチメータ","メガー","ロジックチェッカ","クランプメータ","テスタは1台で直流・交流の電圧、電流、抵抗などを切り替えて測れるため、マルチメータ（回路計）と呼ばれる。導通確認やダイオード・コンデンサの測定ができるものもある。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/114.html","テスタの使い方 第1回目（マルツ）",["メガーは高電圧をかけて絶縁抵抗を測る専用の計器で、多機能な測定器ではない。","ロジックチェッカはデジタル回路の論理レベル（HかLか）を確認する簡易検査器である。","クランプメータは電線を挟んで電流を測る計器で、テスタの別名ではない。"],"https://www.youtube.com/watch?v=SZMheov_B2A","【テスター】の使い方を超初心者さん向けに徹底解説","",["w:128_0","電圧・電流・抵抗を1台で測るマルチメータの例",{"a":"Loadmaster (David R. Tribble) This image was made by Loadmas","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Multimeter-4252e.jpg"}]],["人体の内部抵抗500Ω、濡れた皮膚の接触抵抗300Ωとして、AC100Vに触れたとき体内に流れる電流は？","0.125A","0.2A","0.333A","0.08A","オームの法則で I＝V/R＝100V÷(500Ω＋300Ω)＝0.125A＝125mA。人体は数十mAで命に危険が及ぶため、非常に危険な電流。皮膚が濡れていると接触抵抗が下がって電流が増えるので、濡れた手で電気機器に触れてはいけない。","https://www.jeea.or.jp/course/contents/10102/","感電災害の防止対策（日本電気技術者協会）",["0.2Aは100Vを内部抵抗500Ωだけで割った値で、接触抵抗300Ωを加えていない。","0.333Aは100Vを接触抵抗300Ωだけで割った値で、直列の内部抵抗を無視している。","0.08Aは100Vを1250Ωで割った値に相当し、直列の合成抵抗800Ωで計算した結果と一致しない。"],"https://www.youtube.com/watch?v=unYJEBS0ot0","【感電の仕組み１】そもそも、感電って何だろう？","",["x:elec1_61","感電電流の計算（直列抵抗とオームの法則）"]],["大地に対する床面の抵抗を何というか？","対地抵抗","接地抵抗","絶縁抵抗","接触抵抗","対地抵抗は、大地に対する床面の電気抵抗。床が絶縁されている（対地抵抗が高い）と、感電したときに体を流れる電流が小さくなる。逆に静電気対策では、床の対地抵抗を適度に下げて電荷を逃がす。","https://www.jeea.or.jp/course/contents/10102/","感電災害の防止対策（日本電気技術者協会）",["接地抵抗は接地極と大地との間の抵抗で、接地工事の良否を評価する値である。","絶縁抵抗は電路と大地や導体間の絶縁物の抵抗で、機器の絶縁状態を示す。","接触抵抗は2つの導体が接する部分に生じる抵抗で、床面と大地の間の抵抗ではない。"],"https://www.youtube.com/watch?v=unYJEBS0ot0","【感電の仕組み１】そもそも、感電って何だろう？",""],["電磁波を2つに区別すると何と何か？","電離放射線、非電離放射線","可視光線、不可視光線","長波、短波","アナログ波、デジタル波","電磁波は、原子から電子を引きはがす力（電離作用）があるかどうかで、電離放射線（X線、γ線など）と非電離放射線（電波、赤外線、可視光など）に分けられる。紫外線は一部が境界にあたる。","https://www.env.go.jp/chemi/rhm/current/01-03-02.html","放射線の種類（環境省）",["可視光線と不可視光線は人の目に見えるかどうかによる区別で、電磁波全体の基本的な区分ではない。","長波と短波は電波の中での波長による区分で、電磁波全体の2区分ではない。","アナログ波とデジタル波は信号の伝え方による区別で、電磁波の物理的性質による分類ではない。"],"https://www.youtube.com/watch?v=R3GaiAss92E","電磁波とは何か？ーわかりやすく解説【電磁気学】","",["x:elec1_63","電磁波の分類（電離放射線・非電離放射線）"]],["電波法では、周波数がどのくらい以下の電磁波を電波と規定しているか？","3THz","3GHz","300GHz","30THz","電波法では、周波数が3THz（300万MHz）以下の電磁波を「電波」と定義している。これより周波数が高いものは赤外線、可視光線などの光として扱われる。","https://www.env.go.jp/chemi/rhm/current/01-03-02.html","放射線の種類（環境省）",["3GHzは携帯電話や無線LANなどで使われるマイクロ波帯の周波数で、電波の上限ではない。","300GHzはミリ波の上限にあたる周波数で、電波法の定義はこれより高い3THzまでを含む。","30THzは赤外線の領域の周波数で、電波法の電波の範囲を超えている。"],"https://www.youtube.com/watch?v=R3GaiAss92E","電磁波とは何か？ーわかりやすく解説【電磁気学】",""],["γ線やX線は高いエネルギーを持ち、原子や分子から電子を引き離す。この作用を何というか？","電離作用","熱作用","刺激作用","光電作用","電離作用は、高いエネルギーをもつ放射線が原子や分子から電子をはじき出し、イオンにする作用。DNAを傷つけるなど生体に影響を与えるため、X線撮影などでは被ばく管理が必要になる。","https://www.env.go.jp/chemi/rhm/current/01-03-02.html","放射線の種類（環境省）",["熱作用は電磁波のエネルギーが吸収されて体温や物体の温度を上げる作用で、電子を引き離さない。","刺激作用は低周波の電磁界で体内に電流が流れ神経や筋肉を刺激する作用である。","光電作用は光が金属などに当たって電子を放出させる現象で、原子をイオン化する作用の名称ではない。"],"https://www.youtube.com/watch?v=R3GaiAss92E","電磁波とは何か？ーわかりやすく解説【電磁気学】",""],["非電離放射線の生体への影響3つの組合せは？","刺激作用、熱作用、非熱作用","電離作用、熱作用、光化学作用","刺激作用、電離作用、遺伝的作用","熱作用、化学作用、磁気作用","非電離放射線（電波など）の生体への影響には、低周波の電磁界で体内に電流が流れて神経や筋肉が刺激される刺激作用、高周波で体が温まる熱作用、それら以外の非熱作用がある。電波防護指針は刺激作用と熱作用を防ぐように定められている。","https://www.env.go.jp/chemi/rhm/current/01-03-02.html","放射線の種類（環境省）",["電離作用はX線やγ線など電離放射線の作用で、非電離放射線にはない。","電離作用と遺伝的作用は電離放射線による影響で、非電離放射線の作用には含まれない。","化学作用や磁気作用は非電離放射線の生体影響の分類として用いられない。"],"https://www.youtube.com/watch?v=R3GaiAss92E","電磁波とは何か？ーわかりやすく解説【電磁気学】",""],["電気機器の安全規格が防止を目的とする3つの事故の組合せは？","感電事故、火災事故、電磁環境両立性による事故","感電事故、落雷事故、盗難事故","火災事故、転倒事故、誤操作事故","感電事故、騒音事故、振動事故","電気機器の安全規格は、主に感電事故、火災事故、電磁環境両立性（EMC）に関わる事故（電磁ノイズによる誤動作など）の3つを防ぐことを目的としている。","https://detail-infomation.com/emc-emi-ems/","EMC・EMI・EMSとは？違いや意味（Electrical Information）",["落雷や盗難は機器の安全規格が防止対象とする事故ではなく、設備の防護や防犯の問題である。","転倒や誤操作は機械的・人的な要因の事故で、電気機器の安全規格の3本柱ではない。","騒音や振動は環境面の問題で、電気機器の安全規格が主目的とする事故ではない。"],"https://www.youtube.com/watch?v=bhHJO29pbpI","EMC対策・設計 ノイズ対策の基礎",""],["電磁環境両立性は略して何と呼ぶか？","EMC","EMI","EMS","ESD","EMC（Electromagnetic Compatibility：電磁環境両立性）は、機器が周りに妨害となる電磁ノイズを出さず（EMI：エミッション）、周りからのノイズにも耐えて正常に動く（EMS：イミュニティ）性能のこと。","https://detail-infomation.com/emc-emi-ems/","EMC・EMI・EMSとは？違いや意味（Electrical Information）",["EMIは電磁妨害（エミッション）のことで、EMCの一部分にあたる。","EMSは電磁感受性（イミュニティ）のことで、EMCの一部分にあたる。","ESDは静電気放電のことで、EMC試験の項目の一つである。"],"https://www.youtube.com/watch?v=bhHJO29pbpI","EMC対策・設計 ノイズ対策の基礎",""],["日本産業規格は略して何と呼ばれるか？","JIS","JAS","ISO","IEC","JIS（Japanese Industrial Standards）は日本産業規格（旧称：日本工業規格）。産業標準化法に基づく日本の国家規格で、製品の寸法・品質・試験方法などを定めている。農林物資の規格はJAS。","https://www.keyence.co.jp/ss/products/marker/housing-design/knowledge/iso.jsp","ISO・IEC・JISとは（キーエンス）",["JASは日本農林規格で、農林物資の品質などを定める規格である。","ISOは国際標準化機構およびその国際規格で、日本の国家規格ではない。","IECは国際電気標準会議で、電気・電子分野の国際規格を作る機関である。"],"https://www.youtube.com/watch?v=985lHM65cHk","ISO/IEC 国際標準化 第01回【国際標準化ってなに？】",""],["電気用品の製造・販売などを規制し、安全性を確保するための法律は？","電気用品安全法","電気事業法","電波法","製造物責任法","電気用品安全法は、電気用品の製造・輸入・販売を規制し、電気用品による危険や障害の発生を防ぐための法律。対象製品は技術基準に適合し、PSEマークを表示しなければ販売できない。","https://www.meti.go.jp/policy/consumer/seian/denan/act_outline.html","電気用品安全法の概要（経済産業省）",["電気事業法は電力会社の事業や電気工作物の保安を定める法律で、電気用品の販売規制ではない。","電波法は電波の利用や無線局を規律する法律で、電気用品の安全性を規制するものではない。","製造物責任法（PL法）は欠陥製品による損害の賠償責任を定める法律で、製造販売の規制ではない。"],"https://www.youtube.com/watch?v=cU3u-90cS7s","【第二種電気工事士】電気用品安全法・電気用品（PSEマーク）",""],["PSEマーク（ひし形・丸形）は何の法律に基づく表示か？","電気用品安全法","電波法","消費生活用製品安全法","製造物責任法","PSEマークは電気用品安全法に基づく表示。危険性の高い「特定電気用品」（電源コード、電気温水器など）はひし形、それ以外の電気用品（テレビ、電気ストーブなど）は丸形のマークを付ける。","https://www.meti.go.jp/policy/consumer/seian/denan/act_outline.html","電気用品安全法の概要（経済産業省）",["電波法に基づく表示は技術基準適合証明（技適マーク）で、PSEマークではない。","消費生活用製品安全法に基づく表示はPSCマークで、電気用品のPSEマークとは異なる。","製造物責任法は損害賠償責任を定める法律で、マークの表示制度はもたない。"],"https://www.youtube.com/watch?v=cU3u-90cS7s","【第二種電気工事士】電気用品安全法・電気用品（PSEマーク）","",["w:088_0","PSEマーク（上：ひし形、下：丸形）",{"a":"Tosaka","l":"CC BY 3.0","u":"https://commons.wikimedia.org/wiki/File:PSE_mark_2types.PNG"}]],["電気用品安全法で規制される製品は、主にどこで使用される電気用品か？","一般家庭や事務所","工場の生産設備","発電所・変電所","鉄道車両","電気用品安全法の対象は、一般家庭や事務所などで一般の人が使う電気用品。工場の生産設備など、専門家が扱う産業用の機器は対象外。","https://www.meti.go.jp/policy/consumer/seian/denan/act_outline.html","電気用品安全法の概要（経済産業省）",["工場の生産設備は専門家が扱う産業用機器で、電気用品安全法の対象外である。","発電所・変電所の設備は電気事業法で保安が規制されており、電気用品安全法の対象ではない。","鉄道車両は鉄道関係の法令で規制され、一般向けの電気用品には当たらない。"],"https://www.youtube.com/watch?v=cU3u-90cS7s","【第二種電気工事士】電気用品安全法・電気用品（PSEマーク）",""],["1906年に、電気の国際規格の統一と協調を促進するために創設された標準化機構は？","IEC","ISO","ITU","IEEE","IEC（International Electrotechnical Commission：国際電気標準会議）は、1906年に設立された電気・電子分野の国際標準化機関。電気安全やEMCなどの国際規格を作っている。","https://www.keyence.co.jp/ss/products/marker/housing-design/knowledge/iso.jsp","ISO・IEC・JISとは（キーエンス）",["ISOは1947年設立の国際標準化機構で、電気以外の分野の国際規格を担当する。","ITUは国際電気通信連合で、通信や電波の国際的な調整を行う国連の専門機関である。","IEEEは米国に本部を置く電気・電子技術者の学会で、国際標準化機構ではない。"],"https://www.youtube.com/watch?v=985lHM65cHk","ISO/IEC 国際標準化 第01回【国際標準化ってなに？】",""],["電気以外のあらゆる分野の国際規格の標準化を推進する組織は？","ISO","IEC","JIS","ANSI","ISO（International Organization for Standardization：国際標準化機構）は、電気・電子以外のほぼすべての分野の国際規格を作る機関。ISO9001（品質マネジメント）やISO14001（環境マネジメント）が有名。電気分野はIECが担当する。","https://www.keyence.co.jp/ss/products/marker/housing-design/knowledge/iso.jsp","ISO・IEC・JISとは（キーエンス）",["IECは電気・電子分野の国際規格を作る機関で、電気以外の分野は担当しない。","JISは日本の国家規格で、国際規格を推進する組織ではない。","ANSIは米国規格協会で、米国の国家規格を取りまとめる組織である。"],"https://www.youtube.com/watch?v=985lHM65cHk","ISO/IEC 国際標準化 第01回【国際標準化ってなに？】",""],["CEマークで示される、欧州向けの安全規格は？","欧州、EN規格","米国、UL規格","中国、CCC制度","日本、JIS規格","CEマーキングは、EU域内で販売する製品が、EUの指令（安全・健康・環境保護など）に適合していることを示す表示。適合性は主にEN規格（欧州統一規格）に基づいて評価する。","https://www.jetro.go.jp/world/qa/04S-040007.html","海外の製品安全規格（JETRO）",["UL規格は米国の安全規格で、ULマークで示される。","CCC制度は中国の強制製品認証制度で、CCCマークで示される。","JIS規格は日本の国家規格で、欧州向けのCEマークとは関係ない。"],"https://www.youtube.com/watch?v=O0vpPcKdN70","【超入門】CEマーキング講座","",["w:016_3","欧州向け製品に表示するCEマーク",{"a":"MatthiasDD","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Conformit%C3%A9_Europ%C3%A9enne_(logo).svg"}]],["ULマークで示される、米国向けの安全規格は？","米国、UL規格","欧州、EN規格","カナダ、CSA規格","中国、CCC制度","ULはUnderwriters Laboratoriesの略で、米国の製品安全の認証機関とその規格。ULマークは米国の安全規格に適合していることを示す。北米向けの電気製品で求められることが多い。","https://www.jetro.go.jp/world/qa/04S-040007.html","海外の製品安全規格（JETRO）",["EN規格は欧州統一規格で、CEマーキングの適合評価に使われる。","CSA規格はカナダ規格協会の安全規格で、米国のULとは別の規格である。","CCC制度は中国の強制製品認証制度で、米国向けではない。"],"https://www.youtube.com/watch?v=O0vpPcKdN70","【超入門】CEマーキング講座","",["w:116_1","米国の安全規格を示すULマーク",{"a":"Underwriters Laboratories","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:UL_Mark_(2).svg"}]],["CCCマークで示される制度は？","中国、CCC制度","欧州、CEマーキング","米国、UL規格","日本、PSE制度","CCC（China Compulsory Certification：中国強制製品認証制度）は、中国で販売する対象製品に義務付けられている認証制度。認証を受けた製品にはCCCマークを付ける。","https://www.jetro.go.jp/world/qa/04S-040007.html","海外の製品安全規格（JETRO）",["CEマーキングはEU域内で販売する製品が指令に適合していることを示す表示である。","UL規格は米国の安全規格で、ULマークで示される。","PSEは日本の電気用品安全法に基づく表示制度で、中国の制度ではない。"],"https://www.youtube.com/watch?v=O0vpPcKdN70","【超入門】CEマーキング講座","",["w:024_0","中国の強制認証制度を示すCCCマーク",{"a":"C.C.C.jpg: 台灣德國萊因 derivative work: McSush (talk)","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:C.C.C.-Logo.svg"}]],["定格以上の電流から回路を保護し、加熱や発火を防止する部品は？","ヒューズ","バリスタ","サーミスタ","ダイオード","ヒューズは、定格以上の電流が流れると、内部の可溶体が発熱して溶断し、回路を切る保護部品。安価で確実だが、一度切れたら交換が必要。繰り返し使える保護素子にはブレーカやPTCサーミスタがある。","https://detail-infomation.com/poly-switch/","ポリスイッチ（リセッタブルヒューズ）とは（Electrical Information）",["バリスタは過電圧で抵抗が下がりサージを吸収する素子で、過電流で回路を切るものではない。","サーミスタは温度で抵抗が変わる素子で、主に温度測定や温度補償に使われる。","ダイオードは一方向にだけ電流を流す素子で、過電流で回路を遮断する機能はない。"],"https://www.youtube.com/watch?v=ymPMlEizRxA","ヒューズの役割と選び方","",["w:154_0","ガラス管ヒューズの外観",{"a":"SLXViper","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:G-Sicherung_ausgel%C3%B6st.png"}]],["ブレーカの2種類の組合せは？","配線用遮断器（ブレーカ）、漏電ブレーカ","ヒューズ、バリスタ","リレー、コンタクタ","サーキットプロテクタ、サージアブソーバ","ブレーカには、過電流や短絡で回路を遮断する配線用遮断器（ブレーカ）と、漏電を検出して遮断する漏電ブレーカ（漏電遮断器）がある。ヒューズと違い、原因を取り除けばスイッチを戻して再使用できる。","https://detail-infomation.com/poly-switch/","ポリスイッチ（リセッタブルヒューズ）とは（Electrical Information）",["ヒューズとバリスタは保護部品だが、ヒューズは溶断式、バリスタはサージ吸収素子でブレーカではない。","リレーとコンタクタは電気信号で接点を開閉する開閉器で、保護のためのブレーカではない。","サーキットプロテクタは機器用の小型遮断器だが、サージアブソーバは過電圧吸収素子でブレーカではない。"],"https://www.youtube.com/watch?v=ymPMlEizRxA","ヒューズの役割と選び方","",["w:133_0","漏電ブレーカ（漏電遮断器）の外観例",{"a":"Diermaier","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Residual_current_device_(RCD).jpg"}]],["温度が上がると抵抗値が上がって電流を流れにくくする電流制限用素子は？","PTCサーミスタ","NTCサーミスタ","バリスタ","ツェナーダイオード","PTCサーミスタ（正特性サーミスタ）は、ある温度を超えると抵抗値が急激に上がる素子。過電流で自分が発熱すると抵抗が上がって電流を絞り、温度が下がると元に戻る。繰り返し使えるヒューズ（ポリスイッチ）として使われる。","https://detail-infomation.com/varistor/","バリスタとは（Electrical Information）",["NTCサーミスタは温度が上がると抵抗が下がる素子で、温度測定や突入電流防止に使われる。","バリスタは電圧が一定以上になると抵抗が下がる素子で、温度で抵抗は変化しない。","ツェナーダイオードは逆方向の降伏電圧を利用して電圧を一定に保つ素子で、電流制限用ではない。"],"https://www.youtube.com/watch?v=BDNmI2S1gNI","サージ吸収ユニット制作方法 ～バリスタ～",""],["電圧が低いと抵抗が高く、ある電圧以上で急に抵抗が下がる性質で、静電気などの高電圧から部品を守る素子は？","バリスタ","PTCサーミスタ","ヒューズ","フォトカプラ","バリスタは、普段は抵抗が非常に高く電流をほとんど流さないが、ある電圧（バリスタ電圧）を超えると急に抵抗が下がって電流を流す素子。回路と並列に入れ、静電気や雷サージなどの異常電圧を吸収して部品を守る。","https://detail-infomation.com/varistor/","バリスタとは（Electrical Information）",["PTCサーミスタは温度が上がると抵抗が急増する素子で、電圧ではなく過電流による発熱で動作する。","ヒューズは過電流で溶断する部品で、電圧によって抵抗が変化する性質はもたない。","フォトカプラは光で信号を伝え入出力を電気的に絶縁する素子で、過電圧を吸収しない。"],"https://www.youtube.com/watch?v=BDNmI2S1gNI","サージ吸収ユニット制作方法 ～バリスタ～","",["w:170_0","バリスタ（酸化金属バリスタ）の外観",{"a":"Michael Schmid","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Varistor_S14K385_photo.jpg"}]],["P型半導体とN型半導体の接合を何というか？","PN接合","ショットキー接合","ヘテロ接合","オーミック接触","PN接合は、P型半導体とN型半導体を接合した構造。P側からN側（順方向）には電流が流れやすく、逆方向にはほとんど流れない整流作用をもつ。ダイオードの基本構造で、トランジスタや太陽電池にも使われている。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/discrete/chap1/chap1-6.html","PN接合とは（東芝デバイス＆ストレージ）",["ショットキー接合は金属と半導体の接合で、順方向電圧が小さく高速なダイオードに使われる。","ヘテロ接合は種類の異なる半導体どうしの接合で、レーザーダイオードなどに使われる。","オーミック接触は金属と半導体の間で整流性のない電極接続のことで、PとNの接合ではない。"],"https://www.youtube.com/watch?v=UeZkIYW0vHI","【半導体教育04】PN接合とは何か？","",["x:elec1_82","ダイオードの順方向電圧と逆方向電圧"]],["ダイオードのP型側とN型側の電極をそれぞれ何というか？","アノード、カソード","カソード、アノード","エミッタ、コレクタ","ドレイン、ソース","ダイオードのP型側の電極をアノード（A）、N型側をカソード（K）という。電流はアノードからカソードへ流れる。回路記号の三角形の向きが電流の流れる向きで、縦線側がカソード。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/discrete/chap1/chap1-6.html","PN接合とは（東芝デバイス＆ストレージ）",["カソード、アノードの順は逆で、P型側がアノード、N型側がカソードである。","エミッタとコレクタはバイポーラトランジスタの端子名で、ダイオードの電極名ではない。","ドレインとソースはFETの端子名で、ダイオードの電極名ではない。"],"https://www.youtube.com/watch?v=UeZkIYW0vHI","【半導体教育04】PN接合とは何か？","",["x:elec1_83","ダイオードの構造（PN接合・アノード・カソード）"]],["PN接合付近の、正孔や電子が存在しない部分を何というか？","空乏層","反転層","障壁層","活性層","空乏層は、PN接合の境目付近で、電子と正孔が結合して消え、キャリア（電荷を運ぶもの）がほとんどなくなった領域。逆方向電圧をかけると空乏層が広がって電流が流れなくなる。この幅の変化を利用したのが可変容量ダイオード。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/discrete/chap1/chap1-6.html","PN接合とは（東芝デバイス＆ストレージ）",["反転層はMOSFETのゲート電圧によって半導体表面に生じる、少数キャリアが多数となった層である。","障壁層は接合部の電位障壁を指すことがあるが、キャリアのない領域を表す一般的な名称ではない。","活性層はレーザーダイオードやLEDで電子と正孔が再結合して発光する層である。"],"https://www.youtube.com/watch?v=UeZkIYW0vHI","【半導体教育04】PN接合とは何か？",""],["入力端子からVccとGNDへそれぞれダイオードを入れた回路で、ダイオードはどんな役割をするか？","0〜Vccの範囲を超えたとき電流をダイオードに逃がして回路を保護する","入力信号を整流する","入力電圧を増幅する","発振を起こす","入力端子からVcc側とGND側へダイオードを入れておくと（クランプダイオード）、入力がVccより高くなったりGNDより低くなったりしたとき、ダイオードが導通して余分な電流を電源やGNDに逃がす。ICの入力を静電気や過電圧から守る保護回路。","https://detail-infomation.com/relay-back-electromotive-force/","リレーの逆起電力とダイオード（Electrical Information）",["整流は交流を一方向の電流にすることで、この保護ダイオードは通常の入力範囲では導通しない。","ダイオードには増幅作用がなく、入力電圧を大きくすることはできない。","発振には増幅と帰還が必要で、クランプダイオードだけでは発振しない。"],"https://www.youtube.com/watch?v=TTGBposgjNI","逆起電力のコイルサージからダイオードで保護してみた","",["x:elec1_85","ダイオードを用いた保護回路（入力保護）"]],["リレーコイルに並列に逆向きのダイオードを入れる目的は？","遮断時のコイルの逆起電力から回路を保護する","コイルの電流を増やす","リレーを高速にオンさせる","交流を直流に変える","リレーのコイルに流れていた電流を切ると、コイルは電流を流し続けようとして高い逆起電力を発生させ、駆動するトランジスタを壊すことがある。コイルと並列に逆向きのダイオード（フライホイールダイオード）を入れると、その電流をダイオードで循環させて吸収できる。","https://detail-infomation.com/relay-back-electromotive-force/","リレーの逆起電力とダイオード（Electrical Information）",["逆向きのダイオードは通常時は電流を流さないので、コイルの電流を増やす働きはない。","フライホイールダイオードはむしろ遮断時の電流を長引かせ、高速動作には寄与しない。","整流は交流を直流にする働きで、直流で駆動するリレーコイルの保護とは目的が異なる。"],"https://www.youtube.com/watch?v=TTGBposgjNI","逆起電力のコイルサージからダイオードで保護してみた","",["x:elec1_85","リレーコイルの逆起電力を逃がすダイオード"]],["2つのトランジスタと検出抵抗R1で、R1の電圧が約0.7Vを超えるとTR2がオンになる回路の役割は？","電流制限（過電流保護）","電圧増幅","発振","整流","出力電流を検出抵抗R1に流し、R1の電圧降下がTR2のベース-エミッタ間電圧（約0.7V）を超えるとTR2がオンする。すると出力用トランジスタのベース電流がTR2に奪われ、出力電流がそれ以上増えないよう制限される。電源回路の過電流保護に使われる。","https://detail-infomation.com/over-current-protection/","過電流保護回路とは（Electrical Information）",["電圧増幅は小さな信号電圧を大きくする働きで、R1の電圧を検出してTR2をオンにする回路の目的ではない。","発振は帰還によって回路が自ら交流信号を作る動作で、この回路は電流を制限するためのものである。","整流は交流を一方向の電流にする働きで、トランジスタによる電流検出回路とは異なる。"],"https://www.youtube.com/watch?v=6Qigp_sZFBI","【電子工作】MOSFETの使い方、定電流回路編","",["x:elec1_87","トランジスタを用いた電流制限回路"]],["落雷や接触不良、静電気などで瞬間的に発生する高電圧を何と呼ぶか？","サージ電圧","リップル電圧","ツェナー電圧","バイアス電圧","サージ電圧は、雷、誘導負荷の開閉、接触不良、静電気放電などで、ごく短時間だけ発生する異常に高い電圧。半導体部品の破壊や誤動作の原因になるため、バリスタやTVSダイオードなどで吸収する。","https://detail-infomation.com/varistor/","バリスタとは（Electrical Information）",["リップル電圧は整流・平滑した直流に残る周期的な電圧の変動である。","ツェナー電圧はツェナーダイオードの逆方向で降伏が起こる電圧で、定電圧回路に使われる。","バイアス電圧はトランジスタなどを適切な動作点で動かすためにかける直流電圧である。"],"https://www.youtube.com/watch?v=BDNmI2S1gNI","サージ吸収ユニット制作方法 ～バリスタ～",""],["サージ電圧から回路の半導体を保護するために使う素子は？","バリスタ","PTCサーミスタ","電解コンデンサ","フォトダイオード","バリスタは、サージ電圧が加わったときだけ抵抗が下がって電流を流し、電圧を一定以下に抑えることで、回路の半導体を保護する。電源の入力部や通信線の保護によく使われる。","https://detail-infomation.com/varistor/","バリスタとは（Electrical Information）",["PTCサーミスタは過電流による発熱で抵抗が上がる素子で、瞬間的なサージ電圧の吸収には向かない。","電解コンデンサは主に電源の平滑に使う大容量コンデンサで、サージ吸収用の素子ではない。","フォトダイオードは光を受けて電流を生じる受光素子で、回路の保護には使わない。"],"https://www.youtube.com/watch?v=BDNmI2S1gNI","サージ吸収ユニット制作方法 ～バリスタ～","",["x:elec1_89","バリスタを用いたサージ保護回路"]],["バリスタが動作し、それ以上のサージ電圧を抑制し始める電圧を何というか？","バリスタ電圧","降伏電圧","しきい値電圧","ピーク電圧","バリスタ電圧は、バリスタに一定の電流（通常1mA）を流したときの両端電圧で、この電圧を超えるとバリスタが急に電流を流し始め、電圧を抑え込む。回路の通常の電圧より高く、保護したい部品の耐圧より低いものを選ぶ。","https://detail-infomation.com/varistor/","バリスタとは（Electrical Information）",["降伏電圧はダイオードなどの逆方向電圧で急に電流が流れ始める電圧で、バリスタ固有の名称ではない。","しきい値電圧はトランジスタやFETが導通し始めるゲートやベースの電圧を指す。","ピーク電圧は波形の最大値で、素子が動作し始める電圧の名称ではない。"],"https://www.youtube.com/watch?v=BDNmI2S1gNI","サージ吸収ユニット制作方法 ～バリスタ～","",["x:elec1_90","バリスタの電圧－電流特性"]],["正弦波電圧をダイオードで整流し、マイナス側がカットされた電流（電圧）を何というか？","脈流","直流","交流","高調波","脈流は、向きは一定だが大きさが周期的に変動する電流（電圧）。正弦波を半波整流すると、マイナス側が切り取られた脈流になる。これをコンデンサで平滑すると直流に近づく。","https://detail-infomation.com/diode/","ダイオードとは（Electrical Information）",["直流は大きさと向きが一定の電流で、整流しただけで大きさが変動する波形とは異なる。","交流は向きが周期的に入れ替わる電流で、マイナス側をカットした波形は交流ではない。","高調波は基本周波数の整数倍の周波数成分のことで、整流後の波形の名称ではない。"],"https://www.youtube.com/watch?v=z7artYb2BxY","整流回路の動作原理を基礎から解説（半波/全波/平滑化）","",["x:elec1_91","半波整流回路と脈流"]],["整流回路の3種類の組合せは？","半波整流回路、全波整流回路、ブリッジ整流回路","半波整流回路、倍電圧回路、チョッパ回路","全波整流回路、インバータ回路、平滑回路","ブリッジ整流回路、昇圧回路、降圧回路","整流回路には、正弦波の片側半分だけを使う半波整流回路、両側を使う全波整流回路（センタータップ付き変圧器とダイオード2個）、ダイオード4個でブリッジを組む全波のブリッジ整流回路がある。","https://detail-infomation.com/diode/","ダイオードとは（Electrical Information）",["倍電圧回路は入力の約2倍の直流を得る回路、チョッパ回路は直流電圧を変換する回路で、整流の基本3種ではない。","インバータ回路は直流を交流に変換する回路、平滑回路は脈流をならす回路で、整流回路ではない。","昇圧回路や降圧回路は電圧を変換する回路で、整流回路の種類ではない。"],"https://www.youtube.com/watch?v=z7artYb2BxY","整流回路の動作原理を基礎から解説（半波/全波/平滑化）","",["x:elec1_92","両波整流回路"]],["ブリッジ整流回路で用いるダイオードの数はいくつか？","4つ","2つ","1つ","6つ","ブリッジ整流回路は、4個のダイオードをブリッジ状に組み、入力の正負どちらの半周期でも出力側に同じ向きの電流を流す全波整流回路。センタータップ付きの変圧器が不要なので広く使われている。","https://detail-infomation.com/diode/","ダイオードとは（Electrical Information）",["2つはセンタータップ付き変圧器を使う全波整流回路で用いるダイオードの数である。","1つは半波整流回路で用いるダイオードの数である。","6つは三相交流を全波整流する三相ブリッジ整流回路で用いる数である。"],"https://www.youtube.com/watch?v=z7artYb2BxY","整流回路の動作原理を基礎から解説（半波/全波/平滑化）","",["x:elec1_93","ブリッジ整流回路（ダイオード4個）"]],["三相交流の各相の位相差はどのくらいか？","2π/3 [rad]（120°）","π/2 [rad]","π/3 [rad]","π [rad]","三相交流は、同じ大きさで位相が2π/3[rad]（120°）ずつずれた3つの正弦波からなる。3相の電圧を足すと常にゼロになるので、平衡負荷では中性線に電流が流れない。","https://www.orientalmotor.co.jp/ja/tech/e-learning/ac-list/fundamental/1-4","ACモーターの動作原理2（回転磁界）（オリエンタルモーター）",["π/2（90°）はコイルやコンデンサの電圧と電流の位相差で、三相の相間の位相差ではない。","π/3（60°）は三相の相間位相差の半分で、3相が均等に1周を分ける角度ではない。","π（180°）は2つの交流が完全に逆相となる関係で、三相交流の位相差ではない。"],"https://www.youtube.com/watch?v=6vzrJtCPlVo","【交流回路】単相交流と三相交流の違い Y結線編","",["x:elec1_29","三相交流の発生と120°ずつずれた電圧波形"]],["デジタル処理で、ローパスフィルタと同じ働きをする代表的な信号処理は？","移動平均処理","微分処理","FFT","量子化","移動平均処理は、直近の複数のデータの平均をとって出力する処理。急激な変化（高い周波数の成分）がならされるので、ローパスフィルタと同じ働きをする。センサ値のノイズ除去などに使われる。","https://edn.itmedia.co.jp/edn/articles/1403/17/news023.html","デジタルフィルター超入門編（EDN Japan）",["微分処理は変化の大きい高周波成分を強調する処理で、ハイパスフィルタに近い働きをする。","FFTは信号を周波数成分に分解する高速フーリエ変換で、それ自体はフィルタ処理ではない。","量子化はアナログ値を離散的な数値に丸める処理で、むしろ量子化雑音を生じる。"],"https://www.youtube.com/watch?v=BfVqnTptv_E","ローパスフィルタで学ぶ デジタル制御入門","",["x:elec1_95","移動平均処理の構成"]],["水晶振動子の発振原理は？","圧電効果","ホール効果","ペルチェ効果","光電効果","水晶振動子は、水晶に電圧をかけると変形し、変形させると電圧が生じる圧電効果を利用している。水晶は決まった固有振動数で非常に安定して振動するため、時計やマイコンのクロックの正確な基準信号を作るのに使われる。","https://www.ndk.com/jp/products/column/crystal-unit-basics.html","水晶振動子とは？仕組みと圧電効果の原理（日本電波工業）",["ホール効果は電流と磁界に直角な方向に電圧が生じる現象で、磁気センサに使われる。","ペルチェ効果は異種金属の接合部に電流を流すと熱の吸収・放出が起こる現象で、電子冷却に使われる。","光電効果は光が当たると電子が放出される現象で、光センサや太陽電池の原理である。"],"https://www.youtube.com/watch?v=kWwtkCCUuIc","水晶の圧電性と水晶振動子","",["w:138_2","水晶発振器の内部：円板状の水晶片が見える",{"a":"Marcin Andrzejewski","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Crystal_oscillator_internals.JPG"}]],["エミッタ接地回路はどのように使われることが多いか？","微小電圧の増幅","インピーダンス変換（バッファ）","高周波の整流","定電流源","エミッタ接地回路は、入力をベース、出力をコレクタからとり、エミッタを入出力共通にした増幅回路。電圧と電流の両方を増幅でき、電力増幅度が最も大きいため、微小な信号の増幅に最もよく使われる。出力の位相は入力と反転する。","https://detail-infomation.com/difference-of-amplifier-circuit/","エミッタ接地・コレクタ接地・ベース接地回路の違い（Electrical Information）",["インピーダンス変換（バッファ）には電圧増幅度がほぼ1で入力インピーダンスが高いコレクタ接地回路を使う。","トランジスタの接地方式は増幅のためのもので、高周波の整流にはダイオードを用いる。","定電流源はトランジスタの出力特性を使って作るが、エミッタ接地増幅回路の代表的な用途ではない。"],"https://www.youtube.com/watch?v=LayILnWec4U","『エミッタ接地回路』【3分くらい無線講座15】","",["x:elec1_97","トランジスタの3つの接地方式"]],["FETの3つの端子名称は？","ドレイン、ゲート、ソース","エミッタ、ベース、コレクタ","アノード、ゲート、カソード","ソース、ベース、ドレイン","FET（電界効果トランジスタ）の端子は、ドレイン（D）、ゲート（G）、ソース（S）。ゲートにかける電圧でドレイン-ソース間の電流を制御する。バイポーラトランジスタのコレクタ・ベース・エミッタにほぼ対応する。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/mosfet/how-do-n-channel-mosfets-work.html","MOSFETの動作原理と仕組み（東芝デバイス＆ストレージ）",["エミッタ、ベース、コレクタはバイポーラトランジスタの端子名である。","アノード、ゲート、カソードはサイリスタの端子名である。","ベースはバイポーラトランジスタの端子名で、FETではゲートに当たる。"],"https://www.youtube.com/watch?v=tICUiAYg-ik","【電気回路53】FETの構造と動作（JFETとMOS-FET）","",["x:elec1_98","接合型FETの回路記号と構造"]],["断面が円形の電線の電気抵抗値は、円の直径に対してどうなるか？","直径の2乗に反比例する","直径に反比例する","直径に比例する","直径の2乗に比例する","電線の抵抗R＝ρl/A（ρ：抵抗率、l：長さ、A：断面積）。円の断面積A＝πd²/4なので、抵抗は直径dの2乗に反比例する。直径を2倍にすると抵抗は1/4になる。","https://detail-infomation.com/resistance-and-resistivity-equation/","電気抵抗と抵抗率の式の導出（Electrical Information）",["断面積は直径の2乗に比例するため、抵抗は直径の1乗ではなく2乗に反比例する。","直径が大きいほど断面積が増えて電流が流れやすくなるので、抵抗は小さくなる。","直径の2乗に比例するのは断面積で、抵抗は断面積に反比例するため逆の関係になる。"],"https://www.youtube.com/watch?v=Tzpt76-gno0","電気抵抗・電気伝導率・抵抗率をわかりやすく解説","",["x:elec1_99","電線の抵抗と直径の関係"]],["2枚の金属板の面積S、間隔d、誘電率εのとき、静電容量Cはどう表されるか？","C ＝ εS / d","C ＝ εd / S","C ＝ Sd / ε","C ＝ ε / (Sd)","平行平板コンデンサの静電容量 C＝εS/d。電極の面積Sが大きいほど、間隔dが狭いほど、誘電率εが大きいほど容量は大きくなる。誘電率の大きい材料を使うと、同じ大きさで大容量のコンデンサを作れる。","https://detail-infomation.com/permittivity/","誘電率とは？比誘電率や単位など（Electrical Information）",["εd/Sでは間隔が広いほど容量が大きくなり、実際の性質と逆になる。","Sd/εでは誘電率が大きいほど容量が小さくなり、誘電率の役割が逆になる。","ε/(Sd)では面積が大きいほど容量が小さくなり、面積と容量の比例関係を表せない。"],"https://www.youtube.com/watch?v=PKSGPCeA8GE","電気回路1解説 コンデンサの構造、静電容量","",["x:elec1_100","平行平板コンデンサの原理（面積S・距離d）"]]]},{"id":"elec2","title":"電気電子 1-2 電子回路の基礎・1-3 半導体デバイス","cat":"電気電子","q":[["ブリッジ整流回路は入力電圧の正負に関係なく正の電圧が得られることから何と呼ばれるか？","絶対値回路","倍電圧回路","クランプ回路","比較回路","ブリッジ整流回路は、入力が正でも負でも出力側には同じ向き（正）の電圧が出る。つまり入力の絶対値を取り出す働きをするので、絶対値回路とも呼ばれる。計測回路では、交流信号の大きさを求める前処理として使われる。","https://detail-infomation.com/diode/","ダイオードとは（Electrical Information）",["倍電圧回路は、ダイオードとコンデンサを組み合わせて入力電圧の約2倍の直流電圧を得る回路で、正負をそろえる働きを指す名称ではない。","クランプ回路は、波形の形を変えずに直流レベルを一定値に固定（シフト）する回路で、負の入力を正に折り返す機能はもたない。","比較回路は、2つの電圧の大小を比べてHigh/Lowを出力する回路（コンパレータ）で、入力の絶対値を出力するものではない。"],"https://www.youtube.com/watch?v=z7artYb2BxY","整流回路の動作原理を基礎から解説（半波/全波/平滑化）","",["x:elec2_1","ブリッジ整流回路と入力の正負で変わる電流経路"]],["ゲートからカソードへゲート電流を流すことで、アノード-カソード間を導通させる整流用部品は？","サイリスタ","トライアック","IGBT","ツェナーダイオード","サイリスタ（SCR）は、PNPNの4層構造をもつ半導体スイッチ。ゲートからカソードへ少しの電流を流すとアノード-カソード間が導通し、その後はゲート電流を止めてもオンが続く（自己保持）。大電力の整流や制御に使われる。","https://faq.fa.omron.co.jp/tech/s/article/faq02153","サイリスタとトライアックの違い（オムロン FAQ）",["トライアックはサイリスタ2個を逆並列にした双方向素子で交流制御用。アノード・カソードをもつ単方向の整流用部品ではない。","IGBTは、ゲート電圧でコレクタ-エミッタ間を制御する電圧駆動型素子で、ゲート電流で点弧し自己保持する素子ではない。","ツェナーダイオードは、逆方向の降伏を利用して一定電圧を得るダイオードで、ゲート端子をもたずスイッチ動作もしない。"],"https://www.youtube.com/watch?v=xUK2HsyQWD0","はじめてのサイリスタ/トライアック","",["x:elec2_2","サイリスタの記号・PNPN構造と位相制御の動作"]],["サイリスタ2個を逆並列に接続した構造で、双方向に電流を流せる半導体素子は？","トライアック","サイリスタ","ダイアック","フォトカプラ","トライアックは、サイリスタ2個を逆向きに並列接続した構造の素子で、1つのゲートで両方向の電流をオン・オフできる。交流をそのまま制御できるので、調光器、扇風機の速度調整、電熱器の温度制御などに使われる。","https://faq.fa.omron.co.jp/tech/s/article/faq02153","サイリスタとトライアックの違い（オムロン FAQ）",["サイリスタは一方向にしか電流を流せない単方向素子で、トライアックはこれを2個逆並列にしたものである。","ダイアックは、ゲートをもたない2端子の双方向素子で、一定電圧で導通しトライアックのトリガ用に使われる。サイリスタの逆並列構造ではない。","フォトカプラは、発光素子と受光素子を組み合わせ、電気的に絶縁して信号を伝える部品で、電流を双方向に制御する素子ではない。"],"https://www.youtube.com/watch?v=xUK2HsyQWD0","はじめてのサイリスタ/トライアック","",["x:elec2_3","トライアックの記号と双方向に流れる電流の向き"]],["発光ダイオードで、電流が流れて発光し始める閾値の電圧を何というか？","順方向電圧","逆方向電圧","降伏電圧","ツェナー電圧","順方向電圧（VF）は、ダイオードに順方向の電圧をかけたとき、電流が流れ始めるのに必要な電圧。LEDでは光り始める電圧で、赤で約2V、青や白で約3Vと発光色（材料）で異なる。シリコンダイオードでは約0.6〜0.7V。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/discrete/chap5/chap5-2.html","LEDの発光原理（東芝デバイス＆ストレージ）",["逆方向電圧は、ダイオードのカソード側を高くする向きにかける電圧で、この向きではLEDに電流はほとんど流れず発光しない。","降伏電圧は、逆方向電圧を大きくしたとき急に電流が流れ出す電圧で、LEDでは破損の原因となり、発光し始める電圧ではない。","ツェナー電圧は、ツェナーダイオードが逆方向で降伏し電圧を一定に保つときの電圧で、順方向の発光開始とは関係ない。"],"https://www.youtube.com/watch?v=3YoN5RLrHj4","LEDの仕組みを数式なしで感覚的に理解する【PN接合】",""],["逆方向の降伏領域を利用して一定の電圧を得る定電圧ダイオードは、別名で何と呼ばれるか？","ツェナーダイオード","ショットキーダイオード","フォトダイオード","可変容量ダイオード","ツェナーダイオード（定電圧ダイオード）は、逆方向電圧がある値（ツェナー電圧）を超えると急に電流が流れ、端子電圧がほぼ一定に保たれる性質を利用したダイオード。基準電圧源や過電圧保護に使われる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/diode/what-is-a-zener-diode.html","ツェナーダイオード（定電圧ダイオード）とは（東芝デバイス＆ストレージ）",["ショットキーダイオードは、金属と半導体の接合を使い順方向電圧が低く高速なダイオードで、整流用であり定電圧用途ではない。","フォトダイオードは、光が当たると電流が流れる受光素子で、光センサに使われ、一定電圧を得るためのものではない。","可変容量ダイオード（バリキャップ）は、逆方向電圧で接合容量が変わる性質を利用するダイオードで、同調回路などに使われる。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6281272030001/第2章-ダイオード","e-ラーニング ディスクリート半導体の基礎 第2章 ダイオード（東芝デバイス＆ストレージ 動画ギャラリー）","",["x:elec2_5","ツェナーダイオードの特性（逆方向の降伏領域）"]],["ツェナーダイオードに一定以上の逆方向電圧をかけると、急激に電流が流れる。この効果を何というか？","アバランシェ降伏（なだれ降伏）","トンネル効果","ホール効果","ゼーベック効果","アバランシェ降伏（なだれ降伏）は、強い電界で加速されたキャリアが原子に衝突して新たなキャリアを生み、それが次々に連鎖して急激に電流が増える現象。ツェナーダイオードでは、高い電圧品ではアバランシェ降伏、5V程度以下の低い電圧品ではツェナー降伏（トンネル効果）が主になる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/diode/what-is-a-zener-diode.html","ツェナーダイオード（定電圧ダイオード）とは（東芝デバイス＆ストレージ）",["トンネル効果は、電子が薄い障壁を量子力学的に通り抜ける現象で、低電圧品のツェナー降伏の原理。キャリアの衝突が連鎖するなだれ現象とは異なる。","ホール効果は、電流と垂直に磁界をかけると両者に直交する方向に電圧が生じる現象で、逆方向電圧による降伏とは無関係。","ゼーベック効果は、異種金属の接点間の温度差で起電力が生じる現象で、熱電対の原理。ダイオードの降伏とは関係ない。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6281272030001/第2章-ダイオード","e-ラーニング ディスクリート半導体の基礎 第2章 ダイオード（東芝デバイス＆ストレージ 動画ギャラリー）",""],["信号の中から特定の周波数成分を取り出したり除去したりする回路や機能を何というか？","フィルタ","アンプ","コンパレータ","ミキサ","フィルタは、信号に含まれる周波数成分のうち、必要なものだけを通したり、不要なもの（ノイズなど）を取り除いたりする回路や処理。抵抗・コンデンサ・コイルで作るアナログフィルタと、計算で処理するデジタルフィルタがある。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["アンプは信号の振幅を大きくする増幅器で、周波数成分を選んで取り出したり除去したりする回路ではない。","コンパレータは、2つの入力電圧の大小を比較してHigh/Lowを出力する回路で、周波数を選別する働きはない。","ミキサは、2つの信号を掛け合わせて和や差の周波数を作る（周波数変換する）回路で、特定成分の通過・除去が目的ではない。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）",""],["遮断周波数より低い周波数の信号を通過させるフィルタは？","ローパスフィルタ","ハイパスフィルタ","バンドパスフィルタ","バンドエリミネーションフィルタ","ローパスフィルタ（LPF：低域通過フィルタ）は、遮断周波数より低い周波数を通し、高い周波数を減衰させる。高周波ノイズの除去や、A/D変換前のエイリアシング防止に使う。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["ハイパスフィルタは、遮断周波数より高い周波数を通し低い周波数を減衰させるフィルタで、問いとは逆の特性である。","バンドパスフィルタは特定の周波数帯だけを通すフィルタで、遮断周波数より低い周波数をすべて通すわけではない。","バンドエリミネーションフィルタは、特定の周波数帯だけを除去してそれ以外を通すフィルタで、低域通過とは異なる。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）","",["x:elec2_8","理想的なローパスフィルタの周波数特性"]],["遮断周波数より高い周波数の信号を通過させるフィルタは？","ハイパスフィルタ","ローパスフィルタ","バンドパスフィルタ","ノッチフィルタ","ハイパスフィルタ（HPF：高域通過フィルタ）は、遮断周波数より高い周波数を通し、低い周波数（直流分を含む）を減衰させる。直流成分のカットや、ゆっくりした変動（ドリフト）の除去に使う。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["ローパスフィルタは、遮断周波数より低い周波数を通し高い周波数を減衰させるフィルタで、問いとは逆の特性である。","バンドパスフィルタは、低域と高域の両方を減衰させて特定の帯域だけを通すフィルタで、高い周波数をすべて通すわけではない。","ノッチフィルタは、ごく狭い特定の周波数だけを鋭く除去するフィルタ（BEFの一種）で、低域を広く減衰させるものではない。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）","",["x:elec2_9","理想的なハイパスフィルタの周波数特性"]],["LPFとHPFを組み合わせ、希望する周波数帯域だけを通過させるフィルタは？","バンドパスフィルタ","バンドエリミネーションフィルタ","オールパスフィルタ","ローパスフィルタ","バンドパスフィルタ（BPF：帯域通過フィルタ）は、LPFとHPFを組み合わせ、両者が重なる特定の周波数帯だけを通す。ラジオの選局や、特定の周波数の振動の検出などに使う。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["バンドエリミネーションフィルタは、特定の帯域だけを除去しそれ以外を通すフィルタで、BPFとは逆の働きである。","オールパスフィルタは、全周波数でゲインを一定に保ったまま位相だけを変えるフィルタで、帯域を選んで通すものではない。","ローパスフィルタは遮断周波数より低い周波数をすべて通す単独のフィルタで、HPFと組み合わせた帯域選択ではない。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）","",["x:elec2_10","理想的なバンドパスフィルタの周波数特性"]],["LPFとHPFを組み合わせ、希望する周波数帯域だけを通過させないフィルタは？","バンドエリミネーションフィルタ","バンドパスフィルタ","ハイパスフィルタ","適応フィルタ","バンドエリミネーションフィルタ（BEF：帯域除去フィルタ）は、特定の周波数帯だけを取り除き、それ以外を通す。電源周波数（50/60Hz）のハムノイズを除去するノッチフィルタが代表例。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["バンドパスフィルタは希望する帯域だけを通すフィルタで、問いとは逆に、その帯域以外を減衰させる。","ハイパスフィルタは遮断周波数より高い周波数を通す単独のフィルタで、特定の帯域だけを除去するものではない。","適応フィルタは環境に応じて係数を逐次修正するデジタルフィルタで、LPFとHPFの組合せで帯域を除去する構成の名称ではない。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）","",["x:elec2_11","理想的なバンドエリミネーションフィルタの特性"]],["システムが入力信号の変化をどのような出力信号の変化に変換するかを示す関数は？","伝達関数","周波数関数","ステップ関数","ハッシュ関数","伝達関数は、入力のラプラス変換に対する出力のラプラス変換の比で、システムが入力をどのような出力に変えるかを表す関数。ブロック線図でシステムを表したり、安定性や応答を解析したりするのに使う。","https://engineer-education.com/machine-design-64_automatic-control_transfer-function_block-diagram/","伝達関数の求め方とブロック線図（エンジニア教育）",["周波数関数は制御工学の一般的な用語ではない。周波数に対する応答を表すのは、伝達関数のsをjωに置いた周波数伝達関数である。","ステップ関数は、ある時刻で0から一定値に跳ね上がる入力信号を表す関数で、システムの入出力関係を表すものではない。","ハッシュ関数は、任意のデータから固定長の値を生成する情報処理の関数で、システムの信号変換とは無関係。"],"https://www.youtube.com/watch?v=fJ1uzuf3yvQ","自動制御（４）伝達関数（一次遅れ・二次遅れ・むだ時間）",""],["比例要素の伝達関数は？","K","1/s","Ks","1/(1+Ts)","比例要素は、入力を一定倍した出力をすぐに出す要素で、伝達関数はK（比例定数、ゲイン）。遅れや変化がない最も単純な要素で、ばねや抵抗、てこなどがこれにあたる。","https://engineer-education.com/machine-design-64_automatic-control_transfer-function_block-diagram/","伝達関数の求め方とブロック線図（エンジニア教育）",["1/sは積分要素の伝達関数で、入力を時間積分した出力を出す要素を表す。","Ksは微分要素の伝達関数で、入力の変化の速さに比例した出力を出す要素を表す。","1/(1+Ts)は時定数Tの一次遅れ要素の伝達関数で、出力が入力に遅れて追従する要素を表す。"],"https://www.youtube.com/watch?v=fJ1uzuf3yvQ","自動制御（４）伝達関数（一次遅れ・二次遅れ・むだ時間）",""],["RC回路（一次遅れ要素）の伝達関数は？（抵抗R、キャパシタンスC）","1/(1+RCs)","RCs/(1+RCs)","1+RCs","1/(RCs)","RC回路（抵抗Rを直列、コンデンサCを出力側に並列）の伝達関数は1/(1＋RCs)。T＝RCを時定数とする一次遅れ要素で、ステップ入力に対して出力が指数関数的に近づいていく。","https://engineer-education.com/machine-design-64_automatic-control_transfer-function_block-diagram/","伝達関数の求め方とブロック線図（エンジニア教育）",["RCs/(1+RCs)は、コンデンサを直列、抵抗を出力側に入れたRCハイパスフィルタ（不完全微分）の伝達関数である。","1+RCsは比例＋微分の形（一次進み）で、一次遅れの逆数にあたり、受動のRC回路単体では実現できない。","1/(RCs)は時定数RCの積分要素の伝達関数で、オペアンプ積分回路の形（符号を除く）。一次遅れ要素ではない。"],"https://www.youtube.com/watch?v=fJ1uzuf3yvQ","自動制御（４）伝達関数（一次遅れ・二次遅れ・むだ時間）","",["x:elec2_14","RC回路（一次遅れ要素）とその伝達関数"]],["RLC回路（二次遅れ要素）の伝達関数は？","(1/LC) / {s² + (R/L)s + 1/LC}","1/(1+RCs)","(R/L)s / {s² + 1/LC}","LCs² + RCs + 1","RLC直列回路の伝達関数は (1/LC)/{s²＋(R/L)s＋1/LC}で、分母がsの2次式の二次遅れ要素になる。固有角周波数ωn＝1/√(LC)、減衰比はRで決まり、減衰比が小さいと振動しながら収束する。","https://engineer-education.com/machine-design-64_automatic-control_transfer-function_block-diagram/","伝達関数の求め方とブロック線図（エンジニア教育）",["1/(1+RCs)はRC回路の一次遅れ要素の伝達関数で、分母がsの1次式でありLを含まないので二次遅れではない。","分母に減衰項(R/L)sが欠けており、RLC回路の形として成り立たない。抵抗両端を出力とする場合でも分母は正解と同じ2次式になる。","LCs²+RCs+1は正解の伝達関数の逆数にあたる式で、分母多項式そのものであり出力/入力の比になっていない。"],"https://www.youtube.com/watch?v=fJ1uzuf3yvQ","自動制御（４）伝達関数（一次遅れ・二次遅れ・むだ時間）",""],["伝達関数G(s)で s ＝ jω と置いた G(jω) を何というか？","周波数伝達関数","インパルス応答","インディシャル応答","特性方程式","伝達関数G(s)のsをjωに置き換えたG(jω)を周波数伝達関数という。その大きさ|G(jω)|がゲイン、偏角が位相を表し、これを周波数ごとに描いたのがボード線図。","https://engineer-education.com/machine-design-64_automatic-control_transfer-function_block-diagram/","伝達関数の求め方とブロック線図（エンジニア教育）",["インパルス応答は、単位インパルスを入力したときの出力の時間波形で、伝達関数を逆ラプラス変換したものに当たる。","インディシャル応答は、単位ステップ入力に対する出力の時間応答（ステップ応答）で、sをjωに置いたものではない。","特性方程式は伝達関数の分母を0とおいた方程式で、その根（極）からシステムの安定性を判別するのに使う。"],"https://www.youtube.com/watch?v=fJ1uzuf3yvQ","自動制御（４）伝達関数（一次遅れ・二次遅れ・むだ時間）","",["w:014_4","ボード線図：周波数に対するゲインと位相の変化",{"a":"User:Brews_ohare","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Low-Pass_filter_Bode_Magnitude_and_Phase_plots.png"}]],["入力に直列に抵抗、出力と並列にコンデンサを接続したRC回路はどんなフィルタか？","ローパスフィルタ","ハイパスフィルタ","バンドパスフィルタ","ノッチフィルタ","入力に直列に抵抗、出力と並列（GND側）にコンデンサを入れたRC回路では、高い周波数ほどコンデンサのリアクタンスが小さくなって信号がGNDへ逃げるため、低い周波数だけが出力に残る。これがRCローパスフィルタで、遮断周波数はf＝1/(2πRC)。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["ハイパスフィルタは、コンデンサを直列、抵抗を出力と並列に入れたRC回路で得られ、素子の配置が逆である。","バンドパスフィルタはRとCの1組だけでは得られず、LPFとHPFを組み合わせるなどの構成が必要である。","ノッチフィルタは特定周波数だけを鋭く除去するフィルタで、ツインT回路などで構成し、RC1段では実現できない。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）","",["x:elec2_17","RCローパスフィルタ回路とボード線図"]],["遮断周波数以上でゲインの傾きが周波数に比例するもの・2乗になるものを、それぞれ何フィルタというか？","1次フィルタ、2次フィルタ","アクティブフィルタ、パッシブフィルタ","FIRフィルタ、IIRフィルタ","LCフィルタ、RCフィルタ","遮断周波数より上で、1次フィルタは周波数が10倍になるごとにゲインが−20dB（周波数に比例して減衰）、2次フィルタは−40dB（周波数の2乗に比例して減衰）になる。次数が高いほど、遮断特性が急峻になる。","https://detail-infomation.com/lpf-hpf-bpf-bsf/","LPF・HPF・BPF・BSFの違い（Electrical Information）",["アクティブ・パッシブは、オペアンプなどの能動素子を使うか受動素子だけで作るかによる分類で、減衰の傾き（次数）とは関係ない。","FIR・IIRはデジタルフィルタの構造（帰還の有無）による分類で、遮断周波数以上の減衰の傾きを表す名称ではない。","LC・RCはフィルタを構成する素子の種類による分類で、次数を表す名称ではない。RCでも多段にすれば2次以上になる。"],"https://www.youtube.com/watch?v=kZdvpxp00Rc","フィルタによる信号処理（ローパス・ハイパス・ゲイン線図）","",["x:elec2_18","1次と2次RCローパスフィルタのゲイン傾き比較"]],["有限インパルス応答フィルタと無限インパルス応答フィルタは、略してそれぞれ何と呼ばれるか？","FIRフィルタ、IIRフィルタ","IIRフィルタ、FIRフィルタ","LPF、HPF","BPF、BEF","FIR（Finite Impulse Response：有限インパルス応答）フィルタは、過去の入力だけから出力を計算し、常に安定で位相特性も良い。IIR（Infinite Impulse Response：無限インパルス応答）フィルタは、過去の出力も使う（帰還がある）ため、少ない計算量で急峻な特性を作れるが、不安定になることもある。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/digital-filter-c-implementation.jsp","デジタルフィルタの実装（キーエンス）",["略称の順序が逆である。有限インパルス応答がFIR、無限インパルス応答がIIRに対応する。","LPF・HPFはローパスとハイパスの略で、通過させる周波数帯による分類。インパルス応答の長さによる分類ではない。","BPF・BEFはバンドパスとバンドエリミネーションの略で、帯域の通過・除去による分類であり、インパルス応答とは関係ない。"],"https://www.youtube.com/watch?v=BfVqnTptv_E","ローパスフィルタで学ぶ デジタル制御入門",""],["ノイズキャンセルなどに使われる、特性を逐次修正しながら処理するフィルタは？","適応フィルタ","FIRフィルタ","アナログフィルタ","ノッチフィルタ","適応フィルタは、入力信号や環境の変化に応じて、フィルタの係数を自動的に逐次修正しながら処理するデジタルフィルタ。ノイズキャンセリングヘッドホンや、電話のエコーキャンセラなどに使われる。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/digital-filter-c-implementation.jsp","デジタルフィルタの実装（キーエンス）",["FIRフィルタは係数を固定した有限インパルス応答のデジタルフィルタで、それ自体には特性を逐次修正する仕組みはない。","アナログフィルタはR・L・Cなどで構成し、特性が素子の値で固定されるため、係数を自動で逐次修正することはできない。","ノッチフィルタは特定の周波数だけを除去する固定特性のフィルタで、環境に応じて特性を修正するものではない。"],"https://www.youtube.com/watch?v=BfVqnTptv_E","ローパスフィルタで学ぶ デジタル制御入門",""],["外部から供給されたエネルギーを使って、信号の振幅を大きくすることを何というか？","増幅","変調","整流","発振","増幅は、電源から供給されるエネルギーを使って、入力信号と同じ形でより大きな振幅の出力信号を作ること。トランジスタやオペアンプが使われる。増幅度は出力÷入力で、dBで表すことも多い。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/linear_opamp/what-is-the-virtual-short-of-an-op-amp.html","オペアンプの仮想短絡とは（東芝デバイス＆ストレージ）",["変調は、搬送波の振幅・周波数・位相を信号に応じて変化させて情報を載せることで、振幅を大きくすることではない。","整流は交流を一方向の電流（直流）に変換することで、ダイオードなどで行い、信号を大きくするものではない。","発振は入力なしに周期的な信号を自ら作り出すことで、入力信号の振幅を大きくする働きとは異なる。"],"https://www.youtube.com/watch?v=8KsJ5fVcAQA","文系でもわかる！オペアンプの基本回路 3選",""],["オペアンプの出力Voは、電圧増幅度Av、非反転入力Vn、反転入力Viを用いてどう表されるか？","Vo ＝ Av(Vn − Vi)","Vo ＝ Av(Vi − Vn)","Vo ＝ Av(Vn + Vi)","Vo ＝ (Vn − Vi)/Av","オペアンプの出力は、非反転入力（＋）と反転入力（−）の電圧の差に、非常に大きな電圧増幅度Avを掛けたもの（Vo＝Av(Vn−Vi)）。Avが非常に大きいため、負帰還をかけて使うのが基本。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/linear_opamp/what-is-the-virtual-short-of-an-op-amp.html","オペアンプの仮想短絡とは（東芝デバイス＆ストレージ）",["差の向きが逆である。この式では反転入力を上げると出力も上がることになり、反転入力の定義と矛盾する。","2入力の和を増幅する式になっている。オペアンプは差動増幅器なので、和ではなく差を増幅する。","差を増幅度で割っており、出力が非常に小さくなってしまう。増幅度Avは差に掛けるのが正しい。"],"https://www.youtube.com/watch?v=8KsJ5fVcAQA","文系でもわかる！オペアンプの基本回路 3選","",["x:elec2_22","オペアンプの図記号と各端子（VN・VI・VO）"]],["オペアンプで負帰還時にVn ＝ Viとなり、2つの入力端子が仮想的に短絡している状態を何というか？","仮想短絡（イマジナリショート）","仮想接地","開放","飽和","仮想短絡（イマジナリショート）は、負帰還をかけたオペアンプで、増幅度が非常に大きいため2つの入力端子の電位がほぼ等しくなる状態。実際には導線でつながっていないのに短絡したように扱えるので、回路計算が簡単になる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/linear_opamp/what-is-the-virtual-short-of-an-op-amp.html","オペアンプの仮想短絡とは（東芝デバイス＆ストレージ）",["仮想接地は、非反転入力を接地したとき仮想短絡により反転入力もほぼ0Vとみなせる状態を指し、2端子が等電位になる状態そのものの名称ではない。","開放は端子間が電気的につながっておらず電流が流れない状態で、2つの入力端子が同電位になる状態を指すものではない。","飽和は出力が電源電圧付近で頭打ちになる状態で、このときは負帰還が効かずVn＝Viは成り立たない。"],"https://www.youtube.com/watch?v=8KsJ5fVcAQA","文系でもわかる！オペアンプの基本回路 3選",""],["理想に近いオペアンプのオープンループ電圧増幅度はどのくらいか？","10⁶ 程度","10 程度","10³ 程度","1 程度","理想に近いオペアンプのオープンループ（帰還なし）電圧増幅度は10⁵〜10⁶程度と非常に大きい。そのままでは出力がすぐ飽和するので、負帰還をかけ、外付け抵抗の比で増幅度を決めて使う。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/linear_opamp/what-is-the-virtual-short-of-an-op-amp.html","オペアンプの仮想短絡とは（東芝デバイス＆ストレージ）",["10程度は一般的な増幅回路の閉ループ増幅度程度の値で、オペアンプのオープンループ増幅度としては小さすぎる。","10³程度ではオペアンプとして不十分で、仮想短絡を前提とした回路計算の誤差が大きくなってしまう。","1程度はボルテージフォロアの閉ループ増幅度に相当する値で、オープンループ増幅度ではない。"],"https://www.youtube.com/watch?v=8KsJ5fVcAQA","文系でもわかる！オペアンプの基本回路 3選",""],["出力を反転入力に直結した、入出力関係が Vo ＝ Vi/(1+1/Av) となる回路は？","ボルテージフォロア回路","反転増幅回路","差動増幅回路","積分回路","ボルテージフォロアは、出力を反転入力に直結し、非反転入力に信号を入れる回路。Vo＝Vi/(1＋1/Av)で、Avが非常に大きいのでVo≒Vi（増幅度1）となる。電圧はそのままで、インピーダンスだけを変換する。","https://detail-infomation.com/voltage-follower/","ボルテージフォロワをわかりやすく解説（Electrical Information）",["反転増幅回路は入力抵抗と帰還抵抗を使って反転入力に信号を入れる回路で、Vo＝−(R2/R1)Viとなり、出力を直結する構成ではない。","差動増幅回路は2つの入力電圧の差を増幅する回路で、抵抗4本などで構成し、入出力関係も2入力の差の式になる。","積分回路は帰還路にコンデンサを入れ、入力の時間積分に比例した出力を得る回路で、出力を反転入力に直結するものではない。"],"https://www.youtube.com/watch?v=eKRIOt6jKbk","ボルテージ・フォロワ","",["x:elec2_25","出力を反転入力に直結したボルテージフォロア回路"]],["ボルテージフォロア回路の特徴の組合せは？","入力インピーダンスが高い、出力インピーダンスが低い、増幅度が1","入力インピーダンスが低い、出力インピーダンスが高い、増幅度が大きい","位相が反転する、増幅度が−1、入力インピーダンスが低い","入出力インピーダンスともに高い、増幅度が2","ボルテージフォロアは、入力インピーダンスが非常に高い（前段から電流をほとんど引かない）、出力インピーダンスが低い（後段に十分な電流を流せる）、電圧増幅度は1、という特徴をもつ。センサ信号の受け渡しなどに使われる。","https://detail-infomation.com/voltage-follower/","ボルテージフォロワをわかりやすく解説（Electrical Information）",["入力インピーダンスが低く出力インピーダンスが高いと信号の受け渡しに不向きで、ボルテージフォロアとはすべて逆の特徴である。","位相反転・増幅度−1は反転増幅回路でR1＝R2とした場合の特徴で、入力インピーダンスもR1程度と低くなる。","増幅度2は非反転増幅回路でR1＝R2とした場合の値。オペアンプ回路の出力インピーダンスは低いのが普通で、両方高いという点も誤り。"],"https://www.youtube.com/watch?v=eKRIOt6jKbk","ボルテージ・フォロワ","",["w:216_0","ボルテージフォロア回路：出力を反転入力へ直結",{"a":"Д.Ильин: optimization","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Opampvoltagefollower-%D0%B5.svg"}]],["ボルテージフォロア回路は、回路から回路へ電圧を正しく伝えられるため何と呼ばれるか？","バッファアンプ","パワーアンプ","プリアンプ","コンパレータ","バッファアンプ（緩衝増幅器）は、前段の回路に負担をかけずに、後段の回路を駆動するための増幅器。ボルテージフォロアが代表で、信号源のインピーダンスが高くても、電圧を正しく後段へ伝えられる。","https://detail-infomation.com/voltage-follower/","ボルテージフォロワをわかりやすく解説（Electrical Information）",["パワーアンプはスピーカやモータなどの負荷に大きな電力を供給する電力増幅器で、電圧をそのまま受け渡す緩衝用ではない。","プリアンプはマイクやセンサの微小信号を後段で扱える大きさまで増幅する前置増幅器で、増幅度1の回路ではない。","コンパレータは2つの電圧を比較してHigh/Lowを出す回路で、電圧をそのまま後段へ伝える働きはない。"],"https://www.youtube.com/watch?v=eKRIOt6jKbk","ボルテージ・フォロワ","",["x:elec2_27","ボルテージフォロアをバッファとして使う効果"]],["入力抵抗R1、帰還抵抗R2で反転入力に信号を入れる回路の名称と入出力関係は？","反転増幅回路、Vo ＝ −(R2/R1)Vi","非反転増幅回路、Vo ＝ (1+R2/R1)Vi","反転増幅回路、Vo ＝ (R1/R2)Vi","差動増幅回路、Vo ＝ (R2/R1)Vi","反転増幅回路は、入力抵抗R1を通して反転入力に信号を入れ、帰還抵抗R2で出力を反転入力に戻す回路。増幅度は−R2/R1で、出力の位相（極性）が入力と反転する。入力インピーダンスはほぼR1になる。","https://detail-infomation.com/inverting-amplifier-circuit/","反転増幅回路をわかりやすく解説（Electrical Information）",["非反転増幅回路の名称と式で、信号を非反転入力に入れる場合のもの。反転入力に信号を入れる回路ではない。","名称は正しいが式が誤り。増幅度の比はR2/R1で、さらに位相が反転するので負号がつく。","差動増幅回路は2つの入力の差を増幅する回路で、入力が1つの本回路とは異なり、式にも位相反転を示す負号がない。"],"https://www.youtube.com/watch?v=DoK0zXKgHU0","反転増幅回路を解説【オペアンプ】","",["x:elec2_28","反転増幅回路の構成と入出力の式"]],["非反転入力に信号を入れ、R1・R2で負帰還をかける回路の名称と入出力関係は？","非反転増幅回路、Vo ＝ {1+(R2/R1)}Vi","反転増幅回路、Vo ＝ −(R2/R1)Vi","ボルテージフォロア、Vo ＝ Vi","非反転増幅回路、Vo ＝ (R2/R1)Vi","非反転増幅回路は、非反転入力に信号を入れ、出力をR2とR1で分圧して反転入力に戻す回路。増幅度は1＋R2/R1で、必ず1以上になり、位相は反転しない。入力インピーダンスが非常に高いのが特徴。","https://detail-infomation.com/inverting-amplifier-circuit/","反転増幅回路をわかりやすく解説（Electrical Information）",["反転増幅回路の名称と式で、信号を反転入力側に入れる場合のもの。非反転入力に信号を入れる回路ではない。","ボルテージフォロアはR1・R2を使わず出力を反転入力に直結した回路で、R2＝0とした特別な場合にあたる。","名称は正しいが式が誤り。非反転増幅の増幅度は1＋R2/R1で、R2/R1だけでは1未満にもなりうる。"],"https://www.youtube.com/watch?v=DoK0zXKgHU0","反転増幅回路を解説【オペアンプ】","",["x:elec2_29","非反転増幅回路の構成と入出力の式"]],["2つの入力の差を増幅するオペアンプ回路を何というか？","差動増幅回路","加算回路","積分回路","微分回路","差動増幅回路は、2つの入力電圧の差を増幅する回路。センサのブリッジ出力のように、2本の線の電位差として得られる信号の増幅に使われる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/linear_opamp/what-is-the-purpose-of-using-a-differential-amplifier.html","差動アンプを使う理由と同相信号除去比（東芝デバイス＆ストレージ）",["加算回路は複数の入力電圧を抵抗の比に応じて足し合わせる回路で、2入力の差を増幅するものではない。","積分回路は入力の時間積分に比例した出力を出す回路で、帰還路にコンデンサを使い、2入力の差を増幅するものではない。","微分回路は入力の時間変化率に比例した出力を出す回路で、入力コンデンサと帰還抵抗で構成する。"],"https://www.youtube.com/watch?v=jn3YltbXk1M","トランジスタ回路［差動増幅回路／電圧増幅度の設定］","",["x:elec2_30","オペアンプを用いた差動増幅回路"]],["差動増幅回路の役割は何か？","2つの入力信号に含まれる共通成分（同相電圧）を除去すること","入力信号を整流すること","一定周期のパルスを発生すること","入力インピーダンスを下げること","差動増幅回路は、2つの入力に共通に乗っている成分（同相電圧、同相ノイズ）を打ち消し、差の信号だけを増幅する。同相ノイズをどれだけ除去できるかはCMRR（同相信号除去比）で表す。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/linear_opamp/what-is-the-purpose-of-using-a-differential-amplifier.html","差動アンプを使う理由と同相信号除去比（東芝デバイス＆ストレージ）",["整流は交流を直流に変える働きで、ダイオードやブリッジ回路が担う。差動増幅回路の役割ではない。","一定周期のパルスの発生は、非安定マルチバイブレータなどの発振回路の役割である。","入力インピーダンスを下げることは差動増幅の目的ではなく、むしろ測定回路では高い入力インピーダンスが望ましい。"],"https://www.youtube.com/watch?v=jn3YltbXk1M","トランジスタ回路［差動増幅回路／電圧増幅度の設定］","",["w:174_1","オペアンプによる差動増幅回路",{"a":"Inductiveload","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Op-Amp_Differential_Amplifier.svg"}]],["トランジスタやオペアンプを用いて、正弦波や三角波などを出力する回路を何というか？","発振回路","整流回路","平滑回路","検波回路","発振回路は、外部から信号を入力しなくても、正弦波・方形波・三角波などの周期的な信号を自ら作り出す回路。マイコンのクロックや、ファンクションジェネレータの信号源などに使われる。","https://www.jeea.or.jp/course/contents/12124/","オペアンプ（３）発振回路・微積分回路（日本電気技術者協会）",["整流回路は交流を直流に変える回路で、周期的な波形を自ら作り出すものではない。","平滑回路は、整流後の脈流をコンデンサなどで平らな直流に近づける回路で、波形を発生させるものではない。","検波回路は変調された信号から元の信号を取り出す回路で、AMラジオなどで使われ、自ら波形を発生しない。"],"https://www.youtube.com/watch?v=jUrhAq8ErZc","シュミットトリガNOT素子を使用した発振回路の実験",""],["発振回路を構成する2つの回路は？","帰還回路、増幅回路","整流回路、平滑回路","微分回路、積分回路","比較回路、分圧回路","発振回路は、信号を大きくする増幅回路と、出力の一部を入力に戻す帰還回路からなる。帰還が正帰還で、ループを一周したときの利得が1以上、位相が一致する（バルクハウゼンの発振条件）と発振が持続する。","https://www.jeea.or.jp/course/contents/12124/","オペアンプ（３）発振回路・微積分回路（日本電気技術者協会）",["整流回路と平滑回路は交流から直流を作る電源回路の構成要素で、発振回路の基本構成ではない。","微分回路と積分回路は波形の変換に使う演算回路で、それだけでは発振に必要な正帰還ループを構成しない。","比較回路と分圧回路は電圧の大小判定や基準電圧づくりに使う回路で、発振回路の基本構成ではない。"],"https://www.youtube.com/watch?v=jUrhAq8ErZc","シュミットトリガNOT素子を使用した発振回路の実験","",["x:elec2_33","発振回路のしくみ（増幅回路と帰還回路）"]],["RとCで構成したブリッジを正帰還に使う発振回路の名称と発振周波数は？","ウィーンブリッジ発振回路、f ＝ 1/(2π√(C1C2R1R2))","コルピッツ発振回路、f ＝ 1/(2π√(LC))","水晶発振回路、f ＝ 1/(2πRC)","ハートレー発振回路、f ＝ 2π√(LC)","ウィーンブリッジ発振回路は、抵抗とコンデンサで作ったウィーンブリッジを正帰還回路に使う発振回路で、低周波の正弦波を作るのに向く。発振周波数は f＝1/(2π√(C1C2R1R2))で、R1＝R2＝R、C1＝C2＝Cなら f＝1/(2πRC)。","https://www.jeea.or.jp/course/contents/12124/","オペアンプ（３）発振回路・微積分回路（日本電気技術者協会）",["コルピッツ発振回路はコイル1個とコンデンサ2個で帰還するLC発振回路で、RCのブリッジは使わない。","水晶発振回路は水晶振動子の固有振動で周波数が決まり、f＝1/(2πRC)という式で決まるものではない。","ハートレー発振回路はコイル2個とコンデンサ1個のLC発振回路で、しかも式の分子と分母が逆で正しくは1/(2π√(LC))である。"],"https://www.youtube.com/watch?v=jUrhAq8ErZc","シュミットトリガNOT素子を使用した発振回路の実験","",["x:elec2_34","ウィーンブリッジ発振回路（R・C等しいとき）"]],["ファンクションジェネレータに使われるシュミット回路は、別名で何と呼ばれるか？","ヒステリシス回路","ボルテージフォロア","ピークホールド回路","サンプルホールド回路","シュミット回路（シュミットトリガ）は、入力が上がるときと下がるときで切り替わる電圧（しきい値）に差（ヒステリシス）をもたせた比較回路。ノイズで出力がばたつくのを防げる。ファンクションジェネレータでは、積分回路と組み合わせて三角波・方形波を作る。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-2-3.html","シュミットトリガーの基礎（東芝デバイス＆ストレージ）",["ボルテージフォロアは増幅度1でインピーダンス変換を行うバッファ回路で、しきい値にヒステリシスをもつ比較回路ではない。","ピークホールド回路は入力信号の最大値を検出して保持する回路で、しきい値に差をもつ比較回路ではない。","サンプルホールド回路はある瞬間の入力電圧を取り込んで保持する回路で、A/D変換の前段に使い、ヒステリシス特性とは無関係。"],"https://www.youtube.com/watch?v=nf-oduopA4A","シュミットトリガ回路の動作原理","",["x:elec2_35","シュミット回路と積分回路による方形波・三角波"]],["発振回路の周波数を決める素子として主に用いられるものは？","水晶振動子、セラミック発振子","ツェナーダイオード、バリスタ","フォトダイオード、LED","サーミスタ、ヒューズ","発振周波数を正確に決める素子には、水晶振動子やセラミック発振子（セラロック）が使われる。どちらも圧電効果で固有の振動数で振動する。水晶は非常に高精度、セラミックは安価だが精度はやや劣る。","https://www.ndk.com/jp/products/column/crystal-unit-basics.html","水晶振動子とは？仕組みと圧電効果の原理（日本電波工業）",["ツェナーダイオードは定電圧用、バリスタはサージ吸収用の素子で、発振周波数を決める働きはない。","フォトダイオードは受光素子、LEDは発光素子で、光の検出や表示に使い、発振周波数は決めない。","サーミスタは温度で抵抗が変わる温度センサ、ヒューズは過電流保護部品で、発振とは無関係。"],"https://www.youtube.com/watch?v=kWwtkCCUuIc","水晶の圧電性と水晶振動子",""],["トランジスタの2種類は？","バイポーラトランジスタ、電界効果トランジスタ","NPN形、MOS形","接合形、点接触形","パワートランジスタ、小信号トランジスタ","トランジスタは、ベース電流でコレクタ電流を制御するバイポーラトランジスタ（電流制御）と、ゲート電圧でドレイン電流を制御する電界効果トランジスタ（FET、電圧制御）に大別される。FETは入力インピーダンスが高く、消費電力が小さい。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/mosfet/how-do-n-channel-mosfets-work.html","MOSFETの動作原理と仕組み（東芝デバイス＆ストレージ）",["NPN形はバイポーラトランジスタの極性の一種、MOS形はFETの構造の一種で、分類の階層がそろわない組合せである。","接合形と点接触形は初期のトランジスタの構造による区分で、点接触形は現在ほぼ使われず、大別の2種類ではない。","パワーと小信号は扱う電力の大小による用途上の区分で、動作原理による2種類の分類ではない。"],"https://www.youtube.com/watch?v=tICUiAYg-ik","【電気回路53】FETの構造と動作（JFETとMOS-FET）","",["x:elec2_37","トランジスタの分類（バイポーラとFET）"]],["FETの2種類は？","接合型FET、MOSFET","バイポーラ、IGBT","NPN形、PNP形","エンハンスメント、ダーリントン","FETは、PN接合でチャネルを制御する接合型FET（JFET）と、絶縁膜（酸化膜）を介してゲート電圧でチャネルを制御するMOSFETに分けられる。現在のデジタルICやパワー素子の主流はMOSFET。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/mosfet/how-do-n-channel-mosfets-work.html","MOSFETの動作原理と仕組み（東芝デバイス＆ストレージ）",["バイポーラはFETとは別のトランジスタ、IGBTはMOSFETとバイポーラを複合した素子で、FETの分類ではない。","NPN形とPNP形はバイポーラトランジスタの極性による分類で、FETではNチャネル・Pチャネルと呼ぶ。","エンハンスメントはMOSFETの動作形式の一つ、ダーリントンはトランジスタ2個の接続方式で、FETの2種類ではない。"],"https://www.youtube.com/watch?v=tICUiAYg-ik","【電気回路53】FETの構造と動作（JFETとMOS-FET）",""],["トランジスタの3つの接地方式の組合せは？","エミッタ接地、コレクタ接地、ベース接地","ソース接地、ドレイン接地、ゲート接地","アノード接地、カソード接地、ゲート接地","一点接地、多点接地、フレーム接地","トランジスタ増幅回路は、入出力の共通端子によって、エミッタ接地（電圧・電流とも増幅、最もよく使う）、コレクタ接地（エミッタフォロア、電圧増幅度は約1でバッファ用）、ベース接地（電流増幅度は約1で高周波に強い）の3つに分けられる。","https://detail-infomation.com/difference-of-amplifier-circuit/","エミッタ接地・コレクタ接地・ベース接地回路の違い（Electrical Information）",["ソース接地・ドレイン接地・ゲート接地はFET増幅回路の3つの接地方式で、バイポーラトランジスタの場合の名称ではない。","アノード・カソード・ゲートはサイリスタなどの端子名で、トランジスタの接地方式にこの呼び方はない。","一点接地・多点接地・フレーム接地は機器や回路のアースの取り方（ノイズ対策・安全）で、増幅回路の接地方式ではない。"],"https://www.youtube.com/watch?v=LayILnWec4U","『エミッタ接地回路』【3分くらい無線講座15】","",["x:elec2_39","エミッタ・コレクタ・ベース接地の3方式"]],["コレクタ電流Icは、ベース電流Ibと直流電流増幅率hFEを使ってどう表されるか？","Ic ＝ hFE × Ib","Ic ＝ Ib ÷ hFE","Ic ＝ hFE + Ib","Ic ＝ Ib − hFE","コレクタ電流Ic＝hFE×Ib。hFE（直流電流増幅率）は一般に数十〜数百で、小さなベース電流で大きなコレクタ電流を制御できる。これがトランジスタの増幅・スイッチング作用の基本。","https://detail-infomation.com/bipolar-transistor/","トランジスタの特徴と動作原理（Electrical Information）",["hFEで割るとIcがIbより小さくなり、小さなベース電流で大きなコレクタ電流を制御する増幅作用と矛盾する。Ib＝Ic÷hFEなら正しい。","hFEは無次元の比なので電流と足し算できず、単位も合わない。","電流から無次元の比を引いており単位が合わず、物理的な意味をもたない。"],"https://www.youtube.com/watch?v=dOs88Fgrb8c","トランジスタ徹底解説－トランジスタの仕組み","",["x:elec2_40","トランジスタの各電流とIC＝hFE・IBの関係"]],["2つのトランジスタを組み合わせて、非常に大きな電流増幅率を得るものは？","ダーリントントランジスタ","パワートランジスタ","フォトトランジスタ","サイリスタ","ダーリントントランジスタは、2つのトランジスタを、1段目のエミッタ電流が2段目のベース電流になるように接続したもの。全体の電流増幅率は2つのhFEの積になるので、非常に大きな増幅率が得られる。モータやリレーの駆動に使われる。","https://detail-infomation.com/bipolar-transistor/","トランジスタの特徴と動作原理（Electrical Information）",["パワートランジスタはコレクタ損失1W以上の大電力用トランジスタで、2個の組合せで増幅率を高めるものではない。","フォトトランジスタは光をベース電流の代わりに使い、光量に応じてコレクタ電流が流れる受光素子である。","サイリスタはPNPN4層構造のスイッチ素子で、ゲート電流で導通し自己保持するが、電流増幅を目的とした素子ではない。"],"https://www.youtube.com/watch?v=dOs88Fgrb8c","トランジスタ徹底解説－トランジスタの仕組み","",["w:031_1","ダーリントントランジスタの回路記号",{"a":"KoenB","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Darlington.svg"}]],["コレクタ損失が1W以上のトランジスタを何というか？","パワートランジスタ","小信号トランジスタ","ダーリントントランジスタ","フォトトランジスタ","パワートランジスタは、コレクタ損失（トランジスタ自身で消費する電力）が1W以上の大電力用トランジスタ。モータ駆動や電源回路などで使われ、発熱が大きいので放熱器（ヒートシンク）を取り付けて使う。","https://detail-infomation.com/bipolar-transistor/","トランジスタの特徴と動作原理（Electrical Information）",["小信号トランジスタはコレクタ損失が1W未満程度の小電力用で、微小信号の増幅や小電流のスイッチングに使う。","ダーリントントランジスタは2つのトランジスタを接続して電流増幅率を高めたもので、コレクタ損失の大きさによる呼び名ではない。","フォトトランジスタは光でコレクタ電流を制御する受光素子で、電力の大きさによる分類ではない。"],"https://www.youtube.com/watch?v=dOs88Fgrb8c","トランジスタ徹底解説－トランジスタの仕組み","",["w:181_0","ヒートシンクに取り付けたパワートランジスタ",{"a":"Daniel Christensen (talk)","l":"CC BY 3.0","u":"https://commons.wikimedia.org/wiki/File:Power_transistor_on_Nikko_TRM-800_audio_amp.jpg"}]],["トランジスタの直流的な電気的特性（入出力特性曲線など）を何というか？","静特性","動特性","周波数特性","温度特性","静特性は、トランジスタに直流の電圧・電流を加えたときの関係（入力特性、出力特性、電流伝達特性など）を表したもの。信号を加えたときの動的なふるまい（動特性）と区別する。データシートの特性曲線がこれ。","https://detail-infomation.com/bipolar-transistor/","トランジスタの特徴と動作原理（Electrical Information）",["動特性は負荷をつなぎ信号（交流）を加えたときの動作を表す特性で、直流的な関係を示す静特性とは区別される。","周波数特性は入力信号の周波数に対する増幅度や位相の変化を表す特性で、直流での入出力曲線ではない。","温度特性は周囲温度に対してhFEや電流などがどう変わるかを表す特性で、直流的な入出力関係そのものではない。"],"https://www.youtube.com/watch?v=dOs88Fgrb8c","トランジスタ徹底解説－トランジスタの仕組み","",["x:elec2_43","トランジスタ2SC1815の静特性曲線"]],["トランジスタ回路に直流の動作点を与えるための回路を何というか？","バイアス回路","結合回路","帰還回路","平滑回路","バイアス回路は、トランジスタが信号をひずみなく増幅できるよう、あらかじめ適切な直流の電圧・電流（動作点）を与える回路。動作点がずれると、信号の一部が切れたりひずんだりする。","https://www.marutsu.co.jp/select/list/detail.php?id=127","トランジスタ増幅回路 固定バイアス回路の特徴（マルツ）",["結合回路は段間で交流信号だけを伝え直流を遮断する回路（結合コンデンサなど）で、動作点を与えるものではない。","帰還回路は出力の一部を入力に戻す回路で、増幅度の安定化や発振に使い、動作点を与えることが本来の目的ではない。","平滑回路は整流した脈流を平らな直流にする電源側の回路で、トランジスタの動作点を決めるものではない。"],"https://www.youtube.com/watch?v=mlWhhyg9ik4","【電子工学#03-01】トランジスタのバイアス回路その１",""],["ベースに抵抗1本で電源からバイアス電流を流す、最も簡単なバイアス回路は？","固定バイアス回路","電圧分割バイアス回路","自己バイアス回路","電流帰還バイアス回路","固定バイアス回路は、電源とベースの間に抵抗を1本入れ、一定のベース電流を流す最も簡単なバイアス回路。部品は少ないが、hFEのばらつきや温度変化で動作点が大きくずれやすい欠点がある。","https://www.marutsu.co.jp/select/list/detail.php?id=127","トランジスタ増幅回路 固定バイアス回路の特徴（マルツ）",["電圧分割バイアス回路は2本の抵抗でベース電圧を分圧しエミッタ抵抗で安定化する回路で、抵抗1本の最も簡単な構成ではない。","自己バイアス回路はベース抵抗をコレクタ側から取り、出力から負帰還をかける方式で、電源から直接ベース電流を流す回路ではない。","電流帰還バイアス回路はエミッタ抵抗による負帰還で安定化する方式で、電圧分割バイアスと同じ構成を指し、最も簡単な回路ではない。"],"https://www.youtube.com/watch?v=mlWhhyg9ik4","【電子工学#03-01】トランジスタのバイアス回路その１","",["x:elec2_45","固定バイアス回路（ベース抵抗1本でバイアス）"]],["抵抗2本でベース電圧を分圧し、エミッタ抵抗で安定化するバイアス回路を何というか？","電圧分割バイアス回路（電流帰還バイアス）","固定バイアス回路","自己バイアス回路","ブリーダ回路のみの回路","電圧分割バイアス回路（電流帰還バイアス回路）は、2本の抵抗（ブリーダ抵抗）でベース電圧を一定に決め、エミッタ抵抗で電流の変化を打ち消す回路。hFEのばらつきや温度変化に強く、最も広く使われている。","https://www.marutsu.co.jp/select/list/detail.php?id=127","トランジスタ増幅回路 固定バイアス回路の特徴（マルツ）",["固定バイアス回路はベースに抵抗1本で電流を流す最も簡単な回路で、分圧やエミッタ抵抗による安定化はない。","自己バイアス回路はコレクタ-ベース間に抵抗を入れて出力側から負帰還をかける方式で、抵抗2本による分圧は使わない。","ブリーダ抵抗で分圧するだけではエミッタ抵抗による安定化がなく、問いの回路の一部にすぎない。"],"https://www.youtube.com/watch?v=mlWhhyg9ik4","【電子工学#03-01】トランジスタのバイアス回路その１","",["x:elec2_46","R1・R2で分圧する電圧分割バイアス回路"]],["エミッタ抵抗に並列に入れて交流的に接地し、増幅度の低下を防ぐコンデンサを何と呼ぶか？","バイパスコンデンサ","結合コンデンサ","平滑コンデンサ","スピードアップコンデンサ","バイパスコンデンサは、エミッタ抵抗に並列に入れるコンデンサ。直流ではエミッタ抵抗が働いて動作点を安定させ、交流（信号）ではコンデンサがエミッタを接地して増幅度の低下を防ぐ。電源ラインのノイズを逃がすコンデンサも同じ名前で呼ぶ。","https://www.marutsu.co.jp/select/list/detail.php?id=127","トランジスタ増幅回路 固定バイアス回路の特徴（マルツ）",["結合コンデンサは段間に直列に入れて交流信号を通し直流を遮断するコンデンサで、エミッタ抵抗に並列に入れるものではない。","平滑コンデンサは整流後の脈流をならして直流にする電源回路のコンデンサで、増幅度の低下防止用ではない。","スピードアップコンデンサはスイッチング回路でベース抵抗に並列に入れ、トランジスタのオン・オフを速くするコンデンサである。"],"https://www.youtube.com/watch?v=mlWhhyg9ik4","【電子工学#03-01】トランジスタのバイアス回路その１",""],["交流成分は通し直流成分は遮断する、段間や入出力をつなぐコンデンサを何と呼ぶか？","結合コンデンサ（カップリングコンデンサ）","バイパスコンデンサ","平滑コンデンサ","デカップリングコンデンサ","結合コンデンサ（カップリングコンデンサ）は、増幅回路の入力・出力や段と段の間に直列に入れるコンデンサ。交流の信号は通し、直流は通さないので、各段のバイアス（直流の動作点）を干渉させずに信号だけを伝えられる。","https://www.marutsu.co.jp/select/list/detail.php?id=127","トランジスタ増幅回路 固定バイアス回路の特徴（マルツ）",["バイパスコンデンサはエミッタ抵抗や電源ラインに並列に入れて交流成分をGNDに逃がすコンデンサで、段間をつなぐものではない。","平滑コンデンサは整流した脈流を平らな直流にする電源用のコンデンサで、信号を通すために直列に入れるものではない。","デカップリングコンデンサはICの電源端子付近に入れて電源ノイズを除き回路間の干渉を防ぐもので、信号の段間結合用ではない。"],"https://www.youtube.com/watch?v=mlWhhyg9ik4","【電子工学#03-01】トランジスタのバイアス回路その１","",["x:elec2_45","入出力の結合コンデンサの位置（固定バイアス）"]],["増幅回路を2段接続し、出力を入力に正帰還させた回路構成を何というか？","マルチバイブレータ","差動増幅回路","ダーリントン接続","ボルテージフォロア","マルチバイブレータは、2つのトランジスタ増幅回路を互いに正帰還でつなぎ、オンとオフを切り替える回路。安定状態の数によって、非安定（0個）、単安定（1個）、双安定（2個）の3種類がある。","https://edn.itmedia.co.jp/edn/articles/2601/26/news054_2.html","マルチバイブレーター回路の基本と誤った応用回路（EDN Japan）",["差動増幅回路は2つの入力電圧の差を増幅する回路で、2段の増幅回路を正帰還でつなぐ構成ではない。","ダーリントン接続は1段目のエミッタ電流を2段目のベースに入れて増幅率を高める接続で、正帰還はかけない。","ボルテージフォロアは出力を反転入力に戻す負帰還で増幅度1を得る回路で、正帰還ではない。"],"https://www.youtube.com/watch?v=wI7Gtw10BBU","非安定マルチバイブレータの動作を解説","",["x:elec2_49","マルチバイブレータの基本構成（2段・正帰還）"]],["単安定マルチバイブレータは何と呼ばれるか？","ワンショットマルチバイブレータ","フリップフロップ回路","シュミット回路","非安定マルチバイブレータ","単安定マルチバイブレータ（ワンショットマルチバイブレータ）は、安定状態が1つで、トリガが入ると一定時間だけもう一方の状態になり、また元に戻る。一定幅のパルスを1発出すので、タイマや遅延回路に使われる。","https://edn.itmedia.co.jp/edn/articles/2601/26/news054_2.html","マルチバイブレーター回路の基本と誤った応用回路（EDN Japan）",["フリップフロップ回路は双安定マルチバイブレータの別名で、2つの安定状態を保持する回路である。","シュミット回路はしきい値にヒステリシスをもたせた比較回路で、トリガで一定幅のパルスを1発出すものではない。","非安定マルチバイブレータは安定状態をもたず方形波を連続して発振する回路で、単安定とは別の種類である。"],"https://www.youtube.com/watch?v=wI7Gtw10BBU","非安定マルチバイブレータの動作を解説","",["x:elec2_50","単安定マルチバイブレータの回路と各部波形"]],["パルス波形を連続して発振する回路を何というか？","非安定マルチバイブレータ","単安定マルチバイブレータ","双安定マルチバイブレータ","ラッチ回路","非安定マルチバイブレータは、安定状態がなく、2つの状態の間を自動的に行き来し続けて、方形波（パルス）を連続して発振する。LEDの点滅回路やクロック信号源などに使われる。","https://edn.itmedia.co.jp/edn/articles/2601/26/news054_2.html","マルチバイブレーター回路の基本と誤った応用回路（EDN Japan）",["単安定マルチバイブレータはトリガが入ったときだけ一定幅のパルスを1発出す回路で、連続して発振はしない。","双安定マルチバイブレータは2つの安定状態をもち、入力があるまで状態を保持する回路（フリップフロップ）で、自ら発振しない。","ラッチ回路は入力の状態を保持する記憶回路で、パルスを連続して発生する機能はない。"],"https://www.youtube.com/watch?v=wI7Gtw10BBU","非安定マルチバイブレータの動作を解説","",["x:elec2_51","たすき掛け構成の非安定マルチバイブレータ"]],["双安定マルチバイブレータは何と呼ばれるか？","フリップフロップ回路","ワンショット回路","発振回路","カウンタ回路","双安定マルチバイブレータは、2つの安定状態をもち、入力があるまでその状態を保ち続ける。1ビットの情報を記憶できるので、フリップフロップ回路と呼ばれ、レジスタやカウンタの基本素子になる。","https://edn.itmedia.co.jp/edn/articles/2601/26/news054_2.html","マルチバイブレーター回路の基本と誤った応用回路（EDN Japan）",["ワンショット回路は単安定マルチバイブレータの別名で、トリガで一定幅のパルスを1発出す回路である。","発振回路は周期的な信号を連続して作る回路で、非安定マルチバイブレータがこれにあたり、双安定とは別物。","カウンタ回路はフリップフロップを複数組み合わせてパルス数を数える回路で、双安定マルチバイブレータそのものの名称ではない。"],"https://www.youtube.com/watch?v=wI7Gtw10BBU","非安定マルチバイブレータの動作を解説","",["x:elec2_52","双安定マルチバイブレータ（フリップフロップ）"]],["シリコン（Ⅳ族）より最外殻電子が1つ少ないⅢ族元素は、P形の不純物として何と呼ばれるか？","アクセプタ","ドナー","キャリア","ホール","アクセプタは、シリコン（Ⅳ族）に加えると電子を受け取る（正孔を作る）不純物。最外殻電子が3個のⅢ族元素（ホウ素B、ガリウムGa、インジウムInなど）が使われ、P形半導体になる。","https://semi-journal.jp/basics/beginner/band-structure.html","半導体のバンド構造：p型とn型（Semi Journal）",["ドナーは電子を与えるⅤ族の不純物（リンなど）で、N形半導体を作る。P形とは逆である。","キャリアは電流を運ぶ電子や正孔の総称で、不純物元素そのものの呼び名ではない。","ホール（正孔）は電子が抜けた孔で正の電荷をもつキャリア。アクセプタによって生じるもので、不純物自体の名称ではない。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6281270098001/第1章-半導体の基礎","e-ラーニング ディスクリート半導体の基礎 第1章 半導体の基礎（東芝デバイス＆ストレージ 動画ギャラリー）","",["x:elec2_53","Ⅲ族のB（アクセプタ）が正孔をつくるP形"]],["シリコン（Ⅳ族）より最外殻電子が1つ多いⅤ族元素は、N形の不純物として何と呼ばれるか？","ドナー","アクセプタ","ドーパント","空乏層","ドナーは、シリコン（Ⅳ族）に加えると余った電子を与える不純物。最外殻電子が5個のⅤ族元素（リンP、ヒ素As、アンチモンSbなど）が使われ、N形半導体になる。","https://semi-journal.jp/basics/beginner/band-structure.html","半導体のバンド構造：p型とn型（Semi Journal）",["アクセプタは電子を受け取り正孔を作るⅢ族の不純物（ホウ素など）で、P形半導体を作る。","ドーパントは半導体に添加する不純物の総称でアクセプタもドナーも含むため、N形用の不純物を特定する名称ではない。","空乏層はPN接合部でキャリアがほとんど存在しなくなった領域で、不純物の名称ではない。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6281270098001/第1章-半導体の基礎","e-ラーニング ディスクリート半導体の基礎 第1章 半導体の基礎（東芝デバイス＆ストレージ 動画ギャラリー）","",["x:elec2_54","Ⅴ族のP（ドナー）が自由電子をつくるN形"]],["2種類以上の元素が結合した半導体を何というか？","化合物半導体","真性半導体","元素半導体","有機半導体","化合物半導体は、2種類以上の元素が結合した半導体。ガリウムヒ素（GaAs）、窒化ガリウム（GaN）、炭化ケイ素（SiC）などがある。高速通信、LED、パワー半導体など、シリコンでは難しい用途に使われる。","https://semi-journal.jp/basics/beginner/band-structure.html","半導体のバンド構造：p型とn型（Semi Journal）",["真性半導体は不純物を含まない高純度の半導体で、電子と正孔の数が等しいもの。元素の組合せによる分類ではない。","元素半導体はシリコンやゲルマニウムのように1種類の元素からなる半導体で、化合物半導体と対になる用語である。","有機半導体は炭素を主体とする有機分子・高分子からなる半導体で、有機ELなどに使われ、GaAsのような無機化合物とは区別される。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6281270098001/第1章-半導体の基礎","e-ラーニング ディスクリート半導体の基礎 第1章 半導体の基礎（東芝デバイス＆ストレージ 動画ギャラリー）",""],["半導体で、電界によってキャリアが移動して生じる電流を何というか？","ドリフト電流","拡散電流","漏れ電流","暗電流","半導体を流れる電流には、電界によってキャリア（電子・正孔）が引っ張られて移動するドリフト電流と、キャリアの濃度差によって濃い方から薄い方へ広がる拡散電流がある。","https://semi-journal.jp/basics/beginner/band-structure.html","半導体のバンド構造：p型とn型（Semi Journal）",["拡散電流はキャリアの濃度差により濃い方から薄い方へ広がって流れる電流で、電界によるものではない。","漏れ電流は絶縁部や逆バイアスの接合などをわずかに流れてしまう電流で、キャリアが動く原因による分類ではない。","暗電流は光センサに光が当たっていないときにも流れるわずかな電流で、ノイズの原因になる。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6281270098001/第1章-半導体の基礎","e-ラーニング ディスクリート半導体の基礎 第1章 半導体の基礎（東芝デバイス＆ストレージ 動画ギャラリー）",""],["半導体に光を当てることで電圧が発生する現象を何というか？","光起電力効果","光導電効果","ホール効果","ペルチェ効果","光起電力効果は、半導体のPN接合に光が当たると、光のエネルギーで電子と正孔の対ができ、接合部の電界で分離されて電圧が生じる現象。太陽電池やフォトダイオードの原理。","https://detail-infomation.com/hall-effect/","ホール効果の原理をわかりやすく説明（Electrical Information）",["光導電効果は光を当てると抵抗率が下がる現象で、電圧そのものは発生しない。CdSセルの原理である。","ホール効果は電流と磁界に直交する方向に電圧が生じる現象で、光とは関係ない。","ペルチェ効果は異種導体の接合部に電流を流すと吸熱・発熱が起きる現象で、光による起電力ではない。"],"https://www.youtube.com/watch?v=q5M8B_Oyj9Y","ゼーベック効果とペルチェ効果の違い","",["w:198_0","太陽電池のPN接合と光起電力の発生原理",{"a":"No machine-readable author provided. S-kei assumed (based on","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:PnJunction-PV-J.PNG"}]],["半導体に光を当てると抵抗率が減少する性質を何というか？","光導電効果","光起電力効果","磁気抵抗効果","圧電効果","光導電効果は、半導体に光を当てると、生じたキャリアによって電気が流れやすくなり、抵抗率が下がる現象。CdS（硫化カドミウム）セルなどの光センサがこれを利用して、明るさを抵抗の変化として検出する。","https://detail-infomation.com/hall-effect/","ホール効果の原理をわかりやすく説明（Electrical Information）",["光起電力効果は光でPN接合に電圧が生じる現象で、太陽電池の原理。抵抗率の変化ではない。","磁気抵抗効果は磁界をかけると電気抵抗が変化する現象で、光ではなく磁界によるもの。","圧電効果は結晶に力を加えると電圧が生じる（逆に電圧で変形する）現象で、水晶振動子などに使われる。"],"https://www.youtube.com/watch?v=q5M8B_Oyj9Y","ゼーベック効果とペルチェ効果の違い",""],["電流が流れる物体を電流に垂直な磁界中に置くと、磁界と電流に直交する方向に起電力が生じる現象は？","ホール効果","磁気抵抗効果","ゼーベック効果","電磁誘導","ホール効果は、電流が流れる物体に垂直に磁界をかけると、ローレンツ力でキャリアが片側に寄り、電流と磁界の両方に直角な方向に電圧（ホール電圧）が生じる現象。ホール素子として、磁気センサやブラシレスモータの回転位置検出に使われる。","https://detail-infomation.com/hall-effect/","ホール効果の原理をわかりやすく説明（Electrical Information）",["磁気抵抗効果は磁界によって物質の抵抗が変化する現象で、電流と直交する方向に起電力が生じるものではない。","ゼーベック効果は異種導体の接点間の温度差で起電力が生じる現象で、磁界は関係しない。","電磁誘導はコイルを貫く磁束が変化すると起電力が生じる現象で、発電機や変圧器の原理。一定磁界中の電流によるものではない。"],"https://www.youtube.com/watch?v=q5M8B_Oyj9Y","ゼーベック効果とペルチェ効果の違い","",["x:elec2_59","ホール効果：電流と磁界に直交する向きに電圧"]],["薄い導体や半導体に磁界をかけると、その強さに応じて抵抗が増加する現象は？","磁気抵抗効果","ホール効果","ペルチェ効果","光導電効果","磁気抵抗効果は、磁界をかけると物質の電気抵抗が変化する（多くは増加する）現象。これを利用した磁気抵抗素子（MR素子）は、磁気センサやハードディスクの読み取りヘッドに使われる。","https://detail-infomation.com/hall-effect/","ホール効果の原理をわかりやすく説明（Electrical Information）",["ホール効果は磁界によって電流と直交する方向に電圧が生じる現象で、抵抗が増加する現象ではない。","ペルチェ効果は異種導体の接合部に電流を流すと吸熱・発熱する現象で、磁界とは関係ない。","光導電効果は光を当てると抵抗率が下がる現象で、磁界ではなく光によるもの。抵抗の変化の向きも逆である。"],"https://www.youtube.com/watch?v=q5M8B_Oyj9Y","ゼーベック効果とペルチェ効果の違い",""],["2種類の導体で閉回路を作り、2つの接点に温度差があると電圧が発生する現象は？","ゼーベック効果","ペルチェ効果","トムソン効果","ホール効果","ゼーベック効果は、2種類の金属（導体）をつないで閉回路を作り、2つの接点に温度差を与えると起電力が生じる現象。熱電対はこの原理で、生じた電圧から温度を測る。","https://detail-infomation.com/hall-effect/","ホール効果の原理をわかりやすく説明（Electrical Information）",["ペルチェ効果はゼーベック効果の逆で、電流を流すと接点で吸熱・発熱する現象。温度差で電圧が生じるものではない。","トムソン効果は1種類の導体内に温度勾配があるとき、電流を流すと導体内で吸熱・発熱が起きる現象である。","ホール効果は磁界中の電流に直交する方向に電圧が生じる現象で、温度差とは関係ない。"],"https://www.youtube.com/watch?v=q5M8B_Oyj9Y","ゼーベック効果とペルチェ効果の違い","",["x:elec2_61","2種類の金属による熱電対（ゼーベック効果）"]],["2種類の導体の閉回路に電流を流すと、一方の接点で吸熱、他方で発熱する現象は？","ペルチェ効果","ゼーベック効果","ジュール効果","光起電力効果","ペルチェ効果は、2種類の導体（半導体）の接合部に電流を流すと、一方の接合部で熱を吸収し、もう一方で熱を放出する現象。ゼーベック効果の逆で、電子冷却素子（ペルチェ素子）として小型冷蔵庫やCPUの冷却に使われる。","https://detail-infomation.com/hall-effect/","ホール効果の原理をわかりやすく説明（Electrical Information）",["ゼーベック効果は接点間の温度差で起電力が生じる現象で、ペルチェ効果とは逆の関係にある。","ジュール熱は抵抗に電流を流すと電流の2乗に比例した熱が発生する現象で、接点での吸熱は起こらない。","光起電力効果は光で半導体のPN接合に電圧が生じる現象で、電流による吸熱・発熱ではない。"],"https://www.youtube.com/watch?v=q5M8B_Oyj9Y","ゼーベック効果とペルチェ効果の違い","",["w:091_3","ペルチェ素子の原理：電流で一方が吸熱、他方が放熱",{"a":"Ken Brazier","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Thermoelectric_Cooler_Diagram.svg"}]],["多数の原子が集まったときの電子のエネルギー準位は、帯状の束になることから何と呼ばれるか？","エネルギーバンド","フェルミ準位","禁制帯","空乏層","エネルギーバンドは、多数の原子が集まって結晶になったとき、各原子の電子のエネルギー準位が少しずつずれて、幅をもった帯（バンド）状になったもの。電子が詰まった価電子帯、電子が動ける伝導帯、その間の禁制帯（バンドギャップ）がある。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/basics-of-schottky-barrier-diodes/chap1/chap1-2.html","エネルギーバンド図（東芝デバイス＆ストレージ）",["フェルミ準位は電子の占有確率が1/2となるエネルギーで、帯状になった準位の束そのものではない。","禁制帯は価電子帯と伝導帯の間で電子が存在できないエネルギー範囲（バンドギャップ）で、バンド構造の一部の名称である。","空乏層はPN接合部でキャリアがほとんどない空間的な領域で、エネルギー準位の帯ではない。"],"https://www.youtube.com/watch?v=AuQT5atSLIo","【半導体教育02】バンド理論とは？","",["x:elec2_63","絶縁体・半導体・導体のエネルギーバンド構造"]],["電子がエネルギー準位を占める確率が1/2となる（絶対零度で占有される最大の）エネルギーを何というか？","フェルミ準位","バンドギャップ","仕事関数","イオン化エネルギー","フェルミ準位は、電子がそのエネルギーの準位を占める確率がちょうど1/2になるエネルギー。絶対零度では、フェルミ準位以下はすべて電子で満たされ、それより上は空になる。N形ではフェルミ準位が伝導帯側に、P形では価電子帯側に寄る。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/basics-of-schottky-barrier-diodes/chap1/chap1-2.html","エネルギーバンド図（東芝デバイス＆ストレージ）",["バンドギャップは価電子帯の上端と伝導帯の下端の間のエネルギー幅で、占有確率が1/2となる準位ではない。","仕事関数は固体中の電子を真空中に取り出すのに必要な最小エネルギーで、フェルミ準位から真空準位までの差にあたる。","イオン化エネルギーは原子から電子1個を取り去るのに必要なエネルギーで、結晶中の電子の占有確率とは関係ない。"],"https://www.youtube.com/watch?v=AuQT5atSLIo","【半導体教育02】バンド理論とは？","",["x:elec2_64","真性・N形・P形半導体のフェルミ準位の位置"]],["バイポーラトランジスタを主素子とし、動作速度が速いが消費電力が大きいロジックICは？","TTL","CMOS","NMOS","FPGA","TTL（Transistor-Transistor Logic）は、バイポーラトランジスタで構成した論理IC。動作は速いが消費電力が大きく、ファンアウトも10程度に限られる。7400シリーズが代表。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/logic_common/logic_common_16.html","汎用ロジックICのファンアウトとは（東芝デバイス＆ストレージ）",["CMOSはPとNのMOSFETを組み合わせた論理ICで、消費電力が小さいのが特徴。バイポーラ主体ではない。","NMOSはNチャネルMOSFETだけで構成した論理ICで、バイポーラトランジスタは使わない。","FPGAはユーザが回路を書き込める大規模なPLDで、主にCMOSで作られ、素子の種類による論理ICの分類ではない。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6311417240112/cmosロジック-基礎編-1章-cmosロジックicの概要","CMOSロジックIC基礎編 1章 CMOSロジックICの概要（東芝デバイス＆ストレージ 動画ギャラリー）",""],["MOSFETを主素子とし、消費電力が小さくファンアウトが大きいロジックICは？","CMOS","TTL","DTL","RTL","CMOS（Complementary MOS）は、PチャネルとNチャネルのMOSFETを組み合わせた論理IC。待機時にほとんど電流が流れないため消費電力が非常に小さく、入力インピーダンスが高いのでファンアウトも大きい。現在のデジタルICの主流。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/logic_common/logic_common_16.html","汎用ロジックICのファンアウトとは（東芝デバイス＆ストレージ）",["TTLはバイポーラトランジスタで構成した論理ICで、高速だが消費電力が大きく、ファンアウトも10程度と小さい。","DTLはダイオードとトランジスタで構成した初期の論理回路で、MOSFETは使わない。","RTLは抵抗とトランジスタで構成した初期の論理回路で、ファンアウトが小さくMOSFETは使わない。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6311417240112/cmosロジック-基礎編-1章-cmosロジックicの概要","CMOSロジックIC基礎編 1章 CMOSロジックICの概要（東芝デバイス＆ストレージ 動画ギャラリー）",""],["1つの出力端子に接続できるゲートの数を何というか？","ファンアウト","ファンイン","ノイズマージン","伝搬遅延","ファンアウトは、1つの論理ゲートの出力に、正常に動作するよう接続できる入力ゲートの最大数。出力の駆動能力を表す。逆に、1つのゲートに入る入力の数はファンインという。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/logic_common/logic_common_16.html","汎用ロジックICのファンアウトとは（東芝デバイス＆ストレージ）",["ファンインは1つのゲートに入る入力の数で、出力に接続できる数を表すファンアウトとは逆の概念。","ノイズマージンは論理レベルを誤判定せずに許容できるノイズ電圧の余裕で、接続できるゲート数ではない。","伝搬遅延は入力が変化してから出力が変化するまでの時間で、ゲートの動作速度を表す指標である。"],"https://videoclip.toshiba.semicon-storage.com/jp/detail/videos/ディスクリート半導体/video/6311417240112/cmosロジック-基礎編-1章-cmosロジックicの概要","CMOSロジックIC基礎編 1章 CMOSロジックICの概要（東芝デバイス＆ストレージ 動画ギャラリー）",""],["データの読み書きができ、電源が切れると記憶内容が失われる記憶装置は？","RAM","ROM","フラッシュメモリ","EEPROM","RAM（Random Access Memory）は、自由に読み書きできるが、電源を切ると内容が消える（揮発性の）メモリ。リフレッシュが必要で大容量のDRAMと、高速だが高価なSRAMがある。","https://wa3.i-3-i.info/diff334memory.html","「ROM」と「RAM」の違い（分かりそうで分からないIT用語辞典）",["ROMは読み出し専用で電源を切っても内容が消えない不揮発性メモリで、自由な読み書きはできない。","フラッシュメモリは電気的に書き換えができ、電源を切っても内容が残る不揮発性メモリで、USBメモリなどに使われる。","EEPROMは電気的にバイト単位で書き換えができ、電源を切っても内容が保持される不揮発性メモリである。"],"https://www.youtube.com/watch?v=1aRrWh6Mxog","RAM・DRAM・SRAM・ROMの違いとは？",""],["読み出し専用で、電源が切れても記憶内容が失われない記憶装置は？","ROM","RAM","DRAM","SRAM","ROM（Read Only Memory）は、基本的に読み出し専用で、電源を切っても内容が消えない（不揮発性の）メモリ。プログラムや固定データの保存に使う。書き換えできるEPROM、EEPROM、フラッシュメモリなどもROMの仲間。","https://wa3.i-3-i.info/diff334memory.html","「ROM」と「RAM」の違い（分かりそうで分からないIT用語辞典）",["RAMは読み書きできるが電源を切ると内容が消える揮発性メモリで、問いとは逆の性質である。","DRAMはコンデンサの電荷で記憶するRAMで、定期的なリフレッシュが必要であり、電源を切ると内容が消える。","SRAMはフリップフロップで記憶する高速なRAMで、リフレッシュは不要だが電源を切ると内容が消える。"],"https://www.youtube.com/watch?v=1aRrWh6Mxog","RAM・DRAM・SRAM・ROMの違いとは？",""],["光を検知する半導体センサ2種類の組合せは？","フォトダイオード、フォトトランジスタ","ホール素子、MR素子","サーミスタ、熱電対","ストレインゲージ、ロードセル","光を検知する半導体センサの代表は、フォトダイオード（光で電流が流れる、応答が速い）とフォトトランジスタ（光で生じた電流を内部で増幅する、感度が高いが応答は遅め）。光電スイッチや照度センサに使われる。","https://techweb.rohm.co.jp/product/sensor/sensor-device/5187/","光センサ：フォトダイオードとフォトトランジスタ（ROHM TechWeb）",["ホール素子とMR素子はどちらも磁界を検出する磁気センサで、光の検知には使わない。","サーミスタと熱電対は温度センサで、熱電対は半導体ではなく異種金属の組合せである。","ストレインゲージはひずみを抵抗変化で検出するセンサ、ロードセルはそれを使った荷重センサで、光の検知用ではない。"],"https://www.youtube.com/watch?v=oL3q1S0q0G0","フォトダイオードの仕組み",""],["シリコンウェーハ上にLSIを作り込む工程を何というか？","前工程","後工程","検査工程","組立工程","前工程は、シリコンウェーハの上に、成膜・露光（リソグラフィ）・エッチング・不純物の導入（イオン注入）などを繰り返して、トランジスタや配線を作り込む工程。クリーンルームの中で行う。","https://semi-journal.jp/basics/process/flow.html","【図解】半導体製造工程の流れ（Semi Journal）",["後工程はウェーハからチップを切り出し、組立・封止・検査する工程で、回路を作り込む工程ではない。","検査工程は完成したウェーハやチップの電気特性・外観を調べる工程で、LSIを作り込む工程そのものではない。","組立工程はチップをパッケージに実装して配線・封止する後工程の一部で、ウェーハ上に回路を形成する工程ではない。"],"https://www.youtube.com/watch?v=poKpjfO5m_8","【前工程編】半導体ができるまで（サンケン電気）","",["w:196_0","LSIを作り込んだシリコンウェーハ",{"a":"Steve Jurvetson","l":"CC BY 2.0","u":"https://commons.wikimedia.org/wiki/File:Hot_off_the_press_%E2%80%94_the_latest_D-Wave_wafer_of_quantum_processors_and_TIME_cover_story.jpg"}]],["ウェーハ上のLSIチップを切り出してパッケージ化し、検査する工程は？","後工程","前工程","拡散工程","洗浄工程","後工程は、前工程でできたウェーハを検査し、ダイシングでチップに切り分け、リードフレームなどに載せて（ダイボンディング）配線し（ワイヤボンディング）、樹脂で封止して最終検査する工程。","https://semi-journal.jp/basics/process/flow.html","【図解】半導体製造工程の流れ（Semi Journal）",["前工程はウェーハ上に成膜・露光・エッチングなどを繰り返して回路を作り込む工程で、切り出しやパッケージ化は含まない。","拡散工程は不純物をウェーハに拡散させてPN接合などを作る前工程の一部で、パッケージ化とは無関係。","洗浄工程はウェーハ表面のパーティクルや金属汚染を除去する前工程の一部で、チップの切り出しや検査ではない。"],"https://www.youtube.com/watch?v=poKpjfO5m_8","【前工程編】半導体ができるまで（サンケン電気）","",["w:218_2","パッケージ上のチップとボンディングワイヤ",{"a":"Mister rf","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:CRP_INDUSTRIES_2N2222.jpg"}]],["インテル社のゴードン・ムーアが唱えた、集積度が指数関数的に高まるという法則は？","ムーアの法則","メトカーフの法則","ベンフォードの法則","パーキンソンの法則","ムーアの法則は、インテル創業者の一人ゴードン・ムーアが唱えた、ICの集積度（トランジスタ数）が一定期間ごとに倍増するという経験則。「約2年で2倍」として知られ、3年で4倍という言い方もある。半導体の微細化の目安になってきた。","https://semi-journal.jp/basics/process/flow.html","【図解】半導体製造工程の流れ（Semi Journal）",["メトカーフの法則は通信ネットワークの価値が利用者数の2乗に比例するという経験則で、ICの集積度とは関係ない。","ベンフォードの法則は自然界の数値データでは先頭の数字に1が最も多く現れるという統計上の法則である。","パーキンソンの法則は仕事は与えられた時間をすべて満たすまで膨張するという、組織や行動に関する経験則である。"],"https://www.youtube.com/watch?v=poKpjfO5m_8","【前工程編】半導体ができるまで（サンケン電気）",""],["成膜プロセスで、化学気相成長法は略して何と呼ばれるか？","CVD法","PVD法","ALD法","MBE法","CVD（Chemical Vapor Deposition：化学気相成長）法は、原料のガスを熱やプラズマで化学反応させ、ウェーハ表面に薄膜を堆積させる方法。絶縁膜や半導体膜の成膜に使われ、段差の部分にも均一に付きやすい。","https://semi-journal.jp/basics/process/deposition.html","成膜工程とは？手法と原理（Semi Journal）",["PVD法は物理気相成長法の略で、化学反応を使わず蒸着やスパッタリングで成膜する方法である。","ALD法は原子層堆積法の略で、原料ガスを交互に供給して1原子層ずつ膜を積む方法。化学気相成長法そのものの略称ではない。","MBE法は分子線エピタキシー法の略で、超高真空中で分子線を当てて結晶膜を成長させる物理的な方法である。"],"https://www.youtube.com/watch?v=Ggxw6-zK7HE","【半導体教育10】成膜技術とは何か？CVD、ALD、PVD","",["x:elec2_74","成膜法の分類（CVD法は気相成長の一つ）"]],["CVD法の種類の組合せは？","熱CVD法、プラズマCVD法","蒸着法、スパッタリング法","ウェットエッチング、ドライエッチング","スピン乾燥、IPA乾燥","CVD法には、熱で原料ガスを反応させる熱CVD法と、プラズマで反応させるプラズマCVD法がある。プラズマCVDは低温で成膜できるため、熱に弱い配線などを形成した後の工程でも使える。","https://semi-journal.jp/basics/process/deposition.html","成膜工程とは？手法と原理（Semi Journal）",["蒸着法とスパッタリング法はPVD法（物理気相成長法）の種類で、化学反応を使うCVD法ではない。","ウェットエッチングとドライエッチングは膜の不要部分を除去する工程の分類で、成膜法ではない。","スピン乾燥とIPA乾燥は洗浄後のウェーハの乾燥方法で、成膜とは関係ない。"],"https://www.youtube.com/watch?v=Ggxw6-zK7HE","【半導体教育10】成膜技術とは何か？CVD、ALD、PVD","",["w:179_2","プラズマCVD装置の模式図",{"a":"S-kei","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:PlasmaCVD-JP.PNG"}]],["成膜法の一つ、物理気相成長法は略して何と呼ばれるか？","PVD法","CVD法","RIE法","CMP法","PVD（Physical Vapor Deposition：物理気相成長）法は、化学反応を使わず、材料を物理的に蒸発させたり、はじき飛ばしたりしてウェーハに付着させる成膜方法。主に配線用の金属膜の形成に使われる。","https://semi-journal.jp/basics/process/deposition.html","成膜工程とは？手法と原理（Semi Journal）",["CVD法は化学気相成長法の略で、原料ガスの化学反応で成膜する方法。物理気相成長法ではない。","RIE法は反応性イオンエッチングの略で、プラズマ中のイオンで膜を削るドライエッチング法であり、成膜法ではない。","CMP法は化学機械研磨の略で、ウェーハ表面を化学作用と機械研磨で平坦化する工程である。"],"https://www.youtube.com/watch?v=Ggxw6-zK7HE","【半導体教育10】成膜技術とは何か？CVD、ALD、PVD",""],["PVD法の種類の組合せは？","蒸着法、スパッタリング法","熱CVD法、プラズマCVD法","イオン注入法、熱拡散法","めっき法、塗布法","PVD法には、材料を加熱して蒸発させる蒸着法と、イオンをターゲットに衝突させて原子をはじき出し付着させるスパッタリング法がある。スパッタリングは膜の密着性がよく、合金の膜も組成どおりに作りやすい。","https://semi-journal.jp/basics/process/deposition.html","成膜工程とは？手法と原理（Semi Journal）",["熱CVD法とプラズマCVD法はCVD法（化学気相成長法）の種類で、物理的に成膜するPVD法ではない。","イオン注入法と熱拡散法はウェーハに不純物を導入する方法で、成膜法ではない。","めっき法は溶液中の電気化学反応、塗布法は液体材料を塗って膜を作る方法で、いずれも気相を使うPVD法ではない。"],"https://www.youtube.com/watch?v=Ggxw6-zK7HE","【半導体教育10】成膜技術とは何か？CVD、ALD、PVD",""],["ウェーハ洗浄の基本となる洗浄法は？","RCA洗浄","超音波洗浄","ブラシ洗浄","オゾン水洗浄","RCA洗浄は、米国RCA社が開発したウェーハ洗浄法で、アンモニア・過酸化水素水の混合液（SC-1）でパーティクルや有機物を、塩酸・過酸化水素水の混合液（SC-2）で金属汚染を除去する。現在も半導体洗浄の基本になっている。","https://semi-journal.jp/basics/ref/rca.html","RCA洗浄の原理とは？（Semi Journal）",["超音波洗浄は洗浄液に超音波振動を加えてパーティクルを落とす物理的な洗浄法で、薬液によるウェーハ洗浄の基本体系ではない。","ブラシ洗浄はブラシでウェーハ表面をこすってパーティクルを落とす物理洗浄で、補助的に使われる方法である。","オゾン水洗浄はオゾンを溶かした水の強い酸化力で有機物を除去する方法で、RCA洗浄を補完・代替する目的で使われる。"],"https://www.semijapanwfd.org/know-industry/movie/equipment-screen1/","ウエット洗浄技術の基礎と最先端（SCREEN講師／SEMIジャパン WFD 動画で分かる半導体業界・技術）",""],["ウェーハを必ず乾燥させた状態で洗浄装置に入れ・取り出す考え方を何というか？","ドライイン・ドライアウト","ウェットイン・ドライアウト","クリーンイン・クリーンアウト","ドライエッチング","ドライイン・ドライアウトは、ウェーハを乾いた状態で洗浄装置に入れ、洗浄後も必ず乾いた状態で取り出すという考え方。濡れたまま搬送すると、水滴の跡（ウォーターマーク）やパーティクルの付着の原因になるため。","https://semi-journal.jp/basics/ref/rca.html","RCA洗浄の原理とは？（Semi Journal）",["ウェットイン・ドライアウトは濡れた状態で装置に入れる方式で、搬送中の水滴がウォーターマークやパーティクル付着の原因となる。","クリーンイン・クリーンアウトは清浄さを表す言い回しにすぎず、乾燥状態で搬入・搬出するという問いの要点を表していない。","ドライエッチングはプラズマ中のイオンやラジカルで膜を削る加工法で、洗浄装置への出し入れの考え方ではない。"],"https://www.semijapanwfd.org/know-industry/movie/equipment-screen1/","ウエット洗浄技術の基礎と最先端（SCREEN講師／SEMIジャパン WFD 動画で分かる半導体業界・技術）",""],["洗浄後の乾燥不良で起きる、不完全なシリコンの酸化（シミ）を何というか？","ウォーターマーク","パーティクル","自然酸化膜","ボイド","ウォーターマークは、洗浄後にウェーハ表面の水滴が乾く過程で、シリコンと水・酸素が反応してできる不完全な酸化物のシミ。デバイスの不良の原因になるため、IPA乾燥やマランゴニ乾燥などで水滴を残さず乾燥させる。","https://semi-journal.jp/basics/ref/rca.html","RCA洗浄の原理とは？（Semi Journal）",["パーティクルはウェーハ表面に付着する微粒子（ゴミ）で、酸化反応によってできるシミではない。","自然酸化膜はシリコンが大気や水に触れて表面全体に自然にできる薄い酸化膜で、乾燥不良による局所的なシミとは区別される。","ボイドは膜や封止樹脂、はんだなどの内部にできる空洞のことで、表面のシミではない。"],"https://www.semijapanwfd.org/know-industry/movie/equipment-screen1/","ウエット洗浄技術の基礎と最先端（SCREEN講師／SEMIジャパン WFD 動画で分かる半導体業界・技術）",""],["洗浄後の乾燥方法3種類の組合せは？","スピン乾燥、IPA乾燥、マランゴニ乾燥","熱風乾燥、真空乾燥、凍結乾燥","自然乾燥、温風乾燥、赤外線乾燥","スピン乾燥、プラズマ乾燥、UV乾燥","ウェーハの乾燥方法には、高速回転の遠心力で水を飛ばすスピン乾燥、水をIPA（イソプロピルアルコール）の蒸気で置き換えて乾かすIPA乾燥、表面張力の差（マランゴニ効果）を利用して水を引き剥がすマランゴニ乾燥がある。","https://semi-journal.jp/basics/ref/rca.html","RCA洗浄の原理とは？（Semi Journal）",["熱風乾燥・真空乾燥・凍結乾燥は食品や一般工業で使う乾燥方法で、ウェーハ洗浄後の代表的な乾燥方法の組合せではない。","自然乾燥や温風乾燥では水滴がゆっくり乾いてウォーターマークが生じやすく、ウェーハの乾燥には適さない。","スピン乾燥は正しいが、プラズマやUVは有機物の除去などに使われ、洗浄後の水分を乾燥させる方法ではない。"],"https://www.semijapanwfd.org/know-industry/movie/equipment-screen1/","ウエット洗浄技術の基礎と最先端（SCREEN講師／SEMIジャパン WFD 動画で分かる半導体業界・技術）",""],["空気中のパーティクルを非常に少なくした部屋を何というか？","クリーンルーム","ドライルーム","シールドルーム","無響室","クリーンルームは、空気中の微粒子（パーティクル）の数を非常に少なく管理し、温度・湿度・気圧なども制御した部屋。高性能フィルタ（HEPA、ULPA）を通した清浄な空気を流し続ける。半導体や精密機器、医薬品の製造に使われる。","https://www.airtech.co.jp/advantage/cleanroom/cleanroom_class/","クリーンルームのクラス（清浄度）について（日本エアーテック）",["ドライルームは湿度（露点）を極めて低く管理した部屋で、リチウムイオン電池の製造などに使われ、パーティクル管理が主目的ではない。","シールドルームは外部からの電磁波を遮へいした部屋で、EMC試験などに使われる。","無響室は壁面で音を吸収して反響をなくした部屋で、音響測定に使われる。"],"https://www.youtube.com/watch?v=ENvkwQ1HAaI","清浄度クラスとは何か 定義と規格表の説明","",["w:192_1","半導体のクリーンルーム内部",{"a":"Uploaded by Duk 08:45, 16 Feb 2005 (UTC)","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Clean_room.jpg"}]],["クリーンルームの清浄度を、パーティクルが何個存在するかで表す規格は？","ISO規格（ISO 14644-1）","JIS C規格","IEC規格","UL規格","クリーンルームの清浄度は、ISO 14644-1で、1m³の空気中に含まれる一定の大きさ以上の粒子の数によって、クラス1〜9に分類される。数字が小さいほどきれい。旧米国規格では1立方フィートあたりの粒子数でクラス100などと表していた。","https://www.airtech.co.jp/advantage/cleanroom/cleanroom_class/","クリーンルームのクラス（清浄度）について（日本エアーテック）",["JIS Cは電気・電子分野の日本産業規格の部門記号で、クリーンルームの清浄度はJIS B 9920などで規定される。","IEC規格は国際電気標準会議が定める電気・電子技術の国際規格で、粒子数による清浄度クラスは扱わない。","UL規格は米国の安全認証機関が定める電気製品などの安全規格で、清浄度の規格ではない。"],"https://www.youtube.com/watch?v=ENvkwQ1HAaI","清浄度クラスとは何か 定義と規格表の説明",""],["熱CVD法で、500℃以上の高温成膜に使い、大量のウェーハを同時に処理できるが処理時間が長い方式は？","ホットウォール方式","コールドウォール方式","枚葉式プラズマ方式","スパッタ方式","ホットウォール方式は、反応管（炉）全体を外側から加熱する熱CVD。500℃以上の高温での成膜に使われ、大量のウェーハを並べて一度に処理（バッチ処理）できるが、昇温・降温に時間がかかるため処理時間は長い。","https://semi-journal.jp/basics/process/deposition.html","成膜工程とは？手法と原理（Semi Journal）",["コールドウォール方式はウェーハだけを加熱し、500℃以下の低温で1枚ずつ処理する枚葉式の熱CVDである。","プラズマ方式はプラズマで原料ガスを反応させるプラズマCVDで、熱CVDではなく低温成膜に向く。","スパッタ方式はイオンでターゲットの原子をはじき出して付着させるPVD法で、熱CVDの方式ではない。"],"https://www.youtube.com/watch?v=Ggxw6-zK7HE","【半導体教育10】成膜技術とは何か？CVD、ALD、PVD",""],["熱CVD法で、500℃以下の低温成膜に使い、1枚ずつ処理する枚葉式の方式は？","コールドウォール方式","ホットウォール方式","バッチ方式","拡散炉方式","コールドウォール方式は、反応室の壁は冷やしたまま、ウェーハ（とその載せ台）だけを加熱する熱CVD。500℃以下の比較的低温での成膜に使われ、1枚ずつ処理する枚葉式なので1枚あたりは短時間だが、枚数が増えると全体の処理時間は増える。","https://semi-journal.jp/basics/process/deposition.html","成膜工程とは？手法と原理（Semi Journal）",["ホットウォール方式は反応管全体を加熱し、500℃以上の高温で大量のウェーハを一括処理する方式である。","バッチ方式は多数のウェーハを一度にまとめて処理する方式で、1枚ずつ処理する枚葉式とは逆である。","拡散炉方式は高温の炉で不純物の拡散や酸化を行う方式で、多数枚を一括処理するため枚葉式の低温成膜ではない。"],"https://www.youtube.com/watch?v=Ggxw6-zK7HE","【半導体教育10】成膜技術とは何か？CVD、ALD、PVD",""],["エッチングの2種類の組合せは？","ウェットエッチング、ドライエッチング","熱CVD、プラズマCVD","蒸着、スパッタリング","アッシング、ダイシング","エッチングは、薄膜の不要な部分を取り除く工程で、薬液で溶かすウェットエッチングと、プラズマ中のイオンやラジカルで削るドライエッチングがある。ドライエッチングは方向性があり、微細なパターンを正確に加工できる。","https://semi-journal.jp/basics/process/etching.html","エッチング工程とは？原理と装置の構成（Semi Journal）",["熱CVDとプラズマCVDは化学気相成長による成膜法の種類で、膜を取り除くエッチングの分類ではない。","蒸着とスパッタリングはPVD法による成膜の種類で、エッチングではない。","アッシングはレジストを灰化して除去する工程、ダイシングはウェーハをチップに切り分ける工程で、エッチングの分類ではない。"],"https://www.youtube.com/watch?v=PrUENlhEdvA","エッチングを徹底解説！！【半導体プロセス解説シリーズ】",""],["エッチング後に残った不要なレジストを除去するプロセスは？","アッシング","ダイシング","ボンディング","リフロー","アッシングは、エッチング後に不要になったレジスト（感光性樹脂）を、酸素プラズマなどで灰化（燃焼）させて除去する工程。アッシュ（ash）は灰の意味。","https://semi-journal.jp/basics/process/etching.html","エッチング工程とは？原理と装置の構成（Semi Journal）",["ダイシングはウェーハを切断して個々のチップに分ける後工程で、レジストの除去ではない。","ボンディングはチップをリードフレームに固定したり、電極をワイヤで接続したりする工程である。","リフローは基板に印刷したはんだを加熱して溶かし、部品を接合する実装工程である。"],"https://www.youtube.com/watch?v=PrUENlhEdvA","エッチングを徹底解説！！【半導体プロセス解説シリーズ】",""],["LSIチップの端子を外部に引き出す金属の枠（端子）を何というか？","リードフレーム","ボンディングパッド","ダイパッド","スルーホール","リードフレームは、ICチップを載せ、その端子を外部に引き出すための薄い金属板の枠。チップの電極とリードフレームをワイヤでつなぎ、樹脂で封止したあと、外に出たリード部分が基板にはんだ付けされる端子になる。","https://semi-journal.jp/basics/process/wire-bonding.html","ワイヤーボンディングとは？種類と原理（Semi Journal）",["ボンディングパッドはチップ上に設けたワイヤ接続用の電極で、端子を外部に引き出す金属の枠ではない。","ダイパッドはリードフレームの中央でチップを載せて固定する部分で、端子を外部に引き出す部分ではない。","スルーホールはプリント基板の層間をつなぐため内壁をめっきした穴で、パッケージの端子ではない。"],"https://www.youtube.com/watch?v=xBY5G9JFxe0","【後工程編】半導体ができるまで（サンケン電気）","",["x:elec2_88","集積回路の構造とリードフレーム"]],["リードフレームを使わず、はんだボールを格子状に並べて接続するパッケージは？","BGA","QFP","DIP","SOP","BGA（Ball Grid Array）は、パッケージの裏面にはんだボールを格子状に並べて端子にしたパッケージ。リードフレームを使わずに多数の端子を小さな面積に配置できるため、多ピンのCPUなどに使われる。","https://semi-journal.jp/basics/process/wire-bonding.html","ワイヤーボンディングとは？種類と原理（Semi Journal）",["QFPはパッケージの4辺からガルウィング状のリードを出す表面実装パッケージで、リードフレームを使う。","DIPは2列のピンを基板の穴に挿す挿入実装パッケージで、リードフレームを使う。","SOPは2辺からリードを出す小型の表面実装パッケージで、リードフレームを使う。"],"https://www.youtube.com/watch?v=xBY5G9JFxe0","【後工程編】半導体ができるまで（サンケン電気）","",["x:elec2_89","はんだボールを格子状に並べたBGAの構造"]],["チップ上の端子とリードフレームを細いワイヤで接続する工程は？","ワイヤボンディング","ダイボンディング","フリップチップ","ダイシング","ワイヤボンディングは、ICチップ上の電極（パッド）とリードフレームの端子を、金やアルミ、銅の細いワイヤでつなぐ工程。ワイヤを使わずチップを裏返して直接つなぐ方法はフリップチップ接続という。","https://semi-journal.jp/basics/process/wire-bonding.html","ワイヤーボンディングとは？種類と原理（Semi Journal）",["ダイボンディングはチップをリードフレームのダイパッドなどに接着・固定する工程で、ワイヤで接続する工程ではない。","フリップチップはチップを裏返し、電極のバンプで基板に直接接続する方式で、ワイヤを使わない。","ダイシングはウェーハを切断して個々のチップに分ける工程で、接続工程ではない。"],"https://www.youtube.com/watch?v=xBY5G9JFxe0","【後工程編】半導体ができるまで（サンケン電気）","",["x:elec2_90","チップとリードフレームをつなぐワイヤボンディング"]],["高温・高電圧などで一定時間LSIを動作させ、初期不良を早期に出して取り除く方法は？","バーンイン","エージングレス試験","プローブテスト","X線検査","バーンインは、出荷前のICに高温・高電圧をかけて一定時間動作させ、弱い部分をもつ製品をわざと故障させて取り除く試験。故障率曲線の初期故障期を出荷前に済ませておくことで、出荷後の故障を減らす。","https://semi-journal.jp/basics/test/burn-in.html","半導体のバーンインとは：ウェーハテスト・ファイナルテストとの違い（Semi-journal）",["エージングレスはエージング（慣らし動作）を省くことを意味する言葉で、初期不良を出し切るバーンインとは逆の考え方である。","プローブテストはウェーハ状態のチップに探針を当てて電気特性を調べる検査で、ストレスをかけて不良を出す試験ではない。","X線検査はX線でパッケージ内部のワイヤやはんだ接合を非破壊で調べる検査で、動作させて不良を出すものではない。"],"https://www.youtube.com/watch?v=xBY5G9JFxe0","【後工程編】半導体ができるまで（サンケン電気）","",["x:elec2_91","バスタブ型故障率曲線（初期故障期を取り除く）"]],["フリップフロップの4種類の組合せは？","RS、D、T、JK","AND、OR、NOT、XOR","SR、PN、NPN、PNP","FIR、IIR、LPF、HPF"
