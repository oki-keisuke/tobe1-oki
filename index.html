,"フリップフロップの代表は、セット・リセット入力をもつRS、クロックのタイミングで入力Dを記憶するD、クロックごとに出力が反転するT、RSの禁止入力をなくし反転動作もできるJKの4種類。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-3-2.html","順序論理回路（フリップフロップ）（東芝デバイス＆ストレージ）",["AND・OR・NOT・XORは基本的な論理ゲートで、記憶機能をもつフリップフロップの種類ではない。","SRはRSと同じ意味だが、PN・NPN・PNPは半導体の接合やトランジスタの極性を表すもので、フリップフロップではない。","FIR・IIRはデジタルフィルタの構造、LPF・HPFは通過帯域によるフィルタの分類で、フリップフロップとは無関係。"],"https://www.youtube.com/watch?v=ogLNCgH4xQA","フリップフロップの基礎知識【デジタル回路設計】",""],["ある情報が与えられたとき、それに対応する符号を出力する回路は？","エンコーダ","デコーダ","マルチプレクサ","カウンタ","エンコーダ（符号器）は、入力された情報を、決まった符号に変換して出力する回路。例えば10個のキーのどれが押されたかを4ビットの2進数に変換する。回転角をパルスに変えるセンサのエンコーダとは別物。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-2-4.html","組み合わせ論理回路（デコーダー）（東芝デバイス＆ストレージ）",["デコーダは符号を入力すると対応する情報に戻す回路で、エンコーダとは逆の働きである。","マルチプレクサは複数の入力から選択信号で1つを選んで出力する回路（データセレクタ）で、符号化はしない。","カウンタは入力パルスの数を数えて2進数などで出力する回路で、与えられた情報を符号に変換する回路ではない。"],"https://www.youtube.com/watch?v=E2FCb4lGBBU","【論理回路】Dフリップフロップの仕組み","",["x:elec2_93","10進入力を2進に変換するエンコーダ回路"]],["符号を入力すると、それに対応する情報を出力する回路は？","デコーダ","エンコーダ","ラッチ","シフトレジスタ","デコーダ（復号器）は、エンコーダの逆で、符号を入力すると、それに対応する出力線を1本だけ有効にするなど、元の情報に戻す回路。メモリのアドレスデコーダや、7セグメント表示器の駆動などに使われる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/cmos-logic-basics/chap3/chap3-2-4.html","組み合わせ論理回路（デコーダー）（東芝デバイス＆ストレージ）",["エンコーダは情報を符号に変換する回路で、デコーダとは逆の働きである。","ラッチは入力データを一時的に保持する記憶回路で、符号を情報に変換する機能はない。","シフトレジスタはクロックごとにデータを1ビットずつ隣へ移す回路で、直列・並列変換などに使う。"],"https://www.youtube.com/watch?v=E2FCb4lGBBU","【論理回路】Dフリップフロップの仕組み","",["x:elec2_94","2進入力から0〜9を選ぶデコーダ回路"]],["ユーザ自身がプログラムによってデジタル回路を書き込める論理素子は？","PLD","ASIC","ROM","CPU","PLD（Programmable Logic Device）は、購入後にユーザ自身がプログラムでデジタル回路を書き込める論理素子。大規模なものがFPGA。少量生産や試作、仕様変更が多い製品に向く。","https://emb.macnica.co.jp/articles/8204/","これで分かる！プロセッサとFPGAとASICの違い（マクニカ）",["ASICはメーカに仕様を示して製作する特定用途向けICで、製造後にユーザが回路を書き換えることはできない。","ROMはデータやプログラムを記憶するメモリで、論理回路そのものを書き込んで構成する素子ではない。","CPUはプログラムの命令を順に実行する演算処理装置で、ハードウェアの回路構成自体を書き込むものではない。"],"https://www.youtube.com/watch?v=UkJwFoReMEA","FPGAってどんなもの？","",["w:039_2","PLDの一種であるFPGAチップの外観",{"a":"Ordercrazy","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Embedded_World_2016,_Altera_Cyclone-V_SE_(cropped).jpg"}]],["メーカに設計仕様を示して製作する、特定用途向けの大規模ICは？","ASIC","PLD","FPGA","汎用ロジックIC","ASIC（Application Specific Integrated Circuit：特定用途向けIC）は、特定の製品や用途のために、メーカに仕様を示して設計・製造してもらうIC。大量生産すると1個あたりは安く高性能になるが、開発費が高く、作った後は変更できない。","https://emb.macnica.co.jp/articles/8204/","これで分かる！プロセッサとFPGAとASICの違い（マクニカ）",["PLDはユーザ自身がプログラムで回路を書き込める論理素子で、メーカに製作を依頼するものではない。","FPGAは大規模なPLDで、購入後にユーザが回路を書き換えられる。メーカが特定用途向けに製作するICではない。","汎用ロジックICはAND・ORなどの基本論理を収めた標準品のICで、特定用途向けに設計されたものではない。"],"https://www.youtube.com/watch?v=UkJwFoReMEA","FPGAってどんなもの？",""],["ASICのうち、①メーカが一から設計・製造するIC、②標準化された基本セルの配列を配線するIC、の名称は？","①フルカスタムIC ②セミカスタムIC","①セミカスタムIC ②フルカスタムIC","①PLD ②FPGA","①システムLSI ②汎用IC","フルカスタムICは、トランジスタの配置から配線まですべてを一から設計する方式で、最も高性能・小型だが開発費と期間がかかる。セミカスタムICは、あらかじめ並べた基本セルの配線だけを設計する方式（ゲートアレイなど）で、開発期間と費用を抑えられる。","https://emb.macnica.co.jp/articles/8204/","これで分かる！プロセッサとFPGAとASICの違い（マクニカ）",["名称の対応が逆である。一から設計するのがフルカスタム、基本セルの配線だけを設計するのがセミカスタムである。","PLDとFPGAはユーザが自分で回路を書き込める素子で、メーカが製作するASICの分類ではない。","システムLSIはシステム機能を1チップにしたLSI、汎用ICは標準品のICで、ASICの設計方式による分類ではない。"],"https://www.youtube.com/watch?v=UkJwFoReMEA","FPGAってどんなもの？","",["x:elec2_97","ASICの分類（フルカスタム・セミカスタム等）"]],["特定のシステム機能を1チップで実現したLSIを何というか？","システムLSI","汎用LSI","ディスクリート","モジュール","システムLSIは、CPU、メモリ、各種インターフェースなど、1つのシステムに必要な機能を1つのチップに集積したLSI。SoC（System on a Chip）とも呼ばれ、スマートフォンやデジタル家電に使われる。","https://emb.macnica.co.jp/articles/8204/","これで分かる！プロセッサとFPGAとASICの違い（マクニカ）",["汎用LSIはメモリやマイコンのように多くの用途で使える標準品のLSIで、特定のシステム機能に特化したものではない。","ディスクリートはトランジスタやダイオードなどを1個ずつ独立させた個別部品で、集積回路ではない。","モジュールは複数の部品やチップを基板などにまとめた組立品で、1チップで機能を実現したものではない。"],"https://www.youtube.com/watch?v=UkJwFoReMEA","FPGAってどんなもの？",""],["多数の素子を集めた電子回路をIC、そのうち1チップの素子数が数千〜数万以上のものを何というか？","LSI","SSI","MSI","トランジスタアレイ","ICは多数の素子を1つのチップに集積した電子回路で、集積度によってSSI（〜100素子）、MSI（〜1000）、LSI（1000〜10万程度）、VLSI（それ以上）などと呼び分ける。現在は大規模なものをまとめてLSIと呼ぶことが多い。","https://e-words.jp/w/LSI.html","LSI（大規模集積回路）とは（IT用語辞典 e-Words）",["SSIは小規模集積回路で、1チップの素子数が約100以下の基本ゲートIC程度のもの。","MSIは中規模集積回路で、素子数が約100〜1000程度のカウンタやデコーダ程度のもの。","トランジスタアレイは複数のトランジスタを1パッケージにまとめただけの部品で、集積度による分類名ではない。"],"https://www.youtube.com/watch?v=bfIMtiAml08","ゼロから学ぶ！半導体の基礎知識【サンケン電気】",""],["クリーンルームのISO規格で、0.1μm粒子が10個/m³以下のものはどのクラスか？","クラス1","クラス10","クラス100","クラス5","ISO 14644-1のクラス1は、1m³中の0.1μm以上の粒子が10個以下という、最も清浄度の高いクラス。クラスの数字が1つ大きくなるごとに、許される粒子数はおよそ10倍になる。最先端の半導体製造に使われる。","https://www.airtech.co.jp/advantage/cleanroom/cleanroom_class/","クリーンルームのクラス（清浄度）について（日本エアーテック）",["ISO 14644-1のクラスは1〜9で、クラス10は存在しない。1立方フィートあたりの粒子数で表した旧米国規格のクラス表記と混同しやすい。","クラス100は旧米国規格での呼び方で、ISOではクラス5にほぼ相当し、0.1μm粒子は10個/m³よりはるかに多い。","クラス5は0.1μm粒子の上限が10万個/m³で、旧米国規格のクラス100に相当する。10個/m³はその1万分の1である。"],"https://www.youtube.com/watch?v=ENvkwQ1HAaI","清浄度クラスとは何か 定義と規格表の説明",""]]},{"id":"elec3","title":"電気電子 2-1 インターフェース・2-2 モータと電力","cat":"電気電子","q":[["複雑で多様な命令セットを持ったマイコン（プロセッサ）は？","CISC","RISC","DSP","GPU","CISC（Complex Instruction Set Computer）は、複雑で多機能な命令を多数もつプロセッサ。1命令で多くの処理ができるのでプログラムは短くなるが、命令ごとに実行時間がばらつき、回路が複雑になる。パソコン用のx86系が代表。","https://edn.itmedia.co.jp/edn/articles/1404/07/news001.html","CISCとRISC、何が違う？Q&Aで学ぶマイコン講座（EDN Japan）",["RISCは命令を単純で少数に絞ったプロセッサで、複雑で多様な命令セットとは正反対の設計思想である。","DSPはフィルタ処理など信号処理向けに積和演算を高速化したプロセッサで、命令セットの複雑さによる分類ではない。","GPUは画像処理や並列計算向けに多数の演算器を並べたプロセッサで、命令セットの複雑さを表す用語ではない。"],"https://www.youtube.com/watch?v=Kh8s7wI6kzs","【A試験_ハードウェア】05. CPUの高速化",""],["単純で少数の命令セットを持ったマイコン（プロセッサ）は？","RISC","CISC","ASIC","FPGA","RISC（Reduced Instruction Set Computer）は、命令を単純で少数に絞ったプロセッサ。各命令の実行時間がそろうのでパイプライン処理の効率が高く、回路が簡単で消費電力も小さい。ARMなど組込み機器やスマートフォンで主流。","https://edn.itmedia.co.jp/edn/articles/1404/07/news001.html","CISCとRISC、何が違う？Q&Aで学ぶマイコン講座（EDN Japan）",["CISCは複雑で多機能な命令を多数もつプロセッサで、単純で少数の命令セットとは逆である。","ASICは特定用途向けに設計した専用集積回路のことで、命令セットの種類を表す用語ではない。","FPGAは利用者が内部の論理回路を書き換えられるデバイスで、命令セットによるプロセッサの分類ではない。"],"https://www.youtube.com/watch?v=Kh8s7wI6kzs","【A試験_ハードウェア】05. CPUの高速化",""],["電源投入後しばらくマイコンをリセット状態に保つよう、抵抗とコンデンサなどで作る回路は？","パワーオンリセット回路","ウォッチドッグタイマ","ブラウンアウト検出回路","クロック発振回路","パワーオンリセット回路は、電源を入れた直後、電圧が安定するまでのしばらくの間、マイコンのリセット端子をリセット状態に保つ回路。抵抗とコンデンサの充電時間（時定数）を利用するのが基本。電源が不安定なまま動き出すと暴走の原因になる。","https://e-words.jp/w/%E3%83%91%E3%83%AF%E3%83%BC%E3%82%AA%E3%83%B3%E3%83%AA%E3%82%BB%E3%83%83%E3%83%88.html","パワーオンリセット（PoR）とは（IT用語辞典 e-Words）",["ウォッチドッグタイマは、プログラムの暴走で一定時間タイマがクリアされないときにリセットをかける機能で、電源投入時の回路ではない。","ブラウンアウト検出回路は、動作中に電源電圧が規定値以下に下がったことを検出してリセットする回路で、投入直後の保持が主目的ではない。","クロック発振回路は水晶振動子などでマイコンの動作クロックを作る回路で、リセット状態を保つ働きはない。"],"https://www.youtube.com/watch?v=nf-oduopA4A","シュミットトリガ回路の動作原理","",["x:elec3_3","パワーオンリセット回路（抵抗とコンデンサで遅延）"]],["アナログ値をデジタル値に変える変換器は？","ADコンバータ","DAコンバータ","マルチプレクサ","F/V変換器","ADコンバータ（A/D変換器）は、センサなどからの連続的なアナログ電圧を、マイコンが扱えるデジタル値に変換する。ビット数が多いほど細かく表せる。逆にデジタル値をアナログ電圧に戻すのはDAコンバータ。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["DAコンバータはデジタル値をアナログ電圧に変換する装置で、変換の向きが逆である。","マルチプレクサは複数の入力から1つを選んで出力する切替器で、アナログ値をデジタル値に変換する機能はない。","F/V変換器は周波数を電圧に変換する装置で、出力はアナログ電圧のためデジタル値は得られない。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～","",["x:elec3_4","センサ→ADコンバータ→マイコンの信号の流れ"]],["ADコンバータで、基準電圧との比較によって出力を得る方式は？","比較形","積分形","ΔΣ形","パルス幅変調形","比較形のADコンバータは、入力電圧を内部で作った基準電圧と比べながらデジタル値を決める方式。逐次比較形が代表で、上位ビットから順に「基準より大きいか小さいか」を判定していく。変換が速く、マイコン内蔵のADCに多い。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["積分形は入力電圧を積分し、放電にかかる時間をパルスで数えて変換する方式で、基準電圧との逐次比較ではない。","ΔΣ形は入力を高速に1ビット量子化し、デジタルフィルタで平均化して高分解能を得る方式である。","パルス幅変調（PWM）はパルスの幅で出力を調整する手法で、主にDA変換やモータ制御に使われ、AD変換方式ではない。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～","",["w:207_3","逐次比較形ADCの構成：比較器・制御論理・DA変換器",{"a":"Luca Ghio","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Successive-approximation_AD_converter.png"}]],["ADコンバータで、入力電圧に比例した時間のパルス数を数えて出力を得る方式は？","積分形","比較形","逐次比較形","フラッシュ形","積分形のADコンバータは、入力電圧を一定時間積分し、それを基準電圧で戻す（放電する）のにかかった時間をクロックパルスで数えて変換する方式（二重積分形など）。変換は遅いが、高精度でノイズに強く、デジタルマルチメータに使われる。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["比較形は入力電圧を内部の基準電圧と比べてデジタル値を決める方式で、パルス数を数える方式ではない。","逐次比較形は比較形の代表で、上位ビットから順に基準電圧と比較して決める方式である。","フラッシュ形は多数の比較器で入力を一度に比較する最も高速な方式で、時間を数える処理はない。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～","",["w:144_0","二重積分形ADCの積分回路（VinとVrefを切替）",{"a":"Scottr9 (talk) (Uploads)","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Basic_integrating_adc.svg"}]],["0〜5Vのアナログ値を0〜255のデジタル値に変換するときの分解能はおよそいくらか？","0.02V","0.2V","0.005V","0.05V","8ビットでは0〜255の256段階で表す。フルスケール5Vを255で割ると、1段階（1LSB）あたり約0.0196V≒0.02V。これより小さい電圧の違いは区別できない。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["0.2Vは約25段階分の幅で、5Vを255段階に分けた1段階の約10倍にあたり大きすぎる。","0.005Vは5Vを約1000段階に分けた値で、10ビット（0〜1023）程度の分解能に相当する。","0.05Vは5Vを100段階に分けた値で、8ビットの255段階に比べ粗すぎる。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～","",["x:elec3_7","8ビットAD変換の入出力関係と分解能"]],["8ビットAD変換（0〜5V）で、デジタル値109のときの電圧xを求める比例式は？","255 : 109 ＝ 5V : x","109 : 255 ＝ 5V : x","256 : 5V ＝ x : 109","5V : 109 ＝ 255 : x","デジタル値255がフルスケール5Vに対応するので、比例関係は 255：109＝5V：x。これを解くと x＝5×109÷255≒2.14V。2進数01101101＝10進数109。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["109：255＝5V：xとすると、デジタル値と電圧の対応が逆になり、xが5Vより大きな誤った値になる。","フルスケールは0〜255の255で対応させるのが正しく、256を使い項の並びも崩れているため比例関係が成り立たない。","5V：109＝255：xは電圧とデジタル値を混在させた比で、対応する量どうしが比べられていない。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～","",["x:elec3_7","0〜5Vを0〜255に対応させる比例関係"]],["複数のチャンネルの入力を切り替えて、ADコンバータへ送るものは？","マルチプレクサ","デマルチプレクサ","エンコーダ","サンプルホールド","マルチプレクサは、複数の入力信号の中から1つを選んで出力に送る切替器。1つのADコンバータで複数のセンサを順番に測るときに使う。逆に1つの入力を複数の出力に振り分けるのはデマルチプレクサ。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["デマルチプレクサは1つの入力を複数の出力に振り分ける回路で、マルチプレクサとは働きが逆である。","エンコーダは複数の入力のうちどれが有効かを2進コードに変換する回路で、信号を切り替えて送るものではない。","サンプルホールドはAD変換中に入力電圧を一時的に保持する回路で、チャンネルを切り替える働きはない。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～","",["x:elec3_9","マルチプレクサで多チャンネルをADへ切替"]],["1ビットあたりのアナログ電圧幅を何というか？","分解能","変換速度","量子化誤差","ダイナミックレンジ","分解能は、デジタル値の1ビット（1段階）が表すアナログ量の幅。分解能＝フルスケール÷(2^ビット数−1)。ビット数が多いほど分解能が細かくなり、小さな変化まで検出できる。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["変換速度は1回のAD変換にかかる時間（または1秒あたりの変換回数）で、電圧幅を表すものではない。","量子化誤差はアナログ値を段階的なデジタル値に丸めることで生じる誤差で、最大で分解能の半分程度となる。","ダイナミックレンジは扱える最大値と最小値の比で、1ビットあたりの幅ではない。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～",""],["1本の信号線に1ビットずつ順番に信号を送る伝送方式は？","シリアル伝送","パラレル伝送","全二重伝送","ベースバンド伝送","シリアル伝送は、1本の信号線で1ビットずつ順番にデータを送る方式。信号線が少なくて済み、長い距離でもデータのずれ（スキュー）が起きにくい。USB、RS-232C、イーサネットなど現在の多くの通信がシリアル伝送。","https://e-words.jp/w/%E8%AA%BF%E6%AD%A9%E5%90%8C%E6%9C%9F.html","調歩同期（非同期シリアル通信）とは（IT用語辞典 e-Words）",["パラレル伝送は複数の信号線で複数ビットを同時に送る方式で、1本で順番に送る方式ではない。","全二重伝送は送信と受信を同時に行える通信形態のことで、ビットを送る順序や本数を表す用語ではない。","ベースバンド伝送はデジタル信号を変調せずにそのまま送る方式で、シリアルかパラレルかの区別ではない。"],"https://www.youtube.com/watch?v=vQnsNq7zfBw","【Arduino入門講座】シリアル通信 #5",""],["データの最初と最後にスタートビットとストップビットを付け、データの区切りをつける通信方式は？","調歩同期式","同期式","クロック同期式","パラレル式","調歩同期式（非同期式）は、送るデータ（1文字）の前にスタートビット、後ろにストップビットを付け、受信側がスタートビットを合図にデータを読み取る方式。クロック線が不要で、UARTやRS-232Cで使われる。","https://e-words.jp/w/%E8%AA%BF%E6%AD%A9%E5%90%8C%E6%9C%9F.html","調歩同期（非同期シリアル通信）とは（IT用語辞典 e-Words）",["同期式は送受信側でタイミングをそろえて連続データを送る方式で、1文字ごとにスタート・ストップビットを付けない。","クロック同期式は別のクロック線でタイミングを伝える方式（SPIなど）で、スタート・ストップビットで区切らない。","パラレル式は複数の信号線で同時にビットを送る方式で、スタート・ストップビットによる区切りとは関係ない。"],"https://www.youtube.com/watch?v=vQnsNq7zfBw","【Arduino入門講座】シリアル通信 #5","",["x:elec3_12","調歩同期式のスタートビットとストップビット"]],["8本や16本の信号線で、一度に8ビットや16ビット単位でやり取りする伝送方式は？","パラレル伝送","シリアル伝送","差動伝送","多重伝送","パラレル伝送は、複数の信号線（8本、16本など）を使って、複数ビットを同時に送る方式。一度に多く送れるが、配線が多く、長い距離では線ごとの到着時間がずれるため、短い距離向き。昔のプリンタ接続やCPU内部のバスで使われる。","https://e-words.jp/w/%E8%AA%BF%E6%AD%A9%E5%90%8C%E6%9C%9F.html","調歩同期（非同期シリアル通信）とは（IT用語辞典 e-Words）",["シリアル伝送は1本の信号線で1ビットずつ順番に送る方式で、複数本で同時に送る方式ではない。","差動伝送は2本の線に逆相の信号を流してその差を受け取るノイズに強い方式で、ビット幅の単位を表す用語ではない。","多重伝送は1本の伝送路に複数の信号を時間や周波数で分けて重ねて送る方式で、8本や16本の線で同時に送るものではない。"],"https://www.youtube.com/watch?v=vQnsNq7zfBw","【Arduino入門講座】シリアル通信 #5","",["x:elec3_13","パラレル伝送（複数線で同時に送信）"]],["より高速だが容量の小さいキャッシュと、速度は劣るが容量の大きいキャッシュをそれぞれ何というか？","1次キャッシュ、2次キャッシュ","2次キャッシュ、1次キャッシュ","SRAM、DRAM","レジスタ、主記憶","キャッシュメモリは、CPUに近い順に1次（L1）、2次（L2）、3次（L3）キャッシュと階層化されている。1次キャッシュは最も高速だが容量が小さく、2次・3次になるほど遅くなる代わりに容量が大きくなる。","https://e-words.jp/w/%E3%83%A9%E3%82%A4%E3%83%88%E3%83%90%E3%83%83%E3%82%AF%E3%82%AD%E3%83%A3%E3%83%83%E3%82%B7%E3%83%A5.html","ライトバックキャッシュとは（IT用語辞典 e-Words）",["順序が逆で、2次キャッシュは1次より遅いが容量が大きく、1次キャッシュが最も高速で小容量である。","SRAMとDRAMはメモリ素子の種類で、キャッシュには高速なSRAM、主記憶には大容量のDRAMが使われる。","レジスタはCPU内部の最速の記憶領域、主記憶はメインメモリで、どちらもキャッシュの階層の呼び名ではない。"],"https://www.youtube.com/watch?v=mGwdUQhKMWQ","初心者でもわかる！キャッシュメモリの仕組みや特徴を徹底解説","",["x:elec3_14","1次・2次キャッシュとメインメモリの階層"]],["CPU、メモリ、I/Oポートが相互に情報をやり取りするための通り道を何というか？","バス","ポート","チャネル","スタック","バスは、CPU、メモリ、入出力装置の間でデータをやり取りするための共通の信号線の束。データを運ぶデータバス、どこにアクセスするかを示すアドレスバス、読み書きのタイミングなどを伝える制御バスがある。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/e-learning/micro-intro/chapter2/types-of-bus-lines.html","バスラインの種類（東芝デバイス＆ストレージ）",["ポートはCPUと外部機器の間で信号を出し入れする出入口で、各装置を結ぶ共通の通り道ではない。","チャネルは通信路や、CPUに代わって入出力を制御する装置などを指す用語で、CPU・メモリ・I/O間の共通信号線ではない。","スタックは後入れ先出し（LIFO）で使うメモリ領域で、サブルーチンの戻り番地の保存などに使い、信号の通り道ではない。"],"https://www.youtube.com/watch?v=MzlixLc3D0s","レジスタ・クロック信号・マルチコア【情報I基礎】CPUとメモリの仕組み","",["x:elec3_15","CPU・メモリ・I/Oを結ぶ3種類のバス"]],["中低速データ通信用のシリアル通信規格は？","RS-232C","USB","IEEE1394","HDMI","RS-232Cは、パソコンとモデムや計測器などを結ぶための、古くからあるシリアル通信規格。数十kbps程度の中低速で、通信距離は約15m。現在もFA機器や組込み機器の設定用ポートなどで使われている。","https://e-words.jp/w/%E8%AA%BF%E6%AD%A9%E5%90%8C%E6%9C%9F.html","調歩同期（非同期シリアル通信）とは（IT用語辞典 e-Words）",["USBはコンピュータと周辺機器をつなぐ汎用の高速シリアル規格で、中低速用の古い規格ではない。","IEEE1394は高速でリアルタイム性を重視したシリアル規格で、映像・音響機器の接続に使われた。","HDMIは映像と音声をデジタルで伝送するAV機器向けの規格で、中低速データ通信用ではない。"],"https://www.youtube.com/watch?v=vQnsNq7zfBw","【Arduino入門講座】シリアル通信 #5","",["w:096_1","RS-232C用のD-sub9ピンコネクタ",{"a":"Pittigrilli","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:RS-232_interface_using_DE-9_connector_(with_pinout_numbers).on_rear_of_Harman_Kardon_AVR_370_AV_receiver.jpg"}]],["コンピュータと周辺機器を接続するための汎用シリアル通信規格は？","USB","RS-232C","SCSI","GPIB","USB（Universal Serial Bus）は、コンピュータと周辺機器を接続する汎用のシリアル通信規格。抜き差しが簡単（ホットプラグ）で、電源も供給できる。USB2.0（480Mbps）、USB3.x、USB4と高速化が進んでいる。","https://e-words.jp/w/%E8%AA%BF%E6%AD%A9%E5%90%8C%E6%9C%9F.html","調歩同期（非同期シリアル通信）とは（IT用語辞典 e-Words）",["RS-232Cは中低速データ通信用の古いシリアル規格で、ホットプラグや給電に対応した汎用規格ではない。","SCSIはハードディスクなどを接続した主にパラレルの規格で、汎用シリアル規格ではない。","GPIBは計測器を制御するためのパラレルインタフェース規格で、汎用シリアル規格ではない。"],"https://www.youtube.com/watch?v=vQnsNq7zfBw","【Arduino入門講座】シリアル通信 #5","",["w:119_2","USBコネクタの各種形状",{"a":"Matthew Wynn","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:USB_connector_illustration,_to_scale,_grouping,_legacy,_Type-B.svg"}]],["高速かつリアルタイム性を重視し、ビデオ・オーディオ機器などに用いられたシリアル規格は？","IEEE1394","RS-232C","I2C","SPI","IEEE1394は、アップル社のFireWireをもとに標準化された高速シリアル規格。リアルタイム性の高いデータ転送（アイソクロナス転送）ができ、デジタルビデオカメラやオーディオ機器の接続に使われた。i.LINKとも呼ばれる。","https://e-words.jp/w/%E8%AA%BF%E6%AD%A9%E5%90%8C%E6%9C%9F.html","調歩同期（非同期シリアル通信）とは（IT用語辞典 e-Words）",["RS-232Cは中低速データ通信用のシリアル規格で、映像・音響に必要な高速性はない。","I2Cは2本の線で基板上のIC間を結ぶ低速のシリアルバスで、ビデオ機器の接続には使わない。","SPIはクロック線を使って基板上のIC間を高速につなぐ同期式シリアルで、機器どうしを結ぶAV規格ではない。"],"https://www.youtube.com/watch?v=vQnsNq7zfBw","【Arduino入門講座】シリアル通信 #5","",["w:040_0","IEEE1394コネクタ（4ピンと6ピン）",{"a":"Mikkel Paulson","l":"Public Domain","u":"https://commons.wikimedia.org/wiki/File:FireWire_cables.jpg"}]],["構造がシンプルで電池も不要なため多く使われている検電器は？","ネオン式検電器","電子式検電器","クランプメータ","メガー","ネオン式検電器は、電圧がかかった部分に当てると、内部のネオンランプが人体を通じた微小な電流で光る仕組み。構造が簡単で電池も不要なため、広く使われている。暗い場所や明るい屋外では点灯が見えにくいことがある。","https://www.monotaro.com/note/cocomite/122/","検電器の特長と使い方（モノタロウ）",["電子式検電器は内蔵電池で電子回路を動かし、ランプやブザーで知らせる方式で、電池が必要である。","クランプメータは電線を挟んで電流を測る計器で、電圧の有無を調べる検電器ではない。","メガーは高電圧をかけて絶縁抵抗を測る計器で、検電器ではない。"],"https://www.youtube.com/watch?v=H2glxuj6GpU","検電器の紹介＆低圧検電器の使い方","",["x:elec3_19","ネオン式検電器の原理（人体経由の微小電流）"]],["内蔵電池でランプやブザーを動作させ、ネオン式より視認性・安全性を高めた検電器は？","電子式検電器","ネオン式検電器","ロジックチェッカ","テスタ","電子式検電器は、内蔵電池で動く電子回路が電圧を検出し、ランプとブザーで知らせる検電器。音でも知らせるので見落としが少なく、ネオン式より視認性と安全性が高い。電池切れでないことを使用前に確認する。","https://www.monotaro.com/note/cocomite/122/","検電器の特長と使い方（モノタロウ）",["ネオン式検電器は電池不要でネオンランプが光るだけの方式で、ブザーはなく視認性は電子式に劣る。","ロジックチェッカはデジタル回路の電圧がHかLかを調べる測定器で、充電部の検電には使わない。","テスタは電圧・電流・抵抗などを測る汎用計器で、当てるだけで電圧の有無を知らせる検電器ではない。"],"https://www.youtube.com/watch?v=H2glxuj6GpU","検電器の紹介＆低圧検電器の使い方",""],["論理回路の電圧レベル（H/L）を調べるための簡易計測器は？","ロジックチェッカ","ロジックアナライザ","オシロスコープ","メガー","ロジックチェッカ（ロジックプローブ）は、デジタル回路の端子に当てて、その電圧がH（ハイ）かL（ロー）か、パルスが出ているかをランプで表示する簡易測定器。オシロスコープを使うほどでもない簡単な確認に便利。","https://monoist.itmedia.co.jp/mn/articles/1006/24/news100.html","ロジアナとMSO、違いと使い分け（MONOist）",["ロジックアナライザは多数のデジタル信号の時間変化を記録・表示する測定器で、簡易計測器ではない。","オシロスコープは電圧波形を時間軸で詳しく表示する測定器で、H/Lを簡易に調べる道具ではない。","メガーは絶縁抵抗を測る計器で、論理レベルの確認には使わない。"],"https://www.youtube.com/watch?v=vIF2dM4OS9o","ロジックアナライザの使い方徹底解説！オシロスコープとの違いとは？","",["x:elec3_21","ロジックチェッカの例（LEDでH/L表示）"]],["絶縁抵抗計は通称何と呼ばれるか？","メガー","テスタ","クランプメータ","ガウスメータ","メガー（絶縁抵抗計）は、電線や機器に高い直流電圧（250V、500V、1000Vなど）をかけて、絶縁抵抗（MΩ単位）を測る計器。電気設備の定期点検で、漏電の危険がないかを確認するのに使う。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0078.html","抵抗計・アースフック・検電器の種類と特長（MISUMI技術情報）",["テスタ（回路計）は電圧・電流・抵抗を測る汎用計器で、絶縁抵抗計の通称ではない。","クランプメータは電線を挟んで電流を測る計器の名称である。","ガウスメータは磁束密度を測る計器で、絶縁抵抗とは関係ない。"],"https://www.youtube.com/watch?v=Mq8ZU7Z9wvY","絶縁抵抗計(メガー)とは何？使い方をわかりやすく説明","",["x:elec3_22","絶縁抵抗計（メガー）の接続方法"]],["電線をクランプセンサで挟み込み、切断せずに電流を計測できる測定器は？","クランプメータ","メガー","テスタ","電力計","クランプメータは、電線をクランプ（はさみ）で挟むだけで、回路を切らずに電流を測れる計器。稼働中の設備の電流を安全・簡単に測れる。往路と復路の2本を一緒に挟むと磁界が打ち消し合って測れないので、1本だけ挟む。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0077.html","テスタ・クランプメーター・検相器の種類と特長（MISUMI技術情報）",["メガーは絶縁抵抗を測る計器で、電流は測らない。","テスタで電流を測るには回路を切って直列に接続する必要があり、挟むだけでは測れない。","電力計は電圧と電流から電力を測る計器で、通常は電圧端子と電流端子を回路に接続して使う。"],"https://www.youtube.com/watch?v=YZpNClkJFjw","クランプメーターの使い方・選び方：周波数特性による電流値の違い","",["x:elec3_23","クランプメータの正しい挟み方（電線1本）"]],["クランプメータの動作原理は、何と何を組み合わせたものか？","変流器と電流計","分圧器と電圧計","ホール素子と抵抗計","整流器とコンデンサ","クランプメータは、挟んだ電線を1次巻線とみなした変流器（CT）で、電流に比例した小さな2次電流を取り出し、それを電流計で測る。交流用は変流器方式、直流も測れるものはホール素子で磁界を検出する方式。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0077.html","テスタ・クランプメーター・検相器の種類と特長（MISUMI技術情報）",["分圧器と電圧計の組合せは高い電圧を測る方法で、電線を挟んで電流を測る原理ではない。","ホール素子は磁界の検出に使うが、組み合わせるのは抵抗計ではなく、直流電流の測定に使われる方式である。","整流器とコンデンサの組合せは交流を直流にする平滑回路で、電流測定の原理ではない。"],"https://www.youtube.com/watch?v=YZpNClkJFjw","クランプメーターの使い方・選び方：周波数特性による電流値の違い","",["x:elec3_24","変流器の構造（一次・二次コイルと鉄心）"]],["変流器の変流比kは、一次・二次の巻数n1・n2、電流I1・I2を使ってどう表されるか？","k ＝ I1/I2 ＝ n2/n1","k ＝ I1/I2 ＝ n1/n2","k ＝ I2/I1 ＝ n2/n1","k ＝ I1 × I2 ＝ n1 × n2","変流器では、1次・2次の電流比は巻数比の逆数になる（I1×n1＝I2×n2）。そのため変流比 k＝I1/I2＝n2/n1。2次巻数を多くすると、大きな1次電流を小さな2次電流に変換できる。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0077.html","テスタ・クランプメーター・検相器の種類と特長（MISUMI技術情報）",["I1/I2＝n1/n2とすると電流比と巻数比が比例関係になるが、変流器では電流比は巻数比の逆数になる。","I2/I1は変流比kの逆数であり、n2/n1と等しいとすると関係が逆になる。","電流や巻数を掛け合わせた量は比を表さず、I1×n1＝I2×n2という起磁力の関係とも合わない。"],"https://www.youtube.com/watch?v=YZpNClkJFjw","クランプメーターの使い方・選び方：周波数特性による電流値の違い","",["w:139_2","貫通形の変流器（黒いリング）と電流計の例",{"a":"Retired electrician","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Type_AD16-22_indicator_meter_with_stock_current_transformer_(2).jpg"}]],["騒音計で、同じ大きさに聞こえる音圧レベルを周波数ごとに表した曲線を何と呼ぶか？","等感曲線（等ラウドネス曲線）","周波数特性曲線","ローレンツ曲線","A特性曲線","等感曲線（等ラウドネス曲線）は、人の耳に同じ大きさに聞こえる音の音圧レベルを、周波数ごとに結んだ曲線。人の耳は低い音や非常に高い音に鈍感で、1〜4kHz付近に最も敏感。騒音計は、この特性に合わせた補正（A特性）をかけて測る。","https://svmeas.rion.co.jp/support/202603311318.html","騒音と騒音計：音についての基礎知識（リオン）",["周波数特性曲線は機器の出力や感度が周波数によってどう変わるかを表す一般的な曲線で、聴感の等しさを示すものではない。","ローレンツ曲線は所得分布の不平等さを表す経済学の曲線で、音とは関係ない。","A特性曲線は等感曲線をもとに騒音計に組み込んだ周波数補正の特性で、同じ大きさに聞こえる音圧を結んだ曲線そのものではない。"],"https://www.youtube.com/watch?v=rzCf2MLkGLk","騒音計の選び方・使い方を環境計量士が解説","",["w:147_1","等ラウドネス曲線：周波数ごとの同じ大きさの音圧",{"a":"derivative work: Nick84 (talk) Lindos1.svg: Lindosland","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Equal_loudness_no_caption.svg"}]],["実際の環境でマイコンの機能を代行し、リアルタイムにデバッグできるハードウェアデバッガは？","ICE（インサーキットエミュレータ）","JTAGデバッガ","ロジックアナライザ","シミュレータ","ICE（In-Circuit Emulator：インサーキットエミュレータ）は、ターゲット基板のマイコンの代わりに接続して、マイコンの動作を代行しながら、実際の回路上でリアルタイムにデバッグできる装置。ブレークポイントやトレースなど機能が強力。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["JTAGデバッガはマイコン内蔵のデバッグ機能をJTAG端子から操作する方式で、マイコンの機能を代行するものではない。","ロジックアナライザは多数のデジタル信号のタイミングを記録する測定器で、マイコンの代わりに動作はしない。","シミュレータはパソコン上のソフトウェアでマイコンの動作を模擬するもので、実際の回路上ではデバッグできない。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介",""],["ICEは強力なデバッグ性能とリアルタイム性があるが、何がネックか？","価格の高さ","動作の遅さ","接続できるピンの少なさ","消費電力の小ささ","ICEは、対象のマイコンに合わせた専用のハードウェアが必要で、非常に高価なのが最大の欠点。そのため近年は、マイコンに内蔵されたデバッグ機能をJTAGなどの端子から使う安価な方式が主流になっている。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["ICEは実際の回路上でリアルタイムに動作するのが長所で、動作が遅いことは欠点ではない。","ICEはマイコンの代わりにすべての端子へ接続して動作するため、接続ピンの少なさは問題にならない。","消費電力が小さいことは欠点ではなく、ICEのネックとしては当てはまらない。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介",""],["JTAGデバッグは安価だが、どんなネックがあるか？","時間がかかる","価格が高い","ターゲットが必要ない","書き込みができない","JTAGデバッグは、マイコンに内蔵されたデバッグ機能を、JTAG端子からシリアル通信で操作する方式。安価な機器でデバッグできるが、シリアルでデータをやり取りするため、ICEに比べて処理に時間がかかり、リアルタイムに追跡できる情報も限られる。","https://e-words.jp/w/ICE.html","ICE（インサーキットエミュレータ）とは（IT用語辞典 e-Words）",["JTAGデバッグはマイコン内蔵の機能を使うため安価なのが長所で、価格の高さはICEのネックである。","JTAGデバッグはターゲットのマイコンに内蔵されたデバッグ機能を使うため、ターゲットは必ず必要である。","JTAG端子からはプログラムの書き込みも行えるので、書き込みができないということはない。"],"https://www.youtube.com/watch?v=uqArpTuRUsY","JTAG ICEデバッグツールを使用したRA6M5のデバッグのご紹介",""],["デジタル信号の時間的変化を多チャンネルで計測する測定器は？","ロジックアナライザ","オシロスコープ","スペクトラムアナライザ","ロジックチェッカ","ロジックアナライザは、多数（数十本など）のデジタル信号のH/Lの変化を同時に記録し、タイミング図として表示する測定器。通信のプロトコル解析や、複数の信号のタイミング確認に使う。電圧波形を詳しく見るのはオシロスコープ。","https://monoist.itmedia.co.jp/mn/articles/1006/24/news100.html","ロジアナとMSO、違いと使い分け（MONOist）",["オシロスコープは電圧波形を詳しく観測する測定器で、チャンネル数は2〜4程度と少なく多チャンネルの論理解析には向かない。","スペクトラムアナライザは信号をどの周波数成分が含まれるかで表示する測定器で、時間変化を見るものではない。","ロジックチェッカは1点のH/Lをランプで示す簡易測定器で、時間変化を多チャンネルで記録できない。"],"https://www.youtube.com/watch?v=vIF2dM4OS9o","ロジックアナライザの使い方徹底解説！オシロスコープとの違いとは？","",["w:168_1","ロジックアナライザの外観",{"a":"Vonvon","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Tektronix_LogicAnalyzer_TLA5204.jpg"}]],["バリアフリーとユニバーサルデザインは、それぞれどんな人を対象としているか？","バリアフリー＝高齢者や障害者、ユニバーサルデザイン＝すべての人","バリアフリー＝すべての人、ユニバーサルデザイン＝高齢者や障害者","どちらも高齢者のみ","どちらも子どものみ","バリアフリーは、高齢者や障害者が生活するうえでの障壁（段差など）を取り除くという考え方。ユニバーサルデザインは、年齢・能力・国籍などに関係なく、最初からすべての人が使いやすいように設計するという考え方。","https://wa3.i-3-i.info/diff431design.html","バリアフリーデザインとユニバーサルデザインの違い（分かりそうで分からないIT用語辞典）",["対象が逆で、すべての人を対象とするのがユニバーサルデザイン、高齢者や障害者の障壁を除くのがバリアフリーである。","バリアフリーは高齢者だけでなく障害者も対象とし、ユニバーサルデザインはすべての人を対象とする。","どちらも子どもに限った考え方ではなく、バリアフリーは高齢者や障害者、ユニバーサルデザインはすべての人が対象である。"],"https://www.youtube.com/watch?v=om6868pLNpk","ユニバーサルデザインとバリアフリーの違いって何？",""],["液晶を用いた表示装置を何というか？","LCD","LED","OLED","CRT","LCD（Liquid Crystal Display：液晶ディスプレイ）は、液晶分子の向きを電圧で変えて、バックライトの光を通したり遮ったりして表示する装置。薄型で消費電力が小さい。自ら発光するLED（有機EL）とは仕組みが違う。","http://www.sharp.co.jp/products/lcd/tech/index2.html","液晶ディスプレイの原理と技術（シャープ）",["LEDは電流を流すと自ら発光する半導体素子（発光ダイオード）で、液晶は使わない。","OLEDは有機ELのことで、有機材料が自発光する表示装置であり液晶は使わない。","CRTはブラウン管のことで、電子ビームを蛍光面に当てて発光させる表示装置である。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～",""],["パソコンや携帯電話で使われる、表示を維持するために電圧をかけ続ける必要がある液晶は？","ネマティック液晶","コレステリック液晶","スメクティック液晶","強誘電性液晶","ネマティック液晶は、細長い分子が同じ向きにそろって並ぶ液晶。電圧をかけると分子の向きが変わるが、電圧を切ると元に戻るため、表示を保つには電圧をかけ続ける必要がある。TN方式やIPS方式など、一般的な液晶ディスプレイに使われる。","http://www.sharp.co.jp/products/lcd/tech/index2.html","液晶ディスプレイの原理と技術（シャープ）",["コレステリック液晶はらせん状の分子配列によるメモリ性があり、電圧を切っても表示を維持できる。","スメクティック液晶は分子が層状に並ぶ液晶で、パソコンや携帯電話の一般的な表示には使われていない。","強誘電性液晶は自発分極をもち高速応答やメモリ性がある液晶で、一般的なパソコンや携帯電話の表示には使われていない。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～",""],["分子をねじれたらせん状に並べ、電圧を加えなくても表示を維持できる液晶は？","コレステリック液晶","ネマティック液晶","TN液晶","IPS液晶","コレステリック液晶は、分子の層がらせん状にねじれて並ぶ液晶。電圧を切っても表示状態を保つメモリ性があるため、書き換え時だけ電力を使う。電子ペーパーや電子棚札などに使われる。","http://www.sharp.co.jp/products/lcd/tech/index2.html","液晶ディスプレイの原理と技術（シャープ）",["ネマティック液晶は電圧を切ると分子の向きが元に戻るため、表示を保つには電圧をかけ続ける必要がある。","TN液晶はネマティック液晶をねじれた配向で使う方式で、電圧を切ると表示が戻りメモリ性はない。","IPS液晶はネマティック液晶を横方向の電界で動かす方式で、視野角は広いが表示維持には電圧が必要である。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～",""],["人間の可聴範囲は？","20Hz〜20kHz","2Hz〜2kHz","200Hz〜200kHz","20kHz〜200kHz","人間の耳が聞き取れる音（可聴音）の周波数はおよそ20Hz〜20kHz。20kHzより高い音を超音波、20Hzより低い音を超低周波音という。年齢とともに高い音が聞こえにくくなる。","https://www.audio-technica.co.jp/always-listening/articles/speaker-unit-01/","スピーカーユニットについてもっと知ろう（オーディオテクニカ）",["2Hz〜2kHzは下限・上限ともに1桁低く、2kHzより高い音も実際には聞こえる。","200Hz〜200kHzは下限・上限ともに1桁高く、20kHzを超える範囲は超音波である。","20kHz〜200kHzは超音波の領域で、人間の耳には聞こえない。"],"https://www.youtube.com/watch?v=f3vwkOO8sOk","[スピーカー] オーディオ装置の仕組み【マイク】",""],["磁界中のコイルに音声電流を流し、フレミングの左手の法則でコーンを振動させるスピーカは？","ダイナミックスピーカ","圧電スピーカ","静電型スピーカ","ホーンスピーカ","ダイナミックスピーカは、永久磁石の磁界の中に置いたボイスコイルに音声信号の電流を流し、フレミングの左手の法則で生じる力でコイルとつながったコーン紙を振動させて音を出す。最も一般的なスピーカ方式。","https://www.audio-technica.co.jp/always-listening/articles/speaker-unit-01/","スピーカーユニットについてもっと知ろう（オーディオテクニカ）",["圧電スピーカは圧電素子に電圧をかけたときの変形を利用して音を出す方式で、磁界中のコイルは使わない。","静電型スピーカは電極間の静電気力で薄い膜を振動させる方式で、フレミングの左手の法則によるものではない。","ホーンスピーカはラッパ状のホーンで音を効率よく放射する構造に着目した呼び名で、駆動原理の名称ではない。"],"https://www.youtube.com/watch?v=f3vwkOO8sOk","[スピーカー] オーディオ装置の仕組み【マイク】","",["x:elec3_36","フレミングの左手の法則（磁界・電流・力）"]],["タッチパネルで、静電容量方式が抵抗膜方式に比べて実現できるようになったことは？","マルチタッチ","手袋での操作","ペン入力","低コスト化","静電容量方式のタッチパネルは、指が触れたことで生じる電極間の静電容量の変化を検出する。複数の点を同時に検出できる（マルチタッチ）ので、ピンチ操作などができる。抵抗膜方式は押した圧力で検出し、基本的に1点しか検出できない。","https://www.eizo.co.jp/eizolibrary/other/itmedia02_08/","「タッチパネル」の基礎知識（EIZO）",["静電容量方式は指による静電容量の変化を検出するため、一般の手袋では反応しにくく、手袋での操作が得意なのは抵抗膜方式である。","ペン入力は押した圧力で検出する抵抗膜方式でも以前から可能で、静電容量方式で新たに実現したことではない。","静電容量方式は構造が複雑で、抵抗膜方式より一般にコストが高い。"],"https://www.youtube.com/watch?v=t2YJd803W88","タッチパネルはなぜ触って操作できるのか？【静電容量方式】",""],["DCモータの大きな2種類の組合せは？","電磁石形、永久磁石形","誘導形、同期形","かご形、巻線形","PM形、VR形","DCモータは、界磁（磁界を作る部分）に電磁石（界磁巻線）を使う電磁石形と、永久磁石を使う永久磁石形に大きく分けられる。小型のモータは永久磁石形が多く、大型では電磁石形も使われる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/sp-list/bl-fundamental/1-1","DCモーターの構造（オリエンタルモーター）",["誘導形と同期形はACモータの分類で、DCモータの分類ではない。","かご形と巻線形は誘導モータの回転子構造による分類である。","PM形とVR形はステッピングモータの分類（永久磁石形、可変リラクタンス形）である。"],"https://www.youtube.com/watch?v=Jb5rq3H5uoc","直流モーターって何？仕組みと回転原理を詳しく解説","",["x:elec3_38","モータの分類（DC・AC・ステッピング）"]],["ACモータの大きな3種類の組合せは？","誘導モータ、同期モータ、整流子モータ","ブラシモータ、ブラシレスモータ、ステッピングモータ","かご形、巻線形、PM形","直巻、分巻、複巻","ACモータは、回転磁界に誘導されて回る誘導モータ、回転磁界と同じ速度（同期速度）で回る同期モータ、整流子とブラシを使い交流でも直流でも回せる整流子モータ（掃除機などのユニバーサルモータ）の3つに大別される。","https://techweb.rohm.co.jp/product/motor/motor-driver/motor-driver-basic/18980/","モーターの種類と分類（ROHM TechWeb）",["ブラシモータとブラシレスモータは主にDCモータ側の分類で、ステッピングモータはパルスで動かすモータであり、ACモータの3分類ではない。","かご形と巻線形は誘導モータの回転子の分類、PM形はステッピングモータの分類で、ACモータの大分類ではない。","直巻・分巻・複巻はDCモータの界磁巻線と電機子のつなぎ方による分類である。"],"https://www.youtube.com/watch?v=gmXSE6JlBdI","ブラシレスモーターはDC？AC？歴史的な背景と原理から解説","",["w:202_1","誘導モータのかご形回転子の構造",{"a":"en:User:Meggar","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Squirrel_cage.jpg"}]],["DCモータで、回転するコイルに電流の向きを切り替えて流すための部品は？","整流子","界磁巻線","ステータ","ヨーク","整流子は、DCモータの回転子に取り付けた、分割された円筒状の電極。固定されたブラシと接触しながら回転し、コイルが半回転するごとに電流の向きを切り替えて、同じ向きに回り続けられるようにする。","https://www.orientalmotor.co.jp/ja/tech/e-learning/sp-list/bl-fundamental/1-1","DCモーターの構造（オリエンタルモーター）",["界磁巻線は磁界を作る電磁石の巻線で、電流の向きを切り替える部品ではない。","ステータ（固定子）はモータの固定側の部分で、回転するコイルの電流を切り替えない。","ヨークは磁気回路を形成するモータの外枠の鉄部分で、電流を切り替える働きはない。"],"https://www.youtube.com/watch?v=Jb5rq3H5uoc","直流モーターって何？仕組みと回転原理を詳しく解説","",["x:elec3_40","DCモータの原理（整流子とブラシ）"]],["DCモータで、半回転ごとに電流の向きが切り替わる回転側のコイルを何というか？","電機子","界磁","整流子","固定子","電機子（アーマチュア）は、DCモータで回転する側のコイル（巻線）と鉄心のこと。整流子を通して電流が流れ、界磁の磁界との間で力が生じて回転する。発電機では電機子に起電力が生じる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/sp-list/bl-fundamental/1-1","DCモーターの構造（オリエンタルモーター）",["界磁は磁界を作る部分で、DCモータでは通常固定側にあり、回転するコイルではない。","整流子はコイルの電流の向きを切り替える部品であり、切り替えられるコイルそのものではない。","固定子は回転しない側の部分で、回転するコイルを指す用語ではない。"],"https://www.youtube.com/watch?v=Jb5rq3H5uoc","直流モーターって何？仕組みと回転原理を詳しく解説",""],["DCモータで磁石の代わりに電磁石を用いた場合の、電磁石の巻線を何というか？","界磁巻線","電機子巻線","補極巻線","制動巻線","界磁巻線は、DCモータで永久磁石の代わりに磁界を作る電磁石の巻線。界磁巻線と電機子のつなぎ方によって、直巻、分巻、複巻、他励などの種類がある。界磁電流を変えると速度を制御できる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/sp-list/bl-fundamental/1-1","DCモーターの構造（オリエンタルモーター）",["電機子巻線は回転子側の巻線で、整流子を通して電流が流れトルクを生む部分である。","補極巻線は整流時の火花を抑えるために主極の間に置く補助の巻線である。","制動巻線は同期機の回転子に設け、乱調を抑える目的の巻線である。"],"https://www.youtube.com/watch?v=Jb5rq3H5uoc","直流モーターって何？仕組みと回転原理を詳しく解説","",["x:elec3_42","DCモータの界磁巻線の接続方式"]],["フィードバック制御の3つの方式の組合せは？","P制御、PI制御、PID制御","オン/オフ制御、シーケンス制御、ファジィ制御","開ループ制御、閉ループ制御、フィードフォワード制御","位置制御、速度制御、トルク制御","フィードバック制御の代表的な方式は、比例動作だけのP制御、比例と積分を組み合わせたPI制御、さらに微分を加えたPID制御。目的や対象に合わせて選ぶ。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/pid-control-program-implementation.jsp","PID制御のソフトウェア実装（キーエンス）",["オン/オフ制御はフィードバックの一種だが、シーケンス制御は順序制御、ファジィ制御は別の手法で、3方式の組合せにならない。","開ループ制御やフィードフォワード制御はフィードバックを使わない制御で、閉ループ制御はフィードバック制御そのものの別名である。","位置制御・速度制御・トルク制御は制御する量による分類で、フィードバック制御の方式ではない。"],"https://www.youtube.com/watch?v=xdTuNJj-fRg","【わかりすぎる】PID制御の基礎",""],["P制御（比例制御）だけの場合に生じる問題は？","定常偏差（オフセット）が生じること","発振しやすくなること","応答が全く遅れないこと","目標値を必ず超えること","P制御（比例制御）は、偏差に比例した操作量を出す。偏差が小さくなるほど操作量も小さくなり、外乱などとつり合ったところで止まってしまうため、目標値との間にわずかな差（定常偏差、オフセット）が残る。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/pid-control-program-implementation.jsp","PID制御のソフトウェア実装（キーエンス）",["発振しやすくなるのはゲインを上げすぎた場合や微分・積分の調整不良などで、P制御固有の残る問題ではない。","応答が全く遅れないことは問題ではなく、実際の制御系では応答の遅れは避けられない。","目標値を超えるオーバーシュートは条件次第で起こるが、P制御で必ず生じるわけではない。"],"https://www.youtube.com/watch?v=xdTuNJj-fRg","【わかりすぎる】PID制御の基礎","",["x:elec3_44","P・PI・PID制御の応答の違い（模式図）"]],["PI制御（比例積分制御）では、P制御に比べて何をゼロにできるか？","定常偏差","応答時間","オーバーシュート","ゲイン","PI制御は、P制御に積分動作を加えたもの。偏差が残っている限り積分値が増え続けて操作量を大きくするので、最終的に定常偏差をゼロにできる。ただし積分が強すぎると、行き過ぎや振動が起きやすくなる。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/pid-control-program-implementation.jsp","PID制御のソフトウェア実装（キーエンス）",["応答時間は積分動作を加えても短くなるとは限らず、ゼロにできる量ではない。","積分動作は行き過ぎを生じやすくするため、PI制御でオーバーシュートがゼロになるわけではない。","ゲインは制御器の調整パラメータで、偏差のようにゼロにする対象ではない。"],"https://www.youtube.com/watch?v=xdTuNJj-fRg","【わかりすぎる】PID制御の基礎",""],["PID制御では、P制御やPI制御と比べて何が可能になるか？","なめらかな（速く安定した）出力","定常偏差の発生","センサの省略","フィードバックの不要化","PID制御は、PI制御にさらに微分動作を加えたもの。偏差の変化の速さに応じて先回りして操作するため、応答を速くしつつ行き過ぎ（オーバーシュート）や振動を抑え、なめらかに目標値に収束させられる。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/pid-control-program-implementation.jsp","PID制御のソフトウェア実装（キーエンス）",["定常偏差の発生はP制御だけの場合の問題点で、PID制御で可能になる利点ではない。","PID制御も制御量をセンサで測って偏差を求める必要があり、センサは省略できない。","PID制御はフィードバック制御の方式そのものであり、フィードバックが不要になることはない。"],"https://www.youtube.com/watch?v=xdTuNJj-fRg","【わかりすぎる】PID制御の基礎","",["x:elec3_44","PID制御は速く安定して目標値に到達する"]],["外部から電気パルスを与えると、そのパルス数に比例した角度だけ回転するモータは？","ステッピングモータ","サーボモータ","誘導モータ","DCブラシモータ","ステッピングモータは、パルス信号を1つ与えるごとに一定角度（ステップ角）だけ回るモータ。パルスの数で回転角、パルスの周波数で回転速度が決まるので、センサなしのオープンループで位置決めができる。負荷が大きすぎると脱調する。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["サーボモータはエンコーダなどで位置を検出しながらフィードバック制御で動かすモータで、パルス数だけで角度が決まるわけではない。","誘導モータは回転磁界に誘導されて連続回転するモータで、パルスで一定角度ずつ回るものではない。","DCブラシモータは電圧を加えると連続回転するモータで、回転角はパルス数に比例しない。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）","",["x:elec3_47","ステッピングモータの構造"]],["ステッピングモータの3種類の組合せは？","PM形、VR形、HB形","かご形、巻線形、同期形","直巻、分巻、複巻","ブラシ形、ブラシレス形、リニア形","ステッピングモータには、回転子に永久磁石を使うPM形、歯車状の鉄心を使い磁気抵抗の変化で回るVR形（可変リラクタンス形）、両者を組み合わせて分解能とトルクを両立したHB形（ハイブリッド形）がある。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["かご形・巻線形は誘導モータの回転子の分類、同期形はACモータの種類で、ステッピングモータの分類ではない。","直巻・分巻・複巻はDCモータの界磁巻線のつなぎ方による分類である。","ブラシ形・ブラシレス形は主にDCモータの分類、リニア形は直線運動をする形状の分類で、ステッピングモータの3種類ではない。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）","",["x:elec3_48","ステッピングモータのPM形・VR形・HB形"]],["ステッピングモータの1パルスあたりの回転角を何というか？","ステップ角","位相角","内部相差角","ねじれ角","ステップ角は、ステッピングモータに1パルス与えたときに回転する角度。1.8°（1回転200パルス）や0.9°などが一般的。小さいほど細かい位置決めができる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["位相角は交流の電圧や電流の波形のずれを表す角度で、モータの1パルスの回転量ではない。","内部相差角は同期電動機で負荷により回転子磁極が回転磁界から遅れる角度である。","ねじれ角は軸のねじれやねじ・歯車の傾きなどを表す角度で、パルスあたりの回転角ではない。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）","",["w:204_0","ステッピングモータの内部：固定子の磁極と歯付き回転子",{"a":"Carmelo 1955","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Motore_a_riluttanza_magnetica_variabile.gif"}]],["24パルスで1回転するステッピングモータのステップ角は？","15°","24°","7.5°","30°","ステップ角＝360°÷1回転に必要なパルス数。24パルスで1回転なら360÷24＝15°。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["24°はパルス数をそのまま角度とした誤りで、360°をパルス数で割っていない。","7.5°は48パルスで1回転する場合のステップ角である。","30°は12パルスで1回転する場合のステップ角である。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）","",["w:204_0","ステッピングモータの内部構造（固定子の磁極と歯付き回転子）",{"a":"Carmelo 1955","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Motore_a_riluttanza_magnetica_variabile.gif"}]],["固定子の相数が3、回転子の歯数が4のステッピングモータのステップ角は？","30°","90°","120°","7.5°","VR形などのステッピングモータでは、ステップ角＝360°÷(相数×回転子の歯数)。3相・4歯なら360÷(3×4)＝30°。歯数や相数を増やすとステップ角は小さくなる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["90°は360°を回転子の歯数4だけで割った値で、相数3を掛けていない。","120°は360°を相数3だけで割った値で、回転子の歯数4を考慮していない。","7.5°は360°を48で割った値で、相数×歯数の12とは合わない。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）","",["w:215_0","VR形ステッピングモータ（固定子6極・3相、回転子4歯）",{"a":"Carmelo 1955","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Motore_a_riluttanza_magnetica_variabile.gif"}]],["常に固定子巻線の1相だけに電流を流す励磁法と、2相に流す励磁法をそれぞれ何というか？","1相励磁、2相励磁","単相励磁、三相励磁","全ステップ、マイクロステップ","ユニポーラ、バイポーラ","1相励磁は常に1つの相だけに電流を流す方式で、消費電力は小さいがトルクも小さい。2相励磁は常に2つの相に電流を流す方式で、トルクが大きく振動も少ない。両者を交互に行う1-2相励磁では、ステップ角を半分にできる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["単相・三相は交流電源の相の数を表す用語で、ステッピングモータで同時に通電する相数の呼び名ではない。","全ステップ・マイクロステップは1パルスで進む角度の細かさによる駆動法の区別で、通電する相数の呼び名ではない。","ユニポーラ・バイポーラは巻線に流す電流の向きを一方向にするか両方向にするかによる駆動方式の区別である。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）","",["x:elec3_52","1相励磁と2相励磁の回転子の動き"]],["負荷に摩擦や慣性がないとき、ステッピングモータが瞬時に起動・停止できる最大のパルス速度を何というか？","最大自起動周波数","最大応答周波数","脱調周波数","共振周波数","最大自起動周波数は、負荷の摩擦や慣性がない状態で、ステッピングモータが脱調せずに瞬時に起動・停止できるパルス速度の最大値。これより速いパルスで起動したい場合は、ゆっくり加速（スローアップ）させる必要がある。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["最大応答周波数は、起動後に徐々に加速した状態で脱調せずに追従できる最大のパルス速度で、瞬時の起動・停止の限界ではない。","パルスが速すぎるなどで同期が外れる現象を脱調といい、瞬時に起動できる最大速度を表す正式な呼び名ではない。","共振周波数はモータと負荷の固有振動数に一致して振動が大きくなる周波数で、脱調の原因になりやすい。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）",""],["三相誘導電動機の2種類の形は？","かご形、巻線形","PM形、VR形","直巻形、分巻形","同期形、整流子形","三相誘導電動機は、回転子の構造でかご形と巻線形に分けられる。かご形は回転子が導体棒をかご状につないだだけの簡単で丈夫な構造で、最も多く使われる。巻線形は回転子にも巻線があり、外部抵抗で始動特性や速度を調整できる。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["PM形・VR形はステッピングモータの回転子による分類である。","直巻形・分巻形はDCモータの界磁巻線のつなぎ方による分類である。","同期形・整流子形はACモータの種類で、誘導電動機の中の分類ではない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["x:elec3_54","かご形誘導電動機の固定子と回転子"]],["誘導電動機の基本原理は何か？","アラゴの円板","フレミングの右手の法則","ホール効果","ペルチェ効果","アラゴの円板は、磁石を円板に沿って回すと、円板に渦電流が流れて磁石を追いかけるように回る現象。誘導電動機は、三相交流で回転磁界を作り、回転子に誘導された電流との間の力で回る。これがアラゴの円板と同じ原理。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["フレミングの右手の法則は磁界中で導体が動くときの起電力の向きを示す法則で、主に発電機の原理である。","ホール効果は電流が流れる半導体に磁界をかけると電圧が生じる現象で、磁気センサに使われる。","ペルチェ効果は異種金属の接合部に電流を流すと吸熱・発熱が起こる現象で、電子冷却に使われる。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["x:elec3_55","アラゴの円板（誘導電動機の原理）"]],["三相誘導電動機で、電源周波数f、極数pのとき回転磁界の速度（同期速度）は？","120f/p [min⁻¹]","60f/p [min⁻¹]","120p/f [min⁻¹]","2πf/p [min⁻¹]","三相誘導電動機の回転磁界の速度（同期速度）Ns＝120f/p[min⁻¹]。50Hzでは2極3000、4極1500、6極1000min⁻¹。極数を増やすと同期速度は下がる。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["60f/pはpを極対数（極数の半分）としたときの式で、極数pを使う場合は120f/pとなる。","120p/fは極数と周波数の位置が逆で、極数を増やすと速度が上がる誤った式になる。","2πf/pは角速度（rad/s）を表す形の式で、単位min⁻¹の回転速度にはならない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["w:191_0","三相交流電流と3つのコイルが作る合成磁界",{"a":"Oliver Wallscheid","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Rotating_magnetic_field_via_a_three-phase_winding.gif"}]],["誘導電動機の回転速度は、極数p、すべりs、周波数fを用いてどう表されるか？","120f(1−s)/p","120f(1+s)/p","120fs/p","120f/(ps)","誘導電動機の回転速度N＝Ns(1−s)＝120f(1−s)/p。すべりsの分だけ同期速度より遅く回る。速度を変えるには、周波数f、極数p、すべりsのいずれかを変えればよい。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["1+sとすると同期速度より速く回ることになるが、電動機はすべりの分だけ同期速度より遅く回る。","120fs/pは同期速度と回転速度の差（すべり速度）を表し、回転速度そのものではない。","120f/(ps)はすべりで割っているため、sが小さいほど速度が無限に大きくなり不合理である。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["x:elec3_57","同期速度・回転速度・すべりの関係"]],["巻線形誘導電動機の速度制御方式の組合せは？","1次電圧制御、2次抵抗制御、2次電力回生、2次励磁","極数変換、1次周波数制御、スターデルタ、PWM","界磁制御、電機子電圧制御、直並列制御、チョッパ","1次周波数制御、極数変換","巻線形誘導電動機は、回転子の巻線にスリップリングを通して外部から手を加えられるため、1次電圧制御のほか、2次側に抵抗を入れてすべりを変える2次抵抗制御、2次側の電力を電源に戻す2次電力回生、2次側に電圧を加える2次励磁などで速度を制御できる。","https://www.jeea.or.jp/course/contents/09201/","誘導電動機の可変速制御（日本電気技術者協会）",["極数変換や1次周波数制御は主にかご形の速度制御法、スターデルタは始動法、PWMはインバータの変調方式である。","界磁制御・電機子電圧制御・直並列制御・チョッパ制御はDCモータの速度制御方式である。","1次周波数制御と極数変換はかご形誘導電動機で使われる方式で、巻線形特有の2次側の制御が含まれていない。"],"https://www.youtube.com/watch?v=j9HldzpXOFw","誘導機（７） －誘導電動機の速度制御","",["x:elec3_58","巻線形・かご形誘導電動機の速度制御方式"]],["かご形誘導電動機の速度制御方式の組合せは？","ECカップリング、1次電圧制御、1次周波数制御","2次抵抗制御、2次励磁、2次電力回生","界磁制御、電機子制御、ワードレオナード","ステップ角制御、マイクロステップ、2相励磁","かご形誘導電動機の速度制御には、渦電流を利用したECカップリング（電磁継手）、1次電圧制御、インバータによる1次周波数制御などがある。このほか極数変換も代表的な方法。現在の主流は1次周波数制御。","https://www.jeea.or.jp/course/contents/09201/","誘導電動機の可変速制御（日本電気技術者協会）",["2次抵抗制御・2次励磁・2次電力回生は回転子巻線に外部から手を加える方式で、巻線形誘導電動機の速度制御法である。","界磁制御・電機子制御・ワードレオナード方式はDCモータの速度制御方式である。","ステップ角制御・マイクロステップ・2相励磁はステッピングモータの駆動に関する用語である。"],"https://www.youtube.com/watch?v=j9HldzpXOFw","誘導機（７） －誘導電動機の速度制御",""],["電源周波数を変えて誘導電動機の速度を制御する、最も広く採用されている方式は？","1次周波数制御（インバータ制御）","2次抵抗制御","極数変換","1次電圧制御","1次周波数制御は、インバータで電源の周波数（と電圧）を変えて、同期速度そのものを変える方法。広い範囲で効率よく、なめらかに速度を変えられるため、現在最も広く使われている（V/f制御、ベクトル制御など）。","https://www.jeea.or.jp/course/contents/09201/","誘導電動機の可変速制御（日本電気技術者協会）",["2次抵抗制御は巻線形にしか使えず、抵抗での損失が大きいため最も広く採用されている方式ではない。","極数変換は極数を切り替える方式で、速度が段階的にしか変えられず、なめらかな制御はできない。","1次電圧制御は電圧を下げてすべりを変える方式で、速度の制御範囲が狭く効率も悪い。"],"https://www.youtube.com/watch?v=j9HldzpXOFw","誘導機（７） －誘導電動機の速度制御","",["x:elec3_60","電圧形インバータによる1次周波数制御回路"]],["誘導電動機の回転方向を逆にするにはどうすればよいか？","3本の電源線のうち2本を入れ替える","3本すべてを入れ替える","周波数を下げる","電圧を上げる","三相誘導電動機の回転方向は、回転磁界の向き（相順）で決まる。電源の3本の線のうち任意の2本を入れ替えると相順が逆になり、回転方向が反転する。3本すべてを入れ替えても相順は変わらない。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["3本すべてを順に入れ替えても相の回転順（相順）は変わらないため、回転方向は反転しない。","周波数を下げると同期速度が下がり回転が遅くなるだけで、回転方向は変わらない。","電圧を上げるとトルクが変わるだけで、回転磁界の向きは変わらない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["x:elec3_61","電源線2本の入替えによる正転・逆転"]],["極数2、周波数50Hzのとき、同期速度はいくらか？","3000 min⁻¹","1500 min⁻¹","6000 min⁻¹","1000 min⁻¹","同期速度Ns＝120f/p＝120×50÷2＝3000min⁻¹。2極モータは同期速度が最も速い。実際の回転速度は、すべりの分だけこれより少し遅くなる。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["1500min⁻¹は50Hzで4極のときの同期速度である。","6000min⁻¹は極数を1として120×50を計算した値で、2極で割っていない。","1000min⁻¹は50Hzで6極のときの同期速度である。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界",""],["モータの同期速度と回転速度との差を、同期速度で割った比を何と呼ぶか？","すべり","ステップ角","脱調率","変流比","すべりs＝(Ns−N)/Ns（Ns：同期速度、N：回転速度）。停止中はs＝1、同期速度で回るとs＝0。一般的な誘導電動機の定格運転時のすべりは数%程度。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["ステップ角はステッピングモータの1パルスあたりの回転角で、速度の比ではない。","脱調率という定まった用語はなく、脱調は同期が外れる現象を指す。","変流比は変流器の1次電流と2次電流の比で、モータの速度とは関係ない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["w:162_0","誘導電動機のトルク-すべり特性曲線",{"a":"不明","l":"CC BY-SA 2.5","u":"https://commons.wikimedia.org/wiki/File:Couple_glissement_MAs.svg"}]],["同期電動機で負荷がかかると、回転子の磁極軸が回転磁界から角度δだけ遅れる。このδを何と呼ぶか？","内部相差角（負荷角）","すべり","位相差","ステップ角","内部相差角（負荷角）δは、同期電動機で負荷がかかったとき、回転子の磁極が回転磁界から遅れる角度。同期電動機は速度が一定のまま、この角度を大きくすることでトルクを出す。δ＝90°付近で最大トルクになる。","https://www.nidec.com/jp/technology/motor/academic/016/","同期モータの構造と種類（ニデック）",["すべりは誘導電動機の同期速度と回転速度の差の比で、同期電動機は同期速度で回るためすべりはない。","位相差は2つの交流量の波形のずれを表す一般的な用語で、負荷による回転子磁極の遅れ角を特定する名称ではない。","ステップ角はステッピングモータの1パルスあたりの回転角である。"],"https://www.youtube.com/watch?v=-VGYsupzAj0","【電験三種：機械】同期電動機の構造","",["x:elec3_64","同期電動機の内部相差角δ"]],["同期電動機で内部相差角が大きくなりすぎ、同期速度で回れなくなる現象を何と呼ぶか？","脱調","すべり","共振","逆転","脱調は、負荷が大きすぎるなどで内部相差角が限界を超え、回転子が回転磁界についていけなくなって同期が外れる現象。同期電動機は停止したり振動したりする。ステッピングモータがパルスに追従できなくなる現象も脱調という。","https://www.nidec.com/jp/technology/motor/academic/016/","同期モータの構造と種類（ニデック）",["すべりは誘導電動機が同期速度より遅く回る割合で、同期電動機の同期外れを表す用語ではない。","共振は固有振動数と加振の周波数が一致して振動が大きくなる現象で、内部相差角の限界超えとは異なる。","逆転は回転方向が反対になることで、同期が外れて回れなくなる現象ではない。"],"https://www.youtube.com/watch?v=-VGYsupzAj0","【電験三種：機械】同期電動機の構造","",["x:elec3_64","内部相差角δが大きすぎると脱調する"]],["理想変圧器で、1次巻数N1・2次巻数N2のとき、電圧V1・V2と電流I1・I2の関係は？","V2/V1 ＝ I1/I2 ＝ N2/N1","V2/V1 ＝ I2/I1 ＝ N2/N1","V1/V2 ＝ I1/I2 ＝ N2/N1","V2/V1 ＝ I1/I2 ＝ N1/N2","理想変圧器では、電圧は巻数に比例し（V2/V1＝N2/N1）、電流は巻数に反比例する（I2/I1＝N1/N2）。まとめると V2/V1＝I1/I2＝N2/N1。電圧を上げると、その分電流は小さくなる。","https://jeea.or.jp/course/contents/07110/","変圧器の銘板に学ぶ（日本電気技術者協会）",["I2/I1＝N2/N1とすると電流が巻数に比例することになるが、電流は巻数に反比例する。","V1/V2＝N2/N1とすると電圧が巻数に反比例することになるが、電圧は巻数に比例する。","N1/N2とすると電圧も電流も巻数比の関係が逆になる。"],"https://www.youtube.com/watch?v=zA5aF0sI7lU","初心者向け電験三種・電力・変電・概要・変圧器","",["x:elec3_66","変圧器の基本構造（1次・2次巻線）"]],["理想変圧器の1次側に100V、2次側が200V、1次電流が10Aのとき、2次電流は何Aか？","5A","20A","10A","2A","理想変圧器では入力電力＝出力電力なので、V1×I1＝V2×I2。100V×10A＝200V×I2 より I2＝5A。電圧が2倍になれば、電流は1/2になる。","https://jeea.or.jp/course/contents/07110/","変圧器の銘板に学ぶ（日本電気技術者協会）",["20Aとすると出力が200V×20A＝4000Wとなり、入力1000Wより大きく電力保存に反する。","10Aのままだと出力が2000Wとなり、入力1000Wと等しくならない。","2Aでは出力が400Wとなり、理想変圧器の入力1000Wと合わない。"],"https://www.youtube.com/watch?v=zA5aF0sI7lU","初心者向け電験三種・電力・変電・概要・変圧器","",["w:214_0","変圧器の鉄心と巻線の配置（内鉄形・外鉄形）",{"a":"SpinningSpark","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Transformer_winding_formats.jpg"}]],["理想変圧器（変成器）の場合、入力と出力の電力の関係は？","入力 ＝ 出力","入力 ＞ 出力","入力 ＜ 出力","入力 ＝ 出力の2倍","理想変圧器は損失（鉄損・銅損）がないと仮定するので、1次側から入る電力と2次側から出る電力は等しい。実際の変圧器では損失があり、効率は大型で98〜99%程度。","https://jeea.or.jp/course/contents/07110/","変圧器の銘板に学ぶ（日本電気技術者協会）",["入力＞出力となるのは損失がある実際の変圧器の場合で、損失のない理想変圧器では等しい。","変圧器はエネルギーを生み出さないため、出力が入力を上回ることはない。","出力が入力の2倍になることはなく、電圧が2倍になれば電流が1/2になって電力は同じである。"],"https://www.youtube.com/watch?v=zA5aF0sI7lU","初心者向け電験三種・電力・変電・概要・変圧器","",["x:elec3_68","理想変圧器の入力電力P1と出力電力P2"]],["理想変圧器の2次側に1Ωの抵抗、1次側に100Vを印加し、負荷で100Wを消費した。1次電流と巻数比N1:N2は？","1A、10:1","10A、1:10","1A、1:10","100A、10:1","負荷で100Wを消費し、抵抗が1Ωなので、P＝V²/Rより2次電圧は10V。巻数比N1：N2＝V1：V2＝100：10＝10：1。理想変圧器なので1次側の電力も100Wで、1次電流＝100W÷100V＝1A。","https://jeea.or.jp/course/contents/07110/","変圧器の銘板に学ぶ（日本電気技術者協会）",["1次電流10Aでは入力が1000Wとなり負荷100Wと合わず、1:10は電圧を上げる巻数比である。","1次電流1Aは正しいが、1:10では2次電圧が1000Vとなり、1Ωで100Wにならない。","1次電流100Aでは入力が10000Wとなり、負荷の消費電力100Wと一致しない。"],"https://www.youtube.com/watch?v=zA5aF0sI7lU","初心者向け電験三種・電力・変電・概要・変圧器","",["x:elec3_68","理想変圧器ではP1＝P2（電力は保存）"]],["ゲート電流を一度流すと、内部のPNP形とNPN形のトランジスタ作用でゲート電流を取り去ってもオンが続く素子は？","サイリスタ","トライアック","MOSFET","IGBT","サイリスタは、内部がPNP形とNPN形のトランジスタを組み合わせた構造になっていて、ゲート電流で一度オンすると、互いのトランジスタが相手にベース電流を供給し合ってオンを保つ（ラッチする）。そのためゲート電流をなくしてもオンが続く。","https://faq.fa.omron.co.jp/tech/s/article/faq02153","サイリスタとトライアックの違い（オムロン FAQ）",["トライアックはサイリスタを逆並列にした構造の双方向素子で、交流の両方向を制御するものであり、問われている基本素子はサイリスタである。","MOSFETはゲート電圧で駆動し、ゲート電圧を取り去るとオフになるため、オン状態は保持されない。","IGBTはゲート電圧でオン・オフを制御でき、ゲート信号を取り去ればオフになるため自己保持しない。"],"https://www.youtube.com/watch?v=xUK2HsyQWD0","はじめてのサイリスタ/トライアック","",["x:elec3_70","サイリスタの構造と2トランジスタ等価回路"]],["サイリスタをターンオフさせるにはどうする必要があるか？","アノード電流を保持電流以下にするか、逆電圧を印加する","ゲートに逆電流を流すだけでよい","ゲート電流を増やす","カソードを開放する","サイリスタはゲートでオフにできない（GTOサイリスタを除く）。オフにするには、アノード電流を保持電流以下に減らすか、アノード-カソード間に逆電圧をかける必要がある。交流回路では電流が自然にゼロになる瞬間にオフになる。","https://faq.fa.omron.co.jp/tech/s/article/faq02153","サイリスタとトライアックの違い（オムロン FAQ）",["ゲートに逆電流を流してオフできるのはGTOサイリスタで、通常のサイリスタはゲートではオフにできない。","ゲート電流はターンオンのきっかけに使うもので、増やしてもオフにはならない。","カソード側を開放すれば結果的に電流は途切れるが、それはアノード電流をゼロにすることであり、素子のターンオフ条件として示されるものではない。"],"https://www.youtube.com/watch?v=xUK2HsyQWD0","はじめてのサイリスタ/トライアック","",["w:213_0","サイリスタのpnpn構造と2トランジスタ等価回路",{"a":"Nicolae Coman","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Schema_echivalent%C4%83_a_tiristorului.png"}]],["パワーMOSFETの電圧駆動・高速スイッチングの特長を活かし、オン抵抗の低減を図った素子は？","IGBT","サイリスタ","バイポーラトランジスタ","トライアック","IGBT（絶縁ゲートバイポーラトランジスタ）は、入力側にMOSFET、出力側にバイポーラトランジスタの構造をもつ素子。MOSFETのように電圧で駆動でき、バイポーラのようにオン時の電圧降下が小さいので、高電圧・大電流のインバータに広く使われる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/mosfet_igbt/igbt-002.html","MOSFETとIGBTの違い（東芝デバイス＆ストレージ）",["サイリスタはゲート電流で一度オンすると自己保持する素子で、ゲートでのオフや高速スイッチングはできない。","バイポーラトランジスタはベース電流で駆動する電流駆動素子で、電圧駆動のMOSFETの特長はもたない。","トライアックは交流の両方向を制御できる双方向サイリスタで、MOSFETの特長を活かした素子ではない。"],"https://www.youtube.com/watch?v=6dxSK_NCdpc","日本が誇るパワー半導体「IGBT」とは何？","",["x:elec3_72","IGBTの構造・等価回路・図記号"]],["直流電力を交流電力に変換する回路を何というか？","インバータ回路","コンバータ回路","チョッパ回路","整流回路","インバータ回路は、直流を交流に変換する回路（逆変換）。スイッチング素子を高速にオン・オフして、周波数と電圧を自由に変えた交流を作れる。モータの速度制御、エアコン、太陽光発電のパワーコンディショナなどに使われる。交流を直流にするのはコンバータ（整流回路）。","https://jeea.or.jp/course/contents/12120/","電力変換装置 インバータ・コンバータ・直流チョッパ（日本電気技術者協会）",["コンバータ回路は一般に交流を直流に変換する回路（順変換）を指し、変換の向きが逆である。","チョッパ回路は直流を別の大きさの直流に変換する回路で、交流は作らない。","整流回路はダイオードなどで交流を直流に変える回路で、インバータとは変換の向きが逆である。"],"https://www.youtube.com/watch?v=XAZpYW1MmMs","初心者でもわかる！インバータって何？～実際の例で解説～","",["x:elec3_73","単相電圧形インバータ回路"]],["直流電圧を別の値の直流電圧に変換する回路を何というか？","チョッパ回路","インバータ回路","整流回路","サイクロコンバータ","チョッパ回路は、スイッチング素子で直流を高速にオン・オフ（チョップ）し、オンの時間の割合を変えることで、別の大きさの直流電圧を作る回路（DC-DCコンバータ）。電圧を下げる降圧チョッパと、上げる昇圧チョッパがある。","https://jeea.or.jp/course/contents/12120/","電力変換装置 インバータ・コンバータ・直流チョッパ（日本電気技術者協会）",["インバータ回路は直流を交流に変換する回路で、出力は直流ではない。","整流回路は交流を直流に変換する回路で、入力は直流ではない。","サイクロコンバータは交流を直流を介さずに別の周波数の交流へ直接変換する回路である。"],"https://www.youtube.com/watch?v=XAZpYW1MmMs","初心者でもわかる！インバータって何？～実際の例で解説～","",["x:elec3_74","降圧チョッパ回路と動作波形"]],["機械的位置や速度を制御するための自動制御系を何というか？","サーボ機構","シーケンス制御","プロセス制御","オンオフ制御","サーボ機構は、物体の位置・方位・姿勢などを制御量として、目標値の変化に追従させるフィードバック制御系。工作機械やロボットの軸、レーダーのアンテナ駆動などに使われる。温度や圧力を一定に保つプロセス制御とは対象が異なる。","https://www.fa.omron.co.jp/product/special/library/robotics/servomotor/","サーボモータとは？メリットと活用のポイント（オムロン）",["シーケンス制御はあらかじめ決めた順序に従って各段階を進める制御で、位置や速度を目標値に追従させるものではない。","プロセス制御は温度・圧力・流量など工業プロセスの状態量を制御するもので、機械的位置が対象ではない。","オンオフ制御は操作量を入と切の2値で切り替える単純な制御方式で、制御対象の分類ではない。"],"https://www.youtube.com/watch?v=6vuWHJlgP_4","サーボモーターとは",""],["指令パルスとフィードバックパルスの差を数え、サーボモータの操作量にするカウンタを何というか？","偏差カウンタ","ジョンソンカウンタ","プリスケーラ","リングカウンタ","偏差カウンタは、位置決め用のサーボアンプで、上位から送られた指令パルスの数と、エンコーダから戻ってきたフィードバックパルスの数の差（溜まりパルス）を数えるカウンタ。この差がゼロになるようにモータを動かす。","https://www.fa.omron.co.jp/product/special/library/robotics/servomotor/","サーボモータとは？メリットと活用のポイント（オムロン）",["ジョンソンカウンタはシフトレジスタの出力を反転して戻す構成のカウンタで、パルスの差を数える用途ではない。","プリスケーラは入力パルスを一定の比率で分周する回路で、指令とフィードバックの差は数えない。","リングカウンタは1つの1をシフトレジスタ内で循環させるカウンタで、偏差を数える用途ではない。"],"https://www.youtube.com/watch?v=6vuWHJlgP_4","サーボモーターとは","",["x:elec3_76","偏差カウンタとF/V変換を含むサーボ機構"]],["周波数に応じた電圧信号に変換することを何というか？","F/V変換","V/F変換","A/D変換","D/A変換","F/V変換（周波数-電圧変換）は、入力信号の周波数に比例した電圧を出力する変換。回転センサのパルス周波数を回転速度に比例した電圧に変えるときなどに使う。逆に電圧を周波数に変えるのはV/F変換。","https://www.keyence.co.jp/ss/products/recorder/lab/pulse/mechanism.jsp","パルス計測の仕組み（キーエンス）",["V/F変換は電圧を周波数に変換するもので、変換の向きが逆である。","A/D変換はアナログ値をデジタル値に変換するもので、周波数から電圧への変換ではない。","D/A変換はデジタル値をアナログ電圧に変換するもので、入力は周波数ではない。"],"https://www.youtube.com/watch?v=JVVWeh8vk0g","インバータを速攻理解！仕組みやPWM制御を図解で解説",""],["電力用半導体素子の損失3種類の組合せは？","定常損失、ターンオン損失、ターンオフ損失","鉄損、銅損、機械損","抵抗損、誘電体損、シース損","ヒステリシス損、渦電流損、漂遊損","電力用半導体素子の損失には、オンして電流が流れている間の電圧降下による定常損失（導通損失）と、オン・オフが切り替わる瞬間に電圧と電流が重なって生じるスイッチング損失（ターンオン損失、ターンオフ損失）がある。スイッチング周波数が高いほどスイッチング損失は増える。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/common/how-to-calculate-the-junction-temperature-when-the-power.html","損失発生時の接合温度の計算方法（東芝デバイス＆ストレージ）",["鉄損・銅損・機械損は変圧器や回転機で生じる損失で、半導体素子の損失ではない。","抵抗損・誘電体損・シース損は電力ケーブルの温度上昇を引き起こす損失である。","ヒステリシス損と渦電流損は鉄心で生じる鉄損、漂遊損は回転機などの付加的な損失で、半導体素子の損失ではない。"],"https://www.youtube.com/watch?v=T9xhm4E1bkE","「熱抵抗とは」その測定原理も説明（はじめてのパワーMOSFETシリーズ）",""],["温度差を通過する熱量で割って得られる、熱の通りにくさを表すものは？","熱抵抗","熱伝導率","比熱","熱容量","熱抵抗は、熱の伝わりにくさを表す値で、熱抵抗＝温度差÷通過する熱量（単位℃/W、K/W）。値が小さいほど熱を逃がしやすい。素子の発熱量×熱抵抗で、どれだけ温度が上がるかを見積もれる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/common/how-to-calculate-the-junction-temperature-when-the-power.html","損失発生時の接合温度の計算方法（東芝デバイス＆ストレージ）",["熱伝導率は物質固有の熱の伝わりやすさを表す値（W/(m・K)）で、大きいほど熱を通しやすい。","比熱は物質1kgの温度を1K上げるのに必要な熱量で、熱の通りにくさではない。","熱容量は物体全体の温度を1K上げるのに必要な熱量で、温度差を熱量で割った値ではない。"],"https://www.youtube.com/watch?v=T9xhm4E1bkE","「熱抵抗とは」その測定原理も説明（はじめてのパワーMOSFETシリーズ）",""],["放熱器は何と呼ばれるか？","ヒートシンク","ヒートパイプ","ペルチェ素子","サーマルパッド","ヒートシンク（放熱器）は、フィンなどで表面積を大きくした金属部品で、半導体素子などの熱を空気中に逃がす。アルミニウム製が多い。素子との間に放熱グリスなどを塗って熱抵抗を下げる。","https://toshiba.semicon-storage.com/jp/semiconductor/knowledge/faq/common/how-to-calculate-the-junction-temperature-when-the-power.html","損失発生時の接合温度の計算方法（東芝デバイス＆ストレージ）",["ヒートパイプは内部の作動液の蒸発と凝縮で熱を運ぶ部品で、放熱器そのものの呼び名ではない。","ペルチェ素子は電流を流して一方の面を冷やし他方で発熱させる電子冷却素子である。","サーマルパッドは素子と放熱器の間に挟んで熱抵抗を下げる熱伝導シートで、放熱器ではない。"],"https://www.youtube.com/watch?v=T9xhm4E1bkE","「熱抵抗とは」その測定原理も説明（はじめてのパワーMOSFETシリーズ）","",["w:158_2","アルミ製ヒートシンクとパワートランジスタ",{"a":"Retired electrician","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Aluminium_heatsink,_76x50mm_cross-section_01.jpg"}]],["運動エネルギーを持つ流水を大気中でランナに当てる水車を何というか？","衝動水車","反動水車","カプラン水車","フランシス水車","衝動水車は、ノズルから噴き出した水の運動エネルギー（速度）を、大気中でランナ（羽根車）のバケットに当てて回す水車。ペルトン水車が代表で、落差の大きい発電所で使われる。","https://www.kepco.co.jp/energy_supply/energy/newenergy/water/shikumi/waterwheel.html","水車の種類（関西電力）",["反動水車は水の圧力エネルギーを水中のランナで利用する水車で、大気中で噴流を当てるものではない。","カプラン水車は羽根の角度を変えられる低落差用の反動水車である。","フランシス水車は中落差で広く使われる反動水車で、ランナは水中で圧力を受けて回る。"],"https://www.youtube.com/watch?v=hxoSf7sEJFg","初心者向け電験三種・電力・水力発電・水車の種類・比速度","",["w:092_0","ペルトン水車のランナ（バケットが並ぶ）",{"a":"Dietmar Rabich","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Karlsruhe,_Laufrad_einer_Pelton-Turbine_--_2013_--_5252.jpg"}]],["圧力エネルギーを持つ流水をランナに作用させる水車を何というか？","反動水車","衝動水車","ペルトン水車","ターゴ水車","反動水車は、水の圧力エネルギーをランナの中で速度に変え、その反動で回す水車。ランナは水中に完全に浸かっている。中落差用のフランシス水車、低落差用のカプラン水車やプロペラ水車がある。","https://www.kepco.co.jp/energy_supply/energy/newenergy/water/shikumi/waterwheel.html","水車の種類（関西電力）",["衝動水車は大気中でノズルの噴流の運動エネルギーをランナに当てる水車で、圧力エネルギーを使う方式ではない。","ペルトン水車は高落差用の代表的な衝動水車で、噴流をバケットに当てて回す。","ターゴ水車は噴流を斜めからランナに当てる衝動水車の一種である。"],"https://www.youtube.com/watch?v=hxoSf7sEJFg","初心者向け電験三種・電力・水力発電・水車の種類・比速度","",["w:044_0","フランシス水車のランナ",{"a":"Rama","l":"CC BY-SA 2.0 fr","u":"https://commons.wikimedia.org/wiki/File:Francis_turbine-IMG_4993.jpg"}]],["中性点接地方式の4種類の組合せは？","直接接地、抵抗接地、消弧リアクトル接地、非接地","保護接地、機能接地、雷保護接地、信号接地","A種、B種、C種、D種","一点接地、多点接地、フレーム接地、浮遊接地","中性点接地方式には、中性点を直接大地につなぐ直接接地、抵抗を通してつなぐ抵抗接地、地絡時の電流を打ち消すリアクトルを通す消弧リアクトル接地、接地しない非接地の4種類がある。電圧階級や系統の性質によって使い分ける。","https://jeea.or.jp/course/contents/04102/","中性点接地方式（日本電気技術者協会）",["保護接地・機能接地・雷保護接地・信号接地は機器や建物での接地の目的による区分で、中性点接地方式ではない。","A種〜D種は電気設備の技術基準による接地工事の種類で、中性点の接地方式の分類ではない。","一点接地・多点接地などは電子機器の信号グラウンドの取り方に関する用語で、系統の中性点接地方式ではない。"],"https://www.youtube.com/watch?v=zsEXy8AnAZQ","初心者向け電験三種・電力・中性点接地・地絡電流","",["x:elec3_83","中性点接地方式4種類の接続"]],["送電線路の2種類の組合せは？","架空送電線路、地中送電線路","高圧線路、低圧線路","単相線路、三相線路","直流線路、交流線路","送電線路は、鉄塔や電柱に電線を張る架空送電線路と、ケーブルを地下に埋める地中送電線路に分けられる。架空は建設費が安く故障箇所を見つけやすい。地中は景観や安全面で優れ、都市部で使われるが、建設費が高い。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-transmission.html","送電について（関西電力送配電）",["高圧・低圧は電圧の大きさによる区分で、送電線路の設置方法による2種類ではない。","単相・三相は電気方式（相数）による区分で、線路の構造による分類ではない。","直流・交流は送る電流の種類による区分で、電線を空中に張るか地中に埋めるかの分類ではない。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ","",["w:175_0","架空送電線路の鉄塔と電線",{"a":"Novoklimov","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Transition_tower_from_overhead_power_line_to_underground_cable_05.jpg"}]],["ケーブルの温度上昇を引き起こす損失3つの組合せは？","抵抗損、誘電体損、シース損","鉄損、銅損、機械損","定常損失、ターンオン損失、ターンオフ損失","渦電流損、ヒステリシス損、風損","電力ケーブルの温度を上げる損失には、導体の電気抵抗による抵抗損（銅損）、絶縁体の誘電体損、ケーブルの金属シース（被覆）に流れる電流によるシース損がある。温度上昇によって流せる電流（許容電流）が決まる。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-transmission.html","送電について（関西電力送配電）",["鉄損・銅損・機械損は変圧器や回転機の損失で、ケーブルには鉄心や回転部分がない。","定常損失・ターンオン損失・ターンオフ損失は電力用半導体素子の損失である。","渦電流損とヒステリシス損は鉄心の鉄損、風損は回転機の機械損で、ケーブルの損失ではない。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ",""],["送電電力Prは、送電端電圧Es、受電端電圧Er、リアクタンスX、位相差δを用いてどう表されるか？","Pr ＝ (EsEr/X) sinδ","Pr ＝ (EsEr/X) cosδ","Pr ＝ (X/EsEr) sinδ","Pr ＝ EsEr X sinδ","送電電力 Pr＝(Es×Er/X)×sinδ。送電端と受電端の電圧の位相差δが90°のとき送電電力は最大になる（定態安定極限電力）。電圧が高いほど、リアクタンスが小さいほど、多くの電力を送れる。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-transmission.html","送電について（関西電力送配電）",["cosδとすると位相差ゼロで送電電力が最大になるが、実際は位相差がゼロなら有効電力は送れずδ＝90°で最大となる。","X/EsErは式が逆数になっており、リアクタンスが大きいほど多く送れる誤った関係になる。","リアクタンスXを掛けているため、Xが大きいほど送電電力が増える誤った式になる。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ","",["x:elec3_86","送電電力を求めるための電力系統図"]],["配電用変電所から出る配電線は何と呼ばれるか？","高圧配電線","特別高圧送電線","低圧引込線","幹線","配電用変電所から出て、需要家の近くまで電力を運ぶ6.6kVの配電線を高圧配電線という。そこから柱上変圧器で100V/200Vに下げ、低圧配電線で家庭などへ送る。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-distribution.html","配電について（関西電力送配電）",["特別高圧送電線は発電所から変電所までなど、より高い電圧で大電力を送る線路である。","低圧引込線は電柱の低圧配電線から需要家の建物へ引き込む電線で、変電所から出るものではない。","幹線は建物内の電気設備で、引込口から分電盤などへ電力を送る主要な配線を指す。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ",""],["配電線路の主な構成要素4つの組合せは？","コンクリート柱、電線、がいし、柱上変圧器","鉄塔、架空地線、避雷器、遮断器","発電機、タービン、ボイラ、復水器","ケーブル、マンホール、管路、変電所","架空配電線路は、コンクリート柱（電柱）、電線、電線を電柱から絶縁して支えるがいし、高圧を低圧に下げる柱上変圧器などで構成される。このほか開閉器や避雷器なども取り付けられている。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-distribution.html","配電について（関西電力送配電）",["鉄塔・架空地線は送電線路、遮断器は変電所などの構成要素で、配電線路の主な構成要素の組合せではない。","発電機・タービン・ボイラ・復水器は火力発電所の主要な設備である。","ケーブル・マンホール・管路は地中線路の設備で、変電所は線路の構成要素ではない。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ","",["x:elec3_88","配電設備（電柱・がいし・柱上変圧器）"]],["柱上変圧器の高圧側に接続する、開閉器とヒューズを兼ねた機器は？","高圧カットアウト","避雷器","低圧ブレーカ","断路器","高圧カットアウトは、柱上変圧器の高圧（1次）側に取り付ける、開閉器とヒューズを一体にした機器。変圧器の過負荷や短絡のときにヒューズが切れて保護し、点検時には手動で開閉して回路を切り離せる。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-distribution.html","配電について（関西電力送配電）",["避雷器は雷などによる異常電圧を大地に逃がして機器を守る装置で、開閉器やヒューズの機能はない。","低圧ブレーカは変圧器の低圧（2次）側で使う遮断器で、高圧側に接続する機器ではない。","断路器は無負荷の状態で回路を切り離すための開閉器で、ヒューズによる保護機能はもたない。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ","",["w:153_0","電柱上のヒューズ付き開閉器（カットアウト）",{"a":"Wtshymanski (talk)","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Blown_Fuse_Cutout_640.jpg"}]],["配電のネットワーク方式2種類の組合せは？","スポットネットワーク方式、レギュラーネットワーク方式","樹枝状式、ループ式","放射状式、環状式","単相2線式、三相3線式","ネットワーク配電方式は、複数の配電線から並列に電力を供給し、1つの回線が故障しても停電しないようにした信頼性の高い方式。大規模ビルなど1つの需要家向けのスポットネットワーク方式と、都市部の多数の需要家向けのレギュラーネットワーク方式がある。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-distribution.html","配電について（関西電力送配電）",["樹枝状式・ループ式は高圧配電の方式の区分で、ネットワーク方式の種類ではない。","放射状式・環状式は配電線路の形状による一般的な区分で、ネットワーク方式の2種類ではない。","単相2線式・三相3線式は電気方式（相数と電線数）による分類である。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ",""],["高圧配電の方式は何式と何式に大別されるか？","樹枝状式、ループ式","スポット式、レギュラー式","直接式、間接式","架空式、地中式","高圧配電の方式は、変電所から木の枝のように分岐していく樹枝状式と、配電線を環状につないで両側から供給できるループ式に大別される。樹枝状式は簡単で安価、ループ式は故障時に停電範囲を小さくできる。","https://www.kansai-td.co.jp/corporate/learning-with-okurin/about-power-distribution.html","配電について（関西電力送配電）",["スポットネットワーク・レギュラーネットワークはネットワーク配電方式の種類で、高圧配電の方式の大別ではない。","直接式・間接式は高圧配電の方式を分ける区分として用いられる組合せではない。","架空式・地中式は電線を空中に張るか地中に埋めるかという施設方法の区分である。"],"https://www.youtube.com/watch?v=iLAzypnY3vc","送電・配電のしくみ","",["x:elec3_91","高圧配電の樹枝状式とループ式"]],["同期電動機の出力はトルクに対してどうなるか？","トルクに比例する","トルクに反比例する","トルクの2乗に比例する","トルクと無関係","モータの出力P＝ω×T（ω：角速度、T：トルク）。同期電動機は負荷が変わっても同期速度で一定に回るので、ωが一定となり、出力はトルクに比例する。","https://www.nidec.com/jp/technology/motor/academic/016/","同期モータの構造と種類（ニデック）",["出力P＝ωTで角速度が一定なので、トルクが増えれば出力も増え、反比例にはならない。","角速度一定のもとでは出力はトルクに1乗で比例し、2乗には比例しない。","出力はトルクと角速度の積であり、トルクと無関係にはならない。"],"https://www.youtube.com/watch?v=-VGYsupzAj0","【電験三種：機械】同期電動機の構造",""],["LCDに使われるフィルタは何か？","偏光フィルタ","UVカットフィルタ","NDフィルタ","ローパスフィルタ","LCDでは、2枚の偏光フィルタで液晶をはさみ、液晶分子が光の偏光の向きをどれだけ変えるかで、光を通したり遮ったりして表示する。偏光フィルタがないと明暗が出ない。色はさらにカラーフィルタで付けている。","http://www.sharp.co.jp/products/lcd/tech/index2.html","液晶ディスプレイの原理と技術（シャープ）",["UVカットフィルタは紫外線を遮るフィルタで、液晶の明暗表示の原理には関係しない。","NDフィルタはカメラなどで光の量を色に関係なく均一に減らすフィルタで、LCDの表示原理ではない。","ローパスフィルタは低い周波数成分だけを通すフィルタで、LCDの明暗を作るものではない。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～",""],["PLDは何の略か？","Programmable Logic Device","Peripheral Logic Driver","Phase Locked Device","Programmable Line Decoder","PLDはProgrammable Logic Deviceの略で、購入後にユーザがプログラムで内部の論理回路を書き込める集積回路。大規模なものをFPGA、小規模なものをSPLD・CPLDなどと呼ぶ。","https://emb.macnica.co.jp/articles/8204/","これで分かる！プロセッサとFPGAとASICの違い（マクニカ）",["Peripheral Logic Driverは周辺の論理駆動回路を思わせる造語で、PLDの正式名称ではない。","Phase Locked Deviceは位相同期を連想させるが、位相同期回路はPLL（Phase Locked Loop）でありPLDではない。","Programmable Line Decoderはデコーダを思わせる造語で、PLDのDはDeviceである。"],"https://www.youtube.com/watch?v=UkJwFoReMEA","FPGAってどんなもの？",""],["0〜10Vのアナログ値を8ビットのデジタル値に変換するとき、1ビットは約何Vに相当するか？","0.04V","0.4V","0.004V","0.1V","8ビットでは0〜255の256段階。10V÷255≒0.039V≒0.04V。同じ8ビットでも、測る電圧範囲が広いほど1ビットあたりの電圧幅（分解能）は粗くなる。","https://www.marutsu.co.jp/contents/shop/marutsu/mame/70.html","A-Dコンバータ（マルツ 電子部品豆知識）",["0.4Vは10Vを25段階に分けた値で、8ビットの255段階に比べ10倍粗い。","0.004Vは10Vを約2500段階に分けた値で、11〜12ビット程度の分解能に相当する。","0.1Vは10Vを100段階に分けた値で、8ビットの分解能より粗い。"],"https://www.youtube.com/watch?v=Ujyxj8wT12E","動画でわかるマイコン基礎～A/D変換の仕組み～",""],["CPUと外部機器の間でデータをやり取りする回路部分を何というか？","I/Oポート","ALU","プログラムカウンタ","キャッシュ","I/Oポートは、CPUと外部機器（スイッチ、LED、センサ、モータドライバなど）の間でデータを入出力する回路部分。CPUはI/Oポートの番地にアクセスして外部とデータをやり取りする。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["ALUはCPU内部で算術演算や論理演算を行う回路で、外部機器とのデータのやり取りは担わない。","プログラムカウンタは次に実行する命令の番地を保持するレジスタである。","キャッシュはCPUと主記憶の間に置く高速な一時記憶で、外部機器との入出力回路ではない。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["ALUとはどのような機能を持つ回路か？","算術論理演算器","アドレス生成器","入出力制御器","記憶装置","ALU（Arithmetic Logic Unit：算術論理演算装置）は、CPUの中で加算・減算などの算術演算と、AND・OR・NOTなどの論理演算を行う回路。演算結果に応じてフラグ（ゼロ、キャリーなど）を変える。","https://e-words.jp/w/CPU.html","CPU（中央処理装置）とは（IT用語辞典 e-Words）",["アドレス生成はメモリの番地を計算する機能で、ALUの基本機能である算術・論理演算そのものではない。","入出力制御はI/Oポートや周辺回路が担う機能で、ALUの役割ではない。","記憶装置はデータを保持する装置で、演算を行うALUとは役割が異なる。"],"https://www.youtube.com/watch?v=ENXI15dmXT8","5大装置①~CPUとメモリ編~／ITパスポート・基本情報技術者",""],["オシロスコープで0.5ms/div、1周期が4divの信号の周波数は？","500Hz","2000Hz","200Hz","50Hz","周期＝0.5ms/div×4div＝2ms。周波数は周期の逆数なので、1÷0.002s＝500Hz。オシロスコープでは、横軸の目盛（時間/div）×マス数で周期を読み取る。","https://jp.rs-online.com/web/content/discovery/ideas-and-advice/electrical-signals-with-an-oscilloscope","オシロスコープで電気信号を可視化・解析する方法（RS）",["2000Hzは1div分の0.5msを周期とした値で、4div分を数えていない。","200Hzは周期5msに相当し、0.5ms×4div＝2msと合わない。","50Hzは周期20msに相当し、目盛の読み取りが10倍ずれている。"],"https://www.youtube.com/watch?v=flAJDrMVhhQ","初心者必見！オシロスコープの使い方をゼロから解説","",["x:elec3_98","0.5ms/div×4div＝2ms→500Hz"]],["三相誘導電動機の電源周波数を50Hzから60Hzに変えると、同期速度はどうなるか？","1.2倍になる","変わらない","0.83倍になる","1.44倍になる","同期速度Ns＝120f/pは周波数に比例するので、50Hzから60Hzに変えると60÷50＝1.2倍になる。同じモータでも東日本（50Hz）と西日本（60Hz）で回転速度が変わるのはこのため。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["同期速度は周波数に比例するため、周波数を変えれば同期速度も変わる。","0.83倍は50÷60で比を逆にした値で、周波数を上げると同期速度は上がる。","1.44倍は1.2を2乗した値で、同期速度は周波数の1乗に比例する。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界",""],["PM型ステッピングモータのPMとは何か？","永久磁石（Permanent Magnet）","パルスモータ（Pulse Motor）","位相変調（Phase Modulation）","精密モータ（Precision Motor）","PM形ステッピングモータのPMはPermanent Magnet（永久磁石）の略で、回転子に永久磁石を使っている。磁石があるので無通電でも保持力（ディテントトルク）があり、安価だが、ステップ角は比較的大きい。","https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理（オリエンタルモーター）",["パルスモータはステッピングモータ全体の別名で、PM形の回転子の構造を表す略語ではない。","位相変調（Phase Modulation）は通信で搬送波の位相を変える変調方式で、モータの形式とは関係ない。","精密モータという意味ではなく、PMは回転子に使う永久磁石を表す。"],"https://www.orientalmotor.co.jp/ja/tech/e-learning/st-list/fundamental/2-1-1","ステッピングモーターの基本的な構造と動作原理 eラーニング動画（オリエンタルモーター）",""]]},{"id":"elec4","title":"電気電子 2-3 センサ技術","cat":"電気電子","q":[["制御対象の状態などの物理量・化学量を、伝送・記録・信号処理しやすい別の量に変換する素子を何というか？","センサ","アクチュエータ","コントローラ","トランスデューサ回路","センサは、温度、圧力、光、位置などの物理量や化学量を検出し、電気信号など伝送・記録・処理しやすい別の量に変換する素子。制御システムの「目」の役割をもつ。逆に電気信号を動きなどに変えるのはアクチュエータ。","https://www.fa.omron.co.jp/product/special/knowledge/common/explanation.html","センサとは（オムロン制御機器）",["アクチュエータは電気信号などのエネルギーを動きや力に変えて対象に働きかける装置で、物理量を検出する素子ではない。","コントローラはセンサの信号をもとに操作量を計算・指令する制御装置で、物理量を別の量に変換する素子ではない。","トランスデューサは出力側の変換器（スピーカなど）も含む変換器全般の総称で、状態を検出する素子の名称としてはセンサが適切である。"],"https://www.youtube.com/watch?v=YgTtG3H_zoA","近接センサーって何？種類や用途について説明",""],["微小接点間隔とスナップアクション機構を持ち、規定の動きと力で開閉する接点をケースに収め、外部にアクチュエータを備えた小型スイッチは？","マイクロスイッチ","リードスイッチ","近接スイッチ","光電スイッチ","マイクロスイッチは、ごく小さな接点間隔と、ばねで一気に接点を切り替えるスナップアクション機構をもつ小型スイッチ。決まった動き（ストローク）と力で確実に開閉するので、機械の位置検出に広く使われる。","https://monoto.co.jp/fa-microswitches/","マイクロスイッチとは？用途から選定方法まで解説（monoto）",["リードスイッチはガラス管内の磁性体リードが磁石の磁界で接点を開閉するスイッチで、機械的なスナップアクション機構はもたない。","近接スイッチは物体に触れずに接近を検出する非接触スイッチで、アクチュエータを押して接点を開閉するものではない。","光電スイッチは投光器と受光器で光の遮断や反射を検出する非接触スイッチで、機械的な接点機構はない。"],"https://www.youtube.com/watch?v=tuO0qsrbmM4","リミットスイッチって何？用途や種類、マイクロスイッチとの違い","",["x:elec4_2","マイクロスイッチのアクチュエータ形状"]],["磁気センサに用いられる主な素子は？","ホール素子","サーミスタ","フォトダイオード","ストレインゲージ","ホール素子は、ホール効果（電流が流れる半導体に磁界をかけると、直角方向に電圧が生じる現象）を利用した磁気センサ。磁界の強さに比例した電圧を出力する。ブラシレスモータの回転位置検出や、電流センサなどに使われる。","https://technology.akm.com/jp/ja/technical-tutorial/basic-knowledge-magnetic-sensor/hall-elements/","ホール素子の原理と種類（旭化成エレクトロニクス）",["サーミスタは温度で抵抗値が大きく変わる半導体素子で、温度センサに使われる。","フォトダイオードは光が当たると電流が生じる受光素子で、光センサに使われる。","ストレインゲージはひずみで抵抗値が変わる素子で、ひずみや荷重の検出に使われる。"],"https://www.youtube.com/watch?v=giJraJNmTCI","ホール素子とホールICを解説してみた","",["x:elec4_3","ホール効果（電流と磁界に垂直に電圧発生）"]],["温度センサに用いられる素子の組合せは？","熱電対、サーミスタ","ホール素子、MR素子","フォトダイオード、CdSセル","ストレインゲージ、ロードセル","温度センサの代表は、2種類の金属の接点の温度差で起電力が生じるゼーベック効果を利用した熱電対（高温まで測れる）と、温度で抵抗値が大きく変わる半導体を利用したサーミスタ（感度が高く安価）。このほか測温抵抗体（白金など）もよく使われる。","https://www.chino.co.jp/jp/serv/article/knowledge/temperature-sensor-faq/","温度センサガイド 熱電対・測温抵抗体の違い（チノー）",["ホール素子とMR素子（磁気抵抗素子）はどちらも磁界を検出する磁気センサである。","フォトダイオードとCdSセルはどちらも光を検出する光センサである。","ストレインゲージはひずみを検出する素子、ロードセルはそれを使って荷重を測るセンサで、温度センサではない。"],"https://www.youtube.com/watch?v=GCZwII4EHPY","温度センサの種類を間違うと、どうなる！？ Jタイプ？ Kタイプ？",""],["電極の上に、水分を含むと電気抵抗が変化する高分子を塗布した構造の湿度センサは？","抵抗型高分子湿度センサ","セラミック湿度センサ","静電容量型湿度センサ","乾湿球湿度計","抵抗型高分子湿度センサは、電極の上に吸湿性の高分子膜を塗布したもの。空気中の水分を吸うと高分子の電気抵抗が変わるので、その変化から湿度を測る。小型・安価で、家電の湿度センサなどに使われる。","https://www.jp.tdk.com/tech-mag/hatena/023","ドライ・ウェットを電気信号にする湿度センサ（TDK）",["セラミック湿度センサは多孔質のセラミック焼結体への水分吸着による抵抗変化を利用するもので、高分子は塗布しない。","静電容量型湿度センサは高分子膜の吸湿による誘電率の変化を静電容量として測る方式で、電気抵抗の変化は使わない。","乾湿球湿度計は乾球と湿球の温度差から湿度を求める計器で、電極や高分子は使わない。"],"https://www.youtube.com/watch?v=WOY9Ugb2si8","湿度センサ調査（電子工作）","",["x:elec4_5","抵抗型高分子湿度センサの構造"]],["多孔質焼結体の電気抵抗が、水分の吸着によって変化することを利用した湿度センサは？","セラミック湿度センサ","抵抗型高分子湿度センサ","毛髪湿度計","露点計","セラミック湿度センサは、微細な穴がたくさんある多孔質のセラミック焼結体を使う。表面に水分子が吸着すると電気抵抗が下がるので、その変化から湿度を測る。耐熱性が高く、加熱して汚れを焼き飛ばせる（リフレッシュできる）のが特長。","https://www.jp.tdk.com/tech-mag/hatena/023","ドライ・ウェットを電気信号にする湿度センサ（TDK）",["抵抗型高分子湿度センサは電極上の吸湿性高分子膜の抵抗変化を利用するもので、多孔質焼結体は使わない。","毛髪湿度計は毛髪が湿度によって伸び縮みする性質を機械的に利用する計器で、電気抵抗は測らない。","露点計は空気を冷やして結露が始まる温度（露点）から湿度を求める計器である。"],"https://www.youtube.com/watch?v=WOY9Ugb2si8","湿度センサ調査（電子工作）",""],["物体のひずみを検出するセンサを何というか？","ひずみゲージ（ストレインゲージ）","ジャイロセンサ","ロータリエンコーダ","イメージセンサ","ひずみゲージ（ストレインゲージ）は、薄い金属の抵抗体を物体に貼り付け、物体のひずみで抵抗体が伸び縮みして抵抗値が変わることから、ひずみを検出するセンサ。ブリッジ回路で電圧に変えて測る。ロードセルや圧力センサの検出部に使われる。","https://www.keyence.co.jp/ss/products/recorder/lab/strain/base.jsp","「ひずみ」とは？（キーエンス）",["ジャイロセンサは物体の回転の速さ（角速度）を検出するセンサで、ひずみは測らない。","ロータリエンコーダは回転角度をパルス信号として検出するセンサである。","イメージセンサは2次元の光の分布を画像として電気信号に変えるセンサである。"],"https://www.youtube.com/watch?v=3OeBX-PVtes","ひずみゲージ入門編【共和電業】","",["x:elec4_7","ひずみゲージの構造（抵抗線とベース）"]],["温度上昇で抵抗値が①減少する、②増加する、③ある温度を境に急変するサーミスタの名称は？","①NTC ②PTC ③CTR","①PTC ②NTC ③CTR","①CTR ②PTC ③NTC","①NTC ②CTR ③PTC","NTCサーミスタ（負特性）は温度が上がると抵抗が減り、温度測定に最もよく使われる。PTCサーミスタ（正特性）は温度が上がると抵抗が増え、過電流保護に使う。CTRサーミスタ（臨界温度抵抗器）は特定の温度で抵抗が急変し、温度スイッチとして使う。","https://www.chino.co.jp/jp/serv/article/knowledge/temperature-sensor-faq/","温度センサガイド 熱電対・測温抵抗体の違い（チノー）",["PTCとNTCが逆で、NTCは温度上昇で抵抗が減少し、PTCは増加する。","CTRは特定温度で抵抗が急変する素子で、温度上昇で抵抗が減少するのはNTCであり、①と③の対応が逆になっている。","CTRとPTCが逆で、ある温度で急変するのがCTR、温度上昇で増加するのがPTCである。"],"https://www.youtube.com/watch?v=GCZwII4EHPY","温度センサの種類を間違うと、どうなる！？ Jタイプ？ Kタイプ？","",["x:elec4_8","NTC・PTC・CTRサーミスタの温度特性"]],["センサ回路の入力インピーダンスと出力インピーダンスは、それぞれどんな値が望ましいか？","入力は高く、出力は低い","入力は低く、出力は高い","どちらも高い","どちらも低い","センサ回路の入力インピーダンスは高いほど、前段（センサ）から電流をほとんど引かないので、センサの信号を変化させずに受け取れる。出力インピーダンスは低いほど、後段に電流を流しても電圧が下がらず、信号を正しく伝えられる。","https://detail-infomation.com/voltage-follower/","ボルテージフォロワをわかりやすく解説（Electrical Information）",["入出力とも逆で、入力が低いとセンサから電流を引いて信号が変化し、出力が高いと負荷をつないだとき電圧が下がる。","出力インピーダンスが高いと、後段に負荷をつないだときに信号電圧が下がってしまう。","入力インピーダンスが低いと、センサから電流を多く引き込んで信号を変化させてしまう。"],"https://www.youtube.com/watch?v=eKRIOt6jKbk","ボルテージ・フォロワ",""],["インピーダンス変換回路を出力端子につなぐと、どうすることができるか？","出力インピーダンスを低くできる","出力インピーダンスを高くできる","入力インピーダンスを低くできる","信号を増幅して周波数を変えられる","インピーダンス変換回路（ボルテージフォロアなどのバッファ）を出力端子につなぐと、電圧はそのままで出力インピーダンスを低くできる。これにより、後段に負荷をつないでも信号電圧が下がらなくなる。","https://detail-infomation.com/voltage-follower/","ボルテージフォロワをわかりやすく解説（Electrical Information）",["出力インピーダンスを高くすると、負荷をつないだときに電圧が下がりやすくなり、変換回路を入れる目的と逆である。","インピーダンス変換回路は入力インピーダンスを高く保つもので、出力端子につないでも入力側を低くする働きはない。","ボルテージフォロアなどは電圧利得が1で周波数も変えず、増幅や周波数変換は行わない。"],"https://www.youtube.com/watch?v=eKRIOt6jKbk","ボルテージ・フォロワ",""],["可視光の波長域はおよそどのくらいか？","360〜830 nm","10〜100 nm","1〜10 μm","830〜2000 nm","人の目に見える光（可視光）の波長はおよそ360〜830nm（一般的には380〜780nm程度とも言う）。短い側が紫、長い側が赤。それより波長が短いと紫外線、長いと赤外線になる。","https://optipedia.info/opt/optics/snells-law/","スネルの法則（Optipedia）",["10〜100nmは紫外線の中でも極端紫外線に近い短い波長域で、人の目には見えない。","1〜10μmは赤外線の波長域で、人の目には見えない。","830〜2000nmは可視光より波長が長い近赤外線の範囲である。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～",""],["光が伝わる速度はおよそどのくらいか？","約300,000 km/s","約30,000 km/s","約3,000 km/s","約340 m/s","光の速さ（真空中）は約3×10⁸m/s＝約30万km/sで、1秒で地球を約7周半する。光電センサなどで距離を測るTOF（飛行時間）方式は、この速さと光が戻るまでの時間から距離を計算する。","https://optipedia.info/opt/optics/snells-law/","スネルの法則（Optipedia）",["約30,000km/sは光速の1/10で、桁が1つ小さい。","約3,000km/sは光速の1/100で、桁が2つ小さい。","約340m/sは空気中の音の速さで、光速とはまったく異なる。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～",""],["屈折の法則は、入射角i・屈折角rを用いてどう表されるか？","sin i / sin r ＝ 一定","cos i / cos r ＝ 一定","i ＋ r ＝ 一定","tan i × tan r ＝ 一定","屈折の法則（スネルの法則）は、光が異なる物質の境界に入るとき、入射角iと屈折角rの正弦の比 sin i/sin r が一定（2つの物質の屈折率の比）になるという法則。光ファイバの全反射などを理解する基本になる。","https://optipedia.info/opt/optics/snells-law/","スネルの法則（Optipedia）",["屈折の法則は角度の正弦（sin）の比が一定になるもので、余弦（cos）の比ではない。","入射角と屈折角の和は一定にならず、関係は正弦の比で表される。","正接（tan）の積が一定になる関係はなく、屈折の法則は正弦の比である。"],"https://www.youtube.com/watch?v=pztha7RhTPU","電気で光をあやつる？ ～液晶ディスプレイのしくみ～","",["x:elec4_13","屈折の法則（sin i / sin r＝一定）"]],["光が照射されると電流や電圧を発生させる受光素子は？","フォトダイオード","発光ダイオード","ツェナーダイオード","ホール素子","フォトダイオードは、PN接合に光が当たると、光のエネルギーで電子と正孔ができて電流（電圧）が生じる受光素子。応答が速く、光の強さに比例した電流が得られる。光電スイッチ、照度計、光通信の受信部などに使われる。","https://techweb.rohm.co.jp/product/sensor/sensor-device/5187/","光センサ：フォトダイオードとフォトトランジスタ（ROHM TechWeb）",["発光ダイオードは電流を流すと光を出す発光素子で、受光素子とは働きが逆である。","ツェナーダイオードは逆方向の降伏電圧がほぼ一定になる性質を使い、定電圧回路に用いるダイオードである。","ホール素子は磁界に比例した電圧を出す磁気センサで、光には反応しない。"],"https://www.youtube.com/watch?v=oL3q1S0q0G0","フォトダイオードの仕組み","",["w:176_0","フォトダイオードの外観（受光面）",{"a":"John Maushammer, took this picture on Aug 2, 2006. (user Mor","l":"CC BY-SA 2.5","u":"https://commons.wikimedia.org/wiki/File:Photodiode-closeup.jpg"}]],["投光器と受光器で構成され、物体が光路を遮ったときに開閉するスイッチは？","光電スイッチ","リードスイッチ","マイクロスイッチ","近接スイッチ（磁気誘導形）","光電スイッチは、投光器から出した光を受光器で受け、物体が光をさえぎったり反射したりしたことで物体の有無を検出するスイッチ。投光器と受光器を向かい合わせる透過形、反射板を使う回帰反射形、物体からの反射を使う拡散反射形がある。","https://www.keyence.co.jp/ss/products/sensor/sensorbasics/pe_type.jsp","光電センサの検出方式と特徴（キーエンス）",["リードスイッチは磁石の磁界で接点が開閉するスイッチで、光の遮断は使わない。","マイクロスイッチは可動部がアクチュエータを押すことで接点が開閉する接触式のスイッチである。","磁気誘導形の近接スイッチは磁界や金属の接近を検出するもので、投光器と受光器による光路の遮断は使わない。"],"https://www.fa.omron.co.jp/video/detail/6158958110001/","制御初心者のための動画集⑤ 光電センサとは（種類・動作原理）（オムロン制御機器）",""],["2次元の光の分布を検出するセンサは？","イメージセンサ","フォトダイオード","光電スイッチ","ロータリエンコーダ","イメージセンサは、多数の受光素子（画素）を平面に並べ、2次元の光の分布（画像）を電気信号に変換するセンサ。CCDやCMOSイメージセンサがあり、デジタルカメラや画像検査装置に使われる。","https://e-words.jp/w/%E3%82%A4%E3%83%A1%E3%83%BC%E3%82%B8%E3%82%BB%E3%83%B3%E3%82%B5%E3%83%BC.html","イメージセンサーとは（IT用語辞典 e-Words）",["フォトダイオードは1点の光の強さを検出する受光素子で、単体では2次元の分布は得られない。","光電スイッチは光路の遮断や反射で物体の有無を検出するスイッチで、光の分布は測らない。","ロータリエンコーダは回転角度を検出するセンサで、光の分布を画像として得るものではない。"],"https://www.youtube.com/watch?v=W_x4ke6128E","今更聞けない、CCDとCMOSイメージセンサの動作の違いを解説","",["w:017_3","イメージセンサチップの外観",{"a":"Phiarc","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:CMOS_image_sensor_chip-scale_package_oblique.jpg"}]],["マイクロスイッチは主に何として利用されるか？","リミットスイッチ","温度スイッチ","圧力スイッチ","タッチスイッチ","マイクロスイッチは、機械の可動部が決められた位置に来たことを検出するリミットスイッチとして主に使われる。行き過ぎ防止、原点検出、扉の開閉検出などに使われる。","https://monoto.co.jp/fa-microswitches/","マイクロスイッチとは？用途から選定方法まで解説（monoto）",["温度スイッチはバイメタルなどで設定温度に達すると接点を開閉するスイッチで、マイクロスイッチの主用途ではない。","圧力スイッチはダイヤフラムやベローズで設定圧力を検出して開閉するスイッチである。","タッチスイッチは指の接触を静電容量の変化などで検出するスイッチで、機械の位置検出に使うものではない。"],"https://www.youtube.com/watch?v=tuO0qsrbmM4","リミットスイッチって何？用途や種類、マイクロスイッチとの違い",""],["機械的スイッチで、接点が一気に切り替わらず、何回か開閉を繰り返してから切り替わる現象を何というか？","チャタリング","バウンス","脱調","ヒステリシス","チャタリングは、機械的なスイッチの接点が閉じる（開く）瞬間に、接点が細かく跳ね返って何度もオン・オフを繰り返す現象。マイコンで読み取ると、1回押しただけなのに複数回押したと誤認識するため、CR回路やソフトウェアの待ち時間で除去する。","https://components.omron.com/jp-ja/products/basic-knowledge/switches/applications","スイッチの基礎知識 使用編（オムロン）",["バウンスは接点どうしが衝突して跳ね返る現象で、開閉を繰り返すチャタリングの原因にあたる。","脱調はステッピングモータや同期電動機が同期を外れる現象で、スイッチ接点の現象ではない。","ヒステリシスは入力を増やすときと減らすときで切り替わる点が異なる性質で、接点が何度も開閉する現象ではない。"],"https://www.youtube.com/watch?v=4Y6eMXlDAd8","スイッチをON/OFFするときはチャタリングに注意","",["x:elec4_18","チャタリングによるON/OFFの繰り返し"]],["チャタリングの原因となる、接点同士の衝突（跳ね返り）を何というか？","バウンス","チャタリング","アーク","スナップ","バウンスは、スイッチの接点どうしが衝突したときに跳ね返る現象。このバウンスによって接点が細かく開閉を繰り返すことが、チャタリングの原因になる。","https://components.omron.com/jp-ja/products/basic-knowledge/switches/applications","スイッチの基礎知識 使用編（オムロン）",["チャタリングは跳ね返りの結果として接点が何度も開閉を繰り返す現象で、衝突そのものではない。","アークは接点が開くときなどに接点間に生じる放電で、跳ね返りではない。","スナップはばねで接点を一気に切り替えるスナップアクションの動作を指し、跳ね返りではない。"],"https://www.youtube.com/watch?v=4Y6eMXlDAd8","スイッチをON/OFFするときはチャタリングに注意","",["w:208_1","接点バウンスによる電圧波形の乱れ",{"a":"Super Rad!","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Bouncy_Switch.png"}]],["回転角度を検出するデジタル型センサは？","ロータリエンコーダ","ポテンショメータ","タコジェネレータ","レゾルバ","ロータリエンコーダは、回転角度をデジタルのパルス信号として検出するセンサ。パルスを数えて相対的な回転量を測るインクリメンタル形と、回転位置に対応した固有のコードを出すアブソリュート形がある。","https://www.fa.omron.co.jp/product/special/knowledge/re/principle_structure.html","ロータリエンコーダ（原理と構造）（オムロン）",["ポテンショメータは回転角を抵抗値の変化として取り出すアナログ型センサである。","タコジェネレータは回転速度に比例した電圧を発生する発電機で、角度ではなく速度をアナログで検出する。","レゾルバは回転角に応じた正弦・余弦の交流信号を出すアナログ型の角度センサである。"],"https://www.youtube.com/watch?v=cogsdemslj0","ロータリーエンコーダの基本原理","",["x:elec4_20","ロータリエンコーダの構造（スリット円板）"]],["スリット数200の回転板を用いたロータリエンコーダの、1スリットあたりの分解能は？","1.8°","0.45°","3.6°","0.9°","スリット数200の回転板では、1回転（360°）で200パルスが出るので、1スリットあたりの分解能は360°÷200＝1.8°。スリット数を増やすほど分解能は細かくなる。","https://www.fa.omron.co.jp/product/special/knowledge/re/principle_structure.html","ロータリエンコーダ（原理と構造）（オムロン）",["0.45°は4逓倍して800パルスとした場合の分解能で、スリット1つあたりの値ではない。","3.6°はスリット数100の場合の分解能である。","0.9°はパルスを2逓倍して400パルスとした場合の分解能である。"],"https://www.youtube.com/watch?v=cogsdemslj0","ロータリーエンコーダの基本原理",""],["スリット数200の回転板に4逓倍回路を使った場合の、1パルスあたりの分解能は？","0.45°","1.8°","0.9°","7.2°","インクリメンタル形エンコーダはA相・B相の2つの信号を出し、その立ち上がり・立ち下がりをすべて数えると、パルス数を4倍にできる（4逓倍）。スリット200なら1回転800パルスとなり、分解能は360°÷800＝0.45°。","https://www.fa.omron.co.jp/product/special/knowledge/re/principle_structure.html","ロータリエンコーダ（原理と構造）（オムロン）",["1.8°は逓倍せずスリット200のままの分解能で、4逓倍が反映されていない。","0.9°は2逓倍して400パルスとした場合の分解能である。","7.2°は1.8°を4で割らずに4倍してしまった値である。"],"https://www.youtube.com/watch?v=cogsdemslj0","ロータリーエンコーダの基本原理","",["x:elec4_22","エンコーダのA・B相（90°ずれ）とZ相"]],["高速で回転する物体の回転軸が一定方向を保とうとする性質を利用した、角速度センサは？","ジャイロセンサ","加速度センサ","ロータリエンコーダ","傾斜センサ","ジャイロセンサは、物体が回転する速さ（角速度）を検出するセンサ。もともとは高速で回るコマ（ジャイロスコープ）の軸が向きを保とうとする性質を利用した。現在は小型の振動式が主流で、スマートフォン、カメラの手ぶれ補正、ドローンの姿勢制御などに使われる。","https://www.epsondevice.com/crystal/ja/techinfo/column/sensor/gyro.html","ジャイロセンサーとは（エプソン）",["加速度センサは直線方向の速度の変化（加速度）を検出するセンサで、角速度は測らない。","ロータリエンコーダは軸の回転角度をパルスで検出するもので、回転軸が向きを保つ性質は利用しない。","傾斜センサは重力の方向に対する傾きを検出するセンサで、角速度は測らない。"],"https://www.youtube.com/watch?v=Lw_VcEROTxA","ジャイロセンサの仕組み","",["x:elec4_23","ジャイロの原理（コリオリの力）"]],["ジャイロセンサの方式4つの組合せは？","機械式、流体式、光学式、振動式","磁気式、熱式、光学式、電気式","機械式、電子式、静電式、圧電式","光学式、超音波式、赤外線式、振動式","ジャイロセンサには、高速回転するコマを使う機械式、気体などの流れを利用する流体式、光の干渉を利用する光学式（光ファイバジャイロ、リングレーザジャイロ）、振動体に働くコリオリの力を利用する振動式がある。","https://www.epsondevice.com/crystal/ja/techinfo/column/sensor/gyro.html","ジャイロセンサーとは（エプソン）",["磁気式・熱式・電気式はジャイロの代表的な方式ではなく、磁気式は方位を測る地磁気センサなどの方式である。","電子式・静電式・圧電式は検出の電気的な仕組みを表す言葉で、ジャイロの4方式の分類ではない。","超音波式・赤外線式は距離や人体の検出に使う方式で、角速度を測るジャイロの方式ではない。"],"https://www.youtube.com/watch?v=Lw_VcEROTxA","ジャイロセンサの仕組み",""],["対象物体が近くにあるかどうかを非接触で検出するスイッチは？","近接スイッチ","マイクロスイッチ","リミットスイッチ","押しボタンスイッチ","近接スイッチは、物体に触れずに、物体が近くにあるかどうかを検出するスイッチ。金属を検出する高周波発振形（誘導形）、金属以外も検出できる静電容量形、磁石を検出する磁気形などがある。非接触なので摩耗せず寿命が長い。","https://www.fa.omron.co.jp/product/special/knowledge/prox/inducement_type/principle_structure.html","誘導形近接センサ（原理と構造）（オムロン）",["マイクロスイッチは可動部がアクチュエータに触れて動作する接触式のスイッチである。","リミットスイッチは可動部が決められた位置に来たことを接触して検出するスイッチで、多くはマイクロスイッチを内蔵する。","押しボタンスイッチは人が指で押して操作するスイッチで、物体の接近を検出するものではない。"],"https://www.fa.omron.co.jp/video/detail/6158958112001/","制御初心者のための動画集⑦ 3-3 近接センサの動作原理・ワークの検出実習（オムロン制御機器 動画ライブラリ）","",["w:163_1","円筒形の近接スイッチの外観",{"a":"Ekbsensor","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Inductive_proximity_sensor.jpg"}]],["圧力センサで、圧力を検出するのに使う「薄い円板」と「ジャバラ状にひだのついた円筒」をそれぞれ何というか？","ダイヤフラム、ベローズ","ベローズ、ダイヤフラム","ブルドン管、ダイヤフラム","ピストン、シリンダ","ダイヤフラムは、圧力を受けてたわむ薄い円板（膜）で、そのたわみをひずみゲージなどで検出する。ベローズは、ジャバラ状のひだをもつ円筒で、圧力を受けると軸方向に伸び縮みする。どちらも圧力計や圧力スイッチの受圧部に使われる。","https://www.fa.omron.co.jp/guide/technicalguide/35/28/index.html","圧力センサ 概要（オムロン技術解説）",["順序が逆で、薄い円板がダイヤフラム、ジャバラ状の円筒がベローズである。","ブルドン管は断面が扁平な曲がった管で、圧力で曲がりが伸びることを利用する受圧素子であり、薄い円板ではない。","ピストンとシリンダは空気圧や油圧のアクチュエータなどを構成する部品で、薄い円板やジャバラ状の円筒の名称ではない。"],"https://www.youtube.com/watch?v=amP9SV-l7vA","【計測】ひずみゲージ【ロードセル】","",["x:elec4_26","ダイヤフラムとベローズの構造"]]]},{"id":"info1","title":"情報 1-1 情報の基礎・1-2 プロセッサ","cat":"情報","q":[["コンピュータの世界で、文字・文字列・文字コード体系をそれぞれ何というか？","キャラクタ、テキスト、コードセット","テキスト、キャラクタ、フォント","バイト、ワード、エンコード","キャラクタ、ストリング、フォント","コンピュータでは、1つの文字をキャラクタ、文字の並び（文字列）をテキスト、どの文字にどの番号を割り当てるかを決めた体系をコードセット（文字コード体系）と呼ぶ。同じ文字でもコードセットが違うと番号が異なるため、合わないと文字化けが起こる。","https://e-words.jp/w/%E6%96%87%E5%AD%97%E3%82%B3%E3%83%BC%E3%83%89.html","文字コードとは（IT用語辞典 e-Words）",["キャラクタとテキストの対応が逆になっており、フォントは文字の字形（書体）データであって文字コード体系ではない。","バイトは8ビットのデータ単位、ワードはCPUが一度に扱うデータ長、エンコードは符号化する操作で、文字・文字列・体系の呼び名ではない。","ストリングも文字列を指す語だが、フォントは書体データであり、文字に番号を割り当てる文字コード体系（コードセット）ではない。"],"https://www.youtube.com/watch?v=k7Fm8BC6B0s","【情報1】文字コード｜共通テスト対策",""],["アルファベット、数字、記号などを7ビットで符号化したコードは？","ASCIIコード","Unicode","EUC","シフトJIS","ASCII（アスキー）コードは、米国で定められた7ビット（128種類）の文字コード。英大文字・小文字、数字、記号、改行などの制御文字を表す。日本語は含まれないため、日本ではJISコードやシフトJISなどが作られた。","https://e-words.jp/w/%E6%96%87%E5%AD%97%E3%82%B3%E3%83%BC%E3%83%89.html","文字コードとは（IT用語辞典 e-Words）",["Unicodeは世界中の文字を統一的に扱う文字コードで、7ビット128種類に収まるものではない。","EUCはUNIX系で使われた日本語などを扱う多バイトの文字コードで、7ビットの英数字コードではない。","シフトJISは日本語を扱うためにマイクロソフトなどが定めた多バイトの文字コードで、7ビットのコードではない。"],"https://www.youtube.com/watch?v=k7Fm8BC6B0s","【情報1】文字コード｜共通テスト対策","",["w:004_0","7ビットのASCIIコード表",{"a":"Anomie","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:ASCII_Code_Chart.svg"}]],["世界各国の文字コードを統一体系にまとめて標準化しようとしたものは？","Unicode","ASCII","JIS X 0208","EBCDIC","Unicodeは、世界中の文字を1つの体系で扱えるよう、すべての文字に固有の番号を割り当てた文字コードの国際標準。保存や通信の際はUTF-8やUTF-16などの方式で符号化する。現在のWebやOSの標準になっている。","https://e-words.jp/w/%E6%96%87%E5%AD%97%E3%82%B3%E3%83%BC%E3%83%89.html","文字コードとは（IT用語辞典 e-Words）",["ASCIIは米国で定めた7ビットの英数字用コードで、各国の文字を統一的に収めたものではない。","JIS X 0208は日本の漢字・かななどを定めた日本国内向けの文字集合で、世界各国の文字を統一したものではない。","EBCDICはIBMの大型機で使われた8ビットの文字コードで、各国文字の統一を目的としたものではない。"],"https://www.youtube.com/watch?v=k7Fm8BC6B0s","【情報1】文字コード｜共通テスト対策",""],["一定間隔で信号の値を取り込むことを何というか？","標本化","量子化","符号化","変調","標本化（サンプリング）は、連続して変化するアナログ信号の値を、一定の時間間隔で取り出すこと。元の信号の最高周波数の2倍より高い周波数で標本化すれば、元の信号を復元できる（標本化定理）。","https://e-words.jp/w/PCM.html","PCM（パルス符号変調）とは（IT用語辞典 e-Words）",["量子化は標本化で取り出した値を、とびとびの段階値に丸める処理で、値を一定間隔で取り込む操作ではない。","符号化は量子化した値を0と1の符号に置き換える処理で、デジタル化の最後の段階にあたる。","変調は搬送波の振幅・周波数・位相などを信号に応じて変化させる操作で、通信で使う技術である。"],"https://www.youtube.com/watch?v=UrRfsRmVBTI","音のデジタル化とは（標本化・量子化・符号化）わかりやすく解説","",["w:195_3","正弦波を一定間隔で標本化した点",{"a":"Jacopo Bertolotti","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Aliasing_sinusoidal.gif"}]],["取り込んだ信号の値を、とびとびのディジタル値に変換することを何というか？","量子化","標本化","符号化","圧縮","量子化は、標本化で取り出した連続的な値を、決められた段階（とびとびの値）に丸めること。このとき生じる誤差を量子化誤差という。段階数（ビット数）が多いほど誤差は小さくなる。標本化→量子化→符号化の順でデジタル化する。","https://e-words.jp/w/PCM.html","PCM（パルス符号変調）とは（IT用語辞典 e-Words）",["標本化は連続信号の値を一定の時間間隔で取り出す操作で、値をとびとびに丸める処理ではない。","符号化は量子化後の値を2進数などの符号で表す処理で、値をとびとびにする段階はその前の量子化である。","圧縮はデータの冗長性を除いてビット数を減らす処理で、連続値を離散値に変換する操作ではない。"],"https://www.youtube.com/watch?v=UrRfsRmVBTI","音のデジタル化とは（標本化・量子化・符号化）わかりやすく解説","",["x:info1_05","標本化した値を3ビットの段階に量子化する例"]],["論理を表で表現し、外部仕様書に落とし込むための表は？","真理値表","カルノー図","状態遷移表","デシジョンテーブル","真理値表は、論理回路のすべての入力の組合せに対して、出力がどうなるかを一覧表にしたもの。論理を漏れなく表せるので、仕様書（外部仕様）に使う。入力がn個なら2ⁿ行になる。","https://e-words.jp/w/%E8%AB%96%E7%90%86%E5%9B%9E%E8%B7%AF.html","論理回路とは（IT用語辞典 e-Words）",["カルノー図は論理を図で表して簡単化（分析）に使う図で、仕様書用の表ではない。","状態遷移表は現在の状態と入力から次の状態を表す表で、順序回路や状態機械の設計に使う。","デシジョンテーブルは条件と処理の組合せを整理する決定表で、主にソフトウェアの仕様やテスト設計に使う。"],"https://www.youtube.com/watch?v=KdJ5CTgxZbM","【A試験_基礎理論】06. 論理演算と論理回路","",["x:info1_06","同じ論理を真理値表・カルノー図・式・MIL記号で表現"]],["論理を図で表現し、仕様の分析（簡単化）に使われる図は？","カルノー図","真理値表","ベン図","タイミングチャート","カルノー図（カルノーマップ）は、真理値表の内容を、隣り合うマスが1ビットだけ違うように並べた図。1が並んだマスをまとめて囲むことで、論理式を最も簡単な形に整理（簡単化）できる。","https://e-words.jp/w/%E8%AB%96%E7%90%86%E5%9B%9E%E8%B7%AF.html","論理回路とは（IT用語辞典 e-Words）",["真理値表は全入力の組合せと出力を一覧にした表で、論理を図で表すものではない。","ベン図は集合の関係を円の重なりで表す図で、論理式の簡単化を体系的に行う道具ではない。","タイミングチャートは信号の時間変化を波形で表す図で、論理式の簡単化には使わない。"],"https://www.youtube.com/watch?v=KdJ5CTgxZbM","【A試験_基礎理論】06. 論理演算と論理回路","",["x:info1_06","カルノー図を含む2値論理の4つの表現方法"]],["論理を式で表現し、実現方法を設計するための式を何というか？","ブール代数式","微分方程式","伝達関数","正規表現","ブール代数式は、AND（・）、OR（＋）、NOT（￣）などを使って論理を数式で表したもの。ド・モルガンの定理などの法則で変形・簡単化でき、どのゲートで回路を実現するかの設計に使う。","https://e-words.jp/w/%E8%AB%96%E7%90%86%E5%9B%9E%E8%B7%AF.html","論理回路とは（IT用語辞典 e-Words）",["微分方程式は物理量の変化を微分を含む式で表したもので、論理回路の設計式ではない。","伝達関数は制御系などの入出力関係をラプラス変換で表したもので、論理を表す式ではない。","正規表現は文字列のパターンを記述する表記法で、論理回路の実現方法を設計する式ではない。"],"https://www.youtube.com/watch?v=KdJ5CTgxZbM","【A試験_基礎理論】06. 論理演算と論理回路",""],["論理を記号で表現し、製造用回路図に落とすための記号を何というか？","MIL記号","ER図記号","UML記号","フローチャート記号","MIL記号は、米国軍用規格（MIL規格）で定められた論理回路の図記号。ANDは半円形、ORは三日月形、NOTは三角形に小さな丸などで表し、回路図を描く際に世界中で広く使われている。","https://e-words.jp/w/%E8%AB%96%E7%90%86%E5%9B%9E%E8%B7%AF.html","論理回路とは（IT用語辞典 e-Words）",["ER図記号はデータベース設計でエンティティと関連を表す記号で、論理回路図には使わない。","UML記号はソフトウェアの構造や振る舞いをモデル化するための記号で、論理回路の図記号ではない。","フローチャート記号は処理の流れを表す記号（JIS X 0121など）で、ゲート回路を描く記号ではない。"],"https://www.youtube.com/watch?v=KdJ5CTgxZbM","【A試験_基礎理論】06. 論理演算と論理回路","",["w:169_1","MIL記号で表したANDゲート",{"a":"No machine-readable author provided. Mikm assumed (based on ","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Logic-gate-and-us.svg"}]],["論理積と論理和をそれぞれ何というか？","AND、OR","OR、AND","NAND、NOR","XOR、NOT","論理積（AND）は、すべての入力が1のときだけ出力が1。論理和（OR）は、どれか1つでも入力が1なら出力が1。否定（NOT）は入力を反転する。これらを組み合わせてあらゆる論理回路が作れる。","https://e-words.jp/w/%E8%AB%96%E7%90%86%E5%9B%9E%E8%B7%AF.html","論理回路とは（IT用語辞典 e-Wor
