や三角はねじ山の断面形状の分類。歯車の歯形の種類ではない。"],"https://www.youtube.com/watch?v=Rb19bKAKeEU","機械要素 歯車の基礎編","",["w:061_0","インボリュート歯形の歯車",{"a":"Mliu92","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Spur_gear_tooth_dims.svg"}]],["モジュールはピッチ円直径と歯数でどう表されるか？","モジュール ＝ ピッチ円直径 ÷ 歯数","モジュール ＝ 歯数 ÷ ピッチ円直径","モジュール ＝ ピッチ円半径 ÷ 歯数","モジュール ＝ ピッチ円直径 × 歯数","モジュールmは歯の大きさを表す値で、m＝ピッチ円直径d÷歯数z。モジュールが大きいほど歯が大きく強い。かみ合う2つの歯車は、モジュールが同じでなければならない。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/gear/basic.jsp","歯車の基礎知識（キーエンス）",["分子と分母が逆。この式は歯数÷直径で、直径1mmあたりの歯数を表すことになり、歯の大きさを表すモジュールにならない。","ピッチ円半径を使うと値が正しいモジュールの半分になる。モジュールの定義は直径を歯数で割ったもの。","直径と歯数を掛けると、歯の大きさとは無関係な大きな値になる。モジュールは直径を歯数で割って求める。"],"https://www.youtube.com/watch?v=Rb19bKAKeEU","機械要素 歯車の基礎編","",["x:mech2_19","歯車各部の名称（ピッチ円直径d＝zm）"]],["歯車のかみ合いで、ピッチ円周方向の若干の隙間を何というか？","バックラッシ","クリアランス","頂げき","ピッチ誤差","バックラッシは、かみ合う歯車の歯と歯の間に設ける、ピッチ円周方向のわずかなすき間。熱膨張や加工誤差、潤滑油膜のために必要。大きすぎると逆回転時のがたや騒音の原因になるため、精密な位置決めではバックラッシの小さい歯車を使う。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/gear/basic.jsp","歯車の基礎知識（キーエンス）",["クリアランスは、一般にすき間全般を指す言葉。歯車ではピッチ円周方向のすき間を特にバックラッシと呼ぶ。","頂げきは、一方の歯先と相手歯車の歯底との間の半径方向のすき間。ピッチ円周方向のすき間ではない。","ピッチ誤差は、歯の間隔が理論値からずれている加工誤差。意図して設けるすき間ではない。"],"https://www.youtube.com/watch?v=Rb19bKAKeEU","機械要素 歯車の基礎編","",["x:mech2_20","歯車のかみ合いとバックラッシ"]],["図面にコイルばねを示すときは、どのような荷重状態で表すか？","無荷重の状態","最大荷重の状態","使用荷重の状態","密着した状態","コイルばねは、原則として荷重がかかっていない（無荷重の）状態で図示する。荷重をかけた状態で描く場合は、その荷重を図に明記する。ばねの寸法・特性は要目表に記入するのが一般的。","https://d-engineer.com/seizu/seizusen.html","製図に用いる線（MONOWEB）",["最大荷重の状態は、ばねの特性として要目表に記入する値。図示の原則となる状態ではない。","使用荷重の状態で描く場合は、その荷重を図に明記する必要がある。原則として図示に使う状態ではない。","密着した状態は、ばねがこれ以上縮まない限界の状態（密着高さ）。図示の原則とする状態ではない。"],"https://www.youtube.com/watch?v=JifqYyze3IE","【製図基礎講座】図面における『線』の使い分け",""],["自在軸継手は別名で何と呼ばれるか？","ユニバーサルジョイント","オルダム継手","フランジ継手","ギヤカップリング","ユニバーサルジョイント（自在軸継手）は、交わる2軸の角度が変わっても回転を伝えられる継手。フックの継手が代表的で、自動車のプロペラシャフトなどに使われる。1個だけでは回転むらが出るため、2個組み合わせて等速にする。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0011.html","カップリングの基礎知識（ミスミ技術情報）",["オルダム継手は、平行でわずかにずれた2軸をつなぐ継手。軸どうしが角度をもって交わる場合に使う自在軸継手とは別物。","フランジ継手は、両軸の端のフランジをボルトで締結する固定式の継手。軸の角度変化には対応できない。","ギヤカップリングは、外歯と内歯のかみ合いでトルクを伝える継手。わずかな芯ずれは許容するが、自在軸継手の別名ではない。"],"https://www.youtube.com/watch?v=LS4IUvuBkuI","第43回 軸と軸受【MONOWEB 機械要素編】","",["x:mech2_22","自在軸継手（ユニバーサルジョイント）"]],["回転中に両方の軸の接続や切り離しができる要素を何というか？","クラッチ","カップリング","ブレーキ","キー","クラッチは、回転中でも2本の軸をつないだり切り離したりできる機械要素。摩擦クラッチ、かみ合いクラッチ、電磁クラッチなどがある。常に軸どうしをつないでおく軸継手（カップリング）とは役割が違う。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0011.html","カップリングの基礎知識（ミスミ技術情報）",["カップリング（軸継手）は、2本の軸を常につないでおく要素。回転中に接続や切り離しはできない。","ブレーキは、回転体の運動を止めたり減速させたりする要素。軸どうしをつないだり切り離したりするものではない。","キーは、軸に歯車やプーリを固定してトルクを伝える要素。回転中の接続・切り離しはできない。"],"https://www.youtube.com/watch?v=LS4IUvuBkuI","第43回 軸と軸受【MONOWEB 機械要素編】","",["w:026_0","摩擦クラッチの構造（ばねで摩擦板を押し付け）",{"a":"Sweber.de","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Cone_clutch.svg"}]],["軸に歯車やプーリなどを締結するために使われる要素を何というか？","キー","ピン","コッタ","カラー","キーは、軸とボス（歯車・プーリの穴部）の両方に掘ったキー溝にはめ込み、回転トルクを伝える機械要素。平行キー、勾配キー、半月キーなどがある。軸方向の位置決めには止め輪やカラーを使う。","https://jp.meviy.misumi-ec.com/info/ja/howto/mech-design/20342/","機械要素の基本！軸、ベアリング、キー、ピンのはたらき（meviy）",["ピンは、部品の位置決めや軽い荷重の連結に使う要素。大きなトルクを伝えて歯車やプーリを軸に締結する主役ではない。","コッタは、くさび形の板で2本の棒を軸方向に連結する要素。軸と歯車の回転方向の締結には使わない。","カラーは、軸にはめて部品の軸方向の位置を決める筒状の部品。トルクを伝える締結要素ではない。"],"https://www.youtube.com/watch?v=9qSQAlfbxNg","カップリングの製作（キー溝加工まで）","",["x:mech2_24","沈みキー・平キーなどキーの種類"]],["大きなトルクを伝えるため、キーの数を増やした形式を何というか？","スプライン","セレーション","ローレット","コッタ","スプラインは、軸の外周に多数のキーを一体に削り出した形状で、ボス側の溝とかみ合ってトルクを伝える。キー1本より大きなトルクを伝えられ、ボスを軸方向に滑らせることもできる。自動車の変速機などに使われる。","https://jp.meviy.misumi-ec.com/info/ja/howto/mech-design/20342/","機械要素の基本！軸、ベアリング、キー、ピンのはたらき（meviy）",["セレーションは、スプラインより細かい三角歯を多数並べたもの。取り付け角度の微調整が主な目的で、キーの数を増やした形式とは呼ばない。","ローレットは、つまみなどの表面に付ける滑り止めの凹凸加工。トルク伝達用の要素ではない。","コッタは、くさびで2本の棒を軸方向につなぐ要素。キーを増やしてトルクを伝える形式ではない。"],"https://www.youtube.com/watch?v=9qSQAlfbxNg","カップリングの製作（キー溝加工まで）","",["x:mech2_25","スプラインとセレーションの断面"]],["スプラインの歯の数をさらに多くした（細かくした）ものは？","セレーション","ローレット","スプライン","ラック","セレーションは、スプラインより細かい三角形の歯を軸の周囲に多数並べたもの。歯数が多いので取り付け角度を細かく調整でき、小径の軸でもトルクを伝えられる。ハンドルやレバーの取り付けなどに使われる。","https://jp.meviy.misumi-ec.com/info/ja/howto/mech-design/20342/","機械要素の基本！軸、ベアリング、キー、ピンのはたらき（meviy）",["ローレットは、表面に滑り止めの細かい凹凸を付ける加工。スプラインの歯を細かくしたものではない。","スプラインは、セレーションの元になる、軸に複数のキーを一体にした形状。歯数をさらに多くしたものではない。","ラックは、歯を直線状に並べた棒状の歯車で、ピニオンと組み合わせて回転を直線運動に変える。軸の締結要素ではない。"],"https://www.youtube.com/watch?v=9qSQAlfbxNg","カップリングの製作（キー溝加工まで）",""],["軸受の2種類はどれか？","すべり軸受、転がり軸受","ラジアル軸受、ボール軸受","玉軸受、ころ軸受","スラスト軸受、ニードル軸受","軸受は、軸と面で接して油膜などで支えるすべり軸受と、玉やころを介して支える転がり軸受に大別される。すべり軸受は高荷重・高速・衝撃に強く静か、転がり軸受は起動時の摩擦が小さく交換しやすい。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/g0016.html","ボールベアリング（転がり軸受）と滑り軸受の違い（ミスミ技術情報）",["ラジアル軸受は荷重の方向による分類、ボール軸受は転動体による分類。分類の基準が混ざっており、大別の2種類ではない。","玉軸受ところ軸受は、どちらも転がり軸受を転動体の形で分けたもの。すべり軸受が含まれていない。","スラスト軸受は荷重方向の分類、ニードル軸受は転がり軸受の一種。軸受を大きく二分する組み合わせではない。"],"https://www.youtube.com/watch?v=5yAYcKDZrEA","機械エンジニアが知っておきたい機械要素【軸受】","",["x:mech2_27","すべり軸受と転がり軸受の構造"]],["軸と軸受に油を塗り、ジャッキやプレスでゆっくり押し込む取付け方法は？","圧入","焼ばめ","冷やしばめ","すきまばめ","圧入は、常温のまま軸と穴に潤滑油を塗り、プレスやジャッキで力を加えてゆっくり押し込む取り付け方法。しまりばめの部品を組み立てる基本的な方法。ハンマで叩くと軸受の転動体や軌道面を傷めるため避ける。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/g0016.html","ボールベアリング（転がり軸受）と滑り軸受の違い（ミスミ技術情報）",["焼ばめは、穴側の部品を加熱膨張させてから軸を入れる方法。常温で押し込む方法ではない。","冷やしばめは、軸側をドライアイスや液体窒素で冷やして縮め、穴に入れる方法。プレスで押し込む方法とは異なる。","すきまばめは、常にすき間ができるはめあいの種類。押し込みが不要で、取り付け方法の名称でもない。"],"https://www.youtube.com/watch?v=5yAYcKDZrEA","機械エンジニアが知っておきたい機械要素【軸受】",""],["約100℃に熱した油で軸受を加熱膨張させ、そこへ軸を入れる方法は？","焼ばめ","圧入","冷やしばめ","ろう付け","焼ばめは、軸受など穴側の部品を加熱して膨張させ、穴を広げた状態で軸を入れる方法。冷えると縮んで強く締まる。軸受では油で100℃前後に加熱するのが一般的。逆に軸を冷やして縮めてはめる方法を冷やしばめという。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/g0016.html","ボールベアリング（転がり軸受）と滑り軸受の違い（ミスミ技術情報）",["圧入は、常温のままプレスやジャッキで押し込む方法。軸受を加熱して膨張させる工程はない。","冷やしばめは、軸側を冷却して縮めてからはめる方法。軸受を加熱するのではない。","ろう付けは、母材より融点の低いろうを溶かして部品を接合する方法。はめあいによる取り付けではない。"],"https://www.youtube.com/watch?v=5yAYcKDZrEA","機械エンジニアが知っておきたい機械要素【軸受】",""],["ベルトを巻きかけて動力を伝達するための車を何というか？","プーリ","スプロケット","ピニオン","カム","プーリ（ベルト車）は、ベルトを巻きかけて回転と動力を伝える車。平ベルト用、Vベルト用、歯付きベルト（タイミングベルト）用がある。チェーンを掛ける歯車はスプロケット。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/gear/belt-chain-basic.jsp","ベルト・チェーンの基礎知識（キーエンス）",["スプロケットは、チェーンを掛けて動力を伝える歯車。ベルトを巻きかける車ではない。","ピニオンは、かみ合う一対の歯車のうち小さい方、またはラックと組む小歯車。ベルトとは使わない。","カムは、特殊な輪郭で従動節に周期的な往復運動などを与える機械要素。ベルトを巻きかける車ではない。"],"https://www.youtube.com/watch?v=e1iEdnsss7c","プーリー間のアライメント作業の手順",""],["固定節と複数の棒を回り対偶でつなぎ、運動を伝える機構の各棒を何というか？","リンク","カム","クランク軸","ラック","リンク機構は、複数の棒（リンク、節）をピンなどで回転できるようにつないだ機構で、回転運動を揺動運動や往復運動に変えるのに使う。4本の節でできた4節リンク機構が基本形。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/link/type.jsp","リンクの機構と種類（キーエンス）",["カムは、特殊な輪郭の回転体で従動節に決まった運動を与える要素。棒を回り対偶でつないだ機構の各棒ではない。","クランク軸は、往復運動と回転運動を変換するエンジンなどの軸。リンク機構の構成要素の一つにすぎず、各棒の総称ではない。","ラックは、歯を直線状に並べた棒状の歯車。ピンでつないだ棒の機構を構成する要素ではない。"],"https://www.youtube.com/watch?v=Rmc6volTtzo","ストローと段ボールで作る「てこクランク機構」","",["w:042_2","四節リンク機構の例（てこクランク・両てこ・平行クランク）",{"a":"derivative work: すじにくシチュー","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Linkage_four_bar-2-jp.svg"}]],["てこクランク機構で、回転する主動節と揺動運動する従動節をそれぞれ何というか？","回転する節＝クランク、揺動する節＝てこ","回転する節＝てこ、揺動する節＝クランク","回転する節＝連接棒、揺動する節＝固定節","回転する節＝スライダ、揺動する節＝クランク","てこクランク機構では、1回転できる節を「クランク」、一定の角度の範囲を往復揺動する節を「てこ（レバー）」と呼ぶ。両者をつなぐ節が連接棒（コネクティングロッド）、動かない節が固定節。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/link/type.jsp","リンクの機構と種類（キーエンス）",["名称が逆。てこクランク機構では、1回転できる節をクランク、一定角度で揺動する節をてこと呼ぶ。","連接棒は主動節と従動節をつなぐ中間の節、固定節は動かない節。回転する節と揺動する節の名称ではない。","スライダは直線上を往復する節で、スライダクランク機構に現れる。てこクランク機構の回転する節ではない。"],"https://www.youtube.com/watch?v=Rmc6volTtzo","ストローと段ボールで作る「てこクランク機構」","",["x:mech2_32","てこクランク機構のクランクとてこ"]],["4節リンクで最も短いリンクを固定して、他のリンクを動かす機構を何というか？","両クランク機構","てこクランク機構","両てこ機構","スライダクランク機構","4節リンクで最も短いリンクを固定すると、隣の2つのリンクがどちらも1回転でき、両クランク機構になる。どのリンクを固定するかで運動が変わり、最短リンクの隣を固定するとてこクランク機構、向かい側を固定すると両てこ機構になる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/link/type.jsp","リンクの機構と種類（キーエンス）",["てこクランク機構は、最短リンクの隣のリンクを固定したときにできる。最短リンクそのものを固定した場合ではない。","両てこ機構は、最短リンクの向かい側のリンクを固定したときにでき、2つのリンクがともに揺動する。","スライダクランク機構は、4節リンクの1本を無限長にして直線の滑り面に置き換えたもの。最短リンクの固定で得られる機構ではない。"],"https://www.youtube.com/watch?v=Rmc6volTtzo","ストローと段ボールで作る「てこクランク機構」","",["x:mech2_33","両クランク機構（最短リンクを固定）"]],["4節リンクで向かい合うリンクの長さが等しいものを何というか？","平行リンク","両てこ機構","早戻り機構","トグル機構","平行リンクは、向かい合うリンクの長さが等しく、常に平行四辺形を保ったまま動く4節リンク。動く節が平行移動するため、製図台のアームや機関車の連結棒などに使われる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/link/type.jsp","リンクの機構と種類（キーエンス）",["両てこ機構は、最短リンクの向かい側を固定して2つのリンクが揺動する機構。向かい合うリンクの長さが等しいことが条件ではない。","早戻り機構は、往きの行程より戻りの行程が速くなる機構で、形削り盤などに使う。リンクの長さが等しいことを指す名称ではない。","トグル機構は、リンクが一直線に近づくと小さな力で大きな力が得られる機構。プレスなどに使われ、平行四辺形を保つ機構ではない。"],"https://www.youtube.com/watch?v=Rmc6volTtzo","ストローと段ボールで作る「てこクランク機構」","",["x:mech2_34","平行リンク機構"]],["1つのリンクを無限大の長さにすると往復直線運動を行う。この機構を何というか？","ピストン・クランク機構","両クランク機構","早戻り機構","ゼネバ機構","ピストン・クランク機構（スライダクランク機構）は、4節リンクの1本を無限に長くしたもので、そのリンクが直線の滑り面に置き換わる。エンジンのピストンとクランク軸がこれで、往復運動と回転運動を変換する。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/link/type.jsp","リンクの機構と種類（キーエンス）",["両クランク機構は、最短リンクを固定して2つのリンクがともに回転する機構。往復直線運動は生じない。","早戻り機構は、戻りの行程を速くして作業時間を短縮する機構。リンクを無限長にした機構の名称ではない。","ゼネバ機構は、連続回転を間欠的な回転に変える機構。映写機などに使われ、往復直線運動は生じない。"],"https://www.youtube.com/watch?v=Rmc6volTtzo","ストローと段ボールで作る「てこクランク機構」","",["x:mech2_35","ピストン・クランク機構"]],["摩擦の3種類はどれか？","すべり摩擦、ころがり摩擦、流体摩擦","静摩擦、動摩擦、転がり摩擦","固体摩擦、境界摩擦、空気摩擦","乾燥摩擦、湿潤摩擦、粘性摩擦","摩擦は、物体どうしが滑るすべり摩擦、転がるころがり摩擦、潤滑油などの流体を介する流体摩擦に分けられる。一般に、すべり摩擦＞ころがり摩擦＞流体摩擦の順に摩擦抵抗は小さくなる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/bearing/lubrication.jsp","軸と軸受（ベアリング）の潤滑（キーエンス）",["静摩擦と動摩擦は、止まっているか動いているかの区別。すべり・ころがり・流体という分け方とは基準が異なる。","固体摩擦や境界摩擦は潤滑状態に関係する呼び方で、空気摩擦は一般的な分類名ではない。摩擦の3種類の組み合わせではない。","乾燥摩擦・湿潤摩擦・粘性摩擦は、潤滑の有無などによる別の言い方。摩擦を接触の仕方で3つに分ける分類ではない。"],"https://www.youtube.com/watch?v=9nz2_M9gVqg","グリスと潤滑油の違いを完全理解！","",["x:mech2_36","すべり摩擦・ころがり摩擦・流体摩擦"]],["油と添加剤に増ちょう剤を加えた半固体潤滑剤を何と呼ぶか？","グリース","マシン油","固体潤滑剤","作動油","グリースは、潤滑油に添加剤と増ちょう剤（金属石けんなど）を加えて半固体状にした潤滑剤。流れ出しにくく密封しやすいので、転がり軸受など給油しにくい場所に使われる。高速回転では発熱しやすいため油潤滑を使う。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/bearing/lubrication.jsp","軸と軸受（ベアリング）の潤滑（キーエンス）",["マシン油は、機械の一般的な潤滑に使う液体の潤滑油。増ちょう剤を含まず、半固体ではない。","固体潤滑剤は、二硫化モリブデンや黒鉛など固体そのものの潤滑剤。油に増ちょう剤を加えたものではない。","作動油は、油圧装置で動力を伝える液体。増ちょう剤を加えた半固体ではない。"],"https://www.youtube.com/watch?v=9nz2_M9gVqg","グリスと潤滑油の違いを完全理解！",""],["大修理のことを何というか？","オーバーホール","メンテナンス","リコール","レトロフィット","オーバーホールは、機械を分解して全面的に点検・清掃・部品交換・調整を行い、新品に近い状態に戻す大修理。エンジン、ポンプ、航空機などで定期的に行われる。","https://monoto.co.jp/sp-iot-sensor/","知っておきたい予防保全と予知保全（monoto）",["メンテナンスは、点検・清掃・修理などを含む保守全般を指す言葉。全面的な分解による大修理に限定した呼び名ではない。","リコールは、欠陥製品をメーカーが回収・無償修理する制度。機械の大修理を指す言葉ではない。","レトロフィットは、既存設備に新しい機能や部品を追加して改修・近代化すること。大修理そのものの名称ではない。"],"https://www.youtube.com/watch?v=aqc89KuQrBE","保全活動総まとめ！バスタブ曲線との対応も解説",""],["機械設備にトラブルが生じた後で修理する保全を何というか？","事後保全","予防保全","予知保全","改良保全","事後保全（BM：Breakdown Maintenance）は、故障や不具合が起きてから修理する保全方式。故障しても影響が小さい設備では、保全費を抑えられ合理的なこともある。重要設備では予防保全と組み合わせる。","https://monoto.co.jp/sp-iot-sensor/","知っておきたい予防保全と予知保全（monoto）",["予防保全は、故障が起きる前に決まった周期で点検や部品交換を行う保全。トラブル後の修理ではない。","予知保全は、設備の状態を監視・診断して、故障の兆候が出たときに手を打つ保全。故障後に修理する方式ではない。","改良保全は、故障しにくいよう設備そのものを改善する保全。故障後に元の状態へ戻す修理とは目的が違う。"],"https://www.youtube.com/watch?v=aqc89KuQrBE","保全活動総まとめ！バスタブ曲線との対応も解説",""],["トラブルが発生する前に予防的に部品を新しく交換する保全を何というか？","予防保全","事後保全","改良保全","保全予防","予防保全（PM：Preventive Maintenance）は、故障が起こる前に、決められた時間や使用量で点検・部品交換を行う保全方式。設備の状態を診断して必要なときに手を打つものは予知保全（状態基準保全）という。","https://monoto.co.jp/sp-iot-sensor/","知っておきたい予防保全と予知保全（monoto）",["事後保全は、故障が起きてから修理する保全。事前に部品を交換する方式ではない。","改良保全は、故障の原因を取り除くため設備の構造などを改善する保全。部品を定期的に交換する方式ではない。","保全予防は、設計段階から保全しやすく故障しにくい設備にする活動。運用中に部品を予防交換する保全とは別。"],"https://www.youtube.com/watch?v=aqc89KuQrBE","保全活動総まとめ！バスタブ曲線との対応も解説",""],["製造物責任法は略して何と呼ばれるか？","PL法","PM法","ISO法","JIS法","PL法（製造物責任法、Product Liability）は、製品の欠陥によって人の生命・身体・財産に損害が生じた場合、製造業者に過失がなくても賠償責任を負わせる法律。設計段階から安全性を確保することが求められる。","https://www.caa.go.jp/policies/policy/consumer_safety/other/pl_qa.html","製造物責任法の概要Q&A（消費者庁）",["PMはPreventive Maintenance（予防保全）の略として使われる。製造物責任法の略称ではない。","ISOは国際標準化機構とその国際規格を指す。法律ではなく、製造物責任法の略称でもない。","JISは日本産業規格。工業製品の規格を定めたもので、製造物責任を定めた法律ではない。"],"https://www.youtube.com/watch?v=8A4QUrDKpqQ","製造物責任法(PL法)について",""],["時間とともに機械設備の故障発生の割合がどう変化するかを示した曲線は？","故障率曲線","S-N曲線","ローレンツ曲線","学習曲線","故障率曲線は、時間の経過とともに故障率がどう変わるかを示した曲線。初期故障期（製造不良などで故障率が高く徐々に下がる）、偶発故障期（低く一定）、摩耗故障期（劣化で上がる）の3期に分かれる。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl06/c0494.html","金型の故障期（ミスミ技術情報）",["S-N曲線は、材料にかかる繰り返し応力の大きさと破断までの繰り返し数の関係を示す曲線。疲労強度の評価に使う。","ローレンツ曲線は、所得などの分布の偏りを表す経済学の曲線。設備の故障率の変化とは関係ない。","学習曲線は、作業の経験を重ねるほど時間やコストが下がる関係を示す曲線。故障の発生割合は表さない。"],"https://www.youtube.com/watch?v=6CWMxmlrj4g","ワイブル分布とバスタブ曲線の関係","",["x:mech2_42","故障率曲線（バスタブカーブ）"]],["絞り加工の絞り率の公式は？","絞り率 ＝ パンチ直径 ÷ ブランク直径","絞り率 ＝ ブランク直径 ÷ パンチ直径","絞り率 ＝ 板厚 ÷ パンチ直径","絞り率 ＝ ダイ直径 ÷ パンチ直径","絞り率m＝パンチ直径d÷ブランク直径D。値が小さいほど1回で深く絞ることになり、割れやしわが出やすい。一度で絞れる限界（限界絞り率）を超える場合は、何回かに分けて再絞りを行う。逆数のD/dは絞り比という。","https://monoto.co.jp/deepdrawing/","絞り加工とは？工程とさまざまな絞り加工（monoto）",["分子と分母が逆。ブランク直径÷パンチ直径は絞り比と呼ばれ、絞り率の逆数にあたる。","板厚÷パンチ直径は、板の厚さの比率を表す値。絞りの程度を表す絞り率ではない。","ダイ直径とパンチ直径の差はクリアランスに関係する値。絞り率はブランク直径に対するパンチ直径の比で表す。"],"https://www.youtube.com/watch?v=iBtr5X_wYXM","プレス機による絞り加工","",["x:mech2_43","絞り加工のブランク直径とパンチ直径"]],["絞り加工で加工品を作るのに必要な素材（切り出した板）を何と呼ぶか？","ブランク","プリフォーム","ビレット","インゴット","ブランクは、絞り加工や曲げ加工の素材として、板から必要な形状に切り出した平板。ブランクの寸法は、製品の表面積と等しくなるように計算して決める。ビレットは押出しや鍛造の素材、インゴットは鋳造した金属の塊。","https://monoto.co.jp/deepdrawing/","絞り加工とは？工程とさまざまな絞り加工（monoto）",["プリフォームは、最終形状に成形する前の中間形状の素材。板から切り出した平板を指す名称ではない。","ビレットは、押出しや鍛造などに使う棒状の素材。絞り加工用の平板ではない。","インゴットは、溶かした金属を鋳型に流して固めた塊。圧延などの原料で、切り出した板ではない。"],"https://www.youtube.com/watch?v=iBtr5X_wYXM","プレス機による絞り加工",""],["絞り加工のうち、クリアランスを板厚以下にして板厚を均一に薄く成形する方法は？","しごき加工","深絞り加工","張出し加工","スピニング加工","しごき加工（アイアニング）は、パンチとダイのクリアランスを板厚より小さくして、絞った容器の側壁を引き延ばし、薄く均一な厚さに仕上げる加工。飲料缶の胴部の製造に使われる。","https://monoto.co.jp/deepdrawing/","絞り加工とは？工程とさまざまな絞り加工（monoto）",["深絞り加工は、平板から深い容器を成形する加工。一般にクリアランスは板厚より大きくとり、板厚を均一に薄くすることが目的ではない。","張出し加工は、板の周囲を押さえたまま中央を張り出させ、板を伸ばして凸形状を作る加工。クリアランスで板厚をしごくものではない。","スピニング加工は、回転する型に板を押し当て、へらで少しずつ成形する加工。ダイとのクリアランスで壁を薄くする加工ではない。"],"https://www.youtube.com/watch?v=iBtr5X_wYXM","プレス機による絞り加工","",["x:mech2_45","しごき加工で板厚を薄く成形する様子"]],["2条ねじのリードはピッチを用いるとどう表されるか？","ピッチ × 2","ピッチ ÷ 2","ピッチ × 3","ピッチと同じ","2条ねじは、ねじ山が2本並んで巻かれたねじで、1回転で2ピッチ分進む。リード＝ピッチ×条数なので、ピッチ×2。早く締めたり送ったりしたい場所に使われる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["ピッチ÷2では1回転で半ピッチしか進まないことになる。条数が増えるとリードは大きくなるので逆。","ピッチ×3は3条ねじのリード。2条ねじの場合には当てはまらない。","リードがピッチと同じになるのは1条ねじの場合。2条ねじは1回転で2ピッチ進む。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編","",["w:114_0","1条・2条・3条ねじのリードとピッチの関係",{"a":"Unknown authorUnknown author","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Lead_and_pitch_in_screws.png"}]],["ダイスを回転させながら素材に押し当て、ねじ形状を工具から素材に転写する加工を何というか？","転造加工","切削加工","研削加工","鍛造加工","転造加工は、ねじ形状をもつ工具（転造ダイス）を素材に押し当てながら回転させ、塑性変形でねじ山を作る加工。切りくずが出ず、材料の繊維が切れないため強度が高く、量産に向く。ボルトの多くは転造で作られる。","https://d-engineer.com/kikaikakou/tenzou.html","転造とは（MONOWEB）",["切削加工は、刃物で素材を削り取って形を作る加工。切りくずが出て、工具の形を押し付けて転写する加工ではない。","研削加工は、砥石で表面を少しずつ削って仕上げる加工。塑性変形でねじ山を作る加工ではない。","鍛造加工は、ハンマやプレスで素材を叩いて成形する加工。回転するダイスでねじを転写する加工ではない。"],"https://www.youtube.com/watch?v=sCKlaBb1iPo","【ねじ転造】旋盤での300mm長尺ねじ転造加工","",["x:mech2_47","転造ダイスによるねじの転造"]],["一定断面形状の金型から押し出して、長い同一断面の部品を製造する加工は？","押出し加工","引抜き加工","圧延加工","鍛造加工","押出し加工は、加熱した素材（ビレット）をコンテナに入れて強い力で押し、ダイスの穴から押し出して、一定断面の長い製品を作る加工。アルミサッシや異形の棒・管などに使われる。ダイスの穴から引っ張り出すのは引抜き加工。","https://monoto.co.jp/extrusion/","押出し加工とは？メリットと分類（monoto）",["引抜き加工は、素材をダイスの穴から引っ張り出して細くする加工。押し出すのではなく引き抜く点が違う。","圧延加工は、回転する2本のロールの間に素材を通して薄く・細くする加工。金型から押し出す加工ではない。","鍛造加工は、素材を叩いたり押しつぶしたりして成形する加工。一定断面の長い製品を連続して作る加工ではない。"],"https://www.youtube.com/watch?v=PLgvcwUrS8Y","【アルミ押出し技術解説】想像を超えるアルミ押出し技術","",["w:005_0","押出し加工で作られたアルミ形材（ヒートシンク等）",{"a":"Ulfbastel","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Strangkkp.jpg"}]],["放電加工（型彫り）で、電極の材質に使われるものは？","銅、グラファイト","黄銅、タングステン","鉄、アルミニウム","超硬合金、ダイヤモンド","型彫り放電加工では、電極を加工したい形状に作り、工作物との間に放電を繰り返して形状を転写する。電極材料には加工しやすく消耗の少ない銅やグラファイト（黒鉛）が使われる。焼入れ鋼など硬い材料でも加工できる。","https://jp.meviy.misumi-ec.com/info/ja/howto/31685/","放電加工とは？種類やメリット・デメリット（meviy）",["黄銅はワイヤ放電加工の電極に使う材料、タングステンは高融点で特殊な電極に使われることがある。型彫り電極の代表的な組み合わせではない。","鉄やアルミニウムは電極として消耗が大きいなど不向きで、型彫り放電加工の電極材料として一般的ではない。","超硬合金やダイヤモンドは切削工具の材料。加工しにくく、型彫り放電加工の電極には使わない。"],"https://www.youtube.com/watch?v=RPUJolJsdC0","放電加工とは？～放電加工の原理～",""],["ワイヤ放電加工では何が電極に使われるか？","黄銅","グラファイト","タングステンカーバイド","ステンレス鋼","ワイヤ放電加工では、直径0.1〜0.3mm程度の細い黄銅ワイヤを電極にし、ワイヤを送りながら糸のこのように工作物を切り抜く。電極が常に新しく供給されるため、電極の消耗を気にせず精密な加工ができる。","https://jp.meviy.misumi-ec.com/info/ja/howto/31685/","放電加工とは？種類やメリット・デメリット（meviy）",["グラファイトは型彫り放電加工の電極材料。細いワイヤに加工できないため、ワイヤ放電加工には使わない。","タングステンカーバイドは超硬合金の主成分で、切削工具などに使われる。ワイヤ放電加工の電極材料ではない。","ステンレス鋼は、電極として導電性や放電特性が劣り、ワイヤ放電加工の電極には使われない。"],"https://www.youtube.com/watch?v=RPUJolJsdC0","放電加工とは？～放電加工の原理～","",["x:mech2_50","ワイヤ放電加工機の構成"]],["最も高出力が出せるレーザーとされるのは？","炭酸ガスレーザー","YAGレーザー","半導体レーザー","ヘリウムネオンレーザー","炭酸ガス（CO₂）レーザーは、高出力を得やすく効率もよいため、板金の切断や溶接などの加工用に広く使われる。YAGレーザーやファイバーレーザーは波長が短く光ファイバで伝送しやすい。半導体レーザーは小型だが単体の出力は小さい。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/18931/","レーザー加工とは？仕組み・種類（meviy）",["YAGレーザーは、波長が短く光ファイバで伝送できる固体レーザー。溶接やマーキングに使うが、出力の大きさでは炭酸ガスレーザーに及ばない。","半導体レーザーは小型で効率がよいが、単体の出力は小さい。最も高出力のレーザーとはされない。","ヘリウムネオンレーザーは出力が数mW程度と非常に小さい気体レーザー。測定や位置合わせに使われ、加工には使わない。"],"https://www.youtube.com/watch?v=zH3eJ1ZYVMY","レーザ切断の3つの魅力＆事例紹介",""],["与えられた図示サイズに対して許される最大値と最小値の幅を何というか？","サイズ公差","はめあい","幾何公差","基準寸法","サイズ公差は、上の許容サイズと下の許容サイズの差で、図示サイズに対して許される寸法の幅。公差が小さいほど高精度だが、加工コストは上がる。形状や位置の精度を指定するのは幾何公差。","https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/basic/fit.jsp","はめあいとは？（キーエンス）",["はめあいは、穴と軸を組み合わせたときのすき間やしめしろの関係。1つの寸法に許される幅そのものではない。","幾何公差は、真直度や平行度など形状・姿勢・位置の精度を指定する公差。寸法の最大値と最小値の幅ではない。","基準寸法は、公差を与える基準となる寸法で、現在は図示サイズと呼ぶ。許される幅ではない。"],"https://www.youtube.com/watch?v=KNMOpy5aXtQ","サイズ公差とはめあい（機械図面の読み方）","",["x:mech2_52","図示サイズ・許容差・サイズ公差の関係"]],["はめあいで、①常にすきま、②常にしめしろ、③すきまもしめしろも生じうる、の名称は？","①すきまばめ ②しまりばめ ③中間ばめ","①中間ばめ ②しまりばめ ③すきまばめ","①しまりばめ ②すきまばめ ③中間ばめ","①すきまばめ ②中間ばめ ③しまりばめ","すきまばめは常にすき間ができ、軸が回ったり滑ったりする部分に使う。しまりばめは常にしめしろができ、圧入や焼ばめで固定する部分に使う。中間ばめは寸法によってすき間にもしめしろにもなり、位置決めピンなどに使う。","https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/basic/fit.jsp","はめあいとは？（キーエンス）",["①と③が入れ替わっている。常にすき間ができるのはすきまばめ、どちらも生じうるのが中間ばめ。","①と②が入れ替わっている。常にすき間ができるのがすきまばめ、常にしめしろができるのがしまりばめ。","②と③が入れ替わっている。常にしめしろができるのはしまりばめ、どちらも生じうるのが中間ばめ。"],"https://www.youtube.com/watch?v=KNMOpy5aXtQ","サイズ公差とはめあい（機械図面の読み方）","",["x:mech2_53","すきまばめ・中間ばめ・しまりばめ"]],["すべり軸受で、半径方向の荷重を支えるもの・軸方向の荷重を支えるものの名称は？","ラジアル軸受、スラスト軸受","スラスト軸受、ラジアル軸受","ジャーナル軸受、ボール軸受","アンギュラ軸受、ニードル軸受","半径方向（軸に直角）の荷重を支える軸受をラジアル軸受、軸方向の荷重を支える軸受をスラスト軸受という。すべり軸受でも転がり軸受でも同じ呼び方をする。両方の荷重を受けられる軸受もある（アンギュラ玉軸受など）。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/g0016.html","ボールベアリング（転がり軸受）と滑り軸受の違い（ミスミ技術情報）",["順番が逆。半径方向の荷重を支えるのがラジアル軸受、軸方向の荷重を支えるのがスラスト軸受。","ジャーナル軸受はラジアル荷重を受けるすべり軸受の別名だが、ボール軸受は転がり軸受の一種で、軸方向荷重を受ける軸受の名称ではない。","アンギュラ軸受やニードル軸受は転がり軸受の種類。荷重の方向で分けたすべり軸受の名称ではない。"],"https://www.youtube.com/watch?v=5yAYcKDZrEA","機械エンジニアが知っておきたい機械要素【軸受】",""],["すべり軸受で回転数が増すにつれて変わる潤滑状態の順として正しいものは？","固体潤滑 → 境界潤滑 → 流体潤滑","流体潤滑 → 境界潤滑 → 固体潤滑","境界潤滑 → 固体潤滑 → 流体潤滑","固体潤滑 → 流体潤滑 → 境界潤滑","すべり軸受では、回転が遅いと軸と軸受が直接触れる固体潤滑、回転が上がると薄い油膜が部分的にできる境界潤滑、さらに上がると油膜だけで軸を浮かせて支える流体潤滑に変わる。流体潤滑では摩擦が非常に小さくなる（ストライベック曲線）。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/g0016.html","ボールベアリング（転がり軸受）と滑り軸受の違い（ミスミ技術情報）",["順番が逆。回転数が上がるほど油膜が厚くなり、固体潤滑から流体潤滑の方向へ移る。","境界潤滑と固体潤滑の順が逆。低速では直接接触する固体潤滑が先で、境界潤滑はその次の段階。","境界潤滑と流体潤滑の順が逆。回転数が上がると、部分的な油膜の境界潤滑を経て流体潤滑になる。"],"https://www.youtube.com/watch?v=5yAYcKDZrEA","機械エンジニアが知っておきたい機械要素【軸受】","",["x:mech2_55","回転数と潤滑状態（固体→境界→流体）"]],["動力伝達に使われる、加工が容易で滑らかに動く歯車は？","インボリュート歯車","サイクロイド歯車","ウォームギヤ","ゼネバ歯車","インボリュート歯車は、糸巻きから糸をほどくときに糸の端が描く曲線（インボリュート曲線）を歯形にした歯車。加工が容易で、中心距離が多少ずれても滑らかにかみ合うため、動力伝達用歯車の大部分を占める。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/gear/basic.jsp","歯車の基礎知識（キーエンス）",["サイクロイド歯車は、すべりが少なく摩耗しにくいが、中心距離のずれに弱く加工も難しい。主に時計などに使われる。","ウォームギヤは、ねじ状のウォームとホイールで大きな減速比を得る歯車。滑りが大きく効率は低めで、加工容易な一般歯車の代表ではない。","ゼネバ歯車（ゼネバ機構）は、連続回転を間欠回転に変える機構。滑らかな動力伝達を目的としたものではない。"],"https://www.youtube.com/watch?v=Rb19bKAKeEU","機械要素 歯車の基礎編","",["w:060_0","かみ合うインボリュート歯車の歯形",{"a":"M. D. Lebedev","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Involute_Spur_Gears_Meshing.gif"}]],["強度設計であらかじめ検討しておくべき3つの要素は？","静的強度、疲労強度、剛性","引張強さ、硬さ、比重","静的強度、熱膨張、比熱","疲労強度、耐食性、価格","強度設計では、一度の大きな荷重で壊れないか（静的強度）、繰り返し荷重で壊れないか（疲労強度）、変形しすぎないか（剛性）の3点を検討する。実際の破損の多くは疲労によるため、疲労強度の検討は特に重要。","https://d-engineer.com/dictionary/gousei.html","剛性とは（MONOWEB）",["引張強さ・硬さ・比重は材料の特性値。繰り返し荷重への強さや変形のしにくさが含まれず、強度設計の3要素ではない。","熱膨張や比熱は熱的な性質で、強度設計の基本3要素ではない。疲労強度と剛性が欠けている。","耐食性や価格は材料選定で考える要素だが、強度設計の3要素ではない。静的強度と剛性が欠けている。"],"https://www.youtube.com/watch?v=IY1GCSfQuL8","様々な材料の応力ひずみ線図【MONOWEB】",""],["故障が起きる前提で、発生しても安全側に働くようにシステムを設計することを何というか？","フェイルセーフ設計","フールプルーフ設計","冗長設計","ロバスト設計","フェイルセーフ設計は、故障は必ず起こるという前提で、故障しても安全側に動作するようにする設計思想。例えば、停電するとブレーキがかかる、信号機が故障すると赤になるなど。","https://monoto.co.jp/glossary-foolproof-1100/","フールプルーフとは｜ミスを防ぐ設計（monoto）",["フールプルーフ設計は、人の誤操作を前提に、誤操作できないようにする設計。機器の故障を前提とする考え方ではない。","冗長設計は、同じ機能の部品や系統を複数持たせ、一つが故障しても機能を維持する設計。安全側に動作させることとは別の考え方。","ロバスト設計は、ばらつきや環境変化の影響を受けにくくする設計。故障時に安全側に働かせる設計思想ではない。"],"https://www.youtube.com/watch?v=C3nKiWfRWBI","フェイルセーフ、フールプルーフの考え方と違いを解説",""],["人は操作で偶発的ミスを犯すという前提に立ち、誤操作できないよう先回りして予防する設計は？","フールプルーフ設計","フェイルセーフ設計","ユニバーサル設計","インターロック設計","フールプルーフ設計（ポカヨケ）は、人は誤操作をするという前提で、誤った操作ができない、または誤っても危険にならないようにする設計思想。逆向きに挿せないコネクタ、ドアを閉めないと動かない電子レンジなどが例。","https://monoto.co.jp/glossary-foolproof-1100/","フールプルーフとは｜ミスを防ぐ設計（monoto）",["フェイルセーフ設計は、機器の故障を前提に、故障しても安全側に動作させる設計。人の誤操作を前提とする考え方ではない。","ユニバーサル設計は、年齢や障がいの有無にかかわらず誰でも使いやすくする設計。誤操作の予防を主目的とするものではない。","インターロックは、条件が満たされないと動作しない仕組みで、フールプルーフを実現する手段の一つ。設計思想全体の名称ではない。"],"https://www.youtube.com/watch?v=C3nKiWfRWBI","フェイルセーフ、フールプルーフの考え方と違いを解説",""],["故障率曲線は別名で何と呼ばれるか？","バスタブカーブ","S-N曲線","ベルカーブ","ローレンツ曲線","故障率曲線は、形が浴槽（バスタブ）の断面に似ていることからバスタブカーブと呼ばれる。初期故障期はバーンインなどで出荷前に取り除き、摩耗故障期の前に予防保全で部品を交換するのが基本的な対策。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl06/c0494.html","金型の故障期（ミスミ技術情報）",["S-N曲線は、繰り返し応力と破断までの繰り返し数の関係を示す疲労の曲線。故障率曲線の別名ではない。","ベルカーブは、正規分布の釣鐘形のグラフ。故障率曲線は浴槽の形に似ている。","ローレンツ曲線は、所得分布の偏りを表す経済学の曲線。設備の故障率とは関係ない。"],"https://www.youtube.com/watch?v=6CWMxmlrj4g","ワイブル分布とバスタブ曲線の関係","",["w:011_0","故障率のバスタブカーブ（初期・偶発・摩耗故障）",{"a":"Bathtub_curve.jpg: Wyatts derivative work: McSush (talk)","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Bathtub_curve.svg"}]],["工作物を回転させ、刃物に当てて削る加工法を何というか？","旋盤加工","フライス加工","ボール盤加工","研削加工","旋盤加工は、工作物を主軸に取り付けて回転させ、刃物台に固定したバイトを当てて削る加工。外径削り、端面削り、穴ぐり、ねじ切りなど、主に円筒形状の部品を加工する。工具のほうを回すのはフライス加工やボール盤加工。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/26415/","旋盤加工の全知識（meviy）",["フライス加工は、多数の刃をもつ工具（フライス）を回転させ、固定した工作物を削る加工。工作物を回転させるのではない。","ボール盤加工は、ドリルを回転させて固定した工作物に穴をあける加工。回転するのは工具側。","研削加工は、高速回転する砥石で表面を削って仕上げる加工。刃物（バイト）に工作物を当てて削る加工ではない。"],"https://www.youtube.com/watch?v=jWuM3puiPxo","1から学ぶ旋盤の基礎！汎用旋盤の各部解説","",["x:mech2_61","旋盤加工（チャック・工作物・バイト）"]],["旋盤加工で工作物を削る工具を何というか？","バイト","エンドミル","ドリル","リーマ","バイトは旋盤で使う切削工具で、シャンク（柄）の先に刃先がある。用途に応じて外径用、突切り用、ねじ切り用、中ぐり用などがある。エンドミルやドリルは回転させて使う工具。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/26415/","旋盤加工の全知識（meviy）",["エンドミルは、外周と端面に刃をもち、回転させて溝や側面を削るフライス加工用の工具。旋盤のように固定して使う工具ではない。","ドリルは、回転させて穴をあける工具。旋盤でも心押し台に付けて使えるが、旋削で工作物を削る基本の工具ではない。","リーマは、下穴を少しだけ削り広げて、穴の寸法と内面を精密に仕上げる工具。外径などを削る旋盤の工具ではない。"],"https://www.youtube.com/watch?v=jWuM3puiPxo","1から学ぶ旋盤の基礎！汎用旋盤の各部解説","",["w:071_1","旋盤用バイト（刃先チップをシャンクに固定）",{"a":"不明","l":"CC BY-SA 2.0","u":"https://commons.wikimedia.org/wiki/File:LatheCarbideTippedTool.jpg"}]],["工具を回転させ、工作物を移動させて加工する方法を何というか？","フライス加工","旋盤加工","形削り加工","ブローチ加工","フライス加工は、多数の刃をもつ工具（フライス、エンドミル）を回転させ、工作物を送って平面、溝、段、曲面などを削る加工。工作物を回す旋盤とは、回す側が逆になる。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/31060/","フライス加工とは？種類、特徴や加工方法（meviy）",["旋盤加工は、工作物を回転させて固定したバイトで削る加工。工具を回す方式とは逆。","形削り加工は、バイトを直線往復させて平面や溝を削る加工。工具は回転しない。","ブローチ加工は、多数の刃が段階的に並んだブローチを直線的に押したり引いたりして穴や溝を削る加工。工具を回転させない。"],"https://www.youtube.com/watch?v=NzgLe7Pb74A","フライス盤・マシニングセンタの特徴や使い分けを解説","",["x:mech2_63","フライス加工（正面フライス）"]],["旋盤加工で、切削動力の大部分は何の生成に消費されるか？","切りくず","摩擦熱による工具摩耗","工作物の振動","主軸の回転","切削で消費される動力の大部分は、材料をせん断変形させて切りくずを作ることに使われ、その多くが熱になる。発生した熱の大半は切りくずが持ち去るが、一部は工具に伝わり、工具摩耗の原因になる。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/26415/","旋盤加工の全知識（meviy）",["工具摩耗は、切削で生じた熱や摩擦の結果として起こる現象。消費動力の大部分が使われる対象ではない。","工作物の振動（びびり）は、条件が悪いときに生じる不具合。切削動力の大部分を消費するものではない。","主軸の回転は動力を伝える手段であり、動力が最終的に消費される先は材料をせん断して切りくずを作る仕事である。"],"https://www.youtube.com/watch?v=jWuM3puiPxo","1から学ぶ旋盤の基礎！汎用旋盤の各部解説","",["w:025_1","切削時の切りくず生成と構成刃先（BUE）の模式図",{"a":"Fede.Campana at English Wikipedia","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Built_up_edge.JPG"}]],["フライス盤に自動工具交換機能を付け、NC制御を行う工作機械は？","マシニングセンタ","ターニングセンタ","NC旋盤","放電加工機","マシニングセンタは、NCフライス盤にATC（自動工具交換装置）と工具マガジンを備えた工作機械。1回の段取りで、フライス削り・穴あけ・ねじ立てなど多くの工程を自動で連続して行える。旋盤系で同様の機能をもつのはターニングセンタ。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/31060/","フライス加工とは？種類、特徴や加工方法（meviy）",["ターニングセンタは、NC旋盤に回転工具や自動工具交換機能を付けた旋盤系の工作機械。フライス盤がベースではない。","NC旋盤は、旋盤を数値制御にしたもの。工作物を回転させる旋盤系で、フライス盤に自動工具交換を付けたものではない。","放電加工機は、電極と工作物の間の放電で材料を除去する機械。工具を交換しながら削るフライス盤系ではない。"],"https://www.youtube.com/watch?v=NzgLe7Pb74A","フライス盤・マシニングセンタの特徴や使い分けを解説","",["x:mech2_65","マシニングセンタと自動工具交換装置"]],["焼入れした工具鋼や高速度鋼などの研削によく使われる砥粒は？","WA砥粒","C砥粒","GC砥粒","ダイヤモンド砥粒","WA砥粒（白色溶融アルミナ）は、硬く鋭い刃先をもち、焼入れ鋼、工具鋼、高速度鋼などの研削に適する。A砥粒（褐色アルミナ）は一般鋼、C・GC砥粒（炭化ケイ素）は鋳鉄・非鉄金属・超硬合金向き。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0355.html","砥石の種類と特長（ミスミ技術情報）",["C砥粒（黒色炭化ケイ素）は、鋳鉄や非鉄金属、石材などの研削に向く。焼入れ鋼の研削には一般に使わない。","GC砥粒（緑色炭化ケイ素）は、超硬合金などの研削に向く。鉄鋼系の焼入れ鋼には適さない。","ダイヤモンド砥粒は、超硬合金やセラミックスの研削に使う。鉄と反応して摩耗しやすいため、鋼の研削には向かない。"],"https://www.youtube.com/watch?v=WKRUEKZnn7o","研削砥石入門（前編）",""],["ドリルによく使われる工具材料は？","高速度鋼","超硬合金","セラミックス","cBN","高速度鋼（ハイス）は、タングステンやモリブデンなどを含む工具鋼で、600℃程度まで硬さを保つ。じん性が高く欠けにくいので、ドリル、タップ、エンドミルなど形状の複雑な工具に使われる。","https://monoto.co.jp/toolmaterial/","工具材質とは？超硬からハイス・サーメットまで（monoto）",["超硬合金は硬く高速切削に向くが、もろく欠けやすい。形状の複雑なドリルでも使われるが、よく使われる代表的な材料は高速度鋼。","セラミックスは高温硬さに優れるが、じん性が低く欠けやすい。主に旋削用チップに使い、ドリルには不向き。","cBN（立方晶窒化ホウ素）は、焼入れ鋼の高速仕上げ切削に使う非常に硬い材料。高価でもろく、一般的なドリルの材料ではない。"],"https://www.youtube.com/watch?v=LZmfwzq53qo","切削工具の材質（ハイス・超硬）と4つの分類を徹底解説",""],["旋削（旋盤のバイト）によく使われる工具材料は？","超硬合金","高速度鋼","炭素工具鋼","合金工具鋼","超硬合金は、炭化タングステンの粉末をコバルトで焼き固めた材料。高速度鋼より硬く、高温でも硬さが落ちにくいため、高速切削ができる。旋削用バイトのチップ（スローアウェイチップ）の主流。","https://monoto.co.jp/toolmaterial/","工具材質とは？超硬からハイス・サーメットまで（monoto）",["高速度鋼はじん性が高く、ドリルなど複雑な工具に向く。高温硬さが超硬合金より劣り、高速の旋削の主流ではない。","炭素工具鋼は、200℃程度で硬さが落ちるため、やすりや手工具向き。旋削の工具材料には向かない。","合金工具鋼は、炭素工具鋼に合金元素を加えたもので、タップや金型などに使う。高速旋削用バイトの主流ではない。"],"https://www.youtube.com/watch?v=LZmfwzq53qo","切削工具の材質（ハイス・超硬）と4つの分類を徹底解説",""],["刃先が寿命に達したら捨てて交換する方式の工具を何というか？","スローアウェイ工具","ろう付け工具","ソリッド工具","総形工具","スローアウェイ工具（刃先交換式工具）は、刃先部分のチップをねじなどで固定し、摩耗したら再研削せずにチップを交換・回転させて新しい刃を使う工具。段取りが早く、刃先品質が安定する。","https://monoto.co.jp/toolmaterial/","工具材質とは？超硬からハイス・サーメットまで（monoto）",["ろう付け工具は、刃先のチップをシャンクにろう付けした工具。摩耗したら再研削して使い、チップを交換する方式ではない。","ソリッド工具は、刃部と柄が同じ材料で一体になった工具。摩耗すれば再研削するのが基本で、刃先だけを捨てるものではない。","総形工具は、刃の輪郭が製品の形状と同じで、一度に形を転写して削る工具。刃先交換の方式を指す名称ではない。"],"https://www.youtube.com/watch?v=LZmfwzq53qo","切削工具の材質（ハイス・超硬）と4つの分類を徹底解説","",["w:058_4","スローアウェイ工具の刃先チップ（インサート）",{"a":"Solaris2006","l":"CC BY 3.0","u":"https://commons.wikimedia.org/wiki/File:Cutting_tools001.jpg"}]],["曲げ加工の直線曲げで主に使われる加工機械は？","プレスブレーキ","ベンディングロール","パイプベンダ","スピニングマシン","プレスブレーキは、上型（パンチ）と下型（ダイ）の間に板を置き、長い直線状に曲げる専用のプレス機械。V曲げが代表的で、板金加工で最もよく使われる。","https://monoto.co.jp/pressbrake/","プレスブレーキとは？種類を解説（monoto）",["ベンディングロールは、複数のロールで板を円筒状や曲面に曲げる機械。直線の折り曲げには使わない。","パイプベンダは、管材を曲げる専用の機械。板材の直線曲げには使わない。","スピニングマシンは、回転する型に板を押し当てて回転体の形状に成形する機械。曲げ加工の機械ではない。"],"https://www.youtube.com/watch?v=viU7-Sbu8dI","曲げ加工の精度低下：プレス加工のトラブル対策","",["w:093_1","プレスブレーキの曲げ（パンチとダイで板を曲げる）",{"a":"Gesenkbiegen_ungebogen.svg: URMEL derivative work: Wizard191","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Press_brake_schematic.svg"}]],["曲げ加工で、曲げた後に弾性回復で角度が少し戻る現象（戻り量）を何というか？","スプリングバック","スプリングゴー","ブレークスルー","ストレッチャーストレイン","スプリングバックは、曲げ加工で荷重を取り除いたとき、材料の弾性回復によって曲げ角度が少し戻る現象。高強度材ほど大きい。対策として、戻る分を見込んで深めに曲げる（オーバーベンド）、底突きする、などがある。","https://monoto.co.jp/pressbrake/","プレスブレーキとは？種類を解説（monoto）",["スプリングゴーは、V曲げなどで曲げ角度が狙いより小さく（曲がりすぎに）なる現象。戻るのではなく逆方向の変化。","ブレークスルーは、抜き加工で材料が破断した瞬間に荷重が急に抜ける現象。曲げの戻りとは関係ない。","ストレッチャーストレインは、軟鋼板をプレスしたときに表面に生じるしま模様。弾性回復による角度変化ではない。"],"https://www.youtube.com/watch?v=viU7-Sbu8dI","曲げ加工の精度低下：プレス加工のトラブル対策",""],["スプリングバックが小さくなるのは、パンチ半径が板厚に対して大きい場合と小さい場合のどちらか？","小さい場合","大きい場合","板厚と同じ場合","関係しない","パンチ半径（曲げ半径）が板厚に比べて小さいほど、曲げ部が強く塑性変形し、弾性的に戻る割合が減るため、スプリングバックは小さくなる。逆に大きなRでゆるく曲げると、戻りが大きくなる。","https://monoto.co.jp/pressbrake/","プレスブレーキとは？種類を解説（monoto）",["パンチ半径が大きいとゆるく曲げることになり、弾性変形の割合が増えるため、スプリングバックはむしろ大きくなる。","板厚と同じという特定の条件でスプリングバックが最小になるわけではない。半径は小さいほど戻りは小さくなる。","パンチ半径は曲げ部の塑性変形の度合いを左右するため、スプリングバックに大きく影響する。関係しないことはない。"],"https://www.youtube.com/watch?v=viU7-Sbu8dI","曲げ加工の精度低下：プレス加工のトラブル対策","",["x:mech2_72","パンチ先端半径Rpと板厚tの関係"]],["曲げ加工に必要な力は、ダイの幅（肩幅）とどんな関係にあるか？","反比例する","比例する","2乗に比例する","関係しない","V曲げに必要な力は、ダイの幅（V幅）に反比例する。ダイ幅が広いほど、てこの原理で小さな力で曲げられる。板厚の2乗と材料の引張強さには比例する。一般にV幅は板厚の6〜12倍程度にする。","https://monoto.co.jp/pressbrake/","プレスブレーキとは？種類を解説（monoto）",["比例するのではない。ダイ幅が広いほどてこの腕が長くなり、小さな力で曲げられる。","2乗に比例するのは板厚との関係。ダイ幅とは反比例の関係にある。","ダイ幅が変わると支点間の距離が変わるので、曲げ力は大きく変わる。関係しないことはない。"],"https://www.youtube.com/watch?v=viU7-Sbu8dI","曲げ加工の精度低下：プレス加工のトラブル対策",""],["せん断加工で、パンチとダイの隙間を何というか？","クリアランス","バックラッシ","シャー角","しめしろ","クリアランスは、せん断加工でのパンチとダイのすき間。小さすぎると工具が摩耗しやすく、大きすぎるとバリやだれが大きくなる。適正値は材料や板厚によって異なり、板厚の5〜10%程度が目安。","https://monoto.co.jp/shearing/","せん断加工とは？せん断の特徴とバリ・だれの仕組み（monoto）",["バックラッシは、かみ合う歯車の歯の間に設けるピッチ円周方向のすき間。せん断工具のすき間の名称ではない。","シャー角は、抜き力を軽減するためにパンチやダイの刃面に付ける傾き。すき間ではなく角度。","しめしろは、しまりばめで軸が穴より大きい分の寸法差。すき間とは逆の意味。"],"https://www.youtube.com/watch?v=rwLM0UinZD0","プレス加工を学ぶ～ブランク、プレス加工の生産方法～","",["x:mech2_74","せん断加工のクリアランス"]],["せん断加工でパンチとダイに作用する力の最大値（を断面積で割った値）を何というか？","せん断抵抗","引張強さ","クリアランス","ブレークスルー","せん断抵抗は、せん断加工で材料が切れるときの最大荷重を、せん断される断面積（切り口の長さ×板厚）で割った値。抜き力＝せん断抵抗×切り口の長さ×板厚で求め、プレス機械の能力選定に使う。","https://monoto.co.jp/shearing/","せん断加工とは？せん断の特徴とバリ・だれの仕組み（monoto）",["引張強さは、引張試験で材料が耐えられる最大荷重を元の断面積で割った値。せん断抵抗は一般に引張強さの約8割程度で、別の値である。","クリアランスは、パンチとダイのすき間の寸法。力の大きさを表す量ではない。","ブレークスルーは、抜き終わりに荷重が急に抜ける現象。力の最大値を表す量ではない。"],"https://www.youtube.com/watch?v=rwLM0UinZD0","プレス加工を学ぶ～ブランク、プレス加工の生産方法～",""],["抜き加工の完了時に、パンチとダイへの作用力が急減する現象を何というか？","ブレークスルー","スプリングバック","かえり","だれ","ブレークスルーは、抜き加工で材料が破断した瞬間に荷重が急に抜け、プレスや金型に衝撃が加わる現象。騒音や振動、金型の破損の原因になる。シャー角を付けたり、緩衝装置を使ったりして対策する。","https://monoto.co.jp/shearing/","せん断加工とは？せん断の特徴とバリ・だれの仕組み（monoto）",["スプリングバックは、曲げ加工で荷重を除いたときに角度が戻る現象。抜き加工の荷重急減とは関係ない。","かえり（バリ）は、抜き加工の切り口の縁に生じる鋭い突起。荷重の変化を表す現象ではない。","だれは、抜き加工の切り口の入口側にできる丸みを帯びた部分。荷重の急減を指す言葉ではない。"],"https://www.youtube.com/watch?v=rwLM0UinZD0","プレス加工を学ぶ～ブランク、プレス加工の生産方法～","",["x:mech2_76","抜き加工でパンチに作用する力の変化"]],["円形を打ち抜く際、パンチに角度をつけて抜き力を軽減する。この角度を何というか？","シャー角","すくい角","逃げ角","ねじれ角","シャー角は、パンチ（またはダイ）の刃面に付ける傾き。刃全体で一度に切るのではなく、少しずつ順番に切ることになるため、最大の抜き力を小さくできる。はさみの刃が斜めに交わるのと同じ考え方。","https://monoto.co.jp/shearing/","せん断加工とは？せん断の特徴とバリ・だれの仕組み（monoto）",["すくい角は、切削工具のすくい面の傾きで、切りくずの出やすさや切れ味に関係する。抜き型の角度ではない。","逃げ角は、切削工具の刃先が仕上げ面とこすれないように付ける角度。抜き力を減らすための角度ではない。","ねじれ角は、ドリルやねじの溝・山が軸線となす角度。パンチの刃面の傾きではない。"],"https://www.youtube.com/watch?v=rwLM0UinZD0","プレス加工を学ぶ～ブランク、プレス加工の生産方法～","",["x:mech2_77","パンチに付けたシャー角α"]],["ボールねじの回転角度をロータリエンコーダで検出してフィードバックするNC位置決め方式は？","セミクローズドループ方式","クローズドループ方式","オープンループ方式","ハイブリッド方式","セミクローズドループ方式は、モータやボールねじの回転角をロータリエンコーダで検出してフィードバックする方式。テーブル位置そのものではなく回転量から位置を推定するため、ボールねじの誤差や熱変位は補正できない。コストと精度のバランスがよく、最も普及している。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0013.html","オープンループとクローズドループ（ミスミ技術情報）",["クローズドループ方式は、テーブルの実際の位置をリニアスケールで直接検出する方式。回転角からの推定ではない。","オープンループ方式は、位置検出器を持たず指令パルスだけで位置決めする方式。エンコーダによるフィードバックはない。","ハイブリッド方式は、セミクローズドとクローズドを組み合わせた方式。回転角だけを検出してフィードバックする方式ではない。"],"https://www.youtube.com/watch?v=hKSrZKaHrlE","クローズドループとオープンループの比較","",["x:mech2_78","オープン・セミクローズド・クローズドループ"]],["テーブルの直線変位をリニアエンコーダで直接検出してフィードバックするNC位置決め方式は？","クローズドループ方式","セミクローズドループ方式","オープンループ方式","フィードフォワード方式","クローズドループ方式は、テーブルの実際の位置をリニアスケール（リニアエンコーダ）で直接検出してフィードバックする方式。ボールねじの誤差や熱膨張の影響も補正できるため最も高精度だが、高価で調整も難しい。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0013.html","オープンループとクローズドループ（ミスミ技術情報）",["セミクローズドループ方式は、モータやボールねじの回転角を検出する方式。テーブルの直線変位を直接測るわけではない。","オープンループ方式は、位置検出器を持たずフィードバックを行わない方式。リニアエンコーダは使わない。","フィードフォワード方式は、外乱や目標値の変化を予測して先に操作量を加える制御。位置を検出してフィードバックする方式ではない。"],"https://www.youtube.com/watch?v=hKSrZKaHrlE","クローズドループとオープンループの比較","",["x:mech2_78","オープン・セミクローズド・クローズドループ"]],["位置検出器を持たず、ステッピングモータへの指令パルスだけで位置決めするNC方式は？","オープンループ方式","セミクローズドループ方式","クローズドループ方式","ハイブリッドループ方式","オープンループ方式は、位置検出器をもたず、ステッピングモータに送った指令パルスの数だけで位置を決める方式。構造が簡単で安価だが、負荷が大きすぎて脱調しても検出できない。小型の装置などに使われる。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0013.html","オープンループとクローズドループ（ミスミ技術情報）",["セミクローズドループ方式は、モータの回転角をエンコーダで検出してフィードバックする方式。位置検出器を持つ。","クローズドループ方式は、テーブル位置をリニアスケールで直接検出してフィードバックする方式。位置検出器が必須。","ハイブリッドループ方式は、2種類の検出器を組み合わせて精度を高める方式。位置検出器を持たない方式ではない。"],"https://www.youtube.com/watch?v=hKSrZKaHrlE","クローズドループとオープンループの比較",""],["作業者がロボットを実際に動かし、その動きをティーチングペンダントで1ブロックずつ記憶させる方法は？","ティーチングプレイバック方式","オフラインプログラミング方式","ダイレクトティーチング","シーケンス制御方式","ティーチングプレイバック方式は、作業者がティーチングペンダントでロボットを実際に動かし、教えた位置や動作を記憶させ、それを再生（プレイバック）させる方法。直感的に教えられるが、教示中はラインを止める必要がある。","https://www.fa.omron.co.jp/product/special/library/robotics/teaching/","ロボットティーチングとは？（オムロン）",["オフラインプログラミング方式は、ロボットを動かさず、パソコン上で座標値などのプログラムを作る方法。実機を動かして教えるものではない。","ダイレクトティーチングは、作業者がロボットのアームを直接手で持って動かし、動作を覚えさせる方法。ティーチングペンダントで教える方式ではない。","シーケンス制御は、あらかじめ決めた順序に従って各段階を進める制御方式。ロボットへの動作の教え方の名称ではない。"],"https://www.youtube.com/watch?v=GJLNgEt2m1M","ロボットティーチングとは【サクッとわかる産業用ロボット】","",["x:mech2_81","ティーチングとオフラインプログラミング"]],["ロボットを動かさず、座標値や移動速度などの指示だけを制御装置に記憶させる方法は？","オフラインプログラミング方式","ティーチングプレイバック方式","オンラインティーチング","サーボ制御方式","オフラインプログラミング方式は、ロボットを動かさず、パソコン上のシミュレーションなどで座標値や速度などのプログラムを作り、制御装置に転送する方法。ラインを止めずにプログラムを作れる。","https://www.fa.omron.co.jp/product/special/library/robotics/teaching/","ロボットティーチングとは？（オムロン）",["ティーチングプレイバック方式は、ロボットを実際に動かして位置を教え込む方法。ロボットを動かさないという条件に合わない。","オンラインティーチングは、実際のロボットを動かしながら教示する方法の総称。ロボットを止めたまま数値を入れる方式ではない。","サーボ制御は、モータの位置や速度を指令に追従させる制御方式。プログラムの作り方（教示方法）の名称ではない。"],"https://www.youtube.com/watch?v=GJLNgEt2m1M","ロボットティーチングとは【サクッとわかる産業用ロボット】",""],["水平方向にアームが動く多関節型のロボットを何型と呼ぶか？","SCARA型","垂直多関節型","直交座標型","円筒座標型","SCARA（スカラ）型ロボットは、水平面内で動く関節をもつ水平多関節型ロボット。水平方向にはしなやか、上下方向には剛性が高いため、部品の組立や挿入作業に向く。人の腕のように動くのは垂直多関節型。","https://www.fa.omron.co.jp/product/special/library/robotics/teaching/","ロボットティーチングとは？（オムロン）",["垂直多関節型は、人の腕のように垂直面内で動く関節を多くもつロボット。溶接や塗装に多いが、水平に動くアームの型ではない。","直交座標型は、X・Y・Zの直線軸を組み合わせて動くロボット。関節が回転する多関節型ではない。","円筒座標型は、旋回・上下・前後伸縮の3軸で円筒状の範囲を動くロボット。水平多関節型とは構造が違う。"],"https://www.youtube.com/watch?v=GJLNgEt2m1M","ロボットティーチングとは【サクッとわかる産業用ロボット】","",["w:101_0","水平多関節（SCARA）ロボットと各関節軸",{"a":"Mitsubishi Electric Automation, Inc. 500 Corporate Woods Pkw","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:SCARA_robot_2R.png"}]],["作業者の周りに部品・工具・作業台を配置し、少人数で製品を完成させる生産方式は？","セル生産システム","ライン生産方式","ロット生産方式","ジャストインタイム","セル生産システムは、1人または少人数の作業者の周りに部品や工具をコの字形などに配置し、製品を最初から最後まで組み立てる方式。多品種少量生産や需要変動に柔軟に対応しやすい。ベルトコンベアで分業するのはライン生産方式。","https://www.fa.omron.co.jp/product/special/library/robotics/factory-automation/","ファクトリーオートメーション（FA）とは？（オムロン）",["ライン生産方式は、コンベアに沿って作業者が工程を分担する方式。少品種大量生産に向き、少人数で完成させる方式ではない。","ロット生産方式は、同じ製品を一定量（ロット）ずつまとめて生産する方式。作業者の周りに部品を配置する方式の名称ではない。","ジャストインタイムは、必要なものを必要なときに必要な量だけ作る考え方。作業場の配置の方式ではない。"],"https://www.youtube.com/watch?v=8vK23yArGWY","FA業界を完全解説","",["x:mech2_84","ライン生産方式とセル生産方式"]],["品質管理をアルファベットでどう表すか？","QC","QA","FA","PM","QCはQuality Controlの略で品質管理のこと。品質を保証する活動全体はQA（Quality Assurance：品質保証）と呼んで区別する。全社で取り組む品質管理はTQCやTQMと呼ばれる。","https://jp.meviy.misumi-ec.com/info/ja/howto/mech-design/21041/","設計も生技も関わるQC（クオリティコントロール）とは（meviy）",["QAはQuality Assuranceの略で品質保証のこと。品質管理を含む、品質を保証する活動全体を指す。","FAはFactory Automationの略で、工場の自動化のこと。品質管理ではない。","PMはPreventive Maintenance（予防保全）などの略で、設備保全に関する用語。品質管理ではない。"],"https://www.youtube.com/watch?v=jNCgEvulmUI","【イメージ図で覚える！】QC検定3級 完全解説",""],["数値情報で自動的に各種工作機械を動かす制御を何というか？","NC制御","PID制御","シーケンス制御","ファジィ制御","NC（Numerical Control：数値制御）は、工具の位置や送り速度などを数値情報（NCプログラム）で指令し、工作機械を自動で動かす制御。コンピュータを内蔵したものをCNCという。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0013.html","オープンループとクローズドループ（ミスミ技術情報）",["PID制御は、比例・積分・微分の3動作で偏差をなくすフィードバック制御。数値情報で工作機械を動かす制御の名称ではない。","シーケンス制御は、決められた順序や条件に従って動作を進める制御。工具の位置を数値で指令する制御ではない。","ファジィ制御は、人の経験的な「あいまいな」判断をルール化して行う制御。数値情報で工作機械を動かすものではない。"],"https://www.youtube.com/watch?v=hKSrZKaHrlE","クローズドループとオープンループの比較",""],["複数軸のステッピングモータで工具先端に所定の軌跡を描かせるため、パルスを各軸に適正に分配することを何というか？","パルス分配","パルス変調","割込み処理","補間演算","パルス分配は、複数軸を同時に動かして直線や円弧の軌跡を描くため、指令パルスを各軸に適切な比率と順序で配分すること。直線補間や円弧補間を実現するための処理で、NC装置が行う。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0013.html","オープンループとクローズドループ（ミスミ技術情報）",["パルス変調は、信号をパルスの幅や位置などで表す通信・電力制御の技術。各軸へパルスを配分することではない。","割込み処理は、外部信号などで実行中の処理を中断して別の処理を行う仕組み。軸ごとのパルス配分ではない。","補間演算は、直線や円弧の途中の点を計算する処理。その結果を各軸へ指令パルスとして配ることがパルス分配で、両者は区別される。"],"https://www.youtube.com/watch?v=hKSrZKaHrlE","クローズドループとオープンループの比較","",["x:mech2_87","X軸・Y軸へのパルス分配"]],["マシニングセンタの自動工具交換装置を略して何と呼ぶか？","ATC","APC","CNC","CAM","ATC（Automatic Tool Changer）は、マシニングセンタの自動工具交換装置。工具マガジンから必要な工具を取り出して主軸に付け替える。工作物を載せたパレットを自動で交換するのはAPC（Automatic Pallet Changer）。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/31060/","フライス加工とは？種類、特徴や加工方法（meviy）",["APC（Automatic Pallet Changer）は、工作物を載せたパレットを自動で交換する装置。工具の交換装置ではない。","CNCはコンピュータを内蔵した数値制御（Computerized NC）のこと。工具交換装置の略称ではない。","CAMはComputer Aided Manufacturingの略で、加工プログラムなどをコンピュータで作る技術。工具交換装置ではない。"],"https://www.youtube.com/watch?v=NzgLe7Pb74A","フライス盤・マシニングセンタの特徴や使い分けを解説","",["w:008_1","マシニングセンタの工具マガジンと工具交換アーム",{"a":"GaspariniMB","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Chain_type_changer_and_arm_with_two_grippers.jpg"}]],["旋盤加工で材料をつかむ部分を何というか？","チャック","心押し台","刃物台","バイス","チャックは、旋盤の主軸の先端に取り付け、爪で工作物をつかんで固定する装置。3つの爪が同時に動く三つ爪スクロールチャックや、爪が個別に動く四つ爪単動チャックがある。長い工作物は心押し台で反対側を支える。","https://jp.meviy.misumi-ec.com/info/ja/howto/metal-machining/26415/","旋盤加工の全知識（meviy）",["心押し台は、主軸の反対側から長い工作物をセンタで支えたり、ドリルを付けたりする部分。材料をつかむ部分ではない。","刃物台は、バイトなどの工具を固定して送る部分。工作物をつかむ部分ではない。","バイスは、フライス盤やボール盤のテーブル上で工作物を挟んで固定する万力。旋盤の主軸に付ける把握装置ではない。"],"https://www.youtube.com/watch?v=jWuM3puiPxo","1から学ぶ旋盤の基礎！汎用旋盤の各部解説","",["w:070_2","旋盤の3つ爪チャックとチャックハンドル",{"a":"Glenn McKechnie","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:ThreeJawChuckKey.jpg"}]],["工業製品のQCとは何の略か？","Quality Control","Quality Check","Quick Change","Quantity Control","QCはQuality Control（品質管理）の略。買い手の要求に合った品質の製品やサービスを経済的に作り出すための手段の体系のこと。統計的手法を使うものをSQC（統計的品質管理）という。","https://jp.meviy.misumi-ec.com/info/ja/howto/mech-design/21041/","設計も生技も関わるQC（クオリティコントロール）とは（meviy）",["Quality Checkは品質の点検を表す言葉にすぎず、QCの正式な語源ではない。品質管理は検査だけでなく工程全体を管理する活動。","Quick Changeは段取り替えの迅速化などを指す言葉で、品質管理の略ではない。","Quantity Controlは数量の管理を意味する。QCのQは量ではなく品質（Quality）。"],"https://www.youtube.com/watch?v=jNCgEvulmUI","【イメージ図で覚える！】QC検定3級 完全解説",""],["絞り加工で「パンチの直径 ÷ ブランクの直径」を何というか？","絞り率","絞り比","伸び率","減面率","「パンチの直径÷ブランクの直径」を絞り率という。値が小さいほど厳しい絞りになり、1回で絞れる限界を限界絞り率という。逆数（ブランク直径÷パンチ直径）は絞り比と呼ばれ、値が大きいほど厳しい。","https://monoto.co.jp/deepdrawing/","絞り加工とは？工程とさまざまな絞り加工（monoto）",["絞り比は、ブランク直径÷パンチ直径で、絞り率の逆数。値が大きいほど厳しい絞りになる。","伸び率は、引張試験などで材料が元の長さに対してどれだけ伸びたかの割合。直径の比ではない。","減面率は、引抜きや押出しで断面積がどれだけ減ったかの割合。絞り加工の直径の比ではない。"],"https://www.youtube.com/watch?v=iBtr5X_wYXM","プレス機による絞り加工",""],["テーブル移動軸における前後方向の角度の動き（縦揺れ）を何というか？","ピッチング","ヨーイング","ローリング","バックラッシ","テーブルなど直線移動する軸の姿勢誤差は、進行方向に対して前後に傾く「ピッチング」、左右に首を振る「ヨーイング」、進行方向を軸として回転する「ローリング」の3つで表す。工作機械の精度検査の項目になっている。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td04/a0118.html","XYステージ（ミスミ技術情報）",["ヨーイングは、進行方向に対して左右に首を振る角度の動き。前後の縦揺れではない。","ローリングは、進行方向を軸として回転する横揺れ。前後方向の傾きではない。","バックラッシは、歯車や送りねじのかみ合い部のすき間で、反転時のがたの原因になる。姿勢の角度誤差ではない。"],"https://www.youtube.com/watch?v=7kY0EebHHKo","マシニングセンタの段取り・芯出し・工具補正 完全解説","",["x:mech2_92","ピッチング・ヨーイングなどテーブルの動き"]],["電子ビーム加工でビームの位置を制御するのは何か？","偏向コイル","集束レンズ","電子銃","対物絞り","電子ビーム加工では、電子銃から出た電子ビームを電磁レンズで細く絞り、偏向コイルが作る磁界でビームの向きを曲げて照射位置を制御する。真空中で行い、微細な穴あけや溶接に使われる。","https://kotobank.jp/word/%E9%9B%BB%E5%AD%90%E3%81%B3%E3%83%BC%E3%82%80%E5%8A%A0%E5%B7%A5-3160581","電子ビーム加工とは（コトバンク）",["集束レンズ（電磁レンズ）は、電子ビームを細く絞る役割。ビームの照射位置を動かすのは偏向コイル。","電子銃は、電子を発生させて加速する部分。ビームの向きを曲げて位置を制御する装置ではない。","対物絞りは、ビームの開き角を制限して不要な電子を遮る部品。照射位置の制御には使わない。"],"https://www.youtube.com/watch?v=tIh6-_TDpqI","電子ビーム加工機って何？？","",["x:mech2_93","電子ビーム加工機の構造と偏向コイル"]],["三角ねじ（メートルねじ）のねじ山の角度は？","60度","55度","30度","90度","メートルねじ（三角ねじ）のねじ山の角度は60°。ユニファイねじも60°。管用ねじ（ウイットねじ系）は55°、台形ねじ（メートル系）は30°。締結用には主にメートル並目ねじが使われる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["55°は管用ねじなどウイットねじ系のねじ山の角度。メートルねじの角度ではない。","30°はメートル系台形ねじのねじ山の角度。三角ねじの角度ではない。","90°のねじ山角度をもつ一般的な締結用ねじはない。三角ねじは60°である。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編",""]]},{"id":"mech3","title":"機械 2-3 計測制御","cat":"機械","q":[["制御対象の状態をセンサで確認しながら、その都度指令を変える制御方式を何というか？","フィードバック制御","フィードフォワード制御","シーケンス制御","オープンループ制御","フィードバック制御は、センサで制御対象の出力を測り、目標値との差（偏差）をなくすよう操作量を変え続ける制御。外乱があっても目標に近づけられるのが強み。あらかじめ外乱を予測して先に手を打つのはフィードフォワード制御、決められた順序で動かすのはシーケンス制御。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md05/d0035.html","フィードバック制御の構成（ミスミ技術情報）",["フィードフォワード制御は、外乱や目標値の変化を予測して先に操作量を加える制御。出力を測って偏差を修正し続けるものではない。","シーケンス制御は、あらかじめ決めた順序や条件に従って各段階を進める制御。出力を測って指令を変える制御ではない。","オープンループ制御は、出力を検出せず指令だけで動かす制御。センサで状態を確認しながら指令を変えることはしない。"],"https://www.youtube.com/watch?v=9qWrk68EqvI","自動制御（８）フィードバック制御","",["x:mech3_1","フィードバック（閉ループ）制御のブロック図"]],["回転に応じて電気信号（パルス）を出力するセンサを何と呼ぶか？","ロータリエンコーダ","リニアエンコーダ","ポテンショメータ","タコジェネレータ","ロータリエンコーダは、スリット付きの円板の回転を光や磁気で検出し、回転角に応じたパルス信号を出すセンサ。パルス数を数えると回転角、パルスの周期から回転速度がわかる。直線の変位を測るものはリニアエンコーダ。","https://www.fa.omron.co.jp/product/special/knowledge/re/principle_structure.html","ロータリエンコーダ（原理と構造）（オムロン）",["リニアエンコーダは、直線方向の変位を検出してパルスを出すセンサ。回転の検出には使わない。","ポテンショメータは、回転角や変位を可変抵抗の抵抗値（電圧）の変化として出すセンサ。パルスではなくアナログ信号を出力する。","タコジェネレータは、回転速度に比例した電圧を発生する速度センサ。パルス信号を出すものではない。"],"https://www.youtube.com/watch?v=cogsdemslj0","ロータリーエンコーダの基本原理","",["x:mech3_2","光学式ロータリエンコーダの原理"]],["不活性ガスを封入したガラス管に磁性電極を持ち、磁石が近づくと接点がオンになるスイッチは？","リードスイッチ","リミットスイッチ","光電スイッチ","静電容量形近接スイッチ","リードスイッチは、不活性ガスを封入したガラス管に、磁性体の2枚のリード（接点）を入れたスイッチ。磁石が近づくとリードが磁化されて引き合い、接点が閉じる。小型で寿命が長く、エアシリンダのピストン位置検出などに使われる。","https://www.fa.omron.co.jp/product/special/knowledge/prox/magnetic_type/principle_structure.html","磁気形近接センサ（原理と構造）（オムロン）",["リミットスイッチは、物体がレバーなどに機械的に接触して接点を切り替えるスイッチ。磁石とガラス管の構造ではない。","光電スイッチは、光を投げて物体による遮光や反射の変化で検出するスイッチ。磁石を利用するものではない。","静電容量形近接スイッチは、物体が近づくことによる静電容量の変化を検出するスイッチ。磁石とリード接点は使わない。"],"https://www.youtube.com/watch?v=ylAyyg-aKjc","リードスイッチの構造及び原理","",["x:mech3_3","リードスイッチの外観とON・OFFの原理"]],["磁気誘導形（高周波発振形）近接スイッチの検出感度を大きい順に並べると？","鉄 → アルミ → 銅","銅 → アルミ → 鉄","アルミ → 鉄 → 銅","鉄 → 銅 → アルミ","高周波発振形（磁気誘導形）の近接スイッチは、検出コイルの磁界に金属が近づくと生じる渦電流による損失で物体を検出する。磁性体の鉄が最も検出しやすく、アルミや銅のような電気をよく通す非鉄金属ほど検出距離が短くなる。","https://www.fa.omron.co.jp/product/special/knowledge/prox/inducement_type/principle_structure.html","誘導形近接センサ（原理と構造）（オムロン）",["順番が逆。電気をよく通す銅は渦電流損失の変化が小さく、最も検出しにくい。磁性体の鉄が最も検出しやすい。","アルミより磁性体の鉄のほうが検出感度は高い。非鉄金属が鉄を上回ることはない。","銅とアルミの順が逆。銅のほうが導電率が高く検出距離が短いので、アルミより感度は低い。"],"https://www.fa.omron.co.jp/video/detail/6158958112001/","制御初心者のための動画集⑦ 3-3 近接センサの動作原理・ワークの検出実習（オムロン制御機器 動画ライブラリ）",""],["物体に加わる力（ひずみ）を測定するのによく使われるものは？","ストレインゲージ","熱電対","ホール素子","フォトダイオード","ストレインゲージ（ひずみゲージ）は、薄い金属箔の抵抗体を物体に貼り付け、物体のひずみで抵抗体が伸び縮みして抵抗値が変わることを利用して、ひずみを測るセンサ。測ったひずみから応力や荷重を求められる。","https://www.keyence.co.jp/ss/products/recorder/lab/strain/base.jsp","「ひずみ」とは？（キーエンス）",["熱電対は、2種類の金属の接点に生じる熱起電力を使う温度センサ。力やひずみは測れない。","ホール素子は、磁界の強さに応じた電圧を出す磁気センサ。回転検出などに使い、ひずみの測定には使わない。","フォトダイオードは、光を受けると電流を出す光センサ。力やひずみの測定には使わない。"],"https://www.youtube.com/watch?v=3OeBX-PVtes","ひずみゲージ入門編【共和電業】","",["w:110_0","試験片に貼られたひずみゲージ（ストレインゲージ）",{"a":"Cristian V.","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Strain_gauge_-.jpg"}]],["ストレインゲージの微小な抵抗変化を検出するのに用いられる回路は？","ブリッジ回路","整流回路","発振回路","積分回路","ストレインゲージの抵抗変化はごくわずかなので、ホイートストンブリッジ回路に組み込み、平衡が崩れたときに出る電圧として取り出す。ゲージを2枚や4枚使うと、感度を上げたり温度の影響を打ち消したりできる。","https://www.keyence.co.jp/ss/products/recorder/lab/strain/base.jsp","「ひずみ」とは？（キーエンス）",["整流回路は、交流を直流に変換する回路。微小な抵抗変化を電圧として取り出す回路ではない。","発振回路は、一定の周波数の交流信号を作り出す回路。抵抗の微小変化の検出には使わない。","積分回路は、入力信号を時間で積分した出力を出す回路。抵抗変化を電圧に変える検出回路ではない。"],"https://www.youtube.com/watch?v=3OeBX-PVtes","ひずみゲージ入門編【共和電業】","",["x:mech3_6","ストレインゲージを組み込んだブリッジ回路"]],["ストレインゲージを棒材などに貼ってケースに封入した荷重センサを何というか？","ロードセル","ピエゾ素子","ブルドン管","差動トランス","ロードセルは、弾性体にストレインゲージを貼り、ケースに収めた荷重センサ。荷重で弾性体がひずみ、その量から荷重を求める。電子はかりや材料試験機、生産ラインの荷重測定などに使われる。","https://www.keyence.co.jp/ss/products/recorder/lab/strain/base.jsp","「ひずみ」とは？（キーエンス）",["ピエゾ素子（圧電素子）は、力が加わると電荷を発生する素子。ストレインゲージを使った荷重センサではない。","ブルドン管は、圧力で曲がった管が伸びる変形を利用する圧力計の受圧部。荷重センサではない。","差動トランスは、鉄心の移動による誘導電圧の差から直線変位を測るセンサ。ストレインゲージは使わない。"],"https://www.youtube.com/watch?v=3OeBX-PVtes","ひずみゲージ入門編【共和電業】","",["w:073_0","ひずみゲージ式ロードセル（S字型）の外観",{"a":"FUTEK Advanced Sensor Technology, Inc.","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Miniature_S-beam_load_cell.jpg"}]],["圧力スイッチの受圧部に主に用いられるものは？","ブルドン管、ダイヤフラム","熱電対、サーミスタ","ホール素子、リードスイッチ","ロータリエンコーダ、レゾルバ","圧力スイッチは、圧力が設定値に達すると接点を切り替える機器で、受圧部にはブルドン管、ダイヤフラム（薄い膜）、ベローズ（蛇腹）などが使われる。圧力による変形量を利用して接点を動かす。","https://www.fa.omron.co.jp/guide/technicalguide/35/28/index.html","圧力センサ 概要（オムロン技術解説）",["熱電対とサーミスタは温度センサ。圧力を受けて変形する受圧部には使わない。","ホール素子は磁気センサ、リードスイッチは磁石で動作するスイッチ。圧力を受ける部品ではない。","ロータリエンコーダとレゾルバは回転角を検出するセンサ。圧力の受圧部ではない。"],"https://www.youtube.com/watch?v=amP9SV-l7vA","【計測】ひずみゲージ【ロードセル】","",["w:015_0","ブルドン管式圧力計",{"a":"DStaiger","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Bourdon_tube_pressure_gauge_glass_front.jpg"}]],["ACモータ（誘導電動機）の回転原理を示す実験を何と呼ぶか？","アラゴの円板","フレミングの左手の法則の実験","ファラデーの円板","トリチェリの実験","アラゴの円板は、回転させた磁石の近くに銅などの金属円板を置くと、円板に渦電流が流れ、磁石につられて同じ方向に回り出す現象。誘導電動機は、この回転磁界を三相交流で作り、回転子を回している。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["フレミングの左手の法則は、磁界中の電流が受ける力の向きを示す法則。直流モータなどの原理で、誘導電動機の回転原理を示す実験の名称ではない。","ファラデーの円板は、磁界中で円板を回すと起電力が生じる単極発電機の実験。モータではなく発電の原理を示す。","トリチェリの実験は、水銀柱で大気圧を測った実験。電動機とは関係ない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界","",["x:mech3_9","アラゴの円板（誘導モータの回転原理）"]],["同期速度を求める公式は？","同期速度[min⁻¹] ＝ 120 × 周波数 ÷ 極数","同期速度 ＝ 60 × 周波数 ÷ 極数","同期速度 ＝ 120 × 極数 ÷ 周波数","同期速度 ＝ 周波数 × 極数 ÷ 120","同期速度Ns＝120f/p（f：電源周波数[Hz]、p：極数）[min⁻¹]。50Hz・4極なら1500min⁻¹、60Hz・4極なら1800min⁻¹。誘導電動機の実際の回転速度は、すべりの分だけ同期速度より少し遅い。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["係数60は1極対あたりの式で、極数pを使うときは120が正しい。60を使うと値が半分になってしまう。","極数と周波数が逆。極数が多いほど同期速度は遅くなるので、極数は分母に置く。","周波数×極数÷120では、極数が多いほど速くなり逆の関係になる。単位もmin⁻¹にならない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界",""],["誘導モータで負荷によって速度が落ちてトルクを発生する。この速度低下の割合を何と呼ぶか？","すべり","脱調","内部相差角","トルクリップル","すべりs＝(同期速度−回転速度)÷同期速度。誘導電動機は回転子が回転磁界より少し遅れて回ることで、回転子に電流が誘導されてトルクが生じる。一般的な誘導電動機のすべりは数%程度で、負荷が大きくなるほどすべりも大きくなる。","https://www.orientalmotor.co.jp/ja/tech/tech-magazine/ac-motors/02","5分で学ぶ ACモーターきほんの「き」！（オリエンタルモーター）",["脱調は、ステッピングモータや同期モータが負荷に追従できず、指令との同期を失う現象。誘導モータの速度低下の割合ではない。","内部相差角（負荷角）は、同期電動機で負荷によって生じる回転子と回転磁界の角度のずれ。速度の低下ではない。","トルクリップルは、回転中のトルクの細かい脈動。速度低下の割合を表す量ではない。"],"https://www.youtube.com/watch?v=Evf4RwqWyYc","誘導機（１）誘導電動機の動作原理と回転磁界",""],["始動時の過大電流を防ぐため、最初はスター結線、回り始めたらデルタ結線に切り替える始動法は？","スターデルタ始動","直入れ始動","リアクトル始動","インバータ始動","スターデルタ始動は、始動時は巻線をスター（Y）結線にして各巻線にかかる電圧を1/√3に下げ、始動電流と始動トルクを1/3に抑え、回転が上がったらデルタ（Δ）結線に切り替える方法。中容量の三相誘導電動機で広く使われる。","https://kotobank.jp/word/%E5%A7%8B%E5%8B%95%E5%99%A8-1542671","始動器とは（コトバンク）",["直入れ始動は、電源を直接加えて始動する方法。結線を切り替えないため始動電流は定格の5～7倍程度と大きい。","リアクトル始動は、電源とモータの間にリアクトルを入れて電圧を下げる始動法。スターとデルタの結線切替は行わない。","インバータ始動は、周波数と電圧を徐々に上げて滑らかに始動させる方法。結線は切り替えない。"],"https://www.youtube.com/watch?v=hqExASP81GM","スターデルタ始動法とは。なぜ始動電流が大きくなるのか","",["x:mech3_12","スター結線とデルタ結線の切替回路"]],["モータの回転位置や速度を指令どおりにすぐさま追従させる制御を何と呼ぶか？","サーボ制御","シーケンス制御","インバータ制御","オンオフ制御","サーボ制御は、位置や速度などを指令値に素早く正確に追従させるフィードバック制御。サーボモータ、エンコーダ、サーボアンプを組み合わせて構成し、NC工作機械やロボットの軸駆動に使われる。","https://www.fa.omron.co.jp/product/special/library/robotics/servomotor/","サーボモータとは？メリットと活用のポイント（オムロン）",["シーケンス制御は、決められた順序で動作を進める制御。位置や速度を指令に素早く追従させるフィードバック制御ではない。","インバータ制御は、周波数を変えて誘導電動機の速度を調整する制御。位置まで正確に追従させるサーボ制御とは目的が違う。","オンオフ制御は、操作量を全開か全閉の2値で切り替える制御。滑らかに素早く追従させることはできない。"],"https://www.youtube.com/watch?v=6vuWHJlgP_4","サーボモーターとは",""],["慣性モーメントJの負荷を、停止状態からt秒で回転数N[min⁻¹]まで加速するのに必要な加速トルクTの公式は？","T ＝ J × 2πN ÷ (60t)","T ＝ J × N ÷ t","T ＝ 60t ÷ (J × 2πN)","T ＝ J × 2πN × 60t","回転数N[min⁻¹]を角速度に直すとω＝2πN/60[rad/s]。これをt秒で加速するので角加速度は2πN/(60t)。トルクは慣性モーメント×角加速度なので、T＝J×2πN÷(60t)となる。慣性が大きいほど、加速時間が短いほど大きなトルクが必要。","https://www.orientalmotor.co.jp/ja/tech/eng-note/vol7","モーターを選ぶ時、慣性モーメントはなぜ大切なの？（オリエンタルモーター）",["回転数N[min⁻¹]を角速度[rad/s]に換算する2π÷60が抜けている。このままでは単位が合わず正しいトルクにならない。","分子と分母が逆。慣性が大きいほどトルクが小さくなってしまい、物理的に正しくない。","加速時間で割るべきところを掛けている。加速時間が長いほどトルクが大きくなり、関係が逆になる。"],"https://www.youtube.com/watch?v=7MiTW6_8DLk","トルク、角加速度、慣性モーメントの説明と計算",""],["比例動作・積分動作・微分動作の3要素を備えた制御を何というか？","PID制御","PI制御","オンオフ制御","ファジィ制御","PID制御は、偏差に比例する比例動作（P）、偏差の積み重ねで定常偏差をなくす積分動作（I）、偏差の変化の速さに応じて先回りする微分動作（D）を組み合わせた制御。産業界で最も広く使われているフィードバック制御方式。","https://www.keyence.co.jp/ss/general/embedded-software/hardware-tech/pid-control-program-implementation.jsp","PID制御のソフトウェア実装（キーエンス）",["PI制御は、比例動作と積分動作だけの制御。微分動作を含まないので3要素を備えていない。","オンオフ制御は、操作量を2値で切り替えるだけの単純な制御。比例・積分・微分の動作はもたない。","ファジィ制御は、あいまいなルールに基づいて操作量を決める制御。比例・積分・微分の3動作で構成されるものではない。"],"https://www.youtube.com/watch?v=xdTuNJj-fRg","【わかりすぎる】PID制御の基礎","",["w:086_4","PID制御のブロック線図（P・I・D動作の和）",{"a":"Arturo Urquizo","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:PID_en.svg"}]],["モデルの誤差や外乱があっても安定した制御性能を保とうとする方式を何というか？","ロバスト制御","適応制御","ファジィ制御","最適制御","ロバスト制御は、制御対象のモデルに誤差があったり、特性が変化したり、外乱が入ったりしても、安定性と性能を保てるように設計する制御。ロバスト（robust）は「頑健な」という意味。","https://kotobank.jp/word/%E3%82%8D%E3%81%B0%E3%81%99%E3%81%A8%E6%80%A7-1742511","ロバスト性とは（コトバンク）",["適応制御は、制御対象の特性の変化を推定しながら、制御器のパラメータを自動で調整し続ける制御。誤差に対して頑健に設計しておく方式とは考え方が違う。","ファジィ制御は、人の経験的判断をあいまいなルールで表して制御する方式。モデル誤差への頑健性を主眼とした設計法ではない。","最適制御は、評価関数を最小にするよう操作量を決める制御。誤差や外乱に対する頑健性を主眼とする方式ではない。"],"https://www.youtube.com/watch?v=Ef57yb1Impo","【制御工学】ロバスト制御（制御理論#1）",""],["周波数に対するゲインと位相を描いたグラフを何というか？","ボード線図","ナイキスト線図","ブロック線図","根軌跡","ボード線図は、横軸に周波数（対数目盛）、縦軸にゲイン[dB]と位相[°]をとったグラフで、システムの周波数特性を表す。どの周波数まで追従できるか、どこで不安定になりやすいかを読み取れる。","https://kotobank.jp/word/%E3%81%BC%E3%83%BC%E3%81%A9%E7%B7%9A%E5%9B%B3-3170517","ボード線図とは（コトバンク）",["ナイキスト線図は、周波数を変えたときのゲインと位相を1枚の複素平面上に軌跡として描いた図。周波数を横軸にした2つのグラフではない。","ブロック線図は、制御系の要素と信号の流れを箱と矢印で表した図。周波数特性のグラフではない。","根軌跡は、ゲインを変えたときの特性方程式の根の動きを複素平面に描いた図。周波数に対するグラフではない。"],"https://www.youtube.com/watch?v=e8Hjd9T6rPI","初心者向け電験三種 ボード線図・ナイキスト線図","",["x:mech3_17","ボード線図（ゲインと位相）"]],["ゲイン[dB]を求める公式は？","20 log₁₀(出力 ÷ 入力)","10 log₁₀(出力 ÷ 入力)","20 log₁₀(入力 ÷ 出力)","log₁₀(出力 × 入力)","電圧のゲイン[dB]＝20log₁₀(出力電圧÷入力電圧)。電力比の場合は10log₁₀を使う（電力は電圧の2乗に比例するため）。出力が入力と同じなら0dB。","https://kotobank.jp/word/%E3%81%BC%E3%83%BC%E3%81%A9%E7%B7%9A%E5%9B%B3-3170517","ボード線図とは（コトバンク）",["10log₁₀は電力比のデシベルを求める式。電圧などの振幅比のゲインには20log₁₀を使う。","入力÷出力では符号が逆になり、増幅すると負の値になってしまう。ゲインは出力を入力で割って求める。","係数がなく、比ではなく積をとっている。デシベルは出力と入力の比の対数に20を掛けて求める。"],"https://www.youtube.com/watch?v=e8Hjd9T6rPI","初心者向け電験三種 ボード線図・ナイキスト線図",""],["ゲインが20dBなら出力は入力の何倍、−40dBなら何倍か？","10倍、1/100倍","20倍、1/40倍","100倍、1/10000倍","2倍、1/4倍","20dBは20log₁₀(10)なので10倍、40dBは100倍、60dBは1000倍。マイナスは減衰を表し、−20dBは1/10、−40dBは1/100。「20dBごとに10倍」と覚えると速い。","https://kotobank.jp/word/%E3%81%BC%E3%83%BC%E3%81%A9%E7%B7%9A%E5%9B%B3-3170517","ボード線図とは（コトバンク）",["dB値をそのまま倍率と取り違えている。20dBは10倍、−40dBは1/100倍である。","100倍は40dB、1/10000倍は−80dBに当たる。20dBと−40dBの値ではない。","2倍は約6dB、1/4倍は約−12dBに当たる。20dBと−40dBの値ではない。"],"https://www.youtube.com/watch?v=e8Hjd9T6rPI","初心者向け電験三種 ボード線図・ナイキスト線図","",["x:mech3_19","デシベル値と出力／入力の倍率の対応"]],["制御対象に瞬間的に大きな入力を与えて特性を確認することがある。この入力を何と呼ぶか？","インパルス入力","ステップ入力","ランプ入力","正弦波入力","インパルス入力は、ごく短い時間だけ大きな値をとる入力（理想的には面積1のデルタ関数）。これに対する出力（インパルス応答）は、システムの特性そのものを表す。ハンマで叩いて固有振動数を調べる打撃試験もこの考え方。","https://www.fa.omron.co.jp/guide/glossary/meaning/4369.html","ステップ応答（オムロンFA用語辞典）",["ステップ入力は、ある時刻から一定の大きさに切り替わり、その後も続く入力。瞬間的に加える入力ではない。","ランプ入力は、時間に比例して一定の割合で増え続ける入力。瞬間的な大きな入力ではない。","正弦波入力は、一定の周波数で振動する入力で、周波数応答を調べるのに使う。瞬間的な入力ではない。"],"https://www.youtube.com/watch?v=yMQDnEMlbDA","ステップ応答とは？",""],["単位ステップ入力を与えたときの応答を何と呼ぶか？","インディシャル応答","インパルス応答","周波数応答","定常応答","インディシャル応答は、大きさ1の単位ステップ入力を加えたときの応答。立ち上がり時間、オーバーシュート、整定時間など、応答の速さや安定性を評価するのに使う。インパルス応答はインディシャル応答を時間で微分したもの。","https://www.fa.omron.co.jp/guide/glossary/meaning/4369.html","ステップ応答（オムロンFA用語辞典）",["インパルス応答は、ごく短時間の大きな入力（インパルス）に対する応答。単位ステップ入力に対する応答ではない。","周波数応答は、正弦波入力を与えたときの定常的な出力の振幅と位相の変化。ステップ入力に対する応答ではない。","定常応答は、入力を加えて十分時間がたった後の落ち着いた応答部分。過渡的な変化を含むステップ応答全体の名称ではない。"],"https://www.youtube.com/watch?v=yMQDnEMlbDA","ステップ応答とは？","",["x:mech3_21","単位ステップ入力とインディシャル応答"]],["2本の電線をより合わせ、外部ノイズを2本で同じように受けて相殺するケーブルは？","ツイストペアケーブル","同軸ケーブル","光ファイバケーブル","フラットケーブル","ツイストペアケーブルは、2本の線をより合わせたケーブル。外部の磁界ノイズは、よりの1ピッチごとに逆向きに誘導されて打ち消し合う。LANケーブルや計測用の信号線に使われる。電界ノイズにはシールドが有効。","https://e-words.jp/w/%E3%83%84%E3%82%A4%E3%82%B9%E3%83%88%E3%83%9A%E3%82%A2%E3%82%B1%E3%83%BC%E3%83%96%E3%83%AB.html","ツイストペアケーブルとは（IT用語辞典 e-Words）",["同軸ケーブルは、中心導体を外部導体（シールド）で同心状に囲んだケーブル。2本の線をより合わせる構造ではない。","光ファイバケーブルは、電気ではなく光で信号を伝えるため電磁ノイズの影響を受けない。より合わせで打ち消す原理ではない。","フラットケーブルは、多数の電線を平らに並べたケーブル。より合わせていないため、ノイズを打ち消す効果は小さい。"],"https://www.youtube.com/watch?v=40bG_Mn2L0E","ツイストペアケーブルのノイズ耐性テスト","",["x:mech3_22","ツイストペアケーブルによる配線"]],["周辺機能を1チップにまとめた組込み用のワンチップマイコンで、Peripheral Interface Controller の略は？","PIC","PLC","FPGA","DSP","PIC（Peripheral Interface Controller）は、マイクロチップ社の組込み用ワンチップマイコン。CPU、メモリ、タイマ、A/D変換器などの周辺機能を1チップにまとめており、安価で電子工作から産業機器まで使われる。","https://www.marutsu.co.jp/pc/static/large_order/begin_pic","超入門 PICマイコンの使い方（マルツ）",["PLCはProgrammable Logic Controllerの略で、工場の機械制御に使うシーケンサ。組込み用ワンチップマイコンではない。","FPGAは、内部の論理回路を利用者が書き換えられる集積回路。Peripheral Interface Controllerの略ではない。","DSPはDigital Signal Processorの略で、音声や画像などの信号処理を高速に行うプロセッサ。PICとは別物。"],"https://www.youtube.com/watch?v=YFHs_vqHa6Q","PICマイコンって何？何ができるの？","",["w:085_2","PICマイコンの各種パッケージ",{"a":"MikeMurphy","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:PIC_microcontrollers.jpg"}]],["ゲイン40dBの増幅器に入力1Vを入れると、出力は何Vになるか？","100V","40V","10V","1000V","40dBは20log₁₀(100)なので、増幅率は100倍。入力1Vなら出力は100V。20dBなら10倍、60dBなら1000倍。","https://kotobank.jp/word/%E3%81%BC%E3%83%BC%E3%81%A9%E7%B7%9A%E5%9B%B3-3170517","ボード線図とは（コトバンク）",["dBの値をそのまま電圧と取り違えている。40dBは増幅率100倍なので出力は100Vになる。","10Vは増幅率10倍、つまり20dBのときの出力。40dBの場合ではない。","1000Vは増幅率1000倍、つまり60dBのときの出力。40dBの場合ではない。"],"https://www.youtube.com/watch?v=e8Hjd9T6rPI","初心者向け電験三種 ボード線図・ナイキスト線図","",["x:mech3_19","デシベル値と出力／入力の倍率の対応"]],["マイコン制御で外部入力信号が入ったとき、処理を中断して特定番地の処理に移ることを何というか？","割込み処理","ポーリング","DMA転送","リセット","割込み処理は、外部からの信号などをきっかけに、実行中のプログラムを一時中断して、あらかじめ決めた処理（割込みハンドラ）を実行し、終わったら元の処理に戻る仕組み。常に状態を見に行くポーリングより、応答が速くCPUの無駄も少ない。","https://e-words.jp/w/%E5%89%B2%E3%82%8A%E8%BE%BC%E3%81%BF.html","割り込み（インタラプト）とは（IT用語辞典 e-Words）",["ポーリングは、CPUが一定間隔で入力の状態を見に行って確認する方式。信号をきっかけに処理を中断するものではない。","DMA転送は、CPUを介さずにメモリと周辺機器の間でデータを直接転送する仕組み。処理を中断して別処理に移ることではない。","リセットは、マイコンを初期状態に戻してプログラムを最初から実行し直すこと。中断後に元の処理へは戻らない。"],"https://www.youtube.com/watch?v=L504RVXjfCU","【PICマイコン入門】割込み処理 タイマー0",""],["スイッチのa接点はどのように動作するか？","押すと閉じる（つながる）","押すと開く（離れる）","押すたびに切り替わる","押している間だけ開く","a接点（メーク接点、NO：常時開）は、ボタンを押したりリレーが動作したりしたときに閉じて電流が流れる接点。b接点（ブレーク接点、NC：常時閉）は普段は閉じていて、動作すると開く。非常停止ボタンには断線しても安全側になるb接点を使う。","https://faq.fa.omron.co.jp/tech/s/article/faq02056","接点極数（オムロン 一般リレー用語解説）",["押すと開く動作はb接点（ブレーク接点、常時閉）のもの。a接点は普段開いている。","押すたびに切り替わるのはオルタネイト動作（保持形）の特徴。a接点かb接点かとは別の分類。","押している間だけ開くのはb接点の動作。a接点は押している間だけ閉じる。"],"https://www.youtube.com/watch?v=Qftj8emU6vQ","a接点・b接点・c接点《リレー》とスイッチの構造","",["w:081_0","a接点（ノーマルオープン）の図記号",{"a":"Unknown authorUnknown author","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Symbol_Threshold_switch_(Normally_open_contact).svg"}]]]},{"id":"elec1","title":"電気電子 1-1 電気回路の基礎・1-2 電子回路の基礎","cat":"電気電子","q":[["抵抗器の抵抗値や許容差を色帯で表す方法を何というか？","カラーコード","バーコード","マーキングコード","E系列","カラーコードは、抵抗器の本体に描いた色帯で抵抗値と許容差を表す方法。4本帯なら「第1数字・第2数字・乗数・許容差」の順で読む。色と数字の対応は黒0、茶1、赤2、橙3、黄4、緑5、青6、紫7、灰8、白9。許容差は金±5%、銀±10%。","https://detail-infomation.com/resistor-color-code/","抵抗のカラーコード 一覧表・読み方（Electrical Information）",["バーコードは太さの異なる線の並びで商品番号などの情報を表す符号で、抵抗値の表示には使わない。","マーキングコードは数字や英字を部品表面に印字して値を示す方式で、色帯による表示ではない。","E系列は抵抗値やコンデンサ容量の標準数列（E6、E12、E24など）で、値の表し方の名称ではない。"],"https://www.youtube.com/watch?v=T_jj4pSKEcY","抵抗器のカラーコード 電気の基礎","",["x:elec1_1","抵抗のカラーコード（4本帯・5本帯の読み方）"]],["4個の抵抗を組み合わせ、その対角線上に検流計を接続した回路を何というか？","ホイートストンブリッジ","ウィーンブリッジ","差動増幅回路","分圧回路","ホイートストンブリッジは、4つの抵抗をひし形に組み、対角線の一方に電源、もう一方に検流計をつないだ回路。検流計の振れがゼロになるよう調整すると、既知の抵抗から未知の抵抗を精密に求められる。ストレインゲージの測定回路としても使われる。","https://detail-infomation.com/wheatstone-bridge/","ホイートストンブリッジとは？平衡条件など（Electrical Information）",["ウィーンブリッジは抵抗とコンデンサを組み合わせたブリッジで、主に発振回路や周波数測定に使われる。","差動増幅回路は2つの入力の差を増幅するトランジスタやオペアンプの回路で、検流計を使うブリッジではない。","分圧回路は抵抗を直列につないで電圧を分ける回路で、対角線に検流計をつなぐ構成ではない。"],"https://www.youtube.com/watch?v=miMDlW0x3_E","高校物理 電磁気 ホイートストンブリッジ","",["x:elec1_2","ホイートストンブリッジ回路の構成"]],["ホイートストンブリッジ（R1・R2が上辺、R3・R4が下辺）で、検流計に電流が流れない平衡条件は？","R1R4 ＝ R2R3","R1R2 ＝ R3R4","R1 + R4 ＝ R2 + R3","R1R3 ＝ R2R4","ブリッジが平衡して検流計に電流が流れないとき、向かい合う辺の抵抗の積が等しくなる（R1R4＝R2R3）。言い換えると R1/R2＝R3/R4 で、両側の分圧比が等しく、中点の電位が一致している状態。","https://detail-infomation.com/wheatstone-bridge/","ホイートストンブリッジとは？平衡条件など（Electrical Information）",["R1R2＝R3R4は同じ辺の抵抗どうしを掛けた式で、両側の分圧比が等しいという平衡条件にならない。","抵抗の和が等しくても分圧比が等しいとは限らず、平衡条件は和ではなく積（比）の関係で表される。","R1R3＝R2R4は左右の抵抗を掛けた式で、R1/R2＝R3/R4を変形した正しい関係とは異なる。"],"https://www.youtube.com/watch?v=miMDlW0x3_E","高校物理 電磁気 ホイートストンブリッジ","",["x:elec1_2","ブリッジ回路（平衡時はA点とB点が同電位）"]],["誘電体に酸化皮膜、電極にアルミニウムを用いた比較的大容量のコンデンサは？","アルミ電解コンデンサ","タンタル電解コンデンサ","セラミックコンデンサ","フィルムコンデンサ","アルミ電解コンデンサは、アルミ箔の表面に作った薄い酸化皮膜を誘電体にしたコンデンサ。安価で大容量が得られるため、電源の平滑回路などに広く使われる。極性があり、寿命（電解液の乾燥）や温度に注意が必要。","https://detail-infomation.com/capacitor-type/","コンデンサの種類まとめ（Electrical Information）",["タンタル電解コンデンサはタンタルの酸化皮膜を使うもので、電極はアルミニウムではない。","セラミックコンデンサはチタン酸バリウムなどのセラミックスを誘電体にし、酸化皮膜は使わない。","フィルムコンデンサはプラスチックフィルムを誘電体にしたもので、容量は比較的小さい。"],"https://www.youtube.com/watch?v=n_sjRYkeEk8","知らないとマズい！コンデンサの種類と特徴","",["w:127_2","アルミ電解コンデンサの外観例（円筒形・大容量）",{"a":"Raimond Spekking","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Philips_N4422_-_capacitor_6800%C2%B5F,_40V-2954.jpg"}]],["誘電体に酸化皮膜、電極にタンタルを用いた、特性は良いが高価なコンデンサは？","タンタル電解コンデンサ","アルミ電解コンデンサ","マイカコンデンサ","フィルムコンデンサ","タンタル電解コンデンサは、タンタルの酸化皮膜を誘電体にしたコンデンサ。アルミ電解より小型で、漏れ電流が少なく温度特性も良いが高価。極性があり、過電圧や逆電圧で短絡・発火することがある。","https://detail-infomation.com/capacitor-type/","コンデンサの種類まとめ（Electrical Information）",["アルミ電解コンデンサはアルミの酸化皮膜を使うもので、安価で大容量なのが特徴である。","マイカコンデンサは雲母（マイカ）を誘電体にしたもので、安定性が高く高周波回路に使われる。","フィルムコンデンサはプラスチックフィルムを誘電体にしたもので、酸化皮膜やタンタルは使わない。"],"https://www.youtube.com/watch?v=n_sjRYkeEk8","知らないとマズい！コンデンサの種類と特徴","",["w:211_0","タンタル電解コンデンサの各種外観（リード形・チップ形）",{"a":"Elcap, Jens Both","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Tantal-P1100196c.jpg"}]],["アルミ電解コンデンサとタンタル電解コンデンサに共通することは？","極性があり、逆電圧をかけられない","極性がなく、交流回路に使える","容量が非常に小さい","誘電体にプラスチックを使う","電解コンデンサは、酸化皮膜が片方の電極にしかないため極性（＋と−）がある。逆向きの電圧をかけると皮膜が壊れて大電流が流れ、発熱・破裂の原因になる。交流が加わる回路には、無極性のフィルムコンデンサやセラミックコンデンサを使う。","https://detail-infomation.com/capacitor-type/","コンデンサの種類まとめ（Electrical Information）",["極性がなく交流回路に使えるのはフィルムやセラミックコンデンサの特徴で、電解コンデンサには当てはまらない。","電解コンデンサは薄い酸化皮膜を使うため、むしろ大容量が得られるのが特徴である。","誘電体にプラスチックを使うのはフィルムコンデンサで、電解コンデンサは酸化皮膜を使う。"],"https://www.youtube.com/watch?v=n_sjRYkeEk8","知らないとマズい！コンデンサの種類と特徴","",["x:elec1_6","コンデンサの図記号（極性なし・極性あり）"]],["誘電体にプラスチックフィルムを用いた、絶縁性が高く低損失のコンデンサは？","フィルムコンデンサ","セラミックコンデンサ","電解コンデンサ","電気二重層コンデンサ","フィルムコンデンサは、ポリエステルやポリプロピレンなどのプラスチックフィルムを誘電体にしたコンデンサ。絶縁性が高く損失が小さく、特性が安定している。極性がないので交流回路にも使え、オーディオや精密回路に向く。","https://detail-infomation.com/capacitor-type/","コンデンサの種類まとめ（Electrical Information）",["セラミックコンデンサはチタン酸バリウムなどのセラミックスを誘電体にしたもので、プラスチックは使わない。","電解コンデンサは金属の酸化皮膜を誘電体にしたもので、極性があり損失も比較的大きい。","電気二重層コンデンサは電極と電解液の界面にできる電気二重層を利用した超大容量の蓄電素子である。"],"https://www.youtube.com/watch?v=n_sjRYkeEk8","知らないとマズい！コンデンサの種類と特徴","",["w:150_0","フィルムコンデンサの外観例（箱形）",{"a":"Retired electrician","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Epcos_boxed_film_capacitor_03.jpg"}]],["チタン酸バリウムなど誘電率の大きい材料を使った小型のコンデンサは？","セラミックコンデンサ","フィルムコンデンサ","タンタル電解コンデンサ","マイカコンデンサ","セラミックコンデンサは、チタン酸バリウムなど誘電率の大きいセラミックスを誘電体にしたコンデンサ。小型・安価で高周波特性が良く、ICの電源ラインのノイズ除去（パスコン）などに大量に使われる。","https://detail-infomation.com/capacitor-type/","コンデンサの種類まとめ（Electrical Information）",["フィルムコンデンサはプラスチックフィルムを誘電体にしたもので、チタン酸バリウムは使わない。","タンタル電解コンデンサはタンタルの酸化皮膜を誘電体にしたもので、セラミックスは使わない。","マイカコンデンサは雲母を誘電体にしたもので、誘電率はそれほど大きくない。"],"https://www.youtube.com/watch?v=n_sjRYkeEk8","知らないとマズい！コンデンサの種類と特徴",""],["真空の誘電率はおよそいくらか？","8.85 × 10⁻¹² F/m","4π × 10⁻⁷ H/m","1.60 × 10⁻¹⁹ C","6.02 × 10²³ /mol","真空の誘電率ε₀は約8.85×10⁻¹² F/m。静電容量やクーロン力の計算で使う基本定数。4π×10⁻⁷ H/mは真空の透磁率μ₀、1.60×10⁻¹⁹ Cは電子の電荷（電気素量）なので混同しないこと。","https://detail-infomation.com/permittivity/","誘電率とは？比誘電率や単位など（Electrical Information）",["4π×10⁻⁷ H/mは真空の透磁率μ₀の値で、誘電率ではない。","1.60×10⁻¹⁹ Cは電子1個の電荷の大きさ（電気素量）で、誘電率ではない。","6.02×10²³ /molはアボガドロ定数で、1molあたりの粒子数を表す化学の定数である。"],"https://www.youtube.com/watch?v=PKSGPCeA8GE","電気回路1解説 コンデンサの構造、静電容量",""],["磁性体を大きく3つに分けると？","強磁性体、常磁性体、反磁性体","強磁性体、半導体、絶縁体","軟磁性体、硬磁性体、非磁性体","導体、誘電体、磁性体","磁性体は、磁界中で強く磁化される強磁性体（鉄・ニッケル・コバルト）、弱く同じ向きに磁化される常磁性体（アルミ・白金など）、弱く逆向きに磁化される反磁性体（銅・銀・ビスマスなど）に分けられる。磁石にくっつくのは強磁性体だけ。","https://kotobank.jp/word/%E7%A3%81%E6%80%A7%E4%BD%93-4228","磁性体とは（コトバンク）",["半導体と絶縁体は電気の通しやすさによる分類で、磁性による分類ではない。","軟磁性体・硬磁性体は強磁性体を磁化のされやすさや保磁力で分けたもので、磁性体全体の3分類ではない。","導体・誘電体・磁性体は電気的・磁気的な材料の種類を並べたもので、磁性体の分類ではない。"],"https://www.youtube.com/watch?v=gutzo9PXmec","【大学物理】電磁気学 常磁性体, 反磁性体, 強磁性体",""],["NΦ ＝ LI の比例定数Lを何といい、単位は何か？","自己インダクタンス、ヘンリー[H]","相互インダクタンス、ファラド[F]","静電容量、ファラド[F]","透磁率、テスラ[T]","コイルに電流Iを流すと磁束Φが生じ、巻数Nとの積（鎖交磁束NΦ）は電流に比例する。この比例定数Lが自己インダクタンスで、単位はヘンリー[H]。電流が変化すると、Lに比例した逆起電力が生じる。","https://detail-infomation.com/self-inductance/","自己インダクタンスのまとめ（Electrical Information）",["相互インダクタンスは2つのコイル間の結合を表す量で単位はH、ファラドは静電容量の単位である。","静電容量はQ＝CVの比例定数で単位はF、電荷と電圧の関係を表すものである。","透磁率は磁束の通りやすさを表す材料定数（H/m）で、テスラは磁束密度の単位である。"],"https://www.youtube.com/watch?v=y_IQLxG5x3g","【電磁誘導01】電磁誘導の法則",""],["コイルを貫く磁束の増減によってコイルに起電力が生じ電流が流れる現象を何というか？","電磁誘導","静電誘導","ホール効果","ゼーベック効果","電磁誘導は、コイルを貫く磁束が変化するとき、その変化を妨げる向きに起電力が生じる現象。起電力の大きさは磁束の変化の速さに比例する（ファラデーの法則）。向きはレンツの法則で決まる。発電機や変圧器の原理。","https://detail-infomation.com/self-inductance/","自己インダクタンスのまとめ（Electrical Information）",["静電誘導は帯電体を近づけると導体表面に電荷が偏る現象で、磁束の変化とは関係ない。","ホール効果は電流が流れる導体に磁界をかけると直角方向に電圧が生じる現象で、磁束の増減は不要である。","ゼーベック効果は異なる金属の接合部に温度差があると起電力が生じる現象で、熱電対の原理である。"],"https://www.youtube.com/watch?v=y_IQLxG5x3g","【電磁誘導01】電磁誘導の法則","",["x:elec1_12","磁石の出し入れによる電磁誘導"]],["電磁誘導によって発生する起電力と流れる電流をそれぞれ何というか？","誘導起電力、誘導電流","逆起電力、渦電流","自己起電力、変位電流","熱起電力、漏れ電流","電磁誘導によって生じる起電力を誘導起電力、それによって流れる電流を誘導電流という。誘導電流は、元の磁束の変化を打ち消す向きに流れる（レンツの法則）。","https://detail-infomation.com/self-inductance/","自己インダクタンスのまとめ（Electrical Information）",["逆起電力は自己誘導で電流変化を妨げる向きに生じる起電力、渦電流は導体内に渦状に流れる誘導電流の一種で、一般的な呼び名ではない。","変位電流は電界の時間変化によって生じる電流の概念で、電磁誘導で流れる電流の名称ではない。","熱起電力はゼーベック効果による起電力、漏れ電流は絶縁物などを通って漏れる電流で、電磁誘導とは関係ない。"],"https://www.youtube.com/watch?v=y_IQLxG5x3g","【電磁誘導01】電磁誘導の法則",""],["電気エネルギーから機械エネルギー（力）が生じることを説明する法則は？","フレミングの左手の法則","フレミングの右手の法則","レンツの法則","アンペアの右ねじの法則","フレミングの左手の法則は、磁界の中の導体に電流を流すと力が働くことと、その向きを示す法則。中指＝電流、人差し指＝磁界、親指＝力の向き（「電・磁・力」）。モータの原理。発電機の原理（導体を動かすと起電力が生じる）は右手の法則。","https://kotobank.jp/word/%E3%83%95%E3%83%AC%E3%83%9F%E3%83%B3%E3%82%B0%E3%81%AE%E6%B3%95%E5%89%87-127790","フレミングの法則とは（コトバンク）",["フレミングの右手の法則は磁界中で導体を動かしたときの誘導起電力の向きを示し、発電機の原理である。","レンツの法則は誘導起電力が磁束の変化を妨げる向きに生じることを示す法則で、力の発生ではない。","アンペアの右ねじの法則は電流の周りにできる磁界の向きを示す法則で、力の向きは扱わない。"],"https://www.youtube.com/watch?v=NYo35a6u6Ws","フレミングの法則の原理を徹底解説","",["x:elec1_14","フレミングの左手の法則（電磁力・磁界・電流）"]],["正弦波で、任意の時刻tにおける値 v(t) を何というか？","瞬時値","実効値","最大値","平均値","瞬時値は、時間とともに変化する交流の、ある瞬間の値。正弦波ならv(t)＝Vm sin(ωt＋θ)で表す。最大値Vm、実効値（Vm/√2）、平均値（2Vm/π）と区別する。","https://detail-infomation.com/the-difference-of-average-and-rms/","平均値と実効値の違い（Electrical Information）",["実効値は同じ電力を生む直流に換算した値で、正弦波ではVm/√2となる一定値である。","最大値は正弦波の振幅Vmで、1周期の中の最も大きな値を指す一定値である。","平均値は半周期の平均で正弦波では2Vm/πとなり、時刻tごとの値ではない。"],"https://www.youtube.com/watch?v=bDwZb-AzxIQ","【交流02】交流の実効値","",["x:elec1_15","正弦波の振幅・ピークピーク値・周期"]],["周波数fと角周波数ωの関係式は？","ω ＝ 2πf ＝ 2π/T","ω ＝ f/2π","ω ＝ 2πT","ω ＝ πf/2","角周波数ωは1秒間に進む位相角[rad/s]。1周期で2πラジアン進むので、ω＝2πf＝2π/T（T：周期）。50Hzならω≒314 rad/s。","https://detail-infomation.com/the-difference-of-average-and-rms/","平均値と実効値の違い（Electrical Information）",["f/2πでは単位がrad/sにならず、2πを掛けるべきところを割ってしまっている。","周期Tは周波数の逆数なので、2πTでは周期に比例してしまい角周波数にならない。","1周期で進む角度は2πなので、πf/2では値が4分の1になってしまう。"],"https://www.youtube.com/watch?v=bDwZb-AzxIQ","【交流02】交流の実効値",""],["コンデンサに流れる電流は、電圧に対してどのくらい位相が進んでいるか？","90°","45°","180°","0°（同相）","コンデンサでは、電荷がたまるにつれて電圧が上がるため、電流が電圧より90°（π/2）先に進む。「コンデンサは電流が進む」と覚える。コイルでは逆に電流が電圧より90°遅れる。","https://detail-infomation.com/resistance-reactance-impedance/","抵抗とリアクタンスとインピーダンスの違い（Electrical Information）",["45°の位相差はRとCが同程度の大きさのRC回路などで生じるもので、純粋なコンデンサではない。","180°は電流と電圧が完全に逆向きの関係で、コンデンサ単体では生じない。","同相（0°）は抵抗だけの回路の関係で、コンデンサでは電流が進む。"],"https://www.youtube.com/watch?v=Twdg-Q1w6_0","初心者向け電験三種 リアクタンス・インピーダンス","",["x:elec1_17","コンデンサ回路の電圧と電流の波形"]],["コイルに生じる電圧は、電流に対してどのくらい位相が進んでいるか？","90°","45°","180°","0°（同相）","コイルは電流の変化を妨げる性質があるため、電圧が電流より90°先に進む（電流が90°遅れる）。コンデンサとは逆の関係になる。覚え方の例として「ELI the ICE man」（コイルLでは電圧Eが先、コンデンサCでは電流Iが先）がある。","https://detail-infomation.com/resistance-reactance-impedance/","抵抗とリアクタンスとインピーダンスの違い（Electrical Information）",["45°の位相差は抵抗とリアクタンスが等しいRL回路などで生じるもので、純粋なコイルではない。","180°は電圧と電流が完全に逆向きの関係で、コイル単体では生じない。","同相（0°）は抵抗だけの回路の関係で、コイルでは電圧が電流より進む。"],"https://www.youtube.com/watch?v=Twdg-Q1w6_0","初心者向け電験三種 リアクタンス・インピーダンス","",["x:elec1_18","コイル回路の電圧と電流の波形"]],["交流において電流を妨げる働き（抵抗とリアクタンスを合わせたもの）を何というか？","インピーダンス","コンダクタンス","アドミタンス","サセプタンス","インピーダンスZは、交流回路で電流を妨げる働きの大きさで、抵抗Rとリアクタンス（コイルやコンデンサによる成分）Xを合わせたもの（Z＝R＋jX）。単位はΩで、大きさは√(R²＋X²)。インピーダンスの逆数はアドミタンス。","https://detail-infomation.com/resistance-reactance-impedance/","抵抗とリアクタンスとインピーダンスの違い（Electrical Information）",["コンダクタンスは抵抗の逆数（電流の流れやすさ）で、単位はSである。","アドミタンスはインピーダンスの逆数で、交流での電流の流れやすさを表す。","サセプタンスはアドミタンスの虚部で、リアクタンス成分の流れやすさを表す量である。"],"https://www.youtube.com/watch?v=Twdg-Q1w6_0","初心者向け電験三種 リアクタンス・インピーダンス",""],["容量性リアクタンスXcはどう表されるか？","1/(ωC)","ωC","ωL","1/(ωL)","容量性リアクタンスXc＝1/(ωC)＝1/(2πfC)。周波数が高いほど小さくなるので、コンデンサは高周波を通しやすく、直流（f＝0）は通さない。","https://detail-infomation.com/resistance-reactance-impedance/","抵抗とリアクタンスとインピーダンスの違い（Electrical Information）",["ωCは容量性サセプタンス（コンデンサの電流の流れやすさ）で、リアクタンスはその逆数になる。","ωLは誘導性リアクタンスで、コイルの電流の妨げを表す。","1/(ωL)は誘導性サセプタンスに当たり、コンデンサのリアクタンスではない。"],"https://www.youtube.com/watch?v=Twdg-Q1w6_0","初心者向け電験三種 リアクタンス・インピーダンス",""],["誘導性リアクタンスXLはどう表されるか？","ωL","1/(ωL)","ωC","1/(ωC)","誘導性リアクタンスXL＝ωL＝2πfL。周波数が高いほど大きくなるので、コイルは高周波を通しにくく、直流はそのまま通す。チョークコイルでノイズを止めるのはこの性質を利用している。","https://detail-infomation.com/resistance-reactance-impedance/","抵抗とリアクタンスとインピーダンスの違い（Electrical Information）",["1/(ωL)は誘導性サセプタンスで、周波数が高いほど小さくなりコイルの性質と逆になる。","ωCは容量性サセプタンスで、コンデンサに関する量である。","1/(ωC)は容量性リアクタンスで、コンデンサの電流の妨げを表す。"],"https://www.youtube.com/watch?v=Twdg-Q1w6_0","初心者向け電験三種 リアクタンス・インピーダンス",""],["P ＝ VI cosθ を何といい、cosθ を何というか？","有効電力、力率","皮相電力、効率","無効電力、力率","有効電力、位相差","有効電力P＝VIcosθは、抵抗で実際に消費される電力で、単位はW。cosθを力率といい、電圧と電流の位相差θが小さいほど1に近づく。モータなど誘導性の負荷は力率が下がるため、コンデンサを入れて力率を改善する。","https://detail-infomation.com/difference-of-power/","有効電力・無効電力・皮相電力の違い（Electrical Information）",["皮相電力はS＝VIで表され、効率は出力と入力の比でcosθではない。","無効電力はQ＝VIsinθで表され、VIcosθではない。","VIcosθは有効電力だが、cosθは位相差そのものではなく位相差θの余弦（力率）である。"],"https://www.youtube.com/watch?v=V2gYg4f8x2g","皮相電力・有効電力・無効電力について説明","",["x:elec1_22","皮相電力・有効電力・無効電力の関係"]],["S ＝ VI を何というか？","皮相電力","有効電力","無効電力","瞬時電力","皮相電力S＝VIは、電圧と電流の実効値をそのまま掛けた見かけの電力で、単位はVA。有効電力P、無効電力Qとの間にS²＝P²＋Q²の関係がある。変圧器や発電機の容量は皮相電力で表す。","https://detail-infomation.com/difference-of-power/","有効電力・無効電力・皮相電力の違い（Electrical Information）",["有効電力はP＝VIcosθで、力率を掛けた実際に消費される電力である。","無効電力はQ＝VIsinθで、単位はvarである。","瞬時電力は各瞬間の電圧と電流の積v(t)i(t)で、実効値の積ではない。"],"https://www.youtube.com/watch?v=V2gYg4f8x2g","皮相電力・有効電力・無効電力について説明",""],["抵抗・コンデンサ・コイルを含む回路で、特定の周波数で大きな電流が流れる現象を何というか？","共振","過渡現象","共鳴放電","発振","共振は、RLC回路でコイルとコンデンサのリアクタンスが打ち消し合う周波数で起こる現象。直列共振ではインピーダンスが最小（Rだけ）になり、大きな電流が流れる。ラジオの選局（同調回路）などに利用される。","https://detail-infomation.com/rlc-series-resonant-circuit/","RLC直列共振回路とは？共振周波数の導出など（Electrical Information）",["過渡現象はスイッチ操作直後などに定常状態へ移るまでの変化で、特定周波数で電流が増える現象ではない。","共鳴放電という電気回路の用語はなく、周波数特性を表す現象名ではない。","発振は外部入力なしに回路自身が持続的な交流信号を作り出す現象で、共振を利用することはあるが別物である。"],"https://www.youtube.com/watch?v=G90Jn-inp84","電気回路1解説 RLC直列回路の共振","",["x:elec1_24","直列共振回路の共振曲線"]],["共振の曲線の鋭さを表す値を何というか？","Q値","ゲイン","時定数","SN比","Q値（尖鋭度）は、共振曲線の鋭さを表す値。Q＝共振周波数÷帯域幅で、Qが大きいほど特定の周波数だけを鋭く選び出せる。直列共振回路ではQ＝ωL/R で、抵抗が小さいほどQは大きい。","https://detail-infomation.com/rlc-series-resonant-circuit/","RLC直列共振回路とは？共振周波数の導出など（Electrical Information）",["ゲインは増幅器の入力に対する出力の比（増幅度）で、共振の鋭さではない。","時定数は過渡応答の速さを表す値（CRやL/R）で、共振曲線とは関係ない。","SN比は信号と雑音の大きさの比で、共振曲線の鋭さではない。"],"https://www.youtube.com/watch?v=G90Jn-inp84","電気回路1解説 RLC直列回路の共振",""],["直列共振の条件は？","ωL − 1/(ωC) ＝ 0","ωL + 1/(ωC) ＝ 0","ωLC ＝ 0","R ＝ ωL","直列共振は、誘導性リアクタンスωLと容量性リアクタンス1/(ωC)が等しくなり、差がゼロになるときに起こる。このときインピーダンスは抵抗Rだけになり、電流は最大になる。","https://detail-infomation.com/rlc-series-resonant-circuit/","RLC直列共振回路とは？共振周波数の導出など（Electrical Information）",["ωLと1/(ωC)はどちらも正の値なので、和がゼロになることはない。","ωLC＝0はLかCがゼロの場合にしか成り立たず、共振条件はω²LC＝1である。","R＝ωLは抵抗とリアクタンスが等しく位相差が45°になる条件で、共振条件ではない。"],"https://www.youtube.com/watch?v=G90Jn-inp84","電気回路1解説 RLC直列回路の共振","",["x:elec1_26","RLC直列回路"]],["共振周波数fはどう表されるか？","1 / (2π√(LC))","2π√(LC)","1 / (2πLC)","√(L/C)","共振条件ωL＝1/(ωC)から ω²LC＝1、ω＝1/√(LC)。ω＝2πfなので、共振周波数 f＝1/(2π√(LC))。LやCを大きくすると共振周波数は下がる。","https://detail-infomation.com/rlc-series-resonant-circuit/","RLC直列共振回路とは？共振周波数の導出など（Electrical Information）",["2π√(LC)は共振周期に相当する式で、周波数はその逆数になる。","ω²LC＝1から求まるのは√(LC)なので、平方根が抜けたこの式は誤りである。","√(L/C)は特性インピーダンスに当たる量で、単位はΩであり周波数ではない。"],"https://www.youtube.com/watch?v=G90Jn-inp84","電気回路1解説 RLC直列回路の共振",""],["2本の線で送られる、家庭用コンセントなどに使われる交流は？","単相交流","三相交流","二相交流","直流","単相交流は、2本の電線で送る1つの交流。一般家庭のコンセント（100V）は単相2線式、200V機器もある住宅は単相3線式で配電されている。","https://www.orientalmotor.co.jp/ja/tech/e-learning/ac-list/fundamental/1-4","ACモーターの動作原理2（回転磁界）（オリエンタルモーター）",["三相交流は3本の線で送る交流で、送配電や工場の動力に使われる。","二相交流は位相が90°ずれた2つの交流で、現在の一般的な配電には使われない。","直流は向きと大きさが一定の電流で、家庭用コンセントは交流である。"],"https://www.youtube.com/watch?v=6vzrJtCPlVo","【交流回路】単相交流と三相交流の違い Y結線編",""],["3本の線で送られる、配電線や送電線などに使われる交流は？","三相交流","単相交流","単相三線式","直流","三相交流は、位相が120°ずつずれた3つの交流を3本の線で送る方式。同じ電力を送るのに電線が少なくて済み、回転磁界を作れるので三相誘導電動機を直接回せる。送電・配電や工場の動力に使われる。","https://www.orientalmotor.co.jp/ja/tech/e-learning/ac-list/fundamental/1-4","ACモーターの動作原理2（回転磁界）（オリエンタルモーター）",["単相交流は2本の線で送る交流で、家庭用コンセントに使われる。","単相三線式は単相交流を3本の線で配電する方式で、100Vと200Vを取り出せる住宅用配電である。","直流は向きが変わらない電流で、一般の配電線や送電線は交流である。"],"https://www.youtube.com/watch?v=6vzrJtCPlVo","【交流回路】単相交流と三相交流の違い Y結線編","",["x:elec1_29","三相交流の発生と3つの電圧波形"]],["デルタ結線で、線電流の位相は相電流よりどのくらい遅れるか？","30°","60°","90°","120°","デルタ（Δ）結線では、線電流の大きさは相電流の√3倍で、位相は30°遅れる。電圧は線間電圧＝相電圧。スター結線と対になる関係なので、セットで覚えておく。","https://www.jeea.or.jp/course/contents/08215/","三相交流のY結線とΔ結線（日本電気技術者協会）",["60°は三相の位相差120°の半分で、線電流と相電流の位相差ではない。","90°はコイルやコンデンサの電圧と電流の位相差で、デルタ結線の関係ではない。","120°は三相交流の各相間の位相差で、線電流と相電流の差ではない。"],"https://www.youtube.com/watch?v=kR3e4cxGtfk","【なぜ√3倍？】スター結線とデルタ結線のベクトル図","",["x:elec1_30","Δ結線の相電流と線電流のベクトル"]],["スター結線で、線間電圧の位相は相電圧よりどのくらい進むか？","30°","60°","90°","120°","スター（Y）結線では、線間電圧の大きさは相電圧の√3倍で、位相は30°進む。電流は線電流＝相電流。中性点を接地できるので、配電系統で多く使われる。","https://www.jeea.or.jp/course/contents/08215/","三相交流のY結線とΔ結線（日本電気技術者協会）",["60°は三相の位相差の半分で、線間電圧と相電圧の位相差ではない。","90°はリアクタンス素子の電圧と電流の位相差で、スター結線の関係ではない。","120°は三相の各相電圧どうしの位相差で、線間電圧と相電圧の差ではない。"],"https://www.youtube.com/watch?v=kR3e4cxGtfk","【なぜ√3倍？】スター結線とデルタ結線のベクトル図","",["x:elec1_31","Y結線の相電圧と線間電圧のベクトル"]],["初期状態から定常状態までの途中の状態変化を何というか？","過渡現象","共振","定常応答","ヒステリシス","過渡現象は、スイッチを入れたり切ったりした直後など、回路がある定常状態から次の定常状態に移るまでの途中の変化。コイルやコンデンサがエネルギーをためたり放出したりするために起こる。","https://detail-infomation.com/rc-circuit-time-constant/","RC回路の時定数 求め方や単位（Electrical Information）",["共振はリアクタンスが打ち消し合う特定周波数で大電流が流れる現象で、状態の移り変わりではない。","定常応答は過渡現象が収まった後の安定した状態の応答で、途中の変化ではない。","ヒステリシスは入力の増加時と減少時で出力が異なる履歴現象で、磁性体の磁化曲線などに見られる。"],"https://www.youtube.com/watch?v=Fkk4sxrYTns","過渡現象（１）RC直列回路1、時定数","",["w:095_1","RC回路の充電曲線：時定数τで約63%、5τでほぼ定常",{"a":"No machine-readable author provided. Ktims assumed (based on","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Series_RC_capacitor_voltage.svg"}]],["CR直列回路の時定数はどう表されるか？","CR","C/R","R/C","1/(CR)","CR直列回路の時定数τ＝C×R[s]。Cが大きいほど、Rが大きいほど充電に時間がかかる。RL回路の時定数はτ＝L/R。","https://detail-infomation.com/rc-circuit-time-constant/","RC回路の時定数 求め方や単位（Electrical Information）",["C/Rでは単位が秒にならず、Rが大きいほど充電が遅くなる性質も表せない。","R/Cは単位が秒にならず、Cが大きいほど時定数が小さくなってしまい誤りである。","1/(CR)は時定数の逆数で、単位は1/sとなり時間を表さない。"],"https://www.youtube.com/watch?v=Fkk4sxrYTns","過渡現象（１）RC直列回路1、時定数","",["x:elec1_33","CR直列回路とコンデンサ電圧の変化"]],["時定数は、定常値の約何%になるまでの時間をいうか？","63.2%","50%","86.5%","36.8%","時定数は、ステップ入力に対して応答が最終値（定常値）の約63.2%（1−1/e）に達するまでの時間。時定数の約3倍で95%、約5倍で99%以上になる。","https://detail-infomation.com/rc-circuit-time-constant/","RC回路の時定数 求め方や単位（Electrical Information）",["50%に達する時間は時定数の約0.69倍（ln2倍）で、時定数の定義ではない。","86.5%は時定数の2倍の時間で到達する値（1−1/e²）である。","36.8%（1/e）は放電時に時定数の時間で残っている割合で、到達割合ではない。"],"https://www.youtube.com/watch?v=Fkk4sxrYTns","過渡現象（１）RC直列回路1、時定数","",["x:elec1_34","時定数τで定常値の約63.2%に達する"]],["装置外部から侵入する雑音と、回路内部で発生する雑音をそれぞれ何というか？","外部雑音、内部雑音","白色雑音、ピンク雑音","熱雑音、ショット雑音","誘導雑音、放射雑音","雑音は発生源の場所によって、装置の外部から侵入する外部雑音（雷、モータ、無線など）と、回路の内部で発生する内部雑音（熱雑音、ショット雑音など）に分けられる。外部雑音はシールドやフィルタで防ぎ、内部雑音は部品や回路の選定で減らす。","https://kotobank.jp/word/%E9%9B%91%E9%9F%B3-69133","雑音とは（コトバンク）",["白色雑音とピンク雑音は周波数スペクトルの形による分類で、発生場所による分類ではない。","熱雑音とショット雑音はどちらも回路内部で発生する内部雑音の種類である。","誘導雑音と放射雑音は外部雑音の伝わり方による分類で、内部雑音を含まない。"],"https://www.youtube.com/watch?v=6dbP1uqQaAQ","抵抗器の熱雑音 LTspice内でのボルツマン定数",""],["周波数に反比例して大きくなる雑音を何というか？","1/f雑音","熱雑音","ショット雑音","ホワイトノイズ","1/f雑音（フリッカ雑音）は、電力が周波数fに反比例し、低い周波数ほど大きくなる雑音。半導体素子や炭素皮膜抵抗などで目立つ。直流に近い微小信号を扱う計測回路で問題になる。","https://kotobank.jp/word/%E9%9B%91%E9%9F%B3-69133","雑音とは（コトバンク）",["熱雑音は電子の熱運動による雑音で、周波数によらず一様なスペクトルをもつ。","ショット雑音は電流の粒子性による雑音で、周波数によらずほぼ一様である。","ホワイトノイズはすべての周波数で強さが一様な雑音で、周波数に反比例しない。"],"https://www.youtube.com/watch?v=6dbP1uqQaAQ","抵抗器の熱雑音 LTspice内でのボルツマン定数","",["x:elec1_36","周波数帯ごとの雑音（1/f・熱・ショット）"]],["絶対温度に応じて抵抗体から発生する雑音は？","熱雑音","ショット雑音","1/f雑音","誘導雑音","熱雑音（ジョンソン雑音）は、抵抗体の中の電子が熱で不規則に動くことで生じる雑音。絶対温度と抵抗値と帯域幅に比例し、どんな抵抗でも避けられない。冷却すると小さくできる。","https://kotobank.jp/word/%E9%9B%91%E9%9F%B3-69133","雑音とは（コトバンク）",["ショット雑音は電流が電子の粒として流れることによる雑音で、温度ではなく電流に依存する。","1/f雑音は低周波ほど大きくなる雑音で、半導体や炭素皮膜抵抗などで目立つ。","誘導雑音は外部の電磁界から電磁誘導で入り込む外部雑音で、抵抗体自身からは発生しない。"],"https://www.youtube.com/watch?v=6dbP1uqQaAQ","抵抗器の熱雑音 LTspice内でのボルツマン定数",""],["電流が流れること（キャリアの粒子性）によって発生する雑音は？","ショット雑音","熱雑音","1/f雑音","量子化雑音","ショット雑音（散弾雑音）は、電流が電子という粒の集まりで流れるため、電子の到着のばらつきで生じる雑音。ダイオードやトランジスタなど、電子が障壁を越えて流れる素子で発生する。","https://kotobank.jp/word/%E9%9B%91%E9%9F%B3-69133","雑音とは（コトバンク）",["熱雑音は電子の熱運動によって生じる雑音で、電流が流れていなくても発生する。","1/f雑音は周波数に反比例して低周波で大きくなる雑音で、粒子性が原因ではない。","量子化雑音はAD変換で連続値を離散値に丸めるときに生じる誤差で、キャリアとは無関係である。"],"https://www.youtube.com/watch?v=6dbP1uqQaAQ","抵抗器の熱雑音 LTspice内でのボルツマン定数",""],["電子回路の雑音を評価するとき、信号の大きさに対する雑音の大きさの比を何というか？","信号対雑音比（SN比）","雑音指数","ダイナミックレンジ","Q値","SN比（信号対雑音比）は、信号の大きさが雑音の大きさの何倍かを示す値。大きいほど雑音が少なく、きれいな信号であることを表す。通常はdBで表す。","https://e-words.jp/w/S-N%E6%AF%94.html","S/N比（信号対雑音比）とは（IT用語辞典 e-Words）",["雑音指数は回路を通ることでSN比がどれだけ悪化したかを示す値で、信号と雑音の比そのものではない。","ダイナミックレンジは扱える最大信号と最小信号（雑音レベル）の比で、測定範囲の広さを表す。","Q値は共振曲線の鋭さを表す値で、雑音の評価には使わない。"],"https://www.youtube.com/watch?v=TCQLb1-Mn88","SN比ってなに？（基礎編）",""],["SN比は信号の実効値Vs、雑音の実効値Vnを使ってどう表されるか？","20 log₁₀(Vs/Vn)","20 log₁₀(Vn/Vs)","10 log₁₀(Vs × Vn)","Vs − Vn","SN比は電圧（実効値）の比なので、dBで表すと20log₁₀(Vs/Vn)。電力比で考える場合は10log₁₀(Ps/Pn)となり、どちらも同じ値になる。","https://e-words.jp/w/S-N%E6%AF%94.html","S/N比（信号対雑音比）とは（IT用語辞典 e-Words）",["分子と分母が逆なので、雑音が小さいほど値がマイナスに大きくなり、SN比の定義と逆になる。","SN比は比の対数で表し、積の対数では信号と雑音の比較にならない。","差は電圧の単位のままで比を表さず、dBによるSN比の定義ではない。"],"https://www.youtube.com/watch?v=TCQLb1-Mn88","SN比ってなに？（基礎編）",""],["雑音係数（雑音指数）NFは、入力と出力のSN比を使ってどう表されるか？","入力のSN比 ÷ 出力のSN比","出力のSN比 ÷ 入力のSN比","入力のSN比 − 出力のSN比","入力のSN比 × 出力のSN比","雑音係数（雑音指数）NF＝入力のSN比÷出力のSN比。回路を通ることでSN比がどれだけ悪化したかを表し、理想的な（雑音を加えない）回路ではNF＝1（0dB）。増幅器は初段のNFが全体の雑音性能を左右する。","https://e-words.jp/w/S-N%E6%AF%94.html","S/N比（信号対雑音比）とは（IT用語辞典 e-Words）",["出力SN比÷入力SN比では、回路で雑音が加わるほど値が1より小さくなり、悪化の度合いと逆になる。","SN比の差はdB表示同士の場合の考え方で、真数のSN比どうしを引いても雑音係数にはならない。","積をとっても劣化の度合いは表せず、雑音係数の定義にはならない。"],"https://www.youtube.com/watch?v=TCQLb1-Mn88","SN比ってなに？（基礎編）","",["x:elec1_41","雑音指数：入力側と出力側のSN比"]],["まれに出る雑音を模擬した信号を発生させ、耐性を試験する装置を何というか？","ノイズシミュレータ","ファンクションジェネレータ","オシロスコープ","スペクトラムアナライザ","ノイズシミュレータは、静電気、スイッチ開閉時のバースト、雷サージなど、まれにしか起こらない雑音を模擬した信号を発生させ、装置の誤動作の有無を調べる試験器。EMC（電磁両立性）のイミュニティ試験に使う。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["ファンクションジェネレータは正弦波や方形波などの一般的な試験信号を発生させる装置である。","オシロスコープは電圧波形を時間軸で観測する測定器で、信号を発生させる装置ではない。","スペクトラムアナライザは信号を周波数成分に分解して観測する測定器で、雑音を発生させない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画","",["w:034_0","静電気放電（ESD）を模擬するノイズ試験器の例",{"a":"Teseq","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Teseq_ESD_Gun.jpg"}]],["2本の電線間に意図せず存在する静電容量を何というか？","浮遊容量","寄生インダクタンス","結合容量","分布抵抗","浮遊容量（ストレーキャパシタンス）は、近くにある導体どうしの間に、意図せずにできてしまう静電容量。配線間や部品間にあり、高周波では無視できず、ノイズの結合や回路の誤動作の原因になる。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["寄生インダクタンスは配線やリード線に意図せず存在するインダクタンスで、静電容量ではない。","結合容量は段間の直流を遮断し交流信号を伝えるため意図的に入れるコンデンサ（カップリング）を指す。","分布抵抗は線路に沿って分布する抵抗成分で、静電容量ではない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画","",["x:elec1_43","2本の導体間にできる浮遊容量"]],["周波数が高いほど小さくなり、急激な変化の電流を通しやすく、雑音を吸収する働きのあるリアクタンスは？","容量性リアクタンス","誘導性リアクタンス","インピーダンス","コンダクタンス","容量性リアクタンス1/(ωC)は周波数が高いほど小さくなるので、コンデンサは高周波や急激に変化する電流を通しやすい。この性質を利用して、高周波ノイズをコンデンサでグランドに逃がす（バイパスする）。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["誘導性リアクタンスωLは周波数が高いほど大きくなり、高周波を通しにくい性質をもつ。","インピーダンスは抵抗とリアクタンスを合わせた量で、周波数との関係は素子の構成によって変わる。","コンダクタンスは抵抗の逆数で、周波数によって変化しないためこの性質に当たらない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画","",["x:elec1_44","容量性リアクタンスとコンデンサによる雑音除去"]],["金属製の箱の隙間に柔軟性のある導体を挟み、導通を保つノイズ対策部品は？","導電性ガスケット","フェライトコア","開口部シールド材","ラインフィルタ","導電性ガスケットは、金属筐体のふたや継ぎ目のすき間に挟み込む、柔軟性のある導電材料。すき間をなくして筐体全体を電気的につなぎ、電磁波の漏れや侵入を防ぐ（シールド性を保つ）。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["フェライトコアは電線に通して高周波ノイズを熱に変えて吸収する部品で、すき間の導通には使わない。","開口部シールド材は表示窓や放熱口などの開口部に付けるメッシュなどで、継ぎ目に挟むものではない。","ラインフィルタは電源入口に入れて電源線を伝わるノイズを抑える部品で、筐体のすき間対策ではない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画",""],["表示窓や放熱口などの開口部に取り付けるノイズ対策物は？","開口部シールド材","導電性ガスケット","フェライトビーズ","バリスタ","開口部シールド材は、表示窓や放熱口など、どうしても開けなければならない部分に取り付ける、金属メッシュや透明導電膜などのシールド材。光や空気は通しつつ、電磁波を遮る。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["導電性ガスケットは筐体の継ぎ目やふたのすき間に挟む導電材で、窓や放熱口用ではない。","フェライトビーズは配線や部品のリードに付けて高周波ノイズを吸収する部品である。","バリスタは過電圧で抵抗が下がりサージを吸収する素子で、開口部のシールドではない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画",""],["必要な成分を通過させ、ノイズの周波数成分を取り除く部品を何というか？","周波数分離型ノイズフィルタ","サージアブソーバ","絶縁トランス","ツイストペア線","周波数分離型ノイズフィルタは、信号とノイズの周波数の違いを利用して、必要な成分を通しノイズの周波数成分を取り除く部品。コイルとコンデンサを組み合わせたLCフィルタや、フェライトコアなどがある。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["サージアブソーバは雷サージなどの瞬間的な過電圧を吸収する素子で、周波数で選別するものではない。","絶縁トランスは一次と二次を電気的に絶縁してノイズの伝わりを抑える変圧器で、周波数分離は行わない。","ツイストペア線は2本の線をより合わせて誘導ノイズを打ち消す配線方法で、部品ではない。"],"https://www.youtube.com/watch?v=1gOerD3ycmc","シールド材を用いた放射ノイズ対策 基礎動画",""],["LCフィルタの基本回路4つの組合せは？","ローパス、ハイパス、バンドパス、バンドエリミネーション","ローパス、バイパス、オールパス、ノッチ","ハイパス、アクティブ、パッシブ、デジタル","ローパス、ハイパス、FIR、IIR","LCフィルタの基本形は4種類。低い周波数を通すローパス、高い周波数を通すハイパス、特定の帯域だけを通すバンドパス、特定の帯域だけを止めるバンドエリミネーション（ノッチ）。目的のノイズの周波数に合わせて選ぶ。","https://techweb.rohm.co.jp/product/nowisee/18796/","ノイズ対策の基礎（ROHM TechWeb）",["バイパスとオールパスはLCフィルタの基本4形に含まれ
