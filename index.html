<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Be 5択ドリル No.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+Antique:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow answer-sheet column; mark-sheet bubbles for choices, faint drafting grid behind */
:root{
  --paper:#f5f6f2; --sheet:#ffffff; --ink:#1d2430; --muted:#5d6675; --line:#d9ddd5;
  --accent:#1f4fa8; --accent-soft:#e6edf9; --ok:#1d7a4c; --ok-soft:#e3f3ea; --ng:#b3362b; --ng-soft:#fbe9e6;
  --grid:rgba(31,79,168,.06);
  --f-display:"Zen Kaku Gothic Antique","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12161d; --sheet:#1a2029; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3542;
  --accent:#7fa6f0; --accent-soft:#1f2b44; --ok:#5cc792; --ok-soft:#173326; --ng:#f08a7e; --ng-soft:#3a1f1c;
  --grid:rgba(127,166,240,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --sheet:#1a2029; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2e3542;
  --accent:#7fa6f0; --accent-soft:#1f2b44; --ok:#5cc792; --ok-soft:#173326; --ng:#f08a7e; --ng-soft:#3a1f1c;
  --grid:rgba(127,166,240,.05); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.mast h1{font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.2}
.mast .sub{font-size:12px;color:var(--muted);letter-spacing:.06em}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:var(--sheet);padding:6px 14px;border-radius:999px;font-size:13px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:4px 10px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;width:100%}
.set .box{width:20px;height:20px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;font-size:13px;color:var(--sheet)}
.set[aria-pressed="true"]{border-color:var(--accent)}
.set[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.set .t{min-width:0;font-size:14px;line-height:1.45}
.set .t small{display:block;color:var(--muted);font-size:12px}
.set .n{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag-new{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--accent);border:1px solid var(--accent);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.start{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em}
:root[data-theme="dark"] .start{color:#0d1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .start{color:#0d1420}}
.start:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7}
/* quiz */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qbar .count{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.quit:disabled{opacity:.35}
.quit{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:3px 10px;font-size:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:18px 16px}
.card .src{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.fig{display:block;max-width:100%;height:auto;margin:4px auto 14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.qtext{font-size:17px;font-weight:700;line-height:1.65;margin:0 0 14px}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:52px;line-height:1.5}
.choice .mk{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.choice span:last-child{min-width:0}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.ok{background:var(--ok-soft);border-color:var(--ok)}
.choice.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.choice.ng{background:var(--ng-soft);border-color:var(--ng)}
.choice.ng .mk{background:var(--ng);border-color:var(--ng);color:var(--sheet)}
.choice.dim{opacity:.55}
.choice.dk{border-style:dashed;color:var(--muted)}
.choice.dk.ng{color:var(--ink)}
.fb{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.verdict{font-family:var(--f-display);font-weight:900;font-size:18px}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.fb p{margin:6px 0 0}
.fb .ans{font-size:14px}
.fb .exp{font-size:14px;color:var(--ink)}
.exf{margin:0 0 12px;text-align:center}
.exf img{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.credit{font-size:10.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.credit a{color:var(--muted)}
.exf figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.exf{margin:0 0 12px;text-align:center;overflow-x:auto}
.exf img.zoom{max-width:none;width:200%}
.exf img{display:block;max-width:100%;height:auto;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.exf figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.xtra{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line,#ccc);font-size:13px;line-height:1.6}
.xh{font-weight:700;color:var(--muted);font-size:12px;margin-bottom:4px}
.xw{margin:4px 0;color:var(--ink)}
.xw b{color:var(--ng)}
.links{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ref{margin-top:0 !important}
.ref.yt{color:#c4302b}
.ref{display:inline-block;margin-top:8px;font-size:13px;color:#2563eb;text-decoration:underline;word-break:break-all}
.next{margin-top:14px;width:100%;background:var(--ink);color:var(--sheet);border:0;border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.kbd{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
/* result */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--f-mono);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.score span{color:var(--muted)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.btn2{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:11px;font-weight:700}
.btn2.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.missed{display:grid;gap:8px;margin-top:8px}
.miss{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:8px;padding:10px 12px;font-size:14px}
.miss .a{color:var(--ok);font-weight:700}
/* list */
.search{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:8px 0 12px}
details.grp{background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.grp>summary{padding:12px 14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
details.grp>summary small{font-family:var(--f-mono);color:var(--muted);font-weight:500;white-space:nowrap}
.rows{border-top:1px solid var(--line)}
.row{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.row .no{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.row .a{color:var(--accent);font-weight:700}
.row .e{color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){.track i{transition:none}}
</style>

<div class="wrap">
  <header class="mast">
    <div>
      <div class="sub">TO-BE ENGINEER EXAM · 5-CHOICE DRILL</div>
      <h1>To-Be 5択ドリル <span style="font-family:var(--f-mono);font-size:.62em;color:var(--accent);border:2px solid var(--accent);border-radius:6px;padding:0 6px;vertical-align:4px">No.1</span></h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-drill" role="tab" aria-selected="true">出題</button>
      <button class="tab" id="tab-list" role="tab" aria-selected="false">問題一覧</button>
    </div>
  </header>

  <section id="v-home">
    <div class="eyebrow">分野で絞り込み</div>
    <div class="cats" id="cats"></div>
    <div class="eyebrow">問題集を選ぶ（複数可）</div>
    <div class="sets" id="sets" style="margin-top:8px"></div>
    <div class="opts">
      <label class="field">出題数<select id="opt-n"><option value="10">10問</option><option value="20" selected>20問</option><option value="50">50問</option><option value="0">全問</option></select></label>
      <label class="field">順番<select id="opt-order"><option value="rand" selected>ランダム</option><option value="seq">問題集の順</option></select></label>
      <label class="field">範囲<select id="opt-scope"><option value="all" selected>すべて</option><option value="miss">前に間違えた問題</option></select></label>
    </div>
    <button class="start" id="start">出題スタート</button>
  </section>

  <section id="v-quiz" hidden>
    <div class="qbar"><span class="count" id="q-count"></span><div class="track"><i id="q-track"></i></div><button class="quit" id="q-prev">← 前へ</button><button class="quit" id="quit">やめる</button></div>
    <div class="card">
      <div class="src" id="q-src"></div>
      <p class="qtext" id="q-text"></p>
      <div class="choices" id="q-choices"></div>
      <div class="fb" id="q-fb" hidden>
        <div class="verdict" id="q-verdict"></div>
        <p class="ans" id="q-ans"></p>
        <p class="exp" id="q-exp"></p>
        <button class="next" id="q-next">次の問題へ</button>
      </div>
    </div>
    <div class="kbd">キーボード: 1〜5 で解答 / Enter で次へ</div>
  </section>

  <section id="v-result" hidden>
    <div class="card">
      <div class="eyebrow">結果</div>
      <div class="score"><b id="r-score"></b><span id="r-detail"></span></div>
      <div class="rbtns"><button class="btn2 pri" id="r-retry">間違えた問題を解き直す</button><button class="btn2" id="r-home">問題集の選択へ</button></div>
      <div class="eyebrow" id="r-mlabel">間違えた問題</div>
      <div class="missed" id="r-missed"></div>
    </div>
  </section>

  <section id="v-list" hidden>
    <input class="search" id="search" type="search" placeholder="キーワードで検索（例: 管理図、焼なまし）">
    <div id="list"></div>
  </section>
</div>

<script>
const DONTKNOW = 'わからない';
function figImg(q){ if(!q[11]) return null; const im=document.createElement('img'); im.className='fig'; im.alt='図'; loadImg(q[11],im); return im; }
function refLink(q){ const box=document.createElement('div'); box.className='xtra';
  if(q[12]&&IMGIDX[q[12][0]]!==undefined){ const fg=document.createElement('figure'); fg.className='exf'; const im=document.createElement('img'); im.alt=q[12][1]; loadImg(q[12][0],im); im.onclick=()=>im.classList.toggle('zoom'); const fc=document.createElement('figcaption'); fc.textContent='図：'+q[12][1]+'（タップで拡大）'; fg.append(im,fc); if(q[12][2]){ const cr=document.createElement('div'); cr.className='credit'; const c2=q[12][2]; cr.append('出典：Wikimedia Commons／'+c2.a+'／'+c2.l+'　'); const al=document.createElement('a'); al.href=c2.u; al.target='_blank'; al.rel='noopener'; al.textContent='元画像 ↗'; cr.append(al); fg.append(cr); } box.append(fg); }
  if(q[8]){ const t=document.createElement('div'); t.className='xh'; t.textContent='ほかの選択肢'; box.append(t);
    [2,3,4].forEach((j,n)=>{ const r=document.createElement('div'); r.className='xw'; const b=document.createElement('b'); b.textContent='✕ '+q[j]; r.append(b, '：'+q[8][n]); box.append(r); }); }
  const lk=(u,label,cls)=>{ const a=document.createElement('a'); a.className='ref '+cls; a.href=u; a.target='_blank'; a.rel='noopener'; a.textContent=label; return a; };
  const ls=document.createElement('div'); ls.className='links';
  if(q[6]) ls.append(lk(q[6],'📄 参考記事：'+q[7]+' ↗','art'));
  if(q[9]) ls.append(lk(q[9],'▶ 解説動画：'+q[10]+' ↗','yt'));
  if(ls.childElementCount) box.append(ls);

const DATA = [{"id":"mech1","title":"機械 1-1 機械工学基礎・1-2 材料","cat":"機械","q":[["ある金属の結晶格子中に別の原子が入り込んでいる状態を何というか？","固溶体","共晶","金属間化合物","析出物","固溶体は、母金属の結晶格子に別の元素の原子が溶け込み、全体が1つの固相になったもの。溶け込み方には、格子のすき間に入る「侵入型」（鋼中の炭素など）と、母原子と入れ替わる「置換型」（Cu-Niなど）がある。共晶は2相が混ざった組織、金属間化合物は決まった原子比で結びついた化合物で、固溶体とは別物。","https://www.keyence.co.jp/ss/products/recorder/heat/basics/glossary.jsp","熱処理用語集（キーエンス）",["共晶は液体から2種の固相が同時に晶出してできる混合組織で、一方の原子が他方の格子に溶け込んだ単一相ではない。","金属間化合物は成分元素が一定の原子比で結合し、母金属とは別の結晶構造を持つ化合物で、格子への溶け込みとは異なる。","析出物は固溶限を超えた成分が固体中から別の相として現れたもので、格子中に溶け込んだ状態とは逆の現象である。"],"https://www.youtube.com/watch?v=fbcltJlOXwk","焼入れはどのように生じるのか？【熱処理講座／オーステナイト編】","",["x:mech1_1","固溶体のモデル（置換型と侵入型）"]],["鋼材を一様なオーステナイト組織になるまで加熱・保持した後、空気中で自然放冷する熱処理を何というか？","焼ならし","焼なまし","焼入れ","焼戻し","焼ならし（ノルマライジング）は、オーステナイト域まで加熱して保持したあと「空冷」する熱処理。結晶粒が細かく均一になり、加工や鋳造で乱れた組織を標準状態に戻す。冷却方法で見分けるのがコツで、炉内でゆっくり冷やすのが焼なまし、水や油で急冷するのが焼入れ、焼入れ後に再加熱してじん性を回復させるのが焼戻し。","https://monoto.co.jp/heat-treatment/","熱処理とは？焼入れ・焼き戻し・焼きなまし・焼きならしを解説（monoto）",["焼なましは加熱・保持後に炉内で徐冷し、材料を軟らかくする熱処理で、空気中で放冷する焼ならしとは冷却方法が違う。","焼入れは加熱後に水や油で急冷してマルテンサイト化し硬くする熱処理で、空冷ではない。","焼戻しは焼入れした鋼を変態点以下で再加熱してじん性を回復させる処理で、オーステナイト化後の空冷ではない。"],"https://www.youtube.com/watch?v=yGiqn44x9ss","焼入れ 焼戻し 焼きなまし 焼きならし｜金属の熱処理を一発理解","",["x:mech1_2","冷却方法による焼入れ・焼ならし・焼なましの違い"]],["鋼材を所定の温度に加熱・保持した後、電気炉内で徐冷する熱処理を何というか？","焼なまし","焼ならし","焼入れ","焼戻し","焼なまし（アニーリング）は、加熱・保持のあと「炉冷」でゆっくり冷やす熱処理。材料を軟らかくして加工しやすくしたり、加工や溶接で生じた内部応力（残留応力）を取り除いたりするのが目的。空冷の焼ならしより冷却が遅いため、より軟らかくなる。","https://monoto.co.jp/heat-treatment/","熱処理とは？焼入れ・焼き戻し・焼きなまし・焼きならしを解説（monoto）",["焼ならしは加熱後に空気中で放冷して組織を微細・均一にする熱処理で、炉内での徐冷ではない。","焼入れは加熱後に水や油で急冷して硬化させる熱処理で、炉内徐冷とは冷却速度が正反対である。","焼戻しは焼入れ後の鋼を再加熱してじん性を与える処理で、単独の加熱・炉冷処理ではない。"],"https://www.youtube.com/watch?v=yGiqn44x9ss","焼入れ 焼戻し 焼きなまし 焼きならし｜金属の熱処理を一発理解","",["x:mech1_2","冷却方法による焼入れ・焼ならし・焼なましの違い"]],["応力-ひずみ曲線において、降伏点が現れない材料の組合せはどれか？","アルミニウム、銅","軟鋼、炭素鋼","軟鋼、鋳鉄","炭素鋼、銅","アルミニウムや銅などの非鉄金属は、軟鋼のように応力が一時的に下がる明確な降伏点を示さない。そこで、除荷後に0.2%の永久ひずみが残る応力を「0.2%耐力」と呼び、降伏点の代わりに使う。軟鋼や炭素鋼は上降伏点・下降伏点がはっきり現れる代表例。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/power/stress-strain.jsp","応力とひずみの関係（キーエンス）",["軟鋼と炭素鋼はどちらも上降伏点・下降伏点がはっきり現れる代表的な材料である。","軟鋼は明確な降伏点を示す材料であり、降伏点が現れない組合せにならない。鋳鉄は塑性変形がほとんどなく脆性的に破断する。","炭素鋼は明確な降伏点が現れるため、銅と組み合わせても降伏点が現れない組合せにはならない。"],"https://www.youtube.com/watch?v=5XbVCbbz7bw","【材料力学】2. 材料の応力-ひずみ線図","",["x:mech1_4","応力-ひずみ曲線（(1)軟鋼は降伏点あり、(2)非鉄金属はなし）"]],["高融点重合金のうち、工業材料として最も多く使われ、強く硬く機械構造に適した合金の分類と例は？","鉄合金、鋼","銅合金、黄銅","ニッケル合金、インコネル","アルミニウム合金、ジュラルミン","鉄合金（鋼）は、強度・硬さ・加工性・価格のバランスがよく、機械構造用材料として最も多く使われる。炭素量や合金元素、熱処理で性質を大きく変えられるのも強み。銅合金は導電性、ニッケル合金は耐熱性、アルミ合金は軽さがそれぞれの特長。","https://jp.meviy.misumi-ec.com/info/ja/howto/materials/15131/","金属材料の性質とは？（meviy）",["銅合金（黄銅など）は導電性・耐食性・加工性が特長で、機械構造用として最も多く使われる強靱な材料ではない。","ニッケル合金（インコネルなど）は耐熱・耐食用の高価な材料で、使用量が最も多い構造材料ではない。","アルミニウム合金（ジュラルミンなど）は軽金属に分類され、高融点重合金の分類には入らない。"],"https://www.youtube.com/watch?v=h7TQR-MgDos","金属ってなに？～鉄、ステンレス、アルミの見分け方～",""],["高融点重合金のうち、鉄合金より耐食性・耐熱性に優れ高価で、ガスタービンやジェットエンジンに使われる分類は？","ニッケル合金","銅合金","鉄合金","亜鉛合金","ニッケル合金（インコネル、ハステロイなど）は、高温でも強度が落ちにくく、耐食性・耐酸化性にも優れる。そのためガスタービンやジェットエンジンのタービン翼、燃焼器など高温部に使われる。高価なので、性能が必要な部位に限って使うのが一般的。ステンレス鋼は鉄を主成分とする鉄合金に分類される。","https://jp.meviy.misumi-ec.com/info/ja/howto/materials/15131/","金属材料の性質とは？（meviy）",["銅合金は導電性・耐食性・鋳造性が特長で、ガスタービンの高温部に使うほどの耐熱性はない。","鉄合金は最も多く使われる安価な構造材料で、この問題が求める「鉄合金より耐熱性に優れる」分類そのものではない。","亜鉛合金は融点が低いダイカスト用材料で、高温で使うガスタービンやジェットエンジンには向かない。"],"https://www.youtube.com/watch?v=h7TQR-MgDos","金属ってなに？～鉄、ステンレス、アルミの見分け方～",""],["耐食性が高く鋳造性・加工性に優れ、電気伝導率も良いため導電体として有用な合金の分類は？","銅合金","鉄合金","ニッケル合金","チタン合金","銅は銀に次いで電気伝導率が高く、銅合金（黄銅＝Cu-Zn、青銅＝Cu-Snなど）は耐食性・鋳造性・加工性にも優れる。電線、端子、熱交換器、軸受、配管部品などに広く使われる。導電性が最優先なら純銅、強度やばね性が必要なら合金を選ぶ。","https://jp.meviy.misumi-ec.com/info/ja/howto/materials/15131/","金属材料の性質とは？（meviy）",["鉄合金は強度と価格のバランスに優れる構造材料だが、電気伝導率は銅に大きく劣り導電体には使われない。","ニッケル合金は耐熱性・耐食性が特長の高価な材料で、導電体として使われる分類ではない。","チタン合金は軽くて強く耐食性に優れるが、電気伝導率は低く導電材料には向かない。"],"https://www.youtube.com/watch?v=h7TQR-MgDos","金属ってなに？～鉄、ステンレス、アルミの見分け方～",""],["亜鉛、すず、ビスマス、アンチモンなどの低融点合金の特性を活かした合金を何というか？","軸受合金（軸受メタル）","超硬合金","形状記憶合金","水素吸蔵合金","亜鉛・すず・ビスマス・アンチモンなどの低融点金属は原子間の結合が弱く、軟らかくて強度は低い。この「軟らかく軸になじみやすい」性質を活かしたのが軸受合金（軸受メタル）で、すべり軸受の内面に使い、軸を傷つけずに荷重を支える。","https://kotobank.jp/word/%E8%BB%B8%E5%8F%97%E5%90%88%E9%87%91-72822","軸受合金とは（コトバンク）",["超硬合金は炭化タングステンをコバルトで焼結した非常に硬い材料で、切削工具などに使われ低融点合金ではない。","形状記憶合金はNi-Tiなどで、変形後に加熱すると元の形に戻る機能を持つ合金で、低融点金属の性質を利用したものではない。","水素吸蔵合金は水素を大量に吸収・放出できるLaNi5などの合金で、低融点金属の軟らかさを活かしたものではない。"],"https://www.youtube.com/watch?v=eRxAmW0tg5k","機械保全技能士 軸受等に関する問題解説","",["x:mech1_8","軸受メタル（軸受合金）を用いたすべり軸受"]],["すずや鉛を主成分とし、アンチモン、銅、亜鉛が加わった低融点重合金は何か？","ホワイトメタル","ガンメタル","ジュラルミン","モネルメタル","ホワイトメタルは、すず（Sn）または鉛（Pb）を主成分とし、アンチモンや銅を加えた代表的な軸受合金。軟らかい基地の中に硬い結晶が分散しており、硬い粒が荷重を受け、軟らかい部分が軸になじむ構造になっている。名前は銀白色の外観から。","https://kotobank.jp/word/%E8%BB%B8%E5%8F%97%E5%90%88%E9%87%91-72822","軸受合金とは（コトバンク）",["ガンメタルは銅にすず・亜鉛などを加えた砲金（青銅の一種）で、すずや鉛を主成分とする合金ではない。","ジュラルミンはアルミニウムに銅・マグネシウムを加えた高力アルミニウム合金で、軸受用の低融点合金ではない。","モネルメタルはニッケルと銅を主成分とする耐食合金で、すず・鉛が主成分のホワイトメタルとは別物である。"],"https://www.youtube.com/watch?v=eRxAmW0tg5k","機械保全技能士 軸受等に関する問題解説",""],["アルミニウム、マグネシウムとその合金は何金属と呼ばれるか？","軽金属","重金属","貴金属","新金属","アルミニウム（比重約2.7）やマグネシウム（約1.7）は比重が小さく「軽金属」と呼ばれる。おおむね比重4〜5以下が目安で、チタン（約4.5）を含めることもある。鉄（約7.9）や銅（約8.9）は重金属側。軽量化が求められる航空機・自動車部品に多用される。","https://jp.meviy.misumi-ec.com/info/ja/howto/materials/15131/","金属材料の性質とは？（meviy）",["重金属は鉄や銅、鉛など比重がおおむね4〜5以上の金属を指し、比重の小さいアルミニウムやマグネシウムは含まれない。","貴金属は金・銀・白金など化学的に安定で腐食しにくい希少な金属で、アルミニウムやマグネシウムは該当しない。","新金属は近年実用化された金属や高純度化で優れた特性を得た金属を指し、比重の小ささによる分類ではない。"],"https://www.youtube.com/watch?v=h7TQR-MgDos","金属ってなに？～鉄、ステンレス、アルミの見分け方～",""],["最近の工業の発達に伴って開発された金属や、高純度で優れた特性を持つ金属を何と呼ぶか？","新金属","軽金属","貴金属","希土類金属","新金属とは、近年の工業の発達に伴って実用化された金属や、高純度化によって優れた特性を得た金属のこと。チタン、ジルコニウム、レアメタル類、高純度シリコンなどが例として挙げられる。電子材料や航空宇宙分野などで需要が伸びている。","https://jp.meviy.misumi-ec.com/info/ja/howto/materials/15131/","金属材料の性質とは？（meviy）",["軽金属はアルミニウムやマグネシウムなど比重の小さい金属を指す分類で、開発時期や純度で分けた呼び名ではない。","貴金属は金・銀・白金など化学的に安定で希少な金属の総称で、近年開発された金属という意味ではない。","希土類金属はランタノイドなど特定の17元素の総称で、新しく開発された金属や高純度金属全般を指す言葉ではない。"],"https://www.youtube.com/watch?v=h7TQR-MgDos","金属ってなに？～鉄、ステンレス、アルミの見分け方～",""],["面心立方晶（FCC）の構造を持つ金属の組合せはどれか？","Cu、Al、Ni","Mg、Zn、Ti","Fe(α)、Cr、W","Mg、Cu、Cr","面心立方晶（FCC）は立方体の各頂点と各面の中心に原子がある構造で、すべり面が多いため延性・展性に富む。Cu、Ag、Au、Al、Pb、Ni、Ptなどが代表例。Mg・Zn・Tiは最密六方晶、α鉄・Cr・W・Moは体心立方晶。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl04/c0859.html","金属の結晶格子（ミスミ技術情報）",["Mg、Zn、Tiはいずれも最密六方晶（HCP）の金属で、面心立方晶ではない。","α鉄、Cr、Wはいずれも体心立方晶（BCC）の金属で、面心立方晶ではない。","CuはFCCだが、MgはHCP、CrはBCCであり、3つともFCCという組合せにならない。"],"https://www.youtube.com/watch?v=D-wbe3_dybM","金属の結晶構造｜体心立方・面心立方・六方最密","",["x:mech1_12","金属の結晶構造（面心立方・体心立方・最密六方）"]],["最密六方晶（HCP）の構造を持つ金属の組合せはどれか？","Mg、Zn、Cd、Ti","Cu、Al、Ni、Au","Fe(α)、Cr、Mo、W","Ag、Pt、Pb、Cu","最密六方晶（HCP）は六角柱状に原子が最密に詰まった構造で、すべり系が少ないため常温では加工しにくい。Mg、Zn、Cd（カドミウム）、Tiなどが代表例。FCCはCu・Al・Ni、BCCはα鉄・Cr・Wと合わせて覚えておく。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl04/c0859.html","金属の結晶格子（ミスミ技術情報）",["Cu、Al、Ni、Auはいずれも面心立方晶（FCC）の金属で、最密六方晶ではない。","α鉄、Cr、Mo、Wはいずれも体心立方晶（BCC）の金属で、最密六方晶ではない。","Ag、Pt、Pb、Cuはいずれも面心立方晶（FCC）の金属で、最密六方晶の組合せではない。"],"https://www.youtube.com/watch?v=D-wbe3_dybM","金属の結晶構造｜体心立方・面心立方・六方最密","",["w:049_0","最密六方晶（HCP）の単位格子の原子配列",{"a":"DMGualtieri","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Hexagonal_close-packed_crystal.svg"}]],["金属結晶の原子配列がある温度で変化することを何というか？","変態","時効","析出","再結晶","変態とは、温度によって金属の結晶構造（原子配列）が変わる現象。代表例は鉄で、常温のα鉄（体心立方）は約912℃でγ鉄（面心立方）に変わる。この性質があるからこそ、焼入れなどの熱処理で鋼の性質を大きく変えられる。","https://monoto.co.jp/heat-treatment/","熱処理とは？焼入れ・焼き戻し・焼きなまし・焼きならしを解説（monoto）",["時効は急冷後の過飽和固溶体から時間とともに析出が進み性質が変わる現象で、結晶構造そのものの温度変化ではない。","析出は固溶限の低下で固体中から別の相が生じる現象で、母相の原子配列が温度で切り替わることとは異なる。","再結晶は加工ひずみを受けた結晶が加熱でひずみのない新しい結晶粒に置き換わる現象で、結晶構造の種類は変わらない。"],"https://www.youtube.com/watch?v=yGiqn44x9ss","焼入れ 焼戻し 焼きなまし 焼きならし｜金属の熱処理を一発理解",""],["金属を加工すると結晶内部にひずみが生じて「すべり変形」が起きにくくなり、硬くなる。これを何というか？","加工硬化","時効硬化","析出硬化","焼入れ硬化","加工硬化は、塑性加工で金属内部の転位（結晶のずれ）が増えて互いに絡み合い、すべり変形が起きにくくなって硬く強くなる現象。針金を何度も曲げると硬くなるのがこれ。焼なましで再結晶させると元の軟らかさに戻る。","https://monoto.co.jp/allabout-workhardening/","加工硬化とは？塑性変形のメカニズム（monoto）",["時効硬化は過飽和固溶体から時間とともに微細な析出が進んで硬くなる現象で、塑性加工による硬化ではない。","析出硬化は固体中に微細な析出物を分散させて転位の動きを妨げ強化する方法で、加工ひずみによるものではない。","焼入れ硬化は加熱後の急冷でマルテンサイト組織にして硬くするもので、加工による転位の増加が原因ではない。"],"https://www.youtube.com/watch?v=YhXSL4P-qX8","応力とひずみを理解しよう 弾性変形・塑性変形","",["x:mech1_15","結晶のすべり変形"]],["液体状態で完全に溶け合い固体状態で全く溶け合わない物質が、冷却で2つ以上の結晶を同時に晶出する反応は？","共晶反応","包晶反応","共析反応","偏晶反応","共晶反応は、液体から2種類の固相が同時に晶出する反応で、共晶点では融点が最も低くなる。はんだ（Sn-Pb）や鋳鉄がこの性質を利用している。固相から2つの固相が出るのは共析反応（鋼のパーライト）、液相と固相が反応して別の固相になるのは包晶反応。","https://www.keyence.co.jp/ss/products/recorder/heat/basics/glossary.jsp","熱処理用語集（キーエンス）",["包晶反応は液相と先に晶出した固相が反応して別の固相を生じる反応で、2つの固相が同時に晶出するものではない。","共析反応は液相ではなく1つの固相から2つの固相が同時に生じる反応で、鋼のパーライト生成が代表例である。","偏晶反応は液相が冷却で固相と組成の異なる別の液相に分かれる反応で、2つの結晶の同時晶出ではない。"],"https://www.youtube.com/watch?v=fbcltJlOXwk","焼入れはどのように生じるのか？【熱処理講座／オーステナイト編】","",["w:037_1","二元共晶型状態図（共晶点で液相から2固相が晶出）",{"a":"Eutektikum_new.svg: *Eutektikum.gif: Dr. Báder Imre derivati","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Eutectic_system_phase_diagram.svg"}]],["ステンレス鋼は、鋼に何と何を合金したものか？","ニッケル、クロム","銅、亜鉛","モリブデン、タングステン","すず、鉛","ステンレス鋼は、鋼にクロム（約12%以上）を加えて表面に薄い不動態皮膜を作り、さびにくくした鋼。さらにニッケルを加えるとオーステナイト系（SUS304：18Cr-8Niなど）になり、耐食性・加工性が向上する。","https://jp.meviy.misumi-ec.com/info/ja/howto/materials/15131/","金属材料の性質とは？（meviy）",["銅と亜鉛の合金は黄銅であり、ステンレス鋼の主要な合金元素ではない。","モリブデンやタングステンは耐熱性や強度を高める添加元素で、ステンレス鋼の基本となる組合せではない。","すずと鉛ははんだやホワイトメタルの主成分で、鋼にさびにくさを与えるステンレス鋼の合金元素ではない。"],"https://www.youtube.com/watch?v=h7TQR-MgDos","金属ってなに？～鉄、ステンレス、アルミの見分け方～",""],["固体の冷却時、その固体中に別の固体が生じることを何と呼ぶか？","析出","晶出","変態","固溶","析出は、温度が下がって固溶できる量（固溶限）が減ったとき、固体の中から別の相が出てくる現象。液体から固体が出てくる場合は「晶出」と呼んで区別する。析出物を細かく分散させると材料が強くなり、これを析出硬化という。","https://www.keyence.co.jp/ss/products/recorder/heat/basics/glossary.jsp","熱処理用語集（キーエンス）",["晶出は液体が冷えて固体が出てくる現象を指し、固体の中から別の固体が生じる場合は析出と呼んで区別する。","変態は温度によって金属の結晶構造そのものが変わる現象で、固体中に別の固体が新たに生じることではない。","固溶はある元素の原子が母金属の結晶格子に溶け込むことで、析出とは逆向きの現象である。"],"https://www.youtube.com/watch?v=fbcltJlOXwk","焼入れはどのように生じるのか？【熱処理講座／オーステナイト編】","",["x:mech1_18","溶解度曲線と析出（α′＋α″固溶体の領域）"]],["材料が破断するまでの最大応力を何というか？","引張強さ","降伏点","耐力","比例限度","引張強さは、引張試験で得られる応力-ひずみ曲線の最大応力（最大荷重÷元の断面積）。この点を過ぎるとくびれが始まり、やがて破断する。降伏点（耐力）は塑性変形が始まる応力で、引張強さより小さい。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/power/stress-strain.jsp","応力とひずみの関係（キーエンス）",["降伏点は塑性変形が始まる応力で、通常は引張強さより小さく、破断までの最大応力ではない。","耐力は明確な降伏点がない材料で0.2%の永久ひずみが残る応力で、降伏点の代わりに使う値である。","比例限度は応力とひずみが比例する（フックの法則が成り立つ）上限の応力で、最大応力よりかなり小さい。"],"https://www.youtube.com/watch?v=5XbVCbbz7bw","【材料力学】2. 材料の応力-ひずみ線図","",["w:111_1","応力-ひずみ線図（Ultimate strengthが引張強さ）",{"a":"Nicoguaro","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Stress_strain_ductile.svg"}]],["急冷で中断された析出が、常温でも時間経過とともにゆっくり進み状態が変化することを何というか？","時効","焼戻し","クリープ","変態","時効は、急冷して過飽和状態になった固溶体から、時間の経過とともにゆっくり析出が進み、性質が変わる現象。常温で進むものを自然時効、加熱して進めるものを人工時効という。ジュラルミン（Al-Cu合金）の時効硬化が代表例。","https://monoto.co.jp/heat-treatment/","熱処理とは？焼入れ・焼き戻し・焼きなまし・焼きならしを解説（monoto）",["焼戻しは焼入れ後の鋼を意図的に再加熱してじん性を回復させる熱処理で、常温で自然に進む変化ではない。","クリープは一定応力下で時間とともに塑性変形が進む現象で、析出の進行による性質変化ではない。","変態は温度により結晶構造が切り替わる現象で、常温で時間経過とともに析出が進む現象ではない。"],"https://www.youtube.com/watch?v=yGiqn44x9ss","焼入れ 焼戻し 焼きなまし 焼きならし｜金属の熱処理を一発理解",""],["深絞り加工で材料の降伏点伸びが起こり、表面にできる皺模様を何というか？","ストレッチャーストレイン","スプリングバック","オレンジピール","ウエルドライン","ストレッチャーストレインは、軟鋼板をプレス加工したとき、降伏点伸びによって表面に現れる帯状のしわ模様（リューダース帯）。外観不良になるため、事前に軽い圧延（スキンパス）を加えて降伏点伸びを消して防ぐ。","https://jp.misumi-ec.com/tech-info/categories/press_mold_design/pr08/c0400.html","ストレッチャストレイン（ミスミ技術情報）",["スプリングバックは曲げ加工後に荷重を除くと弾性回復で形状が戻る現象で、表面の皺模様ではない。","オレンジピールは結晶粒が粗い材料を加工したとき表面がみかんの皮状に荒れる現象で、降伏点伸びによるものではない。","ウエルドラインは射出成形などで樹脂の流れが合流した部分に生じる線状の跡で、深絞りの皺模様ではない。"],"https://www.youtube.com/watch?v=L52NsMAVJvU","塑性変形と弾性変形と降伏点をサクッと解説",""],["振り子型ハンマの位置エネルギーを利用して、じん性としての衝撃強さを測る試験機は？","シャルピー衝撃試験機","ブリネル硬さ試験機","ロックウェル硬さ試験機","万能引張試験機","シャルピー衝撃試験は、切欠きを入れた試験片を振り子型ハンマで一撃で破断し、振り上がった高さの差から吸収エネルギーを求めてじん性（粘り強さ）を評価する。低温で急に脆くなる「低温脆性」の確認にも使う。硬さ試験や引張試験とは測る性質が違う。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/material/impact.jsp","衝撃試験（キーエンス）",["ブリネル硬さ試験機は鋼球圧子を押し込みくぼみの大きさから硬さを求める装置で、衝撃強さは測らない。","ロックウェル硬さ試験機は圧子の押込み深さから硬さを求める装置で、振り子による衝撃試験ではない。","万能引張試験機は静的な荷重で引張・圧縮などを行い強度や伸びを測る装置で、衝撃的なじん性は測れない。"],"https://www.youtube.com/watch?v=G79RhGZm4tY","シャルピー衝撃試験を10分で解説！","",["x:mech1_22","シャルピー衝撃試験機の原理"]],["高強度材料のじん性評価のために行われる、破壊力学を用いた試験は？","破壊じん性試験","シャルピー衝撃試験","疲労試験","クリープ試験","破壊じん性試験は、あらかじめき裂を入れた試験片に荷重を加え、き裂が進展し始める限界（応力拡大係数K_IC など）を求める試験。破壊力学に基づいて、き裂のある高強度材料がどこまで耐えられるかを評価する。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/material/impact.jsp","衝撃試験（キーエンス）",["シャルピー衝撃試験は切欠き試験片の吸収エネルギーでじん性を比較する試験で、破壊力学に基づくき裂の評価ではない。","疲労試験は繰返し応力を与えて破断までの回数を求める試験で、き裂のある材料の破壊じん性を求めるものではない。","クリープ試験は一定温度・一定荷重下で時間とともに進む変形や破断を調べる試験で、破壊力学を用いたじん性評価ではない。"],"https://www.youtube.com/watch?v=G79RhGZm4tY","シャルピー衝撃試験を10分で解説！","",["w:027_0","破壊じん性試験に用いるCT試験片の形状",{"a":"Bbanerje","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:CompactTensionSpecimen.svg"}]],["一定応力の下で、時間経過に伴って材料が塑性変形していく現象は？","クリープ","疲労","時効","リラクセーション","クリープは、一定の応力をかけ続けると、時間とともにひずみ（塑性変形）が増えていく現象。高温で特に顕著になり、ボイラやタービンなど高温機器の設計で重要になる。一定のひずみを保ったとき応力が時間とともに下がる現象は「応力緩和（リラクセーション）」。","https://d-engineer.com/zairiki/kuhirou.html","クリープと疲労による破壊（設計者のための技術計算）",["疲労は繰返し応力によってき裂が発生・進展して破断する現象で、一定応力下での時間依存の変形ではない。","時効は過飽和固溶体から時間とともに析出が進み性質が変わる現象で、応力による塑性変形ではない。","リラクセーションはひずみを一定に保ったとき応力が時間とともに低下する現象で、応力一定でひずみが増すクリープとは逆の条件である。"],"https://www.youtube.com/watch?v=FYIJ-DUmvDU","【試験動画】プラスチックのクリープ試験","",["x:mech1_24","クリープ曲線（遷移・定常・加速クリープ）"]],["繰返し応力と破断までの繰返し数の関係を示した曲線を何と呼ぶか？","S-N曲線","応力-ひずみ曲線","故障率曲線","ローレンツ曲線","S-N曲線は、縦軸に繰返し応力S、横軸に破断までの繰返し数N（対数）をとった、疲労強度を表す曲線。応力が小さいほど長く耐える。鋼では曲線がある応力で水平になり、それ以下では破断しない（疲労限）。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl06/c0956.html","材料の疲れ強さ（ミスミ技術情報）",["応力-ひずみ曲線は引張試験で応力とひずみの関係を表す曲線で、繰返し数との関係は示さない。","故障率曲線は機器の故障率の時間変化を表すバスタブ曲線で、材料の疲労強度を示すものではない。","ローレンツ曲線は所得分布などの偏りを表す経済学の曲線で、材料の疲労とは関係ない。"],"https://www.youtube.com/watch?v=unZ_5MiIQe0","金属疲労とは？ S-N曲線とは？10分で簡単解説！","",["x:mech1_25","S-N曲線（水平部分が疲労限）"]],["S-N曲線で、材料が永久に破断しないことを意味する一定応力領域を何というか？","疲労限","引張強さ","降伏点","クリープ限","疲労限（疲労限度）は、それ以下の応力なら何回（目安10⁷回）繰り返しても破断しない応力の上限。鋼では存在するが、アルミ合金などでははっきり現れないため、10⁷回などで破断しない応力を「時間強さ」として使う。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl06/c0956.html","材料の疲れ強さ（ミスミ技術情報）",["引張強さは静的な引張試験での最大応力で、繰返し応力で破断しない限界を示す値ではない。","降伏点は静的荷重で塑性変形が始まる応力で、S-N曲線上の水平部分を表すものではない。","クリープ限は高温で一定応力をかけてもクリープ変形が実用上止まる応力の限界で、繰返し応力に対する値ではない。"],"https://www.youtube.com/watch?v=unZ_5MiIQe0","金属疲労とは？ S-N曲線とは？10分で簡単解説！","",["w:100_0","S-N曲線（水平部分σcが疲労限度）",{"a":"58appank","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:French%27s_curve.svg"}]],["鉄の赤さびや銀の変色のように、表面がほぼ一様に進む腐食を何というか？","全面腐食","孔食","隙間腐食","粒界腐食","全面腐食は、材料表面がほぼ均一に腐食していく形態で、鉄の赤さびや銀の黒ずみが代表例。進み方が予測しやすいため、腐食代（肉厚の余裕）を見込んだ設計で対応できる。局部的に深く進む孔食や隙間腐食のほうが、突然の破損につながりやすく危険。","https://jp.misumi-ec.com/tech-info/categories/surface_treatment_technology/st01/c1883.html","局部腐食（ミスミ技術情報）",["孔食は不動態皮膜が局所的に壊れて穴状に深く進む局部腐食で、表面がほぼ一様に進む腐食ではない。","隙間腐食はボルト座面などの液がよどむ隙間で局所的に進む腐食で、全面で均一に進むものではない。","粒界腐食は結晶粒界に沿って選択的に進む局部腐食で、表面全体が一様に腐食する形態ではない。"],"https://www.youtube.com/watch?v=VlDhiETf57A","【徹底解説】錆びやすい金属と錆びにくい金属",""],["局部腐食のうち、ある部分の腐食が他に比べて著しく大きく、穴状に進むものを何というか？","孔食","全面腐食","隙間腐食","応力腐食割れ","孔食は、不動態皮膜が塩化物イオンなどで局所的に壊れ、そこから小さな穴状に深く進む局部腐食。ステンレス鋼に海水がかかる環境で起こりやすい。表面の損傷は小さくても貫通することがあり、発見しにくいのが厄介な点。","https://jp.misumi-ec.com/tech-info/categories/surface_treatment_technology/st01/c1883.html","局部腐食（ミスミ技術情報）",["全面腐食は表面がほぼ均一に進む腐食で、ある部分だけが著しく穴状に進む局部腐食ではない。","隙間腐食は液がよどむ隙間で酸素濃淡電池によって進む局部腐食で、自由表面に穴状に生じる腐食とは区別される。","応力腐食割れは引張応力と腐食環境が重なって割れが進む現象で、穴状に進む腐食ではない。"],"https://www.youtube.com/watch?v=VlDhiETf57A","【徹底解説】錆びやすい金属と錆びにくい金属","",["x:mech1_28","各種腐食形態（全面腐食と局部腐食・孔食）"]],["局部腐食のうち、ステンレス鋼やチタンで見られ、液の停滞で酸素供給が不十分なところに生じる腐食は？","隙間腐食","孔食","全面腐食","電食","隙間腐食は、ボルトの座面やガスケットの合わせ面など、液がよどんで酸素が届きにくい隙間で進む局部腐食。隙間の内外で酸素濃度の差ができ、内側が陽極になって腐食する（酸素濃淡電池）。ステンレス鋼やチタンのような不動態皮膜を持つ材料で起こりやすい。","https://jp.misumi-ec.com/tech-info/categories/surface_treatment_technology/st01/c1883.html","局部腐食（ミスミ技術情報）",["孔食は塩化物イオンなどで皮膜が壊れた点から穴状に進む腐食で、隙間の酸素不足を原因とするものではない。","全面腐食は表面がほぼ一様に進む腐食で、隙間など特定部分に限定されて進むものではない。","電食は外部からの迷走電流が金属に流れ出ることで生じる腐食で、液の停滞による酸素不足が原因ではない。"],"https://www.youtube.com/watch?v=VlDhiETf57A","【徹底解説】錆びやすい金属と錆びにくい金属",""],["鉄の表面にすずをめっきしたものは？","ブリキ板","トタン板","ステンレス板","クラッド板","ブリキは鋼板にすずをめっきしたもの。すずは鉄より腐食しにくく、表面が健全なら鉄を守るが、傷がつくと鉄のほうが先にさびる。食品缶詰などに使われる。「すず＝ブリキ、亜鉛＝トタン」とセットで覚える。","https://kotobank.jp/word/%E8%A1%A8%E9%9D%A2%E5%87%A6%E7%90%86%E9%8B%BC%E6%9D%BF-160977","表面処理鋼板とは（コトバンク）",["トタン板は鋼板に亜鉛をめっきしたもので、すずめっきではない。","ステンレス板はクロムなどを合金化した鋼の板で、表面にめっきを施したものではない。","クラッド板は異なる金属板を圧延などで張り合わせた複合板で、すずめっき鋼板ではない。"],"https://www.youtube.com/watch?v=g7P36LiUgRY","ブリキとトタン どう違う？",""],["鉄の表面に亜鉛をめっきしたものは？","トタン板","ブリキ板","ステンレス板","アルマイト板","トタンは鋼板に亜鉛をめっきしたもの。亜鉛は鉄よりイオンになりやすいので、傷がついても亜鉛が先に溶けて鉄を守る（犠牲防食）。屋根材やバケツなど屋外で使われる。","https://kotobank.jp/word/%E8%A1%A8%E9%9D%A2%E5%87%A6%E7%90%86%E9%8B%BC%E6%9D%BF-160977","表面処理鋼板とは（コトバンク）",["ブリキ板は鋼板にすずをめっきしたもので、亜鉛めっきではない。","ステンレス板はクロムを含む合金鋼の板で、亜鉛めっきによって防食したものではない。","アルマイト板はアルミニウムの表面を陽極酸化して酸化皮膜を作ったもので、鉄への亜鉛めっきではない。"],"https://www.youtube.com/watch?v=g7P36LiUgRY","ブリキとトタン どう違う？","",["w:051_0","溶融亜鉛めっき鋼板の表面（スパングル模様）",{"a":"The original uploader was Splarka at English Wikipedia.","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Galvanized_surface.jpg"}]],["材料の電気抵抗が0Ωになる超電導現象が起こる温度を何と呼ぶか？","超電導転移温度","キュリー温度","ガラス転移温度","再結晶温度","超電導転移温度（臨界温度Tc）は、それ以下に冷やすと電気抵抗がゼロになる温度。超電導状態では磁場を排除するマイスナー効果も現れる。キュリー温度は磁性が変わる温度、ガラス転移温度はプラスチックの剛性が変わる温度で、別の概念。","https://kotobank.jp/word/%E5%BD%A2%E7%8A%B6%E8%A8%98%E6%86%B6%E5%90%88%E9%87%91-161422","形状記憶合金とは（コトバンク）",["キュリー温度は強磁性体が常磁性に変わる温度で、電気抵抗がゼロになる温度ではない。","ガラス転移温度は非晶質の高分子などが硬いガラス状からゴム状に変わる温度で、超電導とは関係ない。","再結晶温度は加工した金属がひずみのない新しい結晶粒に置き換わる温度で、電気的性質の変化を示すものではない。"],"https://www.youtube.com/watch?v=VpJwN_RE5YQ","形状記憶合金と超弾性合金のご紹介",""],["超電導材料の代表的な合金は何と何の合金か？","ニオブ、チタン","ニッケル、チタン","銅、亜鉛","鉄、クロム","ニオブとチタンの合金（NbTi）は、加工しやすく線材にしやすい代表的な超電導材料で、MRIや加速器の超電導磁石に使われる。より高い磁場用にはNb₃Snも使われる。ニッケル-チタンは形状記憶合金なので混同しないこと。","https://kotobank.jp/word/%E5%BD%A2%E7%8A%B6%E8%A8%98%E6%86%B6%E5%90%88%E9%87%91-161422","形状記憶合金とは（コトバンク）",["ニッケルとチタンの合金は形状記憶合金の代表で、超電導材料ではない。","銅と亜鉛の合金は黄銅で、導電性はよいが常温の一般材料であり超電導材料の代表ではない。","鉄とクロムの合金はフェライト系ステンレス鋼などの耐食材料で、超電導材料ではない。"],"https://www.youtube.com/watch?v=VpJwN_RE5YQ","形状記憶合金と超弾性合金のご紹介",""],["機能性材料のアモルファス合金は、強度・じん性・耐食性・磁性に優れる。どんな構造か？","非晶質","面心立方晶","体心立方晶","最密六方晶","アモルファス合金は、溶けた金属を超急冷して、原子が規則的に並ぶ前に固めた非晶質（ガラスのような）構造の合金。結晶粒界がないため、高強度・高耐食性・優れた軟磁性を示し、変圧器の鉄心などに使われる。","https://kotobank.jp/word/%E5%BD%A2%E7%8A%B6%E8%A8%98%E6%86%B6%E5%90%88%E9%87%91-161422","形状記憶合金とは（コトバンク）",["面心立方晶は原子が規則的に並んだ結晶構造の一種で、Cu、Alなどがとる。原子配列が不規則なアモルファスとは異なる。","体心立方晶はα鉄やCrなどがとる規則的な結晶構造で、結晶粒界を持たない非晶質とは異なる。","最密六方晶はMgやZnなどがとる規則的な結晶構造で、原子が不規則に並ぶアモルファス構造ではない。"],"https://www.youtube.com/watch?v=VpJwN_RE5YQ","形状記憶合金と超弾性合金のご紹介","",["x:mech1_34","結晶金属とアモルファス合金の変形機構"]],["形状記憶合金には一般に何と何の合金が使われるか？","ニッケル、チタン","ニオブ、チタン","銅、すず","鉄、ニッケル","形状記憶合金の代表はニッケル-チタン（Ni-Ti）合金。変形させても、ある温度以上に加熱すると元の形に戻る。マルテンサイト変態を利用しており、眼鏡フレーム、配管継手、医療用ステントなどに使われる。","https://kotobank.jp/word/%E5%BD%A2%E7%8A%B6%E8%A8%98%E6%86%B6%E5%90%88%E9%87%91-161422","形状記憶合金とは（コトバンク）",["ニオブとチタンの合金（NbTi）は代表的な超電導材料で、加熱で元の形に戻る形状記憶効果を利用するものではない。","銅とすずの合金は青銅で、鋳物や軸受に使われる一般的な合金であり、形状記憶合金の代表ではない。","鉄とニッケルの合金はインバーやパーマロイなどで、低熱膨張や軟磁性が特長であり、形状記憶合金の代表ではない。"],"https://www.youtube.com/watch?v=VpJwN_RE5YQ","形状記憶合金と超弾性合金のご紹介","",["x:mech1_35","形状記憶効果（冷却・変形・加熱で元の形に戻る）"]],["熱可塑性樹脂の組合せはどれか？","アクリル樹脂、塩化ビニル、ポリエチレン","フェノール樹脂、エポキシ樹脂、メラミン樹脂","エポキシ樹脂、アクリル樹脂、ユリア樹脂","フェノール樹脂、ポリエチレン、不飽和ポリエステル","熱可塑性樹脂は、加熱すると軟らかくなり冷やすと固まる性質を繰り返せる樹脂。アクリル、塩化ビニル、ポリエチレン、ポリアミド、フッ素樹脂などが該当し、リサイクルしやすい。フェノール、エポキシ、メラミン、ユリア、不飽和ポリエステルは、一度硬化すると戻らない熱硬化性樹脂。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl09/c0867.html","熱硬化性樹脂と熱可塑性樹脂（ミスミ技術情報）",["フェノール樹脂、エポキシ樹脂、メラミン樹脂はいずれも一度硬化すると加熱しても軟らかくならない熱硬化性樹脂である。","アクリル樹脂は熱可塑性だが、エポキシ樹脂とユリア樹脂は熱硬化性樹脂なので、全てが熱可塑性の組合せにならない。","ポリエチレンは熱可塑性だが、フェノール樹脂と不飽和ポリエステルは熱硬化性樹脂であり、組合せとして成り立たない。"],"https://www.youtube.com/watch?v=28fmwITrFGA","熱硬化性樹脂と熱可塑性樹脂の違い",""],["プラスチックの剛性が急激に変化する温度を何というか？","ガラス転移温度","融点","荷重たわみ温度","超電導転移温度","ガラス転移温度（Tg）を境に、プラスチックは硬いガラス状態から軟らかいゴム状態へ変わり、剛性が急激に下がる。使用温度がTgを超えないよう材料を選ぶのが設計の基本。結晶が溶ける「融点」とは別の温度。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl09/c0867.html","熱硬化性樹脂と熱可塑性樹脂（ミスミ技術情報）",["融点は結晶性プラスチックの結晶部分が溶けて液状になる温度で、ガラス状からゴム状へ剛性が急変する温度とは別である。","荷重たわみ温度は一定荷重をかけた試験片が規定量たわむ温度で、耐熱性の目安となる試験値であり剛性急変の温度そのものではない。","超電導転移温度は金属などの電気抵抗がゼロになる温度で、プラスチックの剛性変化とは関係ない。"],"https://www.youtube.com/watch?v=28fmwITrFGA","熱硬化性樹脂と熱可塑性樹脂の違い","",["x:mech1_37","プラスチックの温度変化とガラス転移温度Tg"]],["プラスチックで、ある温度での長時間の力学現象を、温度を高めることで短時間で再現できる法則は？","時間-温度換算則","アレニウスの法則","フックの法則","マイナー則","時間-温度換算則は、プラスチックの粘弾性挙動において「高温・短時間」と「低温・長時間」が等価になるという経験則。高温で短時間試験すれば、常温で長時間使ったときのクリープなどを予測できる。","https://jp.misumi-ec.com/tech-info/categories/plastic_mold_design/pl09/c0867.html","熱硬化性樹脂と熱可塑性樹脂（ミスミ技術情報）",["アレニウスの法則は化学反応速度が温度に対して指数関数的に変化することを示す式で、寿命推定にも使うが粘弾性の時間と温度の等価性そのものではない。","フックの法則は弾性範囲で応力とひずみが比例するという法則で、時間や温度による挙動の換算は扱わない。","マイナー則は異なる大きさの繰返し応力による疲労損傷を累積して寿命を見積もる法則で、温度による時間換算ではない。"],"https://www.youtube.com/watch?v=28fmwITrFGA","熱硬化性樹脂と熱可塑性樹脂の違い",""],["成形材料を加熱した金型に入れ、閉じて加熱加圧し、硬化後に取り出す、主に熱硬化性樹脂の成形法は？","圧縮成形","トランスファ成形","射出成形","押出成形","圧縮成形は、計量した成形材料を加熱した金型に直接入れ、型を閉じて加熱・加圧し、硬化させてから取り出す成形法。主に熱硬化性樹脂に使われる。設備が簡単な反面、複雑な形状や薄肉品には向かない。","https://www.keyence.co.jp/ss/products/sensor/plastic-molding/about/summary.jsp","樹脂成形の概要と主な成形法（キーエンス）",["トランスファ成形は予熱した材料をポットからプランジャで閉じた金型に押し込む方法で、金型に材料を直接入れて閉じる方法ではない。","射出成形は溶かした樹脂を閉じた金型に高圧で射出する方法で、主に熱可塑性樹脂に使われる。","押出成形は溶かした樹脂を口金から連続的に押し出して管や棒などを作る方法で、金型を閉じて加圧硬化するものではない。"],"https://www.youtube.com/watch?v=-WVVNZbvUHg","射出成形金型の基礎をわかりやすく解説！","",["x:mech1_39","圧縮成形の機構・原理・特徴"]],["タブレット状材料を高周波予熱してポットに入れ、プランジャで型内に押し込み加熱硬化する熱硬化性樹脂の成形法は？","トランスファ成形","圧縮成形","ブロー成形","射出成形","トランスファ成形は、タブレット状の材料を予熱してポット（加熱室）に入れ、プランジャで閉じた金型内へ押し込んで硬化させる熱硬化性樹脂の成形法。インサート部品を傷めにくく、半導体の樹脂封止などに使われる。","https://www.keyence.co.jp/ss/products/sensor/plastic-molding/about/summary.jsp","樹脂成形の概要と主な成形法（キーエンス）",["圧縮成形は材料を加熱した金型に直接入れて型を閉じ加圧する方法で、ポットとプランジャで押し込む工程はない。","ブロー成形は熱可塑性樹脂のパリソンを金型内で空気で膨らませて中空品を作る方法で、熱硬化性樹脂の成形法ではない。","射出成形は主に熱可塑性樹脂を溶かして金型に射出する方法で、タブレットを高周波予熱してポットに入れる工程はない。"],"https://www.youtube.com/watch?v=-WVVNZbvUHg","射出成形金型の基礎をわかりやすく解説！","",["x:mech1_40","トランスファ成形の機構・原理・特徴"]],["熱可塑性樹脂に用いる成形方法として正しいものは？","射出成形","圧縮成形","トランスファ成形","オートクレーブ成形","熱可塑性樹脂の代表的な成形法は、射出成形（溶かした樹脂を金型に射出）と押出成形（口金から連続的に押し出す）。量産性が高い。圧縮成形とトランスファ成形は、主に熱硬化性樹脂に使われる。","https://www.keyence.co.jp/ss/products/sensor/plastic-molding/about/summary.jsp","樹脂成形の概要と主な成形法（キーエンス）",["圧縮成形は加熱した金型で材料を加圧して硬化させる方法で、主に熱硬化性樹脂に用いられる。","トランスファ成形はポットからプランジャで材料を型に押し込み硬化させる方法で、主に熱硬化性樹脂に用いられる。","オートクレーブ成形はプリプレグを圧力釜で加熱・加圧して硬化させる方法で、主に熱硬化性樹脂の複合材料に用いられる。"],"https://www.youtube.com/watch?v=-WVVNZbvUHg","射出成形金型の基礎をわかりやすく解説！","",["x:mech1_41","射出成形機の射出機構（加熱シリンダとスクリュ）"]],["複合材料で、樹脂と硬化剤が強化繊維に含浸され、未硬化状態で供給されるものを何というか？","プリプレグ","プリフォーム","ハニカム","ペレット","プリプレグ（pre-impregnated）は、炭素繊維やガラス繊維などの強化繊維に、樹脂と硬化剤を含浸させて未硬化のまま供給するシート状の中間材料。これを積層して加熱・加圧するとCFRPなどの部品になる。冷凍保管が必要なものが多い。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md01/c1515.html","材料置換の軽量化技術：繊維強化プラスチック（ミスミ技術情報）",["プリフォームは樹脂を含浸する前の強化繊維を所要の方向と量に配置して形にしたもので、樹脂は含まれていない。","ハニカムは六角形のセルを並べた軽量なコア材で、サンドイッチ構造の芯に使われ、樹脂を含浸した繊維シートではない。","ペレットは射出成形などに供給する粒状の樹脂材料で、強化繊維に樹脂を含浸させた中間材料ではない。"],"https://www.youtube.com/watch?v=OkIKei6WrUE","CFRP積層板ができるまで","",["x:mech1_42","複合材料の成形の流れ（プリプレグ・プリフォーム）"]],["複合材料の成形で、強化繊維を所要方向に所要量だけ配向させたものを何というか？","プリフォーム","プリプレグ","マトリックス","ラミネート","プリフォームは、樹脂を含浸させる前の強化繊維を、所要の方向と量に配置して製品形状に近づけたもの。後から樹脂を注入して成形する（RTM法など）。繊維をどの方向に並べるかで、複合材料の強度特性が決まる。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md01/c1515.html","材料置換の軽量化技術：繊維強化プラスチック（ミスミ技術情報）",["プリプレグは強化繊維に樹脂と硬化剤を含浸させた未硬化の中間材料で、繊維だけを配向させたものではない。","マトリックスは複合材料で強化繊維を包んで固める母材（樹脂など）のことで、繊維を配向させたものではない。","ラミネートはプリプレグなどの薄い層を積み重ねた積層体のことで、樹脂含浸前の繊維配向体を指す用語ではない。"],"https://www.youtube.com/watch?v=OkIKei6WrUE","CFRP積層板ができるまで",""],["CFRPは何の略か？","炭素繊維強化プラスチック（炭素繊維複合材）","ガラス繊維強化プラスチック","アラミド繊維強化プラスチック","金属基複合材料","CFRPはCarbon Fiber Reinforced Plasticsの略で、炭素繊維で強化したプラスチック。軽くて強く剛性も高いため、航空機、自動車、スポーツ用品などに使われる。ガラス繊維ならGFRP、アラミド繊維ならAFRP。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md01/c1515.html","材料置換の軽量化技術：繊維強化プラスチック（ミスミ技術情報）",["ガラス繊維強化プラスチックはGFRP（Glass Fiber Reinforced Plastics）の訳で、CFRPのCは炭素（Carbon）を表す。","アラミド繊維強化プラスチックはAFRPと略され、CFRPの炭素繊維とは強化繊維の種類が異なる。","金属基複合材料はMMC（Metal Matrix Composites）と略され、母材が金属であり、プラスチック母材のCFRPとは異なる。"],"https://www.youtube.com/watch?v=OkIKei6WrUE","CFRP積層板ができるまで",""],["GFRPは何の略か？","ガラス繊維強化プラスチック（複合材料）","炭素繊維強化プラスチック","繊維強化金属","セラミックス基複合材料","GFRPはGlass Fiber Reinforced Plasticsの略で、ガラス繊維で強化したプラスチック。CFRPより安価で、電気を通さない。浴槽、小型船舶、ヘルメット、プリント基板などに使われる。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md01/c1515.html","材料置換の軽量化技術：繊維強化プラスチック（ミスミ技術情報）",["炭素繊維強化プラスチックはCFRPの訳で、GFRPのGはガラス（Glass）を表す。","繊維強化金属はFRM（Fiber Reinforced Metals）と略され、母材が金属であり、プラスチック母材のGFRPとは異なる。","セラミックス基複合材料はCMC（Ceramic Matrix Composites）と略され、母材がセラミックスでありGFRPとは異なる。"],"https://www.youtube.com/watch?v=OkIKei6WrUE","CFRP積層板ができるまで",""],["ポアソン比は横ひずみと縦ひずみでどう表すか？","横ひずみ ÷ 縦ひずみ","縦ひずみ ÷ 横ひずみ","横ひずみ × 縦ひずみ","縦ひずみ − 横ひずみ","ポアソン比νは、縦方向に引っ張ったときの「横ひずみ÷縦ひずみ」の絶対値。引っ張ると細くなるので横ひずみは負になる。金属ではおよそ0.3、ゴムは0.5に近い。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/power/stress-strain.jsp","応力とひずみの関係（キーエンス）",["縦ひずみ÷横ひずみはポアソン比の逆数でポアソン数と呼ばれ、金属ではおよそ3〜4になる。","横ひずみと縦ひずみの積は比を表さず、無次元の材料定数であるポアソン比の定義とは無関係である。","縦ひずみと横ひずみの差は比ではなく、ひずみ同士の割合で表すポアソン比の定義にならない。"],"https://www.youtube.com/watch?v=5XbVCbbz7bw","【材料力学】2. 材料の応力-ひずみ線図","",["x:mech1_46","棒の伸びと縮み（縦ひずみと横ひずみ）"]],["S.F.D は何を意味するか？","せん断力図","曲げモーメント図","応力-ひずみ線図","自由物体図","S.F.D.（Shearing Force Diagram）はせん断力図で、はりの各位置に働くせん断力を図示したもの。曲げモーメント図（B.M.D.）と並べて描くことが多い。せん断力が0になる位置で、曲げモーメントが極値（最大）になる。","https://d-engineer.com/zairiki/mage.html","材料の曲げに対する強さ（MONOWEB）",["曲げモーメント図はB.M.D.（Bending Moment Diagram）の訳で、はりの各位置の曲げモーメントを示す図である。","応力-ひずみ線図は引張試験で応力とひずみの関係を示す図で、S.F.D.の略号とは対応しない。","自由物体図はF.B.D.（Free Body Diagram）と略され、物体に働く力を書き出した図でありS.F.D.とは異なる。"],"https://www.youtube.com/watch?v=L-CNSnnSFG4","せん断力図(SFD)と曲げモーメント図(BMD)の描き方","",["x:mech1_47","片持ちばりのせん断力図（SFD）"]],["B.M.D は何を意味するか？","曲げモーメント図","せん断力図","たわみ曲線","応力集中図","B.M.D.（Bending Moment Diagram）は曲げモーメント図で、はりの各位置の曲げモーメントを示す。最大曲げモーメントの位置と大きさから、最大曲げ応力（M/Z）を求めて強度を確認する。","https://d-engineer.com/zairiki/mage.html","材料の曲げに対する強さ（MONOWEB）",["せん断力図はS.F.D.（Shearing Force Diagram）の訳で、はりの各位置のせん断力を示す図である。","たわみ曲線ははりの各位置のたわみ量を表す弾性曲線で、曲げモーメントを示すB.M.D.とは異なる。","応力集中図は切欠きなどで局所的に高まる応力の分布を示すもので、B.M.D.の略号とは対応しない。"],"https://www.youtube.com/watch?v=L-CNSnnSFG4","せん断力図(SFD)と曲げモーメント図(BMD)の描き方","",["x:mech1_48","片持ちばりの曲げモーメント図（BMD）"]],["流体とは、静止状態で何が発生しない連続体のことか？","せん断応力","圧力","浮力","重力","流体は、静止しているときにせん断応力が生じない連続体と定義される。静止流体に働くのは圧力（面に垂直な力）だけ。固体はせん断力に抵抗して変形を止められるが、流体はわずかなせん断力でも流れ続けるのが違い。","https://d-engineer.com/fluid/nensei.html","粘性流体と非粘性流体（MONOWEB）",["圧力は静止流体中にも働く面に垂直な力で、静止状態で発生しないものではない。","浮力は静止流体中の物体にも働く上向きの力で、上下の圧力差から生じるため静止状態でも発生する。","重力は質量を持つ物体に常に働く体積力で、流体が静止していても作用する。"],"https://www.youtube.com/watch?v=qOcPH84ZxyU","【流体力学】非ニュートン流体って何？",""],["パスカルの原理に基づき、液柱の高さで圧力を測定する機器は？","マノメータ","ブルドン管圧力計","ピトー管","ベンチュリ管","マノメータは、U字管などの液柱の高さの差から圧力（差）を測る計器。静止流体中の圧力は深さに比例する（p＝ρgh）という性質を利用する。ブルドン管圧力計は管の変形で圧力を読む機械式で、原理が異なる。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0088.html","圧力計の種類と特長（ミスミ技術情報）",["ブルドン管圧力計は湾曲した管の変形を指針で読む機械式の圧力計で、液柱の高さで測るものではない。","ピトー管は全圧と静圧の差から流速を求める計器で、液柱で静止流体の圧力を測る装置ではない。","ベンチュリ管は管を絞った部分の圧力差から流量を求める装置で、圧力そのものを液柱で測る計器ではない。"],"https://www.youtube.com/watch?v=Rmn_iw6YjU8","流体力学 高校物理の復習 圧力、水圧、浮力","",["x:mech1_50","マノメータ（液柱の高さの差で圧力差を測る）"]],["トリチェリの実験を応用し、大気圧を水銀柱の高さで測る装置は？","フォルタン型気圧計","アネロイド気圧計","ブルドン管圧力計","マノメータ","フォルタン型気圧計は、トリチェリの実験（水銀柱の高さ約760mm＝1気圧）を応用した水銀気圧計。測る前に水銀だめの液面を基準点に合わせる構造になっている。アネロイド気圧計は真空の金属箱の変形で測る別方式。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0088.html","圧力計の種類と特長（ミスミ技術情報）",["アネロイド気圧計は内部を真空にした金属箱の変形量で気圧を測る方式で、水銀柱は使わない。","ブルドン管圧力計は湾曲した管の変形で圧力を読む工業用の計器で、水銀柱で大気圧を測る装置ではない。","マノメータはU字管などの液柱差で圧力差を測る計器で、トリチェリの真空を使って大気圧を測る気圧計ではない。"],"https://www.youtube.com/watch?v=Rmn_iw6YjU8","流体力学 高校物理の復習 圧力、水圧、浮力","",["w:077_2","トリチェリの実験（水銀柱の高さ約0.76mが大気圧）",{"a":"MikeRun","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Mercury-barometer_DE.svg"}]],["工業用に広く使われる、湾曲した管の変形で圧力を読む圧力計は？","ブルドン管圧力計","フォルタン型気圧計","マノメータ","ピエゾ抵抗式圧力計","ブルドン管圧力計は、断面が偏平な湾曲した管に圧力をかけると管が伸びる（まっすぐになろうとする）変位を、歯車で拡大して指針に伝える。構造が簡単で丈夫なため、工場の配管などで最も多く使われる。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0088.html","圧力計の種類と特長（ミスミ技術情報）",["フォルタン型気圧計は水銀柱の高さで大気圧を測る気象・実験用の装置で、管の変形を利用する工業用圧力計ではない。","マノメータは液柱の高さの差で圧力を測る計器で、湾曲した管の変形を利用するものではない。","ピエゾ抵抗式圧力計は圧力による半導体の電気抵抗の変化を検出する電気式センサで、管の機械的変形を指針で読む方式ではない。"],"https://www.youtube.com/watch?v=Rmn_iw6YjU8","流体力学 高校物理の復習 圧力、水圧、浮力","",["x:mech1_52","ブルドン管圧力計の構造"]],["理想気体は何が一定の気体として扱われるか？","比熱","密度","圧力","体積","理想気体（完全気体）は、状態方程式pV＝mRTに厳密に従い、比熱が一定とみなせる仮想の気体。分子の大きさや分子間力を無視している。実在の気体も、高温・低圧ではほぼ理想気体として扱える。","https://d-engineer.com/netsuriki/netudaini.html","熱力学第二法則（MONOWEB）",["理想気体の密度は状態方程式に従い圧力と温度で変化するため、一定とはみなさない。","圧力は理想気体の状態量の一つで、体積や温度に応じて変化するため一定の量ではない。","体積は圧力と温度によって変化する状態量で、理想気体の定義として一定とされるものではない。"],"https://www.youtube.com/watch?v=E1E23woCysY","ちょこっと物理【熱力学第2法則】",""],["熱エネルギーを力学的エネルギーにすべて変換することはできない（効率が悪い）ことを唱える法則は？","熱力学第2法則","熱力学第1法則","熱力学第0法則","熱力学第3法則","熱力学第2法則は「熱を100%仕事に変える熱機関は作れない」「熱は低温から高温へ自然には移らない」ことを示す法則。第1法則はエネルギー保存則、第0法則は熱平衡（温度の定義）、第3法則は絶対零度に関する法則。","https://d-engineer.com/netsuriki/netudaini.html","熱力学第二法則（MONOWEB）",["熱力学第1法則はエネルギー保存則で、熱と仕事は相互に変換できその総量は保存されることを示すが、変換の限界は述べていない。","熱力学第0法則は2つの物体がそれぞれ第3の物体と熱平衡なら互いも熱平衡であることを示し、温度の定義の基礎となる。","熱力学第3法則は絶対零度でのエントロピに関する法則で、熱を仕事に変える効率の限界を述べるものではない。"],"https://www.youtube.com/watch?v=E1E23woCysY","ちょこっと物理【熱力学第2法則】",""],["カルノーサイクルの過程の順番として正しいものは？","等温膨張→断熱膨張→等温圧縮→断熱圧縮","断熱膨張→等温膨張→断熱圧縮→等温圧縮","等温膨張→等温圧縮→断熱膨張→断熱圧縮","断熱圧縮→等積加熱→断熱膨張→等積放熱","カルノーサイクルは、①高温で等温膨張（熱を受け取る）→②断熱膨張（温度が下がる）→③低温で等温圧縮（熱を捨てる）→④断熱圧縮（温度が上がる）の4過程。2つの熱源の間で働く、最も効率の高い理想的なサイクル。","https://d-engineer.com/netsuriki/kcycle.html","カルノーサイクルとは（MONOWEB）",["断熱膨張から始まる順番は過程の並びがずれており、高温で熱を受け取る等温膨張の後に断熱膨張が続くのが正しい。","等温膨張の直後に等温圧縮を行うと温度を下げる過程がなく、低温熱源との熱交換ができないためサイクルにならない。","断熱圧縮→等積加熱→断熱膨張→等積放熱はオットーサイクルの過程で、カルノーサイクルではない。"],"https://www.youtube.com/watch?v=3xlKqYOcTts","カルノーサイクルが絶対にわかる動画","",["x:mech1_55","カルノーサイクルのPV線図"]],["管内を流れる流体の流量を測定するために工業用で使われる、絞り板の装置は？","オリフィス","ディフューザ","ピトー管","ノズルベーン","オリフィス流量計は、管内に穴のあいた板（絞り）を入れ、前後に生じる圧力差（差圧）から流量を求める。構造が簡単で安価なため工業用に広く使われるが、圧力損失は大きい。ベンチュリ管やノズルも同じ差圧式の仲間。","https://www.keyence.co.jp/ss/products/process/flowmeter/type/diaphragm.jsp","差圧式流量計（キーエンス）",["ディフューザは流路を広げて流れを減速し圧力を回復させる管路で、流量測定用の絞り板ではない。","ピトー管は全圧と静圧の差から局所の流速を測る計器で、管内に絞り板を入れる装置ではない。","ノズルベーンはタービンなどで流れの向きや速度を整える案内羽根で、流量測定用の絞りではない。"],"https://www.youtube.com/watch?v=pQBTp9KI0xk","ベルヌーイの定理の物理イメージ・ベンチュリ管","",["x:mech1_56","オリフィス（絞りによる差圧で流量を測る）"]],["単位時間あたりの伝熱量は通過面積と温度勾配の積に比例するという法則は？","フーリエの法則","ニュートンの冷却則","ステファン・ボルツマンの法則","フックの法則","フーリエの法則は熱伝導の基本法則で、伝熱量Q＝λ×A×(dT/dx)のように、面積と温度勾配に比例する。比例定数λが熱伝導率。ニュートンの冷却則は固体表面から流体への熱伝達、ステファン・ボルツマンの法則はふく射を表す。","https://d-engineer.com/netsuriki/netsudendou.html","熱伝導と熱伝達と熱放射（MONOWEB）",["ニュートンの冷却則は固体表面と流体の温度差に比例して熱が伝わる熱伝達の法則で、固体内部の温度勾配による熱伝導ではない。","ステファン・ボルツマンの法則は物体が放射するエネルギーが絶対温度の4乗に比例するふく射の法則で、温度勾配とは関係ない。","フックの法則は弾性範囲で応力とひずみが比例するという材料力学の法則で、伝熱とは関係ない。"],"https://www.youtube.com/watch?v=JyH-lqYYSKs","伝熱計算のマスター術！熱伝導から対流まで解説",""],["流れを減速させて圧力を上昇させる管路を何というか？","ディフューザ","ノズル","オリフィス","ベンチュリ","ディフューザは、流路を徐々に広げて流れを減速させ、速度エネルギー（動圧）を圧力（静圧）に変える管路。ポンプや送風機の出口に使われる。逆に流路を絞って流れを加速させるのがノズル。","https://www.keyence.co.jp/ss/products/process/flowmeter/type/diaphragm.jsp","差圧式流量計（キーエンス）",["ノズルは流路を絞って流れを加速させ、圧力を速度エネルギーに変える管路で、ディフューザとは逆の働きをする。","オリフィスは管内に穴あき板を入れて前後の差圧から流量を測る装置で、圧力を回復させる目的の管路ではない。","ベンチュリは絞り部で流速を上げて生じる圧力低下を利用する管で、流量測定や吸引に使われ、減速による昇圧が主目的ではない。"],"https://www.youtube.com/watch?v=pQBTp9KI0xk","ベルヌーイの定理の物理イメージ・ベンチュリ管","",["x:mech1_58","ディフューザ（流路を広げて減速・昇圧）"]],["圧力のかかった流体の管を急に閉めたとき、流体の慣性で衝撃・振動が起こる現象は？","ウォーターハンマ","キャビテーション","サージング","カルマン渦","ウォーターハンマ（水撃作用）は、弁を急に閉めたとき、流れていた流体の運動エネルギーが急激な圧力上昇に変わり、圧力波となって管内を往復する現象。配管や弁の破損の原因になるため、弁をゆっくり閉める、エアチャンバを設けるなどで防ぐ。","https://kotobank.jp/word/%E3%81%86%E3%81%8A%E3%83%BC%E3%81%9F%E3%83%BC%E3%81%AF%E3%82%93%E3%81%BE%E3%83%BC-438891","ウオーターハンマーとは（コトバンク）",["キャビテーションは流速の増加などで局所的な圧力が飽和蒸気圧以下になり気泡が発生・崩壊する現象で、弁の急閉が原因ではない。","サージングはポンプや送風機を低流量で運転したとき流量や圧力が周期的に変動する現象で、弁の急閉による衝撃ではない。","カルマン渦は流れの中の物体の後ろに交互に発生する渦列で、管の急閉による圧力波とは関係ない。"],"https://www.youtube.com/watch?v=rJ2Z-PmN1XQ","ウォーターハンマーとは？",""],["熱の流れを伴う自然現象は、エントロピの総和が増大する方向に進む。この法則は？","エントロピ増大の法則","エネルギー保存則","ボイル・シャルルの法則","ベルヌーイの定理","エントロピ増大の法則は、外部とやりとりのない孤立系では、自然に起こる変化でエントロピが必ず増える（減らない）という法則。熱力学第2法則の別の表現で、「自然の変化には向きがある（不可逆である）」ことを示している。","https://d-engineer.com/netsuriki/netudaini.html","熱力学第二法則（MONOWEB）",["エネルギー保存則はエネルギーの総量が変化しないことを示す法則で、変化が進む向きは述べていない。","ボイル・シャルルの法則は気体の圧力・体積・温度の関係を示す法則で、エントロピの増減とは関係ない。","ベルヌーイの定理は流線に沿って圧力・速度・位置のエネルギーの和が一定になることを示す流体の法則である。"],"https://www.youtube.com/watch?v=E1E23woCysY","ちょこっと物理【熱力学第2法則】",""],["断熱圧縮→等積加熱→断熱膨張→等積放熱→…というサイクルを何というか？","オットーサイクル","ディーゼルサイクル","カルノーサイクル","ブレイトンサイクル","オットーサイクルは火花点火（ガソリン）機関の理論サイクルで、断熱圧縮→等積加熱→断熱膨張→等積放熱の4過程からなる。加熱（燃焼）が体積一定で瞬時に起こると考える。圧縮比が大きいほど熱効率が高くなる。","https://kotobank.jp/word/%E3%82%AA%E3%83%83%E3%83%88%E3%83%BC%E3%82%B5%E3%82%A4%E3%82%AF%E3%83%AB-788065","オットーサイクルとは（コトバンク）",["ディーゼルサイクルは加熱を等圧で行うサイクルで、等積加熱を含むオットーサイクルとは異なる。","カルノーサイクルは等温膨張・断熱膨張・等温圧縮・断熱圧縮からなる理想サイクルで、等積過程は含まない。","ブレイトンサイクルは断熱圧縮・等圧加熱・断熱膨張・等圧放熱からなるガスタービンの理論サイクルである。"],"https://www.youtube.com/watch?v=6SD53Y9KuUw","エンジンの理論サイクル【オットー、ディーゼル、ブレイトン、ランキン】","",["x:mech1_61","オットーサイクル（等積加熱・等積放熱）"]],["断熱圧縮→等圧加熱→断熱膨張→等積放熱→…というサイクルを何というか？","ディーゼルサイクル","オットーサイクル","カルノーサイクル","サバテサイクル","ディーゼルサイクルは圧縮着火機関の理論サイクルで、加熱（燃焼）を「等圧」で行う点がオットーサイクルとの違い。断熱圧縮→等圧加熱→断熱膨張→等積放熱の4過程。高い圧縮比で運転できるため効率がよい。","https://kotobank.jp/word/%E3%82%AA%E3%83%83%E3%83%88%E3%83%BC%E3%82%B5%E3%82%A4%E3%82%AF%E3%83%AB-788065","オットーサイクルとは（コトバンク）",["オットーサイクルは加熱を等積で行うサイクルで、等圧加熱を含むディーゼルサイクルとは異なる。","カルノーサイクルは2つの等温過程と2つの断熱過程からなる理想サイクルで、等圧加熱や等積放熱は含まない。","サバテサイクルは加熱を等積と等圧の2段階で行う複合サイクルで、等圧加熱のみのディーゼルサイクルとは異なる。"],"https://www.youtube.com/watch?v=6SD53Y9KuUw","エンジンの理論サイクル【オットー、ディーゼル、ブレイトン、ランキン】","",["x:mech1_62","ディーゼルサイクル（等圧加熱・等積放熱）"]],["回転体が不つり合いの遠心力でたわみ、特定の回転数でたわんだまま激しく振動して回る運動を何というか？","ふれ回り運動","歳差運動","自励振動","共振","ふれ回り運動（ホワーリング）は、回転軸が不つり合いの遠心力でたわみ、たわんだ形のまま軸心が円を描くように回る運動。軸の固有振動数と回転数が一致する「危険速度」で激しくなる。バランス取りや危険速度を避けた運転で防ぐ。","https://d-engineer.com/Mechanics/frequency.html","固有振動数、共振、危険速度について（MONOWEB）",["歳差運動はこまの回転軸が重力によるトルクで円すいを描くように向きを変える運動で、不つり合いによる軸のたわみではない。","自励振動は外部からの周期的な力がなくても系内部のエネルギーで振動が成長する現象で、遠心力による軸のたわみとは異なる。","共振は外力の振動数が固有振動数と一致して振幅が大きくなる一般的な現象で、たわんだ軸が円を描いて回る運動そのものの名称ではない。"],"https://www.youtube.com/watch?v=9Lys3Wnm5AA","強制振動－減衰有りver. 共振を抑える方法","",["x:mech1_63","偏心のある回転軸のふれ回り"]],["積層したプリプレグにバッグ材を被せ、減圧下で圧力釜の中で加熱・加圧して硬化させる成形法は？","オートクレーブ法","圧縮成形","フィラメントワインディング法","ハンドレイアップ法","オートクレーブ法は、型の上に積層したプリプレグをバッグで覆って内部を真空にし、圧力釜（オートクレーブ）の中で加熱・加圧して硬化させる複合材料の成形法。ボイド（気泡）が少なく高品質なため、航空機用CFRP部品の標準的な製法。","https://jp.misumi-ec.com/tech-info/categories/machine_design/md01/c1515.html","材料置換の軽量化技術：繊維強化プラスチック（ミスミ技術情報）",["圧縮成形は加熱した金型に材料を入れて型を閉じ加圧する方法で、バッグと圧力釜を使う成形法ではない。","フィラメントワインディング法は樹脂を含浸した連続繊維を回転するマンドレルに巻き付ける方法で、圧力容器やパイプの製造に使われる。","ハンドレイアップ法は型の上に繊維を置き樹脂を手作業で塗り重ねて常温硬化させる方法で、圧力釜による加熱・加圧は行わない。"],"https://www.youtube.com/watch?v=OkIKei6WrUE","CFRP積層板ができるまで","",["x:mech1_64","オートクレーブ成形法の積層構成"]],["σ = Eε の式で、σ・E・ε の名称の組合せとして正しいものは？","σ:応力、E:縦弾性係数(ヤング率)、ε:ひずみ","σ:ひずみ、E:縦弾性係数、ε:応力","σ:応力、E:横弾性係数、ε:ひずみ","σ:応力、E:ポアソン比、ε:伸び","σ＝Eεはフックの法則を応力とひずみで表したもの。σは応力（単位面積あたりの力）、Eは縦弾性係数（ヤング率、材料固有の値）、εはひずみ（単位長さあたりの伸び）。軟鋼ではE≒206GPa。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/power/stress-strain.jsp","応力とひずみの関係（キーエンス）",["σとεの名称が逆で、σは応力、εはひずみを表す。ひずみに弾性係数を掛けると応力になる。","横弾性係数Gはせん断応力とせん断ひずみの比で、τ=Gγに使う。σ=EεのEは縦弾性係数である。","ポアソン比は横ひずみと縦ひずみの比で、εは長さそのものの伸びではなく伸びを元の長さで割ったひずみである。"],"https://www.youtube.com/watch?v=5XbVCbbz7bw","【材料力学】2. 材料の応力-ひずみ線図","",["w:111_1","応力-ひずみ線図（弾性域の傾きがヤング率E）",{"a":"Nicoguaro","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Stress_strain_ductile.svg"}]],["ずれた長さλを長さlで割った値を何というか？","せん断ひずみ","縦ひずみ","横ひずみ","体積ひずみ","せん断ひずみγは、せん断変形でずれた長さλを、その間の長さlで割った値（γ＝λ/l）。せん断応力τとの間にはτ＝Gγの関係があり、Gを横弾性係数という。引張・圧縮の縦ひずみε（伸び÷元の長さ）と区別する。","https://d-engineer.com/zairiki/sendan.html","せん断応力（設計者のための技術計算ツール）",["縦ひずみは引張・圧縮方向の伸び（縮み）を元の長さで割った値で、ずれによるせん断変形を表すものではない。","横ひずみは荷重と直角方向の寸法変化を元の寸法で割った値で、ずれた長さを使うせん断ひずみとは異なる。","体積ひずみは体積の変化量を元の体積で割った値で、ずれた長さと長さの比ではない。"],"https://www.youtube.com/watch?v=OsipWPTZIl0","第21回 せん断応力【MONOWEB】","",["x:mech1_66","せん断ひずみ（ずれλと長さlの関係）"]],["せん断加工で、①板材を一対の切れ刃で切断、②閉じた形の内側を抜く、③成形品の縁を抜いて整える、の名称は？","①カッティング ②ブランキング ③トリミング","①ブランキング ②カッティング ③トリミング","①トリミング ②ピアシング ③カッティング","①カッティング ②トリミング ③ブランキング","せん断加工のうち、板を一対の刃で直線的に切るのがカッティング（シャーリング）、閉じた輪郭の製品部分を打ち抜くのがブランキング、成形品の余分な縁を切り落として整えるのがトリミング。穴をあけ、抜いた側を捨てる加工はピアシング（穴抜き）という。","https://monoto.co.jp/shearing/","せん断加工とは？せん断の特徴とバリ・だれの仕組み（monoto）",["①と②が入れ替わっている。一対の刃で板を直線的に切るのはカッティング、閉じた輪郭を打ち抜くのがブランキングである。","①のトリミングは縁を整える加工、③のカッティングは直線的な切断で、名称と内容がずれている。ピアシングは抜いた側を捨てる穴抜きである。","②と③が入れ替わっている。成形品の縁を切り落とすのがトリミング、閉じた輪郭を打ち抜くのがブランキングである。"],"https://www.youtube.com/watch?v=rwLM0UinZD0","プレス加工を学ぶ～ブランク、プレス加工の生産方法～","",["x:mech1_67","各種せん断加工（カッティング・ブランキング・トリミング）"]],["はりの支え方で、①一端固定・他端自由、②両端回転自由で一端は水平移動も自由、の名称は？","①片持ちばり ②単純支持ばり","①単純支持ばり ②片持ちばり","①固定ばり ②連続ばり","①片持ちばり ②両端固定ばり","片持ちばりは一端を固定し他端を自由にしたはりで、固定端に最大曲げモーメントが生じる。単純支持ばりは一端を回転自由の支点、他端を回転と水平移動が自由な支点で支えたはり。両端を固定したものは両端固定ばり。","https://d-engineer.com/zairiki/mage.html","材料の曲げに対する強さ（MONOWEB）",["①と②が逆になっている。一端固定・他端自由が片持ちばりで、回転自由と移動自由の支点で支えるのが単純支持ばりである。","固定ばりは両端を固定したはり、連続ばりは3つ以上の支点で支えたはりで、どちらも①②の支え方に当てはまらない。","②の両端固定ばりは両端とも回転も移動も拘束したはりで、両端回転自由で一端が水平移動できる支え方ではない。"],"https://www.youtube.com/watch?v=L-CNSnnSFG4","せん断力図(SFD)と曲げモーメント図(BMD)の描き方","",["x:mech1_68","はりの種類（片持ちばりと単純支持ばり）"]],["空気、水、グリセリンは何という流体か？","ニュートン流体","非ニュートン流体","理想流体","圧縮性流体","ニュートン流体は、せん断応力がせん断速度（速度勾配）に比例し、粘度が一定の流体。水・空気・グリセリン・一般の油などが該当する。流体力学の多くの式はニュートン流体を前提にしている。","https://d-engineer.com/fluid/nensei.html","粘性流体と非粘性流体（MONOWEB）",["非ニュートン流体は血液や高分子溶液のように、せん断速度で粘度が変わる流体で、粘度一定の水や空気は該当しない。","理想流体は粘性がなく圧縮もされない仮想の流体で、実際に粘性を持つ空気や水、グリセリンの分類名ではない。","圧縮性流体は圧力で密度が大きく変わる流体の扱いで、水やグリセリンは通常ほぼ非圧縮として扱われる。"],"https://www.youtube.com/watch?v=qOcPH84ZxyU","【流体力学】非ニュートン流体って何？",""],["高分子の流体や血液は何という流体か？","非ニュートン流体","ニュートン流体","理想流体","完全流体","非ニュートン流体は、せん断速度によって粘度が変わる流体。血液、高分子溶液、マヨネーズ、塗料などが例。かき混ぜると粘度が下がるもの（チキソトロピー）や、力を加えるほど硬くなるもの（ダイラタンシー）がある。","https://d-engineer.com/fluid/nensei.html","粘性流体と非粘性流体（MONOWEB）",["ニュートン流体はせん断応力がせん断速度に比例し粘度が一定の流体で、水や空気が該当し血液は含まれない。","理想流体は粘性も圧縮性もない仮想の流体で、粘度が変化する高分子流体や血液とは正反対の概念である。","完全流体は理想流体の別名で、粘性を持たない仮想の流体であり、粘度が変化する血液などは該当しない。"],"https://www.youtube.com/watch?v=qOcPH84ZxyU","【流体力学】非ニュートン流体って何？","",["w:080_0","ニュートン流体と非ニュートン流体の流動曲線",{"a":"Dhollm","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Viscous_regimes_chart.png"}]],["浮力は何という原理で説明できるか？","アルキメデスの原理","パスカルの原理","ベルヌーイの定理","トリチェリの定理","アルキメデスの原理は「流体中の物体は、押しのけた流体の重さに等しい浮力を受ける」というもの。浮力＝流体の密度×重力加速度×物体が押しのけた体積。船が浮くのも、比重計が液体ごとに沈み方を変えるのもこの原理。","https://d-engineer.com/fluid/arukimedesu.html","アルキメデスの原理（浮力）（MONOWEB）",["パスカルの原理は密閉容器内の流体に加えた圧力が全方向に等しく伝わることを示し、水圧機などの説明に使う。","ベルヌーイの定理は流線に沿ってエネルギーの総和が一定になることを示す流れの法則で、静止流体の浮力の説明ではない。","トリチェリの定理は容器の小穴から流出する流速がv=√(2gh)になることを示すもので、浮力とは関係ない。"],"https://www.youtube.com/watch?v=Bgk_ZGFWYzg","アルキメデスの原理 わかりやすい浮力の説明",""],["傾いた浮揚体の浮力の作用線と、傾く前の重心と浮心を通る軸との交点を何というか？","メタセンター","浮心","重心","圧力中心","メタセンター（傾心）は、浮体が少し傾いたときの浮力の作用線と、元の中心線との交点。メタセンターが重心より上にあれば元に戻ろうとする復原モーメントが働いて安定し、下にあれば転覆する。重心からの高さをメタセンター高さという。","https://d-engineer.com/fluid/arukimedesu.html","アルキメデスの原理（浮力）（MONOWEB）",["浮心は物体が押しのけた流体部分の重心で浮力の作用点であり、作用線と中心軸の交点ではない。","重心は物体の重力の作用点で、傾いたときの浮力の作用線との交点とは別の点である。","圧力中心は平面に働く静水圧の合力の作用点で、浮体の安定性を判断する交点とは異なる。"],"https://www.youtube.com/watch?v=Bgk_ZGFWYzg","アルキメデスの原理 わかりやすい浮力の説明","",["x:mech1_72","浮揚体の安定性とメタセンターM"]],["非粘性で非圧縮の近似が成り立つ流体を何というか？","理想流体","ニュートン流体","実在流体","粘性流体","理想流体（完全流体）は、粘性がなく、圧縮もされない仮想の流体。摩擦損失を無視できるので、ベルヌーイの定理などの基本式をシンプルに導ける。実在流体の解析では、粘性による損失を後から補正して扱う。","https://d-engineer.com/fluid/nensei.html","粘性流体と非粘性流体（MONOWEB）",["ニュートン流体は粘度が一定の粘性流体で、粘性を無視した理想化とは異なる。","実在流体は実際に粘性や圧縮性を持つ流体で、非粘性・非圧縮という近似とは逆の扱いである。","粘性流体は粘性による摩擦を考慮する流体で、非粘性の近似が成り立つ流体とは逆である。"],"https://www.youtube.com/watch?v=qOcPH84ZxyU","【流体力学】非ニュートン流体って何？",""],["1つの流線に沿って、運動・圧力・位置エネルギーの総和が保たれることを示す定理は？","ベルヌーイの定理","連続の式","運動量保存則","パスカルの原理","ベルヌーイの定理は、理想流体の定常流で、1本の流線上では「運動エネルギー＋圧力エネルギー＋位置エネルギー＝一定」となることを示す。流速が速いところほど圧力が低くなる。ピトー管、ベンチュリ管、飛行機の揚力の説明などに使われる。","https://d-engineer.com/fluid/bernoulli.html","ベルヌーイの定理（MONOWEB）",["連続の式は流管の各断面で流量が等しい（A1v1=A2v2）という質量保存の式で、エネルギーの総和は扱わない。","運動量保存則は流体が物体に及ぼす力などを求める法則で、流線上のエネルギー和の保存を示すものではない。","パスカルの原理は静止流体に加えた圧力が全方向に等しく伝わることを示し、流れのエネルギーとは関係ない。"],"https://www.youtube.com/watch?v=9eeIRMPvKPA","ベルヌーイの定理とは？わかりやすく解説！","",["x:mech1_74","ベルヌーイの定理（流線に沿ったエネルギー保存）"]],["ベルヌーイの定理の各項（長さの次元で表したもの）は何と呼ばれるか？","ヘッド","ポテンシャル","レイノルズ数","動圧","ベルヌーイの定理を長さの次元（m）で表したとき、各項を速度ヘッド（v²/2g）、圧力ヘッド（p/ρg）、位置ヘッド（z）と呼び、その合計を全ヘッドという。ポンプの性能（揚程）もヘッドで表す。","https://d-engineer.com/fluid/bernoulli.html","ベルヌーイの定理（MONOWEB）",["ポテンシャルは位置エネルギーや速度ポテンシャルなどを指す言葉で、ベルヌーイの各項を長さで表した呼び名ではない。","レイノルズ数は慣性力と粘性力の比を表す無次元数で、長さの次元を持つベルヌーイの各項とは異なる。","動圧はρv²/2で表される圧力の次元の量で、長さの次元で表した速度ヘッドとは単位が違う。"],"https://www.youtube.com/watch?v=9eeIRMPvKPA","ベルヌーイの定理とは？わかりやすく解説！",""],["流速が遅いとき、着色液が水平に長く伸び、水が層をなして流れる状態を何というか？","層流","乱流","遷移流","渦流","層流は、流体の粒子が層をなして規則正しく流れる状態で、流速が遅い（レイノルズ数が小さい）ときに現れる。レイノルズの実験で着色液がまっすぐ一本の線になるのが層流。円管ではおよそRe＜2300が目安。","https://d-engineer.com/fluid/reynolds.html","レイノルズ数（MONOWEB）",["乱流は流速が速いとき流体が不規則に混ざり合う状態で、着色液はすぐに広がってしまう。","遷移流は層流から乱流へ移り変わる途中の不安定な状態で、着色液が乱れたり整ったりする。","渦流は渦を巻く流れの総称で、着色液が層をなしてまっすぐ伸びる状態を表す言葉ではない。"],"https://www.youtube.com/watch?v=WCRux5LHNy8","【大学物理】レイノルズ数とは何か","",["x:mech1_76","レイノルズの実験（層流と乱流）"]],["流速が速いとき、着色液が注入部の下流で広がり流れが乱れる状態を何というか？","乱流","層流","定常流","ポテンシャル流","乱流は、流体が不規則に混ざり合いながら流れる状態で、流速が速い（レイノルズ数が大きい）ときに現れる。着色液がすぐに広がって混ざるのが乱流。層流と比べて摩擦損失は大きいが、熱や物質の混合はよくなる。","https://d-engineer.com/fluid/reynolds.html","レイノルズ数（MONOWEB）",["層流は流速が遅いとき流体が層をなして規則正しく流れる状態で、着色液は一本の線になる。","定常流は各点の流速や圧力が時間的に変化しない流れのことで、乱れの有無を表す言葉ではない。","ポテンシャル流は渦なしの理想化された流れで、着色液が乱れて広がる実際の流れの状態ではない。"],"https://www.youtube.com/watch?v=WCRux5LHNy8","【大学物理】レイノルズ数とは何か","",["w:098_0","レイノルズの実験（上：層流、中・下：乱流）",{"a":"Osborne Reynolds","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Reynolds_observations_turbulence_1883.svg"}]],["Re = ud/ν の無次元量Reを何というか？","レイノルズ数","マッハ数","フルード数","ヌセルト数","レイノルズ数Re＝ud/ν（u：流速、d：管径、ν：動粘度）は、慣性力と粘性力の比を表す無次元数。層流か乱流かの判定に使い、円管ではおよそ2300が臨界値。マッハ数は圧縮性、フルード数は重力の影響を表す無次元数。","https://d-engineer.com/fluid/reynolds.html","レイノルズ数（MONOWEB）",["マッハ数は流速と音速の比で、流体の圧縮性の影響を判断する無次元数である。","フルード数は慣性力と重力の比を表す無次元数で、開水路や船の造波抵抗の解析に使われる。","ヌセルト数は対流熱伝達と熱伝導の比を表す無次元数で、熱伝達率の整理に使われる。"],"https://www.youtube.com/watch?v=WCRux5LHNy8","【大学物理】レイノルズ数とは何か",""],["等温膨張、断熱膨張、等温圧縮、断熱圧縮を繰り返すサイクルを何というか？","カルノーサイクル","オットーサイクル","ディーゼルサイクル","ランキンサイクル","カルノーサイクルは等温膨張→断熱膨張→等温圧縮→断熱圧縮の4過程からなる可逆サイクル。同じ温度の熱源の間で働く熱機関の中で、最も高い熱効率を与える理論上の基準になる。","https://d-engineer.com/netsuriki/kcycle.html","カルノーサイクルとは（MONOWEB）",["オットーサイクルは断熱圧縮・等積加熱・断熱膨張・等積放熱からなるガソリン機関の理論サイクルで、等温過程は含まない。","ディーゼルサイクルは断熱圧縮・等圧加熱・断熱膨張・等積放熱からなるサイクルで、等温過程は含まない。","ランキンサイクルは蒸気の加熱・タービン膨張・復水・ポンプ加圧からなる蒸気原動機のサイクルである。"],"https://www.youtube.com/watch?v=3xlKqYOcTts","カルノーサイクルが絶対にわかる動画","",["w:021_0","カルノーサイクルのp-V線図（2本の等温線と断熱線）",{"a":"Cristian Quinzacara","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Carnot_cycle_pV_diagram.svg"}]],["熱量 ÷ 絶対温度 で表される量を何というか？","エントロピ","エンタルピ","内部エネルギー","比熱","エントロピSは、可逆変化で系が受け取る熱量を絶対温度で割った量（dS＝dQ/T）を積み重ねたもの。乱雑さの度合いを表し、自然な変化では増大する。単位はJ/K。","https://d-engineer.com/netsuriki/netudaini.html","熱力学第二法則（MONOWEB）",["エンタルピは内部エネルギーに圧力と体積の積を加えた量で、単位はJであり温度で割った量ではない。","内部エネルギーは物質内部の分子運動などが持つエネルギーの総和で、熱量を温度で割った量ではない。","比熱は単位質量の物質を1K上げるのに必要な熱量で、熱量を温度変化と質量で割った量であり、絶対温度で割るものではない。"],"https://www.youtube.com/watch?v=E1E23woCysY","ちょこっと物理【熱力学第2法則】",""],["PV（圧力×体積）と内部エネルギーの和をまとめて何というか？","エンタルピ","エントロピ","ギブズエネルギー","仕事","エンタルピHは、内部エネルギーUと圧力×体積（pV）の和（H＝U＋pV）。流れ込む流体が持ち込むエネルギーを扱いやすくした量で、ボイラ・タービン・冷凍機など流れのある機器の計算で多用される。","https://d-engineer.com/netsuriki/netudaini.html","熱力学第二法則（MONOWEB）",["エントロピは可逆変化で受け取る熱量を絶対温度で割った量で、内部エネルギーとpVの和ではない。","ギブズエネルギーはエンタルピから温度とエントロピの積を引いた量（G=H−TS）で、化学平衡の判断に使われる。","仕事は力と移動距離の積などで表されるエネルギーの移動量で、状態量であるU+pVの和とは異なる。"],"https://www.youtube.com/watch?v=E1E23woCysY","ちょこっと物理【熱力学第2法則】",""],["変位が正弦波状に滑らかに変化する振動を何というか？","調和振動","減衰振動","強制振動","自励振動","調和振動（単振動）は、変位がx＝A sin ωtのように正弦波状に変化する振動。ばね-質量系を減衰なしで自由に振動させると調和振動になる。すべての周期振動は、調和振動の重ね合わせで表せる（フーリエ級数）。","https://d-engineer.com/Mechanics/frequency.html","固有振動数、共振、危険速度について（MONOWEB）",["減衰振動は摩擦や粘性によって振幅が時間とともに小さくなる振動で、一定振幅の正弦波にはならない。","強制振動は外部から周期的な力を受けて起こる振動で、正弦波状の変化そのものを指す名称ではない。","自励振動は外部の周期的な力がなくても系内部の作用で振幅が成長する振動で、正弦波状の変化を定義する言葉ではない。"],"https://www.youtube.com/watch?v=9Lys3Wnm5AA","強制振動－減衰有りver. 共振を抑える方法","",["x:mech1_82","調和振動の正弦波形"]],["運動方程式 m x'' + c x' + kx = 0 の c を何というか？","粘性減衰係数","ばね定数","固有振動数","減衰比","運動方程式m x'' + c x' + kx = 0で、mは質量、cは速度に比例する減衰力の係数（粘性減衰係数）、kはばね定数。cが大きいほど振動は早く収まる。減衰比ζ＝c/(2√(mk))が1のとき臨界減衰となる。","https://d-engineer.com/Mechanics/frequency.html","固有振動数、共振、危険速度について（MONOWEB）",["ばね定数は運動方程式のkで、変位に比例する復元力の係数である。","固有振動数はばね定数と質量で決まる系の振動数（√(k/m)）で、方程式中の係数cそのものではない。","減衰比はζ=c/(2√(mk))で表される無次元量で、cを臨界減衰係数で割ったものでありc自体ではない。"],"https://www.youtube.com/watch?v=9Lys3Wnm5AA","強制振動－減衰有りver. 共振を抑える方法","",["x:mech1_83","質量・ばね・ダンパ系（cが粘性減衰係数）"]],["主系に減衰のない補助系を付けて振動を打ち消す防振法がある。この補助系を何というか？","ダイナミックダンパ","オイルダンパ","防振ゴム","スナバ","ダイナミックダンパ（動吸振器）は、主系に小さな補助質量とばねを取り付け、その固有振動数を主系の加振振動数に合わせることで、補助系が逆位相に揺れて主系の振動を打ち消す装置。高層ビルの制振装置などにも使われる。","https://d-engineer.com/Mechanics/frequency.html","固有振動数、共振、危険速度について（MONOWEB）",["オイルダンパは油の粘性抵抗で振動エネルギーを吸収する減衰器で、補助質量を逆位相に揺らす補助系ではない。","防振ゴムは機械と基礎の間に入れて振動の伝達を減らす弾性支持材で、主系に付ける補助振動系ではない。","スナバは配管などの急激な動きだけを拘束する緩衝器で、補助質量で振動を打ち消す装置ではない。"],"https://www.youtube.com/watch?v=9Lys3Wnm5AA","強制振動－減衰有りver. 共振を抑える方法","",["x:mech1_84","ダイナミックダンパによる防振"]],["酸化物セラミックスで、①耐熱性に優れ化学的に安定、②高じん性、③高温で高強度、の材料は？","①アルミナ ②ジルコニア ③ムライト","①ジルコニア ②アルミナ ③ムライト","①ムライト ②ジルコニア ③アルミナ","①アルミナ ②ムライト ③ジルコニア","アルミナ（Al₂O₃）は耐熱性・絶縁性に優れ化学的に安定で最も広く使われる。ジルコニア（ZrO₂）は相変態でき裂の進展を抑えるため、セラミックスの中でじん性が高い。ムライト（3Al₂O₃・2SiO₂）は高温での強度や熱衝撃への強さに優れる。","https://d-engineer.com/metal/sera.html","セラミックス（MONOWEB）",["①と②が逆である。化学的に安定で耐熱性に優れるのがアルミナ、相変態でき裂を抑え高じん性なのがジルコニアである。","①と③が逆である。最も広く使われ化学的に安定なのがアルミナ、高温強度に優れるのがムライトである。","②と③が逆である。高じん性なのはジルコニア、高温で高強度なのはムライトである。"],"https://www.kyocera.co.jp/prdct/fc/movie/index.html","ファインセラミックスの特性比較動画ほか 動画一覧（京セラ）",""],["流体とはどんなものをいうか？","静止状態でせん断力が発生しない連続体","圧力が発生しない連続体","密度が一定の物質","粘性をもたない物質","流体は「静止状態でせん断力が発生しない連続体」。わずかなせん断力でも変形し続けて流れるのが固体との違い。液体と気体の両方が含まれ、圧縮性が小さいものを液体、大きいものを気体として扱う。","https://d-engineer.com/fluid/nensei.html","粘性流体と非粘性流体（MONOWEB）",["流体は静止状態でも圧力が働くので、圧力が発生しないという定義は誤りである。","密度が一定なのは非圧縮性流体の近似で、気体のように密度が変わる流体も多く、流体の定義ではない。","粘性をもたないのは理想流体の仮定で、実在の流体は粘性を持つため流体の定義にはならない。"],"https://www.youtube.com/watch?v=qOcPH84ZxyU","【流体力学】非ニュートン流体って何？",""],["射出成形で、溶融樹脂が合流して溶着した部分にできる細い線を何というか？","ウエルドライン","ヒケ","バリ","ショートショット","ウエルドラインは、射出成形で金型内を分かれて流れた溶融樹脂が再び合流した部分にできる細い線。合流部は融着が不十分になりやすく、外観不良や強度低下の原因になる。ゲート位置の変更や樹脂温度・射出速度の調整で対策する。","https://www.keyence.co.jp/ss/products/sensor/plastic-molding/about/summary.jsp","樹脂成形の概要と主な成形法（キーエンス）",["ヒケは肉厚部などで樹脂が冷却収縮して表面がへこむ不良で、合流部の線ではない。","バリは金型のすき間に樹脂がはみ出して薄い膜状に固まった不良で、樹脂の合流でできる線ではない。","ショートショットは樹脂が金型の末端まで充填されず形状が欠ける不良で、合流部の線とは異なる。"],"https://www.youtube.com/watch?v=-WVVNZbvUHg","射出成形金型の基礎をわかりやすく解説！",""],["ばねに力Fを加えるとx伸び、力を2倍にすれば伸びも2倍になる。F = kx で表すこの法則は？","フックの法則","パスカルの原理","ニュートンの第2法則","フーリエの法則","フックの法則は、弾性範囲では力と変形が比例する（F＝kx）という法則。kはばね定数で、材料では応力とひずみの関係σ＝Eεとして表される。比例限度を超えると成り立たなくなる。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/power/stress-strain.jsp","応力とひずみの関係（キーエンス）",["パスカルの原理は密閉容器内の流体に加えた圧力が全方向に等しく伝わることを示し、ばねの伸びとは関係ない。","ニュートンの第2法則は物体の加速度が力に比例し質量に反比例する（F=ma）運動の法則で、変形との比例関係ではない。","フーリエの法則は熱伝導による伝熱量が温度勾配に比例することを示す法則で、力と伸びの関係ではない。"],"https://www.youtube.com/watch?v=5XbVCbbz7bw","【材料力学】2. 材料の応力-ひずみ線図","",["w:050_1","ばねの伸びは荷重に比例（荷重2倍で伸び2x）",{"a":"Svjo","l":"CC BY-SA 3.0","u":"https://commons.wikimedia.org/wiki/File:Hookes-law-springs.png"}]],["液体に浮かべ、沈み具合の目盛から液体の比重を読み取る計器は？","比重計","液面計","粘度計","マノメータ","比重計（浮ひょう）は液体に浮かべ、沈む深さに付けた目盛から液体の比重を読み取る。アルキメデスの原理により、比重の大きい液体ほど浮力が大きく浅くしか沈まない。バッテリー液や牛乳の検査などに使う。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0088.html","圧力計の種類と特長（ミスミ技術情報）",["液面計はタンク内の液面の高さを測る計器で、液体の比重を読み取るものではない。","粘度計は液体の流れにくさ（粘度）を測る計器で、浮かべて沈み具合から比重を読むものではない。","マノメータは液柱の高さの差で圧力を測る計器で、液体の比重を直接読み取るものではない。"],"https://www.youtube.com/watch?v=Rmn_iw6YjU8","流体力学 高校物理の復習 圧力、水圧、浮力","",["w:052_1","液体に浮かべた比重計の目盛を読む様子",{"a":"SG0039","l":"CC0","u":"https://commons.wikimedia.org/wiki/File:Taking_Hydrometer_Reading.png"}]],["理想流体のある流管において、流速と断面積の関係はどうなるか？","反比例する","比例する","2乗に比例する","無関係","連続の式（流量Q＝A₁v₁＝A₂v₂）により、非圧縮の流体では断面積と流速は反比例する。ホースの先をつまむと水が勢いよく出るのがこの関係。断面積が半分になれば流速は2倍になる。","https://d-engineer.com/fluid/bernoulli.html","ベルヌーイの定理（MONOWEB）",["比例するとすると断面積が大きいほど速くなるが、連続の式A1v1=A2v2より断面積が大きいほど流速は遅くなる。","2乗に比例する関係は連続の式から導かれず、流量一定なら流速は断面積に反比例する。","流量が一定の流管では断面積と流速の積が一定になるため、両者は無関係ではない。"],"https://www.youtube.com/watch?v=9eeIRMPvKPA","ベルヌーイの定理とは？わかりやすく解説！","",["x:mech1_90","流管の流れ（連続の式：流速と断面積は反比例）"]],["層流における管摩擦係数λは、レイノルズ数Reを用いるとどう表されるか？","λ = 64/Re","λ = Re/64","λ = 0.3164/Re^0.25","λ = 16/Re","円管内の層流では、管摩擦係数λ＝64/Reとなる（ハーゲン・ポアズイユ流れから導かれる）。乱流ではλは管の粗さとReで決まり、滑らかな管では0.3164/Re^0.25（ブラジウスの式）などで求める。","https://d-engineer.com/fluid/reynolds.html","レイノルズ数（MONOWEB）",["Re/64は64/Reの逆数で、レイノルズ数が大きいほど摩擦係数が大きくなってしまい、層流の関係と合わない。","0.3164/Re^0.25はブラジウスの式で、滑らかな円管の乱流に用いる摩擦係数の式である。","16/Reはファニングの摩擦係数で表した層流の式で、管摩擦係数λ（ダルシー・ワイスバッハ）の4分の1にあたる。"],"https://www.youtube.com/watch?v=WCRux5LHNy8","【大学物理】レイノルズ数とは何か","",["w:078_3","ムーディ線図（左端の直線が層流域λ=64/Re）",{"a":"Original diagram: S Beck and R Collins, University of Sheffi","l":"CC BY-SA 4.0","u":"https://commons.wikimedia.org/wiki/File:Moody_EN.svg"}]],["系が外部から周期的な作用を受けながら行う振動を何というか？","強制振動","自由振動","自励振動","減衰振動","強制振動は、外部から周期的な力（加振力）を受け続けて起こる振動。外力の振動数が系の固有振動数に近づくと振幅が大きくなる共振が起こる。外力がなく初期のずれだけで振れるのは自由振動、外力なしに自分で振動を大きくするのは自励振動。","https://d-engineer.com/Mechanics/frequency.html","固有振動数、共振、危険速度について（MONOWEB）",["自由振動は外力がなく初期の変位や速度だけで生じる振動で、外部から周期的な作用を受け続けるものではない。","自励振動は周期的な外力がなくても系内部の作用で振動が成長する現象で、外部からの周期的加振によるものではない。","減衰振動は摩擦や粘性で振幅が小さくなっていく振動で、外部の周期的作用の有無を表す分類ではない。"],"https://www.youtube.com/watch?v=9Lys3Wnm5AA","強制振動－減衰有りver. 共振を抑える方法",""],["穴の最大径よりも軸の最小径が大きい状態を何というか？","しまりばめ","すきまばめ","中間ばめ","遊びばめ","しまりばめは、軸の最小径が穴の最大径より大きく、組み立てたとき必ず「しめしろ」ができるはめあい。圧入や焼ばめで組み立て、キーなしでもトルクを伝えられる。常にすき間ができるのがすきまばめ、どちらにもなりうるのが中間ばめ。","https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/basic/fit.jsp","はめあいとは？（キーエンス）",["すきまばめは穴の最小径が軸の最大径より大きく、常にすき間ができるはめあいで、しめしろは生じない。","中間ばめは寸法の組合せによってすき間にもしめしろにもなりうるはめあいで、常にしめしろができるものではない。","遊びばめはすきまばめの旧称で、常にすき間ができるはめあいを指し、軸が穴より大きい状態ではない。"],"https://www.youtube.com/watch?v=KNMOpy5aXtQ","サイズ公差とはめあい（機械図面の読み方）","",["x:mech1_93","はめあいの種類（すきま・中間・しまりばめ）"]],["はりの内側が圧縮・外側が引張のとき、中立面とはどのような面か？","中央部にある伸び縮みのない面","最も引張応力が大きい面","最も圧縮応力が大きい面","せん断応力がゼロの外表面","はりを曲げると、曲がりの内側は縮み（圧縮）、外側は伸びる（引張）。その間にある、伸びも縮みもしない面が中立面。曲げ応力は中立面でゼロ、表面で最大になるため、断面の中央部を減らしたI形鋼は軽くて曲げに強い。","https://d-engineer.com/zairiki/mage.html","材料の曲げに対する強さ（MONOWEB）",["最も引張応力が大きいのは曲がりの外側の表面で、中立面では曲げ応力はゼロになる。","最も圧縮応力が大きいのは曲がりの内側の表面で、伸び縮みのない中立面とは位置が異なる。","はりのせん断応力は一般に外表面でゼロになるが、中立面は伸び縮みのない断面中央の面のことで、外表面ではない。"],"https://www.youtube.com/watch?v=L-CNSnnSFG4","せん断力図(SFD)と曲げモーメント図(BMD)の描き方","",["x:mech1_94","曲げを受けるはりの変形と中立面N-N′"]],["可逆カルノーサイクルでは、高温源と低温源の温度で何が決まるか？","熱効率","エンタルピ","作動流体の量","圧力比","可逆カルノーサイクルの熱効率は η＝1−T_L/T_H（T_H：高温源、T_L：低温源の絶対温度）で、2つの熱源の温度だけで決まり、作動流体の種類によらない。温度差が大きいほど効率は高くなる。","https://d-engineer.com/netsuriki/kcycle.html","カルノーサイクルとは（MONOWEB）",["エンタルピは作動流体の状態量で、熱源の温度だけで決まるものではない。","作動流体の量は仕事や熱量の大きさには影響するが、熱源温度で決まるものではなく、効率にも影響しない。","圧力比はサイクル内の圧力の変化の割合で、作動流体や設計によって変わり、熱源の温度だけで決まる量ではない。"],"https://www.youtube.com/watch?v=3xlKqYOcTts","カルノーサイクルが絶対にわかる動画",""],["機械製図で円の中心線に用いる線は？","細い一点鎖線","太い実線","細い破線","細い二点鎖線","機械製図では、中心線・基準線・ピッチ線に「細い一点鎖線」を使う。外形線は太い実線、かくれ線は細い破線（または太い破線）、想像線は細い二点鎖線。線の種類と用途はセットで覚えておく。","https://d-engineer.com/seizu/seizusen.html","製図に用いる線（MONOWEB）",["太い実線は外形線（見える部分の輪郭）に用いる線で、中心線には使わない。","細い破線はかくれ線（見えない部分の形状）に用いる線で、中心線には使わない。","細い二点鎖線は想像線（隣接部分や可動範囲など）に用いる線で、中心線には使わない。"],"https://www.youtube.com/watch?v=JifqYyze3IE","【製図基礎講座】図面における『線』の使い分け","",["x:mech1_96","代表的な線の種類（中心線は一点鎖線）"]],["材料の剛性とは何か？","たわみにくさ","折れにくさ","粘り強さ","傷のつきにくさ","剛性は、力を受けたときの変形（たわみ・ねじれ）のしにくさ。材料のヤング率と、断面形状（断面二次モーメント）で決まる。強度（壊れにくさ）とは別の性質で、例えば鋼とアルミでは強度が同程度でも鋼の剛性は約3倍ある。","https://d-engineer.com/dictionary/gousei.html","剛性とは（MONOWEB）",["折れにくさは強度（破断に至る応力の大きさ）に関する性質で、変形のしにくさである剛性とは別である。","粘り強さはじん性で、破壊までにエネルギーを吸収する能力を表し、たわみにくさとは異なる。","傷のつきにくさは硬さの性質で、ヤング率と断面形状で決まる剛性とは別の指標である。"],"https://www.youtube.com/watch?v=IY1GCSfQuL8","様々な材料の応力ひずみ線図【MONOWEB】",""],["せん断応力の単位は？","N/m²（Pa）","N·m","N/m","J/m³","応力は「力÷面積」なので、単位はN/m²＝Pa（パスカル）。実務ではMPa（＝N/mm²）を使うことが多い。せん断応力も引張応力も単位は同じで、違うのは力が面に平行か垂直かだけ。","https://d-engineer.com/zairiki/sendan.html","せん断応力（設計者のための技術計算ツール）",["N·mは力と距離の積で、モーメント（トルク）や仕事の単位であり、力を面積で割った応力の単位ではない。","N/mは単位長さあたりの力で、分布荷重や表面張力、ばね定数の単位であり、応力の単位ではない。","J/m³は次元的にはN/m²と等しいが、ひずみエネルギー密度など単位体積あたりのエネルギーに使う表し方で、応力の単位としては用いない。"],"https://www.youtube.com/watch?v=OsipWPTZIl0","第21回 せん断応力【MONOWEB】",""],["寸法補助記号の SR は何を表すか？","球の半径","球の直径","半径","正方形の辺","寸法補助記号のSRは球の半径（Spherical Radius）。Sφは球の直径、Rは半径、φは直径、□は正方形の辺、Cは45°の面取り、tは板の厚さを表す。","https://d-engineer.com/seizu/seizusen.html","製図に用いる線（MONOWEB）",["球の直径はSφで表し、SRは球の半径を表す。","Rは平面図形の円弧の半径を表す記号で、球面の半径にはSを付けてSRとする。","正方形の辺は□の記号で表し、SRとは無関係である。"],"https://www.youtube.com/watch?v=JifqYyze3IE","【製図基礎講座】図面における『線』の使い分け","",["x:mech1_99","寸法補助記号の使用例（SR16＝球の半径16）"]],["ヤング率とは何を表すか？","縦弾性係数","横弾性係数","体積弾性係数","ポアソン比","ヤング率は縦弾性係数のことで、σ＝Eεの比例定数E。引張・圧縮に対する変形のしにくさを表す材料固有の値で、軟鋼で約206GPa、アルミで約70GPa。せん断に対する横弾性係数G、体積変化に対する体積弾性係数Kと区別する。","https://www.keyence.co.jp/ss/products/recorder/testing-machine/power/stress-strain.jsp","応力とひずみの関係（キーエンス）",["横弾性係数Gはせん断応力とせん断ひずみの比（τ=Gγ）で、ヤング率とは別の定数である。","体積弾性係数Kは圧力と体積ひずみの比で、全方向から圧縮されたときの体積変化のしにくさを表す。","ポアソン比は横ひずみと縦ひずみの比の絶対値で、応力とひずみの比であるヤング率とは異なる無次元量である。"],"https://www.youtube.com/watch?v=5XbVCbbz7bw","【材料力学】2. 材料の応力-ひずみ線図","",["w:111_1","応力-ひずみ線図（弾性域の傾きが縦弾性係数）",{"a":"Nicoguaro","l":"CC BY 4.0","u":"https://commons.wikimedia.org/wiki/File:Stress_strain_ductile.svg"}]]]},{"id":"mech2","title":"機械 1-3 設計・製図・2-1 加工・2-2 機械要素","cat":"機械","q":[["2つの動作間に一定の約束事を備えた機構や電子回路を設け、ヒューマンエラーを排除するシステムを何機構というか？","インターロッキング機構","フェイルセーフ機構","フールプルーフ機構","ラチェット機構","インターロック（インターロッキング機構）は、ある条件が満たされないと次の動作ができないよう、動作どうしに約束事（条件）を持たせる仕組み。例えば「安全扉が閉まっていないと機械が起動しない」など。ヒューマンエラーによる事故を防ぐ安全設計の基本。","https://www.fa.omron.co.jp/product/special/safetynavi/feature/safety_switch/guard_interlock/","ガードインターロックスイッチ（オムロン）",["フェイルセーフ機構は、故障が起きても安全側に動作させる仕組み。動作どうしに条件を持たせて順序を縛る機構ではない。","フールプルーフは、人が誤操作しても危険にならないようにする設計思想全体を指す。動作間の約束事を設ける具体的な機構の名称ではない。","ラチェット機構は、つめと歯車で回転を一方向だけに許す機構。工具やウインチに使われ、安全のための動作条件とは関係ない。"],"https://www.youtube.com/watch?v=o0qvQwIwVi8","安全装置の考え方 インターロックとは",""],["生産工場内の自動化をアルファベットでどう表すか？","FA","OA","CAD","PL","FAはFactory Automationの略で、生産工場の自動化のこと。NC工作機械、産業用ロボット、自動搬送装置、PLCなどを組み合わせて生産を自動化する。事務作業の自動化はOA（Office Automation）。","https://www.fa.omron.co.jp/product/special/library/robotics/factory-automation/","ファクトリーオートメーション（FA）とは？（オムロン）",["OAはOffice Automationの略で、事務作業の自動化を指す。生産工場の自動化ではない。","CADはComputer Aided Designの略で、コンピュータを使った設計支援のこと。工場の自動化そのものを表す語ではない。","PLはProduct Liability（製造物責任）の略。製品欠陥の賠償責任に関する用語で、自動化とは無関係。"],"https://www.youtube.com/watch?v=8vK23yArGWY","FA業界を完全解説",""],["ねじの山と山の間隔を何というか？","ピッチ","リード","ねじれ角","有効径","ピッチは、隣り合うねじ山の同じ位置どうしの軸方向の距離。メートル並目ねじではM10ならピッチ1.5mmのように、呼び径ごとに決まっている。1回転で進む距離（リード）とは区別する。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["リードは、ねじを1回転させたときに軸方向に進む距離。1条ねじではピッチと等しいが、山と山の間隔そのものの名称ではない。","ねじれ角は、ねじ山のつる巻線が軸線となす角度。長さではなく角度を表すので、山の間隔ではない。","有効径は、ねじ溝の幅とねじ山の幅が等しくなる仮想円筒の直径。径方向の寸法で、軸方向の間隔ではない。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編","",["x:mech2_3","おねじ・めねじの各部とピッチ"]],["ねじを1回転したときに軸方向に進む距離を何というか？","リード","ピッチ","ストローク","モジュール","リードは、ねじを1回転させたときに軸方向に進む距離。リード＝ピッチ×条数で、一般的な1条ねじではリードとピッチが等しい。多条ねじはリードが大きく、早く締め付けられる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["ピッチは、隣り合うねじ山の軸方向の間隔。多条ねじでは1回転で進む距離（リード）と一致しない。","ストロークは、ピストンやシリンダなどが往復運動する距離（行程）。ねじ1回転あたりの送り量を表す用語ではない。","モジュールは、歯車の歯の大きさを表す値（ピッチ円直径÷歯数）。ねじの送り量とは関係ない。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編","",["x:mech2_4","1条・2条・3条ねじとリード（ℓ）"]],["万力などに使われ、大きな力を伝達できるねじは？","角ねじ","三角ねじ","台形ねじ","管用ねじ","角ねじは、ねじ山の断面が四角形のねじ。ねじ山の面が軸に直角なので摩擦が小さく、大きな力を効率よく伝えられる。万力やジャッキ、プレスなどに使われるが、加工が難しいのが欠点。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["三角ねじは、締結用に最も一般的なねじ。摩擦が大きく緩みにくい反面、動力伝達の効率は低く、大きな力の伝達には向かない。","台形ねじは、加工しやすく強度も高いため、旋盤の親ねじなど送りねじに使われる。角ねじほど伝達効率は高くない。","管用ねじは、配管の接続に使うねじで、テーパねじは気密性を保てる。大きな力の伝達を目的としたねじではない。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編","",["x:mech2_5","三角ねじ・角ねじ・台形ねじの山の形"]],["角ねじより加工しやすく高精度で、工作機械の送りねじに使われるねじは？","台形ねじ","角ねじ","三角ねじ","丸ねじ","台形ねじは、ねじ山の断面が台形（メートル系で30°）のねじ。角ねじより加工しやすく、強度も高く、ナットの割りでがたを調整しやすい。旋盤の親ねじなど工作機械の送りねじに使われる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["角ねじは、伝達効率は高いが加工が難しく、高精度に仕上げにくい。角ねじより加工しやすいねじという条件に合わない。","三角ねじは締結用のねじ。摩擦が大きく送り効率が悪いため、工作機械の送りねじには使わない。","丸ねじは、ねじ山が丸い形のねじで、電球の口金やホースなど、ごみが入りやすい場所や薄板の成形品に使う。精密な送りには向かない。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編","",["x:mech2_5","三角ねじ・角ねじ・台形ねじの山の形"]],["ねじ山の巻き方向で、左ねじは何と表記されるか？","LH","RH","L","M","左ねじは反時計回りに回すと締まるねじで、LH（Left Hand）と表記する。回転方向によって緩みやすい場所（扇風機の羽根の固定、自転車の左ペダルなど）に使われる。通常の右ねじは表記を省略する（RH）。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/screw/structure.jsp","ねじの構造（キーエンス）",["RHはRight Hand（右ねじ）の表記。右ねじは一般的なので、通常は表記を省略する。","Lだけでは左ねじの正式な表記にならない。規格では左ねじをLHと書く。","Mはメートルねじを表す記号（例：M10）。ねじの種類を示すもので、巻き方向は表さない。"],"https://www.youtube.com/watch?v=jjI9_FCSVhc","機械要素 ねじの基礎編","",["w:072_0","右ねじ（Right-hand）と左ねじ（Left-hand）の比較",{"a":"Eugene Wycliffe Kerr","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:Screw_thread_handedness.png"}]],["2極間に生じるアーク熱によって溶接する方法を何というか？","アーク溶接","ガス溶接","抵抗溶接","レーザ溶接","アーク溶接は、電極と母材の間に発生させたアーク放電の高熱（数千℃以上）で金属を溶かして接合する方法。被覆アーク溶接、TIG溶接、MIG/MAG溶接などがある。ガスの燃焼熱を使うのはガス溶接、電気抵抗の発熱を使うのは抵抗溶接。","https://monoto.co.jp/allabout-arcwelding/","アーク溶接とは？溶接の原理と種類（monoto）",["ガス溶接は、アセチレンなどの可燃ガスと酸素の燃焼熱で母材を溶かす方法。アーク熱は使わない。","抵抗溶接は、母材に大電流を流し、接触部の電気抵抗による発熱と加圧で接合する方法。スポット溶接が代表例。","レーザ溶接は、集光したレーザ光のエネルギーで局部的に溶かす方法。電極間のアーク放電は使わない。"],"https://www.youtube.com/watch?v=3E84J0eRhRw","機械設計に必要な基礎知識「溶接」の種類と特徴","",["w:006_0","アーク溶接の作業（アーク熱で母材を溶融）",{"a":"William M. Plate Jr.","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:GMAW.welding.af.ncs.jpg"}]],["溶接部で、盛り上がった波状の余盛り部分を何というか？","ビード","開先","スラグ","スパッタ","ビードは、溶接棒やワイヤを動かしたあとに残る、波模様の盛り上がった溶接金属の部分。ビードの形や幅から溶接の品質を判断できる。スラグは表面を覆う溶けかす、スパッタは周りに飛び散った金属粒。","https://monoto.co.jp/allabout-arcwelding/","アーク溶接とは？溶接の原理と種類（monoto）",["開先は、溶接前に母材の突き合わせ部に設ける溝。溶接後の盛り上がった部分ではない。","スラグは、溶接中に被覆剤などから生じ、ビードの表面を覆う非金属の溶けかす。溶接金属の盛り上がりではない。","スパッタは、溶接中に周りへ飛び散った金属の粒。波状の余盛り部分ではない。"],"https://www.youtube.com/watch?v=3E84J0eRhRw","機械設計に必要な基礎知識「溶接」の種類と特徴","",["w:121_1","溶接ビード（波状の盛り上がり）の拡大写真",{"a":"No machine-readable author provided. Dr. Crash~commonswiki a","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:TIG_Weld_low_magnification.jpg"}]],["突合せ溶接で、2枚の板材の突き合わせ部分に設ける溝（空いた部分）を何というか？","開先","ビード","ルート面","のど厚","開先（グルーブ）は、溶接で溶け込みを十分にするため、母材の突き合わせ部に設ける溝。V形、X形、U形、レ形などの形がある。板が厚いほど開先が必要になる。","https://monoto.co.jp/allabout-arcwelding/","アーク溶接とは？溶接の原理と種類（monoto）",["ビードは、溶接後に残る波状に盛り上がった溶接金属。突き合わせ部に設ける溝ではない。","ルート面は、開先の底の部分に残す平らな面。溝そのものではなく、開先の一部を指す。","のど厚は、溶接部の強度計算に使う溶接金属の厚さ。溝ではなく寸法を表す用語。"],"https://www.youtube.com/watch?v=3E84J0eRhRw","機械設計に必要な基礎知識「溶接」の種類と特徴","",["x:mech2_10","被覆アーク溶接と開先の形状"]],["圧力容器や建築物などで、鋼板や形鋼を重ねて半永久的に締結する機械要素は？","リベット","ボルト","キー","ピン","リベットは、穴に通した頭付きの鋲の先端をつぶして締結する機械要素。一度締結すると外せない永久締結で、橋梁、圧力容器、航空機の外板などに使われてきた。ボルトは分解できる締結要素。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0171.html","リベッター/ブラインドリベットの特長（ミスミ技術情報）",["ボルトはナットと組み合わせて締結する要素で、取り外して再び組み立てられる。半永久的な締結ではない。","キーは、軸とボスの間にはめ込んで回転トルクを伝える要素。板材どうしを重ねて締結するものではない。","ピンは、部品の位置決めや軽い荷重での連結に使う要素。鋼板を半永久的に締結する用途ではない。"],"https://www.youtube.com/watch?v=OdGFzq61eyQ","ハンドリベッターの使い方、打ち方と外し方","",["w:099_0","鋼材を重ねてリベットで締結した橋の継手",{"a":"不明","l":"Public domain","u":"https://commons.wikimedia.org/wiki/File:DETAIL,_L0_JOINT_AND_BEARING_SEAT_AT_WEST_ABUTMENT,_FROM_NORTH,_SHOWING_RIVETED_CONNECTION_OF_BOTTOM_CHORD_AND_END_POST_AT_JOINT,_AND_FIXED_SHOE_-_Glendale_Road_Bridge,_Spanning_HAER_MD,12-MHEN.V,1-18.tif"}]],["板材の組付け部の縁をポンチのような工具で叩いてかしめ、気密を保つことを何というか？","コーキング","フラーリング","リベッティング","ピーニング","コーキングは、リベット継手の板の縁をたがねのような工具で叩いて密着させ、気密・水密を保つ作業。ボイラや圧力容器のリベット継手で行う。建築でいうすき間を埋めるシーリングとは別の意味。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0171.html","リベッター/ブラインドリベットの特長（ミスミ技術情報）",["フラーリングは、コーキングより気密性を高めたいときに、板厚と同じ幅の工具で板端全体を打ち付ける作業。縁を部分的にかしめる作業ではない。","リベッティングは、リベットの先端をつぶして頭を作り、板材を締結する作業そのもの。気密のための縁のかしめではない。","ピーニングは、ハンマや鋼球で表面を叩き、圧縮残留応力を与えて疲労強度を上げる処理。気密を保つ作業ではない。"],"https://www.youtube.com/watch?v=OdGFzq61eyQ","ハンドリベッターの使い方、打ち方と外し方","",["x:mech2_12","リベット締め・コーキング・フラーリング"]],["コーキングよりも気密性を高めたいときに行う作業は？","フラーリング","ピーニング","シーリング","ローレット","フラーリングは、コーキングより気密性を高めたいときに行う作業で、板の厚さと同じ幅の工具で板端全体を打ち付けて密着させる。コーキングが縁を部分的にかしめるのに対し、より広い面で密着させる。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0171.html","リベッター/ブラインドリベットの特長（ミスミ技術情報）",["ピーニングは、表面を叩いて圧縮残留応力を与え、疲労強度を高める処理。気密性を高める作業ではない。","シーリングは、すき間をシール材で埋めて気密・水密を保つこと。板端を工具で打ち付けて密着させる作業ではない。","ローレットは、つまみなどの表面に滑り止めの細かい凹凸を付ける加工。気密とは関係ない。"],"https://www.youtube.com/watch?v=OdGFzq61eyQ","ハンドリベッターの使い方、打ち方と外し方","",["x:mech2_12","リベット締め・コーキング・フラーリング"]],["10mm以下の鋼リベットやアルミなどの軟材質リベットを常温で打つことを何というか？","冷間リベット","熱間リベット","ブラインドリベット","ポップリベット","冷間リベットは、加熱せずに常温で打つリベット。直径10mm程度以下の小径の鋼リベットや、アルミ・銅など軟らかい材質のリベットに使う。直径が大きい鋼リベットは、加熱して軟らかくしてから打つ熱間リベットになる。","https://jp.misumi-ec.com/tech-info/categories/technical_data/td06/x0171.html","リベッター/ブラインドリベットの特長（ミスミ技術情報）",["熱間リベットは、リベットを加熱して軟らかくしてから打つ方法。直径の大きい鋼リベットに使い、常温では打たない。","ブラインドリベットは、片側からだけ作業できる構造のリベット。打つ温度ではなく、施工方法による分類。","ポップリベットは、ブラインドリベットの一種の商品名に由来する呼び名。常温で打つかどうかを表す名称ではない。"],"https://www.youtube.com/watch?v=OdGFzq61eyQ","ハンドリベッターの使い方、打ち方と外し方",""],["機械設備の据付で、基準点に対して定められた位置・精度にセットすることを何というか？","芯出し（アライメント）","レベル出し","すり合わせ","バランシング","芯出し（アライメント）は、機械を据え付けるとき、基準に対して決められた位置と精度に合わせる作業。特にモータとポンプなど2本の軸の中心を一致させる作業を指すことが多い。芯ずれは振動、騒音、軸受の早期損傷の原因になる。","https://jp.misumi-ec.com/special/coupling/procedure/","カップリングの取り付け方法（ミスミ）",["レベル出しは、水準器などで機械の水平を出す作業。芯出しの一部ではあるが、基準に対する位置全体を合わせる作業の名称ではない。","すり合わせは、きさげなどで2つの面を削り合い、密着させる仕上げ作業。据付時の位置合わせではない。","バランシングは、回転体の質量の偏り（アンバランス）を修正して振動を減らす作業。位置を合わせる作業ではない。"],"https://www.youtube.com/watch?v=biHhRZ4-arE","【芯出し】芯が出てないとどうなる？機械据付のキホン",""],["機械を停止した常温状態で行う芯出し作業を何というか？","コールドアライメント","ホットアライメント","ダイナミックアライメント","レーザアライメント","コールドアライメントは、機械を停止した常温の状態で行う芯出し。据付時の基本作業で、ダイヤルゲージやレーザ式の測定器で軸の芯ずれを測って調整する。運転中に温度が上がると熱膨張で芯がずれるため、それを見込んで調整することもある。","https://jp.misumi-ec.com/special/coupling/procedure/","カップリングの取り付け方法（ミスミ）",["ホットアライメントは、運転時の熱膨張などを考慮して行う芯出し。停止した常温状態での芯出しとは逆の考え方。","ダイナミックアライメントは、運転中の状態を測って行う芯出しの考え方。停止した常温状態での作業ではない。","レーザアライメントは、レーザ式測定器を使う芯出しで、測定方法による呼び名。常温か運転時かを区別する名称ではない。"],"https://www.youtube.com/watch?v=biHhRZ4-arE","【芯出し】芯が出てないとどうなる？機械据付のキホン",""],["運転時の熱膨張などの状態を考慮して行う芯出しを何というか？","ホットアライメント","コールドアライメント","スタティックアライメント","ソフトフット","ホットアライメントは、運転時の熱膨張などで変化した状態を考慮して行う芯出し。高温で運転するポンプやタービンなどでは、停止時に芯を合わせても運転中にずれてしまうため、運転温度での位置を測ったり見込んだりして合わせる。","https://jp.misumi-ec.com/special/coupling/procedure/","カップリングの取り付け方法（ミスミ）",["コールドアライメントは、停止した常温状態で行う芯出し。運転時の熱膨張を考慮して行うものではない。","スタティックアライメントは、静止した状態での芯出しを指す。運転時の状態を考慮した芯出しではない。","ソフトフットは、機械の脚と台の間にすき間があり、ボルトを締めるとフレームがゆがむ不具合。芯出し方法の名称ではない。"],"https://www.youtube.com/watch?v=biHhRZ4-arE","【芯出し】芯が出てないとどうなる？機械据付のキホン",""],["歯車の歯形の2種類はどれか？","インボリュート、サイクロイド","インボリュート、トロコイド","サイクロイド、アルキメデス","台形、三角","歯車の歯形にはインボリュート歯形とサイクロイド歯形がある。インボリュート歯形は加工しやすく、中心距離が多少ずれても正しくかみ合うため、現在の動力伝達用歯車のほとんどがこれ。サイクロイド歯形は時計などに使われる。","https://www.keyence.co.jp/ss/products/measure-sys/machine-elements/gear/basic.jsp","歯車の基礎知識（キーエンス）",["トロコイドは、円が転がるときに円の内外の点が描く曲線で、ポンプのロータなどに使われる。歯車歯形の代表的な2種類には含まれない。","アルキメデス曲線（渦巻線）は、ウォームの歯形などに関係する曲線。歯車歯形の基本2種類の組み合わせではない。","台形
